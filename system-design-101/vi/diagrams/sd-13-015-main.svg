<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 901" width="320" height="901" role="img" aria-labelledby="title desc">
<title id="title">Chọn cách đưa bản mới lên: triển khai khác phát hành</title>
<desc id="desc">Bốn nhóm: cách triển khai gồm rolling, blue-green và canary; kiểm soát phát hành bằng cờ tính năng; thử với traffic thật mà người dùng không thấy bằng shadow; và hai kiểu quay lui khác nhau là rút lại phát hành và rút lại triển khai.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#475569" stroke-width="1.5"/></marker></defs>
<rect width="320" height="901" fill="#f8fafc"/><g font-family="DejaVu Sans, Arial, sans-serif" fill="#0f172a">
<text x="16" y="30" font-size="20" font-weight="bold">TRIỂN KHAI ≠ PHÁT</text>
<text x="16" y="58" font-size="20" font-weight="bold">HÀNH</text>
<text x="16" y="86" font-size="16" font-weight="normal">Hai việc, hai bộ công cụ</text>
<rect x="16" y="117" width="288" height="236" rx="10" fill="#dbeafe" stroke="#94a3b8"/>
<text x="30" y="145" font-size="16" font-weight="bold">Triển khai: mã đã lên</text>
<text x="30" y="172" font-size="16" font-weight="bold">máy chủ</text>
<text x="30" y="199" font-size="16" font-weight="normal">Rolling: thay dần từng nhóm</text>
<text x="30" y="226" font-size="16" font-weight="normal">máy</text>
<text x="30" y="253" font-size="16" font-weight="normal">Blue-green: dựng môi trường</text>
<text x="30" y="280" font-size="16" font-weight="normal">mới rồi chuyển traffic</text>
<text x="30" y="307" font-size="16" font-weight="normal">Canary: một phần nhỏ</text>
<text x="30" y="334" font-size="16" font-weight="normal">traffic vào bản mới trước</text>
<rect x="16" y="365" width="288" height="182" rx="10" fill="#dcfce7" stroke="#94a3b8"/>
<text x="30" y="393" font-size="16" font-weight="bold">Phát hành: người dùng</text>
<text x="30" y="420" font-size="16" font-weight="bold">có thấy không</text>
<text x="30" y="447" font-size="16" font-weight="normal">Cờ tính năng bật hoặc tắt</text>
<text x="30" y="474" font-size="16" font-weight="normal">hành vi đã gắn cờ</text>
<text x="30" y="501" font-size="16" font-weight="normal">Mở cho nhóm nội bộ trước</text>
<text x="30" y="528" font-size="16" font-weight="normal">rồi rộng dần</text>
<rect x="16" y="559" width="288" height="128" rx="10" fill="#ede9fe" stroke="#94a3b8"/>
<text x="30" y="587" font-size="16" font-weight="bold">Thử với traffic thật,</text>
<text x="30" y="614" font-size="16" font-weight="bold">không ai thấy</text>
<text x="30" y="641" font-size="16" font-weight="normal">Shadow: sao traffic tới bản</text>
<text x="30" y="668" font-size="16" font-weight="normal">mới, bỏ phản hồi của nó</text>
<rect x="16" y="699" width="288" height="182" rx="10" fill="#fee2e2" stroke="#94a3b8"/>
<text x="30" y="727" font-size="16" font-weight="bold">Quay lui có hai nghĩa</text>
<text x="30" y="754" font-size="16" font-weight="normal">Rút lại phát hành: chỉ rút</text>
<text x="30" y="781" font-size="16" font-weight="normal">phần được gắn cờ</text>
<text x="30" y="808" font-size="16" font-weight="normal">Rút lại triển khai: về bản</text>
<text x="30" y="835" font-size="16" font-weight="normal">trước (chuyển lại traffic</text>
<text x="30" y="862" font-size="16" font-weight="normal">hoặc triển khai bản cũ)</text>
</g></svg>
