<svg xmlns="http://www.w3.org/2000/svg" width="320" height="1018" viewBox="0 0 320 1018" role="img" aria-labelledby="title desc">
<title id="title">Thương lượng trước khi mã hóa</title>
<desc id="desc">Ba khung dọc. Khung một: client gửi danh sách phiên bản, bộ mã, nhóm khóa, chữ ký; máy chủ chọn mỗi loại một mục hoặc gửi cảnh báo rồi dừng. Khung hai: có điểm chung thì hai bên cùng tính ra khóa đối xứng, mỗi chiều một khóa, và HTTP đi qua bộ mã đã chọn; không có thì kết nối dừng. Khung ba: máy chủ chỉ chọn mục client đã đưa; thứ tự ưu tiên mặc định là của client; HTTP không đổi dù TLS 1.2 hay 1.3.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs>
<rect width="320" height="1018" fill="#f8fafc"/>
<g font-family="DejaVu Sans, Arial, sans-serif" fill="#0f172a">
<text x="16" y="34" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">Thương lượng trước khi</text>
<text x="16" y="58" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">mã hóa</text>
<text x="16" y="84.2" font-size="15" fill="#475569" font-weight="normal" text-anchor="start">Client đưa danh sách, máy chủ chọn</text>
<rect x="8" y="104" width="304" height="335" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="132.2" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Một lượt thương lượng</text>
<rect x="20" y="149" width="96" height="67" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="68" cy="171" r="14" fill="#1d4ed8"/><g transform="translate(59.6 162.6) scale(0.7)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect height="14" rx="2" width="20" x="2" y="3"/><line x1="8" x2="16" y1="21" y2="21"/><line x1="12" x2="12" y1="17" y2="21"/></g>
<text x="68" y="202.9" font-size="15" fill="#0f172a" font-weight="bold" text-anchor="middle">Client</text>
<rect x="204" y="149" width="96" height="67" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="252" cy="171" r="14" fill="#1d4ed8"/><g transform="translate(243.6 162.6) scale(0.7)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect height="8" rx="2" ry="2" width="20" x="2" y="2"/><rect height="8" rx="2" ry="2" width="20" x="2" y="14"/><line x1="6" x2="6.01" y1="6" y2="6"/><line x1="6" x2="6.01" y1="18" y2="18"/></g>
<text x="252" y="202.9" font-size="15" fill="#0f172a" font-weight="bold" text-anchor="middle">Máy chủ</text>
<polyline points="68,216 68,427" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4 4"/>
<polyline points="252,216 252,427" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4 4"/>
<text x="160" y="244.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="middle">Danh sách: phiên</text>
<text x="160" y="263.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="middle">bản, bộ mã, nhóm</text>
<text x="160" y="283.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="middle">khóa, chữ ký</text>
<polyline points="69,297 249,297" fill="none" stroke="#334155" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="160" y="325.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="middle">Chọn mỗi loại một</text>
<text x="160" y="344.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="middle">mục</text>
<polyline points="251,358 71,358" fill="none" stroke="#334155" stroke-width="1.8" stroke-dasharray="5 4" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="160" y="386.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="middle">Hoặc: cảnh báo rồi</text>
<text x="160" y="405.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="middle">dừng</text>
<polyline points="251,419 71,419" fill="none" stroke="#334155" stroke-width="1.8" stroke-dasharray="5 4" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="8" y="451" width="304" height="265" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="479.2" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Hai kết cục</text>
<rect x="20" y="496" width="280" height="107" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
<circle cx="50" cy="549.5" r="18" fill="#0f766e"/><g transform="translate(39.2 538.7) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m16 9-5.5 5.5L8 12"/></g>
<text x="78" y="522.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Có điểm chung</text>
<text x="78" y="546.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Mỗi chiều một khóa đối</text>
<text x="78" y="565.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">xứng; HTTP đi qua bộ mã</text>
<text x="78" y="585.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">đã chọn.</text>
<rect x="20" y="617" width="280" height="87" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
<circle cx="50" cy="660.5" r="18" fill="#0f766e"/><g transform="translate(39.2 649.7) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m15 9-6 6"/><path d="m9 9 6 6"/></g>
<text x="78" y="643.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Không có điểm chung</text>
<text x="78" y="667.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Máy chủ gửi cảnh báo, kết</text>
<text x="78" y="686.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">nối dừng.</text>
<rect x="8" y="728" width="304" height="282" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="756.1" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Cần nhớ</text>
<rect x="20" y="773" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="796" r="11" fill="#16a34a"/>
<polyline points="37.9,796.4 41.7,800.4 48.5,792" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="799.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Máy chủ chỉ chọn mục client</text>
<text x="64" y="818.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">đã đưa ra.</text>
<rect x="20" y="844" width="280" height="83" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="867" r="11" fill="#16a34a"/>
<polyline points="37.9,867.4 41.7,871.4 48.5,863" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="870.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Thứ tự ưu tiên mặc định là</text>
<text x="64" y="889.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">của client; máy chủ có thể</text>
<text x="64" y="909.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">đổi.</text>
<rect x="20" y="935" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="958" r="11" fill="#16a34a"/>
<polyline points="37.9,958.4 41.7,962.4 48.5,954" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="961.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">HTTP bên trên không đổi dù</text>
<text x="64" y="980.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">TLS 1.2 hay 1.3.</text>
</g>
</svg>
