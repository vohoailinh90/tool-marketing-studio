<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 598" width="320" height="598" role="img" aria-labelledby="title desc">
<title id="title">Docker chạy thế nào: client, host và registry</title>
<desc id="desc">Bốn lệnh và nơi chúng tác động: build gửi ngữ cảnh cho daemon, pull và push trao đổi image giữa daemon và registry, run tạo và khởi động container trên Docker host.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#475569" stroke-width="1.5"/></marker></defs>
<rect width="320" height="598" fill="#f8fafc"/><g font-family="DejaVu Sans, Arial, sans-serif" fill="#0f172a">
<text x="16" y="30" font-size="20" font-weight="bold">LỆNH NÀO ĐI TỚI ĐÂU</text>
<text x="16" y="58" font-size="16" font-weight="normal">Client gõ lệnh, daemon làm</text>
<text x="16" y="85" font-size="16" font-weight="normal">việc</text>
<rect x="16" y="116" width="288" height="155" rx="10" fill="#dbeafe" stroke="#94a3b8"/>
<text x="30" y="144" font-size="16" font-weight="bold">docker build</text>
<text x="30" y="171" font-size="16" font-weight="normal">Client gửi ngữ cảnh build</text>
<text x="30" y="198" font-size="16" font-weight="normal">cho daemon</text>
<text x="30" y="225" font-size="16" font-weight="normal">Daemon dựng image vào kho</text>
<text x="30" y="252" font-size="16" font-weight="normal">cục bộ</text>
<rect x="16" y="283" width="288" height="155" rx="10" fill="#fef3c7" stroke="#94a3b8"/>
<text x="30" y="311" font-size="16" font-weight="bold">docker pull / push</text>
<text x="30" y="338" font-size="16" font-weight="normal">Daemon trao đổi image với</text>
<text x="30" y="365" font-size="16" font-weight="normal">registry</text>
<text x="30" y="392" font-size="16" font-weight="normal">Cần quyền và mạng tới</text>
<text x="30" y="419" font-size="16" font-weight="normal">registry</text>
<rect x="16" y="450" width="288" height="128" rx="10" fill="#dcfce7" stroke="#94a3b8"/>
<text x="30" y="478" font-size="16" font-weight="bold">docker run</text>
<text x="30" y="505" font-size="16" font-weight="normal">Daemon tạo và khởi động</text>
<text x="30" y="532" font-size="16" font-weight="normal">container</text>
<text x="30" y="559" font-size="16" font-weight="normal">Kéo image trước nếu chưa có</text>
</g></svg>
