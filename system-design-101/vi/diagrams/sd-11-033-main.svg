<circle cx="50" cy="159" r="18" fill="#1d4ed8"/><g transform="translate(39.2 148.2) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect height="8" rx="2" ry="2" width="20" x="2" y="2"/><rect height="8" rx="2" ry="2" width="20" x="2" y="14"/><line x1="6" x2="6.01" y1="6" y2="6"/><line x1="6" x2="6.01" y1="18" y2="18"/></g>
<text x="78" y="151.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Máy chủ ảo</text>
<text x="78" y="175.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Dịch vụ cho thuê máy chủ.</text>
<rect x="20" y="207" width="280" height="68" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="50" cy="241" r="18" fill="#1d4ed8"/><g transform="translate(39.2 230.2) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 16h.01"/><path d="M2.212 11.577a2 2 0 0 0-.212.896V18a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-5.527a2 2 0 0 0-.212-.896L18.55 5.11A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/><path d="M21.946 12.013H2.054"/><path d="M6 16h.01"/></g>
<text x="78" y="233.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">S3</text>
<text x="78" y="257.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Lưu tệp, ảnh, bản sao lưu.</text>
<rect x="20" y="289" width="280" height="68" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="50" cy="323" r="18" fill="#1d4ed8"/><g transform="translate(39.2 312.2) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect height="6" rx="1" width="6" x="16" y="16"/><rect height="6" rx="1" width="6" x="2" y="16"/><rect height="6" rx="1" width="6" x="9" y="2"/><path d="M5 16v-3a1 1 0 0 1 1-1h12a1 1 0 0 1 1 1v3"/><path d="M12 12V8"/></g>
<text x="78" y="315.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">VPC</text>
<text x="78" y="339.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Mạng riêng của bạn.</text>
<rect x="20" y="371" width="280" height="68" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="50" cy="405" r="18" fill="#1d4ed8"/><g transform="translate(39.2 394.2) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.586 17.414A2 2 0 0 0 2 18.828V21a1 1 0 0 0 1 1h3a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h1a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h.172a2 2 0 0 0 1.414-.586l.814-.814a6.5 6.5 0 1 0-4-4z"/><circle cx="16.5" cy="7.5" fill="#FFFFFF" r=".5"/></g>
<text x="78" y="397.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">IAM</text>
<text x="78" y="421.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Ai được làm gì.</text>
<rect x="8" y="463" width="304" height="308" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="491.2" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Dữ liệu và nhắn tin</text>
<rect x="20" y="508" width="280" height="68" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
<circle cx="50" cy="542" r="18" fill="#0f766e"/><g transform="translate(39.2 531.2) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5V19A9 3 0 0 0 21 19V5"/><path d="M3 12A9 3 0 0 0 21 12"/></g>
<text x="78" y="534.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">RDS</text>
<text x="78" y="558.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Cơ sở dữ liệu quan hệ.</text>
<rect x="20" y="590" width="280" height="87" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
<circle cx="50" cy="633.5" r="18" fill="#0f766e"/><g transform="translate(39.2 622.7) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.97 12.92A2 2 0 0 0 2 14.63v3.24a2 2 0 0 0 .97 1.71l3 1.8a2 2 0 0 0 2.06 0L12 19v-5.5l-5-3-4.03 2.42Z"/><path d="m7 16.5-4.74-2.85"/><path d="m7 16.5 5-3"/><path d="M7 16.5v5.17"/><path d="M12 13.5V19l3.97 2.38a2 2 0 0 0 2.06 0l3-1.8a2 2 0 0 0 .97-1.71v-3.24a2 2 0 0 0-.97-1.71L17 10.5l-5 3Z"/><path d="m17 16.5-5-3"/><path d="m17 16.5 4.74-2.85"/><path d="M17 16.5v5.17"/><path d="M7.97 4.42A2 2 0 0 0 7 6.13v4.37l5 3 5-3V6.13a2 2 0 0 0-.97-1.71l-3-1.8a2 2 0 0 0-2.06 0l-3 1.8Z"/><path d="M12 8 7.26 5.15"/><path d="m12 8 4.74-2.85"/><path d="M12 13.5V8"/></g>
<text x="78" y="616.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">DynamoDB</text>
<text x="78" y="640.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Khóa và giá trị, mở rộng</text>
<text x="78" y="659.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">lớn.</text>
<rect x="20" y="691" width="280" height="68" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
<circle cx="50" cy="725" r="18" fill="#0f766e"/><g transform="translate(39.2 714.2) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.536 21.686a.5.5 0 0 0 .937-.024l6.5-19a.496.496 0 0 0-.635-.635l-19 6.5a.5.5 0 0 0-.024.937l7.93 3.18a2 2 0 0 1 1.112 1.11z"/><path d="m21.854 2.147-10.94 10.939"/></g>
<text x="78" y="717.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">SQS, SNS</text>
<text x="78" y="741.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Hàng đợi và thông báo.</text>
<rect x="8" y="783" width="304" height="375" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
