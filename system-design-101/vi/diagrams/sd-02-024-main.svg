<svg xmlns="http://www.w3.org/2000/svg" width="320" height="1143" viewBox="0 0 320 1143" role="img" aria-labelledby="title desc">
<title id="title">Shopify: mười nguyên tắc thanh toán bền</title>
<desc id="desc">Ba khung. Khi gọi dịch vụ khác: thời gian chờ thấp, đọc 5 giây và ghi 1 giây thay vì 60; cầu dao Semian; khóa chống trùng dùng mã sắp theo thời gian. Để nhìn thấy và chuẩn bị: tính sức chứa, theo dõi bốn tín hiệu vàng, nhật ký có cấu trúc, thử tải. Sau sự cố: lưu chênh lệch đối soát, kênh sự cố có ba vai trò, nhìn lại bằng ba câu hỏi.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs>
<rect width="320" height="1143" fill="#f8fafc"/>
<g font-family="DejaVu Sans, Arial, sans-serif" fill="#0f172a">
<text x="16" y="34" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">Shopify: mười nguyên</text>
<text x="16" y="58" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">tắc thanh toán bền</text>
<text x="16" y="84.2" font-size="15" fill="#475569" font-weight="normal" text-anchor="start">Xếp theo lúc chúng có tác dụng.</text>
<rect x="8" y="104" width="304" height="346" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="132.2" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Khi gọi dịch vụ khác</text>
<rect x="20" y="149" width="280" height="87" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="50" cy="192.5" r="18" fill="#1d4ed8"/><g transform="translate(39.2 181.7) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="10" x2="14" y1="2" y2="2"/><line x1="12" x2="15" y1="14" y2="11"/><circle cx="12" cy="14" r="8"/></g>
<text x="78" y="175.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Thời gian chờ thấp</text>
<text x="78" y="199.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Đọc 5 giây, ghi 1 giây,</text>
<text x="78" y="218.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">thay vì 60.</text>
<rect x="20" y="250" width="280" height="87" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="50" cy="293.5" r="18" fill="#1d4ed8"/><g transform="translate(39.2 282.7) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15.914 4a1.5 1.5 0 00-2.474-1.561l-9 9A1.5 1.5 0 005.5 14h4.002a.5.5 0 01.471.666L8.086 20a1.5 1.5 0 002.475 1.56l9-9A1.5 1.5 0 0018.5 10h-3.997a.5.5 0 01-.472-.667z"/></g>
<text x="78" y="276.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Cầu dao Semian</text>
<text x="78" y="300.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Chặn lời gọi tới dịch vụ</text>
<text x="78" y="319.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">đang hỏng.</text>
<rect x="20" y="351" width="280" height="87" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="50" cy="394.5" r="18" fill="#1d4ed8"/><g transform="translate(39.2 383.7) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.586 17.414A2 2 0 0 0 2 18.828V21a1 1 0 0 0 1 1h3a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h1a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h.172a2 2 0 0 0 1.414-.586l.814-.814a6.5 6.5 0 1 0-4-4z"/><circle cx="16.5" cy="7.5" fill="#FFFFFF" r=".5"/></g>
<text x="78" y="377.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Khóa chống trùng</text>
<text x="78" y="401.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Mã sắp theo thời gian,</text>
<text x="78" y="420.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">không ngẫu nhiên.</text>
<rect x="8" y="462" width="304" height="433" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="490.2" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Nhìn thấy và chuẩn bị</text>
<rect x="20" y="507" width="280" height="68" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
<circle cx="46" cy="533" r="14" fill="#0f766e"/>
<text x="46" y="538.5" font-size="16" fill="#ffffff" font-weight="bold" text-anchor="middle">1</text>
<text x="70" y="533.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Sức chứa</text>
<text x="70" y="557.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Tính thông lượng trước.</text>
<rect x="20" y="597" width="280" height="87" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
<circle cx="46" cy="623" r="14" fill="#0f766e"/>
<text x="46" y="628.5" font-size="16" fill="#ffffff" font-weight="bold" text-anchor="middle">2</text>
<text x="70" y="623.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Theo dõi</text>
<text x="70" y="647.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Độ trễ, lưu lượng, lỗi, bão</text>
<text x="70" y="666.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">hòa.</text>
<polyline points="46,577 46,595" fill="none" stroke="#334155" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="20" y="706" width="280" height="68" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
<circle cx="46" cy="732" r="14" fill="#0f766e"/>
<text x="46" y="737.5" font-size="16" fill="#ffffff" font-weight="bold" text-anchor="middle">3</text>
<text x="70" y="732.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Nhật ký</text>
<text x="70" y="756.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Có cấu trúc, lưu tập trung.</text>
<polyline points="46,686 46,704" fill="none" stroke="#334155" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="20" y="796" width="280" height="87" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
<circle cx="46" cy="822" r="14" fill="#0f766e"/>
<text x="46" y="827.5" font-size="16" fill="#ffffff" font-weight="bold" text-anchor="middle">4</text>
<text x="70" y="822.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Thử tải</text>
<text x="70" y="846.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Mô phỏng đợt bán chớp</text>
<text x="70" y="865.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">nhoáng.</text>
<polyline points="46,776 46,794" fill="none" stroke="#334155" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="8" y="907" width="304" height="228" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="935.1" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Sau sự cố</text>
<rect x="20" y="952" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="975" r="11" fill="#16a34a"/>
<polyline points="37.9,975.4 41.7,979.4 48.5,971" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="978.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Lưu chênh lệch đối soát vào</text>
<text x="64" y="997.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">cơ sở dữ liệu.</text>
<rect x="20" y="1023" width="280" height="46" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="1046" r="11" fill="#16a34a"/>
<polyline points="37.9,1046.4 41.7,1050.4 48.5,1042" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="1049.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Kênh sự cố có ba vai trò.</text>
<rect x="20" y="1077" width="280" height="46" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="1100" r="11" fill="#16a34a"/>
<polyline points="37.9,1100.4 41.7,1104.4 48.5,1096" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="1103.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Nhìn lại bằng ba câu hỏi.</text>
</g>
</svg>
