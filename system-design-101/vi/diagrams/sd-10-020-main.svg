<svg xmlns="http://www.w3.org/2000/svg" width="320" height="1484" viewBox="0 0 320 1484" role="img" aria-labelledby="title desc">
<title id="title">Tám mô hình lập trình</title>
<desc id="desc">Ba nhóm thẻ và một khung ghi nhớ. Cách mô tả chương trình: mệnh lệnh mô tả chuỗi bước đổi trạng thái; khai báo mô tả logic mà không nêu luồng điều khiển; hàm xem tính toán là tính giá trị hàm toán học. Cách tổ chức mã: hướng đối tượng xoay quanh đối tượng; hướng khía cạnh tách mối quan tâm cắt ngang; tổng quát viết mã không gắn với kiểu dữ liệu. Chạy nhiều việc và dữ liệu thay đổi: phản ứng xử lý luồng dữ liệu bất đồng bộ; đồng thời chạy nhiều tác vụ cùng lúc. Khung cuối nêu ba điều cần nhớ.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs>
<rect width="320" height="1484" fill="#f8fafc"/>
<g font-family="DejaVu Sans, Arial, sans-serif" fill="#0f172a">
<text x="16" y="34" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">Tám mô hình lập trình</text>
<text x="16" y="60.2" font-size="15" fill="#475569" font-weight="normal" text-anchor="start">Xếp theo việc mô hình lo, theo cách</text>
<text x="16" y="79.8" font-size="15" fill="#475569" font-weight="normal" text-anchor="start">bài sắp xếp.</text>
<rect x="8" y="99" width="304" height="386" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="127.2" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Cách mô tả chương trình</text>
<rect x="20" y="144" width="280" height="87" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="50" cy="187.5" r="18" fill="#1d4ed8"/><g transform="translate(39.2 176.7) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5h10"/><path d="M11 12h10"/><path d="M11 19h10"/><path d="M4 4h1v5"/><path d="M4 9h2"/><path d="M6.5 20H3.4c0-1 2.6-1.925 2.6-3.5a1.5 1.5 0 0 0-2.6-1.02"/></g>
<text x="78" y="170.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Mệnh lệnh</text>
<text x="78" y="194.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Mô tả chuỗi bước làm đổi</text>
<text x="78" y="213.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">trạng thái chương trình.</text>
<rect x="20" y="245" width="280" height="107" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="50" cy="298.5" r="18" fill="#1d4ed8"/><g transform="translate(39.2 287.7) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 22a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.704.706l3.588 3.588A2.4 2.4 0 0 1 20 8v12a2 2 0 0 1-2 2z"/><path d="M14 2v5a1 1 0 0 0 1 1h5"/><path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/></g>
<text x="78" y="271.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Khai báo</text>
<text x="78" y="295.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Nêu logic và chức năng,</text>
<text x="78" y="314.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">không nêu luồng điều</text>
<text x="78" y="334.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">khiển.</text>
<rect x="20" y="366" width="280" height="107" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="50" cy="419.5" r="18" fill="#1d4ed8"/><g transform="translate(39.2 408.7) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect height="8" rx="2" width="8" x="3" y="3"/><path d="M7 11v4a2 2 0 0 0 2 2h4"/><rect height="8" rx="2" width="8" x="13" y="13"/></g>
<text x="78" y="392.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Hàm (FP)</text>
<text x="78" y="416.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Tính toán là tính giá trị</text>
<text x="78" y="435.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">hàm toán học, ưu tiên dữ</text>
<text x="78" y="455.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">liệu bất biến.</text>
<rect x="8" y="497" width="304" height="406" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="525.1" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Cách tổ chức mã</text>
<rect x="20" y="542" width="280" height="107" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
<circle cx="50" cy="595.5" r="18" fill="#0f766e"/><g transform="translate(39.2 584.7) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></g>
<text x="78" y="568.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Hướng đối tượng</text>
<text x="78" y="588.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">(OOP)</text>
<text x="78" y="612.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Xoay quanh đối tượng gói</text>
<text x="78" y="631.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">dữ liệu và hành vi.</text>
<rect x="20" y="663" width="280" height="127" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
<circle cx="50" cy="726.5" r="18" fill="#0f766e"/><g transform="translate(39.2 715.7) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83z"/><path d="M2 12a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 12"/><path d="M2 17a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 17"/></g>
<text x="78" y="689.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Hướng khía cạnh</text>
<text x="78" y="709.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">(AOP)</text>
<text x="78" y="733.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Tách các mối quan tâm cắt</text>
<text x="78" y="752.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">ngang nhiều phần của hệ</text>
<text x="78" y="772.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">thống.</text>
<rect x="20" y="804" width="280" height="87" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
<circle cx="50" cy="847.5" r="18" fill="#0f766e"/><g transform="translate(39.2 836.7) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15.39 4.39a1 1 0 0 0 1.68-.474 2.5 2.5 0 1 1 3.014 3.015 1 1 0 0 0-.474 1.68l1.683 1.682a2.414 2.414 0 0 1 0 3.414L19.61 15.39a1 1 0 0 1-1.68-.474 2.5 2.5 0 1 0-3.014 3.015 1 1 0 0 1 .474 1.68l-1.683 1.682a2.414 2.414 0 0 1-3.414 0L8.61 19.61a1 1 0 0 0-1.68.474 2.5 2.5 0 1 1-3.014-3.015 1 1 0 0 0 .474-1.68l-1.683-1.682a2.414 2.414 0 0 1 0-3.414L4.39 8.61a1 1 0 0 1 1.68.474 2.5 2.5 0 1 0 3.014-3.015 1 1 0 0 1-.474-1.68l1.683-1.682a2.414 2.414 0 0 1 3.414 0z"/></g>
<text x="78" y="830.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Tổng quát</text>
<text x="78" y="854.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Viết mã dùng lại, không</text>
<text x="78" y="873.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">gắn với kiểu dữ liệu cụ thể.</text>
<rect x="8" y="915" width="304" height="267" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="943.1" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Nhiều việc và dữ liệu thay</text>
<text x="20" y="965.2" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">đổi</text>
<rect x="20" y="982" width="280" height="87" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
<circle cx="50" cy="1025.5" r="18" fill="#b45309"/><g transform="translate(39.2 1014.7) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16.247 7.761a6 6 0 0 1 0 8.478"/><path d="M19.075 4.933a10 10 0 0 1 0 14.134"/><path d="M4.925 19.067a10 10 0 0 1 0-14.134"/><path d="M7.753 16.239a6 6 0 0 1 0-8.478"/><circle cx="12" cy="12" r="2"/></g>
<text x="78" y="1008.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Phản ứng</text>
<text x="78" y="1032.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Luồng dữ liệu bất đồng bộ</text>
<text x="78" y="1051.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">và lan truyền thay đổi.</text>
<rect x="20" y="1083" width="280" height="87" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
<circle cx="50" cy="1126.5" r="18" fill="#b45309"/><g transform="translate(39.2 1115.7) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5"/><path d="M8 3H3v5"/><path d="M12 22v-8.3a4 4 0 0 0-1.172-2.872L3 3"/><path d="m15 9 6-6"/></g>
<text x="78" y="1109.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Đồng thời</text>
<text x="78" y="1133.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Chạy nhiều tác vụ hoặc</text>
<text x="78" y="1152.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">tiến trình cùng lúc.</text>
<rect x="8" y="1194" width="304" height="282" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="1222.1" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Nhớ gì</text>
<rect x="20" y="1239" width="280" height="83" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="1262" r="11" fill="#16a34a"/>
<polyline points="37.9,1262.4 41.7,1266.4 48.5,1258" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="1265.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Tám mô hình, mỗi mô hình</text>
<text x="64" y="1284.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">một cách nghĩ về chương</text>
<text x="64" y="1304.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">trình.</text>
<rect x="20" y="1330" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="1353" r="11" fill="#16a34a"/>
<polyline points="37.9,1353.4 41.7,1357.4 48.5,1349" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="1356.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Một ngôn ngữ có thể hợp</text>
<text x="64" y="1375.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">nhiều mô hình.</text>
<rect x="20" y="1401" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="1424" r="11" fill="#16a34a"/>
<polyline points="37.9,1424.4 41.7,1428.4 48.5,1420" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="1427.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Cách chia nhóm là của bài,</text>
<text x="64" y="1446.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">không phải của nguồn.</text>
</g>
</svg>
