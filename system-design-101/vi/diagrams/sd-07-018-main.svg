<svg xmlns="http://www.w3.org/2000/svg" width="320" height="1562" viewBox="0 0 320 1562" role="img" aria-labelledby="title desc">
<title id="title">Quẹt thẻ tại cửa hàng</title>
<desc id="desc">Bốn khung. Khung một, xin phép (bước 1 đến 3): máy POS gửi giao dịch cho ngân hàng thu, ngân hàng thu gửi cho mạng thẻ. Khung hai, xin phép (bước 4): mạng thẻ gửi cho ngân hàng phát hành để duyệt; ngân hàng phát hành giữ một phần hạn mức của thẻ nếu duyệt, rồi báo duyệt hoặc từ chối về ngân hàng thu và máy POS. Khung ba, cuối ngày: cửa hàng bấm chốt, lô giao dịch đi tới ngân hàng thu rồi mạng thẻ, mạng thẻ bù trừ và gửi tệp cho ngân hàng phát hành, ngân hàng phát hành xác nhận và chuyển tiền cho ngân hàng thu, ngân hàng thu chuyển cho ngân hàng của cửa hàng. Khung bốn, vai của mạng thẻ.</desc>
