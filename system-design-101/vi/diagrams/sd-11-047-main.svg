<svg xmlns="http://www.w3.org/2000/svg" width="360" height="648" viewBox="0 0 360 648" role="img" aria-labelledby="title desc">
<title id="title">So sánh AWS, Azure và Google Cloud theo vai trò</title>
<desc id="desc">Compute (VM): EC2 • Azure Virtual Machines: Google Compute Engine; Object storage: S3 • Blob • Cloud Storage: Kiểm API, quyền và giới hạn; DB quan hệ AWS / GCP: Amazon RDS • Cloud SQL: Chọn theo engine và nhu cầu; DB quan hệ trên Azure: Azure SQL Database: Azure Database for PostgreSQL; Kubernetes: EKS • AKS • GKE: Map vai trò, rồi kiểm giới hạn. Các sản phẩm được nhóm theo vai trò, không hàm ý tương đương mọi tính năng. Với Azure, lựa chọn DB quan hệ tùy engine.</desc>
<rect width="360" height="648" fill="#f8fafc"/>
<g font-family="DejaVu Sans, sans-serif" fill="#0f172a">
