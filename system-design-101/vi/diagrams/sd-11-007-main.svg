<text x="24" y="218" font-size="18">Cùng ý định và payload</text>
<text x="24" y="244" font-size="18">Dùng kết quả đã ghi</text>
<rect x="12" y="276" width="336" height="102" rx="12" fill="#fef3c7" stroke="#64748b"/>
<text x="24" y="303" font-size="18" font-weight="bold">Sáu bối cảnh</text>
<text x="24" y="332" font-size="18">API • tiền • đơn • DB</text>
