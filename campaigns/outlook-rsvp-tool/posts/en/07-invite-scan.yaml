id: 07-invite-scan
status: draft
format: portrait
series: "Office tools · #7"
link: survey
slides:
  - layout: cover
    emoji: "📥"
    eyebrow: "Invite & count"
    title: "Stop **reading every reply** to count who's coming"
    subtitle: "Invite with buttons, count with one click. These are the first steps of the tool."

  - layout: compare
    title: "Typed replies vs. one button"
    before:
      label: "Free-text replies"
      items:
        - "“Sure!”, “Probably”, “Let me check my calendar…”"
        - "Open every email to work out what it means"
        - "New replies arrive, so you count again"
    after:
      label: "Voting buttons"
      items:
        - "Just Yes / No / Maybe"
        - "No typing — just one click"
        - "Click **Scan Inbox** for the count"

  - layout: checklist
    title: "Getting your guest list in"
    items:
      - "Import from Excel: **names in column A, e-mails in column B**"
      - "Title rows are skipped, repeated addresses dropped"
      - "Or add people by hand"
      - "The list is saved after every change"

  - layout: features
    title: "What Scan Inbox does"
    items:
      - {emoji: "📂", title: "Every folder", text: "Looks for replies in every folder of your mailbox, not just the Inbox"}
      - {emoji: "🔢", title: "Counts for you", text: "Yes / No / Maybe totals are counted and saved to History"}
      - {emoji: "✏️", title: "Fix by hand", text: "Correct any vote; your edit survives later scans unless that person sends a newer reply"}
      - {emoji: "🏷️", title: "Matched by Event ID", text: "Each event has an ID, so replies are matched to the right event"}

  - layout: pains
    tone: accent
    title: "Honest limits"
    items:
      - {emoji: "⚠️", text: "2 people sharing one e-mail address can't be told apart"}
      - {emoji: "⚠️", text: "Outlook's search index can lag about 1 minute — scan again if replies seem missing"}
      - {emoji: "⚠️", text: "Windows + Outlook Desktop only"}

  - layout: cta
    emoji: "💬"
    title: "How are you counting RSVPs **right now**?"
    text: "Inbox, group chat, a spreadsheet, a form? Tell me in the comments."

platforms:
  facebook:
    caption: |
      Click Scan Inbox, get a table of who's coming. That's the first part of the tool 📥

      How it works: the invite carries Outlook's voting buttons — Yes / No / Maybe — so nobody types a reply. Scan Inbox then reads replies from every folder of your mailbox and counts them. Disagree with a vote? Correct it by hand; later scans keep your edit.

      Why bother? Because “Sure!”, “Probably” and “Let me check my calendar” don't count themselves.

      Honest limit: 2 people sharing one e-mail address can't be told apart.

      How are you counting RSVPs right now? 👇
    first_comment: |
      📋 3-minute survey — how do you count RSVPs today? {link}
    hashtags: [Outlook, automation, productivity, teamevents, RSVP]
