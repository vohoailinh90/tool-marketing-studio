<svg xmlns="http://www.w3.org/2000/svg" width="320" height="738" viewBox="0 0 320 738" role="img" aria-labelledby="title desc">
<title id="title">Bốn câu hỏi về một hệ thống</title>
<desc id="desc">Hai khung. Khung một, bốn câu hỏi: chịu thêm tải được không, có luôn sẵn sàng phục vụ không, có cho kết quả đúng không, có đủ nhanh dưới tải đỉnh không. Khung hai, ví dụ tính được: hệ thống sẵn sàng 99,9 phần trăm thì có thể ngừng khoảng 8,76 giờ mỗi năm, và hai dịch vụ nối tiếp, mỗi dịch vụ 99,9 phần trăm, chỉ còn khoảng 99,8 phần trăm.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs>
<rect width="320" height="738" fill="#f8fafc"/>
<g font-family="DejaVu Sans, Arial, sans-serif" fill="#0f172a">
<text x="16" y="34" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">Bốn câu hỏi về một hệ</text>
<text x="16" y="58" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">thống</text>
<text x="16" y="84.2" font-size="15" fill="#475569" font-weight="normal" text-anchor="start">Mở rộng, sẵn sàng, tin cậy, hiệu</text>
<text x="16" y="103.8" font-size="15" fill="#475569" font-weight="normal" text-anchor="start">năng.</text>
<rect x="8" y="123" width="304" height="333" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="151.2" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Bốn câu hỏi</text>
<rect x="20" y="168" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="191" r="11" fill="#16a34a"/>
<polyline points="37.9,191.4 41.7,195.4 48.5,187" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="194.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Mở rộng: tải tăng thì thêm</text>
<text x="64" y="213.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">tài nguyên có đủ không.</text>
<rect x="20" y="239" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="262" r="11" fill="#16a34a"/>
<polyline points="37.9,262.4 41.7,266.4 48.5,258" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="265.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Sẵn sàng: lúc cần, hệ thống</text>
<text x="64" y="284.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">có đó không.</text>
<rect x="20" y="310" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="333" r="11" fill="#16a34a"/>
<polyline points="37.9,333.4 41.7,337.4 48.5,329" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="336.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Tin cậy: kết quả có đúng</text>
<text x="64" y="355.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">không.</text>
<rect x="20" y="381" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="404" r="11" fill="#16a34a"/>
<polyline points="37.9,404.4 41.7,408.4 48.5,400" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="407.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Hiệu năng: lúc đông nhất có</text>
<text x="64" y="426.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">đủ nhanh không.</text>
<rect x="8" y="468" width="304" height="262" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="496.2" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Hai phép tính</text>
<rect x="20" y="513" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="536" r="11" fill="#16a34a"/>
<polyline points="37.9,536.4 41.7,540.4 48.5,532" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="539.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">99,9 phần trăm: ngừng</text>
<text x="64" y="558.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">khoảng 8,76 giờ mỗi năm.</text>
<rect x="20" y="584" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="607" r="11" fill="#16a34a"/>
<polyline points="37.9,607.4 41.7,611.4 48.5,603" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="610.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Mỗi chữ số chín thêm: giờ</text>
<text x="64" y="629.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">ngừng giảm mười lần.</text>
<rect x="20" y="655" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="678" r="11" fill="#16a34a"/>
<polyline points="37.9,678.4 41.7,682.4 48.5,674" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="681.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Hai dịch vụ nối tiếp 99,9:</text>
<text x="64" y="700.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">còn khoảng 99,8.</text>
</g>
</svg>
