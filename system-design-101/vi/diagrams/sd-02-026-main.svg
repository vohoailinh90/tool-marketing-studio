<svg xmlns="http://www.w3.org/2000/svg" width="320" height="1134" viewBox="0 0 320 1134" role="img" aria-labelledby="title desc">
<title id="title">Chín blog kỹ thuật và bốn câu hỏi</title>
<desc id="desc">Ba khung. Hai khung đầu là chín blog theo bài nguồn: Netflix TechBlog, Uber Blog, Cloudflare Blog, Engineering at Meta, LinkedIn Engineering, Discord Blog, AWS Architecture, Slack Engineering, Stripe Blog. Khung ba là bốn câu hỏi khi đọc một bài: bài toán gì, ràng buộc gì, đánh đổi gì, điều gì dùng được ở quy mô của mình.</desc>
