<text x="20" y="920.1" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Tự động hóa và nền tảng</text>
<rect x="20" y="937" width="280" height="87" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
<circle cx="46" cy="963" r="14" fill="#b45309"/>
<text x="46" y="968.5" font-size="16" fill="#ffffff" font-weight="bold" text-anchor="middle">1</text>
<text x="70" y="963.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">7 · CI/CD</text>
<text x="70" y="987.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Mỗi thay đổi tự chạy kiểm</text>
<text x="70" y="1006.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">thử.</text>
<rect x="20" y="1046" width="280" height="127" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
