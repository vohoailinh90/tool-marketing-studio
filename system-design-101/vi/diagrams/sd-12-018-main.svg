<svg xmlns="http://www.w3.org/2000/svg" width="320" height="767" viewBox="0 0 320 767" role="img" aria-labelledby="title desc">
<title id="title">Công cụ tìm kiếm hoạt động thế nào</title>
<desc id="desc">Hai khung. Khung một, ba việc nối nhau: thu thập, trong đó chương trình bò web đi từ vài trang hạt giống theo liên kết để tải trang; lập chỉ mục, trong đó nội dung trang được phân tích và xếp thành chỉ mục tra từ ra trang; phục vụ kết quả, gồm phân tích truy vấn, truy xuất trang khớp từ chỉ mục, rồi xếp hạng. Khung hai, ba điều rút ra từ thử nghiệm: từ vài hạt giống theo liên kết tới được phần lớn nhưng không phải mọi trang, chỉ mục trả lời nhanh hơn nhiều so với quét từng trang, và xếp hạng cần thứ gì đó hơn việc khớp từ.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs>
<rect width="320" height="767" fill="#f8fafc"/>
<g font-family="DejaVu Sans, Arial, sans-serif" fill="#0f172a">
<text x="16" y="34" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">Công cụ tìm kiếm hoạt</text>
<text x="16" y="58" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">động thế nào</text>
<text x="16" y="84.2" font-size="15" fill="#475569" font-weight="normal" text-anchor="start">Thu thập, lập chỉ mục, phục vụ kết</text>
<text x="16" y="103.8" font-size="15" fill="#475569" font-weight="normal" text-anchor="start">quả.</text>
<rect x="8" y="123" width="304" height="362" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="151.2" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Ba việc nối nhau</text>
<rect x="20" y="168" width="280" height="87" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="46" cy="194" r="14" fill="#1d4ed8"/>
<text x="46" y="199.5" font-size="16" fill="#ffffff" font-weight="bold" text-anchor="middle">1</text>
<text x="70" y="194.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Thu thập</text>
<text x="70" y="218.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Từ trang hạt giống, theo</text>
<text x="70" y="237.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">liên kết.</text>
<rect x="20" y="277" width="280" height="87" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="46" cy="303" r="14" fill="#1d4ed8"/>
<text x="46" y="308.5" font-size="16" fill="#ffffff" font-weight="bold" text-anchor="middle">2</text>
<text x="70" y="303.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Lập chỉ mục</text>
<text x="70" y="327.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Từ nào nằm ở những trang</text>
<text x="70" y="346.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">nào.</text>
<polyline points="46,257 46,275" fill="none" stroke="#334155" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="20" y="386" width="280" height="87" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="46" cy="412" r="14" fill="#1d4ed8"/>
<text x="46" y="417.5" font-size="16" fill="#ffffff" font-weight="bold" text-anchor="middle">3</text>
<text x="70" y="412.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Phục vụ</text>
<text x="70" y="436.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Phân tích câu hỏi, truy xuất,</text>
<text x="70" y="455.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">xếp hạng.</text>
<polyline points="46,366 46,384" fill="none" stroke="#334155" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="8" y="497" width="304" height="262" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="525.1" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Ba điều rút ra</text>
<rect x="20" y="542" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="565" r="11" fill="#16a34a"/>
<polyline points="37.9,565.4 41.7,569.4 48.5,561" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="568.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Theo liên kết từ hạt giống</text>
<text x="64" y="587.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">không tới mọi trang.</text>
<rect x="20" y="613" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="636" r="11" fill="#16a34a"/>
<polyline points="37.9,636.4 41.7,640.4 48.5,632" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="639.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Chỉ mục trả lời nhanh hơn</text>
<text x="64" y="658.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">quét từng trang.</text>
<rect x="20" y="684" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="707" r="11" fill="#16a34a"/>
<polyline points="37.9,707.4 41.7,711.4 48.5,703" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="710.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Khớp từ chưa đủ: còn phải</text>
<text x="64" y="729.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">xếp hạng.</text>
</g>
</svg>
