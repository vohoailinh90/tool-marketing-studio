id: 01-process
status: draft
format: portrait
series: "AIとの開発 · #1"
link: ""
slides:
  - layout: cover
    emoji: "🧭"
    eyebrow: "開発の進め方"
    title: "設計は**Claude**、批判は**Codex**。完了まで回す"
    subtitle: "無限には回しません。上限と「完了の定義」が先です。"

  - layout: pains
    title: "AIの「自己採点」の落とし穴"
    tone: bad
    items:
      - {emoji: "🪞", text: "書いた本人が、唯一の確認者になってしまう"}
      - {emoji: "🤝", text: "同じ系統のモデル同士だと、見落としも似やすい"}
      - {emoji: "📝", text: "「完了」と言われても、基準ごとの根拠がない"}
      - {emoji: "♾️", text: "自動で回すと、往復が止まらず範囲外まで直しがち"}

  - layout: table
    title: "区分ごとのエージェント数"
    columns: ["区分", "点数", "Claudeのみ", "Codexが批判"]
    rows:
      - ["T0", "0–2", "0", "0（Codex不使用）"]
      - ["T1", "3–5", "1", "0"]
      - ["T2", "6–8", "2", "0"]
      - ["T3", "9–12", "3", "1"]
    note: "6つの観点を各0〜2で採点し、区分と上限はスクリプトが決めます。追加枠：T3で要件が曖昧なら要件分析役を+1、T2・T3でレビュー担当が求めればtest-engineerを+1。"

  - layout: table
    title: "Claude側：メイン1＋8役"
    columns: ["役割", "仕事", "出番"]
    rows:
      - ["requirement-analyst", "要件の整理", "T3・曖昧さ2"]
      - ["architect", "設計案の作成", "T2・構造が変わる時"]
      - ["architecture-critic", "設計の批判", "T3"]
      - ["code-reviewer", "差分確認と検証", "T1・T2"]
      - ["code-reviewer-t3", "同上（余裕あり）", "T3"]
      - ["code-reviewer-verify", "同上（検証が重い時）", "選んだ時のみ"]
      - ["test-engineer", "専用の検証設計", "レビュー担当の要請時"]
      - ["implementer", "計画どおり実装", "昇格時のみ"]
    note: "メインのセッションが分析・設計・実装を全区分で担い、上限には数えません。implementer以外は読み取り専用で、code-reviewer-verifyはレビュー担当の代わりに入ります。"

  - layout: checklist
    title: "Codex側：批判だけ"
    items:
      - "常駐エージェントはなし。呼ぶたびに、独立した文脈の新しいCodex Cloudタスク"
      - "出番は3種類：設計の批判、PRレビュー、セキュリティに関わる変更ではセキュリティレビュー"
      - "設計の批判は critical と high のみ。各指摘に根拠と壊れる場面を添える"
      - "結論は3択：承認・条件付き承認・却下"
      - "コードは書かず、修正もしない。それはClaudeの仕事"
      - "T3ではClaude側にレビュー担当を1つ残す。Codexは差分を読むだけだから"
    note: "設計の批判は最大2回、PRレビューは1つのPRにつき最大3回。依頼は1スレッドに1件ずつ。"

  - layout: flow
    variant: after
    title: "一巡の流れ"
    steps:
      - {emoji: "📊", text: "要件を採点。区分と上限はスクリプトが決める"}
      - {emoji: "🧠", text: "**Claudeが設計**し、受け入れ基準を書く"}
      - {emoji: "🔍", text: "**Codexが設計を批判**（読み取りのみ・変更しない）"}
      - {emoji: "🛠️", text: "Claudeが設計を直し、実装する"}
      - {emoji: "🔀", text: "PRを開いたら、すぐCodexにレビューを依頼"}
      - {emoji: "✅", text: "Claudeが差分を読み直し、テストを再実行。確認できた指摘だけ直す"}
      - {emoji: "🚀", text: "完了の条件を満たしたらマージ"}
    note: "区分が低いほど、手順は少なくなります。"

  - layout: table
    title: "往復には上限があります"
    columns: ["項目", "上限"]
    rows:
      - ["設計と批判の往復", "2回"]
      - ["修正の往復", "2回"]
      - ["1つのPRへのレビュー", "3回"]
      - ["同時に走らせるCodexへの依頼", "1件"]
      - ["同じコミットへの同じ種類の依頼", "繰り返さない"]
    note: "レビューの回数は、GitHub上の投稿をスクリプトが数えます。AIの記憶には頼りません。重大な指摘が解消されるか、根拠つきで退けられたら終了。合意するまで議論は続けません。"

  - layout: checklist
    title: "「完了」の条件"
    tone: ok
    items:
      - "Codexが意図した種類の依頼を、意図したコミットで実行した"
      - "受け入れ基準ごとに根拠がある"
      - "必須のテスト・チェックがすべて通っている"
      - "P0／P1の指摘がなく、範囲も広げていない"
    note: "4つ揃えばマージ。人が判断するのは、機械では決められない判断が出たときと、元の要件が変わったときだけです。"

  - layout: features
    title: "止まらずに回し続けるために"
    items:
      - {emoji: "📒", title: "引き継ぎメモ", text: "目的・完了分・残り・次のコマンドをファイルに残す"}
      - {emoji: "⏱️", title: "適切なタイミングで促す", text: "コンテキストの約70%でメモ更新、約85%で締めに入る"}
      - {emoji: "🛟", title: "途中で切れても", text: "コンテキスト圧縮の前に自動保存。新しいセッションがメモを読み込む"}
      - {emoji: "🧮", title: "数えられることは機械に", text: "往復数の集計、コミットの照合、テスト実行"}
    note: "最初からやり直すより、続きから再開するほうが安く済みます。"

  - layout: poll
    eyebrow: "みなさんは？"
    question: "AIが作ったものは、今どなたが確認していますか？"
    options:
      - "書いたAI自身"
      - "別のAI"
      - "自分で読み直す"
      - "まだ確認していない"
    hint: "A・B・C・D のどれかをコメントでどうぞ"

platforms:
  facebook:
    caption: |
      設計はClaude、批判はCodex。上限と「完了の定義」を決めて、最後まで回す進め方です 👇

      AIが書いたコードを、書いたAI自身が確認していて大丈夫か。そこで私は、自作のテンプレート用リポジトリ（現在は非公開）の手順で進めています。

      1️⃣ 要件を6つの観点で、各0〜2点で採点。点数からT0〜T3の区分を決めるのはスクリプトで、レビューの体制もそこで決まります。AIの感覚には任せません。
      2️⃣ 設計はClaude、その批判はCodex。指摘は重大なものだけで、根拠と「どう壊れるか」の場面つきです。
      3️⃣ Claudeが実装してPRを開き、Codexにレビューを依頼。Claudeも差分とテストを自分で確認し、確認できた指摘だけ直します。
      4️⃣ 回数には上限を設けています。修正は最大2回、レビューは1つのPRにつき3回まで。
      5️⃣ 「完了」とは、受け入れ基準ごとの根拠があり、チェックが通り、P0／P1の指摘が残っていない状態。そこで初めてマージします。

      体制も、きちんと書いておきます。Claude側はメインのセッション1つと、8つの役割（要件の整理、設計、設計の批判、3種類のレビュー担当、実装、検証設計）です。エージェントの上限はT0〜T3で0、1、2、3。Codexが批判役に入ると0、0、0、1になります。Codex側に常駐エージェントはなく、呼ぶたびに新しいタスクで、役目は批判だけ。コードも書かず、修正もしません。

      止まらずに回すために、引き継ぎメモも使っています。コンテキストの約70%で書き出し、約85%で締めに入ります。新しいセッションはメモから再開できます。

      正直な制約：Codex CloudをGitHubに接続し、利用枠が残っている必要があります。自動マージは、マージ前の最新化を必須にしたブランチ保護がある場合に限るのが安全です。

      みなさんは、AIの成果物を今どなたが確認していますか？
    hashtags: [Claude, Codex, AI活用, 業務改善, 開発]
