<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 1098" width="320" height="1098" role="img" aria-labelledby="title desc">
<title id="title">OAuth 2.0: luồng mã ủy quyền và PKCE</title>
<desc id="desc">Hai câu hỏi khác nhau: tôi là ai, và ứng dụng này được làm gì thay tôi. Luồng mã ủy quyền của OAuth gồm năm bước. Một: ứng dụng chuyển người dùng sang máy chủ ủy quyền, kèm mã định danh ứng dụng và địa chỉ chuyển hướng. Hai: người dùng đăng nhập và đồng ý. Ba: máy chủ ủy quyền trả về một mã, mà máy chủ chỉ đổi thành token một lần. Bốn: ứng dụng đổi mã lấy access token. Năm: ứng dụng dùng access token gọi tài nguyên. PKCE: ứng dụng tạo một chuỗi bí mật, gửi bản băm của nó ở bước một và chuỗi gốc ở bước bốn. Thẻ cuối: đừng coi một access token bất kỳ là bằng chứng đăng nhập; đăng nhập cần giao thức xác thực như OpenID Connect xây trên OAuth.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#475569" stroke-width="1.5"/></marker></defs>
<rect width="320" height="1098" fill="#f8fafc"/>
<g font-family="DejaVu Sans, Arial, sans-serif" fill="#0f172a">
<text x="16" y="30" font-size="21" font-weight="bold">OAUTH 2.0:</text>
<text x="16" y="54" font-size="21" font-weight="bold">ỦY QUYỀN</text>
<rect x="16" y="80" width="288" height="100" rx="12" fill="#e2e8f0" stroke="#94a3b8"/>
<text x="29" y="109" font-size="16" font-weight="bold">Hai câu hỏi</text>
<text x="29" y="137" font-size="16" font-weight="normal">Tôi là ai? Ứng dụng này được</text>
<text x="29" y="161" font-size="16" font-weight="normal">làm gì thay tôi?</text>
<rect x="16" y="192" width="288" height="38" rx="10" fill="#1e293b"/>
<text x="29" y="215" font-size="16" font-weight="bold" fill="#ffffff">Luồng mã ủy quyền</text>
<rect x="16" y="240" width="288" height="124" rx="12" fill="#dbeafe" stroke="#94a3b8"/>
<text x="29" y="269" font-size="16" font-weight="bold">1 · Chuyển sang máy chủ ủy</text>
<text x="29" y="293" font-size="16" font-weight="bold">quyền</text>
<text x="29" y="321" font-size="16" font-weight="normal">Kèm mã định danh ứng dụng và</text>
<text x="29" y="345" font-size="16" font-weight="normal">địa chỉ chuyển hướng</text>
<line x1="160" y1="365" x2="160" y2="380" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="16" y="382" width="288" height="100" rx="12" fill="#ede9fe" stroke="#94a3b8"/>
<text x="29" y="411" font-size="16" font-weight="bold">2 · Đăng nhập, đồng ý</text>
<text x="29" y="439" font-size="16" font-weight="normal">Người dùng làm việc này ở máy</text>
<text x="29" y="463" font-size="16" font-weight="normal">chủ ủy quyền</text>
<line x1="160" y1="483" x2="160" y2="498" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="16" y="500" width="288" height="100" rx="12" fill="#dcfce7" stroke="#94a3b8"/>
<text x="29" y="529" font-size="16" font-weight="bold">3 · Nhận mã</text>
<text x="29" y="557" font-size="16" font-weight="normal">Máy chủ chỉ đổi mã thành token</text>
<text x="29" y="581" font-size="16" font-weight="normal">một lần</text>
<line x1="160" y1="601" x2="160" y2="616" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="16" y="618" width="288" height="100" rx="12" fill="#fef3c7" stroke="#94a3b8"/>
<text x="29" y="647" font-size="16" font-weight="bold">4 · Đổi mã lấy token</text>
<text x="29" y="675" font-size="16" font-weight="normal">Ứng dụng gửi mã để nhận</text>
<text x="29" y="699" font-size="16" font-weight="normal">access token</text>
<line x1="160" y1="719" x2="160" y2="734" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="16" y="736" width="288" height="76" rx="12" fill="#e2e8f0" stroke="#94a3b8"/>
<text x="29" y="765" font-size="16" font-weight="bold">5 · Gọi tài nguyên</text>
<text x="29" y="793" font-size="16" font-weight="normal">Ứng dụng dùng access token</text>
<rect x="16" y="824" width="288" height="100" rx="12" fill="#ffffff" stroke="#94a3b8"/>
<text x="29" y="853" font-size="16" font-weight="bold">PKCE</text>
<text x="29" y="881" font-size="16" font-weight="normal">Gửi bản băm của chuỗi bí mật ở</text>
<text x="29" y="905" font-size="16" font-weight="normal">bước 1, chuỗi gốc ở bước 4.</text>
<rect x="16" y="936" width="288" height="148" rx="12" fill="#fee2e2" stroke="#94a3b8"/>
<text x="29" y="965" font-size="16" font-weight="bold">Đăng nhập cần thêm</text>
<text x="29" y="993" font-size="16" font-weight="normal">Đừng coi một access token bất</text>
<text x="29" y="1017" font-size="16" font-weight="normal">kỳ là bằng chứng đăng nhập;</text>
<text x="29" y="1041" font-size="16" font-weight="normal">đăng nhập cần giao thức xác</text>
<text x="29" y="1065" font-size="16" font-weight="normal">thực như OpenID Connect.</text>
</g></svg>
