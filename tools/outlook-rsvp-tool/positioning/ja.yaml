lang: ja
one_liner: "幹事の出欠確認・リマインド・集金・会計報告を、いつもの Outlook で自動化する Windows アプリ。"
audience: >-
  歓送迎会・忘年会・送別会の幹事や、餞別・お祝いの集金を任されがちな会社員（総務、チームのまとめ役、若手社員）。
  会社で Windows と Outlook デスクトップ版を使っている人。
pains:
  - "返信メールを1通ずつ開いて、出欠を手作業で数える"
  - "未回答の人へのリマインドを何度も送る"
  - "参加者だけに会議出席依頼を送り直す"
  - "会費の集金状況、免除の人、二次会の精算をExcelで管理する"
  - "餞別の集金と、プレゼント代を引いた残額の計算"
  - "日英のメールを2回書く"
  - "記録が残らず、次の幹事がゼロからやり直す"
promise: "繰り返し作業（案内・集計・リマインド・集金管理・報告）は Outlook に任せ、幹事はお店選びに集中できる。"
objections:
  - {q: "データは外部に送られますか？", a: "送られません。すべてPC内の SQLite ファイル1つに保存されます。"}
  - {q: "情シスの許可やAPIキーは必要ですか？", a: "APIキーもアプリ登録も不要です。すでに使っている Outlook デスクトップ版を操作します。"}
  - {q: "Macで使えますか？", a: "現在は Windows ＋ Outlook デスクトップ版のみです。"}
  - {q: "参加者は何かインストールが必要ですか？", a: "不要です。メールの投票ボタンを押すだけです。"}
vocabulary: [幹事, 出欠確認, 集金, 二次会, 送別会, 歓送迎会, 忘年会, 餞別, リマインド, 投票ボタン, 会計報告]
angles:
  - "幹事あるある：出欠確認のグループチャット"
  - "30人の飲み会、幹事の作業時間はどれくらい？"
  - "なぜ新しいアプリではなく Outlook の上に作ったのか"
  - "Before / After：色だらけのExcelと自動集計"
  - "アンケート：幹事のやり方を教えてください"
tone: "です・ます調で丁寧に、幹事の苦労への共感を軸に。誇張せず、制約は正直に。"
