<svg xmlns="http://www.w3.org/2000/svg" width="320" height="420" viewBox="0 0 320 420" role="img" aria-labelledby="title desc"><title id="title">Sau thay đổi API: chọn bộ kiểm tra theo rủi ro</title><desc id="desc">Ba góc nhìn kiểm tra độc lập, không phải quy trình bắt buộc.</desc><rect width="320" height="420" rx="16" fill="#f8fafc"/><g font-family="Arial,sans-serif" fill="#0f172a"><rect x="12" y="14" width="296" height="118" rx="12" fill="#dbeafe"/><text x="26" y="42" font-size="19">Xác nhận bản sửa</text><text x="26" y="71" font-size="17">Ca từng lỗi</text><text x="26" y="102" font-size="16">Gia hạn → hạn mới đúng</text><rect x="12" y="144" width="296" height="118" rx="12" fill="#dcfce7"/><text x="26" y="172" font-size="19">Giữ hành vi liên quan</text><text x="26" y="201" font-size="17">Hồi quy</text><text x="26" y="232" font-size="16">Trả sách, đọc phiếu cũ</text><rect x="12" y="274" width="296" height="118" rx="12" fill="#fef3c7"/><text x="26" y="302" font-size="19">Mở rộng theo rủi ro</text><text x="26" y="331" font-size="17">Tải / đầu vào biến thể</text><text x="26" y="362" font-size="16">Ghi điều kiện và kết quả</text></g></svg>
