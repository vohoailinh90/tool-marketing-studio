link: survey
slides:
  - layout: cover
    emoji: "💬"
    eyebrow: "Hỏi nhanh – đáp gọn"
    title: "Những câu mọi người hay hỏi về **Outlook RSVP Tool**"

  - layout: features
    title: "Hỏi & đáp"
    items:
      - {emoji: "🔐", title: "Dữ liệu có bị gửi đi đâu không?", text: "Không. Mọi thứ nằm trong một file trên máy bạn."}
      - {emoji: "🧩", title: "Có cần IT cấp quyền không?", text: "Không cần API key hay đăng ký ứng dụng — chỉ cần Outlook Desktop đã đăng nhập."}
      - {emoji: "🍎", title: "Dùng trên Mac được không?", text: "Chưa. Hiện chỉ chạy trên Windows + Outlook Desktop."}
      - {emoji: "👥", title: "Người nhận có phải cài gì không?", text: "Không. Họ chỉ bấm nút trong email."}

  - layout: pains
    tone: accent
    title: "Giới hạn hiện tại (nói thật)"
    items:
      - {emoji: "⚠️", text: "Chưa phân biệt được 2 người dùng chung một email"}
      - {emoji: "⚠️", text: "Nhắc nhở tự động theo lịch: chưa có — đang gửi bằng tay trong app"}
      - {emoji: "⚠️", text: "Cần cài Python — **chưa có bộ cài một chạm**"}

  - layout: cta
    emoji: "🙌"
    title: "Còn câu hỏi nào khác?"
    text: "Comment bên dưới — mình trả lời hết."

platforms:
  facebook:
    caption: |
      Gom lại những câu mọi người hỏi nhiều nhất về Outlook RSVP Tool 👇

      Ngắn gọn: dữ liệu không rời máy bạn, không cần API key hay xin IT đăng ký ứng dụng, người nhận không phải cài gì — họ chỉ bấm nút trong email.

      Và mình nói thật những gì nó CHƯA làm được: chưa chạy trên Mac, chưa có nhắc nhở tự động theo lịch, và vẫn cần cài Python (chưa có bộ cài một chạm). Nếu một trong những điều này là lý do bạn chưa dùng, hãy cho mình biết — nó giúp mình chọn việc làm trước.

      Còn câu hỏi nào khác? Comment bên dưới nhé.
    first_comment: |
      📋 Khảo sát 3 phút để mình ưu tiên đúng việc: {link}
    hashtags: [Outlook, hoidap, tudonghoa, vanphong]
