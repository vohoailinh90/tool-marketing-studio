<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 819" width="320" height="819" role="img" aria-labelledby="title desc">
<title id="title">Giảm rủi ro khi triển khai: chọn theo nhu cầu</title>
<desc id="desc">Bốn thẻ nhu cầu và cách xử lý: hai dịch vụ đổi cùng lúc cần tương thích hai chiều, muốn quay lui trong vài giây dùng blue-green hoặc cờ tính năng, muốn lộ lỗi sớm với chi phí thấp dùng canary, muốn đo tác động sản phẩm dùng A/B test.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#475569" stroke-width="1.5"/></marker></defs>
<rect width="320" height="819" fill="#f8fafc"/><g font-family="DejaVu Sans, Arial, sans-serif" fill="#0f172a">
<text x="16" y="30" font-size="20" font-weight="bold">BẠN SỢ ĐIỀU GÌ?</text>
<text x="16" y="58" font-size="16" font-weight="normal">Nhu cầu → cơ chế</text>
<rect x="16" y="89" width="288" height="155" rx="10" fill="#fee2e2" stroke="#94a3b8"/>
<text x="30" y="117" font-size="16" font-weight="bold">Hai dịch vụ đổi cùng</text>
<text x="30" y="144" font-size="16" font-weight="bold">lúc</text>
<text x="30" y="171" font-size="16" font-weight="normal">Làm thay đổi tương thích</text>
<text x="30" y="198" font-size="16" font-weight="normal">hai chiều trước</text>
<text x="30" y="225" font-size="16" font-weight="normal">Rồi mới chọn cách đưa lên</text>
<rect x="16" y="256" width="288" height="182" rx="10" fill="#dbeafe" stroke="#94a3b8"/>
<text x="30" y="284" font-size="16" font-weight="bold">Phải quay lui trong</text>
<text x="30" y="311" font-size="16" font-weight="bold">vài giây</text>
<text x="30" y="338" font-size="16" font-weight="normal">Blue-green hoặc cờ tính</text>
<text x="30" y="365" font-size="16" font-weight="normal">năng</text>
<text x="30" y="392" font-size="16" font-weight="normal">Giá: giữ hai môi trường</text>
<text x="30" y="419" font-size="16" font-weight="normal">hoặc dọn cờ</text>
<rect x="16" y="450" width="288" height="182" rx="10" fill="#ede9fe" stroke="#94a3b8"/>
<text x="30" y="478" font-size="16" font-weight="bold">Muốn lộ lỗi sớm, ít</text>
<text x="30" y="505" font-size="16" font-weight="bold">tốn kém</text>
<text x="30" y="532" font-size="16" font-weight="normal">Canary: tăng dần tỉ lệ</text>
<text x="30" y="559" font-size="16" font-weight="normal">người dùng</text>
<text x="30" y="586" font-size="16" font-weight="normal">Giá: giám sát và thử trên</text>
<text x="30" y="613" font-size="16" font-weight="normal">production</text>
<rect x="16" y="644" width="288" height="155" rx="10" fill="#fef3c7" stroke="#94a3b8"/>
<text x="30" y="672" font-size="16" font-weight="bold">Muốn đo tác động sản</text>
<text x="30" y="699" font-size="16" font-weight="bold">phẩm</text>
<text x="30" y="726" font-size="16" font-weight="normal">A/B test trên nhóm người</text>
<text x="30" y="753" font-size="16" font-weight="normal">dùng</text>
<text x="30" y="780" font-size="16" font-weight="normal">Không phải công cụ an toàn</text>
</g></svg>
