<svg xmlns="http://www.w3.org/2000/svg" width="320" height="1218" viewBox="0 0 320 1218" role="img" aria-labelledby="title desc">
<title id="title">Avro: ghi bằng lược đồ cũ, đọc bằng lược đồ mới</title>
<desc id="desc">Ba khung. Khung một là ba bước: ghi hai khách hàng vào một tệp container của Avro, phần đầu tệp chứa lược đồ v1 gồm id, name, phone; ứng dụng mới đọc bằng lược đồ v2 khai id kiểu long, bỏ phone và thêm email có giá trị mặc định; Avro so hai lược đồ, ghép trường theo tên, bỏ qua phone và điền email bằng giá trị mặc định. Khung hai, những thay đổi vẫn đọc được: thêm trường có giá trị mặc định, bỏ một trường, đổi int sang long, đổi thứ tự trường. Khung ba, những thay đổi báo lỗi: thêm trường không có giá trị mặc định, đổi int sang string.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs>
<rect width="320" height="1218" fill="#f8fafc"/>
<g font-family="DejaVu Sans, Arial, sans-serif" fill="#0f172a">
<text x="16" y="34" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">Avro: ghi bằng lược đồ</text>
<text x="16" y="58" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">cũ, đọc bằng lược đồ mới</text>
<text x="16" y="84.2" font-size="15" fill="#475569" font-weight="normal" text-anchor="start">Thử với thư viện avro 1.12.2 cho</text>
<text x="16" y="103.8" font-size="15" fill="#475569" font-weight="normal" text-anchor="start">Python.</text>
<rect x="8" y="123" width="304" height="442" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="151.2" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Một tệp, hai lược đồ</text>
<rect x="20" y="168" width="280" height="127" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="46" cy="194" r="14" fill="#1d4ed8"/>
<text x="46" y="199.5" font-size="16" fill="#ffffff" font-weight="bold" text-anchor="middle">1</text>
<text x="70" y="194.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Ghi tệp bằng lược đồ</text>
<text x="70" y="214.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">v1</text>
<text x="70" y="238.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Phần đầu tệp chứa lược đồ</text>
<text x="70" y="257.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">của người ghi: id, name,</text>
<text x="70" y="277.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">phone.</text>
<rect x="20" y="317" width="280" height="107" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="46" cy="343" r="14" fill="#1d4ed8"/>
<text x="46" y="348.5" font-size="16" fill="#ffffff" font-weight="bold" text-anchor="middle">2</text>
<text x="70" y="343.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Đọc bằng lược đồ v2</text>
<text x="70" y="367.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Ứng dụng mới khai id kiểu</text>
<text x="70" y="386.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">long, bỏ phone, thêm email</text>
<text x="70" y="406.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">có giá trị mặc định.</text>
<polyline points="46,297 46,315" fill="none" stroke="#334155" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="20" y="446" width="280" height="107" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="46" cy="472" r="14" fill="#1d4ed8"/>
<text x="46" y="477.5" font-size="16" fill="#ffffff" font-weight="bold" text-anchor="middle">3</text>
<text x="70" y="472.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Avro so hai lược đồ</text>
<text x="70" y="496.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Ghép trường theo tên;</text>
<text x="70" y="515.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">phone bị bỏ qua, email</text>
<text x="70" y="535.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">nhận giá trị mặc định.</text>
<polyline points="46,426 46,444" fill="none" stroke="#334155" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="8" y="577" width="304" height="316" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="605.1" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Vẫn đọc được</text>
<rect x="20" y="622" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="645" r="11" fill="#16a34a"/>
<polyline points="37.9,645.4 41.7,649.4 48.5,641" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="648.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Thêm trường có giá trị mặc</text>
<text x="64" y="667.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">định.</text>
<rect x="20" y="693" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="716" r="11" fill="#16a34a"/>
<polyline points="37.9,716.4 41.7,720.4 48.5,712" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="719.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Bỏ một trường: dữ liệu cũ</text>
<text x="64" y="738.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">của trường đó bị bỏ qua.</text>
<rect x="20" y="764" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="787" r="11" fill="#16a34a"/>
<polyline points="37.9,787.4 41.7,791.4 48.5,783" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="790.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Đổi int sang long: kiểu được</text>
<text x="64" y="809.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">nâng.</text>
<rect x="20" y="835" width="280" height="46" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="858" r="11" fill="#16a34a"/>
<polyline points="37.9,858.4 41.7,862.4 48.5,854" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="861.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Đổi thứ tự các trường.</text>
<rect x="8" y="905" width="304" height="305" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="933.1" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Báo lỗi khi đọc</text>
<rect x="20" y="950" width="280" height="127" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
<circle cx="50" cy="1013.5" r="18" fill="#b45309"/><g transform="translate(39.2 1002.7) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m15 9-6 6"/><path d="m9 9 6 6"/></g>
<text x="78" y="976.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Trường mới thiếu mặc</text>
<text x="78" y="996.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">định</text>
<text x="78" y="1020.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Lược đồ đọc có email mà</text>
<text x="78" y="1039.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">không có giá trị mặc định,</text>
<text x="78" y="1059.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">dữ liệu cũ không có email.</text>
<rect x="20" y="1091" width="280" height="107" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
<circle cx="50" cy="1144.5" r="18" fill="#b45309"/><g transform="translate(39.2 1133.7) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m15 9-6 6"/><path d="m9 9 6 6"/></g>
<text x="78" y="1117.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Đổi int sang string</text>
<text x="78" y="1141.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Hai kiểu không khớp và</text>
<text x="78" y="1160.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">không nâng được từ kiểu</text>
<text x="78" y="1180.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">này sang kiểu kia.</text>
</g>
</svg>
