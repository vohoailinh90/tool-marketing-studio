<polyline points="37.9,1263.4 41.7,1267.4 48.5,1259" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="1266.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Ranh giới giữa các nhóm có</text>
<text x="64" y="1285.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">chỗ mờ.</text>
