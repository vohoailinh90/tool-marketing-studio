<text x="20" y="507.2" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Ba mảng phía trên</text>
<rect x="20" y="524" width="280" height="87" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
<circle cx="50" cy="567.5" r="18" fill="#0f766e"/><g transform="translate(39.2 556.7) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m16 18 6-6-6-6"/><path d="m8 6-6 6 6 6"/></g>
<text x="78" y="550.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Định nghĩa ứng dụng</text>
<text x="78" y="574.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Dựng ảnh, tích hợp, phân</text>
<text x="78" y="593.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">phối liên tục.</text>
<rect x="20" y="625" width="280" height="87" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
<circle cx="50" cy="668.5" r="18" fill="#0f766e"/><g transform="translate(39.2 657.7) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></g>
<text x="78" y="651.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Quan sát</text>
<text x="78" y="675.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Thấy hệ thống đang làm</text>
<text x="78" y="694.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">gì.</text>
<rect x="20" y="726" width="280" height="87" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
<circle cx="50" cy="769.5" r="18" fill="#0f766e"/><g transform="translate(39.2 758.7) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15.914 4a1.5 1.5 0 00-2.474-1.561l-9 9A1.5 1.5 0 005.5 14h4.002a.5.5 0 01.471.666L8.086 20a1.5 1.5 0 002.475 1.56l9-9A1.5 1.5 0 0018.5 10h-3.997a.5.5 0 01-.472-.667z"/></g>
<text x="78" y="752.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Serverless</text>
<text x="78" y="776.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Chạy mã mà không quản</text>
<text x="78" y="795.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">máy chủ.</text>
</g>
