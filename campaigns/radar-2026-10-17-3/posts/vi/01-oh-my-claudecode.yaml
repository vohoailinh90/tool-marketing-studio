  text: Người dùng Claude Code thường phải tự gõ từng lệnh và chỉ đạo một AI duy nhất xử lý từ đầu đến
    cuối. Khi dự án lớn, việc thiếu kiểm tra chéo, thiếu quy trình lập kế hoạch và thực thi tự động làm
