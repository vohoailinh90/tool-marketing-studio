<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 838" width="320" height="838" role="img" aria-labelledby="title desc">
<title id="title">CSS là gì</title>
<desc id="desc">CSS tách kiểu khỏi nội dung HTML. Một luật CSS gồm bộ chọn, thuộc tính và giá trị, ví dụ p { color: blue; }. Khi hai luật xung đột, trình duyệt chọn luật thắng theo thứ tự ưu tiên, trong đó độ đặc hiệu của bộ chọn được xét trước thứ tự viết. Flexbox bố trí theo một chiều, Grid theo hai chiều. Transition và @keyframes tạo chuyển động không cần JavaScript, media query đổi kiểu theo cỡ màn hình.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#475569" stroke-width="1.5"/></marker></defs>
<rect width="320" height="838" fill="#f8fafc"/>
<g font-family="DejaVu Sans, Arial, sans-serif" fill="#0f172a">
<text x="16" y="30" font-size="21" font-weight="bold">CSS</text>
<text x="16" y="54" font-size="21" font-weight="bold">TÁCH KIỂU KHỎI NỘI</text>
<text x="16" y="78" font-size="21" font-weight="bold">DUNG</text>
<rect x="16" y="94" width="288" height="92" rx="12" fill="#dbeafe" stroke="#94a3b8"/>
<text x="29" y="123" font-size="16" font-weight="bold">1 · Nội dung và kiểu</text>
<text x="29" y="147" font-size="16" font-weight="normal">HTML nói nó là gì, CSS nói nó</text>
<text x="29" y="171" font-size="16" font-weight="normal">trông thế nào</text>
<g transform="translate(16,198)"><text x="0" y="18" font-size="16" font-weight="bold">2 · Một luật CSS</text><rect x="0" y="30" width="288" height="44" rx="8" fill="#f1f5f9" stroke="#94a3b8"/><text x="144" y="58" font-size="16" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">p { color: blue; }</text><text x="0" y="100" font-size="16">p = bộ chọn: chọn phần tử nào</text><text x="0" y="124" font-size="16">color = thuộc tính: chỉnh gì</text><text x="0" y="148" font-size="16">blue = giá trị: chỉnh thành gì</text></g>
<rect x="16" y="370" width="288" height="92" rx="12" fill="#fef3c7" stroke="#94a3b8"/>
<text x="29" y="399" font-size="16" font-weight="bold">3 · Xếp tầng</text>
<text x="29" y="423" font-size="16" font-weight="normal">Hai luật xung đột: luật thắng</text>
<text x="29" y="447" font-size="16" font-weight="normal">theo thứ tự ưu tiên</text>
<rect x="16" y="474" width="288" height="92" rx="12" fill="#dcfce7" stroke="#94a3b8"/>
<text x="29" y="503" font-size="16" font-weight="bold">4 · Bố cục</text>
<text x="29" y="527" font-size="16" font-weight="normal">Flexbox: một chiều. Grid: hai</text>
<text x="29" y="551" font-size="16" font-weight="normal">chiều</text>
<rect x="16" y="578" width="288" height="92" rx="12" fill="#ede9fe" stroke="#94a3b8"/>
<text x="29" y="607" font-size="16" font-weight="bold">5 · Chuyển động</text>
<text x="29" y="631" font-size="16" font-weight="normal">transition, @keyframes, không</text>
<text x="29" y="655" font-size="16" font-weight="normal">cần JavaScript</text>
<rect x="16" y="682" width="288" height="92" rx="12" fill="#e2e8f0" stroke="#94a3b8"/>
<text x="29" y="711" font-size="16" font-weight="bold">6 · Đáp ứng</text>
<text x="29" y="735" font-size="16" font-weight="normal">Media query đổi kiểu theo cỡ</text>
<text x="29" y="759" font-size="16" font-weight="normal">màn hình</text>
<text x="16" y="802" font-size="16" font-weight="normal">Độ đặc hiệu của bộ chọn được xét</text>
<text x="16" y="826" font-size="16" font-weight="normal">trước thứ tự viết.</text>
</g></svg>
