<text x="24" y="189" font-size="18" font-weight="bold">Máy và ứng dụng</text>
<text x="24" y="218" font-size="18">Quản lý gói/file/service</text>
<text x="24" y="244" font-size="18">Runtime: endpoint, flag</text>
<rect x="12" y="276" width="336" height="102" rx="12" fill="#fef3c7" stroke="#64748b"/>
<text x="24" y="303" font-size="18" font-weight="bold">Thay đổi an toàn</text>
<text x="24" y="332" font-size="18">Validate → canary → quan sát</text>
<text x="24" y="358" font-size="18">Secret riêng • rollback rõ</text>
