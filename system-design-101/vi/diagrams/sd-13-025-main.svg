<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 976" width="320" height="976" role="img" aria-labelledby="title desc">
<title id="title">Kubernetes: từ lệnh apply đến container chạy</title>
<desc id="desc">Luồng năm bước: API server nhận yêu cầu và lưu vào etcd, controller tạo Pod theo khai báo, scheduler chọn node, kubelet trên node chạy container, kube-proxy (thành phần mặc định, có thể thay) giúp Service tới đúng Pod.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#475569" stroke-width="1.5"/></marker></defs>
<rect width="320" height="976" fill="#f8fafc"/><g font-family="DejaVu Sans, Arial, sans-serif" fill="#0f172a">
<text x="16" y="30" font-size="20" font-weight="bold">MỘT LỆNH APPLY</text>
<text x="16" y="58" font-size="16" font-weight="normal">Đi qua các thành phần</text>
<rect x="16" y="89" width="288" height="101" rx="10" fill="#ede9fe" stroke="#94a3b8"/>
<text x="30" y="117" font-size="16" font-weight="bold">1 · API server + etcd</text>
<text x="30" y="144" font-size="16" font-weight="normal">Nhận yêu cầu, kiểm tra, lưu</text>
<text x="30" y="171" font-size="16" font-weight="normal">trạng thái mong muốn</text>
<line x1="160" y1="202" x2="160" y2="230" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="16" y="240" width="288" height="155" rx="10" fill="#ede9fe" stroke="#94a3b8"/>
<text x="30" y="268" font-size="16" font-weight="bold">2 · Controller</text>
<text x="30" y="295" font-size="16" font-weight="normal">Deployment controller tạo</text>
<text x="30" y="322" font-size="16" font-weight="normal">ReplicaSet</text>
<text x="30" y="349" font-size="16" font-weight="normal">ReplicaSet controller tạo</text>
<text x="30" y="376" font-size="16" font-weight="normal">các Pod</text>
<line x1="160" y1="407" x2="160" y2="435" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="16" y="445" width="288" height="101" rx="10" fill="#ede9fe" stroke="#94a3b8"/>
<text x="30" y="473" font-size="16" font-weight="bold">3 · Scheduler</text>
<text x="30" y="500" font-size="16" font-weight="normal">Chọn node cho Pod chưa có</text>
<text x="30" y="527" font-size="16" font-weight="normal">chỗ</text>
<line x1="160" y1="558" x2="160" y2="586" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="16" y="596" width="288" height="155" rx="10" fill="#dbeafe" stroke="#94a3b8"/>
<text x="30" y="624" font-size="16" font-weight="bold">4 · kubelet (trên</text>
<text x="30" y="651" font-size="16" font-weight="bold">node)</text>
<text x="30" y="678" font-size="16" font-weight="normal">Chạy container qua runtime</text>
<text x="30" y="705" font-size="16" font-weight="normal">Báo trạng thái về API</text>
<text x="30" y="732" font-size="16" font-weight="normal">server</text>
<line x1="160" y1="763" x2="160" y2="791" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="16" y="801" width="288" height="155" rx="10" fill="#dcfce7" stroke="#94a3b8"/>
<text x="30" y="829" font-size="16" font-weight="bold">5 · kube-proxy (mặc</text>
<text x="30" y="856" font-size="16" font-weight="bold">định)</text>
<text x="30" y="883" font-size="16" font-weight="normal">Hiện thực Service trên node</text>
<text x="30" y="910" font-size="16" font-weight="normal">Có thể được plugin mạng</text>
<text x="30" y="937" font-size="16" font-weight="normal">thay</text>
</g></svg>
