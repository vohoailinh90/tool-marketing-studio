id: 10-gift
status: draft
format: portrait
series: "幹事の業務効率化 · #10"
link: survey
slides:
  - layout: cover
    emoji: "🎁"
    eyebrow: "餞別・プレゼントの集金"
    title: "**誰が、いくら、残りはいくら？** 餞別の集金を一画面で"
    subtitle: "プレゼント代の集金は専用タブで。会費とは分けて管理し、必要なら合算もできます。"

  - layout: chat
    title: "チャットで集金すると…"
    group: "佐藤さん送別プレゼント🎁"
    messages:
      - {from: "田中", text: "5,000円、振り込みました！"}
      - {from: "鈴木", text: "私も払ったのですが、名簿にお名前がなくて…"}
      - {me: true, text: "すみません、入金を確認して反映しますね🥲"}
      - {from: "高橋", text: "プレゼント代はいくらでしたか？余りはどうなりますか？"}
      - {me: true, text: "計算してお知らせします…😵"}

  - layout: checklist
    title: "イベントのモードは三つ"
    items:
      - "**Event**：通常のイベント"
      - "**Gift**：プレゼントの集金だけ（幹事・主賓・プレゼント予算・集金期限の欄が加わります）"
      - "**Event + Gift**：両方を一つのイベントで"

  - layout: table
    title: "誰が拠出したか"
    columns: ["名前", "拠出済み", "金額", "報告メール"]
    rows:
      - ["佐藤", "✅", "5,000", "✅"]
      - ["田中", "✅", "3,000", "✅"]
      - ["鈴木", "⬜", {text: "—", tone: muted}, "✅"]
      - ["合計", "2 / 3名", "8,000", ""]
    total_row: true
    note: "数字はイメージです。「報告メール」の列は「拠出済み」とは別に選べます。"

  - layout: flow
    variant: after
    title: "プレゼントから残額まで"
    steps:
      - {emoji: "🎁", text: "プレゼント名・注文リンク・価格を入力"}
      - {emoji: "✅", text: "拠出した人にチェック、金額はダブルクリックで入力"}
      - {emoji: "🧮", text: "**プレゼントの残額**を自動計算"}
      - {emoji: "🔗", text: "**Add the party's money** にチェックで会費を合算し、一つの報告に"}

  - layout: features
    title: "お願いも報告もツールから"
    items:
      - {emoji: "📣", title: "集金のお知らせ", text: "Gift Contribution Notice としてお願いメールを送信"}
      - {emoji: "📊", title: "表つきの報告", text: "HTML形式。表の列が揃い、注文リンクも開けます"}
      - {emoji: "📎", title: "Excelも添付", text: "拠出した人だけを載せたファイル"}
      - {emoji: "🎯", title: "送り先を選べる", text: "拠出済みでなくても、報告を送る相手を選べます"}

  - layout: cta
    emoji: "💬"
    title: "餞別の集金、**どうやって**管理していますか？"
    text: "振込、現金、Excel、チャット…。やり方をコメントで教えてください。"

platforms:
  facebook:
    caption: |
      餞別の集金、「誰がいくら出したか」と「プレゼント代を引いた残り」を覚えていますか？🎁😵

      チャットで集めると、入金の報告があちこちに散らばって、皆さんへ報告するときにメッセージをさかのぼることになりがちです。

      このツールでは、餞別を専用タブで管理します。
      ・拠出した人にチェックを入れ、ダブルクリックで実際の金額を入力
      ・プレゼント名・注文リンク・価格を入れると、プレゼントの残額を計算
      ・「Add the party's money」にチェックで、会費と合わせて一つの報告に

      報告メールは表つきのHTML形式で、注文リンクも開けます。拠出した人だけを載せたExcelも添付でき、送り先も選べます。

      餞別の集金、どうやって管理していますか？コメントで教えてください👇
    first_comment: |
      📋 短いアンケート — 餞別の集金について教えてください：{link}
    hashtags: [幹事, Outlook, 餞別, 集金, 業務効率化]
