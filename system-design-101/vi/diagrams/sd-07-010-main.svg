<svg xmlns="http://www.w3.org/2000/svg" width="320" height="749" viewBox="0 0 320 749" role="img" aria-labelledby="title desc">
<title id="title">Quét mã để trả tiền</title>
<desc id="desc">Hai khung, mỗi khung một lược đồ. Khung một, quầy tạo mã: máy thu ngân gửi mã đơn và số tiền cho nhà cung cấp dịch vụ thanh toán, nơi lưu lại, tạo địa chỉ mã QR và trả về để quầy hiển thị mã, trong chưa đầy một giây. Khung hai, khách quét và trả: ví điện tử báo nhà cung cấp rằng mã đã được trả, nhà cung cấp đánh dấu đã trả và trả kết quả thành công cho ví, rồi báo người bán.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs>
<rect width="320" height="749" fill="#f8fafc"/>
<g font-family="DejaVu Sans, Arial, sans-serif" fill="#0f172a">
