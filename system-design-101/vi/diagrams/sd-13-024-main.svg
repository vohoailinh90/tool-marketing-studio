<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 593" width="320" height="593" role="img" aria-labelledby="title desc">
<title id="title">Vì sao Nginx nhanh và phổ biến</title>
<desc id="desc">Tiến trình master đọc cấu hình và quản lý các worker; mỗi worker xử lý nhiều kết nối bằng I/O không chặn; bốn việc phổ biến là web server, reverse proxy kèm cân bằng tải, bộ nhớ đệm và kết thúc TLS.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#475569" stroke-width="1.5"/></marker></defs>
<rect width="320" height="593" fill="#f8fafc"/><g font-family="DejaVu Sans, Arial, sans-serif" fill="#0f172a">
<text x="16" y="30" font-size="20" font-weight="bold">MASTER · WORKER</text>
<text x="16" y="58" font-size="16" font-weight="normal">Kiến trúc của Nginx</text>
<rect x="16" y="89" width="288" height="101" rx="10" fill="#ede9fe" stroke="#94a3b8"/>
<text x="30" y="117" font-size="16" font-weight="bold">Master</text>
<text x="30" y="144" font-size="16" font-weight="normal">Đọc cấu hình</text>
<text x="30" y="171" font-size="16" font-weight="normal">Khởi động và quản lý worker</text>
<line x1="160" y1="202" x2="160" y2="230" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="16" y="240" width="288" height="128" rx="10" fill="#dbeafe" stroke="#94a3b8"/>
<text x="30" y="268" font-size="16" font-weight="bold">Worker (nhiều)</text>
<text x="30" y="295" font-size="16" font-weight="normal">Mỗi worker nhiều kết nối</text>
<text x="30" y="322" font-size="16" font-weight="normal">Vòng lặp sự kiện, I/O không</text>
<text x="30" y="349" font-size="16" font-weight="normal">chặn</text>
<line x1="160" y1="380" x2="160" y2="408" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="16" y="418" width="288" height="155" rx="10" fill="#dcfce7" stroke="#94a3b8"/>
<text x="30" y="446" font-size="16" font-weight="bold">Việc thường làm</text>
<text x="30" y="473" font-size="16" font-weight="normal">Web server tĩnh</text>
<text x="30" y="500" font-size="16" font-weight="normal">Reverse proxy, cân bằng tải</text>
<text x="30" y="527" font-size="16" font-weight="normal">Cache nội dung</text>
<text x="30" y="554" font-size="16" font-weight="normal">Kết thúc TLS</text>
</g></svg>
