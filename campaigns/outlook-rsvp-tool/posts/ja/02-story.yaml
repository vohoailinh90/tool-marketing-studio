id: 02-story
status: draft
format: portrait
series: "幹事の業務効率化 · #2"
link: survey
slides:
  - layout: cover
    emoji: "🛠️"
    eyebrow: "作った理由"
    title: "なぜ幹事のための**ツールを自作**したのか"
    subtitle: "プログラミングが好きだからではなく、Excelに疲れたからです。"

  - layout: timeline
    title: "1つのExcelから、1つのアプリへ"
    items:
      - {when: "最初", text: "名前、メールアドレス、出欠の列。そして手で塗った大量のセル。"}
      - {when: "それから", text: "会費、2次会、餞別の列が増え、ファイルはどんどん読みにくく。"}
      - {when: "問題", text: "返信は受信トレイに散らばり、更新のたびに**最初から読み直し**。"}
      - {when: "決めたこと", text: "会社にすでにある **Outlook** に、繰り返し作業を任せる。"}

  - layout: quote
    text: "いちばん良いツールは、**情シスに許可を頼まなくていい**ツールだ。"
    author: "設計の原則 #1"
    role: "ツールを作り始めたときに決めたこと"

  - layout: checklist
    title: "大事にしている4つの原則"
    items:
      - "いつもの **Outlook デスクトップ版**で動く — APIキーもアプリ登録も不要"
      - "データは**自分のPC内**（SQLiteファイル1つ）。外部に送らない"
      - "参加者は**ボタンを1回押すだけ**（はい・いいえ・未定）"
      - "案内メールは**日本語・英語・ベトナム語**、日英併記にも対応"

  - layout: cta
    emoji: "👀"
    title: "次回：ツールの動き方を**7ステップ**で"
    text: "いちばん見たいのはどの部分ですか？コメントで教えてください。"

platforms:
  facebook:
    caption: |
      「Googleフォームでよくない？」と聞かれることがあります🤔

      会社では、みんな一日中 Outlook の中にいます。案内も返信も予定も Outlook。別のツールに移ってもらうたびに、返信を忘れる理由がひとつ増えます。

      だから、幹事用のExcelが読めないほど膨らんだとき、逆の発想にしました。Outlook 自身に繰り返し作業をさせる——投票ボタン付きの案内、返信の読み取り、未回答者へのリマインド、集金の記録。

      最初から守っている4つの原則は画像のとおりです。あなたにとって一番大事なのはどれですか？
    first_comment: |
      📋 幹事をされる方、3分のアンケートにご協力いただけると嬉しいです：{link}
    hashtags: [幹事, Outlook, 業務効率化, 自動化, 開発ストーリー]
