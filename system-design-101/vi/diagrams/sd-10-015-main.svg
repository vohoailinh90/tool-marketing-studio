<svg xmlns="http://www.w3.org/2000/svg" width="320" height="1323" viewBox="0 0 320 1323" role="img" aria-labelledby="title desc">
<title id="title">Ba cách một chương trình chạy</title>
<desc id="desc">Ba nhóm xếp dọc. Ngôn ngữ biên dịch như C, C++, Go, hai bước: biên dịch trước, chương trình thành mã máy trước khi chạy; bộ xử lý thực thi thẳng mã máy. Ngôn ngữ bytecode như Java, kèm C# theo bài nguồn, ba bước: biên dịch mã nguồn thành bytecode, dạng trung gian; máy ảo nạp và chạy bytecode, JVM với Java và CLR với C#; tùy chọn, trình JIT biến đoạn chạy nhiều thành mã máy lúc chạy. Ngôn ngữ thông dịch như Python, JavaScript, Ruby, hai bước: chạy thẳng mã nguồn, không tạo tệp chạy được riêng; trình thông dịch đọc và chạy chương trình khi cần. Khung cuối nêu ba điều cần nhớ.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs>
<rect width="320" height="1323" fill="#f8fafc"/>
<g font-family="DejaVu Sans, Arial, sans-serif" fill="#0f172a">
<text x="16" y="34" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">Ba cách một chương</text>
<text x="16" y="58" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">trình chạy</text>
<text x="16" y="84.2" font-size="15" fill="#475569" font-weight="normal" text-anchor="start">Biên dịch, bytecode, thông dịch.</text>
<rect x="8" y="104" width="304" height="234" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="132.2" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Biên dịch · C, C++, Go</text>
<rect x="20" y="149" width="280" height="87" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="46" cy="175" r="14" fill="#1d4ed8"/>
<text x="46" y="180.5" font-size="16" fill="#ffffff" font-weight="bold" text-anchor="middle">1</text>
<text x="70" y="175.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Biên dịch trước</text>
<text x="70" y="199.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Chương trình thành mã</text>
<text x="70" y="218.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">máy, trước khi chạy.</text>
<rect x="20" y="258" width="280" height="68" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="46" cy="284" r="14" fill="#1d4ed8"/>
<text x="46" y="289.5" font-size="16" fill="#ffffff" font-weight="bold" text-anchor="middle">2</text>
<text x="70" y="284.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Bộ xử lý</text>
<text x="70" y="308.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Thực thi thẳng mã máy.</text>
<polyline points="46,238 46,256" fill="none" stroke="#334155" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="8" y="350" width="304" height="384" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="378.2" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Bytecode · Java (C# cùng</text>
<text x="20" y="400.3" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">nhóm theo nguồn)</text>
<rect x="20" y="417" width="280" height="87" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
<circle cx="46" cy="443" r="14" fill="#0f766e"/>
<text x="46" y="448.5" font-size="16" fill="#ffffff" font-weight="bold" text-anchor="middle">1</text>
<text x="70" y="443.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Biên dịch</text>
<text x="70" y="467.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Mã nguồn thành bytecode,</text>
<text x="70" y="486.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">dạng trung gian.</text>
<rect x="20" y="526" width="280" height="87" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
<circle cx="46" cy="552" r="14" fill="#0f766e"/>
<text x="46" y="557.5" font-size="16" fill="#ffffff" font-weight="bold" text-anchor="middle">2</text>
<text x="70" y="552.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Máy ảo</text>
<text x="70" y="576.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Java: JVM; C#: CLR. Nạp và</text>
<text x="70" y="595.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">chạy.</text>
<polyline points="46,506 46,524" fill="none" stroke="#334155" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="20" y="635" width="280" height="87" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
<circle cx="46" cy="661" r="14" fill="#0f766e"/>
<text x="46" y="666.5" font-size="16" fill="#ffffff" font-weight="bold" text-anchor="middle">3</text>
<text x="70" y="661.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">JIT, tùy chọn</text>
<text x="70" y="685.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Đoạn chạy nhiều thành mã</text>
<text x="70" y="704.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">máy lúc chạy.</text>
<polyline points="46,615 46,633" fill="none" stroke="#334155" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="8" y="746" width="304" height="275" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="774.1" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Thông dịch · Python,</text>
<text x="20" y="796.2" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">JavaScript, Ruby</text>
<rect x="20" y="813" width="280" height="87" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
<circle cx="46" cy="839" r="14" fill="#b45309"/>
<text x="46" y="844.5" font-size="16" fill="#ffffff" font-weight="bold" text-anchor="middle">1</text>
<text x="70" y="839.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Chạy thẳng mã nguồn</text>
<text x="70" y="863.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Không tạo tệp chạy được</text>
<text x="70" y="882.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">riêng.</text>
<rect x="20" y="922" width="280" height="87" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
<circle cx="46" cy="948" r="14" fill="#b45309"/>
<text x="46" y="953.5" font-size="16" fill="#ffffff" font-weight="bold" text-anchor="middle">2</text>
<text x="70" y="948.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Trình thông dịch</text>
<text x="70" y="972.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Đọc và chạy chương trình</text>
<text x="70" y="991.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">khi cần.</text>
<polyline points="46,902 46,920" fill="none" stroke="#334155" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="8" y="1033" width="304" height="282" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="1061.1" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Nhớ gì</text>
<rect x="20" y="1078" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="1101" r="11" fill="#16a34a"/>
<polyline points="37.9,1101.4 41.7,1105.4 48.5,1097" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="1104.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Ba nhóm khác nhau ở chỗ</text>
<text x="64" y="1123.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">mã được dịch lúc nào.</text>
<rect x="20" y="1149" width="280" height="83" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="1172" r="11" fill="#16a34a"/>
<polyline points="37.9,1172.4 41.7,1176.4 48.5,1168" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="1175.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Thông dịch thường chạy</text>
<text x="64" y="1194.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">chậm hơn, nhưng ranh giới</text>
<text x="64" y="1214.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">mờ.</text>
