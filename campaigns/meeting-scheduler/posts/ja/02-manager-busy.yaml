    label: "3か国に10人、管理職2人は倍忙しい。全員が空いている60分の枠が、1週間に見つかる確率"
    caption: "同じ部署・同じ国なら約7%です。前回と同じ条件：一般メンバー8人は勤務時間の約30%、管理職2人は約60%が埋まっている前提です。"

  - layout: stat
    eyebrow: "方法1：必須メンバーを絞る"
    before: "3%"
