<text x="16" y="58" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">cao</text>
<text x="16" y="84.2" font-size="15" fill="#475569" font-weight="normal" text-anchor="start">Dịch vụ mượn sách đi qua từng bước.</text>
<rect x="8" y="104" width="304" height="362" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="132.2" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Cách làm việc</text>
