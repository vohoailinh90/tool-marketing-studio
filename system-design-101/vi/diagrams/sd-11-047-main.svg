<svg xmlns="http://www.w3.org/2000/svg" width="320" height="778" viewBox="0 0 320 778" role="img" aria-labelledby="title desc">
<title id="title">So sánh ba đám mây</title>
<desc id="desc">Ba khung. Khung một, bài nguồn: một ảnh so sánh dịch vụ bản 2023 và một dòng giới thiệu, ảnh không được đọc. Khung hai, hai trang so sánh của Microsoft: trang cho người dùng AWS có 194 dòng ghép dịch vụ và 203 tên dịch vụ Azure khác nhau; trang cho người dùng Google Cloud có 140 dòng và 146 tên. Khung ba, Azure làm điểm chung: 58 dịch vụ Azure xuất hiện ở cả hai trang; ví dụ Azure Event Hubs ghép với Kinesis Data Streams và với Cloud Pub/Sub, nhưng mỗi cặp chỉ gần tương đương.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs>
<rect width="320" height="778" fill="#f8fafc"/>
<g font-family="DejaVu Sans, Arial, sans-serif" fill="#0f172a">
<text x="16" y="34" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">So sánh ba đám mây</text>
<text x="16" y="60.2" font-size="15" fill="#475569" font-weight="normal" text-anchor="start">Azure làm điểm chung giữa hai trang</text>
<text x="16" y="79.8" font-size="15" fill="#475569" font-weight="normal" text-anchor="start">so sánh.</text>
<rect x="8" y="99" width="304" height="174" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="127.2" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Bài nguồn</text>
<rect x="20" y="144" width="280" height="46" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="167" r="11" fill="#16a34a"/>
<polyline points="37.9,167.4 41.7,171.4 48.5,163" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="170.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Một ảnh so sánh bản 2023.</text>
<rect x="20" y="198" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="221" r="11" fill="#16a34a"/>
<polyline points="37.9,221.4 41.7,225.4 48.5,217" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="224.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Ảnh không được đọc trong</text>
<text x="64" y="243.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">bài này.</text>
<rect x="8" y="285" width="304" height="211" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="313.2" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Hai trang của Microsoft</text>
<rect x="20" y="330" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="353" r="11" fill="#16a34a"/>
<polyline points="37.9,353.4 41.7,357.4 48.5,349" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="356.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Cho người dùng AWS: 194</text>
<text x="64" y="375.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">dòng, 203 tên Azure.</text>
<rect x="20" y="401" width="280" height="83" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="424" r="11" fill="#16a34a"/>
<polyline points="37.9,424.4 41.7,428.4 48.5,420" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="427.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Cho người dùng Google</text>
<text x="64" y="446.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Cloud: 140 dòng, 146 tên</text>
<text x="64" y="466.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Azure.</text>
<rect x="8" y="508" width="304" height="262" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="536.1" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Azure làm điểm chung</text>
<rect x="20" y="553" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="576" r="11" fill="#16a34a"/>
<polyline points="37.9,576.4 41.7,580.4 48.5,572" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="579.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">58 dịch vụ Azure có ở cả hai</text>
<text x="64" y="598.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">trang.</text>
<rect x="20" y="624" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="647" r="11" fill="#16a34a"/>
<polyline points="37.9,647.4 41.7,651.4 48.5,643" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="650.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Event Hubs: ghép với Kinesis</text>
<text x="64" y="669.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">và với Pub/Sub.</text>
<rect x="20" y="695" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="718" r="11" fill="#16a34a"/>
<polyline points="37.9,718.4 41.7,722.4 48.5,714" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="721.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Mỗi cặp chỉ gần tương</text>
<text x="64" y="740.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">đương.</text>
</g>
</svg>
