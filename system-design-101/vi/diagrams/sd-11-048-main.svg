<circle cx="43" cy="167" r="11" fill="#16a34a"/>
<polyline points="37.9,167.4 41.7,171.4 48.5,163" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="170.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Thu thập, rồi hồ dữ liệu.</text>
<rect x="20" y="198" width="280" height="46" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
