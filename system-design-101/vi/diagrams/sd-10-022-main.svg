<text x="78" y="439.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">biến và các bước tường</text>
<text x="78" y="459.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">minh.</text>
