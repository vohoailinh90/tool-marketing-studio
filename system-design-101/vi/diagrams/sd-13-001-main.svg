<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 1099" width="320" height="1099" role="img" aria-labelledby="title desc">
<title id="title">Mẫu thiết kế Kubernetes khi đưa một API lên cụm</title>
<desc id="desc">Sáu việc cần làm khi đưa một API lên cụm và mẫu giúp bạn: báo sẵn sàng bằng probe, khai báo tài nguyên (requests để đặt Pod, limits giới hạn lúc chạy), chạy migration bằng init container hoặc Job kèm migration idempotent, thêm proxy hoặc gửi nhật ký bằng sidecar, tìm nhau qua Service và DNS, và tắt êm khi bị thay Pod cùng PodDisruptionBudget khi bảo trì node.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#475569" stroke-width="1.5"/></marker></defs>
<rect width="320" height="1099" fill="#f8fafc"/><g font-family="DejaVu Sans, Arial, sans-serif" fill="#0f172a">
<text x="16" y="30" font-size="20" font-weight="bold">ĐƯA MỘT API LÊN CỤM</text>
<text x="16" y="58" font-size="16" font-weight="normal">Việc cần làm → mẫu giúp bạn</text>
<rect x="16" y="89" width="288" height="155" rx="10" fill="#dcfce7" stroke="#94a3b8"/>
<text x="30" y="117" font-size="16" font-weight="bold">Báo cụm biết API sẵn</text>
<text x="30" y="144" font-size="16" font-weight="bold">sàng</text>
<text x="30" y="171" font-size="16" font-weight="normal">Health probe: readiness</text>
<text x="30" y="198" font-size="16" font-weight="normal">trước khi nhận traffic,</text>
<text x="30" y="225" font-size="16" font-weight="normal">liveness khi kẹt</text>
<rect x="16" y="256" width="288" height="182" rx="10" fill="#dbeafe" stroke="#94a3b8"/>
<text x="30" y="284" font-size="16" font-weight="bold">Cho cụm biết cần bao</text>
<text x="30" y="311" font-size="16" font-weight="bold">nhiêu</text>
<text x="30" y="338" font-size="16" font-weight="normal">requests: scheduler dùng để</text>
<text x="30" y="365" font-size="16" font-weight="normal">đặt Pod</text>
<text x="30" y="392" font-size="16" font-weight="normal">limits: giới hạn mức dùng</text>
<text x="30" y="419" font-size="16" font-weight="normal">khi chạy</text>
<rect x="16" y="450" width="288" height="209" rx="10" fill="#ede9fe" stroke="#94a3b8"/>
<text x="30" y="478" font-size="16" font-weight="bold">Chạy migration trước</text>
<text x="30" y="505" font-size="16" font-weight="bold">khi API chạy</text>
<text x="30" y="532" font-size="16" font-weight="normal">Init container chạy ở mỗi</text>
<text x="30" y="559" font-size="16" font-weight="normal">Pod</text>
<text x="30" y="586" font-size="16" font-weight="normal">Job chạy tới khi xong nhưng</text>
<text x="30" y="613" font-size="16" font-weight="normal">có thể chạy lại: migration</text>
<text x="30" y="640" font-size="16" font-weight="normal">cần idempotent hoặc có khóa</text>
<rect x="16" y="671" width="288" height="101" rx="10" fill="#fef3c7" stroke="#94a3b8"/>
<text x="30" y="699" font-size="16" font-weight="bold">Thêm nhật ký hay proxy</text>
<text x="30" y="726" font-size="16" font-weight="bold">mà không sửa API</text>
<text x="30" y="753" font-size="16" font-weight="normal">Sidecar chạy cùng Pod</text>
<rect x="16" y="784" width="288" height="101" rx="10" fill="#e2e8f0" stroke="#94a3b8"/>
<text x="30" y="812" font-size="16" font-weight="bold">API khác tìm tới API</text>
<text x="30" y="839" font-size="16" font-weight="bold">này</text>
<text x="30" y="866" font-size="16" font-weight="normal">Service và tên DNS của cụm</text>
<rect x="16" y="897" width="288" height="182" rx="10" fill="#fee2e2" stroke="#94a3b8"/>
<text x="30" y="925" font-size="16" font-weight="bold">Bị thay Pod mà không</text>
<text x="30" y="952" font-size="16" font-weight="bold">rớt yêu cầu</text>
<text x="30" y="979" font-size="16" font-weight="normal">Tắt êm: xử lý SIGTERM, thời</text>
<text x="30" y="1006" font-size="16" font-weight="normal">gian ân hạn</text>
<text x="30" y="1033" font-size="16" font-weight="normal">PodDisruptionBudget khi bảo</text>
<text x="30" y="1060" font-size="16" font-weight="normal">trì node</text>
</g></svg>
