<svg xmlns="http://www.w3.org/2000/svg" width="320" height="1807" viewBox="0 0 320 1807" role="img" aria-labelledby="title desc">
<title id="title">Mười một bước lên cấp cao</title>
<desc id="desc">Bốn chuỗi bước, mười một bước, minh họa bằng dịch vụ mượn sách. Cách làm việc: một phiếu việc cho mỗi thay đổi; viết hàm tính phí trả muộn bằng một ngôn ngữ; đặt tên và giao diện cho thao tác mượn sách. Vận hành và dữ liệu: chạy dịch vụ trên máy chủ và đám mây; đăng nhập an toàn và kiểm thử; lưu phiếu mượn trong cơ sở dữ liệu. Tự động hóa và nền tảng: mỗi thay đổi tự chạy kiểm thử; tìm sách trong một triệu mã bằng 20 phép so sánh thay vì một triệu. Tầm nhìn: bộ nhớ đệm và cân bằng tải cho ngày đông người; truyền bảng giảm giá vào hàm thay vì cố định trong mã; xem gợi ý của công cụ AI như mã của người lạ. Khung cuối nêu ba điều cần nhớ.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs>
<rect width="320" height="1807" fill="#f8fafc"/>
<g font-family="DejaVu Sans, Arial, sans-serif" fill="#0f172a">
