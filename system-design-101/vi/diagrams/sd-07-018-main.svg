<text x="20" y="795.1" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">3. Cuối ngày: chốt và quyết</text>
<text x="20" y="817.2" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">toán</text>
<rect x="20" y="834" width="280" height="87" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
<circle cx="46" cy="860" r="14" fill="#b45309"/>
<text x="46" y="865.5" font-size="16" fill="#ffffff" font-weight="bold" text-anchor="middle">1</text>
<text x="70" y="860.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Cửa hàng bấm chốt</text>
<text x="70" y="884.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Lô giao dịch đi tới ngân</text>
<text x="70" y="903.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">hàng thu, rồi tới mạng thẻ.</text>
<rect x="20" y="943" width="280" height="87" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
<circle cx="46" cy="969" r="14" fill="#b45309"/>
