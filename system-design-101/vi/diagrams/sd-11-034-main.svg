<svg xmlns="http://www.w3.org/2000/svg" width="360" height="420" viewBox="0 0 360 420" role="img" aria-labelledby="title desc">
<title id="title">Chuyển hệ thống sang cloud native từng bước</title>
<desc id="desc">Hiểu hiện trạng: State • dependency • cách deploy: Chọn một mục tiêu đo được; Tự động và quan sát: Build/release • IaC • health: Metrics/log • rollback; Co giãn từng phần: Thay instance an toàn: Orchestration/serverless khi cần. Các khung là ý chính để đối chiếu, không nhất thiết là các bước tuần tự.</desc>
<rect width="360" height="420" fill="#f8fafc"/>
