<text x="24" y="218" font-size="18">Tái dùng môi trường</text>
<text x="24" y="244" font-size="18">PC / SnapStart khi phù hợp</text>
<rect x="12" y="276" width="336" height="102" rx="12" fill="#fef3c7" stroke="#64748b"/>
<text x="24" y="303" font-size="18" font-weight="bold">Đo trước khi chỉnh</text>
<text x="24" y="332" font-size="18">Cold start và warm start</text>
<text x="24" y="358" font-size="18">p95/p99 + chi phí</text>
