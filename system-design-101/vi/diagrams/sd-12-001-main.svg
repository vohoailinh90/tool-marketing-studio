<svg xmlns="http://www.w3.org/2000/svg" width="320" height="855" viewBox="0 0 320 855" role="img" aria-labelledby="title desc">
<title id="title">AirTag tìm đồ thế nào</title>
<desc id="desc">Hai khung. Khung một, đường đi của một lần định vị: AirTag phát tín hiệu Bluetooth kèm một mã công khai; thiết bị Apple đi ngang nhận tín hiệu rồi gửi vị trí của mình, đã mã hóa, lên máy chủ Apple; chủ đồ mở ứng dụng Find My và giải mã để xem vị trí trên bản đồ. Khung hai, ba điều nên nhớ: bên đi ngang không biết đồ của ai, Apple không đọc được vị trí, và nơi ít thiết bị Apple thì vị trí cũ hoặc thiếu.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs>
<rect width="320" height="855" fill="#f8fafc"/>
<g font-family="DejaVu Sans, Arial, sans-serif" fill="#0f172a">
<text x="16" y="34" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">AirTag tìm đồ thế nào</text>
<text x="16" y="60.2" font-size="15" fill="#475569" font-weight="normal" text-anchor="start">Tín hiệu Bluetooth, thiết bị đi ngang,</text>
<text x="16" y="79.8" font-size="15" fill="#475569" font-weight="normal" text-anchor="start">bản đồ.</text>
<rect x="8" y="99" width="304" height="491" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="127.2" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Một lần định vị</text>
<rect x="20" y="144" width="280" height="87" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="46" cy="170" r="14" fill="#1d4ed8"/>
<text x="46" y="175.5" font-size="16" fill="#ffffff" font-weight="bold" text-anchor="middle">1</text>
<text x="70" y="170.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">AirTag phát tín hiệu</text>
<text x="70" y="194.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Bluetooth, kèm mã công</text>
<text x="70" y="213.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">khai đổi theo thời gian.</text>
<rect x="20" y="253" width="280" height="107" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="46" cy="279" r="14" fill="#1d4ed8"/>
<text x="46" y="284.5" font-size="16" fill="#ffffff" font-weight="bold" text-anchor="middle">2</text>
<text x="70" y="279.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Điện thoại đi ngang</text>
<text x="70" y="299.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">nghe</text>
<text x="70" y="323.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Thiết bị Apple lấy vị trí của</text>
<text x="70" y="342.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">chính nó.</text>
<polyline points="46,233 46,251" fill="none" stroke="#334155" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="20" y="382" width="280" height="87" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="46" cy="408" r="14" fill="#1d4ed8"/>
<text x="46" y="413.5" font-size="16" fill="#ffffff" font-weight="bold" text-anchor="middle">3</text>
<text x="70" y="408.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Gửi báo cáo mã hóa</text>
<text x="70" y="432.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Mã hóa bằng mã công khai,</text>
<text x="70" y="451.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">gửi lên Apple.</text>
<polyline points="46,362 46,380" fill="none" stroke="#334155" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="20" y="491" width="280" height="87" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="46" cy="517" r="14" fill="#1d4ed8"/>
<text x="46" y="522.5" font-size="16" fill="#ffffff" font-weight="bold" text-anchor="middle">4</text>
<text x="70" y="517.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Chủ đồ xem bản đồ</text>
<text x="70" y="541.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Find My giải mã bằng khóa</text>
<text x="70" y="560.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">riêng.</text>
<polyline points="46,471 46,489" fill="none" stroke="#334155" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="8" y="602" width="304" height="245" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="630.1" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Ba điều nên nhớ</text>
<rect x="20" y="647" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="670" r="11" fill="#16a34a"/>
<polyline points="37.9,670.4 41.7,674.4 48.5,666" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="673.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Người đi ngang không biết</text>
<text x="64" y="692.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">thẻ của ai.</text>
<rect x="20" y="718" width="280" height="46" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="741" r="11" fill="#16a34a"/>
<polyline points="37.9,741.4 41.7,745.4 48.5,737" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="744.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Apple không đọc được vị trí.</text>
<rect x="20" y="772" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="795" r="11" fill="#16a34a"/>
<polyline points="37.9,795.4 41.7,799.4 48.5,791" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="798.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Ít thiết bị Apple thì vị trí cũ</text>
<text x="64" y="817.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">hoặc thiếu.</text>
</g>
</svg>
