<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 968" width="320" height="968" role="img" aria-labelledby="title desc">
<title id="title">Cookie HTTP và các thuộc tính</title>
<desc id="desc">Máy chủ trả Set-Cookie gồm tên, giá trị và các thuộc tính; trình duyệt lưu lại. Mỗi yêu cầu sau, trình duyệt tự quyết cookie nào được gắn vào tiêu đề Cookie. Domain và Path giới hạn địa chỉ nhận cookie. Secure chỉ gửi qua HTTPS. HttpOnly để JavaScript không đọc được cookie. SameSite quyết định có gửi cookie trong yêu cầu từ trang khác site hay không, với Strict, Lax và None; None phải kèm Secure. Expires hoặc Max-Age đặt thời hạn; không có thì là cookie phiên. Nên khai SameSite rõ ràng vì trình duyệt có thể xử lý cookie không khai theo cách khác nhau.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#475569" stroke-width="1.5"/></marker></defs>
<rect width="320" height="968" fill="#f8fafc"/>
<g font-family="DejaVu Sans, Arial, sans-serif" fill="#0f172a">
<text x="16" y="30" font-size="21" font-weight="bold">COOKIE HTTP</text>
<text x="16" y="54" font-size="21" font-weight="bold">VÀ THUỘC TÍNH</text>
<rect x="16" y="80" width="288" height="100" rx="12" fill="#e2e8f0" stroke="#94a3b8"/>
<text x="29" y="109" font-size="16" font-weight="bold">1 · Set-Cookie</text>
<text x="29" y="137" font-size="16" font-weight="normal">Tên, giá trị và thuộc tính; trình</text>
<text x="29" y="161" font-size="16" font-weight="normal">duyệt lưu lại.</text>
<line x1="160" y1="181" x2="160" y2="196" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="16" y="198" width="288" height="100" rx="12" fill="#e2e8f0" stroke="#94a3b8"/>
<text x="29" y="227" font-size="16" font-weight="bold">2 · Mỗi yêu cầu sau</text>
<text x="29" y="255" font-size="16" font-weight="normal">Trình duyệt tự quyết cookie nào</text>
<text x="29" y="279" font-size="16" font-weight="normal">gắn vào tiêu đề Cookie.</text>
<rect x="16" y="310" width="288" height="76" rx="12" fill="#dbeafe" stroke="#94a3b8"/>
<text x="29" y="339" font-size="16" font-weight="bold">Domain, Path</text>
<text x="29" y="367" font-size="16" font-weight="normal">Giới hạn địa chỉ nhận cookie.</text>
<rect x="16" y="394" width="288" height="76" rx="12" fill="#ede9fe" stroke="#94a3b8"/>
<text x="29" y="423" font-size="16" font-weight="bold">Secure</text>
<text x="29" y="451" font-size="16" font-weight="normal">Chỉ gửi qua HTTPS.</text>
<rect x="16" y="478" width="288" height="100" rx="12" fill="#dcfce7" stroke="#94a3b8"/>
<text x="29" y="507" font-size="16" font-weight="bold">HttpOnly</text>
<text x="29" y="535" font-size="16" font-weight="normal">JavaScript không đọc được</text>
<text x="29" y="559" font-size="16" font-weight="normal">cookie; máy chủ vẫn nhận.</text>
<rect x="16" y="586" width="288" height="148" rx="12" fill="#fef3c7" stroke="#94a3b8"/>
<text x="29" y="615" font-size="16" font-weight="bold">SameSite</text>
<text x="29" y="643" font-size="16" font-weight="normal">Strict: không gửi xuyên site.</text>
<text x="29" y="667" font-size="16" font-weight="normal">Lax: gửi khi bấm liên kết. None:</text>
<text x="29" y="691" font-size="16" font-weight="normal">gửi cả xuyên site, phải kèm</text>
<text x="29" y="715" font-size="16" font-weight="normal">Secure.</text>
<rect x="16" y="742" width="288" height="100" rx="12" fill="#ffffff" stroke="#94a3b8"/>
<text x="29" y="771" font-size="16" font-weight="bold">Thời hạn</text>
<text x="29" y="799" font-size="16" font-weight="normal">Expires hoặc Max-Age; không có</text>
<text x="29" y="823" font-size="16" font-weight="normal">thì là cookie phiên.</text>
<rect x="16" y="854" width="288" height="100" rx="12" fill="#fee2e2" stroke="#94a3b8"/>
<text x="29" y="883" font-size="16" font-weight="bold">Nên khai SameSite rõ ràng</text>
<text x="29" y="911" font-size="16" font-weight="normal">Cookie không khai có thể được</text>
<text x="29" y="935" font-size="16" font-weight="normal">xử lý khác nhau tùy trình duyệt.</text>
</g></svg>
