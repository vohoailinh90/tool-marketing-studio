<svg xmlns="http://www.w3.org/2000/svg" width="320" height="1266" viewBox="0 0 320 1266" role="img" aria-labelledby="title desc">
<title id="title">Kiến trúc hướng sự kiện của McDonald's</title>
<desc id="desc">Ba khung. Khung một: bốn thành phần chuẩn hóa sự kiện, gồm sổ đăng ký sự kiện giữ schema chuẩn, SDK riêng để xử lý sự kiện và lỗi, cổng sự kiện xác thực và phân quyền, tiện ích sửa sự kiện và giữ cụm khỏe. Khung hai: luồng mở rộng, bên phát chia sự kiện theo miền, mỗi miền một cụm MSK, cụm tự mở rộng theo chỉ số như CPU. Khung ba nêu ba điều cần nhớ.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs>
<rect width="320" height="1266" fill="#f8fafc"/>
<g font-family="DejaVu Sans, Arial, sans-serif" fill="#0f172a">
<text x="16" y="34" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">Kiến trúc hướng sự kiện</text>
<text x="16" y="58" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">của McDonald's</text>
<text x="16" y="84.2" font-size="15" fill="#475569" font-weight="normal" text-anchor="start">Chuẩn hóa sự kiện trước, rồi mới mở</text>
<text x="16" y="103.8" font-size="15" fill="#475569" font-weight="normal" text-anchor="start">rộng xử lý.</text>
<rect x="8" y="123" width="304" height="447" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="151.2" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Chuẩn hóa sự kiện</text>
<rect x="20" y="168" width="280" height="87" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="50" cy="211.5" r="18" fill="#1d4ed8"/><g transform="translate(39.2 200.7) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v16"/><path d="M20.001 19A2 2 0 0022 17V5a2 2 0 00-1.999-2L16 3.002A5 5 0 0012 5a5 5 0 00-4-2H4a2 2 0 00-2 2v12a2 2 0 001.999 2H8a5 5 0 014 2 5 5 0 014-2z"/></g>
<text x="78" y="194.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Sổ đăng ký sự kiện</text>
<text x="78" y="218.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Định nghĩa schema chuẩn</text>
<text x="78" y="237.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">cho mọi sự kiện.</text>
<rect x="20" y="269" width="280" height="87" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="50" cy="312.5" r="18" fill="#1d4ed8"/><g transform="translate(39.2 301.7) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m16 18 6-6-6-6"/><path d="m8 6-6 6 6 6"/></g>
<text x="78" y="295.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">SDK riêng</text>
<text x="78" y="319.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Xử lý sự kiện và lỗi theo</text>
<text x="78" y="338.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">một cách chung.</text>
<rect x="20" y="370" width="280" height="87" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="50" cy="413.5" r="18" fill="#1d4ed8"/><g transform="translate(39.2 402.7) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/></g>
<text x="78" y="396.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Cổng sự kiện</text>
<text x="78" y="420.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Xác thực danh tính và</text>
<text x="78" y="439.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">phân quyền.</text>
<rect x="20" y="471" width="280" height="87" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="50" cy="514.5" r="18" fill="#1d4ed8"/><g transform="translate(39.2 503.7) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.106-3.105c.32-.322.863-.22.983.218a6 6 0 0 1-8.259 7.057l-7.91 7.91a1 1 0 0 1-2.999-3l7.91-7.91a6 6 0 0 1 7.057-8.259c.438.12.54.662.219.984z"/></g>
<text x="78" y="497.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Tiện ích và công cụ</text>
<text x="78" y="521.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Sửa sự kiện hỏng, giữ cụm</text>
<text x="78" y="540.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">khỏe, việc quản trị.</text>
<rect x="8" y="582" width="304" height="402" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="610.1" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Mở rộng trong một vùng</text>
<rect x="20" y="627" width="280" height="87" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
<circle cx="50" cy="670.5" r="18" fill="#0f766e"/><g transform="translate(39.2 659.7) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.536 21.686a.5.5 0 0 0 .937-.024l6.5-19a.496.496 0 0 0-.635-.635l-19 6.5a.5.5 0 0 0-.024.937l7.93 3.18a2 2 0 0 1 1.112 1.11z"/><path d="m21.854 2.147-10.94 10.939"/></g>
<text x="78" y="653.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Bên phát sự kiện</text>
<text x="78" y="677.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Chia sự kiện theo miền</text>
<text x="78" y="696.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">nghiệp vụ.</text>
<rect x="20" y="746" width="280" height="107" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
<circle cx="50" cy="799.5" r="18" fill="#0f766e"/><g transform="translate(39.2 788.7) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.97 12.92A2 2 0 0 0 2 14.63v3.24a2 2 0 0 0 .97 1.71l3 1.8a2 2 0 0 0 2.06 0L12 19v-5.5l-5-3-4.03 2.42Z"/><path d="m7 16.5-4.74-2.85"/><path d="m7 16.5 5-3"/><path d="M7 16.5v5.17"/><path d="M12 13.5V19l3.97 2.38a2 2 0 0 0 2.06 0l3-1.8a2 2 0 0 0 .97-1.71v-3.24a2 2 0 0 0-.97-1.71L17 10.5l-5 3Z"/><path d="m17 16.5-5-3"/><path d="m17 16.5 4.74-2.85"/><path d="M17 16.5v5.17"/><path d="M7.97 4.42A2 2 0 0 0 7 6.13v4.37l5 3 5-3V6.13a2 2 0 0 0-.97-1.71l-3-1.8a2 2 0 0 0-2.06 0l-3 1.8Z"/><path d="M12 8 7.26 5.15"/><path d="m12 8 4.74-2.85"/><path d="M12 13.5V8"/></g>
<text x="78" y="772.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Cụm MSK của từng</text>
<text x="78" y="792.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">miền</text>
<text x="78" y="816.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Mỗi miền được một cụm</text>
<text x="78" y="835.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">riêng xử lý.</text>
<rect x="20" y="885" width="280" height="87" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
<circle cx="50" cy="928.5" r="18" fill="#0f766e"/><g transform="translate(39.2 917.7) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 14 4-4"/><path d="M3.34 19a10 10 0 1 1 17.32 0"/></g>
<text x="78" y="911.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Tự mở rộng</text>
<text x="78" y="935.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Theo chỉ số của cụm, như</text>
<text x="78" y="954.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">mức dùng CPU.</text>
<polyline points="160,716 160,744" fill="none" stroke="#334155" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="160,855 160,883" fill="none" stroke="#334155" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="8" y="996" width="304" height="262" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="1024.1" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Nhớ gì</text>
<rect x="20" y="1041" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="1064" r="11" fill="#16a34a"/>
<polyline points="37.9,1064.4 41.7,1068.4 48.5,1060" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="1067.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Schema chung giúp mọi đội</text>
<text x="64" y="1086.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">hiểu cùng một sự kiện.</text>
<rect x="20" y="1112" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="1135" r="11" fill="#16a34a"/>
<polyline points="37.9,1135.4 41.7,1139.4 48.5,1131" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="1138.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Chia theo miền giữ sự cố của</text>
<text x="64" y="1157.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">miền này khỏi miền khác.</text>
<rect x="20" y="1183" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="1206" r="11" fill="#16a34a"/>
<polyline points="37.9,1206.4 41.7,1210.4 48.5,1202" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="1209.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Kiến trúc theo vùng cho tính</text>
<text x="64" y="1228.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">sẵn sàng toàn cầu.</text>
</g>
</svg>
