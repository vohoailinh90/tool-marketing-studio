<svg xmlns="http://www.w3.org/2000/svg" width="320" height="1016" viewBox="0 0 320 1016" role="img" aria-labelledby="title desc">
<title id="title">Chat một-một: đăng nhập và gửi tin</title>
<desc id="desc">Hai khung. Khung một, đăng nhập: người dùng mở kết nối WebSocket, dịch vụ hiện diện cập nhật trạng thái và báo cho bạn bè. Khung hai, gửi tin: tin đi qua dịch vụ chat, dịch vụ cấp mã thứ tự và lưu vào kho tin nhắn, rồi hàng đợi đồng bộ kiểm tra người nhận; nếu đang trực tuyến thì đẩy qua WebSocket, nếu ngoại tuyến thì gửi thông báo đẩy.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs>
<rect width="320" height="1016" fill="#f8fafc"/>
<g font-family="DejaVu Sans, Arial, sans-serif" fill="#0f172a">
<text x="16" y="34" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">Chat một-một: đăng</text>
<text x="16" y="58" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">nhập và gửi tin</text>
<text x="16" y="84.2" font-size="15" fill="#475569" font-weight="normal" text-anchor="start">Mã thứ tự, kiểm tra trực tuyến, và hai</text>
<text x="16" y="103.8" font-size="15" fill="#475569" font-weight="normal" text-anchor="start">đường tới người nhận.</text>
<rect x="8" y="123" width="304" height="362" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="151.2" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Đăng nhập</text>
<rect x="20" y="168" width="280" height="87" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="46" cy="194" r="14" fill="#1d4ed8"/>
<text x="46" y="199.5" font-size="16" fill="#ffffff" font-weight="bold" text-anchor="middle">1</text>
<text x="70" y="194.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Mở kết nối</text>
<text x="70" y="218.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Alice mở kết nối WebSocket</text>
<text x="70" y="237.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">với máy chủ.</text>
<rect x="20" y="277" width="280" height="87" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="46" cy="303" r="14" fill="#1d4ed8"/>
<text x="46" y="308.5" font-size="16" fill="#ffffff" font-weight="bold" text-anchor="middle">2</text>
<text x="70" y="303.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Cập nhật hiện diện</text>
<text x="70" y="327.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Dịch vụ hiện diện ghi Alice</text>
<text x="70" y="346.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">đang trực tuyến.</text>
<polyline points="46,257 46,275" fill="none" stroke="#334155" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="20" y="386" width="280" height="87" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="46" cy="412" r="14" fill="#1d4ed8"/>
<text x="46" y="417.5" font-size="16" fill="#ffffff" font-weight="bold" text-anchor="middle">3</text>
<text x="70" y="412.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Báo bạn bè</text>
<text x="70" y="436.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Bạn bè của Alice nhận trạng</text>
<text x="70" y="455.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">thái mới.</text>
<polyline points="46,366 46,384" fill="none" stroke="#334155" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="8" y="497" width="304" height="511" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="525.1" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Gửi một tin</text>
<rect x="20" y="542" width="280" height="87" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
<circle cx="46" cy="568" r="14" fill="#0f766e"/>
<text x="46" y="573.5" font-size="16" fill="#ffffff" font-weight="bold" text-anchor="middle">1</text>
<text x="70" y="568.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Đến dịch vụ chat</text>
<text x="70" y="592.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Tin của Alice vào dịch vụ</text>
<text x="70" y="611.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">chat A.</text>
<rect x="20" y="651" width="280" height="87" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
<circle cx="46" cy="677" r="14" fill="#0f766e"/>
<text x="46" y="682.5" font-size="16" fill="#ffffff" font-weight="bold" text-anchor="middle">2</text>
<text x="70" y="677.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Cấp mã, lưu tin</text>
<text x="70" y="701.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Dịch vụ cấp mã thứ tự rồi</text>
<text x="70" y="720.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">lưu vào kho tin nhắn.</text>
<polyline points="46,631 46,649" fill="none" stroke="#334155" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="20" y="760" width="280" height="107" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
<circle cx="46" cy="786" r="14" fill="#0f766e"/>
<text x="46" y="791.5" font-size="16" fill="#ffffff" font-weight="bold" text-anchor="middle">3</text>
<text x="70" y="786.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Đồng bộ</text>
<text x="70" y="810.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Tin vào hàng đợi đồng bộ;</text>
<text x="70" y="829.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">kiểm tra Bob có trực tuyến</text>
<text x="70" y="849.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">không.</text>
<polyline points="46,740 46,758" fill="none" stroke="#334155" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="20" y="889" width="280" height="107" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
<circle cx="46" cy="915" r="14" fill="#0f766e"/>
<text x="46" y="920.5" font-size="16" fill="#ffffff" font-weight="bold" text-anchor="middle">4</text>
<text x="70" y="915.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Đến Bob</text>
<text x="70" y="939.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Trực tuyến thì đẩy qua</text>
<text x="70" y="958.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">WebSocket, ngoại tuyến thì</text>
<text x="70" y="978.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">gửi thông báo đẩy.</text>
<polyline points="46,869 46,887" fill="none" stroke="#334155" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
</g>
</svg>
