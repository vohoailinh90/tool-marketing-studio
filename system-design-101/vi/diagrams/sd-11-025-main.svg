<svg xmlns="http://www.w3.org/2000/svg" width="360" height="420" viewBox="0 0 360 420" role="img" aria-labelledby="title desc">
<title id="title">Quản lý cấu hình từ hạ tầng tới ứng dụng</title>
<desc id="desc">Hạ tầng: IaC: VPC, máy, DB: Review và kiểm drift; Máy và ứng dụng: Quản lý gói/file/service: Runtime: endpoint, flag; Thay đổi an toàn: Validate → canary → quan sát: Secret riêng • rollback rõ. Các khung là ý chính để đối chiếu, không nhất thiết là các bước tuần tự.</desc>
<rect width="360" height="420" fill="#f8fafc"/>
<g font-family="DejaVu Sans, sans-serif" fill="#0f172a">
