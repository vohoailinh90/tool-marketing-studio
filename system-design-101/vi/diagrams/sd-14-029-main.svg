<svg xmlns="http://www.w3.org/2000/svg" width="320" height="1131" viewBox="0 0 320 1131" role="img" aria-labelledby="title desc">
<title id="title">Chọn luồng OAuth theo người có mặt</title>
<desc id="desc">Hai khung. Khung một, bốn thẻ luồng OAuth: mã ủy quyền kèm PKCE là mặc định khi có người dùng; client credentials khi không có người dùng, dịch vụ tự lấy token; implicit để token nằm trên địa chỉ chuyển hướng, nên bỏ; luồng mật khẩu đưa mật khẩu người dùng cho ứng dụng, không dùng. Khung hai: ứng dụng xin mã kèm challenge và nhận mã; kẻ trộm mã thiếu verifier bị từ chối; ứng dụng gửi mã cùng verifier thì nhận token.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs>
<rect width="320" height="1131" fill="#f8fafc"/>
<g font-family="DejaVu Sans, Arial, sans-serif" fill="#0f172a">
<text x="16" y="34" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">Chọn luồng OAuth theo</text>
<text x="16" y="58" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">người có mặt</text>
<text x="16" y="84.2" font-size="15" fill="#475569" font-weight="normal" text-anchor="start">Ai có mặt, và ứng dụng giữ kín được</text>
<text x="16" y="103.8" font-size="15" fill="#475569" font-weight="normal" text-anchor="start">bí mật không?</text>
<rect x="8" y="123" width="304" height="467" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="151.2" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Bốn luồng, bốn tình huống</text>
<rect x="20" y="168" width="280" height="107" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="50" cy="221.5" r="18" fill="#1d4ed8"/><g transform="translate(39.2 210.7) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></g>
<text x="78" y="194.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Mã ủy quyền + PKCE</text>
<text x="78" y="218.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Có người dùng; mật khẩu</text>
<text x="78" y="237.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">gõ ở máy chủ ủy quyền.</text>
<text x="78" y="257.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Mặc định.</text>
<rect x="20" y="289" width="280" height="87" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="50" cy="332.5" r="18" fill="#1d4ed8"/><g transform="translate(39.2 321.7) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect height="8" rx="2" ry="2" width="20" x="2" y="2"/><rect height="8" rx="2" ry="2" width="20" x="2" y="14"/><line x1="6" x2="6.01" y1="6" y2="6"/><line x1="6" x2="6.01" y1="18" y2="18"/></g>
<text x="78" y="315.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Client credentials</text>
<text x="78" y="339.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Không có người dùng; dịch</text>
<text x="78" y="358.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">vụ tự lấy token.</text>
<rect x="20" y="390" width="280" height="87" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="50" cy="433.5" r="18" fill="#1d4ed8"/><g transform="translate(39.2 422.7) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/></g>
<text x="78" y="416.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Implicit</text>
<text x="78" y="440.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Token nằm trên địa chỉ</text>
<text x="78" y="459.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">chuyển hướng. Bỏ.</text>
<rect x="20" y="491" width="280" height="87" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="50" cy="534.5" r="18" fill="#1d4ed8"/><g transform="translate(39.2 523.7) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.586 17.414A2 2 0 0 0 2 18.828V21a1 1 0 0 0 1 1h3a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h1a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h.172a2 2 0 0 0 1.414-.586l.814-.814a6.5 6.5 0 1 0-4-4z"/><circle cx="16.5" cy="7.5" fill="#FFFFFF" r=".5"/></g>
<text x="78" y="517.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Luồng mật khẩu</text>
<text x="78" y="541.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Ứng dụng cầm mật khẩu</text>
<text x="78" y="560.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">người dùng. Không dùng.</text>
<rect x="8" y="602" width="304" height="521" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="630.1" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">PKCE: mã bị trộm thì vô</text>
<text x="20" y="652.2" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">dụng</text>
<rect x="20" y="669" width="84" height="105" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
<circle cx="62" cy="691" r="14" fill="#0f766e"/><g transform="translate(53.6 682.6) scale(0.7)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect height="20" rx="2" ry="2" width="14" x="5" y="2"/><path d="M12 18h.01"/></g>
<text x="62" y="722.9" font-size="15" fill="#0f172a" font-weight="bold" text-anchor="middle">Ứng</text>
<text x="62" y="741.6" font-size="15" fill="#0f172a" font-weight="bold" text-anchor="middle">dụng</text>
<rect x="118" y="669" width="84" height="105" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
<circle cx="160" cy="691" r="14" fill="#0f766e"/><g transform="translate(151.6 682.6) scale(0.7)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/></g>
<text x="160" y="722.9" font-size="15" fill="#0f172a" font-weight="bold" text-anchor="middle">Máy chủ</text>
<text x="160" y="741.6" font-size="15" fill="#0f172a" font-weight="bold" text-anchor="middle">ủy</text>
<text x="160" y="760.4" font-size="15" fill="#0f172a" font-weight="bold" text-anchor="middle">quyền</text>
<rect x="216" y="669" width="84" height="105" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
<circle cx="258" cy="691" r="14" fill="#0f766e"/><g transform="translate(249.6 682.6) scale(0.7)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20v-9"/><path d="M14 7a4 4 0 0 1 4 4v3a6 6 0 0 1-12 0v-3a4 4 0 0 1 4-4z"/><path d="M14.12 3.88 16 2"/><path d="M21 21a4 4 0 0 0-3.81-4"/><path d="M21 5a4 4 0 0 1-3.55 3.97"/><path d="M22 13h-4"/><path d="M3 21a4 4 0 0 1 3.81-4"/><path d="M3 5a4 4 0 0 0 3.55 3.97"/><path d="M6 13H2"/><path d="m8 2 1.88 1.88"/><path d="M9 7.13V6a3 3 0 1 1 6 0v1.13"/></g>
<text x="258" y="722.9" font-size="15" fill="#0f172a" font-weight="bold" text-anchor="middle">Kẻ trộm</text>
<polyline points="62,774 62,1111" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4 4"/>
<polyline points="160,774 160,1111" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4 4"/>
<polyline points="258,774 258,1111" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4 4"/>
<text x="111" y="802.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="middle">Xin mã +</text>
<text x="111" y="821.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="middle">challenge</text>
<polyline points="63,835 157,835" fill="none" stroke="#334155" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="111" y="863.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="middle">Mã</text>
<polyline points="159,877 65,877" fill="none" stroke="#334155" stroke-width="1.8" stroke-dasharray="5 4" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="209" y="905.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="middle">Mã trộm,</text>
<text x="209" y="924.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="middle">thiếu</text>
<text x="209" y="944.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="middle">verifier</text>
<polyline points="257,958 163,958" fill="none" stroke="#334155" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="209" y="986.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="middle">Từ chối</text>
<polyline points="161,1000 255,1000" fill="none" stroke="#334155" stroke-width="1.8" stroke-dasharray="5 4" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="111" y="1028.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="middle">Mã +</text>
<text x="111" y="1047.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="middle">verifier</text>
<polyline points="63,1061 157,1061" fill="none" stroke="#334155" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="111" y="1089.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="middle">Token</text>
<polyline points="159,1103 65,1103" fill="none" stroke="#334155" stroke-width="1.8" stroke-dasharray="5 4" stroke-linejoin="round" marker-end="url(#arrow)"/>
</g>
</svg>
