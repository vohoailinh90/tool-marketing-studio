id: 02-office
status: draft
format: portrait
series: "AIとの開発 · #2"
link: ""
slides:
  - layout: cover
    emoji: "🏢"
    eyebrow: "AIの作業状況を見える化"
    title: "**誰が何を**、一目で"
    subtitle: "エージェントごとに1席、メインセッションは一番上。見るだけの画面を作りました。"

  - layout: pains
    title: "AIに任せている間、こんな不安はありませんか"
    tone: accent
    items:
      - {emoji: "🤔", text: "どのエージェントが作業中で、どれが待ちなのか"}
      - {emoji: "🎟️", text: "エージェントの予算は、どこまで使ったのか"}
      - {emoji: "🔇", text: "ずっと反応のないエージェントはいないか"}

  - layout: image
    title: "チーム全体を1画面で"
    src: "assets/office-floor-ja.png"
    caption: "録画済みのサンプル実行（T3の要件）で、実際の要件ではありません。サンプル内のメモはベトナム語のままです。"

  - layout: features
    title: "カードに表示されること"
    items:
      - {emoji: "🚦", title: "状態", text: "待機・待ち・作業中・レビュー中・完了・停止中"}
      - {emoji: "📈", title: "進捗", text: "目安の表示（~付き）。完了の報告があるまで上限は95%"}
      - {emoji: "🎫", title: "予算", text: "基本枠と予備枠は別表示。まだ付与されていない予備枠は破線"}
      - {emoji: "🤝", title: "引き継ぎ", text: "作業が渡る間はカード同士を線で結び、時刻つきの記録も残す"}
    note: "見る場所はこれだけ。ひと目で全体がつかめるようにしています。"

  - layout: checklist
    title: "不明な点は、不明と表示"
    tone: accent
    items:
      - "エージェントごとの進捗は目安で、実測ではありません"
      - "メインセッションの段階は推定で、直接は観測していません"
      - "15分間反応がない、または起動依頼から2分たっても始まらない場合は「停止中」"
      - "予算が未記録なら、数字を作らず「未記録」と表示"
    note: "数字を取り繕う画面は、ない方がましだと考えています。"

  - layout: flow
    variant: after
    title: "数字の出どころ"
    steps:
      - {emoji: "👀", text: "観測用フックが、サブエージェントの起動・開始・停止を記録。記録するだけで、作業を止めることはありません"}
      - {emoji: "📒", text: "要件ごとの予算台帳に、上限と予備枠が入っています"}
      - {emoji: "🖥️", text: "画面は、この2つから状態を組み立てます"}
    note: "プロンプト、回答の全文、ツールの引数、会話ログのパスは保存しません。"

  - layout: features
    title: "動画のように見返せる"
    items:
      - {emoji: "⏪", title: "時間バー", text: "実行中の好きな時点に移動。1×・2×・4×・8×で再生"}
      - {emoji: "🔀", title: "2つの表示", text: "Claudeサブエージェント（T0〜T3）と、VPSパイプライン"}
      - {emoji: "🌗", title: "明るい・暗い／3言語", text: "日本語、英語、ベトナム語"}
      - {emoji: "▶️", title: "データがなくても", text: "最初はサンプル実行が開くので、すぐ試せます"}

  - layout: checklist
    title: "閲覧専用、自分のPCの中だけ"
    tone: ok
    items:
      - "画面から作業を割り当てたり取り消したりはできません"
      - "標準では127.0.0.1だけで開き、見知らぬ接続元は拒否します"
      - "ログイン機能はないため、VPSではSSHトンネル経由で開きます"
      - "イベントのファイルは所有者だけが読め、Gitの管理外です"
    note: "フックが失敗しても作業は止まりません。環境変数ひとつで完全に無効化できます。"

  - layout: checklist
    title: "前提と限界"
    tone: bad
    items:
      - "リポジトリは非公開です。この投稿は進め方の共有で、配布ではありません"
      - "フックのデータは、1つのClaude Codeのバージョンと1種類のエージェントで確認済み。更新したら再確認が必要です"
      - "確認したバージョンでは、サブエージェントの最終回答がメモに出ず、タスクの説明が表示されます"
      - "画面の日本語はClaudeが書いたもので、日本語話者の確認はまだです"

  - layout: poll
    eyebrow: "みなさんは？"
    question: "いちばん見たいのはどれですか？"
    options:
      - "誰が作業中で、誰が待ちか"
      - "エージェントをどれだけ使ったか"
      - "実行全体の見返し"
      - "サブエージェントはまだ使っていない"
    hint: "A・B・C・Dでコメントください"

platforms:
  facebook:
    caption: |
      AIに作業を任せている間、「いま誰が動いていて、誰が待っているのか」が見えなくて不安になることはありませんか？ 👇

      そこで、エージェントの作業状況を見える化する画面「エージェントオフィス」を作りました。一番上にメインセッション、その下に部署ごとのエリア、エージェントごとに1席。作業が渡る間はカード同士を線で結びます。見るだけの画面です。

      各カードには、状態（待機・待ち・作業中・レビュー中・完了・停止中）、進捗、予算が出ます。予算は基本枠と予備枠を別々に表示し、まだ付与されていない予備枠は破線です。時刻つきの引き継ぎ記録と、実行全体を1×・2×・4×・8×で見返せる時間バーもあります。

      気に入っているのは、分からないことを分からないと表示する点です。エージェントごとの進捗は目安（~付き、完了の報告があるまで上限95%）。メインセッションの段階は推定です。15分間反応がない、または起動依頼から2分たっても始まらない場合は「停止中」。予算が未記録なら「未記録」と出します。

      数字の元は、観測用のフックです。記録するだけで、作業を止めません。プロンプト、回答の全文、ツールの引数、会話ログのパスは保存しません。画面は標準で127.0.0.1だけで開き、ログインがないため、VPSではSSHトンネル経由で使います。

      投稿の画像は、録画済みのサンプル実行で、実際の要件ではありません。前提と限界：リポジトリは非公開です。フックは1つのClaude Codeのバージョンと1種類のエージェントでしか確認していません。画面の日本語はClaudeが書いたもので、日本語話者の確認はまだです。

      こうした画面で、いちばん見たいのはどれですか？
    hashtags: [Claude, AI, 業務効率化, 見える化, 開発]
