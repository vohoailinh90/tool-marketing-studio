# Mutation manifest — see scripts/mutation_check.py
#
# A passing test proves nothing on its own. These break each rule of the System Design claim registry
# in turn and require the named test to fail. A mutation that SURVIVES means the test guards nothing.

target: scripts/sd101_claims.py
note: The registry is what stops two sessions writing one lesson. Each entry switches one rule off and names the test that must notice.
mutations:
- label: claims copied into another branch are counted as that branch's claims
  find: 'if branch == base or entry.get("owner") == branch:'
  replace: 'if True:'
  test: tests.test_sd101_claims.ClaimTests.test_a_copy_of_a_claim_inherited_by_another_branch_is_not_a_claim
- label: the other sessions' claims are never read from the remote
  find: "    if not context.offline:\n        try:\n            fetch_remote"
  replace: "    if False:\n        try:\n            fetch_remote"
  test: tests.test_sd101_claims.RemoteTests.test_an_unreadable_remote_stops_the_claim_unless_offline_is_asked_for
- label: the later of two claims wins instead of the earlier
  find: return (first.claimed_at or "", first.owner or "") < (second.claimed_at or "", second.owner or "")
  replace: return (first.claimed_at or "", first.owner or "") > (second.claimed_at or "", second.owner or "")
  test: tests.test_sd101_claims.ClaimTests.test_the_earlier_claim_wins_even_when_it_is_pushed_second
- label: a takeover does not beat the stale claim it took over
  find: "    if first_took:\n        return True"
  replace: "    if first_took:\n        return False"
  test: tests.test_sd101_claims.LeaseTests.test_a_takeover_beats_a_claim_whose_renewal_was_never_pushed
- label: a stale claim is taken over without asking
  find: "        if not take_stale:\n            return (f\"claimed by"
  replace: "        if False:\n            return (f\"claimed by"
  test: tests.test_sd101_claims.LeaseTests.test_a_stale_claim_blocks_nobody_until_it_is_taken_on_purpose
- label: a claim never goes stale
  find: now - beat > datetime.timedelta(hours=lease_hours)
  replace: now - beat < datetime.timedelta(hours=lease_hours)
  test: tests.test_sd101_claims.LeaseTests.test_touching_keeps_a_claim_alive
- label: a lesson that shares its source with a claimed one is claimable
  find: "    if not allow_same_source:\n        for partner"
  replace: "    if False:\n        for partner"
  test: tests.test_sd101_claims.ClaimTests.test_a_lesson_sharing_its_source_is_refused_unless_allowed
- label: a written lesson can be claimed again
  find: "        if holding.status == \"written\":\n            return f\"already written by"
  replace: "        if False:\n            return f\"already written by"
  test: tests.test_sd101_claims.ClaimTests.test_a_lesson_written_on_another_branch_cannot_be_claimed
