<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 756" width="320" height="756" role="img" aria-labelledby="title desc">
<title id="title">Tám khái niệm Docker cần biết</title>
<desc id="desc">Câu chuyện đưa ứng dụng lên máy chủ: đóng gói bằng Dockerfile ra image, chuyển qua registry, chạy thành container có volume và network, ghép nhiều dịch vụ bằng Compose, điều khiển bằng CLI.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#475569" stroke-width="1.5"/></marker></defs>
<rect width="320" height="756" fill="#f8fafc"/><g font-family="DejaVu Sans, Arial, sans-serif" fill="#0f172a">
<text x="16" y="30" font-size="20" font-weight="bold">LAPTOP → MÁY CHỦ</text>
<text x="16" y="58" font-size="16" font-weight="normal">Mỗi chặng một khái niệm</text>
<rect x="16" y="89" width="288" height="101" rx="10" fill="#dbeafe" stroke="#94a3b8"/>
<text x="30" y="117" font-size="16" font-weight="bold">Đóng gói</text>
<text x="30" y="144" font-size="16" font-weight="normal">Dockerfile mô tả cách dựng</text>
<text x="30" y="171" font-size="16" font-weight="normal">Kết quả là image</text>
<line x1="160" y1="202" x2="160" y2="230" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="16" y="240" width="288" height="101" rx="10" fill="#fef3c7" stroke="#94a3b8"/>
<text x="30" y="268" font-size="16" font-weight="bold">Chuyển đi</text>
<text x="30" y="295" font-size="16" font-weight="normal">Đẩy image lên registry</text>
<text x="30" y="322" font-size="16" font-weight="normal">Máy chủ kéo về</text>
<line x1="160" y1="353" x2="160" y2="381" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="16" y="391" width="288" height="128" rx="10" fill="#dcfce7" stroke="#94a3b8"/>
<text x="30" y="419" font-size="16" font-weight="bold">Chạy</text>
<text x="30" y="446" font-size="16" font-weight="normal">Container: image đang chạy</text>
<text x="30" y="473" font-size="16" font-weight="normal">Volume giữ dữ liệu, network</text>
<text x="30" y="500" font-size="16" font-weight="normal">nối dịch vụ</text>
<line x1="160" y1="531" x2="160" y2="559" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="16" y="569" width="288" height="101" rx="10" fill="#ede9fe" stroke="#94a3b8"/>
<text x="30" y="597" font-size="16" font-weight="bold">Nhiều dịch vụ</text>
<text x="30" y="624" font-size="16" font-weight="normal">Compose khai báo cả bộ</text>
<text x="30" y="651" font-size="16" font-weight="normal">trong một tệp</text>
<text x="16" y="702" font-size="16" font-weight="normal">Tất cả điều khiển qua lệnh</text>
<text x="16" y="729" font-size="16" font-weight="normal">docker (CLI).</text>
</g></svg>
