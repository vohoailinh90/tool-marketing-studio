<svg xmlns="http://www.w3.org/2000/svg" width="320" height="1176" viewBox="0 0 320 1176" role="img" aria-labelledby="title desc">
<title id="title">Phát trực tiếp hoạt động thế nào</title>
<desc id="desc">Ba khung. Khung một, từ máy quay tới máy chủ: thu hình và tiếng, mã hóa và nén, cắt thành đoạn ngắn, tạo nhiều mức bitrate. Khung hai, từ máy chủ tới người xem: đẩy ra máy chủ biên của CDN, máy của người xem giải mã và phát, lưu bản ghi để xem lại. Khung ba, ba giao thức thường gặp: RTMP đẩy từ phía người phát, HLS và DASH chia video thành đoạn tải qua HTTP.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs>
<rect width="320" height="1176" fill="#f8fafc"/>
<g font-family="DejaVu Sans, Arial, sans-serif" fill="#0f172a">
<text x="16" y="34" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">Phát trực tiếp hoạt động</text>
<text x="16" y="58" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">thế nào</text>
<text x="16" y="84.2" font-size="15" fill="#475569" font-weight="normal" text-anchor="start">Cắt thành đoạn vài giây, đẩy ra</text>
<text x="16" y="103.8" font-size="15" fill="#475569" font-weight="normal" text-anchor="start">ngay.</text>
<rect x="8" y="123" width="304" height="414" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="151.2" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Máy quay tới máy chủ</text>
<rect x="20" y="168" width="280" height="68" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="46" cy="194" r="14" fill="#1d4ed8"/>
<text x="46" y="199.5" font-size="16" fill="#ffffff" font-weight="bold" text-anchor="middle">1</text>
<text x="70" y="194.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Thu hình và tiếng</text>
<text x="70" y="218.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Camera và micro.</text>
<rect x="20" y="258" width="280" height="68" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="46" cy="284" r="14" fill="#1d4ed8"/>
<text x="46" y="289.5" font-size="16" fill="#ffffff" font-weight="bold" text-anchor="middle">2</text>
<text x="70" y="284.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Mã hóa, nén</text>
<text x="70" y="308.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Dữ liệu nhỏ đi nhiều.</text>
<polyline points="46,238 46,256" fill="none" stroke="#334155" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="20" y="348" width="280" height="68" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="46" cy="374" r="14" fill="#1d4ed8"/>
<text x="46" y="379.5" font-size="16" fill="#ffffff" font-weight="bold" text-anchor="middle">3</text>
<text x="70" y="374.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Cắt thành đoạn</text>
<text x="70" y="398.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Mỗi đoạn dài vài giây.</text>
<polyline points="46,328 46,346" fill="none" stroke="#334155" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="20" y="438" width="280" height="87" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="46" cy="464" r="14" fill="#1d4ed8"/>
<text x="46" y="469.5" font-size="16" fill="#ffffff" font-weight="bold" text-anchor="middle">4</text>
<text x="70" y="464.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Nhiều mức bitrate</text>
<text x="70" y="488.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Cho mạng yếu và mạng</text>
<text x="70" y="507.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">khỏe.</text>
<polyline points="46,418 46,436" fill="none" stroke="#334155" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="8" y="549" width="304" height="362" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="577.1" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Máy chủ tới người xem</text>
<rect x="20" y="594" width="280" height="87" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
<circle cx="46" cy="620" r="14" fill="#0f766e"/>
<text x="46" y="625.5" font-size="16" fill="#ffffff" font-weight="bold" text-anchor="middle">1</text>
<text x="70" y="620.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Đẩy ra CDN</text>
<text x="70" y="644.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Máy chủ biên ở gần người</text>
<text x="70" y="663.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">xem.</text>
<rect x="20" y="703" width="280" height="87" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
<circle cx="46" cy="729" r="14" fill="#0f766e"/>
<text x="46" y="734.5" font-size="16" fill="#ffffff" font-weight="bold" text-anchor="middle">2</text>
<text x="70" y="729.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Giải mã và phát</text>
<text x="70" y="753.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Trình phát trên máy người</text>
<text x="70" y="772.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">xem.</text>
<polyline points="46,683 46,701" fill="none" stroke="#334155" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="20" y="812" width="280" height="87" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
<circle cx="46" cy="838" r="14" fill="#0f766e"/>
<text x="46" y="843.5" font-size="16" fill="#ffffff" font-weight="bold" text-anchor="middle">3</text>
<text x="70" y="838.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Lưu để xem lại</text>
<text x="70" y="862.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Kho lưu các đoạn đã mã</text>
<text x="70" y="881.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">hóa.</text>
<polyline points="46,792 46,810" fill="none" stroke="#334155" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="8" y="923" width="304" height="245" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="951.1" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Ba giao thức</text>
<rect x="20" y="968" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="991" r="11" fill="#16a34a"/>
<polyline points="37.9,991.4 41.7,995.4 48.5,987" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="994.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">RTMP: đẩy từ phía người</text>
<text x="64" y="1013.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">phát.</text>
<rect x="20" y="1039" width="280" height="46" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="1062" r="11" fill="#16a34a"/>
<polyline points="37.9,1062.4 41.7,1066.4 48.5,1058" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="1065.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">HLS: đoạn nhỏ qua HTTP.</text>
<rect x="20" y="1093" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="1116" r="11" fill="#16a34a"/>
<polyline points="37.9,1116.4 41.7,1120.4 48.5,1112" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="1119.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">DASH: chuẩn quốc tế, cũng</text>
<text x="64" y="1138.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">chia đoạn.</text>
</g>
</svg>
