<text x="46" y="625.5" font-size="16" fill="#ffffff" font-weight="bold" text-anchor="middle">3</text>
<text x="70" y="620.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Lưu video</text>
<text x="70" y="644.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">S3 và Open Connect.</text>
