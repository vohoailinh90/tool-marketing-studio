id: 07-invite-scan
status: draft
format: portrait
series: "幹事の業務効率化 · #7"
link: survey
slides:
  - layout: cover
    emoji: "📥"
    eyebrow: "出欠確認"
    title: "返信メールを**1通ずつ数える**のは、もうやめませんか"
    subtitle: "案内は投票ボタンで、集計はワンクリックで。ツールの最初のステップです。"

  - layout: compare
    title: "文章で返信 vs. ボタンを押すだけ"
    before:
      label: "文章で返信"
      items:
        - "「参加します！」「たぶん行けます」「保留で…」"
        - "1通ずつ開いて意味を読み取る"
        - "返信が増えるたびに数え直し"
    after:
      label: "投票ボタン"
      items:
        - "Yes・No・Maybe だけ"
        - "文字入力は不要、押すだけ"
        - "**Scan Inbox** を押せば集計済み"

  - layout: checklist
    title: "参加者リストの取り込み"
    items:
      - "Excel から取り込み：**A列に名前、B列にメールアドレス**"
      - "タイトル行は自動でスキップ、重複アドレスは除外"
      - "手入力で一人ずつ追加もできます"
      - "変更するたびに自動で保存されます"

  - layout: features
    title: "Scan Inbox がやること"
    items:
      - {emoji: "📂", title: "全フォルダを検索", text: "受信トレイだけでなく、メールボックスのすべてのフォルダから返信を探します"}
      - {emoji: "🔢", title: "自動で集計", text: "Yes・No・Maybe の人数を数え、履歴に保存します"}
      - {emoji: "✏️", title: "手動で修正", text: "修正した票は次回のスキャンでも保持（同じ人の新しい返信が見つかった場合を除く）"}
      - {emoji: "🏷️", title: "イベントIDで照合", text: "イベントごとのIDで返信を照合します。設定タブのIDは、案内を送ったときのIDと一致させてください"}

  - layout: pains
    tone: accent
    title: "正直にお伝えしておくこと"
    items:
      - {emoji: "⚠️", text: "同じメールアドレスを共有する2人は区別できません"}
      - {emoji: "⚠️", text: "Outlook の検索インデックスが1分ほど遅れることがあります。返信が見当たらないときは、少し待って再スキャン"}
      - {emoji: "⚠️", text: "Windows ＋ Outlook デスクトップ版のみ対応"}

  - layout: cta
    emoji: "💬"
    title: "いまの出欠確認、**どうやって**していますか？"
    text: "メール、チャット、Excel、フォーム…やり方をコメントで教えてください。"

platforms:
  facebook:
    caption: |
      「参加します！」「たぶん行けます」「一旦保留で…」。返信を1通ずつ開いて数えるのは、気が重い作業ではありませんか？😵

      幹事の仕事の中でも、出欠の取りまとめは地味に大変です。文章での返信は書き方がバラバラで、新しい返信が届くたびに数え直しになります。

      ツールではこう変えました。
      ・案内メールに Outlook の投票ボタン（Yes・No・Maybe）。参加者は押すだけ
      ・Scan Inbox を押すと、メールボックスのすべてのフォルダから返信を読み取って集計
      ・直したい票は手で修正でき、次回のスキャンでも保持（同じ人の新しい返信が見つかった場合を除く）

      正直にお伝えすると、同じメールアドレスを共有する2人は区別できません。

      皆さんは今、出欠をどうやって取りまとめていますか？コメントで教えてください🙏
    first_comment: |
      📋 短いアンケート — 出欠の取りまとめ方を教えてください：{link}
    hashtags: [幹事, Outlook, 出欠確認, 業務効率化, 自動化]
