# Mutation manifest — see scripts/mutation_check.py

target: .github/workflows/ci.yml
note: CI runs once per commit (the pull request run), and a newer run replaces one that is still waiting.
mutations:
- label: a push to any branch runs CI again
  find: '    branches: [main]'
  replace: '    branches: ["**"]'
  test: tests.test_ci_workflow.CiTriggerTests.test_a_push_runs_only_on_main
- label: a pull request no longer runs CI
  find: "  pull_request:\n\nconcurrency:"
  replace: "\nconcurrency:"
  test: tests.test_ci_workflow.CiTriggerTests.test_a_pull_request_still_runs_ci
- label: every push gets its own group, so none replaces another
  find: '|| github.ref }}'
  replace: '|| github.run_id }}'
  test: tests.test_ci_workflow.CiConcurrencyTests.test_pushes_to_one_ref_share_a_group_so_a_waiting_run_is_replaced
- label: pull request runs of different pull requests share a group
  find: "format('pr-{0}', github.event.pull_request.number)"
  replace: "format('pr-{0}', github.run_id)"
  test: tests.test_ci_workflow.CiConcurrencyTests.test_a_newer_pull_request_run_replaces_an_older_one
- label: a newer pull request run never replaces an older one
  find: "cancel-in-progress: ${{ github.event_name == 'pull_request' }}"
  replace: 'cancel-in-progress: false'
  test: tests.test_ci_workflow.CiConcurrencyTests.test_a_newer_pull_request_run_replaces_an_older_one
- label: a started run on main is cancelled by the next one
  find: "cancel-in-progress: ${{ github.event_name == 'pull_request' }}"
  replace: 'cancel-in-progress: true'
  test: tests.test_ci_workflow.CiConcurrencyTests.test_a_started_push_run_is_not_cancelled
