<svg xmlns="http://www.w3.org/2000/svg" width="360" height="420" viewBox="0 0 360 420" role="img" aria-labelledby="title desc">
<title id="title">Sáu nơi cần xử lý thao tác lặp an toàn</title>
<desc id="desc">Lần đầu: key K: Ràng buộc key nguyên tử: Tạo tác động + lưu kết quả; Lần lặp: key K: Cùng ý định và payload: Dùng kết quả đã ghi; Sáu bối cảnh: API • tiền • đơn • DB: Tài khoản • message. Các khung là ý chính để đối chiếu, không nhất thiết là các bước tuần tự.</desc>
<rect width="360" height="420" fill="#f8fafc"/>
<g font-family="DejaVu Sans, sans-serif" fill="#0f172a">
