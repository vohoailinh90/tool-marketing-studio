<svg xmlns="http://www.w3.org/2000/svg" width="320" height="819" viewBox="0 0 320 819" role="img" aria-labelledby="title desc">
<title id="title">Tìm quán gần bạn bằng geohash</title>
<desc id="desc">Hai khung. Khung một, cách tạo geohash: chia Trái Đất thành bốn ô theo đường xích đạo và kinh tuyến gốc, chia mỗi ô thành bốn ô nhỏ hơn, ghép bit kinh độ xen bit vĩ độ thành một mã, rồi tìm quán bằng cách so tiền tố mã. Khung hai, ba điều rút ra từ thử nghiệm: ô phải không nhỏ hơn bán kính tìm, chỉ xét một ô thì sót quán gần ranh giới, và ô ở nơi đông quán chứa rất nhiều quán.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs>
<rect width="320" height="819" fill="#f8fafc"/>
<g font-family="DejaVu Sans, Arial, sans-serif" fill="#0f172a">
<text x="16" y="34" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">Tìm quán gần bạn bằng</text>
<text x="16" y="58" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">geohash</text>
<text x="16" y="84.2" font-size="15" fill="#475569" font-weight="normal" text-anchor="start">Chia bản đồ thành ô, tìm theo tiền tố</text>
<text x="16" y="103.8" font-size="15" fill="#475569" font-weight="normal" text-anchor="start">mã.</text>
<rect x="8" y="123" width="304" height="414" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="151.2" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Từ tọa độ tới mã</text>
<rect x="20" y="168" width="280" height="87" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="46" cy="194" r="14" fill="#1d4ed8"/>
<text x="46" y="199.5" font-size="16" fill="#ffffff" font-weight="bold" text-anchor="middle">1</text>
<text x="70" y="194.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Chia bốn</text>
<text x="70" y="218.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Theo xích đạo và kinh tuyến</text>
<text x="70" y="237.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">gốc.</text>
<rect x="20" y="277" width="280" height="68" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="46" cy="303" r="14" fill="#1d4ed8"/>
<text x="46" y="308.5" font-size="16" fill="#ffffff" font-weight="bold" text-anchor="middle">2</text>
<text x="70" y="303.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Chia tiếp</text>
<text x="70" y="327.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Mỗi ô lại thành bốn ô nhỏ.</text>
<polyline points="46,257 46,275" fill="none" stroke="#334155" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="20" y="367" width="280" height="68" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="46" cy="393" r="14" fill="#1d4ed8"/>
<text x="46" y="398.5" font-size="16" fill="#ffffff" font-weight="bold" text-anchor="middle">3</text>
<text x="70" y="393.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Ghép bit</text>
<text x="70" y="417.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Bit kinh độ xen bit vĩ độ.</text>
<polyline points="46,347 46,365" fill="none" stroke="#334155" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="20" y="457" width="280" height="68" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="46" cy="483" r="14" fill="#1d4ed8"/>
<text x="46" y="488.5" font-size="16" fill="#ffffff" font-weight="bold" text-anchor="middle">4</text>
<text x="70" y="483.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Tìm</text>
<text x="70" y="507.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">So tiền tố của mã.</text>
<polyline points="46,437 46,455" fill="none" stroke="#334155" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="8" y="549" width="304" height="262" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="577.1" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Ba điều rút ra</text>
<rect x="20" y="594" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="617" r="11" fill="#16a34a"/>
<polyline points="37.9,617.4 41.7,621.4 48.5,613" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="620.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Ô phải không nhỏ hơn bán</text>
<text x="64" y="639.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">kính tìm.</text>
<rect x="20" y="665" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="688" r="11" fill="#16a34a"/>
<polyline points="37.9,688.4 41.7,692.4 48.5,684" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="691.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Chỉ xét một ô thì sót quán</text>
<text x="64" y="710.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">gần ranh giới.</text>
<rect x="20" y="736" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="759" r="11" fill="#16a34a"/>
<polyline points="37.9,759.4 41.7,763.4 48.5,755" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="762.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Ở nơi đông quán, một ô chứa</text>
<text x="64" y="781.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">rất nhiều quán.</text>
</g>
</svg>
