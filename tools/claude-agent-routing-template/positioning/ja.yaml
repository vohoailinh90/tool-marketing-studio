lang: ja
one_liner: "設計はClaude、批判的レビューはCodex。上限と「完了の定義」を決めたうえで、最後まで回す開発の進め方。"
audience: >-
  日本の会社で、社内ツールや業務自動化をAI（Claude、Codex）で作っている人。業務改善担当、情シス、
  チームのまとめ役。AIが書いたものを誰がどう確認するのか、説明できる形にしたい人。
pains:
  - "AIが自分で書いたものを自分で確認すると、見落としに気づきにくい"
  - "「完了しました」と報告されても、受け入れ基準に照らした根拠が見えない"
  - "自動で回すのに、往復の上限や止める条件が決まっていない"
  - "セッションが途中で切れて、最初から説明し直しになる"
promise: "設計する側・批判する側・回数の上限・完了の条件をあらかじめ文章で決めておく進め方。"
objections:
  - {q: "AIに任せきりにするということですか？", a: "いいえ。往復には回数の上限と完了の定義があり、人が判断するのは、機械では決められない判断が出たときと、元の要件が変わったときだけです。"}
  - {q: "Codexが指摘した内容はそのまま直しますか？", a: "いいえ。指摘はまずコードで確認し、確認できたものだけ修正を依頼します。推測の指摘は直しません。"}
  - {q: "リポジトリは公開されていますか？", a: "現在は非公開です。この投稿は進め方の共有で、リポジトリの配布ではありません。"}
vocabulary: [設計, 批判的レビュー, 指摘, 受け入れ基準, 完了の定義, 差し戻し, 上限, 根拠, 範囲外, 引き継ぎ]
angles:
  - "なぜ書いたAIが自分でレビューしてはいけないのか"
  - "要件の採点から完了まで：一本の流れ"
  - "上限を決めて回す：往復は何回まで"
  - "「完了」の条件を先に文章にする"
tone: "です・ます調で丁寧に、過度な宣伝は避け、前提条件と限界を正直に書く。"
