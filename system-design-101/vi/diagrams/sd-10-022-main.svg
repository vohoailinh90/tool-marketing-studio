<circle cx="50" cy="771.5" r="18" fill="#0f766e"/><g transform="translate(39.2 760.7) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect height="8" rx="2" width="8" x="3" y="3"/><path d="M7 11v4a2 2 0 0 0 2 2h4"/><rect height="8" rx="2" width="8" x="13" y="13"/></g>
<text x="78" y="754.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">sum, map, filter</text>
<text x="78" y="778.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Nối các hàm trên, không</text>
<text x="78" y="797.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">đổi biến nào.</text>
