<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 905" width="320" height="905" role="img" aria-labelledby="title desc">
<title id="title">Thiết kế pipeline CI/CD cho một repo: năm quyết định</title>
<desc id="desc">Năm quyết định khi dựng pipeline cho một repo: khi nào chạy, làm sao chạy nhanh, cấp quyền gì, ai được đưa lên môi trường nào, và điều kiện để merge.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#475569" stroke-width="1.5"/></marker></defs>
<rect width="320" height="905" fill="#f8fafc"/><g font-family="DejaVu Sans, Arial, sans-serif" fill="#0f172a">
<text x="16" y="30" font-size="20" font-weight="bold">NĂM QUYẾT ĐỊNH</text>
<text x="16" y="58" font-size="16" font-weight="normal">Ví dụ minh họa bằng GitHub</text>
<text x="16" y="85" font-size="16" font-weight="normal">Actions</text>
<rect x="16" y="116" width="288" height="182" rx="10" fill="#dbeafe" stroke="#94a3b8"/>
<text x="30" y="144" font-size="16" font-weight="bold">Khi nào chạy?</text>
<text x="30" y="171" font-size="16" font-weight="normal">PR: kiểm tra nhanh</text>
<text x="30" y="198" font-size="16" font-weight="normal">Nhánh chính, tag: build</text>
<text x="30" y="225" font-size="16" font-weight="normal">phát hành</text>
<text x="30" y="252" font-size="16" font-weight="normal">Hủy lượt cũ khi có commit</text>
<text x="30" y="279" font-size="16" font-weight="normal">mới trên PR</text>
<rect x="16" y="310" width="288" height="155" rx="10" fill="#dcfce7" stroke="#94a3b8"/>
<text x="30" y="338" font-size="16" font-weight="bold">Chạy nhanh bằng cách</text>
<text x="30" y="365" font-size="16" font-weight="bold">nào?</text>
<text x="30" y="392" font-size="16" font-weight="normal">Cache phụ thuộc, chạy song</text>
<text x="30" y="419" font-size="16" font-weight="normal">song job độc lập</text>
<text x="30" y="446" font-size="16" font-weight="normal">Giữ cổng chặn dưới vài phút</text>
<rect x="16" y="477" width="288" height="155" rx="10" fill="#fee2e2" stroke="#94a3b8"/>
<text x="30" y="505" font-size="16" font-weight="bold">Cấp quyền gì?</text>
<text x="30" y="532" font-size="16" font-weight="normal">Quyền tối thiểu cho token</text>
<text x="30" y="559" font-size="16" font-weight="normal">của pipeline</text>
<text x="30" y="586" font-size="16" font-weight="normal">OIDC thay cho khóa dài hạn</text>
<text x="30" y="613" font-size="16" font-weight="normal">khi vào cloud</text>
<rect x="16" y="644" width="288" height="128" rx="10" fill="#ede9fe" stroke="#94a3b8"/>
<text x="30" y="672" font-size="16" font-weight="bold">Ai lên môi trường nào?</text>
<text x="30" y="699" font-size="16" font-weight="normal">Environment production cần</text>
<text x="30" y="726" font-size="16" font-weight="normal">người duyệt</text>
<text x="30" y="753" font-size="16" font-weight="normal">Bí mật gắn theo environment</text>
<rect x="16" y="784" width="288" height="101" rx="10" fill="#fef3c7" stroke="#94a3b8"/>
<text x="30" y="812" font-size="16" font-weight="bold">Khi nào được merge?</text>
<text x="30" y="839" font-size="16" font-weight="normal">Required status checks và</text>
<text x="30" y="866" font-size="16" font-weight="normal">branch protection</text>
</g></svg>
