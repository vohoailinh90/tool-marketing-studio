tool: meeting-scheduler
langs: [vi, ja, en]
platforms: [facebook]
goal: >-
  Page content only, for now: share the IDEA and the pain of finding one meeting time for a large group spread over
  several countries, and hear how readers handle it today. The tool is a personal prototype; no download, trial or
  waitlist is offered and no release date is promised. (Demand validation can be switched on later.)

links:
  survey: "https://REPLACE_ME/survey?src={source}"

utm:
  medium: social
  campaign: meeting-scheduler-validation

schedule: []

validation:
  window_days: 30
  min_counts: {reach: 1000, link_clicks: 30, survey_responses: 15}
  go_if: {survey_responses: 30, signups: 10, click_rate: 0.01}
