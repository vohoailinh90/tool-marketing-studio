<svg xmlns="http://www.w3.org/2000/svg" width="320" height="1243" viewBox="0 0 320 1243" role="img" aria-labelledby="title desc">
<title id="title">Telegram có an toàn không?</title>
<desc id="desc">Hai nhóm thẻ so sánh. Chat thường và chat nhóm: tin mã hóa trên đường tới máy chủ, máy chủ lưu tin đã mã hóa ở nhiều trung tâm dữ liệu, chìa khóa giải mã được chia thành nhiều phần cất ở nhiều nơi. Secret chat: mã hóa đầu cuối, chỉ máy gửi và máy nhận giải mã được, không hỗ trợ nhóm, chỉ trên thiết bị di động. Khung cuối nêu ba điều cần nhớ.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs>
<rect width="320" height="1243" fill="#f8fafc"/>
<g font-family="DejaVu Sans, Arial, sans-serif" fill="#0f172a">
<text x="16" y="34" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">Telegram có an toàn</text>
<text x="16" y="58" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">không?</text>
<text x="16" y="84.2" font-size="15" fill="#475569" font-weight="normal" text-anchor="start">Còn tùy loại chat: ai giữ được chìa</text>
<text x="16" y="103.8" font-size="15" fill="#475569" font-weight="normal" text-anchor="start">khóa giải mã?</text>
<rect x="8" y="123" width="304" height="382" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="151.2" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Chat thường và chat nhóm</text>
<rect x="20" y="168" width="280" height="87" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="50" cy="211.5" r="18" fill="#1d4ed8"/><g transform="translate(39.2 200.7) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect height="20" rx="2" ry="2" width="14" x="5" y="2"/><path d="M12 18h.01"/></g>
<text x="78" y="194.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Máy người gửi</text>
<text x="78" y="218.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Mã hóa tin trên đường tới</text>
<text x="78" y="237.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">máy chủ.</text>
<rect x="20" y="287" width="280" height="87" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="50" cy="330.5" r="18" fill="#1d4ed8"/><g transform="translate(39.2 319.7) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect height="8" rx="2" ry="2" width="20" x="2" y="2"/><rect height="8" rx="2" ry="2" width="20" x="2" y="14"/><line x1="6" x2="6.01" y1="6" y2="6"/><line x1="6" x2="6.01" y1="18" y2="18"/></g>
<text x="78" y="313.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Máy chủ Telegram</text>
<text x="78" y="337.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Giải mã được; lưu tin ở</text>
<text x="78" y="356.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">nhiều trung tâm dữ liệu.</text>
<rect x="20" y="406" width="280" height="87" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="50" cy="449.5" r="18" fill="#1d4ed8"/><g transform="translate(39.2 438.7) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.586 17.414A2 2 0 0 0 2 18.828V21a1 1 0 0 0 1 1h3a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h1a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h.172a2 2 0 0 0 1.414-.586l.814-.814a6.5 6.5 0 1 0-4-4z"/><circle cx="16.5" cy="7.5" fill="#FFFFFF" r=".5"/></g>
<text x="78" y="432.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Chìa khóa giải mã</text>
<text x="78" y="456.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Chia thành nhiều phần, cất</text>
<text x="78" y="475.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">ở nhiều nơi.</text>
<polyline points="160,257 160,285" fill="none" stroke="#334155" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="160,376 160,404" fill="none" stroke="#334155" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="8" y="517" width="304" height="404" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="545.1" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Secret chat: mã hóa đầu</text>
<text x="20" y="567.2" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">cuối</text>
<rect x="20" y="584" width="280" height="87" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
<circle cx="50" cy="627.5" r="18" fill="#0f766e"/><g transform="translate(39.2 616.7) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect height="20" rx="2" ry="2" width="14" x="5" y="2"/><path d="M12 18h.01"/></g>
<text x="78" y="610.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Máy người gửi</text>
<text x="78" y="634.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Mã hóa bằng chìa khóa chỉ</text>
<text x="78" y="653.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">hai máy biết.</text>
<rect x="20" y="703" width="280" height="87" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
<circle cx="50" cy="746.5" r="18" fill="#0f766e"/><g transform="translate(39.2 735.7) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect height="11" rx="2" ry="2" width="18" x="3" y="11"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></g>
<text x="78" y="729.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Máy chủ chuyển tiếp</text>
<text x="78" y="753.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Chỉ thấy dữ liệu đã mã</text>
<text x="78" y="772.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">hóa, không đọc được.</text>
<rect x="20" y="822" width="280" height="87" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
<circle cx="50" cy="865.5" r="18" fill="#0f766e"/><g transform="translate(39.2 854.7) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect height="20" rx="2" ry="2" width="14" x="5" y="2"/><path d="M12 18h.01"/></g>
<text x="78" y="848.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Máy người nhận</text>
<text x="78" y="872.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Cùng máy người gửi: hai</text>
<text x="78" y="891.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">nơi duy nhất giải mã được.</text>
<polyline points="160,673 160,701" fill="none" stroke="#334155" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="160,792 160,820" fill="none" stroke="#334155" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="8" y="933" width="304" height="302" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="961.1" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Nhớ gì</text>
<rect x="20" y="978" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="1001" r="11" fill="#16a34a"/>
<polyline points="37.9,1001.4 41.7,1005.4 48.5,997" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="1004.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">An toàn nghĩa là ai đọc được</text>
<text x="64" y="1023.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">tin, không chỉ có mã hóa.</text>
<rect x="20" y="1049" width="280" height="83" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="1072" r="11" fill="#16a34a"/>
<polyline points="37.9,1072.4 41.7,1076.4 48.5,1068" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="1075.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Chia nhỏ dữ liệu làm việc tấn</text>
<text x="64" y="1094.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">công khó hơn, không phải</text>
<text x="64" y="1114.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">không thể.</text>
<rect x="20" y="1140" width="280" height="83" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="1163" r="11" fill="#16a34a"/>
<polyline points="37.9,1163.4 41.7,1167.4 48.5,1159" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="1166.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Secret chat không có nhóm,</text>
<text x="64" y="1185.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">theo nguồn chỉ có trên di</text>
<text x="64" y="1205.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">động.</text>
</g>
</svg>
