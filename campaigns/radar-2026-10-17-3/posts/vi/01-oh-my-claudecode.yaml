      trực tiếp trong CI/CD không tương tác
  - emoji: ⚠️
    text: Tính năng đặt tên workflow stage profile v1 hiện yêu cầu hệ điều hành Linux có tiện ích flock
  - emoji: ⚠️
    text: omc team và phát hiện giới hạn tốc độ yêu cầu cài đặt tmux (hoặc psmux trên Windows)
