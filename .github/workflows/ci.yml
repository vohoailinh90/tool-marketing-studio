name: CI

on:
  push:
    # A branch with a pull request is checked by the pull request run; its push run only repeated
    # that work, and no later push ever replaced a push run still waiting.
    branches: [main]
  pull_request:

concurrency:
  # A newer pull request run replaces an older one, even one that has started. On main a newer run
  # replaces the one still waiting for the runner; a run that has started finishes.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  engine:
    # A GitHub-hosted runner by default (free for a public repository); set the repository variable
    # CI_RUNNER, e.g. to self-hosted, to move every job at once — docs/agent-team.md, "CI runner".
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    # A persistent runner (CI_RUNNER) executes only code from people who can push here: a pull request
    # from a fork never runs on it (the same commits still run once someone with access pushes them).
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
        with:
          # The pull request's diff against its base decides whether the mutation check runs.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          # The agent office's Node-run checks (tests/web/office_*_check.mts) need type stripping, Node 22.6+. On an older
          # Node the tests skip, and a skipped test is a mutation that survives (tests/mutations/office_feature.yaml).
          node-version: "22"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          # System libraries need root, which only the GitHub-hosted runner has; on the VPS
          # install them once (`python -m playwright install-deps chromium`).
          python -m playwright install ${{ runner.environment == 'github-hosted' && '--with-deps' || '' }} chromium
      - name: Repository layout
        run: python scripts/layout_check.py
      - name: UI catalogs (vi / ja / en; the app's and the agent office's)
        run: python scripts/i18n_check.py
      - name: Agent office snapshot contract
        # The dashboard's data contract, checked on the bundled samples and the empty views.
        run: python scripts/office/snapshot.py --check
      - name: Campaign checks
        run: python studio.py check
      - name: Lesson posts carry their whole lesson
        # Each manifest pins a commit of the public course; the check re-reads every lesson there.
        run: |
          course="$RUNNER_TEMP/agentic-coding-course"
          rm -rf "$course"
          git clone --quiet https://github.com/vohoailinh90/Agentic-coding-course "$course"
          python scripts/lesson_coverage.py check --all --course-dir "$course"
      - name: Tests
        run: python -m pytest -q
      - name: Does this change need the mutation check?
        id: changes
        # The longest step of this job by far (look at the step timings of a run). A pull request that
        # touches only the System Design store cannot break the safety-rail tests, so it skips the check;
        # every push to main and every other pull request runs it (scripts/ci_changes.py). An unset output
        # runs it too.
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python scripts/ci_changes.py
      - name: Mutation check (safety-rail tests catch their own removal)
        if: steps.changes.outputs.mutation != 'false'
        # Each worker mutates its own copy of the tree, so MUTATION_JOBS entries run at once. Two is the default;
        # set the repository variable MUTATION_JOBS to 1 to go back to one tree, or higher on a runner with cores
        # to spare, after timing this step in a run's log (docs/agent-team.md, "CI runner").
        run: python scripts/mutation_check.py --all --jobs ${{ vars.MUTATION_JOBS || '2' }}

  web:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Typecheck and build
        run: npm run build
      - name: Committed web/dist matches the source
        run: git diff --exit-code -- dist

  office:
    # The agent office (docs/office-dashboard.md): a read-only page that shows which agent is doing what.
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    defaults:
      run:
        working-directory: office
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: office/package-lock.json
      - run: npm ci
      - name: Typecheck, lint and build
        run: |
          npm run typecheck
          npm run lint
          npm run build
      - name: Edge geometry of the handoff lines (Node type stripping)
        working-directory: ${{ github.workspace }}
        run: node --experimental-strip-types tests/web/office_edges_check.mts
      - name: Feature filter (Node type stripping)
        working-directory: ${{ github.workspace }}
        run: node --experimental-strip-types tests/web/office_feature_check.mts
      - name: Committed office/dist matches the source
        run: git diff --exit-code -- dist
