<svg xmlns="http://www.w3.org/2000/svg" width="360" height="420" viewBox="0 0 360 420" role="img" aria-labelledby="title desc">
<title id="title">Mở rộng website cho hàng triệu người dùng</title>
<desc id="desc">Đo workload: Tài khoản ≠ concurrency: QPS • dữ liệu • đọc/ghi; Chia tải phục vụ: LB + app stateless: CDN cho nội dung tĩnh; Theo điểm nghẽn DB: Index → cache/replica: Queue • sharding khi cần. Các khung là ý chính để đối chiếu, không nhất thiết là các bước tuần tự.</desc>
<rect width="360" height="420" fill="#f8fafc"/>
<g font-family="DejaVu Sans, sans-serif" fill="#0f172a">
<text x="20" y="28" font-size="18" font-weight="bold">sd-11-013 · Nhìn hình trước</text>
<rect x="12" y="48" width="336" height="102" rx="12" fill="#e0f2fe" stroke="#64748b"/>
<text x="24" y="75" font-size="18" font-weight="bold">Đo workload</text>
<text x="24" y="104" font-size="18">Tài khoản ≠ concurrency</text>
<text x="24" y="130" font-size="18">QPS • dữ liệu • đọc/ghi</text>
<rect x="12" y="162" width="336" height="102" rx="12" fill="#dcfce7" stroke="#64748b"/>
<text x="24" y="189" font-size="18" font-weight="bold">Chia tải phục vụ</text>
<text x="24" y="218" font-size="18">LB + app stateless</text>
<text x="24" y="244" font-size="18">CDN cho nội dung tĩnh</text>
<rect x="12" y="276" width="336" height="102" rx="12" fill="#fef3c7" stroke="#64748b"/>
<text x="24" y="303" font-size="18" font-weight="bold">Theo điểm nghẽn DB</text>
<text x="24" y="332" font-size="18">Index → cache/replica</text>
<text x="24" y="358" font-size="18">Queue • sharding khi cần</text>
</g>
</svg>
