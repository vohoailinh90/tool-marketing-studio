<svg xmlns="http://www.w3.org/2000/svg" width="320" height="766" viewBox="0 0 320 766" role="img" aria-labelledby="title desc">
<title id="title">Tám chiến lược mở rộng</title>
<desc id="desc">Hai khung, mỗi khung bốn ghi chú. Khung một, tầng ứng dụng: dịch vụ không giữ trạng thái, mở rộng theo chiều ngang, cân bằng tải, tự động co giãn. Khung hai, dữ liệu và công việc: bộ nhớ đệm, sao chép cơ sở dữ liệu, chia nhỏ cơ sở dữ liệu, xử lý bất đồng bộ. Mỗi ghi chú nói nó gỡ nút thắt nào.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs>
<rect width="320" height="766" fill="#f8fafc"/>
<g font-family="DejaVu Sans, Arial, sans-serif" fill="#0f172a">
<text x="16" y="34" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">Tám chiến lược mở rộng</text>
<text x="16" y="60.2" font-size="15" fill="#475569" font-weight="normal" text-anchor="start">Mỗi cách gỡ một nút thắt khác nhau.</text>
<rect x="8" y="80" width="304" height="333" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="108.2" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Tầng ứng dụng</text>
<rect x="20" y="125" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="148" r="11" fill="#16a34a"/>
<polyline points="37.9,148.4 41.7,152.4 48.5,144" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="151.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Stateless: yêu cầu tới bản</text>
<text x="64" y="170.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">sao nào cũng được.</text>
<rect x="20" y="196" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="219" r="11" fill="#16a34a"/>
<polyline points="37.9,219.4 41.7,223.4 48.5,215" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="222.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Ngang: thêm máy khi một</text>
<text x="64" y="241.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">máy không đủ.</text>
<rect x="20" y="267" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="290" r="11" fill="#16a34a"/>
<polyline points="37.9,290.4 41.7,294.4 48.5,286" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="293.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Cân bằng tải: chia yêu cầu</text>
<text x="64" y="312.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">đều giữa các bản sao.</text>
<rect x="20" y="338" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="361" r="11" fill="#16a34a"/>
<polyline points="37.9,361.4 41.7,365.4 48.5,357" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="364.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Tự co giãn: thêm bớt máy</text>
<text x="64" y="383.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">theo tải.</text>
<rect x="8" y="425" width="304" height="333" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="453.2" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Dữ liệu và công việc</text>
<rect x="20" y="470" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="493" r="11" fill="#16a34a"/>
<polyline points="37.9,493.4 41.7,497.4 48.5,489" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="496.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Đệm: đọc lặp lại từ nơi</text>
<text x="64" y="515.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">nhanh.</text>
<rect x="20" y="541" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="564" r="11" fill="#16a34a"/>
<polyline points="37.9,564.4 41.7,568.4 48.5,560" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="567.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Sao chép: nhiều bản đọc, có</text>
<text x="64" y="586.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">dự phòng.</text>
<rect x="20" y="612" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="635" r="11" fill="#16a34a"/>
<polyline points="37.9,635.4 41.7,639.4 48.5,631" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="638.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Chia nhỏ: ghi và dung lượng</text>
<text x="64" y="657.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">vượt một máy.</text>
<rect x="20" y="683" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="706" r="11" fill="#16a34a"/>
<polyline points="37.9,706.4 41.7,710.4 48.5,702" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="709.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Bất đồng bộ: việc nặng vào</text>
<text x="64" y="728.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">hàng đợi.</text>
</g>
</svg>
