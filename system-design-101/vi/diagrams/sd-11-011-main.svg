<svg xmlns="http://www.w3.org/2000/svg" width="360" height="420" viewBox="0 0 360 420" role="img" aria-labelledby="title desc">
<title id="title">Bốn trụ cột chất lượng hệ thống</title>
<desc id="desc">Scalability: Tăng tải → tăng năng lực: Đo chất lượng và chi phí; Availability + reliability: Thao tác thực hiện được: Kết quả đúng, duy trì ổn định; Performance: Latency p95/p99: Throughput dưới tải. Các khung là ý chính để đối chiếu, không nhất thiết là các bước tuần tự.</desc>
<rect width="360" height="420" fill="#f8fafc"/>
<g font-family="DejaVu Sans, sans-serif" fill="#0f172a">
<text x="20" y="28" font-size="18" font-weight="bold">sd-11-011 · Nhìn hình trước</text>
<rect x="12" y="48" width="336" height="102" rx="12" fill="#e0f2fe" stroke="#64748b"/>
<text x="24" y="75" font-size="18" font-weight="bold">Scalability</text>
<text x="24" y="104" font-size="18">Tăng tải → tăng năng lực</text>
<text x="24" y="130" font-size="18">Đo chất lượng và chi phí</text>
<rect x="12" y="162" width="336" height="102" rx="12" fill="#dcfce7" stroke="#64748b"/>
<text x="24" y="189" font-size="18" font-weight="bold">Availability + reliability</text>
<text x="24" y="218" font-size="18">Thao tác thực hiện được</text>
<text x="24" y="244" font-size="18">Kết quả đúng, duy trì ổn định</text>
<rect x="12" y="276" width="336" height="102" rx="12" fill="#fef3c7" stroke="#64748b"/>
<text x="24" y="303" font-size="18" font-weight="bold">Performance</text>
<text x="24" y="332" font-size="18">Latency p95/p99</text>
<text x="24" y="358" font-size="18">Throughput dưới tải</text>
</g>
</svg>
