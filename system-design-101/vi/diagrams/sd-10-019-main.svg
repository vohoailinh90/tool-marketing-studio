<svg xmlns="http://www.w3.org/2000/svg" width="320" height="950" viewBox="0 0 320 950" role="img" aria-labelledby="title desc">
<title id="title">Bốn trụ cột hướng đối tượng</title>
<desc id="desc">Hai nhóm thẻ và một khung ghi nhớ. Che bớt chi tiết: trừu tượng cho người dùng chỉ thấy giao diện đơn giản, ví dụ gọi area của một Shape mà không cần biết công thức; đóng gói gói dữ liệu và hàm vào một lớp rồi kiểm soát truy cập, ví dụ Circle giữ bán kính bên trong. Dùng lại và thay đổi: kế thừa cho lớp con giữ hoặc thêm thuộc tính và phương thức của lớp cha, ví dụ Circle và Square kế thừa Shape; đa hình cho mỗi lớp có hàm riêng, ví dụ area chạy theo từng hình. Khung cuối nêu ba điều cần nhớ.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs>
<rect width="320" height="950" fill="#f8fafc"/>
<g font-family="DejaVu Sans, Arial, sans-serif" fill="#0f172a">
<text x="16" y="34" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">Bốn trụ cột hướng đối</text>
<text x="16" y="58" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">tượng</text>
<text x="16" y="84.2" font-size="15" fill="#475569" font-weight="normal" text-anchor="start">Mỗi trụ cột một câu hỏi, kèm ví dụ</text>
<text x="16" y="103.8" font-size="15" fill="#475569" font-weight="normal" text-anchor="start">của bài.</text>
<rect x="8" y="123" width="304" height="265" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="151.2" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Che bớt chi tiết</text>
<rect x="20" y="168" width="280" height="87" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="50" cy="211.5" r="18" fill="#1d4ed8"/><g transform="translate(39.2 200.7) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></g>
<text x="78" y="194.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Trừu tượng</text>
<text x="78" y="218.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Chỉ lộ giao diện đơn giản.</text>
<text x="78" y="237.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Ví dụ: gọi area của Shape.</text>
<rect x="20" y="269" width="280" height="107" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="50" cy="322.5" r="18" fill="#1d4ed8"/><g transform="translate(39.2 311.7) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect height="11" rx="2" ry="2" width="18" x="3" y="11"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></g>
<text x="78" y="295.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Đóng gói</text>
<text x="78" y="319.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Gói dữ liệu và hàm vào</text>
<text x="78" y="338.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">lớp, kiểm soát truy cập. Ví</text>
<text x="78" y="358.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">dụ: Circle giữ bán kính.</text>
<rect x="8" y="400" width="304" height="285" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="428.2" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Dùng lại và thay đổi</text>
<rect x="20" y="445" width="280" height="107" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
<circle cx="50" cy="498.5" r="18" fill="#0f766e"/><g transform="translate(39.2 487.7) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6a9 9 0 0 0-9 9V3"/><circle cx="18" cy="6" r="3"/><circle cx="6" cy="18" r="3"/></g>
<text x="78" y="471.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Kế thừa</text>
<text x="78" y="495.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Lớp con giữ hoặc thêm</text>
<text x="78" y="514.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">phần của lớp cha. Ví dụ:</text>
<text x="78" y="534.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Circle, Square từ Shape.</text>
<rect x="20" y="566" width="280" height="107" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
<circle cx="50" cy="619.5" r="18" fill="#0f766e"/><g transform="translate(39.2 608.7) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m18 14 4 4-4 4"/><path d="m18 2 4 4-4 4"/><path d="M2 18h1.973a4 4 0 0 0 3.3-1.7l5.454-8.6a4 4 0 0 1 3.3-1.7H22"/><path d="M2 6h1.972a4 4 0 0 1 3.6 2.2"/><path d="M22 18h-6.041a4 4 0 0 1-3.3-1.8l-.359-.45"/></g>
<text x="78" y="592.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Đa hình</text>
<text x="78" y="616.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Mỗi lớp có hàm riêng. Ví</text>
<text x="78" y="635.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">dụ: area chạy theo từng</text>
<text x="78" y="655.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">hình.</text>
<rect x="8" y="697" width="304" height="245" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="725.1" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Nhớ gì</text>
<rect x="20" y="742" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="765" r="11" fill="#16a34a"/>
<polyline points="37.9,765.4 41.7,769.4 48.5,761" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="768.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Bốn trụ cột: trừu tượng,</text>
<text x="64" y="787.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">đóng gói, kế thừa, đa hình.</text>
<rect x="20" y="813" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="836" r="11" fill="#16a34a"/>
<polyline points="37.9,836.4 41.7,840.4 48.5,832" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="839.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Kiểm soát truy cập là cách</text>
<text x="64" y="858.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">của từng ngôn ngữ.</text>
<rect x="20" y="884" width="280" height="46" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="907" r="11" fill="#16a34a"/>
<polyline points="37.9,907.4 41.7,911.4 48.5,903" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="910.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Ví dụ Shape do bài tự nghĩ.</text>
</g>
</svg>
