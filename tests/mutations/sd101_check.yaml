# Mutation manifest — see scripts/mutation_check.py
#
# A passing test proves nothing on its own. These break each rule of the System Design store checker
# in turn and require the named test to fail. A mutation that SURVIVES means the test guards nothing.

target: scripts/sd101_check.py
note: The checker is what stops ~400 hand-written lessons drifting from the schema in DECISIONS.md and what keeps source images out of a public repository. Each entry switches one rule off and names the test that must notice.
