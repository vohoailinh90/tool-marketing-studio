<svg xmlns="http://www.w3.org/2000/svg" width="360" height="420" viewBox="0 0 360 420" role="img" aria-labelledby="title desc">
<title id="title">Sáu mẫu messaging trên cloud</title>
<desc id="desc">Job dài và payload lớn: Async request/reply: Claim check: gửi tham chiếu; Phân phối công việc: Pub/sub: nhiều nhóm nhận: Competing: chia việc; Điều phối: Priority: tránh starvation: Saga: bước cục bộ + bù. Các khung là ý chính để đối chiếu, không nhất thiết là các bước tuần tự.</desc>
<rect width="360" height="420" fill="#f8fafc"/>
<g font-family="DejaVu Sans, sans-serif" fill="#0f172a">
<text x="20" y="28" font-size="18" font-weight="bold">sd-11-032 · Nhìn hình trước</text>
<rect x="12" y="48" width="336" height="102" rx="12" fill="#e0f2fe" stroke="#64748b"/>
<text x="24" y="75" font-size="18" font-weight="bold">Job dài và payload lớn</text>
<text x="24" y="104" font-size="18">Async request/reply</text>
<text x="24" y="130" font-size="18">Claim check: gửi tham chiếu</text>
<rect x="12" y="162" width="336" height="102" rx="12" fill="#dcfce7" stroke="#64748b"/>
<text x="24" y="189" font-size="18" font-weight="bold">Phân phối công việc</text>
<text x="24" y="218" font-size="18">Pub/sub: nhiều nhóm nhận</text>
<text x="24" y="244" font-size="18">Competing: chia việc</text>
<rect x="12" y="276" width="336" height="102" rx="12" fill="#fef3c7" stroke="#64748b"/>
<text x="24" y="303" font-size="18" font-weight="bold">Điều phối</text>
<text x="24" y="332" font-size="18">Priority: tránh starvation</text>
<text x="24" y="358" font-size="18">Saga: bước cục bộ + bù</text>
