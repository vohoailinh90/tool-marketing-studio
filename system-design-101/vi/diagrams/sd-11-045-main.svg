<svg xmlns="http://www.w3.org/2000/svg" width="360" height="420" viewBox="0 0 360 420" role="img" aria-labelledby="title desc">
<title id="title">Thiết kế high availability theo miền lỗi</title>
<desc id="desc">Định nghĩa thành công: SLO + cửa sổ đo: Time-based hay request-based?; Tách miền lỗi: Dự phòng app + dữ liệu: Đủ tải khi mất một phần; Chuyển quyền an toàn: Health + failover + fencing: Diễn tập cả phụ thuộc chung. Các khung là ý chính để đối chiếu, không nhất thiết là các bước tuần tự.</desc>
<rect width="360" height="420" fill="#f8fafc"/>
<g font-family="DejaVu Sans, sans-serif" fill="#0f172a">
<text x="20" y="28" font-size="18" font-weight="bold">sd-11-045 · Nhìn hình trước</text>
<rect x="12" y="48" width="336" height="102" rx="12" fill="#e0f2fe" stroke="#64748b"/>
<text x="24" y="75" font-size="18" font-weight="bold">Định nghĩa thành công</text>
<text x="24" y="104" font-size="18">SLO + cửa sổ đo</text>
<text x="24" y="130" font-size="18">Time-based hay request-based?</text>
<rect x="12" y="162" width="336" height="102" rx="12" fill="#dcfce7" stroke="#64748b"/>
<text x="24" y="189" font-size="18" font-weight="bold">Tách miền lỗi</text>
<text x="24" y="218" font-size="18">Dự phòng app + dữ liệu</text>
<text x="24" y="244" font-size="18">Đủ tải khi mất một phần</text>
<rect x="12" y="276" width="336" height="102" rx="12" fill="#fef3c7" stroke="#64748b"/>
<text x="24" y="303" font-size="18" font-weight="bold">Chuyển quyền an toàn</text>
<text x="24" y="332" font-size="18">Health + failover + fencing</text>
<text x="24" y="358" font-size="18">Diễn tập cả phụ thuộc chung</text>
</g>
</svg>
