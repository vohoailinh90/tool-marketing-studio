<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 856" width="320" height="856" role="img" aria-labelledby="title desc">
<title id="title">Sáu cuốn sách DevOps đáng đọc</title>
<desc id="desc">Sáu thẻ xếp dọc theo gợi ý thứ tự đọc: The Phoenix Project, The DevOps Handbook, Continuous Delivery, Accelerate, Site Reliability Engineering, Effective DevOps.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#475569" stroke-width="1.5"/></marker></defs>
<rect width="320" height="856" fill="#f8fafc"/><g font-family="DejaVu Sans, Arial, sans-serif" fill="#0f172a">
<text x="16" y="30" font-size="20" font-weight="bold">SÁU CUỐN · SÁU VIỆC</text>
<text x="16" y="58" font-size="16" font-weight="normal">Thứ tự đọc là gợi ý của bài</text>
<text x="16" y="85" font-size="16" font-weight="normal">này</text>
<rect x="16" y="116" width="288" height="101" rx="10" fill="#fef3c7" stroke="#94a3b8"/>
<text x="30" y="144" font-size="16" font-weight="bold">The Phoenix Project</text>
<text x="30" y="171" font-size="16" font-weight="normal">Tiểu thuyết: vì sao công</text>
<text x="30" y="198" font-size="16" font-weight="normal">việc IT bị nghẽn</text>
<rect x="16" y="229" width="288" height="128" rx="10" fill="#dbeafe" stroke="#94a3b8"/>
<text x="30" y="257" font-size="16" font-weight="bold">The DevOps Handbook</text>
<text x="30" y="284" font-size="16" font-weight="normal">Bức tranh chung: sản phẩm,</text>
<text x="30" y="311" font-size="16" font-weight="normal">chất lượng, vận hành, bảo</text>
<text x="30" y="338" font-size="16" font-weight="normal">mật</text>
<rect x="16" y="369" width="288" height="101" rx="10" fill="#ede9fe" stroke="#94a3b8"/>
<text x="30" y="397" font-size="16" font-weight="bold">Continuous Delivery</text>
<text x="30" y="424" font-size="16" font-weight="normal">Pipeline triển khai, kiểm</text>
<text x="30" y="451" font-size="16" font-weight="normal">thử và phát hành tự động</text>
<rect x="16" y="482" width="288" height="101" rx="10" fill="#dcfce7" stroke="#94a3b8"/>
<text x="30" y="510" font-size="16" font-weight="bold">Accelerate</text>
<text x="30" y="537" font-size="16" font-weight="normal">Đo hiệu quả giao phần mềm</text>
<text x="30" y="564" font-size="16" font-weight="normal">bằng nghiên cứu</text>
<rect x="16" y="595" width="288" height="128" rx="10" fill="#fee2e2" stroke="#94a3b8"/>
<text x="30" y="623" font-size="16" font-weight="bold">Site Reliability</text>
<text x="30" y="650" font-size="16" font-weight="bold">Engineering</text>
<text x="30" y="677" font-size="16" font-weight="normal">Cách Google vận hành hệ</text>
<text x="30" y="704" font-size="16" font-weight="normal">thống lớn</text>
<rect x="16" y="735" width="288" height="101" rx="10" fill="#e2e8f0" stroke="#94a3b8"/>
<text x="30" y="763" font-size="16" font-weight="bold">Effective DevOps</text>
<text x="30" y="790" font-size="16" font-weight="normal">Phối hợp và văn hóa giữa</text>
<text x="30" y="817" font-size="16" font-weight="normal">các nhóm</text>
</g></svg>
