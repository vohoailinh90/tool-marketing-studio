<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 647" width="320" height="647" role="img" aria-labelledby="title desc">
<title id="title">CI/CD qua một hình đơn giản</title>
<desc id="desc">Ba câu hỏi nối tiếp: mã đã được gộp và kiểm tra tự động chưa, có thể phát hành bất cứ lúc nào chưa, và có tự động lên production không.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#475569" stroke-width="1.5"/></marker></defs>
<rect width="320" height="647" fill="#f8fafc"/><g font-family="DejaVu Sans, Arial, sans-serif" fill="#0f172a">
<text x="16" y="30" font-size="20" font-weight="bold">BA CÂU HỎI</text>
<text x="16" y="58" font-size="16" font-weight="normal">Bạn đang ở bậc nào?</text>
<rect x="16" y="89" width="288" height="155" rx="10" fill="#dbeafe" stroke="#94a3b8"/>
<text x="30" y="117" font-size="16" font-weight="bold">1 · Gộp mã thường</text>
<text x="30" y="144" font-size="16" font-weight="bold">xuyên chưa?</text>
<text x="30" y="171" font-size="16" font-weight="normal">Mỗi lần gộp tự build và</text>
<text x="30" y="198" font-size="16" font-weight="normal">kiểm thử</text>
<text x="30" y="225" font-size="16" font-weight="normal">Đó là CI</text>
<line x1="160" y1="256" x2="160" y2="284" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="16" y="294" width="288" height="155" rx="10" fill="#fef3c7" stroke="#94a3b8"/>
<text x="30" y="322" font-size="16" font-weight="bold">2 · Phát hành lúc nào</text>
<text x="30" y="349" font-size="16" font-weight="bold">cũng được?</text>
<text x="30" y="376" font-size="16" font-weight="normal">Luôn có bản sẵn sàng; người</text>
<text x="30" y="403" font-size="16" font-weight="normal">quyết định thời điểm</text>
<text x="30" y="430" font-size="16" font-weight="normal">Đó là Continuous Delivery</text>
<line x1="160" y1="461" x2="160" y2="489" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="16" y="499" width="288" height="128" rx="10" fill="#dcfce7" stroke="#94a3b8"/>
<text x="30" y="527" font-size="16" font-weight="bold">3 · Tự lên production?</text>
<text x="30" y="554" font-size="16" font-weight="normal">Qua kiểm thử là tự triển</text>
<text x="30" y="581" font-size="16" font-weight="normal">khai</text>
<text x="30" y="608" font-size="16" font-weight="normal">Đó là Continuous Deployment</text>
</g></svg>
