      trình chuyên môn và sản phẩm bàn giao.'
  - text: 'Chuyển đổi cấu trúc: Tập lệnh chuyển đổi đọc cấu hình gốc và tách thành cấu trúc phù hợp từng
      công cụ (như SOUL, AGENTS, IDENTITY).'
  - text: 'Tích hợp công cụ: Tập lệnh cài đặt phát hiện hoặc ghi trực tiếp tệp vào thư mục cấu hình của
      công cụ AI cục bộ.'
