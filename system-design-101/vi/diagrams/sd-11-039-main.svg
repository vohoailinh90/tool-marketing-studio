<text x="24" y="104" font-size="18">TCP/UDP theo sản phẩm</text>
<text x="24" y="130" font-size="18">Đặc tính kết nối và IP</text>
<rect x="12" y="162" width="336" height="102" rx="12" fill="#dcfce7" stroke="#64748b"/>
<text x="24" y="189" font-size="18" font-weight="bold">L7</text>
<text x="24" y="218" font-size="18">HTTP host/path/header</text>
<text x="24" y="244" font-size="18">TLS termination khi cấu hình</text>
<rect x="12" y="276" width="336" height="102" rx="12" fill="#fef3c7" stroke="#64748b"/>
<text x="24" y="303" font-size="18" font-weight="bold">So sản phẩm</text>
