<svg xmlns="http://www.w3.org/2000/svg" width="320" height="1677" viewBox="0 0 320 1677" role="img" aria-labelledby="title desc">
<title id="title">Tiền đi đâu sau một đơn hàng</title>
<desc id="desc">Bốn khung. Khung một, Bob trả Amazon: Bob mua sách trên Amazon và chọn trả bằng PayPal, Amazon gửi PayPal yêu cầu chuyển tiền, PayPal chuyển tiền thay Bob vào tài khoản của Amazon ở ngân hàng A. Khung hai, bù trừ rồi quyết toán: ngân hàng A và B gửi sao kê cho tổ chức bù trừ, chỉ tính chênh lệch ròng, rồi tiền thật đi giữa hai quỹ dự trữ ở ngân hàng quyết toán. Khung ba, Amazon trả người bán: Amazon báo người bán, hai ngân hàng ghi sổ, rồi cũng bù trừ và quyết toán. Khung bốn, ba lớp: giao dịch, thanh toán và bù trừ, quyết toán; hai lớp đầu là dòng thông tin, lớp cuối là dòng tiền.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs>
<rect width="320" height="1677" fill="#f8fafc"/>
<g font-family="DejaVu Sans, Arial, sans-serif" fill="#0f172a">
<text x="16" y="34" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">Tiền đi đâu sau một đơn</text>
<text x="16" y="58" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">hàng</text>
<text x="16" y="84.2" font-size="15" fill="#475569" font-weight="normal" text-anchor="start">Thông tin chạy trước, tiền thật đi sau</text>
<text x="16" y="103.8" font-size="15" fill="#475569" font-weight="normal" text-anchor="start">ở ngân hàng quyết toán.</text>
<rect x="8" y="123" width="304" height="433" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="151.2" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">1. Bob trả Amazon</text>
<rect x="20" y="168" width="84" height="67" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="62" cy="190" r="14" fill="#1d4ed8"/><g transform="translate(53.6 181.6) scale(0.7)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></g>
<text x="62" y="221.9" font-size="15" fill="#0f172a" font-weight="bold" text-anchor="middle">Bob</text>
<rect x="118" y="168" width="84" height="67" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="160" cy="190" r="14" fill="#1d4ed8"/><g transform="translate(151.6 181.6) scale(0.7)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 21v-5a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v5"/><path d="M17.774 10.31a1.12 1.12 0 0 0-1.549 0 2.5 2.5 0 0 1-3.451 0 1.12 1.12 0 0 0-1.548 0 2.5 2.5 0 0 1-3.452 0 1.12 1.12 0 0 0-1.549 0 2.5 2.5 0 0 1-3.77-3.248l2.889-4.184A2 2 0 0 1 7 2h10a2 2 0 0 1 1.653.873l2.895 4.192a2.5 2.5 0 0 1-3.774 3.244"/><path d="M4 10.95V19a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8.05"/></g>
<text x="160" y="221.9" font-size="15" fill="#0f172a" font-weight="bold" text-anchor="middle">Amazon</text>
<rect x="216" y="168" width="84" height="67" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="258" cy="190" r="14" fill="#1d4ed8"/><g transform="translate(249.6 181.6) scale(0.7)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect height="14" rx="2" width="20" x="2" y="5"/><line x1="2" x2="22" y1="10" y2="10"/><path d="M6 14h2"/></g>
<text x="258" y="221.9" font-size="15" fill="#0f172a" font-weight="bold" text-anchor="middle">PayPal</text>
<polyline points="62,235 62,544" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4 4"/>
<polyline points="160,235 160,544" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4 4"/>
<polyline points="258,235 258,544" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4 4"/>
<text x="111" y="263.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="middle">Mua sách,</text>
<text x="111" y="282.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="middle">chọn trả</text>
<text x="111" y="302.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="middle">bằng</text>
<text x="111" y="321.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="middle">PayPal</text>
<polyline points="63,335 157,335" fill="none" stroke="#334155" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="209" y="363.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="middle">Yêu cầu</text>
<text x="209" y="382.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="middle">chuyển</text>
<text x="209" y="402.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="middle">tiền</text>
<polyline points="161,416 255,416" fill="none" stroke="#334155" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="209" y="444.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="middle">Chuyển</text>
<text x="209" y="463.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="middle">tiền vào</text>
<text x="209" y="483.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="middle">ngân hàng</text>
<text x="209" y="502.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="middle">A của</text>
<text x="209" y="522.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="middle">Amazon</text>
<polyline points="257,536 163,536" fill="none" stroke="#334155" stroke-width="1.8" stroke-dasharray="5 4" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="8" y="568" width="304" height="362" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="596.1" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">2. Bù trừ rồi quyết toán</text>
<rect x="20" y="613" width="280" height="87" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
<circle cx="46" cy="639" r="14" fill="#0f766e"/>
<text x="46" y="644.5" font-size="16" fill="#ffffff" font-weight="bold" text-anchor="middle">1</text>
<text x="70" y="639.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Gửi sao kê</text>
<text x="70" y="663.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Ngân hàng A và B gửi sao</text>
<text x="70" y="682.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">kê cho tổ chức bù trừ.</text>
<rect x="20" y="722" width="280" height="87" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
<circle cx="46" cy="748" r="14" fill="#0f766e"/>
<text x="46" y="753.5" font-size="16" fill="#ffffff" font-weight="bold" text-anchor="middle">2</text>
<text x="70" y="748.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Bù trừ</text>
<text x="70" y="772.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">A nợ B 100, B nợ A 500: chỉ</text>
<text x="70" y="791.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">B trả A 400.</text>
<polyline points="46,702 46,720" fill="none" stroke="#334155" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="20" y="831" width="280" height="87" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
<circle cx="46" cy="857" r="14" fill="#0f766e"/>
<text x="46" y="862.5" font-size="16" fill="#ffffff" font-weight="bold" text-anchor="middle">3</text>
<text x="70" y="857.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Quyết toán</text>
<text x="70" y="881.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Tiền thật đi giữa hai quỹ dự</text>
<text x="70" y="900.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">trữ ở ngân hàng quyết toán.</text>
<polyline points="46,811 46,829" fill="none" stroke="#334155" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="8" y="942" width="304" height="382" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="970.1" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">3. Amazon trả người bán</text>
<rect x="20" y="987" width="280" height="87" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
<circle cx="46" cy="1013" r="14" fill="#b45309"/>
<text x="46" y="1018.5" font-size="16" fill="#ffffff" font-weight="bold" text-anchor="middle">1</text>
<text x="70" y="1013.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Báo người bán</text>
<text x="70" y="1037.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Amazon báo Claire sắp</text>
<text x="70" y="1056.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">được trả.</text>
<rect x="20" y="1096" width="280" height="107" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
<circle cx="46" cy="1122" r="14" fill="#b45309"/>
<text x="46" y="1127.5" font-size="16" fill="#ffffff" font-weight="bold" text-anchor="middle">2</text>
<text x="70" y="1122.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Chuyển giữa hai ngân</text>
<text x="70" y="1142.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">hàng</text>
<text x="70" y="1166.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Hai bên ghi sổ, chưa có tiền</text>
<text x="70" y="1185.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">thật đi.</text>
<polyline points="46,1076 46,1094" fill="none" stroke="#334155" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="20" y="1225" width="280" height="87" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
<circle cx="46" cy="1251" r="14" fill="#b45309"/>
<text x="46" y="1256.5" font-size="16" fill="#ffffff" font-weight="bold" text-anchor="middle">3</text>
<text x="70" y="1251.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Bù trừ, quyết toán</text>
<text x="70" y="1275.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Tiền đi từ quỹ ngân hàng A</text>
<text x="70" y="1294.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">sang quỹ ngân hàng C.</text>
<polyline points="46,1205 46,1223" fill="none" stroke="#334155" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="8" y="1336" width="304" height="333" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="1364.1" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Ba lớp, hai dòng</text>
<rect x="20" y="1381" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="1404" r="11" fill="#16a34a"/>
<polyline points="37.9,1404.4 41.7,1408.4 48.5,1400" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="1407.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Lớp giao dịch: nơi việc mua</text>
<text x="64" y="1426.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">hàng diễn ra.</text>
<rect x="20" y="1452" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="1475" r="11" fill="#16a34a"/>
<polyline points="37.9,1475.4 41.7,1479.4 48.5,1471" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="1478.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Lớp thanh toán và bù trừ:</text>
<text x="64" y="1497.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">lệnh và việc tính chênh lệch.</text>
<rect x="20" y="1523" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="1546" r="11" fill="#16a34a"/>
<polyline points="37.9,1546.4 41.7,1550.4 48.5,1542" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="1549.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Lớp quyết toán: tiền thật</text>
<text x="64" y="1568.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">mới di chuyển.</text>
<rect x="20" y="1594" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="1617" r="11" fill="#16a34a"/>
<polyline points="37.9,1617.4 41.7,1621.4 48.5,1613" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="1620.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Hai lớp đầu là dòng thông</text>
<text x="64" y="1639.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">tin, lớp cuối là dòng tiền.</text>
</g>
</svg>
