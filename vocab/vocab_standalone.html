  {"term": "take it back", "meaning": "Rút lại lời nói", "register": "Trung tính", "note": "'I wish I could take back what I said'", "source": "Ch.2 Mirroring", "lang": "EN"},

  {"term": "rattled", "meaning": "Bị lung lay, mất bình tĩnh", "register": "Trung tính", "note": "Khác flustered: vẫn còn nói được nhưng bị xáo trộn tâm lý", "source": "Ch.2 Mirroring", "lang": "EN"},

  {"term": "running through one's head", "meaning": "Đang nghĩ đến, chạy qua trong đầu", "register": "Văn nói", "note": "'What's running through your head right now?'", "source": "Ch.2 Mirroring", "lang": "EN"},
  {"term": "critical (= important)", "meaning": "Quan trọng, then chốt", "register": "Trung tính", "note": "Phân biệt với 'critical' = nguy cấp", "source": "Ch.2 Mirroring", "lang": "EN"},
];
// </vocab-data>

const REGISTER_COLORS = {
  "Văn nói":       { bg: "#E8F4FD", text: "#1565C0", label: "🗣 Văn nói" },
  "Văn viết":      { bg: "#FEF9E7", text: "#7D6608", label: "✍️ Văn viết" },
  "Trung tính":    { bg: "#F4F4F4", text: "#444",    label: "⚖️ Trung tính" },
  "Chuyên nghiệp": { bg: "#F0FFF4", text: "#1B5E20", label: "💼 Chuyên nghiệp" },
  "Chuyên ngành":  { bg: "#FFF0F6", text: "#880E4F", label: "🔬 Chuyên ngành" },
};
function getRegColor(r) { return REGISTER_COLORS[r] || { bg: "#F4F4F4", text: "#444", label: r }; }

// The identity of a word. The same rule as term_key in scripts/vocab.py (tests/test_vocab.py runs both on the
// same samples): NFKC, lower case, single spaces, and a kana reading in brackets is dropped.
function termKey(term) {
  return String(term == null ? "" : term).normalize("NFKC").replace(/\s+/g, " ").trim().toLowerCase()
    .replace(/\s*\([぀-ゟ゠-ヿ・\s]+\)$/, "").trim();
}
function detectLang(term) {
  return /[぀-ゟ゠-ヿ㐀-䶿一-鿿ｦ-ﾟ]/.test(term) ? "JA" : "EN";
}
function normRegister(value) {
  const bare = String(value == null ? "" : value).replace(/^[^\p{L}\p{N}_]+/u, "").trim().toLowerCase();
  const names = Object.keys(REGISTER_COLORS);
  for (let i = 0; i < names.length; i++) { if (names[i].toLowerCase() === bare) return names[i]; }
  return "Trung tính";
}

const PROMPT_TEMPLATE = "Hãy tổng hợp toàn bộ từ vựng/cụm từ (tiếng Anh và tiếng Nhật) mà bạn đã giải thích cho mình từ đầu cuộc trò chuyện này (hoặc từ lần tổng hợp gần nhất) đến giờ.\n\n" +
"Trình bày dưới dạng bảng markdown, đúng 5 cột theo thứ tự sau, không thêm cột nào khác:\n\n" +
"| Từ/Cụm | Nghĩa tiếng Việt | Văn phong | Ghi chú | Nguồn |\n" +
"|---|---|---|---|---|\n" +
"| ví dụ | ví dụ nghĩa | Văn nói / Văn viết / Trung tính | ghi chú ngắn | tên bài/chương |\n\n" +
"Không viết gì thêm ngoài bảng này.";

function parseClaudeOutput(text) {
  const lines = text.split("\n").map(function(l){return l.trim();}).filter(Boolean);
  const rows = [];
  for (let idx = 0; idx < lines.length; idx++) {
    const line = lines[idx];
    if (!line.startsWith("|")) continue;
    const cells = line.replace(/^\||\|$/g, "").split("|").map(function(c){return c.trim();});
    if (cells.length < 2) continue;
    // Chỉ coi là dòng tiêu đề khi ô đầu tiên là "Từ/Cụm" (không quét nội dung các ô khác)
    if (/^từ\s*\/?\s*cụm$/i.test(cells[0].replace(/\*\*/g, ""))) continue;
    if (/^[-:\s]+$/.test(cells.join(""))) continue;
    const term = cells[0], meaning = cells[1], register = cells[2], note = cells[3], source = cells[4];
    if (!term || !meaning) continue;
    if (/^-+$/.test(term)) continue;
    const lang = detectLang(term);
    rows.push({
      term: term.replace(/\*\*/g, ""),
      meaning: meaning || "",
      register: normRegister(register),
      note: note || "",
      source: source || "",
      lang: lang
    });
  }
  return rows;
}

// ── Storage (localStorage) ──────────────────────────────────────────────
// The words in the repository (SEED) are the source of truth and are never copied here. The browser keeps only the
// words added on this machine: { version: 2, local: [...] }.
const STORAGE_KEY = "vocab-linh-standalone-v2";
// Version 1 held the whole list. It is read once to carry the words added by hand into version 2, then left untouched.
const STORAGE_KEY_V1 = "vocab-linh-standalone-v1";
function readStored(key) {
  try {
    const raw = localStorage.getItem(key);
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  return null;
}
function saveLocal(list) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify({ version: 2, local: list })); } catch (e) {}
}
function cleanEntry(e) {
  if (!e || typeof e.term !== "string" || typeof e.meaning !== "string") return null;
  const term = e.term.trim(), meaning = e.meaning.trim();
  if (!term || !meaning) return null;
  return {
    term: term, meaning: meaning, register: normRegister(e.register),
    note: typeof e.note === "string" ? e.note : "", source: typeof e.source === "string" ? e.source : "",
    lang: e.lang === "EN" || e.lang === "JA" ? e.lang : detectLang(term)
  };
}
// The words kept on this machine, without any the repository holds now and without repeats.
function loadLocal(repoKeys) {
  const v2 = readStored(STORAGE_KEY);
  const v1 = readStored(STORAGE_KEY_V1);
  const list = v2 && Array.isArray(v2.local) ? v2.local : (Array.isArray(v1) ? v1 : []);
  const seen = new Set(repoKeys);
  const out = [];
  list.forEach(function (e) {
    const c = cleanEntry(e);
    if (!c || seen.has(termKey(c.term))) return;
    seen.add(termKey(c.term));
    out.push(c);
  });
  return out;
}

// ── App state ────────────────────────────────────────────────────────────
const REPO_WORDS = SEED.map(function (e) { return Object.assign({}, e, { repo: true }); });
const REPO_KEYS = new Set(REPO_WORDS.map(function (e) { return termKey(e.term); }));
// The most recent batch the repository received; its words carry the "Mới" mark.
const LATEST_ADDED = REPO_WORDS.reduce(function (m, e) { return e.added && e.added > m ? e.added : m; }, "");
const localLoaded = loadLocal(REPO_KEYS);
saveLocal(localLoaded);
let state = {
  vocab: REPO_WORDS.concat(localLoaded),
  tab: "list",
  search: "",
  filterReg: "Tất cả",
  filterLang: "Tất cả",
  filterSource: "Tất cả",
  onlyNew: false,
  flashDeck: [],
  flashIdx: 0,
  showAns: false,
  pasteText: "",
  parsedPreview: [],
  form: { term: "", meaning: "", register: "Trung tính", note: "", source: "", lang: "EN" }
};

function countLang(lang) { return state.vocab.filter(function (v) { return v.lang === lang; }).length; }
function localWords() { return state.vocab.filter(function (v) { return !v.repo; }); }
function persist() { saveLocal(localWords()); }
function isNew(v) { return !!(v.repo && LATEST_ADDED && v.added === LATEST_ADDED); }
function hasWord(term) {
  const key = termKey(term);
  return state.vocab.some(function (v) { return termKey(v.term) === key; });
}
function esc(s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

function getFiltered() {
  const q = state.search.toLowerCase();
  return state.vocab.filter(function (v) {
    const matchSearch = !q || v.term.toLowerCase().indexOf(q) !== -1 || v.meaning.toLowerCase().indexOf(q) !== -1 || (v.note || "").toLowerCase().indexOf(q) !== -1;
    const matchReg = state.filterReg === "Tất cả" || v.register === state.filterReg;
    const matchLang = state.filterLang === "Tất cả" || v.lang === state.filterLang;
    const matchSource = state.filterSource === "Tất cả" || v.source === state.filterSource;
    return matchSearch && matchReg && matchLang && matchSource && (!state.onlyNew || isNew(v));
  });
}

// ── Render functions ─────────────────────────────────────────────────────
function render() {
  const app = document.getElementById("app");
  app.innerHTML = "";

  const header = document.createElement("div");
  header.style.cssText = "background:#1E3A5F;color:#fff;padding:18px 24px 14px;display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:10px;";
  header.innerHTML =
    '<div>' +
      '<div style="font-size:20px;font-weight:700;letter-spacing:.3px;">📚 Từ vựng của Linh</div>' +
      '<div id="hdr-count" style="font-size:12px;opacity:.7;margin-top:3px;">' + state.vocab.length + ' từ · EN ' + countLang("EN") + ' · JA ' + countLang("JA") + '</div>' +
      '<div id="hdr-where" style="font-size:10.5px;opacity:.55;margin-top:5px;">📦 ' + REPO_WORDS.length + ' từ trong repo' +
        (LATEST_ADDED ? ' (lô mới nhất: ' + esc(LATEST_ADDED) + ')' : '') +
        ' · 💾 ' + localWords().length + ' từ chỉ có trên máy này (localStorage)</div>' +
    '</div>';
  const btnGroup = document.createElement("div");
  btnGroup.style.cssText = "display:flex;gap:8px;";
  const backupBtn = document.createElement("button");
  backupBtn.textContent = "⬇ Sao lưu";
  backupBtn.title = "Tải về các từ chỉ có trên máy này (từ trong repo đã nằm sẵn trong file)";
  backupBtn.style.cssText = "padding:7px 12px;background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:6px;cursor:pointer;font-size:11.5px;";
  backupBtn.onclick = exportJSON;
  const restoreLabel = document.createElement("label");
  restoreLabel.style.cssText = "padding:7px 12px;background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:6px;cursor:pointer;font-size:11.5px;";
  restoreLabel.textContent = "⬆ Phục hồi";
  const restoreInput = document.createElement("input");

function renderTableInto(container) {
  container.innerHTML = "";

    const empty = document.createElement("div");
    empty.style.cssText = "text-align:center;padding:40px;color:#aaa;";

    return;
  }
  const table = document.createElement("table");
  const thead = document.createElement("thead");
  const headRow = document.createElement("tr");
  ["#","Từ / Cụm","Nghĩa tiếng Việt","Văn phong","Ghi chú","Nguồn",""].forEach(function (h) {
    const th = document.createElement("th"); th.textContent = h; headRow.appendChild(th);
  });
  thead.appendChild(headRow);
  table.appendChild(thead);

  const tbody = document.createElement("tbody");
  filtered.forEach(function (v, i) {
    const rc = getRegColor(v.register);
    const tr = document.createElement("tr");

    const tdIdx = document.createElement("td"); tdIdx.style.cssText = "color:#aaa;font-size:11px;"; tdIdx.textContent = (i+1);
    const tdTerm = document.createElement("td"); tdTerm.style.cssText = "font-weight:600;color:#1E3A5F;";
    tdTerm.innerHTML = esc(v.term) + ' <span style="margin-left:5px;font-size:10px;color:#aaa;">' + esc(v.lang) + '</span>' +
      (isNew(v) ? ' <span class="tag mark-new" style="background:#FFF3CD;color:#7A5B00;">✨ Mới</span>' : '') +
      (v.repo ? '' : ' <span class="tag mark-local" style="background:#EEE;color:#555;" title="Chỉ lưu trên máy này, chưa vào repo">máy này</span>');
    const tdMeaning = document.createElement("td"); tdMeaning.textContent = v.meaning;
    const tdReg = document.createElement("td");
    tdReg.innerHTML = '<span class="tag" style="background:' + rc.bg + ';color:' + rc.text + ';">' + esc(rc.label) + '</span>';
    const tdNote = document.createElement("td"); tdNote.style.cssText = "color:#555;font-size:12px;"; tdNote.textContent = v.note || "";
    const tdSource = document.createElement("td"); tdSource.style.cssText = "color:#888;font-size:11px;"; tdSource.textContent = v.source || "";
    const tdDel = document.createElement("td");
    if (v.repo) {
      // A word in the repository is removed through Claude Code ("xóa từ …"), not from this page.
      tdDel.style.cssText = "color:#ccc;font-size:12px;";
      tdDel.textContent = "📦"; tdDel.title = "Từ trong repo — muốn xóa, nhờ Claude Code";
    } else {
      const delBtn = document.createElement("button"); delBtn.className = "del-btn"; delBtn.textContent = "✕"; delBtn.title = "Xóa khỏi máy này";
      delBtn.onclick = function () {
        state.vocab = state.vocab.filter(function (x) { return x !== v; });
        persist();
        render();
      };
      tdDel.appendChild(delBtn);
    }

    tr.appendChild(tdIdx); tr.appendChild(tdTerm); tr.appendChild(tdMeaning); tr.appendChild(tdReg);
    tr.appendChild(tdNote); tr.appendChild(tdSource); tr.appendChild(tdDel);
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  container.appendChild(table);
}

  prevBtn.style.cssText = "padding:9px 22px;border-radius:7px;border:1px solid #ccc;font-size:14px;" + (atStart ? "background:#f5f5f5;color:#ccc;cursor:default;" : "background:#fff;color:#333;cursor:pointer;");
  prevBtn.onclick = function () { state.flashIdx = Math.max(0, state.flashIdx - 1); state.showAns = false; render(); };

  const shuffleBtn = document.createElement("button");
  shuffleBtn.textContent = "🔀 Xáo lại";
  shuffleBtn.style.cssText = "padding:9px 22px;border-radius:7px;border:none;background:#E8F0FE;color:#1E3A5F;cursor:pointer;font-weight:600;font-size:14px;";

    state.flashIdx = 0; state.showAns = false; render();
  };

  const nextBtn = document.createElement("button");

  nextBtn.onclick = function () { state.flashIdx = Math.min(state.flashDeck.length - 1, state.flashIdx + 1); state.showAns = false; render(); };

  nav.appendChild(prevBtn); nav.appendChild(shuffleBtn); nav.appendChild(nextBtn);
  body.appendChild(nav);
}

const CLAUDE_CODE_PROMPT = "Tổng hợp từ vựng: thêm vào kho từ vựng của repo toàn bộ từ/cụm từ bạn đã giải thích từ đầu cuộc trò chuyện này (hoặc từ lần tổng hợp gần nhất).";

function copyText(text, button, doneLabel) {
  const label = button.textContent, background = button.style.background;
  function done() {
    button.textContent = doneLabel; button.style.background = "#2E7D32";
    setTimeout(function () { button.textContent = label; button.style.background = background; }, 2000);
  }
  function fallback() {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed"; ta.style.left = "-9999px";
    document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); } catch (e) {}
    document.body.removeChild(ta);
    done();
  }
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done).catch(fallback);
  else fallback();
}

// The 5-column table that scripts/vocab.py add reads (and parseClaudeOutput below reads back).
function wordsAsTable(list) {
  const cell = function (s) { return String(s == null ? "" : s).replace(/\s*[\r\n]+\s*/g, " ").replace(/\|/g, "/"); };
  return "| Từ/Cụm | Nghĩa tiếng Việt | Văn phong | Ghi chú | Nguồn |\n|---|---|---|---|---|\n" +
    list.map(function (v) {
      return "| " + [v.term, v.meaning, v.register, v.note, v.source].map(cell).join(" | ") + " |";
    }).join("\n");
}

  d.innerHTML = html;
  return d;
}

  }

  textarea.oninput = function (e) { state.pasteText = e.target.value; updatePreview(); };
  importBtn.onclick = function () {
    const rows = state.parsedPreview;
    if (rows.length === 0) return;
    let added = 0;
    rows.forEach(function (row) {
      const c = cleanEntry(row);
      if (!c || hasWord(c.term)) return;
      state.vocab.push(c);
      added++;
    });
    persist();
    state.pasteText = ""; state.parsedPreview = [];
    importBtn.textContent = "✅ Đã thêm " + added + " từ" + (added < rows.length ? " (" + (rows.length - added) + " từ trùng, bỏ qua)" : "");
    importBtn.style.background = "#2E7D32";
    setTimeout(function () { render(); }, 1100);
  };

  updatePreview();
}

function renderAdd(body) {
  body.style.cssText = "padding:20px;max-width:520px;";
  const title = document.createElement("div");
  title.style.cssText = "font-size:15px;font-weight:700;color:#1E3A5F;margin-bottom:16px;";
  title.textContent = "Thêm từ mới";
  body.appendChild(title);

  const fields = [
    ["Từ / Cụm *", "term", "laughably simple"],
    ["Nghĩa tiếng Việt *", "meaning", "Đơn giản đến mức buồn cười"],
    ["Ghi chú / Ví dụ ngắn", "note", "Nhấn mạnh sự đơn giản đến ngạc nhiên"],
    ["Nguồn / Chủ đề", "source", "Ch.2 Mirroring"]
  ];
  fields.forEach(function (f) {
    const wrap = document.createElement("div");
    wrap.style.marginBottom = "12px";
    const label = document.createElement("label");
    label.className = "field-label"; label.textContent = f[0];
    const input = document.createElement("input");
    input.className = "field-input"; input.placeholder = f[2]; input.value = state.form[f[1]];
    input.oninput = function (e) { state.form[f[1]] = e.target.value; };
    wrap.appendChild(label); wrap.appendChild(input);
    body.appendChild(wrap);
  });

  const row = document.createElement("div");
  row.style.cssText = "display:flex;gap:12px;margin-bottom:12px;";

  const regWrap = document.createElement("div"); regWrap.style.flex = "1";
  const regLabel = document.createElement("label"); regLabel.className = "field-label"; regLabel.textContent = "Văn phong";
  const regSelect = document.createElement("select");
  regSelect.style.cssText = "width:100%;padding:9px 10px;border:1px solid #ccc;border-radius:6px;font-size:13px;";
  Object.keys(REGISTER_COLORS).forEach(function (r) {
    const o = document.createElement("option"); o.value = r; o.textContent = r;
    if (r === state.form.register) o.selected = true;
    regSelect.appendChild(o);
  });
  regSelect.onchange = function (e) { state.form.register = e.target.value; };
  regWrap.appendChild(regLabel); regWrap.appendChild(regSelect);

  const langWrap = document.createElement("div"); langWrap.style.flex = "1";
  const langLabel = document.createElement("label"); langLabel.className = "field-label"; langLabel.textContent = "Ngôn ngữ";
  const langSelect = document.createElement("select");
  langSelect.style.cssText = "width:100%;padding:9px 10px;border:1px solid #ccc;border-radius:6px;font-size:13px;";
  ["EN","JA"].forEach(function (l) {
    const o = document.createElement("option"); o.value = l; o.textContent = l;
    if (l === state.form.lang) o.selected = true;
    langSelect.appendChild(o);
  });
  langSelect.onchange = function (e) { state.form.lang = e.target.value; };
  langWrap.appendChild(langLabel); langWrap.appendChild(langSelect);

  row.appendChild(regWrap); row.appendChild(langWrap);
  body.appendChild(row);

  const saveBtn = document.createElement("button");
  saveBtn.className = "primary-btn";
  saveBtn.style.width = "100%";
  saveBtn.textContent = "Lưu từ mới";
  saveBtn.onclick = function () {
    const entry = cleanEntry(state.form);
    if (!entry) return;
    if (hasWord(entry.term)) {
      saveBtn.textContent = "⚠ Từ này đã có trong danh sách";
      setTimeout(function () { saveBtn.textContent = "Lưu từ mới"; }, 1500);
      return;
    }
    state.vocab.push(entry);
    persist();
    state.form = { term: "", meaning: "", register: "Trung tính", note: "", source: "", lang: "EN" };
    saveBtn.textContent = "✅ Đã lưu!";
    setTimeout(function () { render(); }, 700);
  };
  body.appendChild(saveBtn);

  const hint = document.createElement("div");
  hint.style.cssText = "font-size:11px;color:#aaa;margin-top:10px;text-align:center;";
  hint.textContent = "Từ thêm tay chỉ lưu trên máy này. Muốn đưa vào repo, dùng tab Cập nhật từ vựng.";
  body.appendChild(hint);
}

// ── Backup / Restore ─────────────────────────────────────────────────────
// Only the words that exist nowhere but in this browser: the repository's words are already in this file.
// `python3 scripts/vocab.py add --from vocab_local_backup.json` folds the backup into the repository too.
function exportJSON() {
  const blob = new Blob([JSON.stringify(localWords().map(function (v) {
    return { term: v.term, meaning: v.meaning, register: v.register, note: v.note, source: v.source, lang: v.lang };
  }), null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = "vocab_local_backup.json"; a.click();
  URL.revokeObjectURL(url);
}
function importJSONFile(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function (ev) {
    try {
      const data = JSON.parse(ev.target.result);
      if (!Array.isArray(data)) { alert("File không đúng định dạng."); return; }
      // Added to this machine's words; ones the page already has (the repository's included) are skipped.
      let added = 0;
      data.forEach(function (item) {
        const c = cleanEntry(item);
        if (!c || hasWord(c.term)) return;
        state.vocab.push(c);
        added++;
      });
      persist(); render();
      alert("Đã khôi phục " + added + " từ" + (added < data.length ? " (" + (data.length - added) + " từ đã có, bỏ qua)" : "") + ".");
    } catch (err) { alert("File không đúng định dạng."); }
  };
  reader.readAsText(file);
  e.target.value = "";
}

// ── Init ─────────────────────────────────────────────────────────────────
render();
</script>
