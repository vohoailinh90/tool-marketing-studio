- layout: cover
  emoji: 🤖
  eyebrow: Radar GitHub · AI
  title: 'DeepSeek Harness: Khám phá kiến trúc mọi thứ là plugin'
  subtitle: DeepSeek Harness (dsh) là một khung mã nguồn mở dành cho AI agent do DeepSeek AI phát triển,
    ứng dụng kiến trúc mọi thứ là plugin dựa trên Cordis.
- layout: stat
  eyebrow: Số liệu theo ngày quét
  value: '249.184'
  label: sao trên GitHub
  caption: MIT · TypeScript
- layout: quote
  text: Khi phát triển các ứng dụng AI agent phức tạp, việc mở rộng tính năng và quản lý các mô-đun thường
    trở nên khó khăn và rối rắm. DeepSeek Harness giải quyết bài toán này bằng cách mô-đun hóa toàn bộ
    hệ thống để dễ dàng tùy chỉnh.
  author: Vấn đề nó giải quyết
- layout: flow
  variant: after
  title: Nó chạy thế nào
  steps:
  - text: 'Cài đặt và chạy: Sử dụng Node.js để chạy trực tiếp từ npm hoặc clone mã nguồn từ kho chứa để
      bắt đầu khởi động giao diện Web.'
  - text: 'Sử dụng kiến trúc Plugin: Hệ thống vận hành dựa trên triết lý mọi thứ là plugin, được hỗ trợ
      bởi Cordis để tăng tính linh hoạt và khả năng kết hợp.'
  - text: 'Phát triển và mở rộng: Nhà phát triển có thể tận dụng các công cụ dòng lệnh, tài liệu hướng
      dẫn và gói nguồn mở để xây dựng các tiện ích mở rộng riêng.'
