<text x="16" y="60.2" font-size="15" fill="#475569" font-weight="normal" text-anchor="start">Gần một phần ba số dòng ở trang</text>
<text x="16" y="79.8" font-size="15" fill="#475569" font-weight="normal" text-anchor="start">dịch vụ khác.</text>
