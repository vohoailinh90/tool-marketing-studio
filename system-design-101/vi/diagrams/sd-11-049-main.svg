<svg xmlns="http://www.w3.org/2000/svg" width="360" height="420" viewBox="0 0 360 420" role="img" aria-labelledby="title desc">
<title id="title">Bảng tra dịch vụ AWS theo trách nhiệm</title>
<desc id="desc">Compute và storage: EC2 • ECS/EKS • Lambda: S3 • EBS • EFS; DB và messaging: RDS • DynamoDB • ElastiCache: SQS • SNS • EventBridge; Mạng và vận hành: VPC • DNS • CDN • LB: IAM • secrets • metrics/audit. Các khung là ý chính để đối chiếu, không nhất thiết là các bước tuần tự.</desc>
<rect width="360" height="420" fill="#f8fafc"/>
<g font-family="DejaVu Sans, sans-serif" fill="#0f172a">
<text x="20" y="28" font-size="18" font-weight="bold">sd-11-049 · Nhìn hình trước</text>
<rect x="12" y="48" width="336" height="102" rx="12" fill="#e0f2fe" stroke="#64748b"/>
<text x="24" y="75" font-size="18" font-weight="bold">Compute và storage</text>
<text x="24" y="104" font-size="18">EC2 • ECS/EKS • Lambda</text>
<text x="24" y="130" font-size="18">S3 • EBS • EFS</text>
<rect x="12" y="162" width="336" height="102" rx="12" fill="#dcfce7" stroke="#64748b"/>
<text x="24" y="189" font-size="18" font-weight="bold">DB và messaging</text>
<text x="24" y="218" font-size="18">RDS • DynamoDB • ElastiCache</text>
<text x="24" y="244" font-size="18">SQS • SNS • EventBridge</text>
<rect x="12" y="276" width="336" height="102" rx="12" fill="#fef3c7" stroke="#64748b"/>
<text x="24" y="303" font-size="18" font-weight="bold">Mạng và vận hành</text>
<text x="24" y="332" font-size="18">VPC • DNS • CDN • LB</text>
<text x="24" y="358" font-size="18">IAM • secrets • metrics/audit</text>
</g>
</svg>
