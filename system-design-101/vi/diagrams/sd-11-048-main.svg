<svg xmlns="http://www.w3.org/2000/svg" width="360" height="420" viewBox="0 0 360 420" role="img" aria-labelledby="title desc">
<title id="title">Pipeline dữ liệu lớn trên ba cloud</title>
<desc id="desc">Nhận và giữ raw: Kinesis / Event Hubs / Pub/Sub: S3 / ADLS / Cloud Storage; Xử lý và warehouse: EMR/Glue • Databricks: Dataflow/Dataproc → warehouse; Phân tích: Redshift / Synapse / BigQuery: BI + schema + chống lặp. Các khung là ý chính để đối chiếu, không nhất thiết là các bước tuần tự.</desc>
<rect width="360" height="420" fill="#f8fafc"/>
<g font-family="DejaVu Sans, sans-serif" fill="#0f172a">
<text x="20" y="28" font-size="18" font-weight="bold">sd-11-048 · Nhìn hình trước</text>
<rect x="12" y="48" width="336" height="102" rx="12" fill="#e0f2fe" stroke="#64748b"/>
<text x="24" y="75" font-size="18" font-weight="bold">Nhận và giữ raw</text>
<text x="24" y="104" font-size="18">Kinesis / Event Hubs / Pub/Sub</text>
<text x="24" y="130" font-size="18">S3 / ADLS / Cloud Storage</text>
<rect x="12" y="162" width="336" height="102" rx="12" fill="#dcfce7" stroke="#64748b"/>
<text x="24" y="189" font-size="18" font-weight="bold">Xử lý và warehouse</text>
<text x="24" y="218" font-size="18">EMR/Glue • Databricks</text>
<text x="24" y="244" font-size="18">Dataflow/Dataproc → warehouse</text>
<rect x="12" y="276" width="336" height="102" rx="12" fill="#fef3c7" stroke="#64748b"/>
<text x="24" y="303" font-size="18" font-weight="bold">Phân tích</text>
<text x="24" y="332" font-size="18">Redshift / Synapse / BigQuery</text>
<text x="24" y="358" font-size="18">BI + schema + chống lặp</text>
