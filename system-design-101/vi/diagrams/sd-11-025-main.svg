<rect x="12" y="48" width="336" height="102" rx="12" fill="#e0f2fe" stroke="#64748b"/>
<text x="24" y="75" font-size="18" font-weight="bold">Hạ tầng</text>
<text x="24" y="104" font-size="18">IaC: VPC, máy, DB</text>
<text x="24" y="130" font-size="18">Review và kiểm drift</text>
