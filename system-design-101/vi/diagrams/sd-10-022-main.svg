<text x="78" y="653.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">square</text>
<text x="78" y="677.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Nhận một số, trả bình</text>
