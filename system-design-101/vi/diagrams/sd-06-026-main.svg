<svg xmlns="http://www.w3.org/2000/svg" width="320" height="1219" viewBox="0 0 320 1219" role="img" aria-labelledby="title desc">
<title id="title">Năm chiến lược bộ đệm: ai đọc, ai ghi, mất gì</title>
<desc id="desc">Ba phần. Đọc: cache-aside, ứng dụng hỏi bộ đệm, hụt thì tự đọc cơ sở dữ liệu rồi ghi vào bộ đệm; read-through, bộ đệm có bộ nạp tự đọc cơ sở dữ liệu khi hụt. Ghi: write-through ghi cả hai cùng lúc, người gọi chờ cả hai; write-behind ghi bộ đệm rồi xếp hàng ghi cơ sở dữ liệu sau, nhanh nhưng có thể mất; write-around chỉ ghi cơ sở dữ liệu, bộ đệm giữ bản cũ tới khi hết hạn. Thử với Redis và SQLite: 100 lần đọc theo cache-aside chỉ đọc cơ sở dữ liệu 1 lần; người đọc chậm ghi bản cũ vào bộ đệm sau khi đã xóa, bộ đệm 100, cơ sở dữ liệu 120; write-through chờ 1,8 mili giây mỗi lần ghi, write-behind 0,4; bộ đệm sập trước khi đẩy thì write-behind mất cả 100 lần ghi.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs>
<rect width="320" height="1219" fill="#f8fafc"/>
<g font-family="DejaVu Sans, Arial, sans-serif" fill="#0f172a">
<text x="16" y="34" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">Năm chiến lược bộ đệm:</text>
<text x="16" y="58" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">ai đọc, ai ghi, mất gì</text>
<text x="16" y="84.2" font-size="15" fill="#475569" font-weight="normal" text-anchor="start">Hai cách đọc, ba cách ghi; thường</text>
<text x="16" y="103.8" font-size="15" fill="#475569" font-weight="normal" text-anchor="start">dùng kết hợp.</text>
<rect x="8" y="123" width="304" height="265" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="151.2" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Đọc</text>
<rect x="20" y="168" width="280" height="107" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="50" cy="221.5" r="18" fill="#1d4ed8"/><g transform="translate(39.2 210.7) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21 21-4.34-4.34"/><circle cx="11" cy="11" r="8"/></g>
<text x="78" y="194.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Cache-aside</text>
<text x="78" y="218.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Ứng dụng hỏi bộ đệm; hụt</text>
<text x="78" y="237.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">thì tự đọc cơ sở dữ liệu rồi</text>
<text x="78" y="257.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">ghi vào bộ đệm.</text>
<rect x="20" y="289" width="280" height="87" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="50" cy="332.5" r="18" fill="#1d4ed8"/><g transform="translate(39.2 321.7) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3"/><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/></g>
<text x="78" y="315.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Read-through</text>
<text x="78" y="339.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Bộ đệm có bộ nạp; hụt thì</text>
<text x="78" y="358.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">chính nó đọc cơ sở dữ liệu.</text>
<rect x="8" y="400" width="304" height="406" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="428.2" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Ghi</text>
<rect x="20" y="445" width="280" height="107" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
<circle cx="50" cy="498.5" r="18" fill="#0f766e"/><g transform="translate(39.2 487.7) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5V19A9 3 0 0 0 21 19V5"/><path d="M3 12A9 3 0 0 0 21 12"/></g>
<text x="78" y="471.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Write-through</text>
<text x="78" y="495.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Ghi cơ sở dữ liệu và bộ</text>
<text x="78" y="514.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">đệm cùng lúc; người gọi</text>
<text x="78" y="534.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">chờ cả hai.</text>
<rect x="20" y="566" width="280" height="107" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
<circle cx="50" cy="619.5" r="18" fill="#0f766e"/><g transform="translate(39.2 608.7) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></g>
<text x="78" y="592.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Write-behind</text>
<text x="78" y="616.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Ghi bộ đệm, xếp hàng ghi</text>
<text x="78" y="635.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">cơ sở dữ liệu sau; nhanh,</text>
<text x="78" y="655.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">có thể mất.</text>
<rect x="20" y="687" width="280" height="107" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
<circle cx="50" cy="740.5" r="18" fill="#0f766e"/><g transform="translate(39.2 729.7) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5"/><path d="M8 3H3v5"/><path d="M12 22v-8.3a4 4 0 0 0-1.172-2.872L3 3"/><path d="m15 9 6-6"/></g>
<text x="78" y="713.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Write-around</text>
<text x="78" y="737.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Chỉ ghi cơ sở dữ liệu; bộ</text>
<text x="78" y="756.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">đệm giữ bản cũ tới khi hết</text>
<text x="78" y="776.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">hạn.</text>
<rect x="8" y="818" width="304" height="393" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="846.1" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Thử với Redis và SQLite</text>
<rect x="20" y="863" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="886" r="11" fill="#16a34a"/>
<polyline points="37.9,886.4 41.7,890.4 48.5,882" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="889.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Cache-aside, 100 lần đọc: cơ</text>
<text x="64" y="908.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">sở dữ liệu bị đọc 1 lần.</text>
<rect x="20" y="934" width="280" height="83" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="957" r="11" fill="#16a34a"/>
<polyline points="37.9,957.4 41.7,961.4 48.5,953" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="960.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Người đọc chậm ghi bản cũ</text>
<text x="64" y="979.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">sau khi xóa: bộ đệm 100, cơ</text>
<text x="64" y="999.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">sở dữ liệu 120.</text>
<rect x="20" y="1025" width="280" height="83" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="1048" r="11" fill="#16a34a"/>
<polyline points="37.9,1048.4 41.7,1052.4 48.5,1044" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="1051.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Write-through chờ 1,8 ms</text>
<text x="64" y="1070.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">mỗi lần ghi; write-behind 0,4</text>
<text x="64" y="1090.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">ms.</text>
<rect x="20" y="1116" width="280" height="83" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="1139" r="11" fill="#16a34a"/>
<polyline points="37.9,1139.4 41.7,1143.4 48.5,1135" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="1142.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Write-behind, bộ đệm sập</text>
<text x="64" y="1161.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">trước khi đẩy: mất cả 100</text>
<text x="64" y="1181.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">lần ghi.</text>
</g>
</svg>
