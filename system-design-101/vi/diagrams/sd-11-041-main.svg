<svg xmlns="http://www.w3.org/2000/svg" width="320" height="1110" viewBox="0 0 320 1110" role="img" aria-labelledby="title desc">
<title id="title">Azure theo mảng việc</title>
<desc id="desc">Bốn khung. Khung một, mảng nền: tài khoản và đăng ký, điện toán, lưu trữ, cơ sở dữ liệu. Khung hai, thêm bốn mảng: mạng, phân tích, trí tuệ nhân tạo và học máy, nhắn tin. Khung ba, ba mảng còn lại: khu vực và vùng, quản lý tài nguyên, danh tính nhiều đám mây. Khung bốn, đếm trong kho đặc tả: 266 nhà cung cấp tài nguyên, 317 thư mục cấp một, nhiều tên là việc nền như tính tiền và quyền.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs>
