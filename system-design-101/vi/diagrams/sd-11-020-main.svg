<svg xmlns="http://www.w3.org/2000/svg" width="320" height="1157" viewBox="0 0 320 1157" role="img" aria-labelledby="title desc">
<title id="title">Sáu nguyên tắc chịu lỗi</title>
<desc id="desc">Ba khung. Khung một, có bản sao để thay: sao chép dữ liệu, dư thừa thành phần, cân bằng tải. Khung hai, phản ứng khi hỏng: chuyển sang dự phòng, giảm chức năng thay vì sập hẳn, giám sát và cảnh báo. Khung ba, phép tính: hai bản 99% chạy song song cho 99,99%, ba phần 99,9% nối tiếp chỉ còn khoảng 99,7%.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs>
<rect width="320" height="1157" fill="#f8fafc"/>
<g font-family="DejaVu Sans, Arial, sans-serif" fill="#0f172a">
<text x="16" y="34" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">Sáu nguyên tắc chịu lỗi</text>
<text x="16" y="60.2" font-size="15" fill="#475569" font-weight="normal" text-anchor="start">Có bản dự phòng, và biết khi nào</text>
<text x="16" y="79.8" font-size="15" fill="#475569" font-weight="normal" text-anchor="start">chuyển sang.</text>
<rect x="8" y="99" width="304" height="382" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="127.2" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Có sẵn bản thay thế</text>
<rect x="20" y="144" width="280" height="87" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="50" cy="187.5" r="18" fill="#1d4ed8"/><g transform="translate(39.2 176.7) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" x2="15.42" y1="13.51" y2="17.49"/><line x1="15.41" x2="8.59" y1="6.51" y2="10.49"/></g>
<text x="78" y="170.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Sao chép</text>
<text x="78" y="194.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Giữ nhiều bản dữ liệu ở</text>
<text x="78" y="213.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">nhiều nơi.</text>
<rect x="20" y="263" width="280" height="87" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="50" cy="306.5" r="18" fill="#1d4ed8"/><g transform="translate(39.2 295.7) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.97 12.92A2 2 0 0 0 2 14.63v3.24a2 2 0 0 0 .97 1.71l3 1.8a2 2 0 0 0 2.06 0L12 19v-5.5l-5-3-4.03 2.42Z"/><path d="m7 16.5-4.74-2.85"/><path d="m7 16.5 5-3"/><path d="M7 16.5v5.17"/><path d="M12 13.5V19l3.97 2.38a2 2 0 0 0 2.06 0l3-1.8a2 2 0 0 0 .97-1.71v-3.24a2 2 0 0 0-.97-1.71L17 10.5l-5 3Z"/><path d="m17 16.5-5-3"/><path d="m17 16.5 4.74-2.85"/><path d="M17 16.5v5.17"/><path d="M7.97 4.42A2 2 0 0 0 7 6.13v4.37l5 3 5-3V6.13a2 2 0 0 0-.97-1.71l-3-1.8a2 2 0 0 0-2.06 0l-3 1.8Z"/><path d="M12 8 7.26 5.15"/><path d="m12 8 4.74-2.85"/><path d="M12 13.5V8"/></g>
<text x="78" y="289.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Dư thừa</text>
<text x="78" y="313.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Có thành phần dự phòng</text>
<text x="78" y="332.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">sẵn sàng thay.</text>
