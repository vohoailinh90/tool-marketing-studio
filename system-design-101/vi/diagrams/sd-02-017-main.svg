<svg xmlns="http://www.w3.org/2000/svg" width="320" height="1087" viewBox="0 0 320 1087" role="img" aria-labelledby="title desc">
<title id="title">Netflix gửi thông báo đẩy thế nào?</title>
<desc id="desc">Hai khung bước. Khung một, quyết định gửi gì: sự kiện do đồng hồ, người dùng hoặc hệ thống tạo; bộ quản lý sự kiện chuyển vào hàng đợi theo ưu tiên; cụm xử lý tạo dữ liệu thông báo và lưu vào Cassandra. Khung hai, gửi tới đâu: hệ thống nhắn tin ra ngoài; Android qua FCM, Apple qua APNs, web và tivi qua Zuul Push. Khung ba nêu ba điều cần nhớ.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs>
<rect width="320" height="1087" fill="#f8fafc"/>
<g font-family="DejaVu Sans, Arial, sans-serif" fill="#0f172a">
<text x="16" y="34" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">Netflix gửi thông báo</text>
<text x="16" y="58" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">đẩy thế nào?</text>
<text x="16" y="84.2" font-size="15" fill="#475569" font-weight="normal" text-anchor="start">Bảy bước, từ sự kiện tới từng loại</text>
<text x="16" y="103.8" font-size="15" fill="#475569" font-weight="normal" text-anchor="start">thiết bị.</text>
<rect x="8" y="123" width="304" height="362" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="151.2" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Quyết định gửi gì</text>
<rect x="20" y="168" width="280" height="87" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="46" cy="194" r="14" fill="#1d4ed8"/>
<text x="46" y="199.5" font-size="16" fill="#ffffff" font-weight="bold" text-anchor="middle">1</text>
<text x="70" y="194.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Sự kiện</text>
<text x="70" y="218.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Do đồng hồ, người dùng</text>
<text x="70" y="237.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">hoặc hệ thống tạo.</text>
<rect x="20" y="277" width="280" height="87" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="46" cy="303" r="14" fill="#1d4ed8"/>
<text x="46" y="308.5" font-size="16" fill="#ffffff" font-weight="bold" text-anchor="middle">2</text>
<text x="70" y="303.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Bộ quản lý sự kiện</text>
<text x="70" y="327.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Chuyển vào hàng đợi theo</text>
<text x="70" y="346.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">luật ưu tiên.</text>
<polyline points="46,257 46,275" fill="none" stroke="#334155" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="20" y="386" width="280" height="87" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="46" cy="412" r="14" fill="#1d4ed8"/>
<text x="46" y="417.5" font-size="16" fill="#ffffff" font-weight="bold" text-anchor="middle">3</text>
<text x="70" y="412.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Cụm xử lý theo ưu tiên</text>
<text x="70" y="436.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Tạo dữ liệu thông báo, lưu</text>
<text x="70" y="455.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">vào Cassandra.</text>
<polyline points="46,366 46,384" fill="none" stroke="#334155" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="8" y="497" width="304" height="308" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="525.1" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Gửi tới đâu</text>
<rect x="20" y="542" width="280" height="68" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
<circle cx="50" cy="576" r="18" fill="#0f766e"/><g transform="translate(39.2 565.2) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect height="20" rx="2" ry="2" width="14" x="5" y="2"/><path d="M12 18h.01"/></g>
<text x="78" y="568.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Android</text>
<text x="78" y="592.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Qua FCM.</text>
<rect x="20" y="624" width="280" height="68" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
<circle cx="50" cy="658" r="18" fill="#0f766e"/><g transform="translate(39.2 647.2) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect height="20" rx="2" ry="2" width="14" x="5" y="2"/><path d="M12 18h.01"/></g>
<text x="78" y="650.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Thiết bị Apple</text>
<text x="78" y="674.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Qua APNs.</text>
<rect x="20" y="706" width="280" height="87" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
<circle cx="50" cy="749.5" r="18" fill="#0f766e"/><g transform="translate(39.2 738.7) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect height="14" rx="2" width="20" x="2" y="3"/><line x1="8" x2="16" y1="21" y2="21"/><line x1="12" x2="12" y1="17" y2="21"/></g>
<text x="78" y="732.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Web, tivi, thiết bị phát</text>
<text x="78" y="756.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Qua Zuul Push do Netflix</text>
<text x="78" y="775.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">tự làm.</text>
<rect x="8" y="817" width="304" height="262" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="845.1" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Nhớ gì</text>
<rect x="20" y="862" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="885" r="11" fill="#16a34a"/>
<polyline points="37.9,885.4 41.7,889.4 48.5,881" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="888.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Theo nguồn: khoảng 220</text>
<text x="64" y="907.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">triệu người dùng.</text>
<rect x="20" y="933" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="956" r="11" fill="#16a34a"/>
<polyline points="37.9,956.4 41.7,960.4 48.5,952" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="959.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Hàng đợi tách theo mức ưu</text>
<text x="64" y="978.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">tiên.</text>
<rect x="20" y="1004" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="1027" r="11" fill="#16a34a"/>
<polyline points="37.9,1027.4 41.7,1031.4 48.5,1023" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="1030.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Mỗi loại thiết bị một đường</text>
<text x="64" y="1049.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">gửi riêng.</text>
</g>
</svg>
