<svg xmlns="http://www.w3.org/2000/svg" width="320" height="1998" viewBox="0 0 320 1998" role="img" aria-labelledby="title desc">
<title id="title">Bốn mẫu nhất quán cuối cùng</title>
<desc id="desc">Bốn khung. Khung một, bốn mẫu: theo sự kiện, bên nghe tự sửa bản của mình; đồng bộ nền, tác vụ theo lịch chép phần đã đổi; saga, giao dịch cục bộ nối nhau, hỏng thì bù; CQRS, ghi một kho, đọc kho khác đi sau. Khung hai, thử trên PostgreSQL 16 với 200 lần sửa 20 đơn hàng: theo sự kiện, trigger gửi thông báo, bản đọc trễ trung vị 2,3 ms, lâu nhất 23,8 ms; đồng bộ mỗi 2 giây trễ trung vị 640 ms, chỉ 117 trong 200 phiên bản tới nơi; đọc ngay sau khi ghi ra bản cũ 194/200 lần với sự kiện, 200/200 lần với đồng bộ. Khung ba, saga: trừ 300, giữ hàng bị chặn vì hết hàng, bù bằng một dòng hoàn 300 rồi hủy đơn. Khung bốn, bốn câu hỏi trước khi chọn mẫu.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs>
<rect width="320" height="1998" fill="#f8fafc"/>
<g font-family="DejaVu Sans, Arial, sans-serif" fill="#0f172a">
<text x="16" y="34" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">Bốn mẫu nhất quán cuối</text>
<text x="16" y="58" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">cùng</text>
<text x="16" y="84.2" font-size="15" fill="#475569" font-weight="normal" text-anchor="start">Bản đọc đi sau bao lâu, và khi một</text>
<text x="16" y="103.8" font-size="15" fill="#475569" font-weight="normal" text-anchor="start">bước hỏng thì ai sửa lại.</text>
<rect x="8" y="123" width="304" height="447" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
