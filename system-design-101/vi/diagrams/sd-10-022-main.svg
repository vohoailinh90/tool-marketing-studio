<text x="64" y="1249.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Cùng một kết quả, ba cách</text>
<text x="64" y="1268.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">viết.</text>
<rect x="20" y="1294" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="1317" r="11" fill="#16a34a"/>
<polyline points="37.9,1317.4 41.7,1321.4 48.5,1313" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="1320.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Khác nhau ở chỗ trạng thái</text>
<text x="64" y="1339.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">sống.</text>
<rect x="20" y="1365" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="1388" r="11" fill="#16a34a"/>
<polyline points="37.9,1388.4 41.7,1392.4 48.5,1384" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="1391.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Một ngôn ngữ làm được</text>
