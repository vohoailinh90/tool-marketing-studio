<svg xmlns="http://www.w3.org/2000/svg" width="320" height="1562" viewBox="0 0 320 1562" role="img" aria-labelledby="title desc">
<title id="title">Hàng đợi chặn và không chặn</title>
<desc id="desc">Bốn nhóm xếp dọc. Hàng đợi chặn: luồng B lấy phần tử nhưng hàng đang trống nên phải đợi, luồng A thêm phần tử thì B được giao nó. Hàng đợi không chặn: hai luồng cùng gắn nút vào cuối hàng bằng CAS, luồng thua đọc lại rồi thử tiếp. Hai tính chất: không bị bỏ đói và wait-free. Ba điều cần nhớ về hàng đợi không chặn: không treo luồng, không có khóa nên không khóa chết, dựng bằng CAS.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs>
<rect width="320" height="1562" fill="#f8fafc"/>
<g font-family="DejaVu Sans, Arial, sans-serif" fill="#0f172a">
<text x="16" y="34" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">Hàng đợi chặn và không</text>
<text x="16" y="58" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">chặn</text>
<text x="16" y="84.2" font-size="15" fill="#475569" font-weight="normal" text-anchor="start">Khác nhau ở chỗ luồng làm gì khi</text>
<text x="16" y="103.8" font-size="15" fill="#475569" font-weight="normal" text-anchor="start">việc chưa làm được ngay.</text>
<rect x="8" y="123" width="304" height="435" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="151.2" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Hàng đợi chặn</text>
<rect x="20" y="168" width="84" height="86" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="62" cy="190" r="14" fill="#1d4ed8"/><g transform="translate(53.6 181.6) scale(0.7)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></g>
<text x="62" y="221.9" font-size="15" fill="#0f172a" font-weight="bold" text-anchor="middle">Luồng A</text>
<rect x="118" y="168" width="84" height="86" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="160" cy="190" r="14" fill="#1d4ed8"/><g transform="translate(151.6 181.6) scale(0.7)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></g>
<text x="160" y="221.9" font-size="15" fill="#0f172a" font-weight="bold" text-anchor="middle">Hàng</text>
<text x="160" y="240.6" font-size="15" fill="#0f172a" font-weight="bold" text-anchor="middle">đợi</text>
<rect x="216" y="168" width="84" height="86" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="258" cy="190" r="14" fill="#1d4ed8"/><g transform="translate(249.6 181.6) scale(0.7)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><path d="M16 3.128a4 4 0 0 1 0 7.744"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><circle cx="9" cy="7" r="4"/></g>
<text x="258" y="221.9" font-size="15" fill="#0f172a" font-weight="bold" text-anchor="middle">Luồng B</text>
<polyline points="62,254 62,546" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4 4"/>
<polyline points="160,254 160,546" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4 4"/>
<polyline points="258,254 258,546" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4 4"/>
<text x="209" y="282.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="middle">Lấy phần</text>
<text x="209" y="301.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="middle">tử, hàng</text>
<text x="209" y="321.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="middle">đang trống</text>
<polyline points="257,335 163,335" fill="none" stroke="#334155" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="209" y="363.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="middle">B đợi tới</text>
<text x="209" y="382.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="middle">khi có</text>
<text x="209" y="402.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="middle">phần tử</text>
<polyline points="161,416 255,416" fill="none" stroke="#334155" stroke-width="1.8" stroke-dasharray="5 4" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="111" y="444.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="middle">Thêm một</text>
<text x="111" y="463.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="middle">phần tử</text>
<polyline points="63,477 157,477" fill="none" stroke="#334155" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="209" y="505.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="middle">Giao phần</text>
<text x="209" y="524.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="middle">tử cho B</text>
<polyline points="161,538 255,538" fill="none" stroke="#334155" stroke-width="1.8" stroke-dasharray="5 4" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="8" y="570" width="304" height="413" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="598.1" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Hàng đợi không chặn</text>
<rect x="20" y="615" width="84" height="86" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
<circle cx="62" cy="637" r="14" fill="#0f766e"/><g transform="translate(53.6 628.6) scale(0.7)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></g>
<text x="62" y="668.9" font-size="15" fill="#0f172a" font-weight="bold" text-anchor="middle">Luồng A</text>
<rect x="118" y="615" width="84" height="86" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
<circle cx="160" cy="637" r="14" fill="#0f766e"/><g transform="translate(151.6 628.6) scale(0.7)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></g>
<text x="160" y="668.9" font-size="15" fill="#0f172a" font-weight="bold" text-anchor="middle">Hàng</text>
<text x="160" y="687.6" font-size="15" fill="#0f172a" font-weight="bold" text-anchor="middle">đợi</text>
<rect x="216" y="615" width="84" height="86" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
<circle cx="258" cy="637" r="14" fill="#0f766e"/><g transform="translate(249.6 628.6) scale(0.7)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><path d="M16 3.128a4 4 0 0 1 0 7.744"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><circle cx="9" cy="7" r="4"/></g>
<text x="258" y="668.9" font-size="15" fill="#0f172a" font-weight="bold" text-anchor="middle">Luồng B</text>
<polyline points="62,701 62,971" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4 4"/>
<polyline points="160,701 160,971" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4 4"/>
<polyline points="258,701 258,971" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4 4"/>
<text x="111" y="729.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="middle">Gắn nút</text>
<text x="111" y="748.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="middle">cuối bằng</text>
<text x="111" y="768.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="middle">CAS</text>
<polyline points="63,782 157,782" fill="none" stroke="#334155" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="209" y="810.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="middle">Cùng lúc</text>
<text x="209" y="829.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="middle">gắn nút</text>
<text x="209" y="849.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="middle">bằng CAS</text>
<polyline points="257,863 163,863" fill="none" stroke="#334155" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="209" y="891.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="middle">B thua</text>
<text x="209" y="910.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="middle">CAS, đọc</text>
<text x="209" y="930.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="middle">lại, thử</text>
<text x="209" y="949.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="middle">tiếp</text>
<polyline points="161,963 255,963" fill="none" stroke="#334155" stroke-width="1.8" stroke-dasharray="5 4" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="8" y="995" width="304" height="285" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="1023.1" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Hai tính chất</text>
<rect x="20" y="1040" width="280" height="107" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
<circle cx="50" cy="1093.5" r="18" fill="#b45309"/><g transform="translate(39.2 1082.7) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m16 9-5.5 5.5L8 12"/></g>
<text x="78" y="1066.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Không bị bỏ đói</text>
<text x="78" y="1090.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Luồng nào cũng có lúc</text>
<text x="78" y="1109.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">được truy cập tài nguyên</text>
<text x="78" y="1129.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">chia sẻ.</text>
<rect x="20" y="1161" width="280" height="107" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
<circle cx="50" cy="1214.5" r="18" fill="#b45309"/><g transform="translate(39.2 1203.7) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 14 4-4"/><path d="M3.34 19a10 10 0 1 1 17.32 0"/></g>
<text x="78" y="1187.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Wait-free</text>
<text x="78" y="1211.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Mỗi thao tác xong trong số</text>
<text x="78" y="1230.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">bước hữu hạn, bất kể</text>
<text x="78" y="1250.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">luồng khác.</text>
<rect x="8" y="1292" width="304" height="262" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="1320.1" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Hàng đợi không chặn</text>
<rect x="20" y="1337" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="1360" r="11" fill="#16a34a"/>
<polyline points="37.9,1360.4 41.7,1364.4 48.5,1356" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="1363.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Không treo luồng: không ai</text>
<text x="64" y="1382.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">đợi một khóa.</text>
<rect x="20" y="1408" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="1431" r="11" fill="#16a34a"/>
<polyline points="37.9,1431.4 41.7,1435.4 48.5,1427" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="1434.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Không có khóa để giữ, nên</text>
<text x="64" y="1453.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">không khóa chết.</text>
<rect x="20" y="1479" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="1502" r="11" fill="#16a34a"/>
<polyline points="37.9,1502.4 41.7,1506.4 48.5,1498" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="1505.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Dựng bằng CAS: ghi nếu giá</text>
<text x="64" y="1524.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">trị chưa đổi.</text>
</g>
</svg>
