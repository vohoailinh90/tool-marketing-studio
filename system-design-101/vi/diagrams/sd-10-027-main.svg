<text x="64" y="1713.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Tên công cụ chỉ là ví dụ.</text>
<rect x="20" y="1741" width="280" height="46" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="1764" r="11" fill="#16a34a"/>
<polyline points="37.9,1764.4 41.7,1768.4 48.5,1760" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="1767.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Không phải lộ trình bắt buộc.</text>
