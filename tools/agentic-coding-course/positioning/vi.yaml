lang: vi
one_liner: Hiểu AI bằng ví dụ gần công việc, giao việc nhỏ và kiểm tra bằng chứng.
audience: Người Việt mới dùng AI, dân văn phòng, sinh viên và người Việt làm việc ở Nhật; đọc Facebook
  trên điện thoại.
pains:
- AI nói tự tin nhưng khó biết đúng sai.
- Không rõ agent nhìn thấy gì và được làm tới đâu.
- Muốn làm một việc có ích nhưng chưa biết cách kiểm tra.
promise: Mỗi bài một ý chính, một ví dụ và một việc nhỏ có cách kiểm chứng.
vocabulary:
- AI
- agent
- prompt
- dữ liệu giả
- kiểm chứng
- bằng chứng
angles:
- Câu hỏi có đáp án giải thích
- Bài tập nhỏ và câu hỏi về trải nghiệm công việc
tone: Gần gũi, rõ ràng, xưng bạn; không hứa kết quả hay thúc ép tương tác.
