<text x="70" y="265.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Giao diện và máy chủ</text>
<text x="70" y="289.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">GraphQL.</text>
