<svg xmlns="http://www.w3.org/2000/svg" width="320" height="1636" viewBox="0 0 320 1636" role="img" aria-labelledby="title desc">
<title id="title">Apple Pay và Google Pay theo sơ đồ nguồn (giản lược)</title>
<desc id="desc">Năm khung. Khung một, đăng ký thẻ với Apple Pay: iPhone gửi thông tin thẻ cho ngân hàng, Apple không lưu; ngân hàng trả lại một mã DAN, iPhone lưu mã vào một chip phần cứng riêng. Khung hai, đăng ký thẻ với Google Pay: điện thoại gửi thông tin thẻ cho máy chủ Google, nơi lưu thông tin thẻ; Google trả lại một mã thanh toán. Khung ba, thanh toán với Apple Pay: khách bấm Trả, máy chủ bán hàng chuyển mã DAN cho ngân hàng. Khung bốn, thanh toán với Google Pay: máy chủ bán hàng chuyển mã thanh toán cho máy chủ Google, nơi tra thông tin thẻ rồi chuyển cho ngân hàng. Khung năm, điều cần nhớ.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs>
<rect width="320" height="1636" fill="#f8fafc"/>
<g font-family="DejaVu Sans, Arial, sans-serif" fill="#0f172a">
<text x="16" y="34" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">Apple Pay và Google Pay</text>
<text x="16" y="58" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">theo sơ đồ nguồn (giản</text>
<text x="16" y="82" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">lược)</text>
<text x="16" y="108.2" font-size="15" fill="#475569" font-weight="normal" text-anchor="start">Cùng an toàn, nhưng thông tin thẻ</text>
<text x="16" y="127.8" font-size="15" fill="#475569" font-weight="normal" text-anchor="start">nằm ở nơi khác nhau.</text>
<rect x="8" y="147" width="304" height="273" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="175.2" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">1. Đăng ký thẻ: Apple Pay</text>
