<circle cx="43" cy="370" r="11" fill="#16a34a"/>
<polyline points="37.9,370.4 41.7,374.4 48.5,366" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="373.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">194 dòng ghép dịch vụ.</text>
