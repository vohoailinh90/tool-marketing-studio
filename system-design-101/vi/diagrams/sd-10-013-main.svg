<text x="78" y="257.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">khuyên thực dụng về nghề</text>
<text x="78" y="277.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">viết phần mềm.</text>
