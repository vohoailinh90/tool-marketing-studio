<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 905" width="320" height="905" role="img" aria-labelledby="title desc">
<title id="title">Học từ chuỗi CI/CD của công ty lớn mà không chép công cụ</title>
<desc id="desc">Hai ví dụ công khai của Netflix là image bất biến và phân tích canary tự động, cùng ba rủi ro CI/CD (Continuous Integration/Continuous Delivery hoặc Deployment — tích hợp liên tục/chuyển giao hoặc triển khai liên tục) chung và cách giảm: test chập chờn, bí mật trong pipeline, phụ thuộc bên thứ ba đổi dưới chân.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#475569" stroke-width="1.5"/></marker></defs>
<rect width="320" height="905" fill="#f8fafc"/><g font-family="DejaVu Sans, Arial, sans-serif" fill="#0f172a">
<text x="16" y="30" font-size="20" font-weight="bold">SỢ GÌ → LÀM GÌ</text>
<text x="16" y="58" font-size="16" font-weight="normal">Hỏi rủi ro trước, chọn công</text>
<text x="16" y="85" font-size="16" font-weight="normal">cụ sau</text>
<rect x="16" y="116" width="288" height="182" rx="10" fill="#dbeafe" stroke="#94a3b8"/>
<text x="30" y="144" font-size="16" font-weight="bold">Ví dụ Netflix: máy</text>
<text x="30" y="171" font-size="16" font-weight="bold">thật khác máy đã thử</text>
<text x="30" y="198" font-size="16" font-weight="normal">Đóng ứng dụng vào image</text>
<text x="30" y="225" font-size="16" font-weight="normal">(AMI: ảnh máy ảo Amazon)</text>
<text x="30" y="252" font-size="16" font-weight="normal">rồi thay máy, không sửa tại</text>
<text x="30" y="279" font-size="16" font-weight="normal">chỗ</text>
<rect x="16" y="310" width="288" height="155" rx="10" fill="#ede9fe" stroke="#94a3b8"/>
<text x="30" y="338" font-size="16" font-weight="bold">Ví dụ Netflix: canary</text>
<text x="30" y="365" font-size="16" font-weight="bold">đánh giá cảm tính</text>
<text x="30" y="392" font-size="16" font-weight="normal">Spinnaker + Kayenta so</text>
<text x="30" y="419" font-size="16" font-weight="normal">canary với bản đối chứng</text>
<text x="30" y="446" font-size="16" font-weight="normal">theo quy tắc</text>
<rect x="16" y="477" width="288" height="128" rx="10" fill="#fef3c7" stroke="#94a3b8"/>
<text x="30" y="505" font-size="16" font-weight="bold">Chung: test chập chờn</text>
<text x="30" y="532" font-size="16" font-weight="normal">Đo tỉ lệ chập chờn, cách ly</text>
<text x="30" y="559" font-size="16" font-weight="normal">và sửa; đừng bỏ qua kết quả</text>
<text x="30" y="586" font-size="16" font-weight="normal">đỏ</text>
<rect x="16" y="617" width="288" height="128" rx="10" fill="#fee2e2" stroke="#94a3b8"/>
<text x="30" y="645" font-size="16" font-weight="bold">Chung: bí mật trong</text>
<text x="30" y="672" font-size="16" font-weight="bold">pipeline</text>
<text x="30" y="699" font-size="16" font-weight="normal">Lấy bí mật từ kho quản lý,</text>
<text x="30" y="726" font-size="16" font-weight="normal">quyền tối thiểu cho runner</text>
<rect x="16" y="757" width="288" height="128" rx="10" fill="#dcfce7" stroke="#94a3b8"/>
<text x="30" y="785" font-size="16" font-weight="bold">Chung: phụ thuộc đổi</text>
<text x="30" y="812" font-size="16" font-weight="bold">dưới chân</text>
<text x="30" y="839" font-size="16" font-weight="normal">Khóa phiên bản, kiểm tra</text>
<text x="30" y="866" font-size="16" font-weight="normal">chuỗi cung ứng phần mềm</text>
</g></svg>
