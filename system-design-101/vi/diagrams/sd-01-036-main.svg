<path d="M201,169 H218" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<text x="24" y="240">Quy tắc của cơ quan</text>
<rect x="12" y="285" width="296" height="210" rx="12" fill="#dcfce7"/><text x="24" y="315" font-size="18" font-weight="bold">Reverse proxy</text><text x="24" y="342">Phía website nhận truy cập</text>
