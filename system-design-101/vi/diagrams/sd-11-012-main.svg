<svg xmlns="http://www.w3.org/2000/svg" width="360" height="420" viewBox="0 0 360 420" role="img" aria-labelledby="title desc">
<title id="title">Điều gì làm Lambda phản hồi nhanh hơn?</title>
<desc id="desc">Latency đầu cuối: Định tuyến + init + handler: Cộng thời gian gọi phụ thuộc; Giảm khởi tạo: Tái dùng môi trường: PC / SnapStart khi phù hợp; Đo trước khi chỉnh: Cold start và warm start: p95/p99 + chi phí. Các khung là ý chính để đối chiếu, không nhất thiết là các bước tuần tự.</desc>
<rect width="360" height="420" fill="#f8fafc"/>
