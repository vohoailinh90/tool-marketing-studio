<text x="70" y="1072.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">8 · Cấu trúc dữ liệu và</text>
<text x="70" y="1092.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">thuật toán</text>
<text x="70" y="1116.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Tìm trong một triệu mã: 20</text>
<text x="70" y="1135.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">phép so sánh thay vì một</text>
