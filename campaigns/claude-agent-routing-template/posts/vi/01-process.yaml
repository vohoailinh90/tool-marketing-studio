id: 01-process
status: draft
format: portrait
series: "Làm việc với AI · #1"
link: ""
slides:
  - layout: cover
    emoji: "🧭"
    eyebrow: "Cách mình làm việc với AI"
    title: "**Claude thiết kế**, **Codex phản biện** — rồi chạy tới khi xong"
    subtitle: "Không phải chạy vô hạn. Có phanh, và có định nghĩa \"xong\" viết sẵn."

  - layout: pains
    title: "Vì sao AI không nên tự duyệt bài của mình"
    tone: bad
    items:
      - {emoji: "🪞", text: "Người viết code mà cũng là người duyệt duy nhất"}
      - {emoji: "🤝", text: "Hai lần chạy của cùng một họ model hay có chung điểm mù"}
      - {emoji: "📝", text: "\"Xong rồi ạ\" nhưng không có bằng chứng theo từng tiêu chí"}
      - {emoji: "♾️", text: "Cho chạy tự động thì lo lặp mãi, lệch phạm vi"}

  - layout: table
    title: "Mỗi mức được dùng mấy agent"
    columns: ["Mức", "Điểm", "Chỉ Claude", "Có Codex phản biện"]
    rows:
      - ["T0", "0–2", "0", "0 (không gọi Codex)"]
      - ["T1", "3–5", "1", "0"]
      - ["T2", "6–8", "2", "0"]
      - ["T3", "9–12", "3", "1"]
    note: "Chấm 6 tiêu chí, mỗi tiêu chí 0–2; script đổi điểm ra mức và trần agent. Thêm khi cần: +1 phân tích viên ở T3 nếu yêu cầu mơ hồ, +1 test-engineer ở T2/T3 nếu reviewer đề nghị."

  - layout: table
    title: "Claude: 1 phiên chính + 8 vai"
    columns: ["Vai", "Việc", "Khi nào"]
    rows:
      - ["requirement-analyst", "Làm rõ yêu cầu", "T3, mơ hồ = 2"]
      - ["architect", "Đề xuất thiết kế", "T2, đổi kiến trúc"]
      - ["architecture-critic", "Phản biện thiết kế", "T3"]
      - ["code-reviewer", "Đọc diff, kiểm chứng", "T1, T2"]
      - ["code-reviewer-t3", "Như trên, rộng hơn", "T3"]
      - ["code-reviewer-verify", "Như trên, nhiều phép thử", "Khi chọn"]
      - ["test-engineer", "Thiết kế kiểm chứng", "Khi reviewer đề nghị"]
      - ["implementer", "Viết code theo kế hoạch", "Chỉ khi nâng cấp"]
    note: "Phiên chính phân tích, thiết kế, viết code ở mọi mức, không tính vào trần. Mọi vai trừ implementer chỉ đọc, không sửa file; code-reviewer-verify chỉ thay chỗ reviewer."

  - layout: checklist
    title: "Phía Codex: chỉ phản biện"
    items:
      - "Không có agent thường trực: mỗi lần gọi là một task Codex Cloud mới, ngữ cảnh riêng"
      - "Ba loại lượt: phản biện thiết kế, review PR, và security review khi việc nhạy cảm"
      - "Phản biện thiết kế: chỉ lỗi critical/high, mỗi lỗi có bằng chứng và kịch bản hỏng"
      - "Kết luận một trong ba: chấp nhận · chấp nhận có sửa · bác"
      - "Không viết code, không sửa lỗi — việc đó của Claude"
      - "Ở T3 Claude vẫn giữ 1 reviewer chạy kiểm chứng; Codex chỉ đọc diff"
    note: "Phản biện thiết kế tối đa 2 vòng, review tối đa 3 vòng mỗi PR; mỗi luồng chỉ một yêu cầu chạy cùng lúc."

  - layout: flow
    variant: after
    title: "Một vòng làm việc"
    steps:
      - {emoji: "📊", text: "Chấm điểm yêu cầu; script chọn mức và ngân sách agent"}
      - {emoji: "🧠", text: "**Claude thiết kế**, ghi tiêu chí nghiệm thu"}
      - {emoji: "🔍", text: "**Codex phản biện** thiết kế (chỉ đọc, không sửa file)"}
      - {emoji: "🛠️", text: "Claude chỉnh thiết kế rồi viết code"}
      - {emoji: "🔀", text: "Mở PR và nhờ Codex review ngay"}
      - {emoji: "✅", text: "Claude đọc lại diff, chạy lại test, chỉ sửa lỗi đã xác nhận"}
      - {emoji: "🚀", text: "Đủ điều kiện \"xong\" thì merge"}
    note: "Mức càng thấp, càng ít bước."

  - layout: table
    title: "Vòng lặp có phanh"
    columns: ["Việc", "Tối đa"]
    rows:
      - ["Vòng thiết kế – phản biện", "2"]
      - ["Vòng sửa lỗi", "2"]
      - ["Vòng review mỗi PR", "3"]
      - ["Yêu cầu Codex chạy cùng lúc", "1"]
      - ["Cùng loại việc trên cùng commit", "không lặp"]
    note: "Số vòng review do script đếm từ GitHub, không dựa vào trí nhớ của AI. Dừng khi lỗi nặng đã sửa hoặc bị bác kèm bằng chứng — không cãi tới khi hai bên đồng ý."

  - layout: checklist
    title: "Khi nào mới gọi là xong"
    tone: ok
    items:
      - "Codex chạy đúng loại việc, đúng commit"
      - "Mỗi tiêu chí nghiệm thu đều có bằng chứng"
      - "Test và check bắt buộc của repo đều xanh"
      - "Không còn lỗi P0/P1, không làm lố phạm vi"
    note: "Đủ cả bốn thì merge. Người chỉ vào cuộc khi có quyết định máy không tự quyết được, hoặc yêu cầu gốc đổi."

  - layout: features
    title: "Chạy liên tục mà không mất đà"
    items:
      - {emoji: "📒", title: "Sổ bàn giao", text: "Mục tiêu, việc đã xong, việc còn lại, lệnh kế tiếp — ghi ra file"}
      - {emoji: "⏱️", title: "Nhắc đúng lúc", text: "Khoảng 70% context thì ghi sổ; khoảng 85% thì thu dọn"}
      - {emoji: "🛟", title: "Đứt giữa chừng", text: "Tự lưu trước khi nén context; phiên mới đọc lại sổ"}
      - {emoji: "🧮", title: "Đếm được thì để script", text: "Đếm vòng, so commit, chạy test — không nhờ AI đoán"}
    note: "Đứt phiên rồi làm lại từ đầu tốn hơn làm tiếp."

  - layout: poll
    eyebrow: "Hỏi bạn"
    question: "Hiện giờ ai đang kiểm tra việc AI làm cho bạn?"
    options:
      - "Chính AI đó tự kiểm"
      - "Một AI khác"
      - "Mình đọc lại"
      - "Chưa kiểm"
    hint: "Comment A, B, C hoặc D nhé"

platforms:
  facebook:
    caption: |
      Claude thiết kế, Codex phản biện, rồi chạy tới khi xong — mà không chạy vô hạn 👇

      Mình hay tự hỏi: AI viết code xong rồi tự duyệt thì ai bắt lỗi? Nên mình làm theo quy trình trong repo mẫu mình tự dựng (hiện đang private):

      1️⃣ Chấm điểm yêu cầu trên 6 tiêu chí, mỗi tiêu chí 0–2. Một script đổi điểm thành mức T0–T3 và quyết định cần mấy người duyệt — không để AI tự quyết.
      2️⃣ Claude thiết kế. Codex phản biện: chỉ nêu lỗi nặng, kèm bằng chứng và kịch bản hỏng.
      3️⃣ Claude viết code, mở PR, nhờ Codex review. Claude tự đọc lại diff và chạy lại test; chỉ lỗi đã xác nhận mới được sửa.
      4️⃣ Có phanh: tối đa 2 vòng sửa, 3 vòng review mỗi PR.
      5️⃣ "Xong" nghĩa là có bằng chứng cho từng tiêu chí, check xanh, không còn lỗi P0/P1. Lúc đó mới merge.

      Đội hình, nói cho đủ: phía Claude là 1 phiên chính cộng 8 vai (làm rõ yêu cầu, thiết kế, phản biện thiết kế, 3 loại reviewer, viết code, thiết kế kiểm chứng). Trần agent là 0, 1, 2, 3 cho T0–T3, và chỉ còn 0, 0, 0, 1 khi Codex ngồi ghế phản biện. Phía Codex không có agent thường trực: mỗi lần gọi là một task mới, và nó chỉ phản biện — không viết code, không sửa lỗi.

      Để chạy liên tục, mình dùng sổ bàn giao: khoảng 70% context thì ghi sổ, 85% thì thu dọn. Phiên mới đọc sổ thay vì làm lại.

      Nói thật về giới hạn: cần Codex Cloud nối với GitHub và còn quota; chỉ nên tự merge khi nhánh chính bắt buộc cập nhật trước khi merge.

      Còn bạn: ai đang kiểm tra việc AI làm cho bạn?
    hashtags: [Claude, Codex, AI, tudonghoa, laptrinh]
