id: 01-pain
status: draft
format: portrait
series: "海外会議の日程調整 · #1"
link: ~
slides:
  - layout: cover
    emoji: "🌏"
    eyebrow: "アジア拠点との定例会議"
    title: "ベトナム・インド・\n韓国のメンバー10人。\n**全員が空いている時間**、\n見つかりますか？"
    subtitle: "時差はわずか数時間。それでも人数が増えるほど、全員が揃う時間は見つけにくくなります。"
    badge: "最後までご覧ください 👉"

  - layout: chat
    title: "こんなやり取り、\n心当たりはありませんか？"
    group: "アジア拠点定例"
    messages:
      - {from: "Linh（ベトナム）", text: "15:00からでどうでしょう？"}
      - {from: "Min-jun（韓国）", text: "ベトナムの15:00は、こちらでは17:00です"}
      - {from: "Arjun（インド）", text: "こちらは13:30です。インドは30分ずれるので、計算し直します"}
      - {me: true, text: "お待ちください、ほかのメンバーもいて…"}
    note: "イメージ用のやり取りで、実在の会話ではありません。"

  - layout: table
    title: "各国の勤務時間 09:00–18:00 を、ベトナム時間に直すと"
    columns: ["国", "勤務時間（ベトナム時間）"]
    rows:
      - ["ベトナム", "09:00 – 18:00"]
      - ["インド", "10:30 – 19:30"]
      - ["韓国", "07:00 – 16:00"]
      - [{text: "3か国が同時に勤務", tone: ok}, {text: "10:30 – 16:00", tone: ok}]
    style: app
    note: "通常の勤務時間から計算した例です。予定は何も入っていない前提です。"

  - layout: stat
    eyebrow: "一見、余裕がありそうです"
    value: "5.5時間"
    label: "毎日、3か国が同時に勤務している時間"
    caption: "韓国では12:30–18:00、インドでは09:00–14:30にあたります。3か国とも夏時間はありません。"

  - layout: stat
    eyebrow: "ところが人数が増えると"
    value: "約12%"
    label: "10人全員が空いている60分の枠が、ある週に見つかる確率"
    caption: "各自の勤務時間の約30%が埋まっている前提の簡単なシミュレーションです。3人なら、同じ条件でほぼ確実に見つかります。"

  - layout: pains
    title: "それだけではありません"
    items:
      - {emoji: "🎌", text: "**祝日**は国ごとに違う：テト、ソルラル、ディワリ"}
      - {emoji: "🔢", text: "インドは**30分**のずれ。手作業の換算はミスのもと"}
      - {emoji: "👀", text: "**組織の外**の方の予定は、多くの場合見えません"}
      - {emoji: "🌙", text: "全員が収まらない時、**誰が不便な時間を担う**？"}

  - layout: poll
    eyebrow: "ちょっとだけ教えてください"
    question: "海外メンバーとの会議時間は、\nどう決めていますか？"
    options:
      - "いちばん動ける人が合わせる"
      - "拠点で持ち回りにする"
      - "日程調整ツールを使う"
      - "時間をずらし、録画で共有する"

  - layout: cta
    emoji: "💬"
    title: "この課題のために、\n小さなツールを試作中です"
    text: "今は同じ組織の方の予定しか読めず、公開もしていません。まずは皆さんの工夫を伺いたいです。"
    show_link: false

platforms:
  facebook:
    caption: |
      ベトナム・インド・韓国のメンバーとの会議、時差は小さいのに「全員が空いている時間」が意外と見つかりません 🌏

      3か国とも09:00–18:00で働くと、毎日5.5時間は勤務時間が重なります。余裕がありそうですが、メンバーが10人になり、それぞれ勤務時間の約30%が埋まっているとすると、簡単なシミュレーションでは全員が空いている60分の枠がある週に見つかるのは約12%でした（3人なら、ほぼ確実に見つかります）。

      さらに、祝日は国ごとに違い、インドは30分単位のずれがあるため手作業の換算はミスのもとです。組織の外の方の予定は、多くの場合そもそも見えません。

      （ランダムな予定によるシミュレーションで、実在のチームの数字ではありません。）

      この課題のために小さなツールを試作していますが、今は同じ組織の方の予定しか読めず、公開もしていません。まずは皆さんの工夫を伺えればと思います。海外メンバーとの会議時間は、どう決めていますか？ A / B / C / D でコメントいただけるとうれしいです 👇
    first_comment: |
      A. いちばん動ける人が合わせる ・ B. 拠点で持ち回り ・ C. 日程調整ツールを使う ・ D. ずらして録画で共有
    hashtags: [海外会議, 日程調整, 時差, 業務効率化, 働き方]
