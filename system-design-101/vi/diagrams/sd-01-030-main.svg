<svg xmlns="http://www.w3.org/2000/svg" width="320" height="740" viewBox="0 0 320 740" role="img" aria-labelledby="title desc"><title id="title">Bảo vệ API: kiểm tra nhiều lớp</title><desc id="desc">Bốn câu hỏi phối hợp khi bảo vệ dịch vụ hồ sơ thú cưng, không phải thứ tự xử lý bắt buộc.</desc><rect width="320" height="740" fill="#f8fafc"/><g font-family="Arial, sans-serif" font-size="16" fill="#0f172a"><text x="16" y="32" font-size="20" font-weight="bold">Ai được xem hồ sơ này?</text>
<rect x="12" y="55" width="296" height="138" rx="12" fill="#dbeafe"/><text x="22" y="84" font-weight="bold">ĐƯỜNG TRUYỀN</text>
<text x="22" y="122">HTTPS + kiểm chứng chỉ</text>
<rect x="12" y="210" width="296" height="138" rx="12" fill="#dcfce7"/><text x="22" y="239" font-weight="bold">BÊN GỌI VÀ QUYỀN</text>
<text x="22" y="277">Đã đăng nhập?</text>
<text x="22" y="306">Được xem hồ sơ này?</text>
<rect x="12" y="365" width="296" height="138" rx="12" fill="#fef3c7"/><text x="22" y="394" font-weight="bold">DỮ LIỆU ĐẦU VÀO</text>
<text x="22" y="432">Đúng kiểu, phạm vi, kích thước?</text>
<rect x="12" y="520" width="296" height="138" rx="12" fill="#fce7f3"/><text x="22" y="549" font-weight="bold">MỨC TIÊU THỤ</text>
<text x="22" y="587">Bao nhiêu yêu cầu?</text>
<text x="22" y="616">Mỗi yêu cầu tốn bao nhiêu?</text>
<text x="16" y="705">Theo dõi sự kiện; log không bí mật.</text></g></svg>
