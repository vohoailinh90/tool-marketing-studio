<text x="78" y="748.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Data-Intensive</text>
<text x="78" y="768.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Applications</text>
<text x="78" y="792.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Tên đầy đủ: Designing</text>
<text x="78" y="811.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Data-Intensive</text>
<text x="78" y="831.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Applications. Kleppmann:</text>
<text x="78" y="850.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">lưu trữ và xử lý dữ liệu ở</text>
<text x="78" y="870.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">quy mô lớn.</text>
<rect x="20" y="902" width="280" height="107" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
<circle cx="50" cy="955.5" r="18" fill="#b45309"/><g transform="translate(39.2 944.7) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v16"/><path d="M20.001 19A2 2 0 0022 17V5a2 2 0 00-1.999-2L16 3.002A5 5 0 0012 5a5 5 0 00-4-2H4a2 2 0 00-2 2v12a2 2 0 001.999 2H8a5 5 0 014 2 5 5 0 014-2z"/></g>
