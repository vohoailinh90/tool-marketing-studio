<svg xmlns="http://www.w3.org/2000/svg" width="320" height="945" viewBox="0 0 320 945" role="img" aria-labelledby="title desc">
<title id="title">Uber xếp thành tám mảng</title>
<desc id="desc">Hai dải bước và một cột. Phía người dùng: web dùng framework Fusion; di động dùng kiến trúc RIB, Swift và Java. Phía Uber: lưới dịch vụ Uber Gateway trên NGINX với gRPC và QUIC; dịch vụ dùng Flipr, H3, Spring Boot, uAct, Cadence; cơ sở dữ liệu DocStore trên MySQL, PostgreSQL, RocksDB. Đứng ngoài đường đi: dữ liệu lớn họ Hadoop, xử lý bằng Hive, Spark, Kafka, Flink; phát hành bằng monorepo, Spinnaker, M3.</desc>
