<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 829" width="320" height="829" role="img" aria-labelledby="title desc">
<title id="title">Sáu mảng của hệ sinh thái Kubernetes</title>
<desc id="desc">Sáu thẻ: bảo mật, mạng, container runtime, quản lý cụm, giám sát và quan sát, điều phối hạ tầng; mỗi thẻ kèm vài ví dụ.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#475569" stroke-width="1.5"/></marker></defs>
<rect width="320" height="829" fill="#f8fafc"/><g font-family="DejaVu Sans, Arial, sans-serif" fill="#0f172a">
<text x="16" y="30" font-size="20" font-weight="bold">6 MẢNG HỆ SINH THÁI</text>
<text x="16" y="58" font-size="16" font-weight="normal">Ví dụ minh họa, không phải</text>
<text x="16" y="85" font-size="16" font-weight="normal">xếp hạng</text>
<rect x="16" y="116" width="288" height="155" rx="10" fill="#fee2e2" stroke="#94a3b8"/>
<text x="30" y="144" font-size="16" font-weight="bold">Bảo mật</text>
<text x="30" y="171" font-size="16" font-weight="normal">Quét image: Trivy</text>
<text x="30" y="198" font-size="16" font-weight="normal">Phát hiện bất thường: Falco</text>
<text x="30" y="225" font-size="16" font-weight="normal">Chính sách: Kyverno, OPA</text>
<text x="30" y="252" font-size="16" font-weight="normal">Gatekeeper</text>
<rect x="16" y="283" width="288" height="128" rx="10" fill="#dbeafe" stroke="#94a3b8"/>
<text x="30" y="311" font-size="16" font-weight="bold">Mạng</text>
<text x="30" y="338" font-size="16" font-weight="normal">CNI: Cilium, Calico</text>
<text x="30" y="365" font-size="16" font-weight="normal">Service mesh: Istio,</text>
<text x="30" y="392" font-size="16" font-weight="normal">Linkerd</text>
<rect x="16" y="423" width="288" height="101" rx="10" fill="#ede9fe" stroke="#94a3b8"/>
<text x="30" y="451" font-size="16" font-weight="bold">Container runtime</text>
<text x="30" y="478" font-size="16" font-weight="normal">containerd, CRI-O</text>
<text x="30" y="505" font-size="16" font-weight="normal">Kubernetes gọi qua CRI</text>
<rect x="16" y="536" width="288" height="74" rx="10" fill="#fef3c7" stroke="#94a3b8"/>
<text x="30" y="564" font-size="16" font-weight="bold">Quản lý cụm</text>
<text x="30" y="591" font-size="16" font-weight="normal">kubeadm, Cluster API, kOps</text>
<rect x="16" y="622" width="288" height="101" rx="10" fill="#dcfce7" stroke="#94a3b8"/>
<text x="30" y="650" font-size="16" font-weight="bold">Giám sát, quan sát</text>
<text x="30" y="677" font-size="16" font-weight="normal">Prometheus, Grafana</text>
<text x="30" y="704" font-size="16" font-weight="normal">Jaeger, OpenTelemetry</text>
<rect x="16" y="735" width="288" height="74" rx="10" fill="#e2e8f0" stroke="#94a3b8"/>
<text x="30" y="763" font-size="16" font-weight="bold">Điều phối hạ tầng</text>
<text x="30" y="790" font-size="16" font-weight="normal">Terraform, Crossplane</text>
</g></svg>
