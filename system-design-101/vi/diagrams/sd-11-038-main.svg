<desc id="desc">Giao tiếp và bảo vệ: Ambassador • circuit breaker: Publisher/subscriber; Dữ liệu: CQRS: tách đọc/ghi: Event sourcing • sharding; Điều phối: Leader election khi cần: Quyền cũ + lỗi mạng. Các khung là ý chính để đối chiếu, không nhất thiết là các bước tuần tự.</desc>
