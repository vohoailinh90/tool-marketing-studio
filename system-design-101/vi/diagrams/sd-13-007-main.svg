<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 679" width="320" height="679" role="img" aria-labelledby="title desc">
<title id="title">Chín anti-pattern khi làm ứng dụng cloud-native</title>
<desc id="desc">Ba thẻ nhóm: thiết kế (monolith cứng, trạng thái cục bộ, tài nguyên dùng chung), vận hành (hạ tầng sửa tay, bỏ CI/CD, quá nhiều dịch vụ không chiến lược), hiệu quả (bỏ qua chi phí, truy vấn dữ liệu kém, image phình to).</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#475569" stroke-width="1.5"/></marker></defs>
<rect width="320" height="679" fill="#f8fafc"/><g font-family="DejaVu Sans, Arial, sans-serif" fill="#0f172a">
<text x="16" y="30" font-size="20" font-weight="bold">9 ANTI-PATTERN</text>
<text x="16" y="58" font-size="16" font-weight="normal">Ba nhóm vấn đề</text>
<rect x="16" y="89" width="288" height="209" rx="10" fill="#fee2e2" stroke="#94a3b8"/>
<text x="30" y="117" font-size="16" font-weight="bold">Thiết kế</text>
<text x="30" y="144" font-size="16" font-weight="normal">Monolith gắn chặt, khó mở</text>
<text x="30" y="171" font-size="16" font-weight="normal">rộng</text>
<text x="30" y="198" font-size="16" font-weight="normal">Giữ trạng thái trong tiến</text>
<text x="30" y="225" font-size="16" font-weight="normal">trình</text>
<text x="30" y="252" font-size="16" font-weight="normal">Nhiều nơi tranh một tài</text>
<text x="30" y="279" font-size="16" font-weight="normal">nguyên chung</text>
<rect x="16" y="310" width="288" height="182" rx="10" fill="#fef3c7" stroke="#94a3b8"/>
<text x="30" y="338" font-size="16" font-weight="bold">Vận hành</text>
<text x="30" y="365" font-size="16" font-weight="normal">Sửa hạ tầng bằng tay tại</text>
<text x="30" y="392" font-size="16" font-weight="normal">chỗ</text>
<text x="30" y="419" font-size="16" font-weight="normal">Triển khai tay, bỏ CI/CD</text>
<text x="30" y="446" font-size="16" font-weight="normal">Dùng quá nhiều dịch vụ</text>
<text x="30" y="473" font-size="16" font-weight="normal">cloud không chiến lược</text>
<rect x="16" y="504" width="288" height="155" rx="10" fill="#dbeafe" stroke="#94a3b8"/>
<text x="30" y="532" font-size="16" font-weight="bold">Hiệu quả</text>
<text x="30" y="559" font-size="16" font-weight="normal">Không theo dõi chi phí</text>
<text x="30" y="586" font-size="16" font-weight="normal">Truy vấn phức tạp, thiếu</text>
<text x="30" y="613" font-size="16" font-weight="normal">chỉ mục</text>
<text x="30" y="640" font-size="16" font-weight="normal">Image to, khởi động chậm</text>
</g></svg>
