<svg xmlns="http://www.w3.org/2000/svg" width="320" height="1092" viewBox="0 0 320 1092" role="img" aria-labelledby="title desc">
<title id="title">Kiến trúc dịch vụ nhỏ: mỗi bộ phận một cái giá</title>
<desc id="desc">Ba khung. Khung một, bảy bộ phận của kiến trúc dịch vụ nhỏ theo nguồn: bộ cân bằng tải, CDN và cổng API đứng trước các dịch vụ; nhà cấp danh tính xác thực; sổ đăng ký giúp cổng tìm dịch vụ; phần quản lý theo dõi; mỗi miền có cơ sở dữ liệu riêng. Khung hai, các phép đo trên một máy: qua cổng mất 0,9 mili giây thay vì 0,5; cổng gộp hai lời gọi thì 42 mili giây thay vì 82 khi mạng ngoài mất 40; hỏi sổ đăng ký mỗi lần 0,6 thay vì 0,24; kiểm chữ ký tại chỗ 2 micro giây, hỏi máy chủ khác 230; lấy 200 đơn kèm tên khách, một phép nối 0,2 mili giây, gọi từng đơn 50. Khung ba, cân bằng tải, CDN và quản lý chưa được đo.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs>
<rect width="320" height="1092" fill="#f8fafc"/>
<g font-family="DejaVu Sans, Arial, sans-serif" fill="#0f172a">
<text x="16" y="34" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">Kiến trúc dịch vụ nhỏ:</text>
<text x="16" y="58" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">mỗi bộ phận một cái giá</text>
<text x="16" y="84.2" font-size="15" fill="#475569" font-weight="normal" text-anchor="start">Bảy bộ phận của nguồn, năm cái giá</text>
<text x="16" y="103.8" font-size="15" fill="#475569" font-weight="normal" text-anchor="start">đo thử trên một máy.</text>
<rect x="8" y="123" width="304" height="282" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="151.2" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Bảy bộ phận của nguồn</text>
<rect x="20" y="168" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="191" r="11" fill="#16a34a"/>
<polyline points="37.9,191.4 41.7,195.4 48.5,187" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="194.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Cân bằng tải, CDN và cổng</text>
<text x="64" y="213.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">API đứng trước các dịch vụ.</text>
<rect x="20" y="239" width="280" height="83" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="262" r="11" fill="#16a34a"/>
<polyline points="37.9,262.4 41.7,266.4 48.5,258" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="265.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Nhà cấp danh tính xác thực;</text>
<text x="64" y="284.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">sổ đăng ký giúp cổng tìm</text>
<text x="64" y="304.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">dịch vụ.</text>
<rect x="20" y="330" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="353" r="11" fill="#16a34a"/>
<polyline points="37.9,353.4 41.7,357.4 48.5,349" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="356.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Quản lý theo dõi; mỗi miền</text>
<text x="64" y="375.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">có cơ sở dữ liệu riêng.</text>
<rect x="8" y="417" width="304" height="444" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="445.2" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Năm cái giá đo được</text>
<rect x="20" y="462" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="485" r="11" fill="#16a34a"/>
<polyline points="37.9,485.4 41.7,489.4 48.5,481" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="488.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Qua cổng: 0,9 ms thay vì 0,5</text>
<text x="64" y="507.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">ms mỗi lời gọi.</text>
<rect x="20" y="533" width="280" height="83" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="556" r="11" fill="#16a34a"/>
<polyline points="37.9,556.4 41.7,560.4 48.5,552" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="559.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Cổng gộp hai lời gọi: 42 ms</text>
<text x="64" y="578.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">thay vì 82 ms, khi mạng</text>
<text x="64" y="598.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">ngoài mất 40 ms.</text>
<rect x="20" y="624" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="647" r="11" fill="#16a34a"/>
<polyline points="37.9,647.4 41.7,651.4 48.5,643" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="650.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Hỏi sổ đăng ký mỗi lần: 0,6</text>
<text x="64" y="669.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">ms thay vì 0,24 ms.</text>
<rect x="20" y="695" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="718" r="11" fill="#16a34a"/>
<polyline points="37.9,718.4 41.7,722.4 48.5,714" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="721.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Kiểm chữ ký tại chỗ 2 µs; hỏi</text>
<text x="64" y="740.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">máy chủ khác 230 µs.</text>
<rect x="20" y="766" width="280" height="83" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="789" r="11" fill="#16a34a"/>
<polyline points="37.9,789.4 41.7,793.4 48.5,785" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="792.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">200 đơn kèm tên khách: một</text>
<text x="64" y="811.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">phép nối 0,2 ms; gọi từng</text>
<text x="64" y="831.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">đơn 50 ms.</text>
<rect x="8" y="873" width="304" height="211" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="901.1" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Giới hạn</text>
<rect x="20" y="918" width="280" height="83" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="941" r="11" fill="#16a34a"/>
<polyline points="37.9,941.4 41.7,945.4 48.5,937" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="944.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Một máy, một ngôn ngữ;</text>
<text x="64" y="963.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">mạng ngoài 40 ms là số đặt</text>
<text x="64" y="983.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">thêm.</text>
<rect x="20" y="1009" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="1032" r="11" fill="#16a34a"/>
<polyline points="37.9,1032.4 41.7,1036.4 48.5,1028" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="1035.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Cân bằng tải, CDN và quản</text>
<text x="64" y="1054.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">lý chưa được đo.</text>
</g>
</svg>
