<circle cx="50" cy="892.5" r="18" fill="#0f766e"/><g transform="translate(39.2 881.7) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect height="8" rx="2" width="8" x="3" y="3"/><path d="M7 11v4a2 2 0 0 0 2 2h4"/><rect height="8" rx="2" width="8" x="13" y="13"/></g>
<text x="78" y="875.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Công cụ</text>
<text x="78" y="899.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Hàm bậc cao, đệ quy và</text>
<text x="78" y="918.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">lập trình khai báo.</text>
