<svg xmlns="http://www.w3.org/2000/svg" width="320" height="580" viewBox="0 0 320 580" role="img" aria-labelledby="title desc">
<title id="title">Ai bắt đầu lần trao đổi tiếp theo?</title><desc id="desc">Polling: thư viện hỏi, đối tác trả lời, lặp theo lịch. Webhook: sau đăng ký, đối tác gửi sự kiện về thư viện. Mũi tên không là bảo đảm giao thành công.</desc>
<defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#334155"/></marker></defs><rect width="320" height="580" fill="#f8fafc"/>
<g font-family="Arial, sans-serif" font-size="16" fill="#0f172a">
<text x="16" y="30" font-size="20" font-weight="bold">Ai bắt đầu trao đổi?</text>
<rect x="12" y="50" width="296" height="225" rx="12" fill="#dbeafe"/><text x="24" y="82" font-size="18" font-weight="bold">Polling · hỏi định kỳ</text><text x="24" y="111">Có thể hỏi khi chưa đổi.</text>
<rect x="24" y="138" width="86" height="76" rx="8" fill="white"/><text x="39" y="169">Thư</text><text x="39" y="196">viện</text>
<rect x="210" y="138" width="86" height="76" rx="8" fill="white"/><text x="225" y="169">Đối</text><text x="225" y="196">tác</text>
<text x="145" y="143">Hỏi</text><path d="M116,155 H204" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M204,183 H116" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><text x="132" y="207">Trả lời</text><text x="24" y="251">Lặp lại theo lịch đã chọn.</text>
<rect x="12" y="295" width="296" height="225" rx="12" fill="#dcfce7"/><text x="24" y="327" font-size="18" font-weight="bold">Webhook · gửi sự kiện</text><text x="24" y="356">Đã đăng ký nơi nhận trước.</text>
<rect x="24" y="383" width="86" height="76" rx="8" fill="white"/><text x="39" y="414">Thư</text><text x="39" y="441">viện</text>
<rect x="210" y="383" width="86" height="76" rx="8" fill="white"/><text x="225" y="414">Đối</text><text x="225" y="441">tác</text>
<text x="127" y="405">Sự kiện</text><path d="M204,424 H116" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><text x="24" y="496">Gửi khi có sự kiện phù hợp.</text>
<text x="16" y="558">Cả hai đều có thể chậm hoặc lỗi.</text></g></svg>
