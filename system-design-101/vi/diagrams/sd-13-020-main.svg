<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 824" width="320" height="824" role="img" aria-labelledby="title desc">
<title id="title">Rủi ro khi triển khai và cách giảm</title>
<desc id="desc">Năm rủi ro và cách giảm: lỗi chỉ lộ ở tải thật thì mở traffic từng nấc, hai phiên bản gặp nhau thì giữ tương thích hai chiều và đổi dữ liệu theo nhiều bước, không biết bản mới tốt hay xấu thì đặt ngưỡng chấp nhận từ trước, rút lại quá chậm thì tập và đo thời gian rút lại, và thay đổi gói quá lớn thì chia nhỏ.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#475569" stroke-width="1.5"/></marker></defs>
<rect width="320" height="824" fill="#f8fafc"/><g font-family="DejaVu Sans, Arial, sans-serif" fill="#0f172a">
<text x="16" y="30" font-size="20" font-weight="bold">RỦI RO → CÁCH GIẢM</text>
<text x="16" y="58" font-size="16" font-weight="normal">Gọi tên rủi ro trước</text>
<rect x="16" y="89" width="288" height="128" rx="10" fill="#fee2e2" stroke="#94a3b8"/>
<text x="30" y="117" font-size="16" font-weight="bold">Lỗi chỉ lộ ở tải thật</text>
<text x="30" y="144" font-size="16" font-weight="normal">Mở traffic cho bản mới từng</text>
<text x="30" y="171" font-size="16" font-weight="normal">nấc nhỏ</text>
<text x="30" y="198" font-size="16" font-weight="normal">Dừng khi số đo xấu đi</text>
<rect x="16" y="229" width="288" height="128" rx="10" fill="#fef3c7" stroke="#94a3b8"/>
<text x="30" y="257" font-size="16" font-weight="bold">Hai phiên bản gặp nhau</text>
<text x="30" y="284" font-size="16" font-weight="normal">Làm thay đổi tương thích</text>
<text x="30" y="311" font-size="16" font-weight="normal">hai chiều trước</text>
<text x="30" y="338" font-size="16" font-weight="normal">Đổi dữ liệu theo nhiều bước</text>
<rect x="16" y="369" width="288" height="209" rx="10" fill="#ede9fe" stroke="#94a3b8"/>
<text x="30" y="397" font-size="16" font-weight="bold">Không biết bản mới tốt</text>
<text x="30" y="424" font-size="16" font-weight="bold">hay xấu</text>
<text x="30" y="451" font-size="16" font-weight="normal">Đặt ngưỡng chấp nhận từ SLO</text>
<text x="30" y="478" font-size="16" font-weight="normal">(mục tiêu mức dịch vụ)</text>
<text x="30" y="505" font-size="16" font-weight="normal">trước</text>
<text x="30" y="532" font-size="16" font-weight="normal">Để quy tắc quyết định,</text>
<text x="30" y="559" font-size="16" font-weight="normal">không cảm tính</text>
<rect x="16" y="590" width="288" height="101" rx="10" fill="#dbeafe" stroke="#94a3b8"/>
<text x="30" y="618" font-size="16" font-weight="bold">Rút lại quá chậm</text>
<text x="30" y="645" font-size="16" font-weight="normal">Giữ bản trước sẵn sàng</text>
<text x="30" y="672" font-size="16" font-weight="normal">Tập rút lại và đo thời gian</text>
<rect x="16" y="703" width="288" height="101" rx="10" fill="#dcfce7" stroke="#94a3b8"/>
<text x="30" y="731" font-size="16" font-weight="bold">Thay đổi gói quá lớn</text>
<text x="30" y="758" font-size="16" font-weight="normal">Chia thành bản nhỏ, triển</text>
<text x="30" y="785" font-size="16" font-weight="normal">khai thường xuyên</text>
</g></svg>
