<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 812" width="320" height="812" role="img" aria-labelledby="title desc">
<title id="title">Bốn cách nhận ra người dùng ở mỗi yêu cầu</title>
<desc id="desc">Câu hỏi chung: mỗi yêu cầu đi kèm gì để máy chủ biết đó là ai. Basic: mỗi yêu cầu gửi lại tên và mật khẩu, mã hóa base64 nên ai cũng giải ngược được. Session cookie: máy chủ giữ dữ liệu, trình duyệt gửi lại một mã. Token ngẫu nhiên: cùng mô hình trạng thái với session, máy chủ vẫn tra cứu; khác ở chỗ client gắn mã vào tiêu đề thay vì cookie. JWT: token tự mang thông tin và chữ ký, kiểm tra được mà không cần tra máy chủ, nhưng nội dung đọc được và khó thu hồi trước hạn. Cái giá: càng ít trạng thái ở máy chủ thì càng khó thu hồi.</desc>
<rect width="320" height="812" fill="#f8fafc"/>
<g font-family="DejaVu Sans, Arial, sans-serif" fill="#0f172a">
<text x="16" y="30" font-size="21" font-weight="bold">NHẬN RA</text>
<text x="16" y="54" font-size="21" font-weight="bold">NGƯỜI DÙNG</text>
<rect x="16" y="80" width="288" height="100" rx="12" fill="#e2e8f0" stroke="#94a3b8"/>
<text x="29" y="109" font-size="16" font-weight="bold">Câu hỏi chung</text>
<text x="29" y="137" font-size="16" font-weight="normal">Mỗi yêu cầu đi kèm gì để máy</text>
<text x="29" y="161" font-size="16" font-weight="normal">chủ biết đó là ai?</text>
<rect x="16" y="190" width="288" height="124" rx="12" fill="#dbeafe" stroke="#94a3b8"/>
<text x="29" y="219" font-size="16" font-weight="bold">Basic</text>
<text x="29" y="247" font-size="16" font-weight="normal">Gửi lại tên và mật khẩu mỗi lần.</text>
<text x="29" y="271" font-size="16" font-weight="normal">Base64, ai cũng giải ngược</text>
<text x="29" y="295" font-size="16" font-weight="normal">được.</text>
<rect x="16" y="322" width="288" height="100" rx="12" fill="#ede9fe" stroke="#94a3b8"/>
<text x="29" y="351" font-size="16" font-weight="bold">Session cookie</text>
<text x="29" y="379" font-size="16" font-weight="normal">Máy chủ giữ dữ liệu; trình duyệt</text>
<text x="29" y="403" font-size="16" font-weight="normal">gửi lại một mã.</text>
<rect x="16" y="430" width="288" height="124" rx="12" fill="#dcfce7" stroke="#94a3b8"/>
<text x="29" y="459" font-size="16" font-weight="bold">Token ngẫu nhiên</text>
<text x="29" y="487" font-size="16" font-weight="normal">Cùng mô hình với session: máy</text>
<text x="29" y="511" font-size="16" font-weight="normal">chủ tra cứu. Chỉ khác nơi mang</text>
<text x="29" y="535" font-size="16" font-weight="normal">mã: tiêu đề thay vì cookie.</text>
<rect x="16" y="562" width="288" height="124" rx="12" fill="#fef3c7" stroke="#94a3b8"/>
<text x="29" y="591" font-size="16" font-weight="bold">JWT</text>
<text x="29" y="619" font-size="16" font-weight="normal">Tự mang thông tin và chữ ký;</text>
<text x="29" y="643" font-size="16" font-weight="normal">kiểm tra không cần tra máy</text>
<text x="29" y="667" font-size="16" font-weight="normal">chủ. Nội dung đọc được.</text>
<rect x="16" y="698" width="288" height="100" rx="12" fill="#fee2e2" stroke="#94a3b8"/>
<text x="29" y="727" font-size="16" font-weight="bold">Cái giá</text>
<text x="29" y="755" font-size="16" font-weight="normal">Càng ít trạng thái ở máy chủ,</text>
<text x="29" y="779" font-size="16" font-weight="normal">càng khó thu hồi trước hạn.</text>
</g></svg>
