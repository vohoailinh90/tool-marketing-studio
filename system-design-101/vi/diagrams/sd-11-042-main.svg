<svg xmlns="http://www.w3.org/2000/svg" width="320" height="1445" viewBox="0 0 320 1445" role="img" aria-labelledby="title desc">
<title id="title">Mười lăm khái niệm, bốn câu hỏi</title>
<desc id="desc">Năm khung. Khung một, làm cái gì: thu thập yêu cầu, thiết kế miền, thiết kế trải nghiệm người dùng. Khung hai, dựng thế nào: kiến trúc hệ thống, thiết kế dữ liệu, khả năng mở rộng, hiệu năng. Khung ba, giữ cho sống: độ tin cậy, tính sẵn sàng, bảo mật, khả năng bảo trì, kiểm thử. Khung bốn, đưa vào đời: ước tính chi phí, tài liệu, kế hoạch di chuyển. Khung năm, đếm trong một tài liệu ôn phỏng vấn: khả năng mở rộng 104 lần, kiến trúc 70 lần; sáu khái niệm chỉ được nhắc không quá một lần.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs>
<rect width="320" height="1445" fill="#f8fafc"/>
<g font-family="DejaVu Sans, Arial, sans-serif" fill="#0f172a">
<text x="16" y="34" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">Mười lăm khái niệm, bốn</text>
<text x="16" y="58" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">câu hỏi</text>
<text x="16" y="84.2" font-size="15" fill="#475569" font-weight="normal" text-anchor="start">Và thứ tài liệu ôn thi hay bỏ quên.</text>
<rect x="8" y="104" width="304" height="228" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="132.2" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Làm cái gì</text>
<rect x="20" y="149" width="280" height="46" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="172" r="11" fill="#16a34a"/>
<polyline points="37.9,172.4 41.7,176.4 48.5,168" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="175.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Thu thập yêu cầu.</text>
<rect x="20" y="203" width="280" height="46" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="226" r="11" fill="#16a34a"/>
<polyline points="37.9,226.4 41.7,230.4 48.5,222" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="229.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Thiết kế miền.</text>
<rect x="20" y="257" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="280" r="11" fill="#16a34a"/>
<polyline points="37.9,280.4 41.7,284.4 48.5,276" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="283.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Thiết kế trải nghiệm người</text>
<text x="64" y="302.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">dùng.</text>
<rect x="8" y="344" width="304" height="265" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="372.2" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Dựng thế nào</text>
