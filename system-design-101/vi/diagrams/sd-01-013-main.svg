<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 682" width="320" height="682" role="img" aria-labelledby="title desc">
<title id="title">WAN, MAN, LAN và PAN theo phạm vi</title>
<desc id="desc">Bốn khung dọc theo phạm vi tăng dần: PAN quanh một người trong vài mét như Bluetooth hoặc USB; LAN trong một nơi như nhà, văn phòng hoặc tòa nhà bằng Ethernet hoặc Wi-Fi để dùng chung máy in và máy chủ tệp; MAN phủ cả một thành phố hoặc khuôn viên lớn và nối nhiều cơ sở; WAN trải nhiều thành phố và quốc gia qua nhà mạng, VPN hoặc đường thuê riêng, trong đó Internet là mạng của các mạng. Ranh giới là quy ước, không cứng.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#475569" stroke-width="1.5"/></marker></defs>
<rect width="320" height="682" fill="#f8fafc"/>
<g font-family="DejaVu Sans, Arial, sans-serif" fill="#0f172a">
<text x="16" y="30" font-size="20" font-weight="bold">WAN · MAN</text>
<text x="16" y="56" font-size="20" font-weight="bold">LAN · PAN</text>
<text x="16" y="86" font-size="16" font-weight="normal">Phân loại theo phạm vi</text>
<rect x="16" y="108" width="288" height="104" rx="12" fill="#dbeafe" stroke="#94a3b8"/>
<text x="30" y="138" font-size="16" font-weight="bold">PAN · quanh một người</text>
<text x="30" y="165" font-size="16" font-weight="normal">Vài mét: Bluetooth, USB</text>
<text x="30" y="192" font-size="16" font-weight="normal">Điện thoại ↔ tai nghe</text>
<rect x="16" y="226" width="288" height="131" rx="12" fill="#dcfce7" stroke="#94a3b8"/>
<text x="30" y="256" font-size="16" font-weight="bold">LAN · trong một nơi</text>
<text x="30" y="283" font-size="16" font-weight="normal">Nhà, văn phòng, tòa nhà</text>
<text x="30" y="310" font-size="16" font-weight="normal">Ethernet, Wi-Fi</text>
<text x="30" y="337" font-size="16" font-weight="normal">Chung máy in, máy chủ tệp</text>
<rect x="16" y="371" width="288" height="104" rx="12" fill="#ede9fe" stroke="#94a3b8"/>
<text x="30" y="401" font-size="16" font-weight="bold">MAN · cả một thành phố</text>
<text x="30" y="428" font-size="16" font-weight="normal">Thành phố hoặc khuôn viên lớn</text>
<text x="30" y="455" font-size="16" font-weight="normal">Nối nhiều cơ sở với nhau</text>
<rect x="16" y="489" width="288" height="131" rx="12" fill="#fef3c7" stroke="#94a3b8"/>
<text x="30" y="519" font-size="16" font-weight="bold">WAN · nhiều vùng</text>
<text x="30" y="546" font-size="16" font-weight="normal">Nhiều thành phố, quốc gia</text>
<text x="30" y="573" font-size="16" font-weight="normal">Nhà mạng, VPN, đường thuê</text>
<text x="30" y="600" font-size="16" font-weight="normal">Internet: mạng của các mạng</text>
<text x="16" y="662" font-size="16" font-weight="normal">Ranh giới là quy ước, không cứng.</text>
</g></svg>
