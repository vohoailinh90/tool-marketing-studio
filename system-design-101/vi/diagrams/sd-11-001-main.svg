<svg xmlns="http://www.w3.org/2000/svg" width="360" height="648" viewBox="0 0 360 648" role="img" aria-labelledby="title desc">
<title id="title">AWS Lambda hoạt động phía sau lời gọi hàm</title>
<desc id="desc">Sự kiện: Đồng bộ: chờ kết quả: Bất đồng bộ: nhận trước; Khởi tạo nếu cần: Runtime + mã + cấu hình: Môi trường có thể tái dùng; Handler của ứng dụng: Ứng dụng ghi kho nếu cần: Lambda không tự lưu kết quả; Kết quả đồng bộ: Trả handler response/lỗi: Bên gọi chờ xử lý; Kết quả bất đồng bộ: Không trả handler response: Tra job hoặc cấu hình đích. Hai khung kết quả cuối là hai chế độ khác nhau, không phải hai bước liên tiếp. Ghi kết quả nghiệp vụ vào kho bền là trách nhiệm ứng dụng nếu cần.</desc>
<rect width="360" height="648" fill="#f8fafc"/>
<g font-family="DejaVu Sans, sans-serif" fill="#0f172a">
<text x="20" y="28" font-size="18" font-weight="bold">sd-11-001 · Nhìn hình trước</text>
<rect x="12" y="48" width="336" height="102" rx="12" fill="#e0f2fe" stroke="#64748b"/>
<text x="24" y="75" font-size="18" font-weight="bold">Sự kiện</text>
<text x="24" y="104" font-size="18">Đồng bộ: chờ kết quả</text>
<text x="24" y="130" font-size="18">Bất đồng bộ: nhận trước</text>
<rect x="12" y="162" width="336" height="102" rx="12" fill="#dcfce7" stroke="#64748b"/>
<text x="24" y="189" font-size="18" font-weight="bold">Khởi tạo nếu cần</text>
<text x="24" y="218" font-size="18">Runtime + mã + cấu hình</text>
<text x="24" y="244" font-size="18">Môi trường có thể tái dùng</text>
<rect x="12" y="276" width="336" height="102" rx="12" fill="#fef3c7" stroke="#64748b"/>
<text x="24" y="303" font-size="18" font-weight="bold">Handler của ứng dụng</text>
<text x="24" y="332" font-size="18">Ứng dụng ghi kho nếu cần</text>
<text x="24" y="358" font-size="18">Lambda không tự lưu kết quả</text>
<rect x="12" y="390" width="336" height="102" rx="12" fill="#e0f2fe" stroke="#64748b"/>
<text x="24" y="417" font-size="18" font-weight="bold">Kết quả đồng bộ</text>
<text x="24" y="446" font-size="18">Trả handler response/lỗi</text>
<text x="24" y="472" font-size="18">Bên gọi chờ xử lý</text>
<rect x="12" y="504" width="336" height="102" rx="12" fill="#dcfce7" stroke="#64748b"/>
<text x="24" y="531" font-size="18" font-weight="bold">Kết quả bất đồng bộ</text>
<text x="24" y="560" font-size="18">Không trả handler response</text>
<text x="24" y="586" font-size="18">Tra job hoặc cấu hình đích</text>
</g>
</svg>
