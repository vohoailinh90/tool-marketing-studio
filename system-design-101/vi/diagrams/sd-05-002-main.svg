<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 712" width="320" height="712" role="img" aria-labelledby="title desc">
<title id="title">Từ lúc gõ địa chỉ tới khi trang hiện ra</title>
<desc id="desc">Sáu bước. Nhập địa chỉ và Enter; kiểm tra cache; tra DNS ra địa chỉ IP; mở kết nối bằng bắt tay TCP ba bước SYN, SYN-ACK, ACK và với HTTPS thêm TLS; gửi yêu cầu HTTP và nhận phản hồi; trình duyệt dựng trang. Đây là đường chính: cache hit, kết nối dùng lại và HTTP/3 chạy trên QUIC có thể bỏ qua hoặc đổi vài bước.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#475569" stroke-width="1.5"/></marker></defs>
<rect width="320" height="712" fill="#f8fafc"/>
<g font-family="DejaVu Sans, Arial, sans-serif" fill="#0f172a">
<text x="16" y="30" font-size="21" font-weight="bold">GÕ ĐỊA CHỈ,</text>
<text x="16" y="54" font-size="21" font-weight="bold">TRANG HIỆN RA</text>
<rect x="16" y="80" width="288" height="76" rx="12" fill="#dbeafe" stroke="#94a3b8"/>
<text x="29" y="109" font-size="16" font-weight="bold">1 · Nhập địa chỉ</text>
<text x="29" y="137" font-size="16" font-weight="normal">Gõ rồi nhấn Enter</text>
<line x1="160" y1="157" x2="160" y2="174" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="16" y="176" width="288" height="76" rx="12" fill="#ede9fe" stroke="#94a3b8"/>
<text x="29" y="205" font-size="16" font-weight="bold">2 · Kiểm tra cache</text>
<text x="29" y="233" font-size="16" font-weight="normal">Đã có gì dùng lại được chưa?</text>
<line x1="160" y1="253" x2="160" y2="270" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="16" y="272" width="288" height="76" rx="12" fill="#dcfce7" stroke="#94a3b8"/>
<text x="29" y="301" font-size="16" font-weight="bold">3 · Tra DNS</text>
<text x="29" y="329" font-size="16" font-weight="normal">Tên miền → địa chỉ IP</text>
<line x1="160" y1="349" x2="160" y2="366" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="16" y="368" width="288" height="76" rx="12" fill="#fef3c7" stroke="#94a3b8"/>
<text x="29" y="397" font-size="16" font-weight="bold">4 · Mở kết nối</text>
<text x="29" y="425" font-size="16" font-weight="normal">Bắt tay TCP; HTTPS thêm TLS</text>
<line x1="160" y1="445" x2="160" y2="462" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="16" y="464" width="288" height="76" rx="12" fill="#fef3c7" stroke="#94a3b8"/>
<text x="29" y="493" font-size="16" font-weight="bold">5 · Yêu cầu HTTP</text>
<text x="29" y="521" font-size="16" font-weight="normal">Gửi yêu cầu, nhận HTML</text>
<line x1="160" y1="541" x2="160" y2="558" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="16" y="560" width="288" height="76" rx="12" fill="#e2e8f0" stroke="#94a3b8"/>
<text x="29" y="589" font-size="16" font-weight="bold">6 · Dựng trang</text>
<text x="29" y="617" font-size="16" font-weight="normal">DOM, CSSOM, layout, paint</text>
<text x="16" y="664" font-size="16" font-weight="normal" fill="#334155">Đường chính, không phải đường</text>
<text x="16" y="688" font-size="16" font-weight="normal" fill="#334155">duy nhất.</text>
</g></svg>
