<svg xmlns="http://www.w3.org/2000/svg" width="320" height="1142" viewBox="0 0 320 1142" role="img" aria-labelledby="title desc">
<title id="title">Làm mờ biển số và khuôn mặt</title>
<desc id="desc">Hai khung. Khung một, ba đường ống nối nhau: đường ống dữ liệu chuẩn bị dữ liệu huấn luyện và huấn luyện mô hình, đường ống làm mờ tìm vật nhạy cảm trong ảnh rồi làm mờ, đường ống phục vụ trả ảnh đã mờ cho người xem. Khung hai, bốn bước của đường ống làm mờ: tiền xử lý ảnh, tìm khung bao quanh vật nhạy cảm, làm mờ vùng trong khung, lưu ảnh đã mờ vào kho đối tượng. Khung ba, hai kiểu lỗi: bỏ sót thì lộ, làm mờ nhầm thì mất chi tiết.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs>
<rect width="320" height="1142" fill="#f8fafc"/>
<g font-family="DejaVu Sans, Arial, sans-serif" fill="#0f172a">
<text x="16" y="34" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">Làm mờ biển số và</text>
<text x="16" y="58" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">khuôn mặt</text>
<text x="16" y="84.2" font-size="15" fill="#475569" font-weight="normal" text-anchor="start">Làm một lần, ngoại tuyến, chỉ phát</text>
<text x="16" y="103.8" font-size="15" fill="#475569" font-weight="normal" text-anchor="start">ảnh đã mờ.</text>
<rect x="8" y="123" width="304" height="382" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="151.2" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Ba đường ống</text>
<rect x="20" y="168" width="280" height="87" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="50" cy="211.5" r="18" fill="#1d4ed8"/><g transform="translate(39.2 200.7) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5V19A9 3 0 0 0 21 19V5"/><path d="M3 12A9 3 0 0 0 21 12"/></g>
<text x="78" y="194.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Dữ liệu</text>
<text x="78" y="218.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Ảnh có khung, huấn luyện</text>
<text x="78" y="237.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">mô hình.</text>
<rect x="20" y="287" width="280" height="87" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="50" cy="330.5" r="18" fill="#1d4ed8"/><g transform="translate(39.2 319.7) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></g>
<text x="78" y="313.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Làm mờ</text>
<text x="78" y="337.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Tìm vật nhạy cảm, làm</text>
<text x="78" y="356.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">mờ.</text>
<rect x="20" y="406" width="280" height="87" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="50" cy="449.5" r="18" fill="#1d4ed8"/><g transform="translate(39.2 438.7) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></g>
<text x="78" y="432.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Phục vụ</text>
<text x="78" y="456.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Trả ảnh đã mờ cho người</text>
<text x="78" y="475.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">xem.</text>
<polyline points="160,257 160,285" fill="none" stroke="#334155" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="160,376 160,404" fill="none" stroke="#334155" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="8" y="517" width="304" height="414" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="545.1" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Đường ống làm mờ</text>
<rect x="20" y="562" width="280" height="68" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
<circle cx="46" cy="588" r="14" fill="#0f766e"/>
<text x="46" y="593.5" font-size="16" fill="#ffffff" font-weight="bold" text-anchor="middle">1</text>
<text x="70" y="588.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Tiền xử lý</text>
<text x="70" y="612.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Chuẩn hóa ảnh đường phố.</text>
<rect x="20" y="652" width="280" height="87" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
<circle cx="46" cy="678" r="14" fill="#0f766e"/>
<text x="46" y="683.5" font-size="16" fill="#ffffff" font-weight="bold" text-anchor="middle">2</text>
<text x="70" y="678.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Tìm khung</text>
<text x="70" y="702.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Khoanh biển số và khuôn</text>
<text x="70" y="721.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">mặt.</text>
<polyline points="46,632 46,650" fill="none" stroke="#334155" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="20" y="761" width="280" height="68" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
<circle cx="46" cy="787" r="14" fill="#0f766e"/>
<text x="46" y="792.5" font-size="16" fill="#ffffff" font-weight="bold" text-anchor="middle">3</text>
<text x="70" y="787.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Làm mờ</text>
<text x="70" y="811.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Làm mờ vùng trong khung.</text>
<polyline points="46,741 46,759" fill="none" stroke="#334155" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="20" y="851" width="280" height="68" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
<circle cx="46" cy="877" r="14" fill="#0f766e"/>
<text x="46" y="882.5" font-size="16" fill="#ffffff" font-weight="bold" text-anchor="middle">4</text>
<text x="70" y="877.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Lưu ảnh mờ</text>
<text x="70" y="901.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Ghi vào kho đối tượng.</text>
<polyline points="46,831 46,849" fill="none" stroke="#334155" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="8" y="943" width="304" height="191" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="971.1" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Hai kiểu lỗi</text>
<rect x="20" y="988" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="1011" r="11" fill="#16a34a"/>
<polyline points="37.9,1011.4 41.7,1015.4 48.5,1007" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="1014.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Bỏ sót: biển số hay khuôn</text>
<text x="64" y="1033.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">mặt vẫn rõ, lộ thông tin.</text>
<rect x="20" y="1059" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="1082" r="11" fill="#16a34a"/>
<polyline points="37.9,1082.4 41.7,1086.4 48.5,1078" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="1085.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Mờ nhầm: mất chi tiết ảnh</text>
<text x="64" y="1104.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">nhưng không lộ gì.</text>
</g>
</svg>
