<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 666" width="320" height="666" role="img" aria-labelledby="title desc">
<title id="title">Đường đi vị trí của AirTag</title>
<desc id="desc">AirTag phát Bluetooth kèm khóa công khai đổi theo thời gian. Thiết bị Apple ở gần nhận tín hiệu, mã hóa vị trí của chính nó và gửi lên máy chủ Apple. Máy chủ giữ bản mã. Chủ giải mã bằng khóa riêng và xem nơi AirTag được thấy gần nhất.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#475569" stroke-width="1.5"/></marker></defs>
<rect width="320" height="666" fill="#f8fafc"/>
<g font-family="DejaVu Sans, Arial, sans-serif" fill="#0f172a">
<text x="16" y="30" font-size="21" font-weight="bold">AIRTAG → BẢN ĐỒ</text>
<rect x="16" y="46" width="288" height="92" rx="12" fill="#dbeafe" stroke="#94a3b8"/>
<text x="29" y="75" font-size="16" font-weight="bold">1 · AirTag phát Bluetooth</text>
<text x="29" y="99" font-size="16" font-weight="normal">Khóa công khai đổi theo thời</text>
<text x="29" y="123" font-size="16" font-weight="normal">gian</text>
<line x1="160" y1="139" x2="160" y2="165" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="16" y="168" width="288" height="92" rx="12" fill="#e2e8f0" stroke="#94a3b8"/>
<text x="29" y="197" font-size="16" font-weight="bold">2 · Thiết bị Apple ở gần nghe</text>
<text x="29" y="221" font-size="16" font-weight="bold">thấy</text>
<text x="29" y="245" font-size="16" font-weight="normal">Ví dụ iPhone của người đi ngang</text>
<line x1="160" y1="261" x2="160" y2="287" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="16" y="290" width="288" height="92" rx="12" fill="#ede9fe" stroke="#94a3b8"/>
<text x="29" y="319" font-size="16" font-weight="bold">3 · Mã hóa vị trí của chính nó</text>
<text x="29" y="343" font-size="16" font-weight="normal">Dùng khóa công khai trong tín</text>
<text x="29" y="367" font-size="16" font-weight="normal">hiệu</text>
<line x1="160" y1="383" x2="160" y2="409" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="16" y="412" width="288" height="92" rx="12" fill="#dcfce7" stroke="#94a3b8"/>
<text x="29" y="441" font-size="16" font-weight="bold">4 · Máy chủ Apple giữ bản</text>
<text x="29" y="465" font-size="16" font-weight="bold">mã</text>
<text x="29" y="489" font-size="16" font-weight="normal">Không có khóa để mở</text>
<line x1="160" y1="505" x2="160" y2="531" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="16" y="534" width="288" height="68" rx="12" fill="#dbeafe" stroke="#94a3b8"/>
<text x="29" y="563" font-size="16" font-weight="bold">5 · Chủ giải mã trên thiết bị</text>
<text x="29" y="587" font-size="16" font-weight="normal">Find My: nơi thấy gần nhất</text>
<text x="16" y="630" font-size="16" font-weight="normal">AirTag không tự biết vị trí: nó cần</text>
<text x="16" y="654" font-size="16" font-weight="normal">thiết bị khác nghe thấy.</text>
</g></svg>
