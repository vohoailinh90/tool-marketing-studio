<svg xmlns="http://www.w3.org/2000/svg" width="320" height="992" viewBox="0 0 320 992" role="img" aria-labelledby="title desc">
<title id="title">Ba điều cần giữ và biện pháp giữ chúng</title>
<desc id="desc">Hai khung xếp dọc. Khung một: ba điều cần giữ của bộ ba CIA, mỗi điều kèm ví dụ khi hỏng. Bí mật: bảng lương lọt ra ngoài. Toàn vẹn: 100 USD thành 900 USD mà không ai hay. Sẵn sàng: trang thanh toán không mở được. Khung hai: biện pháp giữ từng điều. Bí mật: mã hóa, phân quyền đọc, lưu mật khẩu dạng băm. Toàn vẹn: mã xác thực, chữ ký số, phân quyền ghi. Sẵn sàng: giới hạn tốc độ, thời gian chờ, dự phòng. Thêm tường lửa bớt đường vào, và nhắc xếp nhiều lớp.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs>
<rect width="320" height="992" fill="#f8fafc"/>
<g font-family="DejaVu Sans, Arial, sans-serif" fill="#0f172a">
<text x="16" y="34" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">Ba điều cần giữ và biện</text>
<text x="16" y="58" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">pháp giữ chúng</text>
<text x="16" y="84.2" font-size="15" fill="#475569" font-weight="normal" text-anchor="start">Bộ ba CIA: bí mật, toàn vẹn, sẵn</text>
<text x="16" y="103.8" font-size="15" fill="#475569" font-weight="normal" text-anchor="start">sàng</text>
<rect x="8" y="123" width="304" height="425" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="151.2" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Ba điều cần giữ</text>
<rect x="20" y="168" width="280" height="107" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="50" cy="221.5" r="18" fill="#1d4ed8"/><g transform="translate(39.2 210.7) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect height="11" rx="2" ry="2" width="18" x="3" y="11"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></g>
<text x="78" y="194.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Bí mật</text>
<text x="78" y="218.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Chỉ người được phép đọc.</text>
<text x="78" y="237.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Hỏng khi bảng lương lọt ra</text>
<text x="78" y="257.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">ngoài.</text>
<rect x="20" y="289" width="280" height="107" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="50" cy="342.5" r="18" fill="#1d4ed8"/><g transform="translate(39.2 331.7) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" x2="20" y1="9" y2="9"/><line x1="4" x2="20" y1="15" y2="15"/><line x1="10" x2="8" y1="3" y2="21"/><line x1="16" x2="14" y1="3" y2="21"/></g>
<text x="78" y="315.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Toàn vẹn</text>
<text x="78" y="339.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Sửa là bị phát hiện. Hỏng</text>
<text x="78" y="358.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">khi 100 USD thành 900</text>
<text x="78" y="378.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">USD mà không ai hay.</text>
<rect x="20" y="410" width="280" height="126" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="50" cy="473" r="18" fill="#1d4ed8"/><g transform="translate(39.2 462.2) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect height="8" rx="2" ry="2" width="20" x="2" y="2"/><rect height="8" rx="2" ry="2" width="20" x="2" y="14"/><line x1="6" x2="6.01" y1="6" y2="6"/><line x1="6" x2="6.01" y1="18" y2="18"/></g>
<text x="78" y="436.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Sẵn sàng</text>
<text x="78" y="460.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Người được phép dùng</text>
<text x="78" y="479.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">được khi cần. Hỏng khi</text>
<text x="78" y="499.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">trang thanh toán không</text>
<text x="78" y="518.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">mở được.</text>
<rect x="8" y="560" width="304" height="424" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="588.1" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Biện pháp nào giữ điều nào</text>
<rect x="20" y="605" width="280" height="83" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="628" r="11" fill="#16a34a"/>
<polyline points="37.9,628.4 41.7,632.4 48.5,624" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="631.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Bí mật: mã hóa, phân quyền</text>
<text x="64" y="650.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">đọc, lưu mật khẩu dạng</text>
<text x="64" y="670.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">băm.</text>
<rect x="20" y="696" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="719" r="11" fill="#16a34a"/>
<polyline points="37.9,719.4 41.7,723.4 48.5,715" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="722.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Toàn vẹn: mã xác thực, chữ</text>
<text x="64" y="741.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">ký số, phân quyền ghi.</text>
<rect x="20" y="767" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="790" r="11" fill="#16a34a"/>
<polyline points="37.9,790.4 41.7,794.4 48.5,786" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="793.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Sẵn sàng: giới hạn tốc độ,</text>
<text x="64" y="812.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">thời gian chờ, dự phòng.</text>
<rect x="20" y="838" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="861" r="11" fill="#16a34a"/>
<polyline points="37.9,861.4 41.7,865.4 48.5,857" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="864.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Tường lửa: chặn lưu lượng</text>
<text x="64" y="883.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">không cần, bớt đường vào.</text>
<rect x="20" y="909" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="932" r="11" fill="#16a34a"/>
<polyline points="37.9,932.4 41.7,936.4 48.5,928" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="935.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Không biện pháp nào đủ một</text>
<text x="64" y="954.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">mình: xếp nhiều lớp.</text>
</g>
</svg>
