<svg xmlns="http://www.w3.org/2000/svg" width="320" height="1273" viewBox="0 0 320 1273" role="img" aria-labelledby="title desc">
<title id="title">Điều phối hay tự phối hợp?</title>
<desc id="desc">Ba khung. Khung một, điều phối: bộ điều phối ra lệnh trả tiền cho dịch vụ thanh toán và nhận kết quả, ra lệnh giữ hàng cho kho; kho báo thất bại thì bộ điều phối ra lệnh hoàn tiền cho thanh toán. Khung hai, tự phối hợp: dịch vụ thanh toán đăng sự kiện đã trả tiền lên kênh sự kiện, kho nhận sự kiện đó; kho đăng sự kiện giữ hàng thất bại, thanh toán nhận sự kiện này và tự hoàn tiền. Khung ba, thử mô phỏng chuỗi bốn bước: hỏng ở bước ba thì tự phối hợp tốn 6 thông điệp và điều phối tốn 10; thêm một bước kiểm tra gian lận thì tự phối hợp phải sửa 2 dịch vụ cũ, điều phối sửa 0 dịch vụ cũ.</desc>
