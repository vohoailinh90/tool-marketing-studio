<svg xmlns="http://www.w3.org/2000/svg" width="320" height="1766" viewBox="0 0 320 1766" role="img" aria-labelledby="title desc">
<title id="title">Sáu cách nhận ra người dùng</title>
<desc id="desc">Bốn khung dọc. Khung một, nhớ người đã đăng nhập: session, token ngẫu nhiên và JWT, khác nhau ở chỗ ai giữ dữ liệu. Khung hai, nhờ bên khác làm chứng: SSO và mã QR chứng minh bạn là ai, còn OAuth2 chỉ chứng minh ứng dụng được làm gì. Khung ba, trình tự đăng nhập bằng mã QR giữa trình duyệt, máy chủ và điện thoại. Khung bốn, hai điều cần nhớ về mã QR.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs>
<rect width="320" height="1766" fill="#f8fafc"/>
<g font-family="DejaVu Sans, Arial, sans-serif" fill="#0f172a">
<text x="16" y="34" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">Sáu cách nhận ra người</text>
<text x="16" y="58" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">dùng</text>
<text x="16" y="84.2" font-size="15" fill="#475569" font-weight="normal" text-anchor="start">Ai giữ trạng thái? Được chứng minh</text>
<text x="16" y="103.8" font-size="15" fill="#475569" font-weight="normal" text-anchor="start">điều gì?</text>
<rect x="8" y="123" width="304" height="406" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="151.2" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Nhớ người đã đăng nhập</text>
<rect x="20" y="168" width="280" height="107" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="50" cy="221.5" r="18" fill="#1d4ed8"/><g transform="translate(39.2 210.7) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5V19A9 3 0 0 0 21 19V5"/><path d="M3 12A9 3 0 0 0 21 12"/></g>
<text x="78" y="194.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Session</text>
<text x="78" y="218.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Máy chủ giữ dữ liệu, trình</text>
<text x="78" y="237.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">duyệt giữ mã. Chứng minh:</text>
<text x="78" y="257.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">bạn là ai.</text>
<rect x="20" y="289" width="280" height="107" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="50" cy="342.5" r="18" fill="#1d4ed8"/><g transform="translate(39.2 331.7) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.586 17.414A2 2 0 0 0 2 18.828V21a1 1 0 0 0 1 1h3a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h1a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h.172a2 2 0 0 0 1.414-.586l.814-.814a6.5 6.5 0 1 0-4-4z"/><circle cx="16.5" cy="7.5" fill="#FFFFFF" r=".5"/></g>
<text x="78" y="315.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Token ngẫu nhiên</text>
<text x="78" y="339.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Như session, máy chủ tra</text>
<text x="78" y="358.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">mã. Chứng minh: bạn là ai</text>
<text x="78" y="378.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">hoặc được làm gì.</text>
<rect x="20" y="410" width="280" height="107" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="50" cy="463.5" r="18" fill="#1d4ed8"/><g transform="translate(39.2 452.7) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 22a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.704.706l3.588 3.588A2.4 2.4 0 0 1 20 8v12a2 2 0 0 1-2 2z"/><path d="M14 2v5a1 1 0 0 0 1 1h5"/><path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/></g>
<text x="78" y="436.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">JWT</text>
<text x="78" y="460.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Dữ liệu và chữ ký nằm</text>
<text x="78" y="479.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">trong token. Chứng minh:</text>
<text x="78" y="499.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">bạn là ai hoặc được làm gì.</text>
<rect x="8" y="541" width="304" height="444" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="569.1" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Nhờ bên khác làm chứng</text>
<rect x="20" y="586" width="280" height="107" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
<circle cx="50" cy="639.5" r="18" fill="#0f766e"/><g transform="translate(39.2 628.7) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 10a2 2 0 0 0-2 2c0 1.02-.1 2.51-.26 4"/><path d="M14 13.12c0 2.38 0 6.38-1 8.88"/><path d="M17.29 21.02c.12-.6.43-2.3.5-3.02"/><path d="M2 12a10 10 0 0 1 18-6"/><path d="M2 16h.01"/><path d="M21.8 16c.2-2 .131-5.354 0-6"/><path d="M5 19.5C5.5 18 6 15 6 12a6 6 0 0 1 .34-2"/><path d="M8.65 22c.21-.66.45-1.32.57-2"/><path d="M9 6.8a6 6 0 0 1 9 5.2v2"/></g>
<text x="78" y="612.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">SSO</text>
<text x="78" y="636.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Dịch vụ đăng nhập trung</text>
<text x="78" y="655.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">tâm giữ phiên. Chứng</text>
<text x="78" y="675.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">minh: bạn là ai.</text>
<rect x="20" y="707" width="280" height="126" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
<circle cx="50" cy="770" r="18" fill="#0f766e"/><g transform="translate(39.2 759.2) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22v-5"/><path d="M15 8V2"/><path d="M17 8a1 1 0 0 1 1 1v4a4 4 0 0 1-4 4h-4a4 4 0 0 1-4-4V9a1 1 0 0 1 1-1z"/><path d="M9 8V2"/></g>
<text x="78" y="733.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">OAuth2</text>
<text x="78" y="757.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Máy chủ ủy quyền cấp</text>
<text x="78" y="776.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">access token. Chứng minh:</text>
<text x="78" y="796.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">ứng dụng được làm gì,</text>
<text x="78" y="815.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">không phải bạn là ai.</text>
<rect x="20" y="847" width="280" height="126" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
<circle cx="50" cy="910" r="18" fill="#0f766e"/><g transform="translate(39.2 899.2) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect height="20" rx="2" ry="2" width="14" x="5" y="2"/><path d="M12 18h.01"/></g>
<text x="78" y="873.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Mã QR</text>
<text x="78" y="897.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Điện thoại đã đăng nhập</text>
<text x="78" y="916.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">xác nhận một mã đang</text>
<text x="78" y="936.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">chờ. Chứng minh: bạn là</text>
<text x="78" y="955.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">ai.</text>
<rect x="8" y="997" width="304" height="518" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="1025.1" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Đăng nhập bằng mã QR</text>
<rect x="20" y="1042" width="84" height="86" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
<circle cx="62" cy="1064" r="14" fill="#b45309"/><g transform="translate(53.6 1055.6) scale(0.7)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect height="14" rx="2" width="20" x="2" y="3"/><line x1="8" x2="16" y1="21" y2="21"/><line x1="12" x2="12" y1="17" y2="21"/></g>
<text x="62" y="1095.9" font-size="15" fill="#0f172a" font-weight="bold" text-anchor="middle">Trình</text>
<text x="62" y="1114.6" font-size="15" fill="#0f172a" font-weight="bold" text-anchor="middle">duyệt</text>
<rect x="118" y="1042" width="84" height="86" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
<circle cx="160" cy="1064" r="14" fill="#b45309"/><g transform="translate(151.6 1055.6) scale(0.7)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect height="8" rx="2" ry="2" width="20" x="2" y="2"/><rect height="8" rx="2" ry="2" width="20" x="2" y="14"/><line x1="6" x2="6.01" y1="6" y2="6"/><line x1="6" x2="6.01" y1="18" y2="18"/></g>
<text x="160" y="1095.9" font-size="15" fill="#0f172a" font-weight="bold" text-anchor="middle">Máy chủ</text>
<rect x="216" y="1042" width="84" height="86" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
<circle cx="258" cy="1064" r="14" fill="#b45309"/><g transform="translate(249.6 1055.6) scale(0.7)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect height="20" rx="2" ry="2" width="14" x="5" y="2"/><path d="M12 18h.01"/></g>
<text x="258" y="1095.9" font-size="15" fill="#0f172a" font-weight="bold" text-anchor="middle">Điện</text>
<text x="258" y="1114.6" font-size="15" fill="#0f172a" font-weight="bold" text-anchor="middle">thoại</text>
<polyline points="62,1128 62,1503" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4 4"/>
<polyline points="160,1128 160,1503" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4 4"/>
<polyline points="258,1128 258,1503" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4 4"/>
<text x="111" y="1156.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="middle">Xin mã</text>
<polyline points="63,1170 157,1170" fill="none" stroke="#334155" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="111" y="1198.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="middle">Mã dùng</text>
<text x="111" y="1217.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="middle">một lần</text>
<polyline points="159,1231 65,1231" fill="none" stroke="#334155" stroke-width="1.8" stroke-dasharray="5 4" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="111" y="1259.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="middle">Hiện QR,</text>
<text x="111" y="1278.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="middle">hỏi định kỳ</text>
<polyline points="63,1292 157,1292" fill="none" stroke="#334155" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="209" y="1320.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="middle">Mã và</text>
<text x="209" y="1339.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="middle">phiên điện</text>
<text x="209" y="1359.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="middle">thoại</text>
<polyline points="257,1373 163,1373" fill="none" stroke="#334155" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="209" y="1401.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="middle">Đã xác</text>
<text x="209" y="1420.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="middle">nhận</text>
<polyline points="161,1434 255,1434" fill="none" stroke="#334155" stroke-width="1.8" stroke-dasharray="5 4" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="111" y="1462.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="middle">Lần sau:</text>
<text x="111" y="1481.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="middle">phiên mới</text>
<polyline points="159,1495 65,1495" fill="none" stroke="#334155" stroke-width="1.8" stroke-dasharray="5 4" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="8" y="1527" width="304" height="231" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="1555.1" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Hai điều cần nhớ về mã QR</text>
<rect x="20" y="1572" width="280" height="83" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="1595" r="11" fill="#16a34a"/>
<polyline points="37.9,1595.4 41.7,1599.4 48.5,1591" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="1598.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Mã một mình không đăng</text>
<text x="64" y="1617.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">nhập ai: bằng chứng là phiên</text>
<text x="64" y="1637.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">của điện thoại.</text>
<rect x="20" y="1663" width="280" height="83" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="1686" r="11" fill="#16a34a"/>
<polyline points="37.9,1686.4 41.7,1690.4 48.5,1682" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="1689.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Máy chủ không biết chủ điện</text>
<text x="64" y="1708.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">thoại có định đăng nhập</text>
<text x="64" y="1728.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">trình duyệt này không.</text>
</g>
</svg>
