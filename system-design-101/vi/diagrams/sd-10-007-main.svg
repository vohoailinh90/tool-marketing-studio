<svg xmlns="http://www.w3.org/2000/svg" width="320" height="1428" viewBox="0 0 320 1428" role="img" aria-labelledby="title desc">
<title id="title">Tám lĩnh vực hay dùng C++</title>
<desc id="desc">Bốn nhóm thẻ. Điều khiển phần cứng và hệ thống: hệ thống nhúng, hệ điều hành, mạng. Cần hiệu năng cao: game, cơ sở dữ liệu, tính toán khoa học. Hai mục còn lại: trình duyệt web và ứng dụng tài chính, mục nguồn không mô tả. Khung cuối nhắc ba điều cần nhớ.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs>
<rect width="320" height="1428" fill="#f8fafc"/>
<g font-family="DejaVu Sans, Arial, sans-serif" fill="#0f172a">
<text x="16" y="34" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">Tám lĩnh vực hay dùng</text>
<text x="16" y="58" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">C++</text>
<text x="16" y="84.2" font-size="15" fill="#475569" font-weight="normal" text-anchor="start">Xếp theo lý do nguồn nêu cho từng</text>
<text x="16" y="103.8" font-size="15" fill="#475569" font-weight="normal" text-anchor="start">nơi.</text>
<rect x="8" y="123" width="304" height="368" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="151.2" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Điều khiển phần cứng và hệ</text>
<text x="20" y="173.2" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">thống</text>
<rect x="20" y="190" width="280" height="87" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="50" cy="233.5" r="18" fill="#1d4ed8"/><g transform="translate(39.2 222.7) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20v2"/><path d="M12 2v2"/><path d="M17 20v2"/><path d="M17 2v2"/><path d="M2 12h2"/><path d="M2 17h2"/><path d="M2 7h2"/><path d="M20 12h2"/><path d="M20 17h2"/><path d="M20 7h2"/><path d="M7 20v2"/><path d="M7 2v2"/><rect height="16" rx="2" width="16" x="4" y="4"/><rect height="8" rx="1" width="8" x="8" y="8"/></g>
<text x="78" y="216.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Hệ thống nhúng</text>
<text x="78" y="240.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Hiệu quả và điều khiển chi</text>
<text x="78" y="259.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">tiết tài nguyên phần cứng.</text>
<rect x="20" y="291" width="280" height="87" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="50" cy="334.5" r="18" fill="#1d4ed8"/><g transform="translate(39.2 323.7) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19h8"/><path d="m4 17 6-6-6-6"/></g>
<text x="78" y="317.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Hệ điều hành</text>
<text x="78" y="341.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Kiểm soát rộng tài nguyên</text>
<text x="78" y="360.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">hệ thống và bộ nhớ.</text>
<rect x="20" y="392" width="280" height="87" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="50" cy="435.5" r="18" fill="#1d4ed8"/><g transform="translate(39.2 424.7) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect height="6" rx="1" width="6" x="16" y="16"/><rect height="6" rx="1" width="6" x="2" y="16"/><rect height="6" rx="1" width="6" x="9" y="2"/><path d="M5 16v-3a1 1 0 0 1 1-1h12a1 1 0 0 1 1 1v3"/><path d="M12 12V8"/></g>
<text x="78" y="418.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Mạng</text>
<text x="78" y="442.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Thiết bị mạng và công cụ</text>
<text x="78" y="461.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">mô phỏng.</text>
<rect x="8" y="503" width="304" height="366" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="531.1" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Cần hiệu năng cao</text>
<rect x="20" y="548" width="280" height="87" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
<circle cx="50" cy="591.5" r="18" fill="#0f766e"/><g transform="translate(39.2 580.7) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15.914 4a1.5 1.5 0 00-2.474-1.561l-9 9A1.5 1.5 0 005.5 14h4.002a.5.5 0 01.471.666L8.086 20a1.5 1.5 0 002.475 1.56l9-9A1.5 1.5 0 0018.5 10h-3.997a.5.5 0 01-.472-.667z"/></g>
<text x="78" y="574.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Game</text>
<text x="78" y="598.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Nền tảng của ngành game</text>
<text x="78" y="617.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">nhờ hiệu năng và hiệu quả.</text>
<rect x="20" y="649" width="280" height="87" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
<circle cx="50" cy="692.5" r="18" fill="#0f766e"/><g transform="translate(39.2 681.7) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5V19A9 3 0 0 0 21 19V5"/><path d="M3 12A9 3 0 0 0 21 12"/></g>
<text x="78" y="675.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Cơ sở dữ liệu</text>
<text x="78" y="699.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Quản lý bộ nhớ hiệu quả</text>
<text x="78" y="718.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">để truy vấn nhanh.</text>
<rect x="20" y="750" width="280" height="107" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
<circle cx="50" cy="803.5" r="18" fill="#0f766e"/><g transform="translate(39.2 792.7) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v16a2 2 0 0 0 2 2h16"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/></g>
<text x="78" y="776.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Tính toán khoa học</text>
<text x="78" y="800.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Hiệu năng cao và điều</text>
<text x="78" y="819.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">khiển chính xác tài</text>
<text x="78" y="839.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">nguyên.</text>
<rect x="8" y="881" width="304" height="265" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="909.1" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Hai mục còn lại</text>
<rect x="20" y="926" width="280" height="107" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
<circle cx="50" cy="979.5" r="18" fill="#b45309"/><g transform="translate(39.2 968.7) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></g>
<text x="78" y="952.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Trình duyệt web</text>
<text x="78" y="976.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Dùng cho trình duyệt và</text>
<text x="78" y="995.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">thành phần như bộ máy</text>
<text x="78" y="1015.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">dựng trang.</text>
<rect x="20" y="1047" width="280" height="87" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
<circle cx="50" cy="1090.5" r="18" fill="#b45309"/><g transform="translate(39.2 1079.7) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect height="14" rx="2" width="20" x="2" y="5"/><line x1="2" x2="22" y1="10" y2="10"/><path d="M6 14h2"/></g>
<text x="78" y="1073.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Ứng dụng tài chính</text>
<text x="78" y="1097.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Nguồn nêu tên mục này</text>
<text x="78" y="1116.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">nhưng không mô tả.</text>
<rect x="8" y="1158" width="304" height="262" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="1186.1" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Nhớ gì</text>
<rect x="20" y="1203" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="1226" r="11" fill="#16a34a"/>
<polyline points="37.9,1226.4 41.7,1230.4 48.5,1222" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="1229.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Cách chia nhóm là của bài,</text>
<text x="64" y="1248.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">không phải của nguồn.</text>
<rect x="20" y="1274" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="1297" r="11" fill="#16a34a"/>
<polyline points="37.9,1297.4 41.7,1301.4 48.5,1293" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="1300.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Nguồn không so sánh C++</text>
<text x="64" y="1319.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">với ngôn ngữ khác.</text>
<rect x="20" y="1345" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="1368" r="11" fill="#16a34a"/>
<polyline points="37.9,1368.4 41.7,1372.4 48.5,1364" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="1371.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Mục tài chính nguồn để</text>
<text x="64" y="1390.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">trống.</text>
</g>
</svg>
