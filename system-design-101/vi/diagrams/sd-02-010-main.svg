<svg xmlns="http://www.w3.org/2000/svg" width="320" height="932" viewBox="0 0 320 932" role="img" aria-labelledby="title desc">
<title id="title">Twitter 1.0 dùng những gì?</title>
<desc id="desc">Hai khung thẻ. Khung một, phía người dùng: di động gồm Swift, Kotlin và ứng dụng web tiến bộ; web gồm JavaScript, React và Redux. Khung hai, phía máy chủ: dịch vụ chạy trên Mesos và Finagle; bộ đệm là Pelikan Cache và Redis; cơ sở dữ liệu là Manhattan, MySQL và PostgreSQL. Khung ba nêu ba điều cần nhớ.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs>
<rect width="320" height="932" fill="#f8fafc"/>
<g font-family="DejaVu Sans, Arial, sans-serif" fill="#0f172a">
<text x="16" y="34" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">Twitter 1.0 dùng những</text>
<text x="16" y="58" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">gì?</text>
<text x="16" y="84.2" font-size="15" fill="#475569" font-weight="normal" text-anchor="start">Năm tầng, mười ba cái tên.</text>
<rect x="8" y="104" width="304" height="226" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="132.2" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Phía người dùng</text>
<rect x="20" y="149" width="280" height="87" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="50" cy="192.5" r="18" fill="#1d4ed8"/><g transform="translate(39.2 181.7) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect height="20" rx="2" ry="2" width="14" x="5" y="2"/><path d="M12 18h.01"/></g>
<text x="78" y="175.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Di động</text>
<text x="78" y="199.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Swift, Kotlin, ứng dụng</text>
<text x="78" y="218.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">web tiến bộ.</text>
<rect x="20" y="250" width="280" height="68" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="50" cy="284" r="18" fill="#1d4ed8"/><g transform="translate(39.2 273.2) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></g>
<text x="78" y="276.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Web</text>
<text x="78" y="300.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">JavaScript, React, Redux.</text>
<rect x="8" y="342" width="304" height="308" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="370.2" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Phía máy chủ</text>
<rect x="20" y="387" width="280" height="68" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
<circle cx="50" cy="421" r="18" fill="#0f766e"/><g transform="translate(39.2 410.2) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect height="8" rx="2" ry="2" width="20" x="2" y="2"/><rect height="8" rx="2" ry="2" width="20" x="2" y="14"/><line x1="6" x2="6.01" y1="6" y2="6"/><line x1="6" x2="6.01" y1="18" y2="18"/></g>
<text x="78" y="413.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Dịch vụ</text>
<text x="78" y="437.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Mesos, Finagle.</text>
<rect x="20" y="469" width="280" height="68" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
<circle cx="50" cy="503" r="18" fill="#0f766e"/><g transform="translate(39.2 492.2) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15.914 4a1.5 1.5 0 00-2.474-1.561l-9 9A1.5 1.5 0 005.5 14h4.002a.5.5 0 01.471.666L8.086 20a1.5 1.5 0 002.475 1.56l9-9A1.5 1.5 0 0018.5 10h-3.997a.5.5 0 01-.472-.667z"/></g>
<text x="78" y="495.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Bộ đệm</text>
<text x="78" y="519.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Pelikan Cache, Redis.</text>
<rect x="20" y="551" width="280" height="87" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
<circle cx="50" cy="594.5" r="18" fill="#0f766e"/><g transform="translate(39.2 583.7) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5V19A9 3 0 0 0 21 19V5"/><path d="M3 12A9 3 0 0 0 21 12"/></g>
<text x="78" y="577.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Cơ sở dữ liệu</text>
<text x="78" y="601.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Manhattan, MySQL,</text>
<text x="78" y="620.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">PostgreSQL.</text>
<rect x="8" y="662" width="304" height="262" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="690.1" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Nhớ gì</text>
<rect x="20" y="707" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="730" r="11" fill="#16a34a"/>
<polyline points="37.9,730.4 41.7,734.4 48.5,726" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="733.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Một stack là danh sách công</text>
<text x="64" y="752.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">cụ xếp theo tầng.</text>
<rect x="20" y="778" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="801" r="11" fill="#16a34a"/>
<polyline points="37.9,801.4 41.7,805.4 48.5,797" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="804.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Một tầng thường có nhiều</text>
<text x="64" y="823.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">hơn một công cụ.</text>
<rect x="20" y="849" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="872" r="11" fill="#16a34a"/>
<polyline points="37.9,872.4 41.7,876.4 48.5,868" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="875.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Danh sách cho biết có gì,</text>
<text x="64" y="894.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">không cho biết nối ra sao.</text>
</g>
</svg>
