<svg xmlns="http://www.w3.org/2000/svg" width="360" height="420" viewBox="0 0 360 420" role="img" aria-labelledby="title desc">
<title id="title">Tám mẫu hạn chế sự cố lan rộng</title>
<desc id="desc">Giới hạn chờ: Timeout • retry có ngân sách: Circuit breaker; Giới hạn tài nguyên: Rate limit • load shedding: Bulkhead • backpressure; Phục hồi có kiểm soát: Supervisor khởi động lại: Giữ trạng thái nghiệp vụ bền. Các khung là ý chính để đối chiếu, không nhất thiết là các bước tuần tự.</desc>
<rect width="360" height="420" fill="#f8fafc"/>
<g font-family="DejaVu Sans, sans-serif" fill="#0f172a">
<text x="20" y="28" font-size="18" font-weight="bold">sd-11-014 · Nhìn hình trước</text>
<rect x="12" y="48" width="336" height="102" rx="12" fill="#e0f2fe" stroke="#64748b"/>
<text x="24" y="75" font-size="18" font-weight="bold">Giới hạn chờ</text>
<text x="24" y="104" font-size="18">Timeout • retry có ngân sách</text>
<text x="24" y="130" font-size="18">Circuit breaker</text>
<rect x="12" y="162" width="336" height="102" rx="12" fill="#dcfce7" stroke="#64748b"/>
<text x="24" y="189" font-size="18" font-weight="bold">Giới hạn tài nguyên</text>
<text x="24" y="218" font-size="18">Rate limit • load shedding</text>
<text x="24" y="244" font-size="18">Bulkhead • backpressure</text>
<rect x="12" y="276" width="336" height="102" rx="12" fill="#fef3c7" stroke="#64748b"/>
<text x="24" y="303" font-size="18" font-weight="bold">Phục hồi có kiểm soát</text>
<text x="24" y="332" font-size="18">Supervisor khởi động lại</text>
<text x="24" y="358" font-size="18">Giữ trạng thái nghiệp vụ bền</text>
</g>
</svg>
