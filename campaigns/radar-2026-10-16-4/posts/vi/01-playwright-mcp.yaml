      Bài hướng dẫn từng bước đi kèm chỉ cách khai báo máy chủ, chọn hồ sơ trình duyệt và bật thêm nhóm
      công cụ.

      Lưu ý: README nói đây không phải ranh giới bảo mật.


      Nội dung do AI tóm tắt từ README và cấu trúc repo; hãy đọc repo gốc trước khi dùng.'
