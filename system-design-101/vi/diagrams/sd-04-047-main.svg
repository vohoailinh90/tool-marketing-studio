<svg xmlns="http://www.w3.org/2000/svg" width="320" height="1396" viewBox="0 0 320 1396" role="img" aria-labelledby="title desc">
<title id="title">Bảy cách mở rộng cơ sở dữ liệu, rẻ trước đắt sau</title>
<desc id="desc">Khung một và hai, bảy cách xếp từ rẻ tới đắt: trên cùng một máy có chỉ mục theo đúng câu hỏi hay chạy, materialized view tính sẵn kết quả nặng, phi chuẩn hóa để bớt phép nối, bộ đệm đặt dữ liệu hay đọc ở tầng nhanh hơn; đắt hơn là máy to hơn, bản sao để chia lượt đọc, shard để chia cả lượt ghi. Khung ba, materialized view trên 2 triệu dòng: tính trực tiếp 102 đến 107 mili giây, đọc view dưới 1,3 mili giây; sau một đơn mới view vẫn nói số cũ cho tới khi làm mới, mất 98 đến 125 mili giây. Khung bốn, bộ đệm Redis hạn 2 giây: lần đầu hỏi cơ sở dữ liệu 40 đến 54 mili giây, lần hai dưới 0,3 mili giây; ngay sau đơn mới bộ đệm vẫn trả số cũ, hết hạn mới đúng.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs>
<rect width="320" height="1396" fill="#f8fafc"/>
<g font-family="DejaVu Sans, Arial, sans-serif" fill="#0f172a">
<text x="16" y="34" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">Bảy cách mở rộng cơ sở</text>
<text x="16" y="58" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">dữ liệu, rẻ trước đắt sau</text>
<rect x="8" y="78" width="304" height="452" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="106.2" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Rẻ: trên cùng một máy</text>
<rect x="20" y="123" width="280" height="87" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="46" cy="149" r="14" fill="#1d4ed8"/>
<text x="46" y="154.5" font-size="16" fill="#ffffff" font-weight="bold" text-anchor="middle">1</text>
<text x="70" y="149.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Chỉ mục</text>
<text x="70" y="173.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Theo đúng câu hỏi hay</text>
<text x="70" y="192.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">chạy.</text>
<rect x="20" y="232" width="280" height="68" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="46" cy="258" r="14" fill="#1d4ed8"/>
<text x="46" y="263.5" font-size="16" fill="#ffffff" font-weight="bold" text-anchor="middle">2</text>
<text x="70" y="258.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Materialized view</text>
<text x="70" y="282.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Tính sẵn kết quả nặng.</text>
<polyline points="46,212 46,230" fill="none" stroke="#334155" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="20" y="322" width="280" height="87" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="46" cy="348" r="14" fill="#1d4ed8"/>
<text x="46" y="353.5" font-size="16" fill="#ffffff" font-weight="bold" text-anchor="middle">3</text>
<text x="70" y="348.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Phi chuẩn hóa</text>
<text x="70" y="372.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Lưu lặp một ít để bớt phép</text>
<text x="70" y="391.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">nối.</text>
<polyline points="46,302 46,320" fill="none" stroke="#334155" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="20" y="431" width="280" height="87" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="46" cy="457" r="14" fill="#1d4ed8"/>
<text x="46" y="462.5" font-size="16" fill="#ffffff" font-weight="bold" text-anchor="middle">4</text>
<text x="70" y="457.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Bộ đệm</text>
<text x="70" y="481.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Đặt dữ liệu hay đọc ở tầng</text>
<text x="70" y="500.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">nhanh hơn.</text>
<polyline points="46,411 46,429" fill="none" stroke="#334155" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="8" y="542" width="304" height="327" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="570.1" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Đắt hơn: thêm sức hoặc</text>
<text x="20" y="592.2" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">thêm máy</text>
<rect x="20" y="609" width="280" height="68" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
<circle cx="46" cy="635" r="14" fill="#0f766e"/>
<text x="46" y="640.5" font-size="16" fill="#ffffff" font-weight="bold" text-anchor="middle">1</text>
<text x="70" y="635.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Máy to hơn</text>
<text x="70" y="659.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Thêm CPU, bộ nhớ, đĩa.</text>
<rect x="20" y="699" width="280" height="68" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
<circle cx="46" cy="725" r="14" fill="#0f766e"/>
<text x="46" y="730.5" font-size="16" fill="#ffffff" font-weight="bold" text-anchor="middle">2</text>
<text x="70" y="725.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Bản sao</text>
<text x="70" y="749.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Chia lượt đọc.</text>
<polyline points="46,679 46,697" fill="none" stroke="#334155" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="20" y="789" width="280" height="68" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
<circle cx="46" cy="815" r="14" fill="#0f766e"/>
<text x="46" y="820.5" font-size="16" fill="#ffffff" font-weight="bold" text-anchor="middle">3</text>
<text x="70" y="815.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Shard</text>
<text x="70" y="839.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Chia cả lượt ghi.</text>
<polyline points="46,769 46,787" fill="none" stroke="#334155" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="8" y="881" width="304" height="284" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="909.1" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Materialized view, 2 triệu</text>
<text x="20" y="931.2" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">dòng</text>
<rect x="20" y="948" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="971" r="11" fill="#16a34a"/>
<polyline points="37.9,971.4 41.7,975.4 48.5,967" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="974.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Tính trực tiếp: 102 đến 107</text>
<text x="64" y="993.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">ms. Đọc view: dưới 1,3 ms.</text>
<rect x="20" y="1019" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="1042" r="11" fill="#16a34a"/>
<polyline points="37.9,1042.4 41.7,1046.4 48.5,1038" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="1045.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Sau một đơn mới: view vẫn</text>
<text x="64" y="1064.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">nói số cũ.</text>
<rect x="20" y="1090" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="1113" r="11" fill="#16a34a"/>
<polyline points="37.9,1113.4 41.7,1117.4 48.5,1109" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="1116.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Làm mới view: 98 đến 125</text>
<text x="64" y="1135.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">ms.</text>
<rect x="8" y="1177" width="304" height="211" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="1205.1" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Bộ đệm Redis, hạn 2 giây</text>
<rect x="20" y="1222" width="280" height="83" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="1245" r="11" fill="#16a34a"/>
<polyline points="37.9,1245.4 41.7,1249.4 48.5,1241" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="1248.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Lần đầu hỏi cơ sở dữ liệu: 40</text>
<text x="64" y="1267.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">đến 54 ms. Lần hai: dưới 0,3</text>
<text x="64" y="1287.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">ms.</text>
<rect x="20" y="1313" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="1336" r="11" fill="#16a34a"/>
<polyline points="37.9,1336.4 41.7,1340.4 48.5,1332" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="1339.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Ngay sau đơn mới: vẫn số</text>
<text x="64" y="1358.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">cũ. Hết hạn mới đúng.</text>
</g>
</svg>
