<svg xmlns="http://www.w3.org/2000/svg" width="320" height="1593" viewBox="0 0 320 1593" role="img" aria-labelledby="title desc">
<title id="title">Tin nhắn SWIFT đi từ New York tới London</title>
<desc id="desc">Ba khung nối nhau, mỗi khung một lược đồ. Khung một, phía ngân hàng gửi: Bank A gửi tin tới Regional Processor A, nơi kiểm tra định dạng rồi chuyển cho Slice Processor A lưu, sau đó Bank A nhận ACK hoặc NAK. Khung hai, sang London: Slice Processor A chuyển tin cho Regional Processor B, nơi gán số MON; Slice Processor B kiểm tra MON và cho phép gửi. Khung ba, phía ngân hàng nhận: Regional Processor B gửi tin cho Bank B, Bank B trả UAK hoặc UNK, báo cáo được lưu và một bản sao về lại Slice Processor A.</desc>
