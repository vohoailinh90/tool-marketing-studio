<svg xmlns="http://www.w3.org/2000/svg" width="320" height="1328" viewBox="0 0 320 1328" role="img" aria-labelledby="title desc">
<title id="title">Cơ sở dữ liệu chuỗi thời gian nhìn từ bên trong</title>
<desc id="desc">Ba khung. Khung một là bốn phần của một điểm dữ liệu: measurement weather; tag location, được đánh chỉ mục; field temperature và humidity, không được đánh chỉ mục; và thời điểm. Khung hai là ba bước từ điểm thành series: ghép measurement, tag set và tên field thành khóa series; hai địa điểm nhân hai field ra 4 series cho 17.280 điểm một ngày; mỗi series là một chuỗi cặp thời điểm và giá trị, lưu nén theo cột trong tệp TSM. Khung ba là số đo bằng zlib: dạng dòng văn bản nén còn 70.217 byte; theo series, lưu hiệu số giữa các giá trị liền nhau, nén còn 14.064 byte; nếu đưa mã đo duy nhất vào tag thì một ngày có 34.560 series.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs>
<rect width="320" height="1328" fill="#f8fafc"/>
<g font-family="DejaVu Sans, Arial, sans-serif" fill="#0f172a">
<text x="16" y="34" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">Cơ sở dữ liệu chuỗi thời</text>
<text x="16" y="58" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">gian nhìn từ bên trong</text>
<text x="16" y="84.2" font-size="15" fill="#475569" font-weight="normal" text-anchor="start">Theo mô hình dữ liệu của InfluxDB;</text>
<text x="16" y="103.8" font-size="15" fill="#475569" font-weight="normal" text-anchor="start">số liệu từ một ngày đo thời tiết giả</text>
<text x="16" y="123.2" font-size="15" fill="#475569" font-weight="normal" text-anchor="start">lập.</text>
<rect x="8" y="143" width="304" height="447" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="171.2" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Bốn phần của một điểm</text>
<rect x="20" y="188" width="280" height="87" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="50" cy="231.5" r="18" fill="#1d4ed8"/><g transform="translate(39.2 220.7) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></g>
<text x="78" y="214.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Measurement</text>
<text x="78" y="238.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">weather: tên nhóm dữ liệu,</text>
<text x="78" y="257.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">như tên bảng.</text>
<rect x="20" y="289" width="280" height="87" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="50" cy="332.5" r="18" fill="#1d4ed8"/><g transform="translate(39.2 321.7) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21 21-4.34-4.34"/><circle cx="11" cy="11" r="8"/></g>
<text x="78" y="315.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Tag</text>
<text x="78" y="339.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">location: chuỗi mô tả</text>
<text x="78" y="358.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">nguồn đo, có chỉ mục.</text>
<rect x="20" y="390" width="280" height="87" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="50" cy="433.5" r="18" fill="#1d4ed8"/><g transform="translate(39.2 422.7) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v16a2 2 0 0 0 2 2h16"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/></g>
<text x="78" y="416.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Field</text>
<text x="78" y="440.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">temperature, humidity: giá</text>
<text x="78" y="459.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">trị đo, không có chỉ mục.</text>
<rect x="20" y="491" width="280" height="87" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="50" cy="534.5" r="18" fill="#1d4ed8"/><g transform="translate(39.2 523.7) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></g>
<text x="78" y="517.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Thời điểm</text>
<text x="78" y="541.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Cùng với series, xác định</text>
<text x="78" y="560.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">đúng một điểm.</text>
<rect x="8" y="602" width="304" height="422" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="630.1" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Từ điểm thành series</text>
<rect x="20" y="647" width="280" height="107" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
<circle cx="46" cy="673" r="14" fill="#0f766e"/>
<text x="46" y="678.5" font-size="16" fill="#ffffff" font-weight="bold" text-anchor="middle">1</text>
<text x="70" y="673.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Ghép khóa series</text>
<text x="70" y="697.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Measurement, tag set và</text>
<text x="70" y="716.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">tên field: weather, hanoi,</text>
<text x="70" y="736.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">temperature.</text>
<rect x="20" y="776" width="280" height="107" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
<circle cx="46" cy="802" r="14" fill="#0f766e"/>
<text x="46" y="807.5" font-size="16" fill="#ffffff" font-weight="bold" text-anchor="middle">2</text>
<text x="70" y="802.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Đếm series</text>
<text x="70" y="826.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">2 địa điểm nhân 2 field: 4</text>
<text x="70" y="845.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">series cho 17.280 điểm một</text>
<text x="70" y="865.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">ngày.</text>
<polyline points="46,756 46,774" fill="none" stroke="#334155" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="20" y="905" width="280" height="107" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
<circle cx="46" cy="931" r="14" fill="#0f766e"/>
<text x="46" y="936.5" font-size="16" fill="#ffffff" font-weight="bold" text-anchor="middle">3</text>
<text x="70" y="931.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Lưu theo cột</text>
<text x="70" y="955.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Mỗi series là chuỗi thời</text>
<text x="70" y="974.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">điểm và giá trị, nén trong</text>
<text x="70" y="994.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">tệp TSM.</text>
<polyline points="46,885 46,903" fill="none" stroke="#334155" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="8" y="1036" width="304" height="284" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="1064.1" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Đo bằng zlib, một ngày dữ</text>
<text x="20" y="1086.2" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">liệu</text>
<rect x="20" y="1103" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="1126" r="11" fill="#16a34a"/>
<polyline points="37.9,1126.4 41.7,1130.4 48.5,1122" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="1129.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Dạng dòng văn bản, nén:</text>
<text x="64" y="1148.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">70.217 byte.</text>
<rect x="20" y="1174" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="1197" r="11" fill="#16a34a"/>
<polyline points="37.9,1197.4 41.7,1201.4 48.5,1193" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="1200.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Theo series, lưu hiệu số liền</text>
<text x="64" y="1219.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">nhau, nén: 14.064 byte.</text>
<rect x="20" y="1245" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="1268" r="11" fill="#16a34a"/>
<polyline points="37.9,1268.4 41.7,1272.4 48.5,1264" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="1271.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Đưa mã đo duy nhất vào</text>
<text x="64" y="1290.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">tag: 34.560 series một ngày.</text>
</g>
</svg>
