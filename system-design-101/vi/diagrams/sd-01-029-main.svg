<rect x="12" y="395" width="296" height="150" rx="12" fill="#fef3c7"/><text x="22" y="424" font-weight="bold">Ứng dụng → cùng dịch vụ</text>
<text x="22" y="462">Tự tạo yêu cầu → API</text>
<text x="22" y="494">hoặc dùng thư viện SDK → API</text>
