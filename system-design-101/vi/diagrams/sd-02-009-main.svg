<svg xmlns="http://www.w3.org/2000/svg" width="320" height="1234" viewBox="0 0 320 1234" role="img" aria-labelledby="title desc">
<title id="title">Stack Overflow: tưởng thế này, thật ra thế kia</title>
<desc id="desc">Hai khung thẻ. Khung một, điều thường được chờ trong buổi phỏng vấn: tách thành nhiều microservice; mỗi dịch vụ một cơ sở dữ liệu riêng và dùng bộ đệm nhiều; chia dữ liệu thành nhiều mảnh; các dịch vụ nói chuyện bất đồng bộ qua hàng đợi tin nhắn. Khung hai, theo bài nguồn: chín máy chủ web phục vụ toàn bộ lưu lượng; một ứng dụng khối nguyên; máy chủ riêng đặt tại chỗ, không chạy trên đám mây. Khung ba nêu ba điều cần nhớ.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs>
<rect width="320" height="1234" fill="#f8fafc"/>
<g font-family="DejaVu Sans, Arial, sans-serif" fill="#0f172a">
<text x="16" y="34" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">Stack Overflow: tưởng</text>
<text x="16" y="58" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">thế này, thật ra thế kia</text>
<text x="16" y="84.2" font-size="15" fill="#475569" font-weight="normal" text-anchor="start">Câu trả lời phỏng vấn và hệ thống</text>
<text x="16" y="103.8" font-size="15" fill="#475569" font-weight="normal" text-anchor="start">thật theo bài nguồn.</text>
<rect x="8" y="123" width="304" height="450" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="151.2" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Điều thường được chờ khi</text>
<text x="20" y="173.2" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">phỏng vấn</text>
<rect x="20" y="190" width="280" height="87" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="50" cy="233.5" r="18" fill="#1d4ed8"/><g transform="translate(39.2 222.7) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.97 12.92A2 2 0 0 0 2 14.63v3.24a2 2 0 0 0 .97 1.71l3 1.8a2 2 0 0 0 2.06 0L12 19v-5.5l-5-3-4.03 2.42Z"/><path d="m7 16.5-4.74-2.85"/><path d="m7 16.5 5-3"/><path d="M7 16.5v5.17"/><path d="M12 13.5V19l3.97 2.38a2 2 0 0 0 2.06 0l3-1.8a2 2 0 0 0 .97-1.71v-3.24a2 2 0 0 0-.97-1.71L17 10.5l-5 3Z"/><path d="m17 16.5-5-3"/><path d="m17 16.5 4.74-2.85"/><path d="M17 16.5v5.17"/><path d="M7.97 4.42A2 2 0 0 0 7 6.13v4.37l5 3 5-3V6.13a2 2 0 0 0-.97-1.71l-3-1.8a2 2 0 0 0-2.06 0l-3 1.8Z"/><path d="M12 8 7.26 5.15"/><path d="m12 8 4.74-2.85"/><path d="M12 13.5V8"/></g>
<text x="78" y="216.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Nhiều microservice</text>
<text x="78" y="240.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Tách hệ thống thành nhiều</text>
<text x="78" y="259.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">phần nhỏ.</text>
<rect x="20" y="291" width="280" height="87" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="50" cy="334.5" r="18" fill="#1d4ed8"/><g transform="translate(39.2 323.7) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5V19A9 3 0 0 0 21 19V5"/><path d="M3 12A9 3 0 0 0 21 12"/></g>
<text x="78" y="317.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Cơ sở dữ liệu riêng</text>
<text x="78" y="341.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Mỗi dịch vụ một cái, dùng</text>
<text x="78" y="360.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">bộ đệm nhiều.</text>
<rect x="20" y="392" width="280" height="68" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="50" cy="426" r="18" fill="#1d4ed8"/><g transform="translate(39.2 415.2) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5"/><path d="M8 3H3v5"/><path d="M12 22v-8.3a4 4 0 0 0-1.172-2.872L3 3"/><path d="m15 9 6-6"/></g>
<text x="78" y="418.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Chia mảnh</text>
<text x="78" y="442.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Dữ liệu chia ra nhiều máy.</text>
<rect x="20" y="474" width="280" height="87" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="50" cy="517.5" r="18" fill="#1d4ed8"/><g transform="translate(39.2 506.7) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></g>
<text x="78" y="500.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Hàng đợi tin nhắn</text>
<text x="78" y="524.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Dịch vụ nói chuyện bất</text>
<text x="78" y="543.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">đồng bộ.</text>
<rect x="8" y="585" width="304" height="327" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="613.1" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Thật ra, theo bài nguồn</text>
<rect x="20" y="630" width="280" height="68" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
<circle cx="50" cy="664" r="18" fill="#0f766e"/><g transform="translate(39.2 653.2) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect height="8" rx="2" ry="2" width="20" x="2" y="2"/><rect height="8" rx="2" ry="2" width="20" x="2" y="14"/><line x1="6" x2="6.01" y1="6" y2="6"/><line x1="6" x2="6.01" y1="18" y2="18"/></g>
<text x="78" y="656.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">9 máy chủ web</text>
<text x="78" y="680.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Phục vụ toàn bộ lưu lượng.</text>
<rect x="20" y="712" width="280" height="87" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
<circle cx="50" cy="755.5" r="18" fill="#0f766e"/><g transform="translate(39.2 744.7) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></g>
<text x="78" y="738.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Một khối nguyên</text>
<text x="78" y="762.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Một ứng dụng, không tách</text>
<text x="78" y="781.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">dịch vụ.</text>
<rect x="20" y="813" width="280" height="87" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
<circle cx="50" cy="856.5" r="18" fill="#0f766e"/><g transform="translate(39.2 845.7) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 16h.01"/><path d="M2.212 11.577a2 2 0 0 0-.212.896V18a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-5.527a2 2 0 0 0-.212-.896L18.55 5.11A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/><path d="M21.946 12.013H2.054"/><path d="M6 16h.01"/></g>
<text x="78" y="839.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Máy chủ tại chỗ</text>
<text x="78" y="863.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Máy riêng, không chạy</text>
<text x="78" y="882.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">trên đám mây.</text>
<rect x="8" y="924" width="304" height="302" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="952.1" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Nhớ gì</text>
<rect x="20" y="969" width="280" height="83" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="992" r="11" fill="#16a34a"/>
<polyline points="37.9,992.4 41.7,996.4 48.5,988" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="995.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Chọn thiết kế theo nhu cầu,</text>
<text x="64" y="1014.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">không theo danh sách kỹ</text>
<text x="64" y="1034.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">thuật.</text>
<rect x="20" y="1060" width="280" height="83" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="1083" r="11" fill="#16a34a"/>
<polyline points="37.9,1083.4 41.7,1087.4 48.5,1079" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="1086.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Chín máy chủ web không có</text>
<text x="64" y="1105.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">nghĩa cả hệ thống chỉ chín</text>
<text x="64" y="1125.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">máy.</text>
<rect x="20" y="1151" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="1174" r="11" fill="#16a34a"/>
<polyline points="37.9,1174.4 41.7,1178.4 48.5,1170" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="1177.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Bài nguồn không nêu năm</text>
<text x="64" y="1196.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">và mức tải.</text>
</g>
</svg>
