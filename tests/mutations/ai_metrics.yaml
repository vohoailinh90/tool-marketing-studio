# Mutation manifest — see scripts/mutation_check.py
target: mkt/ai.py
note: AI output is always a draft; insight quotes must be real.
mutations:
- label: the AI can mark its own post ready
  find: '    clean["status"] = "draft"'
  replace: '    clean["status"] = data.get("status", "draft")'
  test: tests.test_ai.DraftTests.test_draft_forces_draft_and_drops_what_was_not_asked
- label: invented quotes are kept
  find: '            if len(text) >= MIN_QUOTE and any(text in comment for comment in corpus):'
  replace: '            if True:'
  test: tests.test_ai.InsightTests.test_quotes_must_come_from_the_comments
- label: a quote too short to prove anything is kept
  find: '            if len(text) >= MIN_QUOTE and any(text in comment for comment in corpus):'
  replace: '            if any(text in comment for comment in corpus):'
  test: tests.test_review_fixes.InsightRobustnessTests.test_short_quotes_and_bad_counts_are_cleaned
- label: a post points at the first link of the campaign, not at the link named like it
  find: '    if slot in links:'
  replace: '    if False:'
  test: tests.test_ai.DraftTests.test_a_post_points_at_the_link_named_like_it_not_at_the_first_link
