<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 684" width="320" height="684" role="img" aria-labelledby="title desc">
<title id="title">Chiến lược triển khai trên Kubernetes</title>
<desc id="desc">Bốn thẻ: RollingUpdate mặc định, Recreate khi hai phiên bản không chạy chung được, chia traffic theo phần trăm cần Ingress hay service mesh, thử với traffic thật cần mirror.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#475569" stroke-width="1.5"/></marker></defs>
<rect width="320" height="684" fill="#f8fafc"/><g font-family="DejaVu Sans, Arial, sans-serif" fill="#0f172a">
<text x="16" y="30" font-size="20" font-weight="bold">KHI ĐỔI IMAGE</text>
<text x="16" y="58" font-size="16" font-weight="normal">Sẵn có và cần thêm</text>
<rect x="16" y="89" width="288" height="155" rx="10" fill="#dcfce7" stroke="#94a3b8"/>
<text x="30" y="117" font-size="16" font-weight="bold">Mặc định:</text>
<text x="30" y="144" font-size="16" font-weight="bold">RollingUpdate</text>
<text x="30" y="171" font-size="16" font-weight="normal">Thay dần Pod</text>
<text x="30" y="198" font-size="16" font-weight="normal">Điều chỉnh bằng maxSurge,</text>
<text x="30" y="225" font-size="16" font-weight="normal">maxUnavailable</text>
<rect x="16" y="256" width="288" height="155" rx="10" fill="#fee2e2" stroke="#94a3b8"/>
<text x="30" y="284" font-size="16" font-weight="bold">Hai bản không chạy</text>
<text x="30" y="311" font-size="16" font-weight="bold">chung được</text>
<text x="30" y="338" font-size="16" font-weight="normal">Recreate: dừng hết rồi chạy</text>
<text x="30" y="365" font-size="16" font-weight="normal">bản mới</text>
<text x="30" y="392" font-size="16" font-weight="normal">Có khoảng ngừng dịch vụ</text>
<rect x="16" y="423" width="288" height="128" rx="10" fill="#fef3c7" stroke="#94a3b8"/>
<text x="30" y="451" font-size="16" font-weight="bold">Muốn chia traffic theo</text>
<text x="30" y="478" font-size="16" font-weight="bold">%</text>
<text x="30" y="505" font-size="16" font-weight="normal">Cần Ingress, service mesh</text>
<text x="30" y="532" font-size="16" font-weight="normal">hoặc Argo Rollouts, Flagger</text>
<rect x="16" y="563" width="288" height="101" rx="10" fill="#ede9fe" stroke="#94a3b8"/>
<text x="30" y="591" font-size="16" font-weight="bold">Thử với traffic thật</text>
<text x="30" y="618" font-size="16" font-weight="normal">Mirror traffic tới bản mới</text>
<text x="30" y="645" font-size="16" font-weight="normal">Bỏ qua phản hồi của nó</text>
</g></svg>
