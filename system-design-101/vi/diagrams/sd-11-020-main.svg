<svg xmlns="http://www.w3.org/2000/svg" width="360" height="420" viewBox="0 0 360 420" role="img" aria-labelledby="title desc">
<title id="title">Checklist thiết kế chịu lỗi</title>
<desc id="desc">Có phần thay thế: Replication + redundancy: Tách miền lỗi phù hợp; Chuyển và giảm chức năng: LB + failover: Giữ tác vụ cốt lõi; Phát hiện và khôi phục: Monitoring + alerting: Diễn tập, backup và restore. Các khung là ý chính để đối chiếu, không nhất thiết là các bước tuần tự.</desc>
<rect width="360" height="420" fill="#f8fafc"/>
<g font-family="DejaVu Sans, sans-serif" fill="#0f172a">
<text x="20" y="28" font-size="18" font-weight="bold">sd-11-020 · Nhìn hình trước</text>
<rect x="12" y="48" width="336" height="102" rx="12" fill="#e0f2fe" stroke="#64748b"/>
<text x="24" y="75" font-size="18" font-weight="bold">Có phần thay thế</text>
<text x="24" y="104" font-size="18">Replication + redundancy</text>
<text x="24" y="130" font-size="18">Tách miền lỗi phù hợp</text>
<rect x="12" y="162" width="336" height="102" rx="12" fill="#dcfce7" stroke="#64748b"/>
<text x="24" y="189" font-size="18" font-weight="bold">Chuyển và giảm chức năng</text>
<text x="24" y="218" font-size="18">LB + failover</text>
<text x="24" y="244" font-size="18">Giữ tác vụ cốt lõi</text>
<rect x="12" y="276" width="336" height="102" rx="12" fill="#fef3c7" stroke="#64748b"/>
<text x="24" y="303" font-size="18" font-weight="bold">Phát hiện và khôi phục</text>
<text x="24" y="332" font-size="18">Monitoring + alerting</text>
<text x="24" y="358" font-size="18">Diễn tập, backup và restore</text>
</g>
</svg>
