<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 824" width="320" height="824" role="img" aria-labelledby="title desc">
<title id="title">Năm chiến lược triển khai phổ biến</title>
<desc id="desc">Năm thẻ: Big Bang thay tất cả một lần, Rolling thay từng nhóm, Blue-Green chuyển traffic giữa hai môi trường, Canary cho một phần nhỏ người dùng, Feature Toggle bật tắt bằng cờ trong mã.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#475569" stroke-width="1.5"/></marker></defs>
<rect width="320" height="824" fill="#f8fafc"/><g font-family="DejaVu Sans, Arial, sans-serif" fill="#0f172a">
<text x="16" y="30" font-size="20" font-weight="bold">5 CÁCH TRIỂN KHAI</text>
<text x="16" y="58" font-size="16" font-weight="normal">Ai thấy bản mới, quay lại ra</text>
<text x="16" y="85" font-size="16" font-weight="normal">sao</text>
<rect x="16" y="116" width="288" height="128" rx="10" fill="#fee2e2" stroke="#94a3b8"/>
<text x="30" y="144" font-size="16" font-weight="bold">Big Bang</text>
<text x="30" y="171" font-size="16" font-weight="normal">Thay tất cả một lần</text>
<text x="30" y="198" font-size="16" font-weight="normal">Đơn giản, rủi ro dồn một</text>
<text x="30" y="225" font-size="16" font-weight="normal">chỗ</text>
<rect x="16" y="256" width="288" height="128" rx="10" fill="#fef3c7" stroke="#94a3b8"/>
<text x="30" y="284" font-size="16" font-weight="bold">Rolling</text>
<text x="30" y="311" font-size="16" font-weight="normal">Thay từng nhóm máy</text>
<text x="30" y="338" font-size="16" font-weight="normal">Hai bản chạy song song một</text>
<text x="30" y="365" font-size="16" font-weight="normal">lúc</text>
<rect x="16" y="396" width="288" height="128" rx="10" fill="#dbeafe" stroke="#94a3b8"/>
<text x="30" y="424" font-size="16" font-weight="bold">Blue-Green</text>
<text x="30" y="451" font-size="16" font-weight="normal">Hai môi trường giống nhau</text>
<text x="30" y="478" font-size="16" font-weight="normal">Chuyển traffic, quay lại</text>
<text x="30" y="505" font-size="16" font-weight="normal">bằng chuyển lại</text>
<rect x="16" y="536" width="288" height="128" rx="10" fill="#ede9fe" stroke="#94a3b8"/>
<text x="30" y="564" font-size="16" font-weight="bold">Canary</text>
<text x="30" y="591" font-size="16" font-weight="normal">Một phần nhỏ người dùng thử</text>
<text x="30" y="618" font-size="16" font-weight="normal">trước</text>
<text x="30" y="645" font-size="16" font-weight="normal">Mở rộng khi số đo ổn</text>
<rect x="16" y="676" width="288" height="128" rx="10" fill="#dcfce7" stroke="#94a3b8"/>
<text x="30" y="704" font-size="16" font-weight="bold">Feature Toggle</text>
<text x="30" y="731" font-size="16" font-weight="normal">Mã đã triển khai nhưng tắt</text>
<text x="30" y="758" font-size="16" font-weight="normal">Bật bằng cờ, tắt cũng bằng</text>
<text x="30" y="785" font-size="16" font-weight="normal">cờ</text>
</g></svg>
