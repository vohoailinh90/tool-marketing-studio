<text x="16" y="84.2" font-size="15" fill="#475569" font-weight="normal" text-anchor="start">Năm nhóm, mỗi nhóm hai cuốn; mỗi</text>
<text x="16" y="103.8" font-size="15" fill="#475569" font-weight="normal" text-anchor="start">cuốn một việc.</text>
