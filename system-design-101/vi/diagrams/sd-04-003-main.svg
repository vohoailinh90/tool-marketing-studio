<svg xmlns="http://www.w3.org/2000/svg" width="320" height="1268" viewBox="0 0 320 1268" role="img" aria-labelledby="title desc">
<title id="title">Tải tệp lớn lên S3 theo nhiều phần</title>
<desc id="desc">Ba khung. Khung một là trình tự giữa máy khách và kho đối tượng: máy khách xin bắt đầu một lượt tải nhiều phần và nhận upload ID; gửi từng phần, có thể song song, kèm số phần và upload ID, mỗi phần nhận về một ETag; cuối cùng gửi lệnh hoàn tất kèm danh sách số phần và ETag, kho ghép các phần theo số phần. Khung hai là cách chọn cỡ phần: mỗi phần ít nhất 5 MiB trừ phần cuối và tối đa 10.000 phần; tệp 100 GiB với phần 5 MiB cần 20.480 phần nên phải dùng phần từ 10,24 MiB trở lên. Khung ba: lượt tải bỏ dở vẫn bị tính tiền lưu trữ cho tới khi hủy, và ETag của đối tượng tải nhiều phần không phải MD5 của cả tệp.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs>
<rect width="320" height="1268" fill="#f8fafc"/>
<g font-family="DejaVu Sans, Arial, sans-serif" fill="#0f172a">
<text x="16" y="34" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">Tải tệp lớn lên S3 theo</text>
<text x="16" y="58" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">nhiều phần</text>
<text x="16" y="84.2" font-size="15" fill="#475569" font-weight="normal" text-anchor="start">Mở một lượt tải, gửi từng phần (song</text>
<text x="16" y="103.8" font-size="15" fill="#475569" font-weight="normal" text-anchor="start">song được), rồi báo hoàn tất.</text>
<rect x="8" y="123" width="304" height="460" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="151.2" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Một lượt tải nhiều phần</text>
<rect x="20" y="168" width="96" height="86" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="68" cy="190" r="14" fill="#1d4ed8"/><g transform="translate(59.6 181.6) scale(0.7)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect height="14" rx="2" width="20" x="2" y="3"/><line x1="8" x2="16" y1="21" y2="21"/><line x1="12" x2="12" y1="17" y2="21"/></g>
<text x="68" y="221.9" font-size="15" fill="#0f172a" font-weight="bold" text-anchor="middle">Máy</text>
<text x="68" y="240.6" font-size="15" fill="#0f172a" font-weight="bold" text-anchor="middle">khách</text>
<rect x="204" y="168" width="96" height="86" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="252" cy="190" r="14" fill="#1d4ed8"/><g transform="translate(243.6 181.6) scale(0.7)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/></g>
<text x="252" y="221.9" font-size="15" fill="#0f172a" font-weight="bold" text-anchor="middle">Kho đối</text>
<text x="252" y="240.6" font-size="15" fill="#0f172a" font-weight="bold" text-anchor="middle">tượng</text>
<polyline points="68,254 68,571" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4 4"/>
<polyline points="252,254 252,571" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4 4"/>
<text x="160" y="282.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="middle">Bắt đầu tải nhiều</text>
<text x="160" y="301.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="middle">phần</text>
<polyline points="69,315 249,315" fill="none" stroke="#334155" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="160" y="343.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="middle">upload ID</text>
<polyline points="251,357 71,357" fill="none" stroke="#334155" stroke-width="1.8" stroke-dasharray="5 4" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="160" y="385.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="middle">Từng phần: số phần,</text>
<text x="160" y="404.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="middle">upload ID</text>
<polyline points="69,418 249,418" fill="none" stroke="#334155" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="160" y="446.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="middle">ETag của phần đó</text>
<polyline points="251,460 71,460" fill="none" stroke="#334155" stroke-width="1.8" stroke-dasharray="5 4" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="160" y="488.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="middle">Hoàn tất: các cặp số</text>
<text x="160" y="507.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="middle">phần, ETag</text>
<polyline points="69,521 249,521" fill="none" stroke="#334155" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="160" y="549.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="middle">Ghép theo số phần</text>
<polyline points="251,563 71,563" fill="none" stroke="#334155" stroke-width="1.8" stroke-dasharray="5 4" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="8" y="595" width="304" height="422" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="623.1" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Chọn cỡ phần</text>
<rect x="20" y="640" width="280" height="107" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
<circle cx="46" cy="666" r="14" fill="#0f766e"/>
<text x="46" y="671.5" font-size="16" fill="#ffffff" font-weight="bold" text-anchor="middle">1</text>
<text x="70" y="666.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Hai giới hạn</text>
<text x="70" y="690.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Mỗi phần ít nhất 5 MiB, trừ</text>
<text x="70" y="709.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">phần cuối; một lượt tải tối</text>
<text x="70" y="729.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">đa 10.000 phần.</text>
<rect x="20" y="769" width="280" height="107" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
<circle cx="46" cy="795" r="14" fill="#0f766e"/>
<text x="46" y="800.5" font-size="16" fill="#ffffff" font-weight="bold" text-anchor="middle">2</text>
<text x="70" y="795.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Tính số phần</text>
<text x="70" y="819.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Tệp 100 GiB cắt phần 5 MiB</text>
<text x="70" y="838.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">thành 20.480 phần: vượt</text>
<text x="70" y="858.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">giới hạn.</text>
<polyline points="46,749 46,767" fill="none" stroke="#334155" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="20" y="898" width="280" height="107" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
<circle cx="46" cy="924" r="14" fill="#0f766e"/>
<text x="46" y="929.5" font-size="16" fill="#ffffff" font-weight="bold" text-anchor="middle">3</text>
<text x="70" y="924.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Tăng cỡ phần</text>
<text x="70" y="948.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Cần phần từ 10,24 MiB trở</text>
<text x="70" y="967.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">lên; phần lớn hơn thì ít lệnh</text>
<text x="70" y="987.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">gọi hơn.</text>
<polyline points="46,878 46,896" fill="none" stroke="#334155" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="8" y="1029" width="304" height="231" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="1057.1" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Hai điều hay quên</text>
<rect x="20" y="1074" width="280" height="83" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="1097" r="11" fill="#16a34a"/>
<polyline points="37.9,1097.4 41.7,1101.4 48.5,1093" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="1100.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Lượt tải bỏ dở vẫn bị tính</text>
<text x="64" y="1119.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">tiền lưu các phần đã gửi cho</text>
<text x="64" y="1139.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">tới khi hủy.</text>
<rect x="20" y="1165" width="280" height="83" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="1188" r="11" fill="#16a34a"/>
<polyline points="37.9,1188.4 41.7,1192.4 48.5,1184" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="1191.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">ETag của đối tượng tải nhiều</text>
<text x="64" y="1210.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">phần không phải MD5 của cả</text>
<text x="64" y="1230.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">tệp.</text>
</g>
</svg>
