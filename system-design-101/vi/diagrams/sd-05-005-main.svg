<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 823" width="320" height="823" role="img" aria-labelledby="title desc">
<title id="title">Từ danh sách tài liệu đến kế hoạch ôn phỏng vấn</title>
<desc id="desc">Năm khung dọc. Một: danh sách tài liệu chưa phải kế hoạch; hãy xác định vòng phỏng vấn trước. Hai: mỗi vòng có một vòng lặp luyện riêng; coding là giải rồi nói to cách nghĩ, thiết kế hệ thống là bốn bước từ yêu cầu đến mở rộng, hành vi là ba đến năm câu chuyện kể theo STAR. Ba: thời gian còn lại quyết định độ sâu; ít thời gian thì học rộng, nhiều thời gian thì học sâu và làm nhiều bài hơn. Bốn: hỏi ai được lợi; cùng một khóa học xuất hiện ở nhiều nơi thì chưa phải bằng chứng độc lập về chất lượng, và README của Handbook có chín lần xuất hiện tham số kiểu mã giới thiệu còn README của Primer không có. Năm: kiểm tra giá, ngày cập nhật và phản hồi nhận được trước khi trả tiền.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#475569" stroke-width="1.5"/></marker></defs>
<rect width="320" height="823" fill="#f8fafc"/>
<g font-family="DejaVu Sans, Arial, sans-serif" fill="#0f172a">
<text x="16" y="30" font-size="20" font-weight="bold">ÔN PHỎNG VẤN</text>
<text x="16" y="56" font-size="20" font-weight="bold">LÀ KẾ HOẠCH,</text>
<text x="16" y="82" font-size="20" font-weight="bold">KHÔNG PHẢI DANH SÁCH</text>
<text x="16" y="112" font-size="16" font-weight="normal">Từ ba tài liệu công khai</text>
<rect x="16" y="134" width="288" height="104" rx="12" fill="#e2e8f0" stroke="#94a3b8"/>
<text x="30" y="164" font-size="16" font-weight="bold">1 · Vòng nào trước</text>
<text x="30" y="191" font-size="16" font-weight="normal">Xác định vòng sắp gặp</text>
<text x="30" y="218" font-size="16" font-weight="normal">rồi mới chọn tài liệu</text>
<rect x="16" y="252" width="288" height="131" rx="12" fill="#dbeafe" stroke="#94a3b8"/>
<text x="30" y="282" font-size="16" font-weight="bold">2 · Mỗi vòng một cách luyện</text>
<text x="30" y="309" font-size="16" font-weight="normal">Hành vi: 3–5 chuyện, STAR</text>
<text x="30" y="336" font-size="16" font-weight="normal">Hệ thống: bốn bước</text>
<text x="30" y="363" font-size="16" font-weight="normal">Coding: giải, nói to, giải lại</text>
<rect x="16" y="397" width="288" height="104" rx="12" fill="#dcfce7" stroke="#94a3b8"/>
<text x="30" y="427" font-size="16" font-weight="bold">3 · Thời gian chọn độ sâu</text>
<text x="30" y="454" font-size="16" font-weight="normal">Ít thời gian: học rộng</text>
<text x="30" y="481" font-size="16" font-weight="normal">Nhiều: sâu, nhiều đề hơn</text>
<rect x="16" y="515" width="288" height="104" rx="12" fill="#fef3c7" stroke="#94a3b8"/>
<text x="30" y="545" font-size="16" font-weight="bold">4 · Hỏi ai được lợi</text>
<text x="30" y="572" font-size="16" font-weight="normal">Handbook: 9 tham số kiểu</text>
<text x="30" y="599" font-size="16" font-weight="normal">giới thiệu; Primer: 0</text>
<rect x="16" y="633" width="288" height="104" rx="12" fill="#ede9fe" stroke="#94a3b8"/>
<text x="30" y="663" font-size="16" font-weight="bold">5 · Kiểm tra trước khi mua</text>
<text x="30" y="690" font-size="16" font-weight="normal">Còn cập nhật? Có phản hồi?</text>
<text x="30" y="717" font-size="16" font-weight="normal">Có bản miễn phí để thử?</text>
<text x="16" y="777" font-size="16" font-weight="normal">Lời gợi ý trùng nhau</text>
<text x="16" y="803" font-size="16" font-weight="normal">chưa là kiểm chứng.</text>
</g></svg>
