<svg xmlns="http://www.w3.org/2000/svg" width="320" height="620" viewBox="0 0 320 620" role="img" aria-labelledby="title desc"><title id="title">API và SDK: giao diện gọi và bộ công cụ</title><desc id="desc">Ví dụ thư viện: tự tạo yêu cầu hoặc dùng thư viện trong SDK đều có thể gọi cùng API dịch vụ. SDK còn có thể chứa công cụ khác.</desc><rect width="320" height="620" fill="#f8fafc"/><g font-family="Arial, sans-serif" font-size="16" fill="#0f172a"><text x="16" y="32" font-size="20" font-weight="bold">ĐẶT CHỖ MỘT CUỐN SÁCH</text>
