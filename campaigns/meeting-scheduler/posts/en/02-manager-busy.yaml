id: 02-manager-busy
status: draft
format: portrait
series: "Cross-border meetings · #2"
link: ~
slides:
  - layout: cover
    emoji: "🗓️"
    eyebrow: "Meetings across a department"
    title: "Managers **fully booked**?\n4 ways to land a meeting time"
    subtitle: "No need to ask everyone every time. A simulation shows how much each one helps."
    badge: "Swipe through 👉"

  - layout: stat
    eyebrow: "Starting point"
    value: "~7%"
    label: "chance a week has a 60-minute slot where all 10 are free: one department, 2 managers twice as busy"
    caption: "Simulation (same setup as the previous post): staff are busy about 30% of working time, managers about 60%."

  - layout: stat
    eyebrow: "Way 1: fewer must-attend"
    before: "7%"
    after: "61%"
    label: "Only the 8 staff must be free; managers join if they can"
    caption: "If at least 1 of the 2 managers must also be free: about 35%."

  - layout: stat
    eyebrow: "Way 2: shorter"
    before: "7%"
    after: "65%"
    label: "Make it 30 minutes instead of 60"
    caption: "Same setup: chance that all 10 are free for the slot."

  - layout: stat
    eyebrow: "Way 3: look further ahead"
    before: "7%"
    after: "30%"
    label: "Search 4 weeks instead of 1 week"
    caption: "Searching 2 weeks: about 14%."

  - layout: stat
    eyebrow: "Way 4: move just one meeting"
    value: "~57%"
    label: "of weeks have a slot where at most one person is busy"
    caption: "In about 48% of such slots that person is a manager: you know who to ask."

  - layout: poll
    eyebrow: "Quick question"
    question: "Managers fully booked: what do you do?"
    options:
      - "Ask managers first, fit the rest around them"
      - "Offer 2–3 options to pick from"
      - "Meet without them and share notes"
      - "Wait until next week"

  - layout: cta
    emoji: "💬"
    title: "How far does my prototype go?"
    text: "For each near-miss slot (up to 5) it shows who is not free. Counting who blocks the most is still just an idea. Not released; it only reads people in the same organisation."
    show_link: false

platforms:
  facebook:
    caption: |
      Managers fully booked: how do you land a time for the whole group? I simulated 4 ways 🗓️

      Setup: 10 people in one department, 8 busy about 30% of their working time and 2 managers twice as busy (about 60%). The chance that a week has a 60-minute slot where everyone is free is only about 7%. Then each way:

      1) Make only the essential people must-attend, managers join if they can: about 61% (if at least 1 of the 2 managers must also be free: about 35%).
      2) Make it 30 minutes instead of 60: about 65%.
      3) Search 4 weeks instead of 1 week: about 30% (2 weeks: about 14%).
      4) Ask just one person to move one meeting: about 57% of weeks have a slot where at most one person is busy, and in about 48% of such slots that person is a manager, so you know who to ask.

      One tip that needs no simulation: offer 2–3 options to pick from instead of asking each person every time.

      (That is a simulation with random calendars; "managers twice as busy" is my assumption, not a measurement of a real team.)

      I am prototyping a small tool for this, but it only reads calendars of people in the same organisation and it is not released. When managers are fully booked, what do you do? Answer A / B / C / D in the comments 👇
    first_comment: |
      A. Ask managers first, fit the rest around them · B. Offer 2–3 options to pick from · C. Meet without them and share notes · D. Wait until next week
    hashtags: [remotework, meetings, management, productivity, scheduling]
