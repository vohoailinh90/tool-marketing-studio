<text x="64" y="928.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">266 nhà cung cấp tài</text>
<text x="64" y="947.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">nguyên.</text>
<rect x="20" y="973" width="280" height="46" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
