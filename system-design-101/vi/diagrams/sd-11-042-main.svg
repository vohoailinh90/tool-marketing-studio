<text x="64" y="1077.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Tài liệu.</text>
<rect x="20" y="1105" width="280" height="46" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="1128" r="11" fill="#16a34a"/>
