<svg xmlns="http://www.w3.org/2000/svg" width="320" height="815" viewBox="0 0 320 815" role="img" aria-labelledby="title desc">
<title id="title">Alice gửi thư cho Bob</title>
<desc id="desc">Hai khung. Khung một, gửi thư: Alice dùng ứng dụng Outlook gửi thư tới máy chủ Outlook bằng SMTP; máy chủ Outlook chuyển thư tới máy chủ Gmail cũng bằng SMTP sau khi tra DNS; máy chủ Gmail trả lời đã nhận. Khung hai, nhận thư: Gmail lưu thư vào hộp thư của Bob, Bob đăng nhập, nếu Bob dùng một ứng dụng thư riêng thì ứng dụng đó lấy thư về bằng IMAP hoặc POP3.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs>
<rect width="320" height="815" fill="#f8fafc"/>
<g font-family="DejaVu Sans, Arial, sans-serif" fill="#0f172a">
<text x="16" y="34" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">Alice gửi thư cho Bob</text>
<text x="16" y="60.2" font-size="15" fill="#475569" font-weight="normal" text-anchor="start">Từ ứng dụng Outlook tới hộp thư</text>
<text x="16" y="79.8" font-size="15" fill="#475569" font-weight="normal" text-anchor="start">Gmail.</text>
<rect x="8" y="99" width="304" height="353" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="127.2" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Gửi thư</text>
<rect x="20" y="144" width="84" height="105" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="62" cy="166" r="14" fill="#1d4ed8"/><g transform="translate(53.6 157.6) scale(0.7)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect height="14" rx="2" width="20" x="2" y="3"/><line x1="8" x2="16" y1="21" y2="21"/><line x1="12" x2="12" y1="17" y2="21"/></g>
<text x="62" y="197.9" font-size="15" fill="#0f172a" font-weight="bold" text-anchor="middle">Alice</text>
<text x="62" y="216.6" font-size="15" fill="#0f172a" font-weight="bold" text-anchor="middle">(Outloo</text>
<text x="62" y="235.4" font-size="15" fill="#0f172a" font-weight="bold" text-anchor="middle">k)</text>
<rect x="118" y="144" width="84" height="105" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="160" cy="166" r="14" fill="#1d4ed8"/><g transform="translate(151.6 157.6) scale(0.7)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect height="8" rx="2" ry="2" width="20" x="2" y="2"/><rect height="8" rx="2" ry="2" width="20" x="2" y="14"/><line x1="6" x2="6.01" y1="6" y2="6"/><line x1="6" x2="6.01" y1="18" y2="18"/></g>
<text x="160" y="197.9" font-size="15" fill="#0f172a" font-weight="bold" text-anchor="middle">Máy chủ</text>
<text x="160" y="216.6" font-size="15" fill="#0f172a" font-weight="bold" text-anchor="middle">Outlook</text>
<rect x="216" y="144" width="84" height="105" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="258" cy="166" r="14" fill="#1d4ed8"/><g transform="translate(249.6 157.6) scale(0.7)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect height="8" rx="2" ry="2" width="20" x="2" y="2"/><rect height="8" rx="2" ry="2" width="20" x="2" y="14"/><line x1="6" x2="6.01" y1="6" y2="6"/><line x1="6" x2="6.01" y1="18" y2="18"/></g>
<text x="258" y="197.9" font-size="15" fill="#0f172a" font-weight="bold" text-anchor="middle">Máy chủ</text>
<text x="258" y="216.6" font-size="15" fill="#0f172a" font-weight="bold" text-anchor="middle">Gmail</text>
<polyline points="62,249 62,440" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4 4"/>
<polyline points="160,249 160,440" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4 4"/>
<polyline points="258,249 258,440" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4 4"/>
<text x="111" y="277.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="middle">SMTP: gửi</text>
<text x="111" y="296.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="middle">thư</text>
<polyline points="63,310 157,310" fill="none" stroke="#334155" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="209" y="338.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="middle">Tra DNS,</text>
<text x="209" y="357.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="middle">rồi SMTP</text>
<polyline points="161,371 255,371" fill="none" stroke="#334155" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="209" y="399.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="middle">Đã nhận</text>
<text x="209" y="418.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="middle">(250)</text>
<polyline points="257,432 163,432" fill="none" stroke="#334155" stroke-width="1.8" stroke-dasharray="5 4" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="8" y="464" width="304" height="343" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="492.2" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Nhận thư</text>
<rect x="20" y="509" width="280" height="87" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
<circle cx="46" cy="535" r="14" fill="#0f766e"/>
<text x="46" y="540.5" font-size="16" fill="#ffffff" font-weight="bold" text-anchor="middle">1</text>
<text x="70" y="535.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Gmail lưu thư</text>
<text x="70" y="559.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Thư nằm trong hộp thư của</text>
<text x="70" y="578.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Bob.</text>
<rect x="20" y="618" width="280" height="68" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
<circle cx="46" cy="644" r="14" fill="#0f766e"/>
<text x="46" y="649.5" font-size="16" fill="#ffffff" font-weight="bold" text-anchor="middle">2</text>
<text x="70" y="644.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Bob đọc thư</text>
<text x="70" y="668.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Anh mở hộp thư của mình.</text>
<polyline points="46,598 46,616" fill="none" stroke="#334155" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="20" y="708" width="280" height="87" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
<circle cx="46" cy="734" r="14" fill="#0f766e"/>
<text x="46" y="739.5" font-size="16" fill="#ffffff" font-weight="bold" text-anchor="middle">3</text>
<text x="70" y="734.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Lấy thư về</text>
<text x="70" y="758.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Ứng dụng thư riêng dùng</text>
<text x="70" y="777.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">IMAP hoặc POP3.</text>
<polyline points="46,688 46,706" fill="none" stroke="#334155" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
</g>
</svg>
