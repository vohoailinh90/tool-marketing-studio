# Mutation manifest — see scripts/mutation_check.py
#
# A passing test proves nothing on its own. These break each behavior in turn
# and require the named test to fail. A mutation that SURVIVES means the test
# guards nothing.

target: scripts/codex_round_count.py
note: The review count of docs/claude-to-codex.md section 16, which has no cap since 2026-10-12. Each entry breaks one rule of
  what counts as a round and names the test that must notice.
