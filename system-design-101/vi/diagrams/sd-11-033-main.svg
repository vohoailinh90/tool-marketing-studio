<text x="64" y="1055.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Báo người theo dõi: SNS.</text>
<rect x="20" y="1083" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="1106" r="11" fill="#16a34a"/>
<polyline points="37.9,1106.4 41.7,1110.4 48.5,1102" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="1109.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Biết khi nào hỏng:</text>
<text x="64" y="1128.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">CloudWatch.</text>
