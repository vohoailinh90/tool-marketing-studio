<svg xmlns="http://www.w3.org/2000/svg" width="320" height="847" viewBox="0 0 320 847" role="img" aria-labelledby="title desc">
<title id="title">Đối soát thanh toán</title>
<desc id="desc">Hai khung. Khung một, ba bản ghi của một khoản 200 đô la mua đồng hồ: đơn hàng trên website thương mại điện tử, giao dịch ở PayPal, sổ cái ghi nợ người mua 200 và ghi có người bán 200. Khung hai, ba nỗi đau và cách gỡ: định dạng dữ liệu khác nhau thì thêm một lớp chuyển về cùng định dạng; dữ liệu rất lớn thì dùng xử lý dữ liệu lớn, luồng nếu cần gần thời gian thực, lô cuối ngày nếu không; lệch giờ chốt thì xếp vào lệch tạm thời rồi so lại với bản ghi ngày sau.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs>
<rect width="320" height="847" fill="#f8fafc"/>
<g font-family="DejaVu Sans, Arial, sans-serif" fill="#0f172a">
<text x="16" y="34" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">Đối soát thanh toán</text>
<text x="16" y="60.2" font-size="15" fill="#475569" font-weight="normal" text-anchor="start">So các bản ghi ở nhiều hệ thống cho</text>
<text x="16" y="79.8" font-size="15" fill="#475569" font-weight="normal" text-anchor="start">khớp nhau.</text>
<rect x="8" y="99" width="304" height="346" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="127.2" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Ba bản ghi của 200 đô la</text>
<rect x="20" y="144" width="280" height="87" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="50" cy="187.5" r="18" fill="#1d4ed8"/><g transform="translate(39.2 176.7) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 22a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.704.706l3.588 3.588A2.4 2.4 0 0 1 20 8v12a2 2 0 0 1-2 2z"/><path d="M14 2v5a1 1 0 0 0 1 1h5"/><path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/></g>
<text x="78" y="170.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Đơn hàng</text>
<text x="78" y="194.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Website ghi một đơn mua</text>
<text x="78" y="213.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">200 đô la.</text>
<rect x="20" y="245" width="280" height="87" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="50" cy="288.5" r="18" fill="#1d4ed8"/><g transform="translate(39.2 277.7) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect height="14" rx="2" width="20" x="2" y="5"/><line x1="2" x2="22" y1="10" y2="10"/><path d="M6 14h2"/></g>
<text x="78" y="271.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Giao dịch PayPal</text>
<text x="78" y="295.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">PayPal ghi một giao dịch</text>
<text x="78" y="314.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">200 đô la.</text>
<rect x="20" y="346" width="280" height="87" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="50" cy="389.5" r="18" fill="#1d4ed8"/><g transform="translate(39.2 378.7) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/></g>
<text x="78" y="372.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Sổ cái</text>
<text x="78" y="396.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Ghi nợ người mua 200, ghi</text>
<text x="78" y="415.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">có người bán 200.</text>
<rect x="8" y="457" width="304" height="382" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="485.2" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Ba nỗi đau, ba cách gỡ</text>
<rect x="20" y="502" width="280" height="87" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
<circle cx="46" cy="528" r="14" fill="#0f766e"/>
<text x="46" y="533.5" font-size="16" fill="#ffffff" font-weight="bold" text-anchor="middle">1</text>
<text x="70" y="528.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Khác định dạng</text>
<text x="70" y="552.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Thêm một lớp đổi về cùng</text>
<text x="70" y="571.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">định dạng.</text>
<rect x="20" y="611" width="280" height="107" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
<circle cx="46" cy="637" r="14" fill="#0f766e"/>
<text x="46" y="642.5" font-size="16" fill="#ffffff" font-weight="bold" text-anchor="middle">2</text>
<text x="70" y="637.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Dữ liệu rất lớn</text>
<text x="70" y="661.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Xử lý dữ liệu lớn: luồng nếu</text>
<text x="70" y="680.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">cần gần thời gian thực, lô</text>
<text x="70" y="700.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">cuối ngày nếu không.</text>
<polyline points="46,591 46,609" fill="none" stroke="#334155" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="20" y="740" width="280" height="87" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
<circle cx="46" cy="766" r="14" fill="#0f766e"/>
<text x="46" y="771.5" font-size="16" fill="#ffffff" font-weight="bold" text-anchor="middle">3</text>
<text x="70" y="766.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Lệch giờ chốt</text>
<text x="70" y="790.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Xếp vào lệch tạm thời, so</text>
<text x="70" y="809.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">lại với bản ghi ngày sau.</text>
<polyline points="46,720 46,738" fill="none" stroke="#334155" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
</g>
</svg>
