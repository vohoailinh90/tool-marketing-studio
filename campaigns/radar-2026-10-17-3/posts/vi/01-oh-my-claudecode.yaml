  - text: 'Phân vai tác nhân: OMC cung cấp các tác nhân và kỹ năng chuyên biệt để phân rã nhiệm vụ lớn
      thành các phần việc nhỏ.'
  - text: 'Hỏi chéo đa mô hình: OMC có khả năng định tuyến câu hỏi và đánh giá chéo qua các AI providers
      khác nhau như Codex, Gemini hay Grok.'
  - text: 'Đánh giá chuẩn xác với Jev: Jev cung cấp cơ chế phán đoán quyết định việc kích hoạt kỹ năng,
      định tuyến mô hình và cắt tỉa ngữ cảnh.'
