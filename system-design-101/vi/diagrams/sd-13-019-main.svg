<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 626" width="320" height="626" role="img" aria-labelledby="title desc">
<title id="title">DevOps, SRE và Platform Engineering khác nhau thế nào</title>
<desc id="desc">Ba tình huống và cách nghĩ phù hợp: hai nhóm đổ lỗi cho nhau cần văn hóa DevOps, dịch vụ hay sập cần SLO và error budget của SRE, mỗi nhóm tự dựng pipeline riêng cần nền tảng nội bộ.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#475569" stroke-width="1.5"/></marker></defs>
<rect width="320" height="626" fill="#f8fafc"/><g font-family="DejaVu Sans, Arial, sans-serif" fill="#0f172a">
<text x="16" y="30" font-size="20" font-weight="bold">TÌNH HUỐNG → CÁCH</text>
<text x="16" y="58" font-size="20" font-weight="bold">NGHĨ</text>
<text x="16" y="86" font-size="16" font-weight="normal">Ba tình huống quen thuộc</text>
<rect x="16" y="117" width="288" height="155" rx="10" fill="#dbeafe" stroke="#94a3b8"/>
<text x="30" y="145" font-size="16" font-weight="bold">Dev và Ops đổ lỗi cho</text>
<text x="30" y="172" font-size="16" font-weight="bold">nhau</text>
<text x="30" y="199" font-size="16" font-weight="normal">DevOps: trách nhiệm chung,</text>
<text x="30" y="226" font-size="16" font-weight="normal">tự động hóa, vòng phản hồi</text>
<text x="30" y="253" font-size="16" font-weight="normal">ngắn</text>
<rect x="16" y="284" width="288" height="155" rx="10" fill="#fef3c7" stroke="#94a3b8"/>
<text x="30" y="312" font-size="16" font-weight="bold">Dịch vụ cứ sập, vẫn</text>
<text x="30" y="339" font-size="16" font-weight="bold">phát hành liên tục</text>
<text x="30" y="366" font-size="16" font-weight="normal">SRE: đặt SLO, dùng error</text>
<text x="30" y="393" font-size="16" font-weight="normal">budget để cân bằng độ tin</text>
<text x="30" y="420" font-size="16" font-weight="normal">cậy và tốc độ</text>
<rect x="16" y="451" width="288" height="155" rx="10" fill="#dcfce7" stroke="#94a3b8"/>
<text x="30" y="479" font-size="16" font-weight="bold">Mỗi nhóm tự dựng</text>
<text x="30" y="506" font-size="16" font-weight="bold">pipeline riêng</text>
<text x="30" y="533" font-size="16" font-weight="normal">Platform Engineering: nền</text>
<text x="30" y="560" font-size="16" font-weight="normal">tảng nội bộ, đường đi mẫu</text>
<text x="30" y="587" font-size="16" font-weight="normal">cho nhóm sản phẩm</text>
</g></svg>
