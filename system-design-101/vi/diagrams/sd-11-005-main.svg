<svg xmlns="http://www.w3.org/2000/svg" width="360" height="420" viewBox="0 0 360 420" role="img" aria-labelledby="title desc">
<title id="title">Chia bảng theo cột hay theo hàng?</title>
<desc id="desc">Bảng gốc: id • tên • ảnh: Nhiều hàng khách hàng; Chia dọc: id + tên | id + ảnh: Tách nhóm cột; Chia ngang: Nhóm hàng A | nhóm hàng B: Giữ cùng cấu trúc cột. Các khung là ý chính để đối chiếu, không nhất thiết là các bước tuần tự.</desc>
<rect width="360" height="420" fill="#f8fafc"/>
<g font-family="DejaVu Sans, sans-serif" fill="#0f172a">
<text x="20" y="28" font-size="18" font-weight="bold">sd-11-005 · Nhìn hình trước</text>
<rect x="12" y="48" width="336" height="102" rx="12" fill="#e0f2fe" stroke="#64748b"/>
<text x="24" y="75" font-size="18" font-weight="bold">Bảng gốc</text>
<text x="24" y="104" font-size="18">id • tên • ảnh</text>
<text x="24" y="130" font-size="18">Nhiều hàng khách hàng</text>
<rect x="12" y="162" width="336" height="102" rx="12" fill="#dcfce7" stroke="#64748b"/>
<text x="24" y="189" font-size="18" font-weight="bold">Chia dọc</text>
<text x="24" y="218" font-size="18">id + tên | id + ảnh</text>
<text x="24" y="244" font-size="18">Tách nhóm cột</text>
<rect x="12" y="276" width="336" height="102" rx="12" fill="#fef3c7" stroke="#64748b"/>
<text x="24" y="303" font-size="18" font-weight="bold">Chia ngang</text>
<text x="24" y="332" font-size="18">Nhóm hàng A | nhóm hàng B</text>
<text x="24" y="358" font-size="18">Giữ cùng cấu trúc cột</text>
</g>
</svg>
