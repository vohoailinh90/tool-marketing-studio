<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 679" width="320" height="679" role="img" aria-labelledby="title desc">
<title id="title">Máy khách đọc số, không đọc tên mã HTTP</title>
<desc id="desc">Bốn khung. Một: chữ số đầu là lớp; 218 thuộc nhóm hai trăm nên được coi là thành công, còn 420, 418, 451 là lỗi phía bên gọi và 530 là lỗi phía máy chủ. Hai: tên không đi theo số; 218, 420 và 530 không có trong bảng tên của Python. Ba: danh sách liệt kê tường minh bỏ sót; thư viện được cấu hình thử lại 500, 502, 503 và 504 sẽ thử lại 500 nhưng không thử lại 530. Bốn: 429 kèm Retry-After khiến máy khách chờ rồi thử lại, còn 420 thì không. Kết quả đo một lần trên một máy.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#475569" stroke-width="1.5"/></marker></defs>
<rect width="320" height="679" fill="#f8fafc"/>
<g font-family="DejaVu Sans, Arial, sans-serif" fill="#0f172a">
<text x="16" y="30" font-size="20" font-weight="bold">MÃ HTTP LẠ</text>
<text x="16" y="56" font-size="20" font-weight="bold">ĐỌC SỐ, KHÔNG ĐỌC TÊN</text>
<text x="16" y="86" font-size="16" font-weight="normal">Một lần thử trên một máy</text>
<rect x="16" y="108" width="288" height="131" rx="12" fill="#dbeafe" stroke="#94a3b8"/>
<text x="30" y="138" font-size="16" font-weight="bold">1 · Chữ số đầu là lớp</text>
<text x="30" y="165" font-size="16" font-weight="normal">218 → 2xx: coi là thành công</text>
<text x="30" y="192" font-size="16" font-weight="normal">420, 418, 451 → lỗi (4xx)</text>
<text x="30" y="219" font-size="16" font-weight="normal">530 → lỗi máy chủ (5xx)</text>
<rect x="16" y="253" width="288" height="104" rx="12" fill="#e2e8f0" stroke="#94a3b8"/>
<text x="30" y="283" font-size="16" font-weight="bold">2 · Tên không đi theo số</text>
<text x="30" y="310" font-size="16" font-weight="normal">218, 420, 530 không có trong</text>
<text x="30" y="337" font-size="16" font-weight="normal">bảng tên của Python</text>
<rect x="16" y="371" width="288" height="104" rx="12" fill="#fef3c7" stroke="#94a3b8"/>
<text x="30" y="401" font-size="16" font-weight="bold">3 · Danh sách bỏ sót</text>
<text x="30" y="428" font-size="16" font-weight="normal">Thử lại [500,502,503,504]:</text>
<text x="30" y="455" font-size="16" font-weight="normal">500 thử lại, 530 thì không</text>
<rect x="16" y="489" width="288" height="104" rx="12" fill="#dcfce7" stroke="#94a3b8"/>
<text x="30" y="519" font-size="16" font-weight="bold">4 · 429 khác 420</text>
<text x="30" y="546" font-size="16" font-weight="normal">429 + Retry-After: chờ, thử lại</text>
<text x="30" y="573" font-size="16" font-weight="normal">420: dừng sau một lần</text>
<text x="16" y="633" font-size="16" font-weight="normal">Chọn mã chuẩn, đúng nhóm;</text>
<text x="16" y="659" font-size="16" font-weight="normal">tên chỉ để người đọc.</text>
</g></svg>
