id: 02-manager-busy
status: draft
format: portrait
series: "Cross-border meetings · #2"
link: ~
slides:
  - layout: cover
    emoji: "🗓️"
    eyebrow: "Across departments and countries"
    title: "Managers **fully booked**?\n4 ways to land a meeting time"
    subtitle: "Spread across countries it gets harder still. A simulation shows how much each way helps."
    badge: "Swipe through 👉"

  - layout: stat
    eyebrow: "Starting point"
    value: "~3%"
    label: "chance a week has a 60-minute slot where all 10 are free: 3 countries, 2 managers twice as busy"
    caption: "In one department in one country it is about 7%. Simulation as in the previous post: staff busy about 30% of working time, managers about 60%."

  - layout: stat
    eyebrow: "Way 1: fewer must-attend"
    before: "3%"
    after: "39%"
    label: "Only the 8 staff must be free; managers join if they can"
    caption: "If at least 1 of the 2 managers must also be free: about 20%. One country: 61% and 35%."

  - layout: stat
    eyebrow: "Way 2: shorter"
    before: "3%"
    after: "36%"
    label: "Make it 30 minutes instead of 60"
    caption: "Same setup: chance that all 10 are free for the slot. One country: 65%."

  - layout: stat
    eyebrow: "Way 3: look further ahead"
    before: "3%"
    after: "10%"
    label: "Search 4 weeks instead of 1 week"
    caption: "Searching 2 weeks: about 7%. One country: 30% and 14%."

  - layout: stat
    eyebrow: "Way 4: move just one meeting"
    value: "~32%"
    label: "of weeks have a slot where at most one person is not free"
    caption: "In about 55% of such slots that person is a manager: you know who to ask. One country: 57% and 48%."

  - layout: poll
    eyebrow: "Quick question"
    question: "Managers fully booked: what do you do?"
    options:
      - "Ask managers first, fit the rest around them"
      - "Offer 2–3 options to pick from"
      - "Meet without them and share notes"
      - "Wait until next week"

  - layout: cta
    emoji: "💬"
    title: "How far does my prototype go?"
    text: "For each near-miss slot (up to 5) it shows who is not free. Counting who blocks the most is still just an idea. Not released; it only reads people in the same organisation."
    show_link: false

platforms:
  facebook:
    caption: |
      Managers fully booked, and spread across countries too: how do you land a time? I simulated 4 ways 🗓️

      Setup: 10 people in Vietnam, India and South Korea; 8 busy about 30% of their working time and 2 managers twice as busy (about 60%). The chance that a week has a 60-minute slot where everyone is free is only about 3% (one department in one country: about 7%). On top of who is busy, everyone must also fall inside their own country's working hours. Then each way (3 countries / one country):

      1) Make only the essential people must-attend, managers join if they can: about 39% / 61% (if at least 1 of the 2 managers must also be free: about 20% / 35%).
      2) Make it 30 minutes instead of 60: about 36% / 65%.
      3) Search 4 weeks instead of 1 week: about 10% / 30% (2 weeks: about 7% / 14%).
      4) Ask just one person to move one meeting: about 32% / 57% of weeks have a slot where at most one person is not free, and in about 55% / 48% of such slots that person is a manager, so you know who to ask.

      Overall, every way helps less once people are in different countries. One tip that needs no simulation: offer 2–3 options to pick from instead of asking each person every time.

      (That is a simulation with random calendars; "managers twice as busy" is my assumption, not a measurement of a real team.)

      I am prototyping a small tool for this, but it only reads calendars of people in the same organisation and it is not released. When managers are fully booked, what do you do? Answer A / B / C / D in the comments 👇
    first_comment: |
      A. Ask managers first, fit the rest around them · B. Offer 2–3 options to pick from · C. Meet without them and share notes · D. Wait until next week
    hashtags: [remotework, meetings, management, productivity, scheduling]
