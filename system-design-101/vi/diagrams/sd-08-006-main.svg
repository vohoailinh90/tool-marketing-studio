<svg xmlns="http://www.w3.org/2000/svg" width="320" height="1165" viewBox="0 0 320 1165" role="img" aria-labelledby="title desc">
<title id="title">Một cửa chung cho mọi truy vấn</title>
<desc id="desc">Ba khung. Khung một, bốn mảnh: ứng dụng gửi truy vấn tới lớp trung gian; lớp trung gian đưa lệnh ghi tới máy chính và lệnh đọc tới máy phụ. Khung hai, thử đo trên Redis chạy một máy: thêm một lớp chuyển tiếp làm lượt đọc từ 36 đến 41 micro giây lên 75 đến 83; khi máy chính bận ghi liên tục, 16 đến 31 phần trăm lượt đọc đầu tiên trên máy phụ vẫn chưa thấy giá trị vừa ghi. Khung ba, hai quy tắc định tuyến theo đầu câu lệnh: trong 8 câu thử, 4 câu bị đưa sai chỗ, 2 câu trong đó đọc có khóa lại rơi vào máy phụ.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs>
<rect width="320" height="1165" fill="#f8fafc"/>
<g font-family="DejaVu Sans, Arial, sans-serif" fill="#0f172a">
<text x="16" y="34" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">Một cửa chung cho mọi</text>
<text x="16" y="58" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">truy vấn</text>
<text x="16" y="84.2" font-size="15" fill="#475569" font-weight="normal" text-anchor="start">Lớp trung gian đỡ việc cho ứng dụng</text>
<text x="16" y="103.8" font-size="15" fill="#475569" font-weight="normal" text-anchor="start">nhưng có giá.</text>
<rect x="8" y="123" width="304" height="426" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="151.2" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Bốn mảnh</text>
<rect x="20" y="168" width="266" height="68" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="50" cy="202" r="18" fill="#1d4ed8"/><g transform="translate(39.2 191.2) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect height="14" rx="2" width="20" x="2" y="3"/><line x1="8" x2="16" y1="21" y2="21"/><line x1="12" x2="12" y1="17" y2="21"/></g>
<text x="78" y="194.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Ứng dụng</text>
<text x="78" y="218.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Chỉ biết một địa chỉ.</text>
<rect x="20" y="268" width="266" height="87" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="50" cy="311.5" r="18" fill="#1d4ed8"/><g transform="translate(39.2 300.7) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="19" r="3"/><path d="M9 19h8.5a3.5 3.5 0 0 0 0-7h-11a3.5 3.5 0 0 1 0-7H15"/><circle cx="18" cy="5" r="3"/></g>
<text x="78" y="294.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Lớp trung gian</text>
<text x="78" y="318.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Phân loại và chuyển câu</text>
<text x="78" y="337.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">lệnh.</text>
<rect x="20" y="387" width="266" height="68" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="50" cy="421" r="18" fill="#1d4ed8"/><g transform="translate(39.2 410.2) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5V19A9 3 0 0 0 21 19V5"/><path d="M3 12A9 3 0 0 0 21 12"/></g>
<text x="78" y="413.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Máy chính</text>
<text x="78" y="437.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Nhận mọi lệnh ghi.</text>
<rect x="20" y="469" width="266" height="68" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="50" cy="503" r="18" fill="#1d4ed8"/><g transform="translate(39.2 492.2) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.97 12.92A2 2 0 0 0 2 14.63v3.24a2 2 0 0 0 .97 1.71l3 1.8a2 2 0 0 0 2.06 0L12 19v-5.5l-5-3-4.03 2.42Z"/><path d="m7 16.5-4.74-2.85"/><path d="m7 16.5 5-3"/><path d="M7 16.5v5.17"/><path d="M12 13.5V19l3.97 2.38a2 2 0 0 0 2.06 0l3-1.8a2 2 0 0 0 .97-1.71v-3.24a2 2 0 0 0-.97-1.71L17 10.5l-5 3Z"/><path d="m17 16.5-5-3"/><path d="m17 16.5 4.74-2.85"/><path d="M17 16.5v5.17"/><path d="M7.97 4.42A2 2 0 0 0 7 6.13v4.37l5 3 5-3V6.13a2 2 0 0 0-.97-1.71l-3-1.8a2 2 0 0 0-2.06 0l-3 1.8Z"/><path d="M12 8 7.26 5.15"/><path d="m12 8 4.74-2.85"/><path d="M12 13.5V8"/></g>
<text x="78" y="495.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Máy phụ</text>
<text x="78" y="519.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Nhận lệnh đọc.</text>
<polyline points="153,238 153,266" fill="none" stroke="#334155" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="153,357 153,385" fill="none" stroke="#334155" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="286,311.5 296,311.5 296,503 288,503" fill="none" stroke="#334155" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="8" y="561" width="304" height="302" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="589.1" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Thử đo trên Redis, một máy</text>
<rect x="20" y="606" width="280" height="83" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="629" r="11" fill="#16a34a"/>
<polyline points="37.9,629.4 41.7,633.4 48.5,625" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="632.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Đọc trực tiếp: 36 đến 41 µs.</text>
<text x="64" y="651.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Qua lớp chuyển tiếp: 75 đến</text>
<text x="64" y="671.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">83 µs.</text>
<rect x="20" y="697" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="720" r="11" fill="#16a34a"/>
<polyline points="37.9,720.4 41.7,724.4 48.5,716" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="723.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Máy chính rảnh: gần như</text>
<text x="64" y="742.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">không đọc nhầm bản cũ.</text>
<rect x="20" y="768" width="280" height="83" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="791" r="11" fill="#16a34a"/>
<polyline points="37.9,791.4 41.7,795.4 48.5,787" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="794.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Máy chính bận ghi: 16 đến</text>
<text x="64" y="813.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">31% lượt đọc đầu chưa thấy</text>
<text x="64" y="833.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">giá trị mới.</text>
<rect x="8" y="875" width="304" height="282" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="903.1" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Quy tắc theo đầu câu lệnh</text>
<rect x="20" y="920" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="943" r="11" fill="#16a34a"/>
<polyline points="37.9,943.4 41.7,947.4 48.5,939" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="946.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Hai quy tắc, tám câu thử:</text>
<text x="64" y="965.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">bốn câu đi sai chỗ.</text>
<rect x="20" y="991" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="1014" r="11" fill="#16a34a"/>
<polyline points="37.9,1014.4 41.7,1018.4 48.5,1010" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="1017.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Đọc có khóa kiểu mới rơi vào</text>
<text x="64" y="1036.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">máy phụ: sai và nguy hiểm.</text>
<rect x="20" y="1062" width="280" height="83" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="1085" r="11" fill="#16a34a"/>
<polyline points="37.9,1085.4 41.7,1089.4 48.5,1081" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="1088.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Câu có chú thích đứng đầu</text>
<text x="64" y="1107.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">rơi vào máy chính: an toàn</text>
<text x="64" y="1127.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">nhưng phí.</text>
</g>
</svg>
