id: 01-pain
status: draft
format: portrait
series: "Cross-border meetings · #1"
link: ~
slides:
  - layout: cover
    emoji: "🌏"
    eyebrow: "Scheduling across time zones"
    title: "Finding **one meeting time** for 10 people in 3 countries is harder than it looks"
    subtitle: "It is not the full calendars. It is that **working hours barely overlap**."
    badge: "Swipe through 👉"

  - layout: chat
    title: "Sound familiar?"
    group: "Weekly sync 🌏"
    messages:
      - {from: "Hana (Tokyo)", text: "Anything before 6pm Tokyo time works"}
      - {from: "Petr (Prague)", text: "We only start at 9am here"}
      - {from: "Mai (Ho Chi Minh City)", text: "Tuesdays and Thursdays are packed"}
      - {me: true, text: "Hold on, converting everyone's time…"}
      - {from: "Hana (Tokyo)", text: "How about 4pm? Wait. Whose 4pm?"}
    note: "Illustrative chat, not a real conversation."

  - layout: table
    title: "A 09:00–18:00 day in each place, in Tokyo time (winter)"
    columns: ["Where", "Working hours (Tokyo time)"]
    rows:
      - ["Tokyo", "09:00 – 18:00"]
      - ["Ho Chi Minh City", "11:00 – 20:00"]
      - ["Prague", "17:00 – 02:00 (+1 day)"]
      - [{text: "All three working", tone: ok}, {text: "17:00 – 18:00", tone: ok}]
    style: app
    note: "Worked out from standard working hours, with completely empty calendars."

  - layout: stat
    eyebrow: "What is left?"
    value: "1 hour"
    label: "a day when Tokyo, Ho Chi Minh City and Prague are all at work"
    caption: "A 90-minute meeting? No slot at all. Add a colleague in the US and nothing is shared."

  - layout: pains
    title: "And that is the easy part"
    items:
      - {emoji: "🌙", text: "No shared slot: **who takes the bad hour?**"}
      - {emoji: "🔢", text: "Converting by hand: **one wrong offset** and the group is off"}
      - {emoji: "👀", text: "Guests outside your company: **no calendar to look at**"}
      - {emoji: "🎌", text: "**Public holidays** differ by country"}

  - layout: poll
    eyebrow: "Quick question"
    question: "How does your team pick a time across time zones?"
    options:
      - "Whoever is most flexible adapts"
      - "We rotate the inconvenient hour"
      - "A scheduling tool"
      - "Async: record it and share"

  - layout: cta
    emoji: "💬"
    title: "I am prototyping a small tool for this"
    text: "It is not released, and I would like to hear how you handle it first. What works for your team?"
    show_link: false

platforms:
  facebook:
    caption: |
      The hard part of a meeting across 3 countries is not busy calendars. It is that working hours barely overlap 🌏

      Try it: Tokyo, Ho Chi Minh City and Prague, everyone working 09:00–18:00. In winter all three are at work together for just 1 hour a day (17:00 Tokyo = 09:00 Prague). A 90-minute meeting? No slot. Add someone in the US and nothing is shared.

      (That is a worked example from standard hours with empty calendars. Real teams also have busy diaries and holidays.)

      I am prototyping a small tool for this, but it is not released. I would rather hear how you handle it first. How does your team pick a time across time zones? Answer A / B / C / D in the comments 👇
    first_comment: |
      A. Whoever is most flexible adapts · B. We rotate the inconvenient hour · C. A scheduling tool · D. Async: record it and share
    hashtags: [remotework, timezones, teamwork, productivity, scheduling]
