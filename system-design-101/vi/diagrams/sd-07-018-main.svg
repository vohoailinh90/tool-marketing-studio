<text x="70" y="969.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Mạng thẻ bù trừ</text>
<text x="70" y="993.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Gửi tệp bù trừ cho các ngân</text>
