<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 1138" width="320" height="1138" role="img" aria-labelledby="title desc">
<title id="title">Mười mẫu thiết kế Kubernetes</title>
<desc id="desc">Năm tình huống xếp theo vòng đời một Pod, mỗi tình huống chỉ ra các mẫu thiết kế liên quan: đặt Pod, chuẩn bị, giữ khỏe, tìm nhau và tự động hóa vận hành.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#475569" stroke-width="1.5"/></marker></defs>
<rect width="320" height="1138" fill="#f8fafc"/><g font-family="DejaVu Sans, Arial, sans-serif" fill="#0f172a">
<text x="16" y="30" font-size="20" font-weight="bold">MẪU THEO TÌNH HUỐNG</text>
<text x="16" y="58" font-size="16" font-weight="normal">Đi theo vòng đời một Pod</text>
<rect x="16" y="89" width="288" height="155" rx="10" fill="#dbeafe" stroke="#94a3b8"/>
<text x="30" y="117" font-size="16" font-weight="bold">Pod chưa có chỗ chạy</text>
<text x="30" y="144" font-size="16" font-weight="normal">Predictable Demands: khai</text>
<text x="30" y="171" font-size="16" font-weight="normal">báo cần bao nhiêu</text>
<text x="30" y="198" font-size="16" font-weight="normal">Automated Placement:</text>
<text x="30" y="225" font-size="16" font-weight="normal">scheduler chọn node</text>
<line x1="160" y1="256" x2="160" y2="284" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="16" y="294" width="288" height="128" rx="10" fill="#ede9fe" stroke="#94a3b8"/>
<text x="30" y="322" font-size="16" font-weight="bold">Cần chuẩn bị trước khi</text>
<text x="30" y="349" font-size="16" font-weight="bold">chạy</text>
<text x="30" y="376" font-size="16" font-weight="normal">Init Container: bước chạy</text>
<text x="30" y="403" font-size="16" font-weight="normal">xong rồi mới tới ứng dụng</text>
<line x1="160" y1="434" x2="160" y2="462" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="16" y="472" width="288" height="209" rx="10" fill="#dcfce7" stroke="#94a3b8"/>
<text x="30" y="500" font-size="16" font-weight="bold">Đang chạy</text>
<text x="30" y="527" font-size="16" font-weight="normal">Health Probe: báo sống, báo</text>
<text x="30" y="554" font-size="16" font-weight="normal">sẵn sàng</text>
<text x="30" y="581" font-size="16" font-weight="normal">Sidecar: container phụ đi</text>
<text x="30" y="608" font-size="16" font-weight="normal">kèm</text>
<text x="30" y="635" font-size="16" font-weight="normal">Service Discovery: gọi nhau</text>
<text x="30" y="662" font-size="16" font-weight="normal">qua tên</text>
<line x1="160" y1="693" x2="160" y2="721" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="16" y="731" width="288" height="182" rx="10" fill="#fef3c7" stroke="#94a3b8"/>
<text x="30" y="759" font-size="16" font-weight="bold">Loại công việc đặc</text>
<text x="30" y="786" font-size="16" font-weight="bold">biệt</text>
<text x="30" y="813" font-size="16" font-weight="normal">Batch Job: chạy một lần rồi</text>
<text x="30" y="840" font-size="16" font-weight="normal">xong</text>
<text x="30" y="867" font-size="16" font-weight="normal">Stateful Service: cần danh</text>
<text x="30" y="894" font-size="16" font-weight="normal">tính và dữ liệu</text>
<line x1="160" y1="925" x2="160" y2="953" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="16" y="963" width="288" height="155" rx="10" fill="#fee2e2" stroke="#94a3b8"/>
<text x="30" y="991" font-size="16" font-weight="bold">Muốn hệ thống tự lo</text>
<text x="30" y="1018" font-size="16" font-weight="normal">Controller: tự sửa lệch</text>
<text x="30" y="1045" font-size="16" font-weight="normal">trạng thái</text>
<text x="30" y="1072" font-size="16" font-weight="normal">Operator: controller cho</text>
<text x="30" y="1099" font-size="16" font-weight="normal">một ứng dụng cụ thể</text>
</g></svg>
