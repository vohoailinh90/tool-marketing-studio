<svg xmlns="http://www.w3.org/2000/svg" width="360" height="420" viewBox="0 0 360 420" role="img" aria-labelledby="title desc">
<title id="title">Blueprint: trình bày một thiết kế có lý do</title>
<desc id="desc">1. Chốt bài toán: Thao tác • SLO • workload: Giả định có số và đơn vị; 2. Thiết kế tối thiểu: API + dữ liệu: Vẽ đường đọc và ghi; 3. Kiểm điểm khó: Tải đỉnh • lỗi • security: Chi phí • thay đổi • rollback. Các khung là ý chính để đối chiếu, không nhất thiết là các bước tuần tự.</desc>
<rect width="360" height="420" fill="#f8fafc"/>
<g font-family="DejaVu Sans, sans-serif" fill="#0f172a">
<text x="20" y="28" font-size="18" font-weight="bold">sd-11-044 · Nhìn hình trước</text>
<rect x="12" y="48" width="336" height="102" rx="12" fill="#e0f2fe" stroke="#64748b"/>
<text x="24" y="75" font-size="18" font-weight="bold">1. Chốt bài toán</text>
<text x="24" y="104" font-size="18">Thao tác • SLO • workload</text>
<text x="24" y="130" font-size="18">Giả định có số và đơn vị</text>
<rect x="12" y="162" width="336" height="102" rx="12" fill="#dcfce7" stroke="#64748b"/>
<text x="24" y="189" font-size="18" font-weight="bold">2. Thiết kế tối thiểu</text>
<text x="24" y="218" font-size="18">API + dữ liệu</text>
<text x="24" y="244" font-size="18">Vẽ đường đọc và ghi</text>
<rect x="12" y="276" width="336" height="102" rx="12" fill="#fef3c7" stroke="#64748b"/>
<text x="24" y="303" font-size="18" font-weight="bold">3. Kiểm điểm khó</text>
<text x="24" y="332" font-size="18">Tải đỉnh • lỗi • security</text>
<text x="24" y="358" font-size="18">Chi phí • thay đổi • rollback</text>
</g>
</svg>
