<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 1014" width="320" height="1014" role="img" aria-labelledby="title desc">
<title id="title">Mười mẫu thiết kế Kubernetes</title>
<desc id="desc">Bốn thẻ xếp dọc: nền tảng (health probe, predictable demands, automated placement), cấu trúc Pod (init container, sidecar), hành vi (batch job, stateful service, service discovery) và mức cao (controller, operator).</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#475569" stroke-width="1.5"/></marker></defs>
<rect width="320" height="1014" fill="#f8fafc"/><g font-family="DejaVu Sans, Arial, sans-serif" fill="#0f172a">
<text x="16" y="30" font-size="20" font-weight="bold">10 MẪU · 4 TẦNG</text>
<text x="16" y="58" font-size="16" font-weight="normal">Cách nhóm theo sách</text>
<text x="16" y="85" font-size="16" font-weight="normal">Kubernetes Patterns</text>
<rect x="16" y="116" width="288" height="209" rx="10" fill="#dbeafe" stroke="#94a3b8"/>
<text x="30" y="144" font-size="16" font-weight="bold">1 · Nền tảng</text>
<text x="30" y="171" font-size="16" font-weight="normal">Health Probe: báo sống/sẵn</text>
<text x="30" y="198" font-size="16" font-weight="normal">sàng</text>
<text x="30" y="225" font-size="16" font-weight="normal">Predictable Demands: khai</text>
<text x="30" y="252" font-size="16" font-weight="normal">báo tài nguyên</text>
<text x="30" y="279" font-size="16" font-weight="normal">Automated Placement:</text>
<text x="30" y="306" font-size="16" font-weight="normal">scheduler chọn node</text>
<line x1="160" y1="337" x2="160" y2="365" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="16" y="375" width="288" height="155" rx="10" fill="#ede9fe" stroke="#94a3b8"/>
<text x="30" y="403" font-size="16" font-weight="bold">2 · Cấu trúc Pod</text>
<text x="30" y="430" font-size="16" font-weight="normal">Init Container: bước chuẩn</text>
<text x="30" y="457" font-size="16" font-weight="normal">bị chạy trước</text>
<text x="30" y="484" font-size="16" font-weight="normal">Sidecar: container phụ chạy</text>
<text x="30" y="511" font-size="16" font-weight="normal">cùng</text>
<line x1="160" y1="542" x2="160" y2="570" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="16" y="580" width="288" height="209" rx="10" fill="#fef3c7" stroke="#94a3b8"/>
<text x="30" y="608" font-size="16" font-weight="bold">3 · Hành vi</text>
<text x="30" y="635" font-size="16" font-weight="normal">Batch Job: việc chạy rồi</text>
<text x="30" y="662" font-size="16" font-weight="normal">kết thúc</text>
<text x="30" y="689" font-size="16" font-weight="normal">Stateful Service: có danh</text>
<text x="30" y="716" font-size="16" font-weight="normal">tính, có dữ liệu</text>
<text x="30" y="743" font-size="16" font-weight="normal">Service Discovery: tìm nhau</text>
<text x="30" y="770" font-size="16" font-weight="normal">qua tên</text>
<line x1="160" y1="801" x2="160" y2="829" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="16" y="839" width="288" height="155" rx="10" fill="#dcfce7" stroke="#94a3b8"/>
<text x="30" y="867" font-size="16" font-weight="bold">4 · Mức cao</text>
<text x="30" y="894" font-size="16" font-weight="normal">Controller: kéo trạng thái</text>
<text x="30" y="921" font-size="16" font-weight="normal">thật về trạng thái khai báo</text>
<text x="30" y="948" font-size="16" font-weight="normal">Operator: controller mang</text>
<text x="30" y="975" font-size="16" font-weight="normal">kiến thức vận hành</text>
</g></svg>
