<svg xmlns="http://www.w3.org/2000/svg" width="360" height="420" viewBox="0 0 360 420" role="img" aria-labelledby="title desc">
<title id="title">Ba mục tiêu cần phân biệt khi thiết kế hệ thống</title>
<desc id="desc">Availability: Bao nhiêu request tốt?: SLO và cửa sổ đo; Throughput: Bao nhiêu việc mỗi giây?: Đo dưới tải thực tế; Scalability: Thêm tài nguyên → thêm lực?: Theo dõi cả chi phí. Các khung là ý chính để đối chiếu, không nhất thiết là các bước tuần tự.</desc>
<rect width="360" height="420" fill="#f8fafc"/>
<g font-family="DejaVu Sans, sans-serif" fill="#0f172a">
<text x="20" y="28" font-size="18" font-weight="bold">sd-11-003 · Nhìn hình trước</text>
<rect x="12" y="48" width="336" height="102" rx="12" fill="#e0f2fe" stroke="#64748b"/>
<text x="24" y="75" font-size="18" font-weight="bold">Availability</text>
<text x="24" y="104" font-size="18">Bao nhiêu request tốt?</text>
<text x="24" y="130" font-size="18">SLO và cửa sổ đo</text>
<rect x="12" y="162" width="336" height="102" rx="12" fill="#dcfce7" stroke="#64748b"/>
<text x="24" y="189" font-size="18" font-weight="bold">Throughput</text>
<text x="24" y="218" font-size="18">Bao nhiêu việc mỗi giây?</text>
<text x="24" y="244" font-size="18">Đo dưới tải thực tế</text>
<rect x="12" y="276" width="336" height="102" rx="12" fill="#fef3c7" stroke="#64748b"/>
<text x="24" y="303" font-size="18" font-weight="bold">Scalability</text>
<text x="24" y="332" font-size="18">Thêm tài nguyên → thêm lực?</text>
<text x="24" y="358" font-size="18">Theo dõi cả chi phí</text>
</g>
</svg>
