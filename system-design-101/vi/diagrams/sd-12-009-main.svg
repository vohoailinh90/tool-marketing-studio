<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 450" width="320" height="450" role="img" aria-labelledby="title desc">
<title id="title">Hai thao tác đồng thời trên cùng văn bản</title>
<desc id="desc">Văn bản cat. Alice chèn s ở vị trí 3; Bob đồng thời xóa c ở vị trí 0. Thao tác của Alice được biến đổi thành chèn s ở vị trí 2. Mọi máy cùng thấy ats.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#475569" stroke-width="1.5"/></marker></defs>
<rect width="320" height="450" fill="#f8fafc"/>
<g font-family="DejaVu Sans, Arial, sans-serif" fill="#0f172a">
<text x="16" y="30" font-size="21" font-weight="bold">HAI NGƯỜI CÙNG SỬA</text>
<rect x="16" y="46" width="288" height="44" rx="12" fill="#e2e8f0" stroke="#94a3b8"/>
<text x="29" y="75" font-size="16" font-weight="bold">Văn bản gốc: cat</text>
<rect x="16" y="102" width="288" height="68" rx="12" fill="#dbeafe" stroke="#94a3b8"/>
<text x="29" y="131" font-size="16" font-weight="bold">Alice: chèn s ở vị trí 3</text>
<text x="29" y="155" font-size="16" font-weight="normal">Máy Alice thấy cats</text>
<rect x="16" y="182" width="288" height="68" rx="12" fill="#dbeafe" stroke="#94a3b8"/>
<text x="29" y="211" font-size="16" font-weight="bold">Bob: xóa c ở vị trí 0</text>
<text x="29" y="235" font-size="16" font-weight="normal">Máy Bob thấy at</text>
<rect x="16" y="262" width="288" height="92" rx="12" fill="#ede9fe" stroke="#94a3b8"/>
<text x="29" y="291" font-size="16" font-weight="bold">Biến đổi thao tác</text>
<text x="29" y="315" font-size="16" font-weight="normal">c đã bị xóa → chèn s lùi về</text>
<text x="29" y="339" font-size="16" font-weight="normal">vị trí 2</text>
<rect x="16" y="366" width="288" height="44" rx="12" fill="#dcfce7" stroke="#94a3b8"/>
<text x="29" y="395" font-size="16" font-weight="bold">Mọi máy hội tụ: ats</text>
<text x="16" y="438" font-size="16" font-weight="normal">Gửi thao tác, không gửi cả tài liệu.</text>
</g></svg>
