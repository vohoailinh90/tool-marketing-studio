<svg xmlns="http://www.w3.org/2000/svg" width="320" height="889" viewBox="0 0 320 889" role="img" aria-labelledby="title desc">
<title id="title">Đường ống dữ liệu lớn</title>
<desc id="desc">Ba khung. Khung một, năm chặng: thu thập, hồ dữ liệu, tính toán, kho dữ liệu, trình bày. Khung hai, các dịch vụ bài nguồn nêu: AWS dùng Kinesis, S3, EMR, Redshift, QuickSight; Azure dùng Event Hubs, Data Lake Store, Databricks, Cosmos DB, Power BI; Google Cloud dùng PubSub, Cloud Storage, DataProc và DataFlow, BigQuery, Data Studio. Khung ba, kiểm bằng hai trang của Microsoft: bảy trên mười phép ghép khớp; ba phép lệch là Cloud Storage với Data Lake Store, và hai phép kho dữ liệu với Cosmos DB.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs>
<rect width="320" height="889" fill="#f8fafc"/>
<g font-family="DejaVu Sans, Arial, sans-serif" fill="#0f172a">
