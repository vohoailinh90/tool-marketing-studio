# Mutation manifest — see scripts/mutation_check.py
#
# A passing test proves nothing on its own. These break each rule of the slide-deck claims in turn and require the
# named test to fail. A mutation that SURVIVES means the test guards nothing.

target: scripts/sd101_slides.py
note: The deck record is what stops two sessions building one lesson's slides. Each entry switches one rule off and names the test that must notice.
mutations:
- label: the other sessions' claims are never read from the remote
  find: "        names = remote_branches(context)\n        for (name, lesson_id), text in read_remote"
  replace: "        names = []\n        for (name, lesson_id), text in read_remote"
  test: tests.test_sd101_slides.ClaimTests.test_a_published_claim_keeps_every_other_session_off_the_lesson
- label: a record copied into another branch is counted as that branch's claim
  find: "elif holding.owner == name or holding.problems:  # a malformed record blocks, whoever it names"
  replace: "elif True:  # a malformed record blocks, whoever it names"
  test: tests.test_sd101_slides.ClaimTests.test_a_copy_of_a_claim_inherited_by_another_branch_is_not_a_claim
- label: the later of two claims wins instead of the earlier
  find: '    return (-first.generation, first.claimed_at or "", first.owner) < (-second.generation, second.claimed_at or "", second.owner)'
  replace: '    return (-first.generation, first.claimed_at or "", first.owner) > (-second.generation, second.claimed_at or "", second.owner)'
  test: tests.test_sd101_slides.ClaimTests.test_the_earlier_claim_wins_even_when_it_is_pushed_second
- label: a takeover does not beat the claim it took over
  find: "    if first_took != second_took:\n        return first_took\n    return (-first.generation,"
  replace: "    return (first.generation,"
  test: tests.test_sd101_slides.LeaseTests.test_a_takeover_beats_the_claim_it_took_over_even_if_the_old_owner_wakes_up
- label: a claim never goes stale
  find: "    return moment - beat > datetime.timedelta(hours=LEASE_HOURS)"
  replace: "    return moment - beat < datetime.timedelta(hours=LEASE_HOURS)"
  test: tests.test_sd101_slides.LeaseTests.test_touching_keeps_a_claim_alive
- label: a stale claim is taken over without asking
  find: "    if state == \"stale\" and not any(other.owner == context.me for other in found) and not take_stale:"
  replace: "    if False:"
  test: tests.test_sd101_slides.LeaseTests.test_a_stale_claim_blocks_nobody_until_it_is_taken_on_purpose
- label: a finished deck can be claimed again
  find: "    if state == \"done\":\n        return f\"{lesson_id}: already built by {holding.owner or 'an unknown owner'} ({holding.where})\""
  replace: "    if False:\n        return f\"{lesson_id}: already built by {holding.owner or 'an unknown owner'} ({holding.where})\""
  test: tests.test_sd101_slides.FinishTests.test_a_finished_deck_cannot_be_claimed_again
- label: a claim that was never pushed counts as published
  find: "    if not published:\n        return f\"{lesson_id}: your claim is not on"
  replace: "    if False:\n        return f\"{lesson_id}: your claim is not on"
  test: tests.test_sd101_slides.ClaimTests.test_a_claim_that_was_never_pushed_does_not_verify
- label: the default branch can be pushed
  find: "    if context.me in bases:"
  replace: "    if False:"
  test: tests.test_sd101_slides.ClaimTests.test_the_default_branch_is_never_pushed
- label: a record may name another lesson
  find: "    if record.get(\"id\") != lesson_id:"
  replace: "    if False:"
  test: tests.test_sd101_slides.FolderTests.test_a_record_for_another_lesson_or_with_a_stray_key_is_reported
- label: the size of an exported PNG is not checked
  find: "                elif png_size(path) != (width, height):"
  replace: "                elif False:"
  test: tests.test_sd101_slides.FolderTests.test_a_missing_slide_or_a_wrong_size_is_reported
- label: exports not recorded as done may sit in the folder
  find: "            problems.append(f\"{name} is not expected here\" + (\"\" if exported else \" (exports are not recorded as done)\"))"
  replace: "            pass"
  test: tests.test_sd101_slides.FolderTests.test_pending_exports_leave_only_the_record
- label: a timestamp YAML turned into a datetime is not read back as text
  find: "        if isinstance(data.get(key), datetime.datetime):  # YAML reads"
  replace: "        if False:  # YAML reads"
  test: tests.test_sd101_slides.FolderTests.test_a_hand_written_timestamp_without_quotes_is_still_a_timestamp
- label: a claim its owner released is kept alive by the copy merged into the default branch
  find: "                if holding.status == \"doing\" and holding.owner in names and holding.owner != base:"
  replace: "                if False:"
  test: tests.test_sd101_slides.ClaimTests.test_a_claim_released_on_its_own_branch_is_not_kept_alive_by_the_copy_merged_into_main
- label: a record that fails validation is ignored instead of holding its lesson
  find: "                warnings.append(f\"{where}: {lesson_id}/{SLIDES_DIR}/{RECORD} {'; '.join(holding.problems)}\")"
  replace: "                warnings.append(f\"{where}: {lesson_id}/{SLIDES_DIR}/{RECORD} {'; '.join(holding.problems)}\")\n                continue"
  test: tests.test_sd101_slides.ClaimTests.test_a_done_record_edited_into_an_invalid_one_still_holds_its_lesson
- label: a record that cannot be read does not block its lesson
  find: "    invalid = [holding for holding in holdings if is_broken(holding)]\n    if invalid:\n        return \"invalid\", invalid[0]\n"
  replace: ""
  test: tests.test_sd101_slides.ClaimTests.test_a_record_that_cannot_be_read_blocks_its_lesson_until_it_is_fixed
- label: a generation without taken_from is accepted
  find: "    elif (\"taken_from\" in record) != (\"generation\" in record):"
  replace: "    elif False:"
  test: tests.test_sd101_slides.FolderTests.test_generation_and_taken_from_come_together_and_never_name_the_owner
- label: release leaves other files behind in slides/
  find: "        if stray:"
  replace: "        if False:"
  test: tests.test_sd101_slides.FinishTests.test_release_refuses_to_leave_other_files_behind_in_slides
- label: my own stale claim needs a takeover when an older stale claim exists
  find: "    if state == \"stale\" and not any(other.owner == context.me for other in found) and not take_stale:"
  replace: "    if state == \"stale\" and holding.owner != context.me and not take_stale:"
  test: tests.test_sd101_slides.LeaseTests.test_my_own_stale_claim_can_be_claimed_again_when_an_older_stale_claim_exists
- label: an unreadable record on a feature branch is dropped because it names no owner
  find: "elif holding.owner == name or holding.problems:  # a malformed record blocks, whoever it names"
  replace: "elif holding.owner == name:  # a malformed record blocks, whoever it names"
  test: tests.test_sd101_slides.ClaimTests.test_an_unreadable_record_on_a_feature_branch_blocks_its_lesson
- label: a deck may have any number of slides from 4 to 12
  find: "SLIDE_COUNTS = range(8, 11)"
  replace: "SLIDE_COUNTS = range(4, 13)"
  test: tests.test_sd101_slides.FolderTests.test_a_deck_has_between_eight_and_ten_slides
- label: finish does not look for an earlier claim pushed while it published
  find: "        if rivals:"
  replace: "        if False:"
  test: tests.test_sd101_slides.FinishTests.test_finish_reports_an_earlier_claim_that_was_pushed_while_it_published
- label: a record with a valid status but no owner is dropped from a feature branch
  find: "or holding.problems:  # a malformed record blocks, whoever it names"
  replace: "or (holding.problems and holding.status == \"invalid\"):  # a malformed record blocks, whoever it names"
  test: tests.test_sd101_slides.ClaimTests.test_a_parseable_record_without_an_owner_or_with_an_unknown_status_blocks_its_lesson
- label: a malformed record that names another owner is dropped from a feature branch
  find: "or holding.problems:  # a malformed record blocks, whoever it names"
  replace: "or (holding.problems and not holding.owner):  # a malformed record blocks, whoever it names"
  test: tests.test_sd101_slides.ClaimTests.test_a_parseable_record_without_an_owner_or_with_an_unknown_status_blocks_its_lesson
- label: offline mode may publish the default branch
  find: "    if context.me in bases:"
  replace: "    if context.me in bases and not context.offline:"
  test: tests.test_sd101_slides.ClaimTests.test_offline_never_publishes_the_default_branch
- label: any deck size is accepted
  find: "    if record.get(\"size\") != DECK_SIZE:"
  replace: "    if False:"
  test: tests.test_sd101_slides.FolderTests.test_a_deck_has_the_documented_size
- label: a finished rival is not compared after publishing
  find: "holding.status in (\"doing\", \"done\") and holding.owner != context.me"
  replace: "holding.status == \"doing\" and holding.owner != context.me"
  test: tests.test_sd101_slides.FinishTests.test_finish_reports_an_earlier_claimant_that_finished_while_it_published
- label: offline drops the records of other owners that the checkout holds
  find: "            if holding.owner == context.me or context.offline or holding.problems:"
  replace: "            if holding.owner == context.me or holding.problems:"
  test: tests.test_sd101_slides.FinishTests.test_offline_honours_the_records_a_checkout_already_holds
- label: a key named twice in a record is silently resolved to the last one
  find: "        data = yaml.load(text, Loader=StrictLoader)  # noqa: S506 - StrictLoader is a SafeLoader"
  replace: "        data = yaml.safe_load(text)"
  test: tests.test_sd101_slides.FolderTests.test_a_key_named_twice_makes_the_record_unreadable
- label: a malformed record in the checkout does not block the claim
  find: " or context.offline or holding.problems:"
  replace: " or context.offline:"
  test: tests.test_sd101_slides.ClaimTests.test_a_malformed_record_in_my_own_checkout_blocks_the_claim_and_is_left_alone
- label: finish ignores an unreadable record that appeared while it published
  find: "        if broken:"
  replace: "        if False:"
  test: tests.test_sd101_slides.FinishTests.test_finish_reports_an_unreadable_record_that_appeared_while_it_published
- label: my own published record is trusted even when it fails validation
  find: "            if holding.problems:  # the published copy and the one in this tree"
  replace: "            if False:  # the published copy and the one in this tree"
  test: tests.test_sd101_slides.ClaimTests.test_a_published_claim_that_fails_validation_is_not_a_claim_that_verifies
- label: a damaged copy of my own claim in this tree is skipped because the pushed copy is fine
  find: "        if holding.owner == context.me and holding.status == \"doing\":\n            if holding.problems:"
  replace: "        if holding.owner == context.me and holding.status == \"doing\" and holding.where != LOCAL:\n            if holding.problems:"
  test: tests.test_sd101_slides.ClaimTests.test_a_damaged_copy_of_my_claim_in_this_tree_does_not_verify_touch_or_finish
- label: a finished deck may lose the time of its claim
  find: "    if parse_stamp(record.get(\"claimed_at\")) is None:  # a finished deck keeps"
  replace: "    if \"claimed_at\" in record and parse_stamp(record[\"claimed_at\"]) is None:  # a finished deck keeps"
  test: tests.test_sd101_slides.FolderTests.test_a_finished_deck_keeps_the_time_of_its_claim
- label: a PNG with no IEND chunk passes
  find: "    if not finished:\n        return \"no IEND chunk\""
  replace: "    if False:\n        return \"no IEND chunk\""
  test: tests.test_sd101_slides.FolderTests.test_a_png_that_is_not_whole_is_reported
- label: a PNG chunk with a wrong checksum passes
  find: "        if zlib.crc32(data[position + 4:end]) != struct.unpack(\">I\", data[end:end + 4])[0]:"
  replace: "        if False:"
  test: tests.test_sd101_slides.FolderTests.test_a_png_that_is_not_whole_is_reported
- label: bytes after the IEND chunk pass
  find: "        if finished:\n            return \"bytes after IEND\""
  replace: "        if False:\n            return \"bytes after IEND\""
  test: tests.test_sd101_slides.FolderTests.test_a_png_that_is_not_whole_is_reported
- label: a PNG whose image stream stops early passes
  find: "    if not images or not inflater.eof:"
  replace: "    if not images:"
  test: tests.test_sd101_slides.FolderTests.test_a_png_that_is_not_whole_is_reported
- label: a PNG that does not start with IHDR passes
  find: "        if first and (kind != b\"IHDR\" or length != 13):"
  replace: "        if False:"
  test: tests.test_sd101_slides.FolderTests.test_a_png_that_is_not_whole_is_reported
- label: a ZIP archive without the parts of a presentation passes as a PPTX
  find: "    return f\"{', '.join(missing)} missing\" if missing else None"
  replace: "    return None"
  test: tests.test_sd101_slides.FolderTests.test_a_zip_without_the_parts_of_a_presentation_is_not_a_pptx
- label: a PPTX with a damaged member passes
  find: "    if damaged:\n        return f\"{damaged} is damaged\""
  replace: "    if False:\n        return f\"{damaged} is damaged\""
  test: tests.test_sd101_slides.FolderTests.test_a_pptx_with_a_damaged_member_is_reported
- label: a malformed record that is not unreadable is not rechecked after finishing
  find: "        broken = [holding for holding in remote if is_broken(holding) and holding.owner != context.me]"
  replace: "        broken = [holding for holding in remote if holding.status == \"invalid\" and holding.owner != context.me]"
  test: tests.test_sd101_slides.FinishTests.test_finish_reports_a_malformed_claim_that_appeared_while_it_published
- label: a replaced byte is accepted in a remote record
  find: "                        found[pair] = output[position:position + size].decode(\"utf-8\")"
  replace: "                        found[pair] = output[position:position + size].decode(\"utf-8\", \"replace\")"
  test: tests.test_sd101_slides.ClaimTests.test_an_invalid_utf8_record_or_a_directory_in_its_place_blocks_the_lesson
- label: a directory in place of a record is treated as absent
  find: "                found[pair] = None\n                if fields[1] == b\"blob\":"
  replace: "                if fields[1] == b\"blob\":"
  test: tests.test_sd101_slides.ClaimTests.test_an_invalid_utf8_record_or_a_directory_in_its_place_blocks_the_lesson
- label: two claims that each name the other as taken_from both beat each other
  find: "    if first_took != second_took:\n        return first_took\n"
  replace: "    if first_took:\n        return True\n    if second_took:\n        return False\n"
  test: tests.test_sd101_slides.LeaseTests.test_two_sessions_that_reclaim_each_others_expired_claims_at_once_still_have_one_winner
- label: a session that reclaims a lesson taken from it names itself as its own ancestor
  find: " for item in (other.owner, *other.taken_from) if item != context.me})"
  replace: " for item in (other.owner, *other.taken_from)})"
  test: tests.test_sd101_slides.LeaseTests.test_an_owner_who_reclaims_a_lesson_taken_from_it_is_not_its_own_ancestor
- label: a malformed record in the checkout that names another owner does not block the claim
  find: " or context.offline or holding.problems:"
  replace: " or context.offline or (holding.problems and not holding.owner):"
  test: tests.test_sd101_slides.ClaimTests.test_a_malformed_record_in_my_checkout_blocks_the_claim_even_when_it_names_another_owner
- label: a failed git add is ignored and the unchanged HEAD is pushed
  find: "        if added.returncode != 0:"
  replace: "        if False:"
  test: tests.test_sd101_slides.FinishTests.test_a_staging_failure_stops_publishing_instead_of_pushing_nothing
- label: a path that is nowhere in the repository is staged anyway
  find: "               if (context.root / item).exists() or git_text(context.root, \"ls-files\", \"--\", item)]"
  replace: "               if True]"
  test: tests.test_sd101_slides.FinishTests.test_a_claim_that_was_never_pushed_can_be_released_and_pushed
- label: a deleted record is not staged when it is gone from the disk
  find: " or git_text(context.root, \"ls-files\", \"--\", item)]"
  replace: "]"
  test: tests.test_sd101_slides.FinishTests.test_release_gives_a_claim_back_but_never_a_finished_deck
