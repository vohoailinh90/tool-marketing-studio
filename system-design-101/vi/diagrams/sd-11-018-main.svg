<svg xmlns="http://www.w3.org/2000/svg" width="360" height="420" viewBox="0 0 360 420" role="img" aria-labelledby="title desc">
<title id="title">Monorepo hay nhiều repo nhỏ?</title>
<desc id="desc">Monorepo: Đổi nhiều phần trong một commit: Cần ownership + build graph; Nhiều repo: Quyền và phát hành riêng: Cần phối hợp dependency; Tiêu chí chọn: Ranh giới đội và quyền: Tương thích + tốc độ build. Các khung là ý chính để đối chiếu, không nhất thiết là các bước tuần tự.</desc>
<rect width="360" height="420" fill="#f8fafc"/>
<g font-family="DejaVu Sans, sans-serif" fill="#0f172a">
<text x="20" y="28" font-size="18" font-weight="bold">sd-11-018 · Nhìn hình trước</text>
<rect x="12" y="48" width="336" height="102" rx="12" fill="#e0f2fe" stroke="#64748b"/>
<text x="24" y="75" font-size="18" font-weight="bold">Monorepo</text>
<text x="24" y="104" font-size="18">Đổi nhiều phần trong một commit</text>
<text x="24" y="130" font-size="18">Cần ownership + build graph</text>
<rect x="12" y="162" width="336" height="102" rx="12" fill="#dcfce7" stroke="#64748b"/>
<text x="24" y="189" font-size="18" font-weight="bold">Nhiều repo</text>
<text x="24" y="218" font-size="18">Quyền và phát hành riêng</text>
<text x="24" y="244" font-size="18">Cần phối hợp dependency</text>
<rect x="12" y="276" width="336" height="102" rx="12" fill="#fef3c7" stroke="#64748b"/>
<text x="24" y="303" font-size="18" font-weight="bold">Tiêu chí chọn</text>
<text x="24" y="332" font-size="18">Ranh giới đội và quyền</text>
<text x="24" y="358" font-size="18">Tương thích + tốc độ build</text>
</g>
</svg>
