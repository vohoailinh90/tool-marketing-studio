<circle cx="43" cy="574" r="11" fill="#16a34a"/>
<polyline points="37.9,574.4 41.7,578.4 48.5,570" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="577.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Hiệu năng.</text>
