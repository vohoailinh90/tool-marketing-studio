# Mutation manifest — see scripts/mutation_check.py
#
# A passing test proves nothing on its own. These break each rule of the figure toolkit in turn
# and require the named test to fail. A mutation that SURVIVES means the test guards nothing.

target: scripts/figures/text.py
note: Every writer escapes and breaks text here, so a sentence stays a sentence and a long word cannot leave its box.
mutations:
- label: control characters are written into the file
  find: 'return escape(XML_BAD.sub("", str(text)), {''"'': "&quot;"})'
  replace: 'return escape(str(text), {''"'': "&quot;"})'
  test: tests.test_figures.SvgTests.test_hostile_text_stays_text_everywhere
- label: a word wider than the box is left to overflow
  find: 'if cur and not combining(ch) and width(cur + ch, px * scale, bold) > max_w:'
  replace: 'if False:'
  test: tests.test_figures.SceneTests.test_wrap_never_changes_the_text_or_overflows_a_box
- label: text is not composed, so a decomposed accent can be cut off
  find: return unicodedata.normalize("NFC", re.sub(r"\s+", " ", str(text)).strip())
  replace: return re.sub(r"\s+", " ", str(text)).strip()
  test: tests.test_figures.TextTests.test_text_is_composed_before_it_is_measured_and_drawn
- label: a combining mark is measured as a letter
  find: "    if zero_mark(c):\n        return 0.0"
  replace: "    if False:\n        return 0.0"
  test: tests.test_figures.TextTests.test_a_combining_mark_advances_nothing_and_never_starts_a_line
- label: every mark of every script is measured at no advance
  find: "    if zero_mark(c):\n        return 0.0"
  replace: "    if combining(c):\n        return 0.0"
  test: tests.test_figures.TextTests.test_only_the_marks_measured_at_no_advance_are_measured_at_none
- label: any mark counts as measurable
  find: 'or c in _OTHER or zero_mark(c):'
  replace: 'or c in _OTHER or combining(c):'
  test: tests.test_figures.SpecTests.test_a_mark_that_advances_in_the_font_is_refused_with_its_letter_and_the_accents_are_not
- label: the measured accents reach past U+034E
  find: 'ZERO_MARKS = ((0x0300, 0x034E),)'
  replace: 'ZERO_MARKS = ((0x0300, 0x036F),)'
  test: tests.test_figures.TextTests.test_only_the_marks_measured_at_no_advance_are_measured_at_none
- label: the variation selectors count as measured marks
  find: 'ZERO_MARKS = ((0x0300, 0x034E),)'
  replace: 'ZERO_MARKS = ((0x0300, 0x034E), (0xFE00, 0xFE0F))'
  test: tests.test_figures.SpecTests.test_a_mark_that_advances_in_the_font_is_refused_with_its_letter_and_the_accents_are_not
- label: a spacing mark is listed as measured, though the font gives it an advance
  find: 'ZERO_MARKS = ((0x0300, 0x034E),)'
  replace: 'ZERO_MARKS = ((0x0300, 0x034E), (0x0903, 0x0903))'
  test: tests.test_figures.BrowserTests.test_the_marks_a_figure_may_use_advance_nothing_in_the_real_font
- label: a line may end before a combining mark
  find: if cur and not combining(ch) and width(
  replace: if cur and width(
  test: tests.test_figures.TextTests.test_a_combining_mark_advances_nothing_and_never_starts_a_line
- label: an emoji counts as measurable
  find: '        return ord(c) < 0x1F000'
  replace: '        return True'
  test: tests.test_figures.TextTests.test_only_what_the_width_table_knows_is_measurable
- label: any character that is not ASCII counts as measurable
  find: '    return " " <= base <= "~" and base != c'
  replace: '    return True'
  test: tests.test_figures.TextTests.test_only_what_the_width_table_knows_is_measurable
- label: a symbol is measured with the fallback width
  find: "    if c in _OTHER:\n        return _OTHER[c][bold] / 1000"
  replace: "    if False:\n        return _OTHER[c][bold] / 1000"
  test: tests.test_figures.TextTests.test_symbols_and_vietnamese_capital_d_are_measured_at_least_as_wide_as_the_font_draws_them
