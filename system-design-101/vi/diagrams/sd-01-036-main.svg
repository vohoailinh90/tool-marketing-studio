<svg xmlns="http://www.w3.org/2000/svg" width="320" height="550" viewBox="0 0 320 550" role="img" aria-labelledby="title desc"><title id="title">Proxy đại diện phía nào?</title><desc id="desc">Hai ví dụ riêng: forward proxy phục vụ máy cơ quan đi ra; reverse proxy phục vụ website thư viện đi vào. Mũi tên chỉ yêu cầu, không vẽ phản hồi.</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#334155"/></marker></defs><rect width="320" height="550" fill="#f8fafc"/><g font-family="Arial, sans-serif" font-size="16" fill="#0f172a"><text x="16" y="30" font-size="20" font-weight="bold">Đại diện phía nào?</text>
