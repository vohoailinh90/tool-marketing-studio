<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 518" width="320" height="518" role="img" aria-labelledby="title desc">
<title id="title">Năm chiến lược triển khai phổ biến</title>
<desc id="desc">Ba nhóm theo cách quay lui: blue-green và feature toggle quay lui gần như tức thì, rolling và canary lộ dần và dừng giữa chừng, big bang lộ hết cùng lúc.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#475569" stroke-width="1.5"/></marker></defs>
<rect width="320" height="518" fill="#f8fafc"/><g font-family="DejaVu Sans, Arial, sans-serif" fill="#0f172a">
<text x="16" y="30" font-size="20" font-weight="bold">THEO MỨC LỘ VÀ QUAY</text>
<text x="16" y="58" font-size="20" font-weight="bold">LUI</text>
<text x="16" y="86" font-size="16" font-weight="normal">Năm chiến lược trong ba nhóm</text>
<rect x="16" y="117" width="288" height="128" rx="10" fill="#dcfce7" stroke="#94a3b8"/>
<text x="30" y="145" font-size="16" font-weight="bold">Quay lui gần tức thì</text>
<text x="30" y="172" font-size="16" font-weight="normal">Blue-Green: chuyển lại</text>
<text x="30" y="199" font-size="16" font-weight="normal">traffic</text>
<text x="30" y="226" font-size="16" font-weight="normal">Feature Toggle: tắt cờ</text>
<rect x="16" y="257" width="288" height="128" rx="10" fill="#fef3c7" stroke="#94a3b8"/>
<text x="30" y="285" font-size="16" font-weight="bold">Lộ dần, dừng được giữa</text>
<text x="30" y="312" font-size="16" font-weight="bold">chừng</text>
<text x="30" y="339" font-size="16" font-weight="normal">Canary: một nhóm nhỏ trước</text>
<text x="30" y="366" font-size="16" font-weight="normal">Rolling: thay từng nhóm máy</text>
<rect x="16" y="397" width="288" height="101" rx="10" fill="#fee2e2" stroke="#94a3b8"/>
<text x="30" y="425" font-size="16" font-weight="bold">Lộ hết cùng lúc</text>
<text x="30" y="452" font-size="16" font-weight="normal">Big Bang: quay lui nghĩa là</text>
<text x="30" y="479" font-size="16" font-weight="normal">triển khai lại</text>
</g></svg>
