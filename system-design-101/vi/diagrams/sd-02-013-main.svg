<svg xmlns="http://www.w3.org/2000/svg" width="320" height="1033" viewBox="0 0 320 1033" role="img" aria-labelledby="title desc">
<title id="title">Hệ thống thông báo đi qua những chặng nào?</title>
<desc id="desc">Hai khung bước. Khung một, vào và xử lý: các dịch vụ nghiệp vụ gửi thông báo tới cổng thông báo, từng cái hoặc theo lô; dịch vụ phân phối kiểm tra, định dạng theo mẫu và lên lịch theo kênh người dùng chọn; thông báo vào bộ định tuyến, thường là hàng đợi tin nhắn. Khung hai, ra và đo: dịch vụ kênh gửi qua trong ứng dụng, email, SMS, mạng xã hội; dịch vụ theo dõi và phân tích ghi số liệu cho đội vận hành. Khung ba nêu ba điều cần nhớ.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs>
<rect width="320" height="1033" fill="#f8fafc"/>
<g font-family="DejaVu Sans, Arial, sans-serif" fill="#0f172a">
<text x="16" y="34" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">Hệ thống thông báo đi</text>
<text x="16" y="58" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">qua những chặng nào?</text>
<text x="16" y="84.2" font-size="15" fill="#475569" font-weight="normal" text-anchor="start">Một cổng vào, nhiều kênh ra.</text>
<rect x="8" y="104" width="304" height="382" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="132.2" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Vào và xử lý</text>
<rect x="20" y="149" width="280" height="87" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="46" cy="175" r="14" fill="#1d4ed8"/>
<text x="46" y="180.5" font-size="16" fill="#ffffff" font-weight="bold" text-anchor="middle">1</text>
<text x="70" y="175.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Cổng thông báo</text>
<text x="70" y="199.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Nhận từ dịch vụ nghiệp vụ:</text>
<text x="70" y="218.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">từng cái hoặc theo lô.</text>
<rect x="20" y="258" width="280" height="107" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="46" cy="284" r="14" fill="#1d4ed8"/>
<text x="46" y="289.5" font-size="16" fill="#ffffff" font-weight="bold" text-anchor="middle">2</text>
<text x="70" y="284.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Dịch vụ phân phối</text>
<text x="70" y="308.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Kiểm tra, định dạng theo</text>
<text x="70" y="327.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">mẫu, lên lịch theo kênh ưa</text>
<text x="70" y="347.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">thích.</text>
<polyline points="46,238 46,256" fill="none" stroke="#334155" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="20" y="387" width="280" height="87" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="46" cy="413" r="14" fill="#1d4ed8"/>
<text x="46" y="418.5" font-size="16" fill="#ffffff" font-weight="bold" text-anchor="middle">3</text>
<text x="70" y="413.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Bộ định tuyến</text>
<text x="70" y="437.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Thường là hàng đợi tin</text>
<text x="70" y="456.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">nhắn.</text>
<polyline points="46,367 46,385" fill="none" stroke="#334155" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="8" y="498" width="304" height="253" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="526.1" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Ra và đo</text>
<rect x="20" y="543" width="280" height="87" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
<circle cx="46" cy="569" r="14" fill="#0f766e"/>
<text x="46" y="574.5" font-size="16" fill="#ffffff" font-weight="bold" text-anchor="middle">1</text>
<text x="70" y="569.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Dịch vụ kênh</text>
<text x="70" y="593.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Trong ứng dụng, email,</text>
<text x="70" y="612.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">SMS, mạng xã hội.</text>
<rect x="20" y="652" width="280" height="87" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
<circle cx="46" cy="678" r="14" fill="#0f766e"/>
<text x="46" y="683.5" font-size="16" fill="#ffffff" font-weight="bold" text-anchor="middle">2</text>
<text x="70" y="678.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Theo dõi và phân tích</text>
<text x="70" y="702.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Ghi số liệu gửi; đội vận</text>
<text x="70" y="721.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">hành xem báo cáo.</text>
<polyline points="46,632 46,650" fill="none" stroke="#334155" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="8" y="763" width="304" height="262" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="791.1" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Nhớ gì</text>
<rect x="20" y="808" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="831" r="11" fill="#16a34a"/>
<polyline points="37.9,831.4 41.7,835.4 48.5,827" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="834.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Mẫu và kênh ưa thích được</text>
<text x="64" y="853.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">định nghĩa trước.</text>
<rect x="20" y="879" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="902" r="11" fill="#16a34a"/>
<polyline points="37.9,902.4 41.7,906.4 48.5,898" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="905.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Hàng đợi tách phần xử lý</text>
<text x="64" y="924.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">khỏi từng kênh.</text>
<rect x="20" y="950" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="973" r="11" fill="#16a34a"/>
<polyline points="37.9,973.4 41.7,977.4 48.5,969" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="976.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Số liệu gửi quay lại để cải</text>
<text x="64" y="995.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">thiện trải nghiệm.</text>
</g>
</svg>
