<svg xmlns="http://www.w3.org/2000/svg" width="320" height="1149" viewBox="0 0 320 1149" role="img" aria-labelledby="title desc">
<title id="title">Ba mức sao và ba ví dụ dùng thật</title>
<desc id="desc">Hai nhóm thẻ và một khung ghi nhớ. Ba mức sao: năm sao là rất quan trọng, cố hiểu nó chạy thế nào và vì sao; ba sao là quan trọng ở mức nào đó, có thể không cần chi tiết cài đặt; một sao là nâng cao, nên biết với ứng viên cấp cao. Ba ví dụ dùng thật: bộ lọc Bloom giúp Cassandra bỏ qua tệp dữ liệu chắc chắn không chứa khóa; băm nhất quán trên vòng token giúp Cassandra chuyển ít khóa khi đổi số nút; giao thức Raft giúp một cụm nút giữ chung một nhật ký nhân bản trong thư viện etcd-io/raft. Khung cuối nêu ba điều cần nhớ.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs>
<rect width="320" height="1149" fill="#f8fafc"/>
<g font-family="DejaVu Sans, Arial, sans-serif" fill="#0f172a">
<text x="16" y="34" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">Ba mức sao và ba ví dụ</text>
<text x="16" y="58" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">dùng thật</text>
<text x="16" y="84.2" font-size="15" fill="#475569" font-weight="normal" text-anchor="start">Thang sao của tác giả, rồi ba thuật</text>
<text x="16" y="103.8" font-size="15" fill="#475569" font-weight="normal" text-anchor="start">toán trong tài liệu của hệ thống thật.</text>
<rect x="8" y="123" width="304" height="346" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="151.2" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Ba mức sao</text>
<rect x="20" y="168" width="280" height="87" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="50" cy="211.5" r="18" fill="#1d4ed8"/><g transform="translate(39.2 200.7) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15.914 4a1.5 1.5 0 00-2.474-1.561l-9 9A1.5 1.5 0 005.5 14h4.002a.5.5 0 01.471.666L8.086 20a1.5 1.5 0 002.475 1.56l9-9A1.5 1.5 0 0018.5 10h-3.997a.5.5 0 01-.472-.667z"/></g>
<text x="78" y="194.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Năm sao</text>
<text x="78" y="218.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Rất quan trọng: hiểu chạy</text>
<text x="78" y="237.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">thế nào và vì sao.</text>
<rect x="20" y="269" width="280" height="87" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="50" cy="312.5" r="18" fill="#1d4ed8"/><g transform="translate(39.2 301.7) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 14 4-4"/><path d="M3.34 19a10 10 0 1 1 17.32 0"/></g>
<text x="78" y="295.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Ba sao</text>
<text x="78" y="319.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Quan trọng ở mức nào đó;</text>
<text x="78" y="338.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">chi tiết cài đặt có thể bỏ.</text>
<rect x="20" y="370" width="280" height="87" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="50" cy="413.5" r="18" fill="#1d4ed8"/><g transform="translate(39.2 402.7) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 18V5"/><path d="M15 13a4.17 4.17 0 0 1-3-4 4.17 4.17 0 0 1-3 4"/><path d="M17.598 6.5A3 3 0 1 0 12 5a3 3 0 1 0-5.598 1.5"/><path d="M17.997 5.125a4 4 0 0 1 2.526 5.77"/><path d="M18 18a4 4 0 0 0 2-7.464"/><path d="M19.967 17.483A4 4 0 1 1 12 18a4 4 0 1 1-7.967-.517"/><path d="M6 18a4 4 0 0 1-2-7.464"/><path d="M6.003 5.125a4 4 0 0 0-2.526 5.77"/></g>
<text x="78" y="396.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Một sao</text>
<text x="78" y="420.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Nâng cao; nên biết với ứng</text>
<text x="78" y="439.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">viên cấp cao.</text>
<rect x="8" y="481" width="304" height="346" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="509.2" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Ba ví dụ dùng thật</text>
<rect x="20" y="526" width="280" height="87" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
<circle cx="50" cy="569.5" r="18" fill="#0f766e"/><g transform="translate(39.2 558.7) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21 21-4.34-4.34"/><circle cx="11" cy="11" r="8"/></g>
<text x="78" y="552.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Bộ lọc Bloom</text>
<text x="78" y="576.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Cassandra bỏ qua tệp chắc</text>
<text x="78" y="595.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">chắn không chứa khóa.</text>
<rect x="20" y="627" width="280" height="87" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
<circle cx="50" cy="670.5" r="18" fill="#0f766e"/><g transform="translate(39.2 659.7) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" x2="20" y1="9" y2="9"/><line x1="4" x2="20" y1="15" y2="15"/><line x1="10" x2="8" y1="3" y2="21"/><line x1="16" x2="14" y1="3" y2="21"/></g>
<text x="78" y="653.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Băm nhất quán</text>
<text x="78" y="677.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Đổi số nút chỉ chuyển một</text>
<text x="78" y="696.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">phần nhỏ khóa.</text>
<rect x="20" y="728" width="280" height="87" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
<circle cx="50" cy="771.5" r="18" fill="#0f766e"/><g transform="translate(39.2 760.7) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><path d="M16 3.128a4 4 0 0 1 0 7.744"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><circle cx="9" cy="7" r="4"/></g>
<text x="78" y="754.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Raft</text>
<text x="78" y="778.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Cụm nút giữ chung một</text>
<text x="78" y="797.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">nhật ký nhân bản.</text>
<rect x="8" y="839" width="304" height="302" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="867.1" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Nhớ gì</text>
<rect x="20" y="884" width="280" height="83" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="907" r="11" fill="#16a34a"/>
<polyline points="37.9,907.4 41.7,911.4 48.5,903" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="910.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Hiểu thuật toán được dùng ở</text>
<text x="64" y="929.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">đâu quan trọng hơn chi tiết</text>
<text x="64" y="949.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">cài đặt.</text>
<rect x="20" y="975" width="280" height="83" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="998" r="11" fill="#16a34a"/>
<polyline points="37.9,998.4 41.7,1002.4 48.5,994" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="1001.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Xếp hạng khách quan rất</text>
<text x="64" y="1020.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">khó; thang sao là ý kiến của</text>
<text x="64" y="1040.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">tác giả.</text>
<rect x="20" y="1066" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="1089" r="11" fill="#16a34a"/>
<polyline points="37.9,1089.4 41.7,1093.4 48.5,1085" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="1092.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Ba ví dụ do bài chọn, không</text>
<text x="64" y="1111.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">gán sao.</text>
</g>
</svg>
