<svg xmlns="http://www.w3.org/2000/svg" width="320" height="1698" viewBox="0 0 320 1698" role="img" aria-labelledby="title desc">
<title id="title">Ba cách một chương trình chạy</title>
<desc id="desc">Bốn nhóm xếp dọc. Biên dịch như C, C++, Go, hai bước: biên dịch trước thành mã máy; bộ xử lý thực thi thẳng. Bytecode như Java, ba bước: biên dịch thành bytecode; JVM nạp và chạy; tùy chọn, JIT biến đoạn chạy nhiều thành mã máy. C# theo bài nguồn cùng nhóm nhưng đi đường riêng, ba bước: biên dịch thành CIL; CLR nạp CIL; bắt buộc chuyển CIL sang mã máy trước khi chạy, thường bằng JIT hoặc biên dịch trước. Thông dịch như Python, JavaScript, Ruby, hai bước: chạy thẳng mã nguồn; trình thông dịch đọc và chạy khi cần. Khung cuối nêu ba điều cần nhớ.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs>
<rect width="320" height="1698" fill="#f8fafc"/>
<g font-family="DejaVu Sans, Arial, sans-serif" fill="#0f172a">
<text x="16" y="34" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">Ba cách một chương</text>
<text x="16" y="58" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">trình chạy</text>
<text x="16" y="84.2" font-size="15" fill="#475569" font-weight="normal" text-anchor="start">Biên dịch, bytecode, thông dịch.</text>
<rect x="8" y="104" width="304" height="234" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="132.2" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Biên dịch · C, C++, Go</text>
<rect x="20" y="149" width="280" height="87" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="46" cy="175" r="14" fill="#1d4ed8"/>
<text x="46" y="180.5" font-size="16" fill="#ffffff" font-weight="bold" text-anchor="middle">1</text>
<text x="70" y="175.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Biên dịch trước</text>
<text x="70" y="199.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Chương trình thành mã</text>
<text x="70" y="218.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">máy, trước khi chạy.</text>
<rect x="20" y="258" width="280" height="68" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="46" cy="284" r="14" fill="#1d4ed8"/>
<text x="46" y="289.5" font-size="16" fill="#ffffff" font-weight="bold" text-anchor="middle">2</text>
<text x="70" y="284.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Bộ xử lý</text>
<text x="70" y="308.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Thực thi thẳng mã máy.</text>
<polyline points="46,238 46,256" fill="none" stroke="#334155" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="8" y="350" width="304" height="362" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="378.2" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Bytecode · Java</text>
<rect x="20" y="395" width="280" height="87" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
<circle cx="46" cy="421" r="14" fill="#0f766e"/>
<text x="46" y="426.5" font-size="16" fill="#ffffff" font-weight="bold" text-anchor="middle">1</text>
<text x="70" y="421.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Biên dịch</text>
<text x="70" y="445.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Mã nguồn thành bytecode,</text>
<text x="70" y="464.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">dạng trung gian.</text>
<rect x="20" y="504" width="280" height="87" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
<circle cx="46" cy="530" r="14" fill="#0f766e"/>
<text x="46" y="535.5" font-size="16" fill="#ffffff" font-weight="bold" text-anchor="middle">2</text>
<text x="70" y="530.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">JVM</text>
<text x="70" y="554.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Máy ảo nạp và chạy</text>
<text x="70" y="573.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">bytecode.</text>
<polyline points="46,484 46,502" fill="none" stroke="#334155" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="20" y="613" width="280" height="87" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
<circle cx="46" cy="639" r="14" fill="#0f766e"/>
<text x="46" y="644.5" font-size="16" fill="#ffffff" font-weight="bold" text-anchor="middle">3</text>
<text x="70" y="639.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">JIT, tùy chọn</text>
<text x="70" y="663.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Đoạn chạy nhiều thành mã</text>
<text x="70" y="682.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">máy lúc chạy.</text>
<polyline points="46,593 46,611" fill="none" stroke="#334155" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="8" y="724" width="304" height="385" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="752.1" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Mã trung gian · C# (cùng</text>
<text x="20" y="774.2" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">nhóm theo nguồn)</text>
<rect x="20" y="791" width="280" height="87" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
<circle cx="46" cy="817" r="14" fill="#b45309"/>
<text x="46" y="822.5" font-size="16" fill="#ffffff" font-weight="bold" text-anchor="middle">1</text>
<text x="70" y="817.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Biên dịch</text>
<text x="70" y="841.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Mã nguồn thành CIL, dạng</text>
<text x="70" y="860.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">trung gian.</text>
<rect x="20" y="900" width="280" height="68" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
<circle cx="46" cy="926" r="14" fill="#b45309"/>
<text x="46" y="931.5" font-size="16" fill="#ffffff" font-weight="bold" text-anchor="middle">2</text>
<text x="70" y="926.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">CLR</text>
<text x="70" y="950.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Môi trường chạy nạp CIL.</text>
<polyline points="46,880 46,898" fill="none" stroke="#334155" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="20" y="990" width="280" height="107" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
<circle cx="46" cy="1016" r="14" fill="#b45309"/>
<text x="46" y="1021.5" font-size="16" fill="#ffffff" font-weight="bold" text-anchor="middle">3</text>
<text x="70" y="1016.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Sang mã máy, bắt buộc</text>
<text x="70" y="1040.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">CIL thành mã máy trước khi</text>
<text x="70" y="1059.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">chạy, thường bằng JIT hoặc</text>
<text x="70" y="1079.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">biên dịch trước.</text>
<polyline points="46,970 46,988" fill="none" stroke="#334155" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="8" y="1121" width="304" height="275" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="1149.1" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Thông dịch · Python,</text>
<text x="20" y="1171.2" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">JavaScript, Ruby</text>
<rect x="20" y="1188" width="280" height="87" rx="10" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/>
<circle cx="46" cy="1214" r="14" fill="#6d28d9"/>
<text x="46" y="1219.5" font-size="16" fill="#ffffff" font-weight="bold" text-anchor="middle">1</text>
<text x="70" y="1214.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Chạy thẳng mã nguồn</text>
<text x="70" y="1238.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Không tạo tệp chạy được</text>
<text x="70" y="1257.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">riêng.</text>
<rect x="20" y="1297" width="280" height="87" rx="10" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/>
<circle cx="46" cy="1323" r="14" fill="#6d28d9"/>
<text x="46" y="1328.5" font-size="16" fill="#ffffff" font-weight="bold" text-anchor="middle">2</text>
<text x="70" y="1323.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Trình thông dịch</text>
<text x="70" y="1347.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Đọc và chạy chương trình</text>
<text x="70" y="1366.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">khi cần.</text>
<polyline points="46,1277 46,1295" fill="none" stroke="#334155" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="8" y="1408" width="304" height="282" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="1436.1" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Nhớ gì</text>
<rect x="20" y="1453" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="1476" r="11" fill="#16a34a"/>
<polyline points="37.9,1476.4 41.7,1480.4 48.5,1472" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="1479.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Ba nhóm khác nhau ở chỗ</text>
<text x="64" y="1498.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">mã được dịch lúc nào.</text>
<rect x="20" y="1524" width="280" height="83" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="1547" r="11" fill="#16a34a"/>
<polyline points="37.9,1547.4 41.7,1551.4 48.5,1543" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="1550.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Thông dịch thường chạy</text>
<text x="64" y="1569.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">chậm hơn, nhưng ranh giới</text>
<text x="64" y="1589.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">mờ.</text>
<rect x="20" y="1615" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="1638" r="11" fill="#16a34a"/>
<polyline points="37.9,1638.4 41.7,1642.4 48.5,1634" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="1641.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Ranh giới giữa các nhóm có</text>
<text x="64" y="1660.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">chỗ mờ.</text>
</g>
