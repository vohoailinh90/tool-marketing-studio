<circle cx="43" cy="1236" r="11" fill="#16a34a"/>
<polyline points="37.9,1236.4 41.7,1240.4 48.5,1232" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
