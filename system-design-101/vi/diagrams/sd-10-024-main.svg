<svg xmlns="http://www.w3.org/2000/svg" width="320" height="1606" viewBox="0 0 320 1606" role="img" aria-labelledby="title desc">
<title id="title">Chín thuật toán dùng hằng ngày</title>
<desc id="desc">Ba nhóm thẻ và một khung ghi nhớ. Xếp, tìm đường và xếp hạng: sắp xếp, thuật toán Dijkstra, phân tích liên kết. Mật mã, số và nén: RSA, phân tích thừa số nguyên, mã Huffman, họ băm SHA. Học máy: Transformer, mạng nơ-ron tích chập. Khung cuối nêu ba điều cần nhớ.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs>
<rect width="320" height="1606" fill="#f8fafc"/>
<g font-family="DejaVu Sans, Arial, sans-serif" fill="#0f172a">
<text x="16" y="34" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">Chín thuật toán dùng</text>
<text x="16" y="58" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">hằng ngày</text>
<text x="16" y="84.2" font-size="15" fill="#475569" font-weight="normal" text-anchor="start">Tên theo nguồn, mô tả ngắn theo tài</text>
<text x="16" y="103.8" font-size="15" fill="#475569" font-weight="normal" text-anchor="start">liệu thư viện.</text>
<rect x="8" y="123" width="304" height="425" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="151.2" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Xếp, tìm đường và xếp hạng</text>
<rect x="20" y="168" width="280" height="126" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="50" cy="231" r="18" fill="#1d4ed8"/><g transform="translate(39.2 220.2) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5h10"/><path d="M11 12h10"/><path d="M11 19h10"/><path d="M4 4h1v5"/><path d="M4 9h2"/><path d="M6.5 20H3.4c0-1 2.6-1.925 2.6-3.5a1.5 1.5 0 0 0-2.6-1.02"/></g>
<text x="78" y="194.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Sắp xếp</text>
<text x="78" y="218.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Xếp phần tử theo thứ tự;</text>
<text x="78" y="237.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Python dùng Timsort, Java</text>
<text x="78" y="257.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">dùng Dual-Pivot Quicksort</text>
<text x="78" y="276.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">cho mảng số.</text>
<rect x="20" y="308" width="280" height="107" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="50" cy="361.5" r="18" fill="#1d4ed8"/><g transform="translate(39.2 350.7) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="19" r="3"/><path d="M9 19h8.5a3.5 3.5 0 0 0 0-7h-11a3.5 3.5 0 0 1 0-7H15"/><circle cx="18" cy="5" r="3"/></g>
<text x="78" y="334.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Thuật toán Dijkstra</text>
<text x="78" y="358.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Tìm đường đi có trọng số</text>
<text x="78" y="377.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">ngắn nhất giữa hai nút của</text>
<text x="78" y="397.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">đồ thị.</text>
<rect x="20" y="429" width="280" height="107" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="50" cy="482.5" r="18" fill="#1d4ed8"/><g transform="translate(39.2 471.7) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" x2="15.42" y1="13.51" y2="17.49"/><line x1="15.41" x2="8.59" y1="6.51" y2="10.49"/></g>
<text x="78" y="455.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Phân tích liên kết</text>
<text x="78" y="479.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Xếp hạng nút theo liên kết</text>
<text x="78" y="498.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">đến; PageRank xếp hạng</text>
<text x="78" y="518.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">trang web.</text>
<rect x="8" y="560" width="304" height="467" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="588.1" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Mật mã, số và nén</text>
<rect x="20" y="605" width="280" height="87" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
<circle cx="50" cy="648.5" r="18" fill="#0f766e"/><g transform="translate(39.2 637.7) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.586 17.414A2 2 0 0 0 2 18.828V21a1 1 0 0 0 1 1h3a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h1a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h.172a2 2 0 0 0 1.414-.586l.814-.814a6.5 6.5 0 1 0-4-4z"/><circle cx="16.5" cy="7.5" fill="#FFFFFF" r=".5"/></g>
<text x="78" y="631.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">RSA</text>
<text x="78" y="655.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Java có tham số để sinh</text>
<text x="78" y="674.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">một cặp khóa RSA.</text>
<rect x="20" y="706" width="280" height="107" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
<circle cx="50" cy="759.5" r="18" fill="#0f766e"/><g transform="translate(39.2 748.7) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" x2="20" y1="9" y2="9"/><line x1="4" x2="20" y1="15" y2="15"/><line x1="10" x2="8" y1="3" y2="21"/><line x1="16" x2="14" y1="3" y2="21"/></g>
<text x="78" y="732.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Phân tích thừa số</text>
<text x="78" y="752.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">nguyên</text>
<text x="78" y="776.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Tìm các thừa số nguyên tố</text>
<text x="78" y="795.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">của một số nguyên.</text>
<rect x="20" y="827" width="280" height="87" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
<circle cx="50" cy="870.5" r="18" fill="#0f766e"/><g transform="translate(39.2 859.7) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 21.73a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73z"/><path d="M12 22V12"/><polyline points="3.29 7 12 12 20.71 7"/><path d="m7.5 4.27 9 5.15"/></g>
<text x="78" y="853.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Mã Huffman</text>
<text x="78" y="877.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Nguồn chỉ nêu tên; bài</text>
<text x="78" y="896.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">không đối chiếu.</text>
<rect x="20" y="928" width="280" height="87" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
<circle cx="50" cy="971.5" r="18" fill="#0f766e"/><g transform="translate(39.2 960.7) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 10a2 2 0 0 0-2 2c0 1.02-.1 2.51-.26 4"/><path d="M14 13.12c0 2.38 0 6.38-1 8.88"/><path d="M17.29 21.02c.12-.6.43-2.3.5-3.02"/><path d="M2 12a10 10 0 0 1 18-6"/><path d="M2 16h.01"/><path d="M21.8 16c.2-2 .131-5.354 0-6"/><path d="M5 19.5C5.5 18 6 15 6 12a6 6 0 0 1 .34-2"/><path d="M8.65 22c.21-.66.45-1.32.57-2"/><path d="M9 6.8a6 6 0 0 1 9 5.2v2"/></g>
<text x="78" y="954.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Họ băm SHA</text>
<text x="78" y="978.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Python hỗ trợ SHA-256,</text>
<text x="78" y="997.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">SHA-512 và dòng SHA-3.</text>
<rect x="8" y="1039" width="304" height="265" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="1067.1" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Học máy</text>
<rect x="20" y="1084" width="280" height="107" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
<circle cx="50" cy="1137.5" r="18" fill="#b45309"/><g transform="translate(39.2 1126.7) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 18V5"/><path d="M15 13a4.17 4.17 0 0 1-3-4 4.17 4.17 0 0 1-3 4"/><path d="M17.598 6.5A3 3 0 1 0 12 5a3 3 0 1 0-5.598 1.5"/><path d="M17.997 5.125a4 4 0 0 1 2.526 5.77"/><path d="M18 18a4 4 0 0 0 2-7.464"/><path d="M19.967 17.483A4 4 0 1 1 12 18a4 4 0 1 1-7.967-.517"/><path d="M6 18a4 4 0 0 1-2-7.464"/><path d="M6.003 5.125a4 4 0 0 0-2.526 5.77"/></g>
<text x="78" y="1110.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Transformer</text>
<text x="78" y="1134.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">PyTorch có lớp theo bài</text>
<text x="78" y="1153.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">báo Attention Is All You</text>
<text x="78" y="1173.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Need.</text>
<rect x="20" y="1205" width="280" height="87" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
<circle cx="50" cy="1248.5" r="18" fill="#b45309"/><g transform="translate(39.2 1237.7) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83z"/><path d="M2 12a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 12"/><path d="M2 17a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 17"/></g>
<text x="78" y="1231.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Mạng nơ-ron tích chập</text>
<text x="78" y="1255.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">PyTorch có lớp Conv2d áp</text>
<text x="78" y="1274.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">phép tích chập 2D.</text>
<rect x="8" y="1316" width="304" height="282" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="1344.1" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Nhớ gì</text>
<rect x="20" y="1361" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="1384" r="11" fill="#16a34a"/>
<polyline points="37.9,1384.4 41.7,1388.4 48.5,1380" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="1387.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Nguồn nêu chín tên, không</text>
<text x="64" y="1406.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">mô tả từng cái bằng chữ.</text>
<rect x="20" y="1432" width="280" height="83" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="1455" r="11" fill="#16a34a"/>
<polyline points="37.9,1455.4 41.7,1459.4 48.5,1451" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="1458.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Nơi dùng của từng thuật</text>
<text x="64" y="1477.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">toán nằm trong ảnh nguồn,</text>
<text x="64" y="1497.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">bài không dùng.</text>
<rect x="20" y="1523" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="1546" r="11" fill="#16a34a"/>
<polyline points="37.9,1546.4 41.7,1550.4 48.5,1542" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="1549.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Cách chia nhóm là của bài,</text>
<text x="64" y="1568.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">không phải của nguồn.</text>
</g>
</svg>
