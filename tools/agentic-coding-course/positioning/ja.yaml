lang: ja
one_liner: "ゼロから学ぶAIエージェント。1レッスン＝1セットの図解で、わかる・覚える・試せる。"
audience: >-
  AIエージェントという言葉は聞くけれど、何から始めればいいかわからない社会人・学生・
  ソフトウェア以外のエンジニア。スマホでFacebookを見て、あとで読むために保存する人。
pains:
  - "「AIエージェント」「エージェント型コーディング」を基礎から説明してくれる資料が少ない"
  - "専門用語が多く、英語の資料ばかり"
  - "AIに仕事を任せても、正しいかどうか確かめ方がわからない"
  - "長い記事は読んでもすぐ忘れてしまう"
promise: "1つのレッスンを、スマホでめくれる図解セットに。レッスンの要点をすべて入れ、確認クイズ付きです。"
objections:
  - {q: "プログラミング未経験でも大丈夫ですか？", a: "大丈夫です。「ソフトウェアとは？」から始まり、AIに仕事を任せて結果を確かめるのに必要なことだけを学びます。"}
  - {q: "費用はかかりますか？", a: "かかりません。GitHubで無料で読めます。日本語・英語・ベトナム語の3か国語です。"}
vocabulary: [AIエージェント, LLM, ツール, ループ, 任せる, 確かめる, 根拠, 初心者, 保存]
angles:
  - "1つの考え方を1枚の図で"
  - "よくある誤解 → 実際は"
  - "3秒クイズ：A・B・Cどれ？"
tone: "です・ます調。まず共感、専門用語は必ずやさしい言葉で言い換える。押しつけない。"
