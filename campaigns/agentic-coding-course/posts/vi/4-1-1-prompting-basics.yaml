platforms:
  facebook:
    caption: 'AI trả lời lan man? Có thể bạn chưa nói rõ việc cần làm.


      Mai đưa ghi chú một cuộc họp giả rồi nhờ: “Viết giúp tôi cho hay.” AI viết một email dài, tự thêm
      ngày họp và gọi người nhận là “quý khách”. Câu văn trôi chảy, nhưng lệch ý Mai.


      Prompt là nội dung bạn đưa cho AI. Một prompt rõ thường cho biết:

      • Bối cảnh: ai sẽ đọc, tình huống gì?

      • Nhiệm vụ: cần tóm tắt, phân loại hay viết lại?

      • Định dạng: bảng, email hay gạch đầu dòng?

      • Ví dụ: một mẫu nhỏ nếu khó diễn tả.


      Thử đổi lời nhờ thành: “Đây là ghi chú bịa cho nhóm tình nguyện. Tóm tắt quyết định và việc còn
      bỏ ngỏ thành ba gạch đầu dòng tiếng Việt. Chỉ dùng ghi chú này; thiếu thông tin thì ghi ‘chưa rõ’,
      đừng tự đoán.” Thêm một dòng mẫu nếu cần: “Quyết định: [điều đã thống nhất]”.


      Lời dặn rõ không bảo đảm AI luôn đúng. Sau khi nhận kết quả, bạn vẫn cần kiểm tra số dòng, quyết
      định và chỗ thiếu thông tin với ghi chú gốc.


      Thử bằng dữ liệu bịa trong ai-practice: hỏi mơ hồ ở một phiên, hỏi rõ ở phiên mới, rồi so hai kết
      quả.


      Bạn thường quên mảnh nào: bối cảnh, nhiệm vụ, định dạng hay ví dụ? Nếu thử rồi, chia sẻ một thay
      đổi giúp kết quả dễ kiểm tra hơn nhé.

      '
    first_comment: '📖 Bài “Prompt căn bản: nói sao cho AI hiểu”: {link}


      Đáp án câu hỏi trên ảnh: B — ghi “chưa rõ” và hỏi lại. Thiếu ngày hoàn thành thì không tự biến phỏng
      đoán thành dữ kiện.


      Mẹo tự kiểm tra: kết quả có đúng dạng bạn yêu cầu, giữ đúng thông tin gốc và nêu rõ phần còn thiếu
      không?

      '
