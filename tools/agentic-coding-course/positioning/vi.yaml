lang: vi
one_liner: Giao việc cho AI rõ hơn, tự kiểm tra kết quả bằng bằng chứng.
audience: Người Việt mới học AI, dân văn phòng ở Việt Nam hoặc công ty Nhật; đọc Facebook trên
  điện thoại.
pains:
- AI nói xong nhưng chưa biết kiểm tra thế nào.
- Không rành code nên ngại giao việc.
promise: Mỗi bài một kỹ năng nhỏ để chỉ đạo và nghiệm thu agent.
tone: Gần gũi, rõ ràng; hỏi trải nghiệm, không hứa kết quả.
vocabulary:
- giao việc
- xong khi
- kiểm tra
- dữ liệu giả
angles:
- Bắt đầu an toàn
- Giám sát kết quả
- Hiểu phần mềm đúng lúc
