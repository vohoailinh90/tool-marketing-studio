<rect x="20" y="512" width="280" height="46" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="535" r="11" fill="#16a34a"/>
<polyline points="37.9,535.4 41.7,539.4 48.5,531" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="538.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Hệ thống quyết toán.</text>
<rect x="8" y="582" width="304" height="353" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
