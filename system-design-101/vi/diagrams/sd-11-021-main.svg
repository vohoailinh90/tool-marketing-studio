<svg xmlns="http://www.w3.org/2000/svg" width="360" height="420" viewBox="0 0 360 420" role="img" aria-labelledby="title desc">
<title id="title">Mạng AWS điển hình: chọn đường kết nối đúng</title>
<desc id="desc">Trong VPC: Subnet thuộc một AZ: Route table + security group; Internet / AWS service: IGW • NAT cho egress IPv4: Gateway / interface endpoint; Mạng khác: VPN • Direct Connect: Peering • Transit Gateway. Các khung là ý chính để đối chiếu, không nhất thiết là các bước tuần tự.</desc>
<rect width="360" height="420" fill="#f8fafc"/>
<g font-family="DejaVu Sans, sans-serif" fill="#0f172a">
<text x="20" y="28" font-size="18" font-weight="bold">sd-11-021 · Nhìn hình trước</text>
<rect x="12" y="48" width="336" height="102" rx="12" fill="#e0f2fe" stroke="#64748b"/>
<text x="24" y="75" font-size="18" font-weight="bold">Trong VPC</text>
<text x="24" y="104" font-size="18">Subnet thuộc một AZ</text>
<text x="24" y="130" font-size="18">Route table + security group</text>
<rect x="12" y="162" width="336" height="102" rx="12" fill="#dcfce7" stroke="#64748b"/>
<text x="24" y="189" font-size="18" font-weight="bold">Internet / AWS service</text>
<text x="24" y="218" font-size="18">IGW • NAT cho egress IPv4</text>
<text x="24" y="244" font-size="18">Gateway / interface endpoint</text>
<rect x="12" y="276" width="336" height="102" rx="12" fill="#fef3c7" stroke="#64748b"/>
<text x="24" y="303" font-size="18" font-weight="bold">Mạng khác</text>
<text x="24" y="332" font-size="18">VPN • Direct Connect</text>
<text x="24" y="358" font-size="18">Peering • Transit Gateway</text>
</g>
</svg>
