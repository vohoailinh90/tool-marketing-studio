<text x="78" y="194.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Theo sự kiện</text>
<text x="78" y="218.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Phát sự kiện; bên nghe tự</text>
<text x="78" y="237.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">sửa bản của mình.</text>
<rect x="20" y="269" width="280" height="87" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="50" cy="312.5" r="18" fill="#1d4ed8"/><g transform="translate(39.2 301.7) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></g>
