<svg xmlns="http://www.w3.org/2000/svg" width="320" height="1313" viewBox="0 0 320 1313" role="img" aria-labelledby="title desc">
<title id="title">Twitter qua mã nguồn mở</title>
<desc id="desc">Ba khung. Khung một, công cụ thời đầu theo README của Twitter: Gizzard, khung dựng kho dữ liệu phân tán; FlockDB, kho đồ thị quan hệ, tháng 4 năm 2010 có hơn 13 tỷ cạnh; Snowflake, bản đầu phát hành năm 2010; Finagle, hệ gọi dịch vụ từ xa cho JVM. Khung hai, năm chặng dựng dòng tin For You: lấy ứng viên, gắn khoảng 6000 đặc trưng, chấm điểm bằng mô hình, lọc, trộn nội dung khác. Khung ba: ba điều nguồn không nói.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs>
<rect width="320" height="1313" fill="#f8fafc"/>
<g font-family="DejaVu Sans, Arial, sans-serif" fill="#0f172a">
<text x="16" y="34" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">Twitter qua mã nguồn</text>
<text x="16" y="58" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">mở</text>
<text x="16" y="84.2" font-size="15" fill="#475569" font-weight="normal" text-anchor="start">Công cụ thời đầu, rồi dòng tin Home.</text>
<rect x="8" y="104" width="304" height="428" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="132.2" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Công cụ thời đầu</text>
<rect x="20" y="149" width="280" height="87" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="50" cy="192.5" r="18" fill="#1d4ed8"/><g transform="translate(39.2 181.7) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5V19A9 3 0 0 0 21 19V5"/><path d="M3 12A9 3 0 0 0 21 12"/></g>
<text x="78" y="175.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Gizzard</text>
<text x="78" y="199.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Khung dựng kho dữ liệu</text>
<text x="78" y="218.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">phân tán.</text>
<rect x="20" y="250" width="280" height="87" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="50" cy="293.5" r="18" fill="#1d4ed8"/><g transform="translate(39.2 282.7) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect height="6" rx="1" width="6" x="16" y="16"/><rect height="6" rx="1" width="6" x="2" y="16"/><rect height="6" rx="1" width="6" x="9" y="2"/><path d="M5 16v-3a1 1 0 0 1 1-1h12a1 1 0 0 1 1 1v3"/><path d="M12 12V8"/></g>
<text x="78" y="276.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">FlockDB</text>
<text x="78" y="300.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Đồ thị quan hệ: 13 tỷ cạnh,</text>
<text x="78" y="319.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">4/2010.</text>
<rect x="20" y="351" width="280" height="87" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="50" cy="394.5" r="18" fill="#1d4ed8"/><g transform="translate(39.2 383.7) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></g>
<text x="78" y="377.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Snowflake</text>
<text x="78" y="401.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Bản đầu phát hành năm</text>
<text x="78" y="420.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">2010.</text>
<rect x="20" y="452" width="280" height="68" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="50" cy="486" r="18" fill="#1d4ed8"/><g transform="translate(39.2 475.2) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect height="8" rx="2" ry="2" width="20" x="2" y="2"/><rect height="8" rx="2" ry="2" width="20" x="2" y="14"/><line x1="6" x2="6.01" y1="6" y2="6"/><line x1="6" x2="6.01" y1="18" y2="18"/></g>
<text x="78" y="478.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Finagle</text>
<text x="78" y="502.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Gọi dịch vụ từ xa cho JVM.</text>
<rect x="8" y="544" width="304" height="504" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="572.1" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Dòng tin For You</text>
<rect x="20" y="589" width="280" height="68" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
<circle cx="46" cy="615" r="14" fill="#0f766e"/>
<text x="46" y="620.5" font-size="16" fill="#ffffff" font-weight="bold" text-anchor="middle">1</text>
<text x="70" y="615.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Lấy ứng viên</text>
<text x="70" y="639.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Từ nhiều nguồn khác nhau.</text>
<rect x="20" y="679" width="280" height="68" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
<circle cx="46" cy="705" r="14" fill="#0f766e"/>
<text x="46" y="710.5" font-size="16" fill="#ffffff" font-weight="bold" text-anchor="middle">2</text>
<text x="70" y="705.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Gắn đặc trưng</text>
<text x="70" y="729.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Khoảng 6000 đặc trưng.</text>
<polyline points="46,659 46,677" fill="none" stroke="#334155" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="20" y="769" width="280" height="68" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
<circle cx="46" cy="795" r="14" fill="#0f766e"/>
<text x="46" y="800.5" font-size="16" fill="#ffffff" font-weight="bold" text-anchor="middle">3</text>
<text x="70" y="795.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Chấm điểm</text>
<text x="70" y="819.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Mô hình học máy xếp hạng.</text>
<polyline points="46,749 46,767" fill="none" stroke="#334155" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="20" y="859" width="280" height="68" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
<circle cx="46" cy="885" r="14" fill="#0f766e"/>
<text x="46" y="890.5" font-size="16" fill="#ffffff" font-weight="bold" text-anchor="middle">4</text>
<text x="70" y="885.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Lọc</text>
<text x="70" y="909.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Bỏ tweet đã xem, bị chặn.</text>
<polyline points="46,839 46,857" fill="none" stroke="#334155" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="20" y="949" width="280" height="87" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
<circle cx="46" cy="975" r="14" fill="#0f766e"/>
<text x="46" y="980.5" font-size="16" fill="#ffffff" font-weight="bold" text-anchor="middle">5</text>
<text x="70" y="975.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Trộn</text>
<text x="70" y="999.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Thêm quảng cáo, gợi ý theo</text>
<text x="70" y="1018.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">dõi.</text>
<polyline points="46,929 46,947" fill="none" stroke="#334155" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="8" y="1060" width="304" height="245" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="1088.1" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Nguồn không nói</text>
<rect x="20" y="1105" width="280" height="46" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="1128" r="11" fill="#16a34a"/>
<polyline points="37.9,1128.4 41.7,1132.4 48.5,1124" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="1131.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Hình nguồn vẽ gì.</text>
<rect x="20" y="1159" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="1182" r="11" fill="#16a34a"/>
<polyline points="37.9,1182.4 41.7,1186.4 48.5,1178" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="1185.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Số liệu quy mô năm 2012 và</text>
<text x="64" y="1204.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">2022.</text>
<rect x="20" y="1230" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="1253" r="11" fill="#16a34a"/>
<polyline points="37.9,1253.4 41.7,1257.4 48.5,1249" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="1256.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Vì sao mỗi công cụ được</text>
<text x="64" y="1275.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">thay.</text>
</g>
</svg>
