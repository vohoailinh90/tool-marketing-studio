<svg xmlns="http://www.w3.org/2000/svg" width="360" height="420" viewBox="0 0 360 420" role="img" aria-labelledby="title desc">
<title id="title">So sánh AWS, Azure và Google Cloud theo vai trò</title>
<desc id="desc">Compute: EC2 | Azure VM | GCE: Lambda | Functions | CR funcs; Storage / DB: S3 | Blob | Cloud Storage: RDS | Azure DB | Cloud SQL; Kubernetes: EKS | AKS | GKE: Map vai trò, rồi kiểm giới hạn. Các khung là ý chính để đối chiếu, không nhất thiết là các bước tuần tự.</desc>
<rect width="360" height="420" fill="#f8fafc"/>
<g font-family="DejaVu Sans, sans-serif" fill="#0f172a">
<text x="20" y="28" font-size="18" font-weight="bold">sd-11-047 · Nhìn hình trước</text>
<rect x="12" y="48" width="336" height="102" rx="12" fill="#e0f2fe" stroke="#64748b"/>
<text x="24" y="75" font-size="18" font-weight="bold">Compute</text>
<text x="24" y="104" font-size="18">EC2 | Azure VM | GCE</text>
<text x="24" y="130" font-size="18">Lambda | Functions | CR funcs</text>
<rect x="12" y="162" width="336" height="102" rx="12" fill="#dcfce7" stroke="#64748b"/>
<text x="24" y="189" font-size="18" font-weight="bold">Storage / DB</text>
<text x="24" y="218" font-size="18">S3 | Blob | Cloud Storage</text>
<text x="24" y="244" font-size="18">RDS | Azure DB | Cloud SQL</text>
<rect x="12" y="276" width="336" height="102" rx="12" fill="#fef3c7" stroke="#64748b"/>
<text x="24" y="303" font-size="18" font-weight="bold">Kubernetes</text>
<text x="24" y="332" font-size="18">EKS | AKS | GKE</text>
<text x="24" y="358" font-size="18">Map vai trò, rồi kiểm giới hạn</text>
</g>
</svg>
