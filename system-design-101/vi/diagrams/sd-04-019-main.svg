<text x="111" y="1431.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="middle">Bù: ghi</text>
<text x="111" y="1450.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="middle">dòng hoàn</text>
<text x="111" y="1470.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="middle">300</text>
<polyline points="63,1484 157,1484" fill="none" stroke="#334155" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="111" y="1512.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="middle">Đã hoàn;</text>
<text x="111" y="1531.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="middle">hủy đơn</text>
<polyline points="159,1545 65,1545" fill="none" stroke="#334155" stroke-width="1.8" stroke-dasharray="5 4" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="8" y="1577" width="304" height="413" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="1605.1" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Hỏi trước khi chọn</text>
