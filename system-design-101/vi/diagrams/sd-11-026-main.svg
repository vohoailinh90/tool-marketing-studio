<svg xmlns="http://www.w3.org/2000/svg" width="360" height="420" viewBox="0 0 360 420" role="img" aria-labelledby="title desc">
<title id="title">Đưa Event Sourcing vào một hệ thống</title>
<desc id="desc">Command: Kiểm quy tắc + expected version: Append event nghiệp vụ; Event store: Nguồn lịch sử đã cam kết: Version và chính sách giữ; Projection: Dựng view • replay an toàn: Không lặp tác động ngoài. Các khung là ý chính để đối chiếu, không nhất thiết là các bước tuần tự.</desc>
<rect width="360" height="420" fill="#f8fafc"/>
<g font-family="DejaVu Sans, sans-serif" fill="#0f172a">
<text x="20" y="28" font-size="18" font-weight="bold">sd-11-026 · Nhìn hình trước</text>
<rect x="12" y="48" width="336" height="102" rx="12" fill="#e0f2fe" stroke="#64748b"/>
<text x="24" y="75" font-size="18" font-weight="bold">Command</text>
<text x="24" y="104" font-size="18">Kiểm quy tắc + expected version</text>
<text x="24" y="130" font-size="18">Append event nghiệp vụ</text>
<rect x="12" y="162" width="336" height="102" rx="12" fill="#dcfce7" stroke="#64748b"/>
<text x="24" y="189" font-size="18" font-weight="bold">Event store</text>
<text x="24" y="218" font-size="18">Nguồn lịch sử đã cam kết</text>
<text x="24" y="244" font-size="18">Version và chính sách giữ</text>
<rect x="12" y="276" width="336" height="102" rx="12" fill="#fef3c7" stroke="#64748b"/>
<text x="24" y="303" font-size="18" font-weight="bold">Projection</text>
<text x="24" y="332" font-size="18">Dựng view • replay an toàn</text>
<text x="24" y="358" font-size="18">Không lặp tác động ngoài</text>
</g>
</svg>
