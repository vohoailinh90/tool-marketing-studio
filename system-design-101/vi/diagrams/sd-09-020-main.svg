<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 352 472" role="img">
<title>Từ thay đổi code tới bản chạy production</title>
<desc>Yêu cầu → commit: Tiêu chí · review · tests; Build → artifact: Một bản có ID/digest; Kiểm tra → deploy: Môi trường phù hợp · cùng bản; Quan sát → quyết định: Tiếp tục hoặc rollback</desc>
<rect width="352" height="472" rx="16" fill="#f3f6fb"/>
<text x="18" y="29" font-family="sans-serif" font-size="18" fill="#19334d">ĐỌC TỪ TRÊN XUỐNG</text>
<rect x="12" y="44" width="328" height="88" rx="12" fill="#ffffff" stroke="#9ab5ca"/>
<text x="24" y="70" font-family="sans-serif" font-size="18" font-weight="bold" fill="#19334d">Yêu cầu → commit</text>
<text x="24" y="98" font-family="sans-serif" font-size="18" fill="#19334d">Tiêu chí · review · tests</text>
<path d="M176 135 v10 m-4 -4 l4 4 l4 -4" fill="none" stroke="#267d86" stroke-width="2"/>
<rect x="12" y="150" width="328" height="88" rx="12" fill="#ffffff" stroke="#9ab5ca"/>
<text x="24" y="176" font-family="sans-serif" font-size="18" font-weight="bold" fill="#19334d">Build → artifact</text>
<text x="24" y="204" font-family="sans-serif" font-size="18" fill="#19334d">Một bản có ID/digest</text>
<path d="M176 241 v10 m-4 -4 l4 4 l4 -4" fill="none" stroke="#267d86" stroke-width="2"/>
<rect x="12" y="256" width="328" height="88" rx="12" fill="#ffffff" stroke="#9ab5ca"/>
<text x="24" y="282" font-family="sans-serif" font-size="18" font-weight="bold" fill="#19334d">Kiểm tra → deploy</text>
<text x="24" y="310" font-family="sans-serif" font-size="18" fill="#19334d">Môi trường phù hợp · cùng bản</text>
<path d="M176 347 v10 m-4 -4 l4 4 l4 -4" fill="none" stroke="#267d86" stroke-width="2"/>
<rect x="12" y="362" width="328" height="88" rx="12" fill="#ffffff" stroke="#9ab5ca"/>
<text x="24" y="388" font-family="sans-serif" font-size="18" font-weight="bold" fill="#19334d">Quan sát → quyết định</text>
<text x="24" y="416" font-family="sans-serif" font-size="18" fill="#19334d">Tiếp tục hoặc rollback</text>
</svg>
