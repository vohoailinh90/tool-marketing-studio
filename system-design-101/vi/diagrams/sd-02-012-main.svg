<svg xmlns="http://www.w3.org/2000/svg" width="320" height="1209" viewBox="0 0 320 1209" role="img" aria-labelledby="title desc">
<title id="title">YouTube chuyển mã video bằng chip riêng</title>
<desc id="desc">Hai khung. Khung một, vì sao cần chip riêng: mỗi video được chuyển mã ra nhiều mức, 720p cho điện thoại, 1080p cho máy tính xách tay, 4K cho màn hình lớn; lượng video tải lên tăng mạnh trong đại dịch; chuyển mã bằng phần mềm chậm và tốn. Khung hai, VCU xếp theo lớp: một cụm có nhiều máy chủ tăng tốc bằng VCU; mỗi máy chủ có nhiều khay tăng tốc; mỗi khay có nhiều thẻ VCU; mỗi thẻ có bộ mã hóa, bộ giải mã. Khung ba nêu ba điều cần nhớ.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs>
<rect width="320" height="1209" fill="#f8fafc"/>
<g font-family="DejaVu Sans, Arial, sans-serif" fill="#0f172a">
<text x="16" y="34" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">YouTube chuyển mã</text>
<text x="16" y="58" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">video bằng chip riêng</text>
<text x="16" y="84.2" font-size="15" fill="#475569" font-weight="normal" text-anchor="start">Hơn 500 giờ video mỗi phút, mỗi</text>
<text x="16" y="103.8" font-size="15" fill="#475569" font-weight="normal" text-anchor="start">video nhiều mức.</text>
<rect x="8" y="123" width="304" height="402" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="151.2" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Vì sao cần chip riêng</text>
<rect x="20" y="168" width="280" height="107" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="46" cy="194" r="14" fill="#1d4ed8"/>
<text x="46" y="199.5" font-size="16" fill="#ffffff" font-weight="bold" text-anchor="middle">1</text>
<text x="70" y="194.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Nhiều mức cho mỗi</text>
<text x="70" y="214.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">video</text>
<text x="70" y="238.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">720p điện thoại, 1080p máy</text>
<text x="70" y="257.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">xách tay, 4K màn hình lớn.</text>
<rect x="20" y="297" width="280" height="87" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="46" cy="323" r="14" fill="#1d4ed8"/>
<text x="46" y="328.5" font-size="16" fill="#ffffff" font-weight="bold" text-anchor="middle">2</text>
<text x="70" y="323.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Lượng tải lên rất lớn</text>
<text x="70" y="347.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Hơn 500 giờ mỗi phút, tăng</text>
<text x="70" y="366.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">mạnh trong đại dịch.</text>
<polyline points="46,277 46,295" fill="none" stroke="#334155" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="20" y="406" width="280" height="107" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="46" cy="432" r="14" fill="#1d4ed8"/>
<text x="46" y="437.5" font-size="16" fill="#ffffff" font-weight="bold" text-anchor="middle">3</text>
<text x="70" y="432.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Phần mềm không theo</text>
<text x="70" y="452.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">kịp</text>
<text x="70" y="476.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Chuyển mã bằng phần</text>
<text x="70" y="495.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">mềm chậm và tốn.</text>
<polyline points="46,386 46,404" fill="none" stroke="#334155" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="8" y="537" width="304" height="390" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="565.1" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">VCU xếp theo lớp</text>
<rect x="20" y="582" width="280" height="87" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
<circle cx="50" cy="625.5" r="18" fill="#0f766e"/><g transform="translate(39.2 614.7) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.97 12.92A2 2 0 0 0 2 14.63v3.24a2 2 0 0 0 .97 1.71l3 1.8a2 2 0 0 0 2.06 0L12 19v-5.5l-5-3-4.03 2.42Z"/><path d="m7 16.5-4.74-2.85"/><path d="m7 16.5 5-3"/><path d="M7 16.5v5.17"/><path d="M12 13.5V19l3.97 2.38a2 2 0 0 0 2.06 0l3-1.8a2 2 0 0 0 .97-1.71v-3.24a2 2 0 0 0-.97-1.71L17 10.5l-5 3Z"/><path d="m17 16.5-5-3"/><path d="m17 16.5 4.74-2.85"/><path d="M17 16.5v5.17"/><path d="M7.97 4.42A2 2 0 0 0 7 6.13v4.37l5 3 5-3V6.13a2 2 0 0 0-.97-1.71l-3-1.8a2 2 0 0 0-2.06 0l-3 1.8Z"/><path d="M12 8 7.26 5.15"/><path d="m12 8 4.74-2.85"/><path d="M12 13.5V8"/></g>
<text x="78" y="608.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Cụm</text>
<text x="78" y="632.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Nhiều máy chủ tăng tốc</text>
<text x="78" y="651.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">bằng VCU.</text>
<rect x="20" y="683" width="280" height="68" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
<circle cx="50" cy="717" r="18" fill="#0f766e"/><g transform="translate(39.2 706.2) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect height="8" rx="2" ry="2" width="20" x="2" y="2"/><rect height="8" rx="2" ry="2" width="20" x="2" y="14"/><line x1="6" x2="6.01" y1="6" y2="6"/><line x1="6" x2="6.01" y1="18" y2="18"/></g>
<text x="78" y="709.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Máy chủ</text>
<text x="78" y="733.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Nhiều khay tăng tốc.</text>
<rect x="20" y="765" width="280" height="68" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
<circle cx="50" cy="799" r="18" fill="#0f766e"/><g transform="translate(39.2 788.2) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83z"/><path d="M2 12a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 12"/><path d="M2 17a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 17"/></g>
<text x="78" y="791.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Khay</text>
<text x="78" y="815.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Nhiều thẻ VCU.</text>
<rect x="20" y="847" width="280" height="68" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
<circle cx="50" cy="881" r="18" fill="#0f766e"/><g transform="translate(39.2 870.2) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20v2"/><path d="M12 2v2"/><path d="M17 20v2"/><path d="M17 2v2"/><path d="M2 12h2"/><path d="M2 17h2"/><path d="M2 7h2"/><path d="M20 12h2"/><path d="M20 17h2"/><path d="M20 7h2"/><path d="M7 20v2"/><path d="M7 2v2"/><rect height="16" rx="2" width="16" x="4" y="4"/><rect height="8" rx="1" width="8" x="8" y="8"/></g>
<text x="78" y="873.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Thẻ VCU</text>
<text x="78" y="897.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Bộ mã hóa, bộ giải mã.</text>
<rect x="8" y="939" width="304" height="262" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="967.1" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Nhớ gì</text>
<rect x="20" y="984" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="1007" r="11" fill="#16a34a"/>
<polyline points="37.9,1007.4 41.7,1011.4 48.5,1003" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="1010.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Theo nguồn, hiệu quả tính</text>
<text x="64" y="1029.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">toán tốt hơn 20 tới 33 lần.</text>
<rect x="20" y="1055" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="1078" r="11" fill="#16a34a"/>
<polyline points="37.9,1078.4 41.7,1082.4 48.5,1074" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="1081.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Video ra nhiều độ phân giải,</text>
<text x="64" y="1100.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">lưu vào kho đám mây.</text>
<rect x="20" y="1126" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="1149" r="11" fill="#16a34a"/>
<polyline points="37.9,1149.4 41.7,1153.4 48.5,1145" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="1152.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Chip riêng đáng làm khi một</text>
<text x="64" y="1171.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">việc lặp lại cực nhiều.</text>
</g>
</svg>
