<circle cx="43" cy="627" r="11" fill="#16a34a"/>
<polyline points="37.9,627.4 41.7,631.4 48.5,623" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="630.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">183 tên AWS khác nhau; 17</text>
<text x="64" y="649.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">tên ở hai trang.</text>
<rect x="20" y="675" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="698" r="11" fill="#16a34a"/>
<polyline points="37.9,698.4 41.7,702.4 48.5,694" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="701.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Đây là cách chia của</text>
<text x="64" y="720.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Microsoft.</text>
