<text x="70" y="549.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">4 · Máy chủ web và lưu</text>
<text x="70" y="569.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">trữ</text>
