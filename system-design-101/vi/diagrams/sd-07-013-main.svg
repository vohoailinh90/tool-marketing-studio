<rect x="20" y="627" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="650" r="11" fill="#16a34a"/>
<polyline points="37.9,650.4 41.7,654.4 48.5,646" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="653.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Các hệ thống thanh toán ở</text>
<text x="64" y="672.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Hoa Kỳ (GlenBrook).</text>
<rect x="20" y="698" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="721" r="11" fill="#16a34a"/>
<polyline points="37.9,721.4 41.7,725.4 48.5,717" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="724.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Trang của Ngân hàng Thanh</text>
<text x="64" y="743.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">toán Quốc tế (BIS).</text>
<rect x="20" y="769" width="280" height="46" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="792" r="11" fill="#16a34a"/>
<polyline points="37.9,792.4 41.7,796.4 48.5,788" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="795.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Tài liệu của PayPal.</text>
<rect x="20" y="823" width="280" height="46" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="846" r="11" fill="#16a34a"/>
<polyline points="37.9,846.4 41.7,850.4 48.5,842" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="849.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Tài liệu của Stripe.</text>
<rect x="20" y="877" width="280" height="46" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="900" r="11" fill="#16a34a"/>
<polyline points="37.9,900.4 41.7,904.4 48.5,896" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="903.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Tài liệu của SWIFT.</text>
</g>
</svg>
