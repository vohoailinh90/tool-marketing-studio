<text x="24" y="189" font-size="18" font-weight="bold">Object storage</text>
<text x="24" y="218" font-size="18">S3 • Blob • Cloud Storage</text>
<text x="24" y="244" font-size="18">Kiểm API, quyền và giới hạn</text>
<rect x="12" y="276" width="336" height="102" rx="12" fill="#fef3c7" stroke="#64748b"/>
<text x="24" y="303" font-size="18" font-weight="bold">DB quan hệ AWS / GCP</text>
<text x="24" y="332" font-size="18">Amazon RDS • Cloud SQL</text>
<text x="24" y="358" font-size="18">Chọn theo engine và nhu cầu</text>
