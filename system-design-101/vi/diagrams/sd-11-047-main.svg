<rect x="12" y="48" width="336" height="102" rx="12" fill="#e0f2fe" stroke="#64748b"/>
<text x="24" y="75" font-size="18" font-weight="bold">Compute (VM)</text>
<text x="24" y="104" font-size="18">EC2 • Azure Virtual Machines</text>
<text x="24" y="130" font-size="18">Google Compute Engine</text>
