<circle cx="43" cy="758" r="11" fill="#16a34a"/>
<polyline points="37.9,758.4 41.7,762.4 48.5,754" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
