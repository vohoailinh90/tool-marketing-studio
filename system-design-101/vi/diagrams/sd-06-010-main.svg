<svg xmlns="http://www.w3.org/2000/svg" width="320" height="1258" viewBox="0 0 320 1258" role="img" aria-labelledby="title desc">
<title id="title">Đầy rồi, bỏ khóa nào?</title>
<desc id="desc">Bốn khung. Khung một, năm chính sách: TTL bỏ khóa hết hạn bất kể có dùng không; LRU bỏ khóa lâu nhất chưa dùng; LFU bỏ khóa ít được dùng nhất; MRU bỏ khóa vừa dùng xong; SLRU cho khóa mới vào vùng thử, dùng lại mới lên vùng được bảo vệ. Khung hai, mô phỏng truy cập lệch: LFU và SLRU trúng 65,5 phần trăm, LRU 57,9, FIFO và ngẫu nhiên khoảng 52, MRU 12,6. Khung ba, lặp vòng 120 khóa: LRU, LFU, FIFO và SLRU trúng 0, MRU 83, ngẫu nhiên 69. Khung bốn, nhóm khóa nóng lẫn khóa chỉ dùng một lần: LFU và SLRU 70 phần trăm, đúng mức tối đa; LRU 64; MRU gần 1.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs>
<rect width="320" height="1258" fill="#f8fafc"/>
<g font-family="DejaVu Sans, Arial, sans-serif" fill="#0f172a">
<text x="16" y="34" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">Đầy rồi, bỏ khóa nào?</text>
<text x="16" y="60.2" font-size="15" fill="#475569" font-weight="normal" text-anchor="start">Năm chính sách, thử trên ba kiểu</text>
<text x="16" y="79.8" font-size="15" fill="#475569" font-weight="normal" text-anchor="start">truy cập; bộ đệm chứa 100 khóa.</text>
<rect x="8" y="99" width="304" height="424" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="127.2" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Năm chính sách</text>
<rect x="20" y="144" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="167" r="11" fill="#16a34a"/>
<polyline points="37.9,167.4 41.7,171.4 48.5,163" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="170.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">TTL: hết hạn thì bỏ, bất kể</text>
<text x="64" y="189.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">có đang dùng không.</text>
<rect x="20" y="215" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="238" r="11" fill="#16a34a"/>
<polyline points="37.9,238.4 41.7,242.4 48.5,234" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="241.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">LRU: bỏ khóa lâu nhất chưa</text>
<text x="64" y="260.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">được dùng.</text>
<rect x="20" y="286" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="309" r="11" fill="#16a34a"/>
<polyline points="37.9,309.4 41.7,313.4 48.5,305" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="312.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">LFU: bỏ khóa ít được dùng</text>
<text x="64" y="331.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">nhất.</text>
<rect x="20" y="357" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="380" r="11" fill="#16a34a"/>
<polyline points="37.9,380.4 41.7,384.4 48.5,376" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="383.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">MRU: bỏ khóa vừa được</text>
<text x="64" y="402.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">dùng xong.</text>
<rect x="20" y="428" width="280" height="83" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="451" r="11" fill="#16a34a"/>
<polyline points="37.9,451.4 41.7,455.4 48.5,447" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="454.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">SLRU: khóa mới vào vùng</text>
<text x="64" y="473.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">thử; dùng lại mới lên vùng</text>
<text x="64" y="493.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">bảo vệ.</text>
<rect x="8" y="535" width="304" height="250" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="563.1" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Truy cập lệch, ít khóa rất</text>
<text x="20" y="585.2" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">nóng</text>
<rect x="20" y="602" width="280" height="46" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="625" r="11" fill="#16a34a"/>
<polyline points="37.9,625.4 41.7,629.4 48.5,621" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="628.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">LFU, SLRU: trúng 65,5%.</text>
<rect x="20" y="656" width="280" height="46" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="679" r="11" fill="#16a34a"/>
<polyline points="37.9,679.4 41.7,683.4 48.5,675" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="682.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">LRU: 57,9%.</text>
<rect x="20" y="710" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="733" r="11" fill="#16a34a"/>
<polyline points="37.9,733.4 41.7,737.4 48.5,729" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="736.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">FIFO, ngẫu nhiên: khoảng</text>
<text x="64" y="755.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">52%. MRU: 12,6%.</text>
<rect x="8" y="797" width="304" height="174" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="825.1" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Lặp vòng 120 khóa</text>
<rect x="20" y="842" width="280" height="46" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="865" r="11" fill="#16a34a"/>
<polyline points="37.9,865.4 41.7,869.4 48.5,861" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="868.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">LRU, LFU, FIFO, SLRU: 0%.</text>
<rect x="20" y="896" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="919" r="11" fill="#16a34a"/>
<polyline points="37.9,919.4 41.7,923.4 48.5,915" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="922.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">MRU: 83%. Ngẫu nhiên:</text>
<text x="64" y="941.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">69%.</text>
<rect x="8" y="983" width="304" height="267" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="1011.1" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Khóa nóng lẫn khóa dùng</text>
<text x="20" y="1033.2" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">một lần</text>
<rect x="20" y="1050" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="1073" r="11" fill="#16a34a"/>
<polyline points="37.9,1073.4 41.7,1077.4 48.5,1069" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="1076.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">LFU, SLRU: 70%, đúng mức</text>
<text x="64" y="1095.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">tối đa.</text>
<rect x="20" y="1121" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="1144" r="11" fill="#16a34a"/>
<polyline points="37.9,1144.4 41.7,1148.4 48.5,1140" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="1147.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">LRU: 64%; khóa dùng một</text>
<text x="64" y="1166.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">lần đẩy khóa nóng ra.</text>
<rect x="20" y="1192" width="280" height="46" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="1215" r="11" fill="#16a34a"/>
<polyline points="37.9,1215.4 41.7,1219.4 48.5,1211" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="1218.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">MRU: gần 1%.</text>
</g>
</svg>
