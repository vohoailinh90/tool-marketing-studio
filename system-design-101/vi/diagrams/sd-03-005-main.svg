<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 856" width="320" height="856" role="img" aria-labelledby="title desc">
<title id="title">Ngăn xếp AI: năm tầng, mỗi tầng một câu hỏi</title>
<desc id="desc">Năm tầng từ trên xuống: giao diện, backend và cách gọi mô hình, embedding và RAG, lưu trữ và truy xuất vector, và mô hình. Mỗi tầng có ví dụ công cụ mã nguồn mở. Lưu ý: mở có nhiều mức, cần kiểm tra giấy phép của từng mô hình và công cụ.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#475569" stroke-width="1.5"/></marker></defs>
<rect width="320" height="856" fill="#f8fafc"/>
<g font-family="DejaVu Sans, Arial, sans-serif" fill="#0f172a">
<text x="16" y="30" font-size="21" font-weight="bold">NGĂN XẾP AI</text>
<text x="16" y="54" font-size="21" font-weight="bold">NĂM TẦNG</text>
<rect x="16" y="80" width="288" height="100" rx="12" fill="#dbeafe" stroke="#94a3b8"/>
<text x="29" y="109" font-size="16" font-weight="bold">1 · Giao diện</text>
<text x="29" y="137" font-size="16" font-weight="normal">Streamlit, Next.js</text>
<text x="29" y="161" font-size="16" font-weight="normal">Người dùng thao tác ở đâu?</text>
<line x1="160" y1="181" x2="160" y2="198" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="16" y="200" width="288" height="100" rx="12" fill="#ede9fe" stroke="#94a3b8"/>
<text x="29" y="229" font-size="16" font-weight="bold">2 · Backend, gọi mô hình</text>
<text x="29" y="257" font-size="16" font-weight="normal">FastAPI, Metaflow, Ollama</text>
<text x="29" y="281" font-size="16" font-weight="normal">Ai nhận yêu cầu, gọi mô hình?</text>
<line x1="160" y1="301" x2="160" y2="318" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="16" y="320" width="288" height="100" rx="12" fill="#dcfce7" stroke="#94a3b8"/>
<text x="29" y="349" font-size="16" font-weight="bold">3 · Embedding và RAG</text>
<text x="29" y="377" font-size="16" font-weight="normal">Biến văn bản thành vector</text>
<text x="29" y="401" font-size="16" font-weight="normal">Tìm đoạn liên quan cho prompt</text>
<line x1="160" y1="421" x2="160" y2="438" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="16" y="440" width="288" height="124" rx="12" fill="#fef3c7" stroke="#94a3b8"/>
<text x="29" y="469" font-size="16" font-weight="bold">4 · Lưu trữ, truy xuất</text>
<text x="29" y="497" font-size="16" font-weight="normal">Postgres + pgvector, Milvus,</text>
<text x="29" y="521" font-size="16" font-weight="normal">Weaviate</text>
<text x="29" y="545" font-size="16" font-weight="normal">Faiss: thư viện, không phải CSDL</text>
<line x1="160" y1="565" x2="160" y2="582" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="16" y="584" width="288" height="148" rx="12" fill="#e2e8f0" stroke="#94a3b8"/>
<text x="29" y="613" font-size="16" font-weight="bold">5 · Mô hình</text>
<text x="29" y="641" font-size="16" font-weight="normal">Llama, Mistral, Qwen, Phi,</text>
<text x="29" y="665" font-size="16" font-weight="normal">Gemma</text>
<text x="29" y="689" font-size="16" font-weight="normal">Giấy phép từng mô hình khác</text>
<text x="29" y="713" font-size="16" font-weight="normal">nhau</text>
<rect x="16" y="742" width="288" height="100" rx="12" fill="#fee2e2" stroke="#94a3b8"/>
<text x="29" y="771" font-size="16" font-weight="bold">“Mở” có nhiều mức</text>
<text x="29" y="799" font-size="16" font-weight="normal">Mở trọng số chưa chắc là mã</text>
<text x="29" y="823" font-size="16" font-weight="normal">nguồn mở. Đọc giấy phép.</text>
</g></svg>
