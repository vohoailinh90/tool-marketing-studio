<text x="64" y="1168.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Nguồn chỉ nêu tên, không</text>
<text x="64" y="1187.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">nói dùng thế nào.</text>
