<text x="46" y="1491.5" font-size="16" fill="#ffffff" font-weight="bold" text-anchor="middle">3</text>
<text x="70" y="1486.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">11 · Công cụ AI</text>
<text x="70" y="1510.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Đọc gợi ý như mã của người</text>
<text x="70" y="1529.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">lạ.</text>
<polyline points="46,1440 46,1458" fill="none" stroke="#334155" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
