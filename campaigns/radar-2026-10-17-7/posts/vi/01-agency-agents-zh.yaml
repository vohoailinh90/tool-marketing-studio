  - emoji: ⚙️
    title: Tập lệnh chuyển đổi
    text: Chuyển đổi định dạng prompt sang cú pháp riêng của từng công cụ hỗ trợ.
  - emoji: 🔌
    title: Tập lệnh cài đặt
    text: Tự động phát hiện và cài đặt các agent vào môi trường AI đích.
  - emoji: 📦
    title: Tập lệnh kiểm tra
    text: Kiểm tra cú pháp và tính toàn vẹn của các tệp định nghĩa agent.
