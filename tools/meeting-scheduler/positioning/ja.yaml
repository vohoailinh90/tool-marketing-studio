lang: ja
one_liner: "複数の国にまたがる大人数の会議で、全員の勤務時間に収まる時間帯を探すための小さなツールのアイデアです。"
audience: >-
  日本の会社で、海外拠点（欧州・東南アジア・米国）のメンバーと定例会議を設定する人（チームリーダー、総務、まとめ役）。
  スマホでFacebookを読む。
pains:
  - "各拠点の勤務時間が重なる時間帯が、ほとんど残らない"
  - "時差の換算を手作業でやると、ひとつ間違えるだけで全員がずれる"
  - "全員が収まる時間がないとき、誰が不便な時間を引き受けるのかが曖昧になる"
  - "社外のメンバーは予定が見えず、推測になってしまう"
  - "管理職は会議で埋まる時間帯が人によって違い、同じ部署でも共通の空きを探しにくい"
  - "祝日が国ごとに違う"
promise: "参加者と所要時間を入れると、共通の時間帯を示し、Outlookの下書きまで開く。送信はご自身で確認してから。"
objections:
  - {q: "招待を自動で送りますか？", a: "いいえ。Outlookで下書きを開くだけで、送信はご自身で行います。"}
  - {q: "もう公開されていますか？", a: "いいえ。今は個人で試している段階で、公開の予定はまだありません。"}
  - {q: "同僚の予定はどう読みますか？", a: "ご本人のアカウントでMicrosoft Graphを使います。会社（IT）の許可が必要です。"}
vocabulary: [日程調整, 時差, 勤務時間, 共通の空き時間, 定例会議, 海外拠点, 現地時間, 候補日]
angles:
  - "ベトナム・インド・韓国は共通の勤務時間が1日5.5時間。でも10人だと全員が空いている枠は約14%"
  - "全員が収まらないとき、誰が負担するのか"
  - "管理職の予定が埋まっているとき、会議時間を決める4つの方法とその効果（シミュレーション）"
  - "なぜ作ってみたのか（作者の確認が必要）"
tone: "丁寧な です・ます調。まず共感から入り、押しつけない。アイデアの共有であり、製品ではないことを正直に伝える。"
