<svg xmlns="http://www.w3.org/2000/svg" width="360" height="420" viewBox="0 0 360 420" role="img" aria-labelledby="title desc">
<title id="title">Xử lý lỗi web request mà không làm quá tải thêm</title>
<desc id="desc">Phân loại lỗi: 400: sửa dữ liệu: 429: giảm nhịp, xét Retry-After; Trước khi retry: Thao tác có lặp an toàn?: Backoff + jitter + deadline; Bảo vệ hai phía: Server giới hạn tải: UI giữ input + request ID. Các khung là ý chính để đối chiếu, không nhất thiết là các bước tuần tự.</desc>
<rect width="360" height="420" fill="#f8fafc"/>
<g font-family="DejaVu Sans, sans-serif" fill="#0f172a">
<text x="20" y="28" font-size="18" font-weight="bold">sd-11-019 · Nhìn hình trước</text>
<rect x="12" y="48" width="336" height="102" rx="12" fill="#e0f2fe" stroke="#64748b"/>
<text x="24" y="75" font-size="18" font-weight="bold">Phân loại lỗi</text>
<text x="24" y="104" font-size="18">400: sửa dữ liệu</text>
<text x="24" y="130" font-size="18">429: giảm nhịp, xét Retry-After</text>
<rect x="12" y="162" width="336" height="102" rx="12" fill="#dcfce7" stroke="#64748b"/>
<text x="24" y="189" font-size="18" font-weight="bold">Trước khi retry</text>
<text x="24" y="218" font-size="18">Thao tác có lặp an toàn?</text>
<text x="24" y="244" font-size="18">Backoff + jitter + deadline</text>
<rect x="12" y="276" width="336" height="102" rx="12" fill="#fef3c7" stroke="#64748b"/>
<text x="24" y="303" font-size="18" font-weight="bold">Bảo vệ hai phía</text>
<text x="24" y="332" font-size="18">Server giới hạn tải</text>
<text x="24" y="358" font-size="18">UI giữ input + request ID</text>
</g>
</svg>
