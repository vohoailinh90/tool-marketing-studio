<svg xmlns="http://www.w3.org/2000/svg" width="320" height="1490" viewBox="0 0 320 1490" role="img" aria-labelledby="title desc">
<title id="title">Ba ngôn ngữ, ba cách dọn rác</title>
<desc id="desc">Bốn nhóm thẻ. Java nhóm nhỏ gọn hoặc đề cao thông lượng: bộ dọn Serial và Parallel. Java nhóm quan tâm thời gian dừng: CMS, G1 và ZGC. CPython và Go: CPython đếm tham chiếu cộng bộ dọn vòng tham chiếu, Go dùng bộ dọn đánh dấu và quét chạy đồng thời. Khung cuối nêu ba điều cần nhớ.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs>
<rect width="320" height="1490" fill="#f8fafc"/>
<g font-family="DejaVu Sans, Arial, sans-serif" fill="#0f172a">
<text x="16" y="34" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">Ba ngôn ngữ, ba cách</text>
<text x="16" y="58" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">dọn rác</text>
<text x="16" y="84.2" font-size="15" fill="#475569" font-weight="normal" text-anchor="start">Mỗi cách cân nhắc khác nhau giữa</text>
<text x="16" y="103.8" font-size="15" fill="#475569" font-weight="normal" text-anchor="start">tổng việc làm và thời gian dừng.</text>
<rect x="8" y="123" width="304" height="287" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="151.2" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Java: nhỏ gọn hoặc đề cao</text>
<text x="20" y="173.2" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">thông lượng</text>
<rect x="20" y="190" width="280" height="87" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="50" cy="233.5" r="18" fill="#1d4ed8"/><g transform="translate(39.2 222.7) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20v2"/><path d="M12 2v2"/><path d="M17 20v2"/><path d="M17 2v2"/><path d="M2 12h2"/><path d="M2 17h2"/><path d="M2 7h2"/><path d="M20 12h2"/><path d="M20 17h2"/><path d="M20 7h2"/><path d="M7 20v2"/><path d="M7 2v2"/><rect height="16" rx="2" width="16" x="4" y="4"/><rect height="8" rx="1" width="8" x="8" y="8"/></g>
<text x="78" y="216.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Serial</text>
<text x="78" y="240.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Hợp môi trường một luồng</text>
<text x="78" y="259.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">hoặc ứng dụng nhỏ.</text>
<rect x="20" y="291" width="280" height="107" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="50" cy="344.5" r="18" fill="#1d4ed8"/><g transform="translate(39.2 333.7) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 14 4-4"/><path d="M3.34 19a10 10 0 1 1 17.32 0"/></g>
<text x="78" y="317.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Parallel</text>
<text x="78" y="341.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Còn gọi là Throughput</text>
<text x="78" y="360.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Collector: đề cao thông</text>
<text x="78" y="380.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">lượng.</text>
<rect x="8" y="422" width="304" height="368" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="450.2" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Java: quan tâm thời gian</text>
<text x="20" y="472.3" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">dừng</text>
<rect x="20" y="489" width="280" height="87" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
<circle cx="50" cy="532.5" r="18" fill="#0f766e"/><g transform="translate(39.2 521.7) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="10" x2="14" y1="2" y2="2"/><line x1="12" x2="15" y1="14" y2="11"/><circle cx="12" cy="14" r="8"/></g>
<text x="78" y="515.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">CMS</text>
<text x="78" y="539.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Độ trễ thấp, cố giảm thời</text>
<text x="78" y="558.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">gian dừng.</text>
<rect x="20" y="590" width="280" height="87" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
<circle cx="50" cy="633.5" r="18" fill="#0f766e"/><g transform="translate(39.2 622.7) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18"/><path d="m19 8 3 8a5 5 0 0 1-6 0zV7"/><path d="M3 7h1a17 17 0 0 0 8-2 17 17 0 0 0 8 2h1"/><path d="m5 8 3 8a5 5 0 0 1-6 0zV7"/><path d="M7 21h10"/></g>
<text x="78" y="616.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">G1</text>
<text x="78" y="640.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Cân bằng giữa thông lượng</text>
<text x="78" y="659.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">và độ trễ.</text>
<rect x="20" y="691" width="280" height="87" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
<circle cx="50" cy="734.5" r="18" fill="#0f766e"/><g transform="translate(39.2 723.7) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15.914 4a1.5 1.5 0 00-2.474-1.561l-9 9A1.5 1.5 0 005.5 14h4.002a.5.5 0 01.471.666L8.086 20a1.5 1.5 0 002.475 1.56l9-9A1.5 1.5 0 0018.5 10h-3.997a.5.5 0 01-.472-.667z"/></g>
<text x="78" y="717.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">ZGC</text>
<text x="78" y="741.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Vùng nhớ lớn, thời gian</text>
<text x="78" y="760.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">dừng tối thiểu.</text>
<rect x="8" y="802" width="304" height="386" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="830.1" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">CPython và Go</text>
<rect x="20" y="847" width="280" height="107" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
<circle cx="50" cy="900.5" r="18" fill="#b45309"/><g transform="translate(39.2 889.7) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" x2="20" y1="9" y2="9"/><line x1="4" x2="20" y1="15" y2="15"/><line x1="10" x2="8" y1="3" y2="21"/><line x1="16" x2="14" y1="3" y2="21"/></g>
<text x="78" y="873.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">CPython: đếm tham</text>
<text x="78" y="893.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">chiếu</text>
<text x="78" y="917.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Bộ đếm về không thì giải</text>
<text x="78" y="936.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">phóng vùng nhớ.</text>
<rect x="20" y="968" width="280" height="107" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
<circle cx="50" cy="1021.5" r="18" fill="#b45309"/><g transform="translate(39.2 1010.7) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></g>
<text x="78" y="994.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">CPython: dọn vòng</text>
<text x="78" y="1014.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">tham chiếu</text>
<text x="78" y="1038.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Xử lý đối tượng trỏ vòng</text>
<text x="78" y="1057.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">quanh nhau.</text>
<rect x="20" y="1089" width="280" height="87" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
<circle cx="50" cy="1132.5" r="18" fill="#b45309"/><g transform="translate(39.2 1121.7) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect height="8" rx="2" width="8" x="3" y="3"/><path d="M7 11v4a2 2 0 0 0 2 2h4"/><rect height="8" rx="2" width="8" x="13" y="13"/></g>
<text x="78" y="1115.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Go: đánh dấu và quét</text>
<text x="78" y="1139.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Chạy đồng thời với ứng</text>
<text x="78" y="1158.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">dụng để giảm lần dừng.</text>
<rect x="8" y="1200" width="304" height="282" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="1228.1" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Nhớ gì</text>
<rect x="20" y="1245" width="280" height="83" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="1268" r="11" fill="#16a34a"/>
<polyline points="37.9,1268.4 41.7,1272.4 48.5,1264" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="1271.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Chọn bộ dọn là chọn giữa</text>
<text x="64" y="1290.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">tổng việc làm và thời gian</text>
<text x="64" y="1310.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">chờ.</text>
<rect x="20" y="1336" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="1359" r="11" fill="#16a34a"/>
<polyline points="37.9,1359.4 41.7,1363.4 48.5,1355" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="1362.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Dọn đồng thời giảm lần dừng</text>
<text x="64" y="1381.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">nhưng có chi phí.</text>
<rect x="20" y="1407" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="1430" r="11" fill="#16a34a"/>
<polyline points="37.9,1430.4 41.7,1434.4 48.5,1426" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="1433.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Xem tài liệu của phiên bản</text>
<text x="64" y="1452.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Java đang dùng.</text>
</g>
</svg>
