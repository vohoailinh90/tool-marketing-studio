<svg xmlns="http://www.w3.org/2000/svg" width="320" height="1054" viewBox="0 0 320 1054" role="img" aria-labelledby="title desc">
<title id="title">Năm cách giữ bộ nhớ đệm khớp với cơ sở dữ liệu</title>
<desc id="desc">Ba khung. Khung một, hai cách đọc: cache-aside, ứng dụng hỏi bộ nhớ đệm, thiếu thì đọc cơ sở dữ liệu rồi tự cất vào; read-through, bộ nhớ đệm tự đi lấy khi thiếu. Khung hai, ba cách ghi: write-through ghi cả hai trong cùng một thao tác; write-around chỉ ghi cơ sở dữ liệu rồi xóa bản trong bộ nhớ đệm; write-back chỉ ghi bộ nhớ đệm, chép xuống cơ sở dữ liệu sau. Khung ba, kết quả thử với Redis và SQLite: sửa cơ sở dữ liệu mà không xóa bản đệm thì đọc ra giá cũ cho tới khi hết hạn; một lượt đọc chậm có thể cất lại giá cũ ngay sau lượt xóa; write-back mất lần ghi chưa chép khi bộ nhớ đệm sập.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs>
<rect width="320" height="1054" fill="#f8fafc"/>
<g font-family="DejaVu Sans, Arial, sans-serif" fill="#0f172a">
<text x="16" y="34" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">Năm cách giữ bộ nhớ</text>
<text x="16" y="58" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">đệm khớp với cơ sở dữ</text>
<text x="16" y="82" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">liệu</text>
<text x="16" y="108.2" font-size="15" fill="#475569" font-weight="normal" text-anchor="start">Hai cách đọc, ba cách ghi; mỗi cách</text>
<text x="16" y="127.8" font-size="15" fill="#475569" font-weight="normal" text-anchor="start">sai theo một kiểu riêng.</text>
<rect x="8" y="147" width="304" height="231" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="175.2" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Hai cách đọc</text>
<rect x="20" y="192" width="280" height="83" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="215" r="11" fill="#16a34a"/>
<polyline points="37.9,215.4 41.7,219.4 48.5,211" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="218.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Cache-aside: ứng dụng hỏi</text>
<text x="64" y="237.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">bộ đệm, thiếu thì đọc cơ sở</text>
<text x="64" y="257.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">dữ liệu rồi tự cất vào.</text>
<rect x="20" y="283" width="280" height="83" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="306" r="11" fill="#16a34a"/>
<polyline points="37.9,306.4 41.7,310.4 48.5,302" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="309.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Read-through: bộ đệm tự đi</text>
<text x="64" y="328.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">lấy khi thiếu; ứng dụng chỉ</text>
<text x="64" y="348.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">nói chuyện với bộ đệm.</text>
<rect x="8" y="390" width="304" height="322" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="418.2" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Ba cách ghi</text>
<rect x="20" y="435" width="280" height="83" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="458" r="11" fill="#16a34a"/>
<polyline points="37.9,458.4 41.7,462.4 48.5,454" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="461.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Write-through: ghi cả hai</text>
<text x="64" y="480.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">trong cùng một thao tác;</text>
<text x="64" y="500.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">đọc ngay thấy giá mới.</text>
<rect x="20" y="526" width="280" height="83" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="549" r="11" fill="#16a34a"/>
<polyline points="37.9,549.4 41.7,553.4 48.5,545" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="552.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Write-around: chỉ ghi cơ sở</text>
<text x="64" y="571.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">dữ liệu, rồi xóa bản trong bộ</text>
<text x="64" y="591.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">đệm.</text>
<rect x="20" y="617" width="280" height="83" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="640" r="11" fill="#16a34a"/>
<polyline points="37.9,640.4 41.7,644.4 48.5,636" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="643.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Write-back: chỉ ghi bộ đệm,</text>
<text x="64" y="662.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">chép xuống cơ sở dữ liệu</text>
<text x="64" y="682.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">sau.</text>
<rect x="8" y="724" width="304" height="322" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="752.1" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Thử với Redis và SQLite</text>
<rect x="20" y="769" width="280" height="83" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="792" r="11" fill="#16a34a"/>
<polyline points="37.9,792.4 41.7,796.4 48.5,788" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="795.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Sửa cơ sở dữ liệu mà quên</text>
<text x="64" y="814.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">xóa bản đệm: đọc ra giá cũ</text>
<text x="64" y="834.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">tới khi hết hạn.</text>
<rect x="20" y="860" width="280" height="83" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="883" r="11" fill="#16a34a"/>
<polyline points="37.9,883.4 41.7,887.4 48.5,879" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="886.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Lượt đọc chậm cất lại giá cũ</text>
<text x="64" y="905.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">ngay sau lượt xóa: lại cũ</text>
<text x="64" y="925.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">thêm một hạn nữa.</text>
<rect x="20" y="951" width="280" height="83" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="974" r="11" fill="#16a34a"/>
<polyline points="37.9,974.4 41.7,978.4 48.5,970" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="977.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Write-back: bộ đệm sập</text>
<text x="64" y="996.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">trước khi chép thì lần ghi đó</text>
<text x="64" y="1016.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">mất.</text>
</g>
</svg>
