<svg xmlns="http://www.w3.org/2000/svg" width="320" height="1347" viewBox="0 0 320 1347" role="img" aria-labelledby="title desc">
<title id="title">Tám lĩnh vực hay dùng C++</title>
<desc id="desc">Ba nhóm thẻ. Gần phần cứng: hệ thống nhúng, hệ điều hành, mạng. Cần chạy nhanh: game, cơ sở dữ liệu, tính toán khoa học. Hai lĩnh vực còn lại: trình duyệt web và ứng dụng tài chính. Khung cuối nhắc ba điều cần nhớ.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs>
<rect width="320" height="1347" fill="#f8fafc"/>
<g font-family="DejaVu Sans, Arial, sans-serif" fill="#0f172a">
<text x="16" y="34" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">Tám lĩnh vực hay dùng</text>
<text x="16" y="58" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">C++</text>
<text x="16" y="84.2" font-size="15" fill="#475569" font-weight="normal" text-anchor="start">Xếp theo điều mỗi lĩnh vực đòi hỏi.</text>
<rect x="8" y="104" width="304" height="346" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="132.2" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Gần phần cứng</text>
<rect x="20" y="149" width="280" height="87" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="50" cy="192.5" r="18" fill="#1d4ed8"/><g transform="translate(39.2 181.7) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20v2"/><path d="M12 2v2"/><path d="M17 20v2"/><path d="M17 2v2"/><path d="M2 12h2"/><path d="M2 17h2"/><path d="M2 7h2"/><path d="M20 12h2"/><path d="M20 17h2"/><path d="M20 7h2"/><path d="M7 20v2"/><path d="M7 2v2"/><rect height="16" rx="2" width="16" x="4" y="4"/><rect height="8" rx="1" width="8" x="8" y="8"/></g>
<text x="78" y="175.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Hệ thống nhúng</text>
<text x="78" y="199.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Thiết bị nhỏ: phải tính kỹ</text>
<text x="78" y="218.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">việc cấp phát bộ nhớ động.</text>
<rect x="20" y="250" width="280" height="87" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="50" cy="293.5" r="18" fill="#1d4ed8"/><g transform="translate(39.2 282.7) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19h8"/><path d="m4 17 6-6-6-6"/></g>
<text x="78" y="276.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Hệ điều hành</text>
<text x="78" y="300.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Nói chuyện trực tiếp với</text>
<text x="78" y="319.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">phần cứng, quản lý bộ nhớ.</text>
<rect x="20" y="351" width="280" height="87" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="50" cy="394.5" r="18" fill="#1d4ed8"/><g transform="translate(39.2 383.7) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect height="6" rx="1" width="6" x="16" y="16"/><rect height="6" rx="1" width="6" x="2" y="16"/><rect height="6" rx="1" width="6" x="9" y="2"/><path d="M5 16v-3a1 1 0 0 1 1-1h12a1 1 0 0 1 1 1v3"/><path d="M12 12V8"/></g>
<text x="78" y="377.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Mạng</text>
<text x="78" y="401.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Xử lý gói tin liên tục, độ trễ</text>
<text x="78" y="420.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">thấp.</text>
<rect x="8" y="462" width="304" height="346" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="490.2" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Cần chạy nhanh</text>
<rect x="20" y="507" width="280" height="87" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
<circle cx="50" cy="550.5" r="18" fill="#0f766e"/><g transform="translate(39.2 539.7) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15.914 4a1.5 1.5 0 00-2.474-1.561l-9 9A1.5 1.5 0 005.5 14h4.002a.5.5 0 01.471.666L8.086 20a1.5 1.5 0 002.475 1.56l9-9A1.5 1.5 0 0018.5 10h-3.997a.5.5 0 01-.472-.667z"/></g>
<text x="78" y="533.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Game</text>
<text x="78" y="557.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Mỗi khung hình có ngân</text>
<text x="78" y="576.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">sách thời gian cố định.</text>
<rect x="20" y="608" width="280" height="87" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
<circle cx="50" cy="651.5" r="18" fill="#0f766e"/><g transform="translate(39.2 640.7) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5V19A9 3 0 0 0 21 19V5"/><path d="M3 12A9 3 0 0 0 21 12"/></g>
<text x="78" y="634.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Cơ sở dữ liệu</text>
<text x="78" y="658.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Quản lý bộ nhớ để trả lời</text>
<text x="78" y="677.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">truy vấn nhanh.</text>
<rect x="20" y="709" width="280" height="87" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
<circle cx="50" cy="752.5" r="18" fill="#0f766e"/><g transform="translate(39.2 741.7) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v16a2 2 0 0 0 2 2h16"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/></g>
<text x="78" y="735.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Tính toán khoa học</text>
<text x="78" y="759.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Cùng phép tính lặp rất</text>
<text x="78" y="778.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">nhiều lần trên số liệu lớn.</text>
<rect x="8" y="820" width="304" height="245" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="848.1" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Hai lĩnh vực còn lại</text>
<rect x="20" y="865" width="280" height="87" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
<circle cx="50" cy="908.5" r="18" fill="#b45309"/><g transform="translate(39.2 897.7) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></g>
<text x="78" y="891.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Trình duyệt web</text>
<text x="78" y="915.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Chạy trên máy người dùng:</text>
<text x="78" y="934.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">nhanh mà gọn bộ nhớ.</text>
<rect x="20" y="966" width="280" height="87" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
<circle cx="50" cy="1009.5" r="18" fill="#b45309"/><g transform="translate(39.2 998.7) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect height="14" rx="2" width="20" x="2" y="5"/><line x1="2" x2="22" y1="10" y2="10"/><path d="M6 14h2"/></g>
<text x="78" y="992.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Ứng dụng tài chính</text>
<text x="78" y="1016.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Nhiều loại phần mềm; bài</text>
<text x="78" y="1035.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">này không nói thêm.</text>
<rect x="8" y="1077" width="304" height="262" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="1105.1" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Nhớ gì</text>
<rect x="20" y="1122" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="1145" r="11" fill="#16a34a"/>
<polyline points="37.9,1145.4 41.7,1149.4 48.5,1141" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="1148.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Cách chia nhóm là của bài,</text>
<text x="64" y="1167.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">không phải của nguồn.</text>
<rect x="20" y="1193" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="1216" r="11" fill="#16a34a"/>
<polyline points="37.9,1216.4 41.7,1220.4 48.5,1212" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="1219.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Nguồn chỉ nêu tên tám lĩnh</text>
<text x="64" y="1238.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">vực.</text>
<rect x="20" y="1264" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="1287" r="11" fill="#16a34a"/>
<polyline points="37.9,1287.4 41.7,1291.4 48.5,1283" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="1290.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Dùng C++ ở đâu không có</text>
<text x="64" y="1309.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">nghĩa là lựa chọn duy nhất.</text>
</g>
</svg>
