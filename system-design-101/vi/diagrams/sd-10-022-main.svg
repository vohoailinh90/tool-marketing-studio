<svg xmlns="http://www.w3.org/2000/svg" width="320" height="1810" viewBox="0 0 320 1810" role="img" aria-labelledby="title desc">
<title id="title">Mệnh lệnh, hàm, hướng đối tượng</title>
<desc id="desc">Ba nhóm thẻ, mỗi nhóm bốn thẻ, và một khung ghi nhớ. Mệnh lệnh: đổi trạng thái bằng chuỗi lệnh, dùng vòng lặp và câu lệnh điều kiện, nhấn mạnh dữ liệu thay đổi được và các bước tường minh, ví dụ C và Python. Hàm: hàm thuần không tác dụng phụ, bất biến, hàm bậc cao và đệ quy, ví dụ Haskell, Lisp, Scala. Hướng đối tượng: mô hình thực thể thành đối tượng, kế thừa đóng gói đa hình, dùng lớp đối tượng và giao diện, ví dụ Java, C++, Python, Ruby. Khung cuối nêu ba điều cần nhớ.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs>
<rect width="320" height="1810" fill="#f8fafc"/>
<g font-family="DejaVu Sans, Arial, sans-serif" fill="#0f172a">
<text x="16" y="34" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">Mệnh lệnh, hàm, hướng</text>
<text x="16" y="58" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">đối tượng</text>
<text x="16" y="84.2" font-size="15" fill="#475569" font-weight="normal" text-anchor="start">Ba mô hình lập trình chính, mỗi mô</text>
<text x="16" y="103.8" font-size="15" fill="#475569" font-weight="normal" text-anchor="start">hình bốn ý.</text>
<rect x="8" y="123" width="304" height="467" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="151.2" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Mệnh lệnh</text>
<rect x="20" y="168" width="280" height="87" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="50" cy="211.5" r="18" fill="#1d4ed8"/><g transform="translate(39.2 200.7) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5h10"/><path d="M11 12h10"/><path d="M11 19h10"/><path d="M4 4h1v5"/><path d="M4 9h2"/><path d="M6.5 20H3.4c0-1 2.6-1.925 2.6-3.5a1.5 1.5 0 0 0-2.6-1.02"/></g>
<text x="78" y="194.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Chuỗi lệnh</text>
<text x="78" y="218.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Đổi trạng thái chương trình</text>
<text x="78" y="237.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">qua một chuỗi lệnh.</text>
<rect x="20" y="269" width="280" height="87" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="50" cy="312.5" r="18" fill="#1d4ed8"/><g transform="translate(39.2 301.7) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6a9 9 0 0 0-9 9V3"/><circle cx="18" cy="6" r="3"/><circle cx="6" cy="18" r="3"/></g>
<text x="78" y="295.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Cấu trúc điều khiển</text>
<text x="78" y="319.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Vòng lặp và câu lệnh điều</text>
<text x="78" y="338.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">kiện lo luồng chạy.</text>
