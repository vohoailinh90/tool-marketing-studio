id: 02-manager-busy
status: draft
format: portrait
series: "海外会議の日程調整 · #2"
link: ~
slides:
  - layout: cover
    emoji: "🗓️"
    eyebrow: "部署をまたぐ会議"
    title: "管理職の予定が\n**埋まっている**とき、\n会議時間を決める4つの方法"
    subtitle: "毎回ひとりずつ聞かなくても大丈夫です。それぞれの効果をシミュレーションで確かめました。"
    badge: "最後までご覧ください 👉"

  - layout: stat
    eyebrow: "出発点"
    value: "約7%"
    label: "同じ部署10人で全員が空いている60分の枠が、1週間に見つかる確率"
    caption: "前回と同じ条件のシミュレーション：一般メンバー8人は勤務時間の約30%、管理職2人は約60%が埋まっている前提です。"

  - layout: stat
    eyebrow: "方法1：必須メンバーを絞る"
    before: "7%"
    after: "61%"
    label: "必須は一般メンバー8人だけにして、管理職は来られれば歓迎にする"
    caption: "管理職2人のうち少なくとも1人にも出てほしい場合は、約35%です。"

  - layout: stat
    eyebrow: "方法2：短くする"
    before: "7%"
    after: "65%"
    label: "60分の会議を30分にする"
    caption: "同じ条件で、10人全員が空いている枠が見つかる確率です。"

  - layout: stat
    eyebrow: "方法3：探す期間を延ばす"
    before: "7%"
    after: "30%"
    label: "探す期間を1週間から4週間にする"
    caption: "2週間なら約14%です。"

  - layout: stat
    eyebrow: "方法4：動かすのは1人の会議だけ"
    value: "約57%"
    label: "忙しい人が多くても1人だけ、という枠がある週の割合"
    caption: "そのような枠の約48%では、その1人が管理職です。誰にお願いすればよいかが分かります。"

  - layout: poll
    eyebrow: "ちょっとだけ教えてください"
    question: "管理職の予定が\n埋まっているとき、\nどうしていますか？"
    options:
      - "先に管理職に聞き、ほかを合わせる"
      - "2〜3個の候補を出して選んでもらう"
      - "管理職抜きで開き、あとで共有する"
      - "翌週に回す"

  - layout: cta
    emoji: "💬"
    title: "試作中のツールで\nどこまでできるか"
    text: "候補ごと（最大5件）に、誰が空いていないかを表示できます。誰が最も多く枠を塞いでいるかを数える機能は、まだアイデアです。公開前で、同じ組織の方の予定のみ読めます。"
    show_link: false

platforms:
  facebook:
    caption: |
      管理職の予定が埋まっているとき、会議時間をどう決めますか？ 4つの方法をシミュレーションで試しました 🗓️

      条件：同じ部署の10人。8人は勤務時間の約30%、管理職2人は倍の約60%が会議で埋まっています。1週間のうちに全員が空いている60分の枠が見つかるのは約7%です。それぞれの方法を試すと：

      1）必須メンバーを絞り、管理職は来られれば歓迎にする：約61%（管理職2人のうち少なくとも1人にも出てほしい場合は約35%）
      2）60分を30分にする：約65%
      3）探す期間を1週間から4週間にする：約30%（2週間なら約14%）
      4）動かしてもらうのは1人の会議だけにする：忙しい人が多くても1人だけという枠がある週は約57%で、その枠の約48%ではその1人が管理職なので、誰にお願いすればよいかが分かります。

      シミュレーションを使わないコツをひとつ：ひとりずつ聞くより、2〜3個の候補を出して選んでもらうほうが早く決まります。

      （ランダムな予定によるシミュレーションで、「管理職は倍忙しい」は私の仮定です。実在のチームの数字ではありません。）

      この課題のために小さなツールを試作していますが、同じ組織の方の予定しか読めず、公開もしていません。管理職の予定が埋まっているとき、どうしていますか？ A / B / C / D でコメントいただけるとうれしいです 👇
    first_comment: |
      A. 先に管理職に聞き、ほかを合わせる ・ B. 2〜3個の候補を出して選んでもらう ・ C. 管理職抜きで開き、あとで共有する ・ D. 翌週に回す
    hashtags: [日程調整, 会議, 管理職, 業務効率化, 働き方]
