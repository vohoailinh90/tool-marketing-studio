<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 746" width="320" height="746" role="img" aria-labelledby="title desc">
<title id="title">JavaScript chạy một việc một lúc</title>
<desc id="desc">Năm khung dọc: engine đọc mã thành bytecode và JIT tối ưu đoạn hay chạy; call stack chạy mã từng việc một nên việc dài làm trang đứng; môi trường như trình duyệt hoặc Node lo timer, mạng và sự kiện; hai hàng đợi gồm microtask cho promise chạy trước và task cho setTimeout và sự kiện; event loop lấy việc kế tiếp khi stack rỗng và chạy hết microtask trước. Ví dụ trong bài in A, D, C, B.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#475569" stroke-width="1.5"/></marker></defs>
<rect width="320" height="746" fill="#f8fafc"/>
<g font-family="DejaVu Sans, Arial, sans-serif" fill="#0f172a">
<text x="16" y="30" font-size="20" font-weight="bold">JAVASCRIPT</text>
<text x="16" y="56" font-size="20" font-weight="bold">CHẠY RA SAO</text>
<text x="16" y="86" font-size="16" font-weight="normal">Một luồng, nhiều việc chờ</text>
<rect x="16" y="108" width="288" height="104" rx="12" fill="#dbeafe" stroke="#94a3b8"/>
<text x="30" y="138" font-size="16" font-weight="bold">1 · Engine</text>
<text x="30" y="165" font-size="16" font-weight="normal">Đọc mã → bytecode</text>
<text x="30" y="192" font-size="16" font-weight="normal">JIT tối ưu đoạn hay chạy</text>
<rect x="16" y="226" width="288" height="104" rx="12" fill="#dcfce7" stroke="#94a3b8"/>
<text x="30" y="256" font-size="16" font-weight="bold">2 · Call stack</text>
<text x="30" y="283" font-size="16" font-weight="normal">Mã chạy từng việc một</text>
<text x="30" y="310" font-size="16" font-weight="normal">Việc dài làm trang đứng</text>
<rect x="16" y="344" width="288" height="104" rx="12" fill="#ede9fe" stroke="#94a3b8"/>
<text x="30" y="374" font-size="16" font-weight="bold">3 · Môi trường làm hộ</text>
<text x="30" y="401" font-size="16" font-weight="normal">Timer, mạng, sự kiện</text>
<text x="30" y="428" font-size="16" font-weight="normal">Do trình duyệt hoặc Node lo</text>
<rect x="16" y="462" width="288" height="104" rx="12" fill="#fef3c7" stroke="#94a3b8"/>
<text x="30" y="492" font-size="16" font-weight="bold">4 · Hàng đợi</text>
<text x="30" y="519" font-size="16" font-weight="normal">Microtask: promise, chạy trước</text>
<text x="30" y="546" font-size="16" font-weight="normal">Task: setTimeout, sự kiện</text>
<rect x="16" y="580" width="288" height="104" rx="12" fill="#e2e8f0" stroke="#94a3b8"/>
<text x="30" y="610" font-size="16" font-weight="bold">5 · Event loop</text>
<text x="30" y="637" font-size="16" font-weight="normal">Stack rỗng → lấy việc kế</text>
<text x="30" y="664" font-size="16" font-weight="normal">Chạy hết microtask trước</text>
<text x="16" y="726" font-size="16" font-weight="normal">Ví dụ trong bài: in A, D, C, B.</text>
</g></svg>
