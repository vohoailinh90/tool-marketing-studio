<svg xmlns="http://www.w3.org/2000/svg" width="320" height="715" viewBox="0 0 320 715" role="img" aria-labelledby="title desc">
<title id="title">Quốc tế hóa website bán hàng</title>
<desc id="desc">Hai khung. Khung một, ba mảng giao diện: ngôn ngữ (văn bản tách khỏi mã, không ghép chuỗi), bố cục (chừa chỗ cho chữ dài, định dạng số và ngày theo nơi), múi giờ (lưu giờ UTC, hiển thị giờ địa phương). Khung hai, hai mảng nghiệp vụ: tiền tệ (tiền hiển thị, tiền quyết toán, dịch vụ quy đổi) và pháp nhân cùng kế toán (mỗi nước một pháp nhân, chuẩn kế toán khác nhau).</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs>
<rect width="320" height="715" fill="#f8fafc"/>
<g font-family="DejaVu Sans, Arial, sans-serif" fill="#0f172a">
<text x="16" y="34" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">Quốc tế hóa website bán</text>
<text x="16" y="58" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">hàng</text>
<text x="16" y="84.2" font-size="15" fill="#475569" font-weight="normal" text-anchor="start">Năm mảng cần tách khỏi mã.</text>
<rect x="8" y="104" width="304" height="346" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="132.2" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Ba mảng giao diện</text>
<rect x="20" y="149" width="280" height="87" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="50" cy="192.5" r="18" fill="#1d4ed8"/><g transform="translate(39.2 181.7) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></g>
<text x="78" y="175.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Ngôn ngữ</text>
<text x="78" y="199.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Văn bản tách khỏi mã,</text>
<text x="78" y="218.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">không ghép chuỗi.</text>
<rect x="20" y="250" width="280" height="87" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="50" cy="293.5" r="18" fill="#1d4ed8"/><g transform="translate(39.2 282.7) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83z"/><path d="M2 12a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 12"/><path d="M2 17a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 17"/></g>
<text x="78" y="276.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Bố cục</text>
<text x="78" y="300.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Chừa chỗ cho chữ dài, đổi</text>
<text x="78" y="319.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">dạng số và ngày.</text>
<rect x="20" y="351" width="280" height="87" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="50" cy="394.5" r="18" fill="#1d4ed8"/><g transform="translate(39.2 383.7) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></g>
<text x="78" y="377.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Múi giờ</text>
<text x="78" y="401.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Lưu giờ UTC, hiển thị giờ</text>
<text x="78" y="420.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">địa phương.</text>
<rect x="8" y="462" width="304" height="245" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="490.2" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Hai mảng nghiệp vụ</text>
<rect x="20" y="507" width="280" height="87" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
<circle cx="50" cy="550.5" r="18" fill="#0f766e"/><g transform="translate(39.2 539.7) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect height="14" rx="2" width="20" x="2" y="5"/><line x1="2" x2="22" y1="10" y2="10"/><path d="M6 14h2"/></g>
<text x="78" y="533.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Tiền tệ</text>
<text x="78" y="557.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Tiền hiển thị, tiền quyết</text>
<text x="78" y="576.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">toán, quy đổi.</text>
<rect x="20" y="608" width="280" height="87" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
<circle cx="50" cy="651.5" r="18" fill="#0f766e"/><g transform="translate(39.2 640.7) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 21v-5a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v5"/><path d="M17.774 10.31a1.12 1.12 0 0 0-1.549 0 2.5 2.5 0 0 1-3.451 0 1.12 1.12 0 0 0-1.548 0 2.5 2.5 0 0 1-3.452 0 1.12 1.12 0 0 0-1.549 0 2.5 2.5 0 0 1-3.77-3.248l2.889-4.184A2 2 0 0 1 7 2h10a2 2 0 0 1 1.653.873l2.895 4.192a2.5 2.5 0 0 1-3.774 3.244"/><path d="M4 10.95V19a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8.05"/></g>
<text x="78" y="634.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Pháp nhân, kế toán</text>
<text x="78" y="658.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Mỗi nước một pháp nhân,</text>
<text x="78" y="677.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">chuẩn khác nhau.</text>
</g>
</svg>
