# Mutation manifest — see scripts/mutation_check.py
#
# Wiring in App.tsx that no other test can see (the page has no browser test in CI): every hand-made cursor move ends the
# sample's pause, pausing ends it too, a pick of a removed feature is dropped, and Play at the end of the sample starts it
# over. Each entry removes one of those lines and requires the named source-text test to notice; each mutant is a page that
# really misbehaves (checked in a browser), not a different spelling.

target: office/src/App.tsx
note: Each line is the whole defence, so the test that reads it is the only thing that can notice it going.
mutations:
- label: a hand-made cursor move no longer ends the sample's pause, so it fires later and drags the live view back to the sample
  find: |-
    cancelHold()
        setCursor(next)
  replace: |-
    setCursor(next)
  test: tests.test_office_ui.SourceHygieneTests.test_every_hand_made_cursor_move_ends_the_samples_pause
- label: pausing the player leaves the sample's pause running, so it rewinds a view the person paused
  find: |-
    if (!next) cancelHold()
  replace: |-
    // pausing does not end the pause
  test: tests.test_office_ui.SourceHygieneTests.test_every_hand_made_cursor_move_ends_the_samples_pause
- label: the pick of a removed feature is never dropped, so every answer is refused and the page sits on the loading state
  find: |-
    if (kept !== feature) setFeature(kept)
  replace: |-
    // the filter is kept whatever the answer says
  test: tests.test_office_ui.SourceHygieneTests.test_the_page_draws_an_answer_whose_feature_no_longer_exists_and_drops_the_filter
- label: Play at the end of the sample does nothing after the end-of-sample pause was cancelled by pausing
  find: |-
    else if (source === "demo" && span && cursor !== null && cursor >= span.end) moveCursor(span.start)
  replace: |-
    // Play at the end of the sample is not special
  test: tests.test_office_ui.SourceHygieneTests.test_play_at_the_end_of_the_sample_starts_it_over
