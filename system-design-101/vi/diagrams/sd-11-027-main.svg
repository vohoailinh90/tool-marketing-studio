<svg xmlns="http://www.w3.org/2000/svg" width="360" height="420" viewBox="0 0 360 420" role="img" aria-labelledby="title desc">
<title id="title">12-Factor App: ứng dụng dễ triển khai và vận hành</title>
<desc id="desc">1–4: đầu vào: Code • dependency • config: Backing services qua cấu hình; 5–8: thực thi: Build/release/run • process: Port binding • concurrency; 9–12: vận hành: Disposability • dev/prod parity: Log stream • admin process. Các khung là ý chính để đối chiếu, không nhất thiết là các bước tuần tự.</desc>
<rect width="360" height="420" fill="#f8fafc"/>
<g font-family="DejaVu Sans, sans-serif" fill="#0f172a">
<text x="20" y="28" font-size="18" font-weight="bold">sd-11-027 · Nhìn hình trước</text>
<rect x="12" y="48" width="336" height="102" rx="12" fill="#e0f2fe" stroke="#64748b"/>
<text x="24" y="75" font-size="18" font-weight="bold">1–4: đầu vào</text>
<text x="24" y="104" font-size="18">Code • dependency • config</text>
<text x="24" y="130" font-size="18">Backing services qua cấu hình</text>
<rect x="12" y="162" width="336" height="102" rx="12" fill="#dcfce7" stroke="#64748b"/>
<text x="24" y="189" font-size="18" font-weight="bold">5–8: thực thi</text>
<text x="24" y="218" font-size="18">Build/release/run • process</text>
<text x="24" y="244" font-size="18">Port binding • concurrency</text>
<rect x="12" y="276" width="336" height="102" rx="12" fill="#fef3c7" stroke="#64748b"/>
<text x="24" y="303" font-size="18" font-weight="bold">9–12: vận hành</text>
<text x="24" y="332" font-size="18">Disposability • dev/prod parity</text>
<text x="24" y="358" font-size="18">Log stream • admin process</text>
</g>
</svg>
