<svg xmlns="http://www.w3.org/2000/svg" width="320" height="1689" viewBox="0 0 320 1689" role="img" aria-labelledby="title desc">
<title id="title">Mười nguyên tắc viết mã tốt</title>
<desc id="desc">Ba nhóm thẻ và một khung ghi nhớ. Đọc được và bền: 1 theo quy ước viết mã, 2 tài liệu và chú thích, 3 vững vàng, 4 nguyên tắc SOLID. Dễ kiểm thử và dễ đổi: 5 dễ kiểm thử, 6 trừu tượng, 7 mẫu thiết kế nhưng đừng thiết kế quá tay, 8 giảm phụ thuộc toàn cục. Giữ lâu dài: 9 tái cấu trúc liên tục, 10 bảo mật là ưu tiên hàng đầu. Khung cuối nêu ba điều cần nhớ.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs>
<rect width="320" height="1689" fill="#f8fafc"/>
<g font-family="DejaVu Sans, Arial, sans-serif" fill="#0f172a">
<text x="16" y="34" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">Mười nguyên tắc viết mã</text>
<text x="16" y="58" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">tốt</text>
<text x="16" y="84.2" font-size="15" fill="#475569" font-weight="normal" text-anchor="start">Theo thứ tự của bài nguồn.</text>
<rect x="8" y="104" width="304" height="487" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="132.2" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Đọc được và bền</text>
<rect x="20" y="149" width="280" height="107" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="50" cy="202.5" r="18" fill="#1d4ed8"/><g transform="translate(39.2 191.7) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v16"/><path d="M20.001 19A2 2 0 0022 17V5a2 2 0 00-1.999-2L16 3.002A5 5 0 0012 5a5 5 0 00-4-2H4a2 2 0 00-2 2v12a2 2 0 001.999 2H8a5 5 0 014 2 5 5 0 014-2z"/></g>
<text x="78" y="175.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">1 · Theo quy ước viết</text>
<text x="78" y="195.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">mã</text>
<text x="78" y="219.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Theo chuẩn ngành (PEP 8,</text>
<text x="78" y="238.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Google Java Style).</text>
<rect x="20" y="270" width="280" height="107" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="50" cy="323.5" r="18" fill="#1d4ed8"/><g transform="translate(39.2 312.7) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 22a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.704.706l3.588 3.588A2.4 2.4 0 0 1 20 8v12a2 2 0 0 1-2 2z"/><path d="M14 2v5a1 1 0 0 0 1 1h5"/><path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/></g>
<text x="78" y="296.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">2 · Tài liệu và chú</text>
<text x="78" y="316.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">thích</text>
<text x="78" y="340.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Chú thích nói vì sao; ngắn</text>
<text x="78" y="359.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">gọn, luôn cập nhật.</text>
<rect x="20" y="391" width="280" height="87" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="50" cy="434.5" r="18" fill="#1d4ed8"/><g transform="translate(39.2 423.7) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/></g>
<text x="78" y="417.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">3 · Vững vàng</text>
<text x="78" y="441.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Xử lý được tình huống bất</text>
<text x="78" y="460.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">ngờ mà không sập.</text>
<rect x="20" y="492" width="280" height="87" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="50" cy="535.5" r="18" fill="#1d4ed8"/><g transform="translate(39.2 524.7) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15.39 4.39a1 1 0 0 0 1.68-.474 2.5 2.5 0 1 1 3.014 3.015 1 1 0 0 0-.474 1.68l1.683 1.682a2.414 2.414 0 0 1 0 3.414L19.61 15.39a1 1 0 0 1-1.68-.474 2.5 2.5 0 1 0-3.014 3.015 1 1 0 0 1 .474 1.68l-1.683 1.682a2.414 2.414 0 0 1-3.414 0L8.61 19.61a1 1 0 0 0-1.68.474 2.5 2.5 0 1 1-3.014-3.015 1 1 0 0 0 .474-1.68l-1.683-1.682a2.414 2.414 0 0 1 0-3.414L4.39 8.61a1 1 0 0 1 1.68.474 2.5 2.5 0 1 0 3.014-3.015 1 1 0 0 1-.474-1.68l1.683-1.682a2.414 2.414 0 0 1 3.414 0z"/></g>
<text x="78" y="518.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">4 · Nguyên tắc SOLID</text>
<text x="78" y="542.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Năm nguyên tắc cho mã</text>
<text x="78" y="561.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">dễ mở rộng, dễ bảo trì.</text>
<rect x="8" y="603" width="304" height="527" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="631.1" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Dễ kiểm thử và dễ đổi</text>
<rect x="20" y="648" width="280" height="107" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
<circle cx="50" cy="701.5" r="18" fill="#0f766e"/><g transform="translate(39.2 690.7) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 2v2"/><path d="M5 2v2"/><path d="M5 3H4a2 2 0 0 0-2 2v4a6 6 0 0 0 12 0V5a2 2 0 0 0-2-2h-1"/><path d="M8 15a6 6 0 0 0 12 0v-3"/><circle cx="20" cy="10" r="2"/></g>
<text x="78" y="674.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">5 · Dễ kiểm thử</text>
<text x="78" y="698.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Giảm độ phức tạp từng</text>
<text x="78" y="717.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">thành phần; hỗ trợ kiểm</text>
<text x="78" y="737.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">thử tự động.</text>
<rect x="20" y="769" width="280" height="87" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
<circle cx="50" cy="812.5" r="18" fill="#0f766e"/><g transform="translate(39.2 801.7) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83z"/><path d="M2 12a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 12"/><path d="M2 17a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 17"/></g>
<text x="78" y="795.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">6 · Trừu tượng</text>
<text x="78" y="819.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Rút phần lõi, ẩn độ phức</text>
<text x="78" y="838.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">tạp; mức vừa phải.</text>
<rect x="20" y="870" width="280" height="107" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
<circle cx="50" cy="923.5" r="18" fill="#0f766e"/><g transform="translate(39.2 912.7) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.97 12.92A2 2 0 0 0 2 14.63v3.24a2 2 0 0 0 .97 1.71l3 1.8a2 2 0 0 0 2.06 0L12 19v-5.5l-5-3-4.03 2.42Z"/><path d="m7 16.5-4.74-2.85"/><path d="m7 16.5 5-3"/><path d="M7 16.5v5.17"/><path d="M12 13.5V19l3.97 2.38a2 2 0 0 0 2.06 0l3-1.8a2 2 0 0 0 .97-1.71v-3.24a2 2 0 0 0-.97-1.71L17 10.5l-5 3Z"/><path d="m17 16.5-5-3"/><path d="m17 16.5 4.74-2.85"/><path d="M17 16.5v5.17"/><path d="M7.97 4.42A2 2 0 0 0 7 6.13v4.37l5 3 5-3V6.13a2 2 0 0 0-.97-1.71l-3-1.8a2 2 0 0 0-2.06 0l-3 1.8Z"/><path d="M12 8 7.26 5.15"/><path d="m12 8 4.74-2.85"/><path d="M12 13.5V8"/></g>
<text x="78" y="896.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">7 · Mẫu thiết kế</text>
<text x="78" y="920.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Giải bài toán quen thuộc,</text>
<text x="78" y="939.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">nhưng đừng thiết kế quá</text>
<text x="78" y="959.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">tay.</text>
<rect x="20" y="991" width="280" height="127" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
<circle cx="50" cy="1054.5" r="18" fill="#0f766e"/><g transform="translate(39.2 1043.7) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect height="8" rx="2" width="8" x="3" y="3"/><path d="M7 11v4a2 2 0 0 0 2 2h4"/><rect height="8" rx="2" width="8" x="13" y="13"/></g>
<text x="78" y="1017.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">8 · Bớt phụ thuộc toàn</text>
<text x="78" y="1037.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">cục</text>
<text x="78" y="1061.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Dùng trạng thái cục bộ và</text>
<text x="78" y="1080.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">truyền tham số; hàm</text>
<text x="78" y="1100.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">không tác dụng phụ.</text>
<rect x="8" y="1142" width="304" height="265" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="1170.1" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Giữ lâu dài</text>
<rect x="20" y="1187" width="280" height="107" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
<circle cx="50" cy="1240.5" r="18" fill="#b45309"/><g transform="translate(39.2 1229.7) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></g>
<text x="78" y="1213.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">9 · Tái cấu trúc liên</text>
<text x="78" y="1233.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">tục</text>
<text x="78" y="1257.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Sửa vấn đề sớm để giảm</text>
<text x="78" y="1276.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">nợ kỹ thuật.</text>
<rect x="20" y="1308" width="280" height="87" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
<circle cx="50" cy="1351.5" r="18" fill="#b45309"/><g transform="translate(39.2 1340.7) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect height="11" rx="2" ry="2" width="18" x="3" y="11"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></g>
<text x="78" y="1334.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">10 · Bảo mật là ưu tiên</text>
<text x="78" y="1358.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Tránh các lỗ hổng bảo mật</text>
<text x="78" y="1377.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">phổ biến.</text>
<rect x="8" y="1419" width="304" height="262" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="1447.1" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Nhớ gì</text>
<rect x="20" y="1464" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="1487" r="11" fill="#16a34a"/>
<polyline points="37.9,1487.4 41.7,1491.4 48.5,1483" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="1490.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Mười nguyên tắc, mỗi</text>
<text x="64" y="1509.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">nguyên tắc một ý chính.</text>
<rect x="20" y="1535" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="1558" r="11" fill="#16a34a"/>
<polyline points="37.9,1558.4 41.7,1562.4 48.5,1554" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="1561.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Mẫu thiết kế và trừu tượng</text>
<text x="64" y="1580.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">đều có mức vừa phải.</text>
<rect x="20" y="1606" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="1629" r="11" fill="#16a34a"/>
<polyline points="37.9,1629.4 41.7,1633.4 48.5,1625" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="1632.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Cách chia nhóm là của bài,</text>
<text x="64" y="1651.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">không phải của nguồn.</text>
</g>
</svg>
