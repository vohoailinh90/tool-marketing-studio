<svg xmlns="http://www.w3.org/2000/svg" width="320" height="838" viewBox="0 0 320 838" role="img" aria-labelledby="title desc">
<title id="title">Event sourcing</title>
<desc id="desc">Hai khung. Khung một, sơ đồ trình tự giữa dịch vụ giỏ hàng, kho sự kiện và dịch vụ thanh toán: giỏ hàng ghi sự kiện thêm món và bỏ món vào kho, kho phát sự kiện mới cho dịch vụ thanh toán, dịch vụ thanh toán đọc lại từ đầu và nhận các sự kiện. Khung hai, thử nghiệm: dựng lại giỏ hàng từ 100500 sự kiện cần áp dụng 100500 sự kiện, từ ảnh chụp mỗi 1000 sự kiện chỉ cần 500; hai bên cùng ghi vào phiên bản 0 thì bên thứ hai bị từ chối.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs>
<rect width="320" height="838" fill="#f8fafc"/>
<g font-family="DejaVu Sans, Arial, sans-serif" fill="#0f172a">
<text x="16" y="34" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">Event sourcing</text>
<text x="16" y="60.2" font-size="15" fill="#475569" font-weight="normal" text-anchor="start">Lưu sự kiện, dựng lại trạng thái.</text>
<rect x="8" y="80" width="304" height="476" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="108.2" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Giỏ hàng và những ai nghe</text>
<rect x="20" y="125" width="84" height="86" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="62" cy="147" r="14" fill="#1d4ed8"/><g transform="translate(53.6 138.6) scale(0.7)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect height="8" rx="2" ry="2" width="20" x="2" y="2"/><rect height="8" rx="2" ry="2" width="20" x="2" y="14"/><line x1="6" x2="6.01" y1="6" y2="6"/><line x1="6" x2="6.01" y1="18" y2="18"/></g>
<text x="62" y="178.9" font-size="15" fill="#0f172a" font-weight="bold" text-anchor="middle">Giỏ</text>
<text x="62" y="197.6" font-size="15" fill="#0f172a" font-weight="bold" text-anchor="middle">hàng</text>
<rect x="118" y="125" width="84" height="86" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="160" cy="147" r="14" fill="#1d4ed8"/><g transform="translate(151.6 138.6) scale(0.7)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5V19A9 3 0 0 0 21 19V5"/><path d="M3 12A9 3 0 0 0 21 12"/></g>
<text x="160" y="178.9" font-size="15" fill="#0f172a" font-weight="bold" text-anchor="middle">Kho sự</text>
<text x="160" y="197.6" font-size="15" fill="#0f172a" font-weight="bold" text-anchor="middle">kiện</text>
<rect x="216" y="125" width="84" height="86" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="258" cy="147" r="14" fill="#1d4ed8"/><g transform="translate(249.6 138.6) scale(0.7)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect height="14" rx="2" width="20" x="2" y="5"/><line x1="2" x2="22" y1="10" y2="10"/><path d="M6 14h2"/></g>
<text x="258" y="178.9" font-size="15" fill="#0f172a" font-weight="bold" text-anchor="middle">Thanh</text>
<text x="258" y="197.6" font-size="15" fill="#0f172a" font-weight="bold" text-anchor="middle">toán</text>
<polyline points="62,211 62,544" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4 4"/>
<polyline points="160,211 160,544" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4 4"/>
<polyline points="258,211 258,544" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4 4"/>
<text x="111" y="239.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="middle">Ghi: thêm</text>
<text x="111" y="258.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="middle">món A</text>
<polyline points="63,272 157,272" fill="none" stroke="#334155" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="111" y="300.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="middle">Ghi: bỏ</text>
<text x="111" y="319.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="middle">món A</text>
<polyline points="63,333 157,333" fill="none" stroke="#334155" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="209" y="361.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="middle">Phát sự</text>
<text x="209" y="380.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="middle">kiện mới</text>
<polyline points="161,394 255,394" fill="none" stroke="#334155" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="209" y="422.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="middle">Đọc lại từ</text>
<text x="209" y="441.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="middle">đầu</text>
<polyline points="257,455 163,455" fill="none" stroke="#334155" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="209" y="483.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="middle">Các sự</text>
<text x="209" y="502.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="middle">kiện theo</text>
<text x="209" y="522.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="middle">thứ tự</text>
<polyline points="161,536 255,536" fill="none" stroke="#334155" stroke-width="1.8" stroke-dasharray="5 4" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="8" y="568" width="304" height="262" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="596.1" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Thử nghiệm nhỏ</text>
<rect x="20" y="613" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="636" r="11" fill="#16a34a"/>
<polyline points="37.9,636.4 41.7,640.4 48.5,632" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="639.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">100500 sự kiện: dựng lại cần</text>
<text x="64" y="658.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">áp dụng cả 100500.</text>
<rect x="20" y="684" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="707" r="11" fill="#16a34a"/>
<polyline points="37.9,707.4 41.7,711.4 48.5,703" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="710.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Ảnh chụp mỗi 1000 sự kiện:</text>
<text x="64" y="729.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">chỉ áp dụng 500.</text>
<rect x="20" y="755" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="778" r="11" fill="#16a34a"/>
<polyline points="37.9,778.4 41.7,782.4 48.5,774" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="781.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Hai bên cùng ghi vào phiên</text>
<text x="64" y="800.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">bản 0: bên sau bị từ chối.</text>
</g>
</svg>
