id: 01-pain
status: draft
format: portrait
series: "幹事の業務効率化 · #1"
link: survey
slides:
  - layout: cover
    emoji: "🍻"
    eyebrow: "幹事あるある"
    title: "飲み会の幹事、**出欠確認だけで**疲れていませんか？"
    subtitle: "会は部署みんなのもの。でも準備は、だいたい**ひとり**に集中します。"
    badge: "全部の画像を見てください 👉"

  - layout: chat
    title: "見覚えありませんか？"
    group: "営業部 連絡グループ 🍻"
    messages:
      - {from: "佐藤", text: "金曜の送別会、参加の方はご連絡お願いします🙏"}
      - {from: "田中", text: "参加します！"}
      - {from: "鈴木", text: "たぶん行けます、予定を確認しますね"}
      - {me: true, text: "まだ8名の方からお返事がありません…🙇"}
      - {from: "高橋", text: "お店ってどこでしたっけ？"}
      - {me: true, text: "二次会の会費、まだの方いらっしゃいますか…？"}

  - layout: pains
    title: "幹事がやっていること"
    items:
      - {emoji: "😵", text: "返信メールを一通ずつ開いて**出欠を手で集計**"}
      - {emoji: "🔁", text: "**未回答の人**に何度もリマインド"}
      - {emoji: "📅", text: "参加者だけに**会議出席依頼**を送り直す"}
      - {emoji: "💸", text: "**集金状況**・免除の人・二次会の精算を管理"}
      - {emoji: "🎁", text: "餞別の集金と**残額**の計算"}
      - {emoji: "📂", text: "記録が残らず、次の幹事が**ゼロから**やり直し"}

  - layout: flow
    variant: before
    title: "約30人の飲み会を手作業でやると…"
    total_label: "合計（目安）"
    steps:
      - {text: "案内メールを作成・送信", minutes: 20}
      - {text: "返信を読んで出欠を集計", minutes: 60}
      - {text: "未回答者へリマインド（2〜3回）", minutes: 30}
      - {text: "参加者へ会議出席依頼を送信", minutes: 15}
      - {text: "集金管理・二次会の精算", minutes: 45}
      - {text: "お礼メールと会計報告", minutes: 30}
    note: "私の経験からの目安です。みなさんはどれくらいかかっていますか？"

  - layout: poll
    eyebrow: "ひとつ質問です"
    question: "出欠管理、どうしていますか？"
    options:
      - "自作のExcel"
      - "受信トレイで目視カウント"
      - "Microsoft Forms / Googleフォーム"
      - "記憶力で勝負 🙃"

  - layout: cta
    title: "この作業を**自動化するツール**を作っています"
    text: "会社で使っている Outlook の上でそのまま動きます。次の投稿で、作った理由をお話しします。"
    keyword: "幹事"

platforms:
  facebook:
    caption: |
      幹事を任されたことがある方なら、きっと分かってもらえると思います😅

      会は部署みんなのもの。でも、案内、出欠の集計、未回答の方へのリマインド、集金、二次会の精算…は、だいたい一人に集中します。

      私も何度か幹事をやりましたが、いちばん大変なのは当日ではなく「誰が来るのか」「誰がまだ払っていないのか」の確認でした。そこで、Outlook の上で動く小さなツールを作り始めました。

      詳しく紹介する前に、ひとつ質問です。出欠管理、どうしていますか？コメント欄で A / B / C / D で教えてください👇

      試用版が始まったら知りたい方は「幹事」とコメントしてください。
    first_comment: |
      📋 3分で終わるアンケートです（回答いただいた方には試用版を優先的にご案内します）：{link}
    hashtags: [幹事, 業務効率化, Outlook, 出欠確認, 自動化]
