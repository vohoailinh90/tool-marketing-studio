name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  engine:
    # GitHub-hosted by default; set the repository variable CI_RUNNER (e.g. to the VPS
    # runner's label) to move every job at once — docs/agent-team.md, "CI runner".
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          # System libraries need root, which only the GitHub-hosted runner has; on the VPS
          # install them once (`python -m playwright install-deps chromium`).
          python -m playwright install ${{ runner.environment == 'github-hosted' && '--with-deps' || '' }} chromium
      - name: Repository layout
        run: python scripts/layout_check.py
      - name: UI catalogs (vi / ja / en)
        run: python scripts/i18n_check.py
      - name: Campaign checks
        run: python studio.py check
      - name: Tests
        run: python -m pytest -q
      - name: Mutation check (safety-rail tests catch their own removal)
        run: python scripts/mutation_check.py --all

  web:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Typecheck and build
        run: npm run build
      - name: Committed web/dist matches the source
        run: git diff --exit-code -- dist
