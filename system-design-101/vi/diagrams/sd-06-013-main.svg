<svg xmlns="http://www.w3.org/2000/svg" width="320" height="1088" viewBox="0 0 320 1088" role="img" aria-labelledby="title desc">
<title id="title">Truy vấn khóa không tồn tại</title>
<desc id="desc">Ba khung. Khung một, trình tự: kẻ tấn công xin một mã không tồn tại; bộ đệm không có nên hỏi cơ sở dữ liệu; cơ sở dữ liệu trả không có; bộ đệm không cất gì và trả không có; kẻ tấn công xin một mã khác và mọi thứ lặp lại. Khung hai, cất giá trị rỗng: cùng một mã lặp lại 20 nghìn lần chỉ còn 1 lần hỏi cơ sở dữ liệu; 20 nghìn mã khác nhau vẫn là 20 nghìn lần hỏi, kèm 20 nghìn khóa rác. Khung ba, bộ lọc Bloom: trả lời chắc chắn không có thì chặn ngay, có thể có thì mới hỏi tiếp; thử với tỷ lệ lọt 1 phần trăm, 0,87 phần trăm mã giả lọt qua, bộ lọc tốn khoảng 120 nghìn byte cho 100 nghìn mã.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs>
<rect width="320" height="1088" fill="#f8fafc"/>
<g font-family="DejaVu Sans, Arial, sans-serif" fill="#0f172a">
<text x="16" y="34" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">Truy vấn khóa không tồn</text>
<text x="16" y="58" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">tại</text>
<text x="16" y="84.2" font-size="15" fill="#475569" font-weight="normal" text-anchor="start">Bộ đệm không giữ được thứ không</text>
<text x="16" y="103.8" font-size="15" fill="#475569" font-weight="normal" text-anchor="start">có, nên lần nào cũng xuyên tới cơ sở</text>
<text x="16" y="123.2" font-size="15" fill="#475569" font-weight="normal" text-anchor="start">dữ liệu.</text>
<rect x="8" y="143" width="304" height="437" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="171.2" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Mã không tồn tại</text>
<rect x="20" y="188" width="84" height="86" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="62" cy="210" r="14" fill="#1d4ed8"/><g transform="translate(53.6 201.6) scale(0.7)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></g>
<text x="62" y="241.9" font-size="15" fill="#0f172a" font-weight="bold" text-anchor="middle">Kẻ tấn</text>
<text x="62" y="260.6" font-size="15" fill="#0f172a" font-weight="bold" text-anchor="middle">công</text>
<rect x="118" y="188" width="84" height="86" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="160" cy="210" r="14" fill="#1d4ed8"/><g transform="translate(151.6 201.6) scale(0.7)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15.914 4a1.5 1.5 0 00-2.474-1.561l-9 9A1.5 1.5 0 005.5 14h4.002a.5.5 0 01.471.666L8.086 20a1.5 1.5 0 002.475 1.56l9-9A1.5 1.5 0 0018.5 10h-3.997a.5.5 0 01-.472-.667z"/></g>
<text x="160" y="241.9" font-size="15" fill="#0f172a" font-weight="bold" text-anchor="middle">Bộ đệm</text>
<rect x="216" y="188" width="84" height="86" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="258" cy="210" r="14" fill="#1d4ed8"/><g transform="translate(249.6 201.6) scale(0.7)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5V19A9 3 0 0 0 21 19V5"/><path d="M3 12A9 3 0 0 0 21 12"/></g>
<text x="258" y="241.9" font-size="15" fill="#0f172a" font-weight="bold" text-anchor="middle">Cơ sở</text>
<text x="258" y="260.6" font-size="15" fill="#0f172a" font-weight="bold" text-anchor="middle">dữ liệu</text>
<polyline points="62,274 62,568" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4 4"/>
<polyline points="160,274 160,568" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4 4"/>
<polyline points="258,274 258,568" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4 4"/>
<text x="111" y="302.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="middle">Xin mã</text>
<text x="111" y="321.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="middle">không có</text>
<polyline points="63,335 157,335" fill="none" stroke="#334155" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="209" y="363.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="middle">Trượt: hỏi</text>
<text x="209" y="382.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="middle">tiếp</text>
<polyline points="161,396 255,396" fill="none" stroke="#334155" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="209" y="424.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="middle">Không có</text>
<polyline points="257,438 163,438" fill="none" stroke="#334155" stroke-width="1.8" stroke-dasharray="5 4" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="111" y="466.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="middle">Không có,</text>
<text x="111" y="485.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="middle">không cất</text>
<polyline points="159,499 65,499" fill="none" stroke="#334155" stroke-width="1.8" stroke-dasharray="5 4" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="111" y="527.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="middle">Xin mã</text>
<text x="111" y="546.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="middle">khác</text>
<polyline points="63,560 157,560" fill="none" stroke="#334155" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="8" y="592" width="304" height="211" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="620.1" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Cất giá trị rỗng</text>
<rect x="20" y="637" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="660" r="11" fill="#16a34a"/>
<polyline points="37.9,660.4 41.7,664.4 48.5,656" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="663.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Một mã lặp lại 20 nghìn lần:</text>
<text x="64" y="682.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">chỉ 1 lần hỏi.</text>
<rect x="20" y="708" width="280" height="83" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="731" r="11" fill="#16a34a"/>
<polyline points="37.9,731.4 41.7,735.4 48.5,727" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="734.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">20 nghìn mã khác nhau: vẫn</text>
<text x="64" y="753.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">20 nghìn lần hỏi, thêm 20</text>
<text x="64" y="773.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">nghìn khóa rác.</text>
<rect x="8" y="815" width="304" height="265" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="843.1" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Bộ lọc Bloom</text>
<rect x="20" y="860" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="883" r="11" fill="#16a34a"/>
<polyline points="37.9,883.4 41.7,887.4 48.5,879" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="886.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Chắc chắn không có: chặn</text>
<text x="64" y="905.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">ngay.</text>
<rect x="20" y="931" width="280" height="46" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="954" r="11" fill="#16a34a"/>
<polyline points="37.9,954.4 41.7,958.4 48.5,950" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="957.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Có thể có: mới hỏi tiếp.</text>
<rect x="20" y="985" width="280" height="83" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="1008" r="11" fill="#16a34a"/>
<polyline points="37.9,1008.4 41.7,1012.4 48.5,1004" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="1011.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Thử tỷ lệ lọt 1%: lọt 0,87%,</text>
<text x="64" y="1030.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">tốn khoảng 120 nghìn byte</text>
<text x="64" y="1050.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">cho 100 nghìn mã.</text>
</g>
</svg>
