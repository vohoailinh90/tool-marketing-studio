<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 922" width="320" height="922" role="img" aria-labelledby="title desc">
<title id="title">DeepSeek: con số nào thuộc mô hình nào</title>
<desc id="desc">DeepSeek-V3-Base là mô hình MoE 671 tỷ tham số, 37 tỷ kích hoạt mỗi token, tiền huấn luyện trên 14,8 nghìn tỷ token. Con số khoảng 5,6 triệu USD là chi phí huấn luyện chính thức của V3 theo giá thuê giả định, không phải của R1. R1-Zero dùng học tăng cường trực tiếp trên mô hình nền; R1 thêm dữ liệu khởi động và nhiều giai đoạn. Hai con số 2.000 GPU so với 25.000 GPU và rẻ hơn 85 đến 90 phần trăm chưa có căn cứ kiểm chứng trong nguồn.</desc>
<rect width="320" height="922" fill="#f8fafc"/>
<g font-family="DejaVu Sans, Arial, sans-serif" fill="#0f172a">
<text x="16" y="30" font-size="21" font-weight="bold">DEEPSEEK: SỐ NÀO</text>
<text x="16" y="54" font-size="21" font-weight="bold">THUỘC MÔ HÌNH NÀO?</text>
<rect x="16" y="80" width="288" height="38" rx="10" fill="#1e293b"/>
<text x="29" y="103" font-size="16" font-weight="bold" fill="#ffffff">Mô hình nền: V3-Base</text>
<rect x="16" y="128" width="288" height="124" rx="12" fill="#ede9fe" stroke="#94a3b8"/>
<text x="29" y="157" font-size="16" font-weight="bold">Kiến trúc MoE</text>
<text x="29" y="185" font-size="16" font-weight="normal">671 tỷ tham số tổng</text>
<text x="29" y="209" font-size="16" font-weight="normal">37 tỷ kích hoạt mỗi token</text>
<text x="29" y="233" font-size="16" font-weight="normal">14,8 nghìn tỷ token</text>
<rect x="16" y="260" width="288" height="148" rx="12" fill="#e2e8f0" stroke="#94a3b8"/>
<text x="29" y="289" font-size="16" font-weight="bold">≈ 5,6 triệu USD</text>
<text x="29" y="317" font-size="16" font-weight="normal">Của V3, không phải R1.</text>
<text x="29" y="341" font-size="16" font-weight="normal">2,788 triệu giờ GPU H800 × 2</text>
<text x="29" y="365" font-size="16" font-weight="normal">USD giả định thuê. Chỉ lần huấn</text>
<text x="29" y="389" font-size="16" font-weight="normal">luyện chính thức.</text>
<rect x="16" y="420" width="288" height="38" rx="10" fill="#1e293b"/>
<text x="29" y="443" font-size="16" font-weight="bold" fill="#ffffff">Hai cách dạy suy luận</text>
<rect x="16" y="468" width="288" height="124" rx="12" fill="#dbeafe" stroke="#94a3b8"/>
<text x="29" y="497" font-size="16" font-weight="bold">R1-Zero</text>
<text x="29" y="525" font-size="16" font-weight="normal">Học tăng cường (RL) trực tiếp</text>
<text x="29" y="549" font-size="16" font-weight="normal">trên mô hình nền, không SFT</text>
<text x="29" y="573" font-size="16" font-weight="normal">mở đầu</text>
<rect x="16" y="600" width="288" height="124" rx="12" fill="#dcfce7" stroke="#94a3b8"/>
<text x="29" y="629" font-size="16" font-weight="bold">R1</text>
<text x="29" y="657" font-size="16" font-weight="normal">Cũng từ V3-Base. Vài nghìn mẫu</text>
<text x="29" y="681" font-size="16" font-weight="normal">khởi động, rồi huấn luyện nhiều</text>
<text x="29" y="705" font-size="16" font-weight="normal">giai đoạn. RL dùng GRPO.</text>
<rect x="16" y="736" width="288" height="38" rx="10" fill="#9f1239"/>
<text x="29" y="759" font-size="16" font-weight="bold" fill="#ffffff">Chưa đủ căn cứ</text>
<rect x="16" y="784" width="288" height="124" rx="12" fill="#fee2e2" stroke="#94a3b8"/>
<text x="29" y="813" font-size="16" font-weight="bold">Hai con số trong bài nguồn</text>
<text x="29" y="841" font-size="16" font-weight="normal">“2.000 GPU so với 25.000 GPU</text>
<text x="29" y="865" font-size="16" font-weight="normal">của GPT-4”</text>
<text x="29" y="889" font-size="16" font-weight="normal">“Rẻ hơn 85–90%”</text>
</g></svg>
