# Mutation manifest — see scripts/mutation_check.py
#
# A passing test proves nothing on its own. These switch off each rule of the vocabulary store in turn and
# require the named test to fail. A mutation that SURVIVES means that test guards nothing.

target: scripts/vocab.py
note: The script is the only writer of the owner's vocabulary page. Its rules keep a word from being stored twice, a passage from being stored at all, and a half-valid batch from being written.
mutations:
- label: a register outside the five is accepted
  find: 'if isinstance(entry.get("register"), str) and entry["register"] not in REGISTERS:'
  replace: 'if False:'
  test: tests.test_vocab.EntryRuleTests.test_a_register_outside_the_five_is_an_error
- label: a required field may be empty
  find: 'if not isinstance(value, str) or not value.strip():'
  replace: 'if False:'
  test: tests.test_vocab.EntryRuleTests.test_a_required_field_that_is_empty_is_an_error
- label: the size limits that keep a passage out of the repository are off
  find: 'if isinstance(value, str) and len(value) > limit:'
  replace: 'if False:'
  test: tests.test_vocab.EntryRuleTests.test_a_field_over_its_limit_is_an_error_so_no_passage_gets_stored
- label: a pipe or a line break is accepted inside a field
  find: 'or re.search(r"[\r\n\t|]", value)):'
  replace: '):'
  test: tests.test_vocab.EntryRuleTests.test_a_pipe_or_line_break_would_break_the_table_and_is_an_error
- label: the same word is accepted twice in the store
  find: |-
    if key in seen:
                errors.append(
  replace: |-
    if False:
                errors.append(
  test: tests.test_vocab.EntryRuleTests.test_the_same_word_twice_is_an_error_even_spelled_differently
- label: a kana reading is part of a word's identity
  find: 'return KANA_READING.sub("", text).strip()'
  replace: 'return text'
  test: tests.test_vocab.KeyTests.test_a_kana_reading_in_brackets_is_not_part_of_the_identity
- label: a word is no longer the same whatever its case
  find: |-
    .strip().lower()
        return KANA_READING
  replace: |-
    .strip()
        return KANA_READING
  test: tests.test_vocab.KeyTests.test_a_word_is_the_same_whatever_its_case_spacing_or_width
- label: a register copied from the page with its emoji is refused
  find: 'bare = re.sub(r"^[^\w]+", "", nfc(value).strip())'
  replace: 'bare = nfc(value).strip()'
  test: tests.test_vocab.KeyTests.test_a_register_copied_from_the_page_with_its_emoji_is_still_a_register
- label: a row with too many cells is read anyway
  find: 'if len(cells) > 5:'
  replace: 'if False:'
  test: tests.test_vocab.ParseTests.test_a_row_with_too_many_or_too_few_cells_is_an_error_not_a_guess
- label: a JSON field nobody knows is ignored
  find: 'if unknown:'
  replace: 'if False:'
  test: tests.test_vocab.ParseTests.test_a_json_field_nobody_knows_is_an_error
- label: a key named twice in one entry is accepted
  find: ', object_pairs_hook=object_without_duplicate_keys)'
  replace: ')'
  test: tests.test_vocab.StoreFileTests.test_a_key_named_twice_in_one_entry_is_an_error
- label: text that could end the script is written raw
  find: 'text = text.replace("<", "\\u003c")'
  replace: 'text = text'
  test: tests.test_vocab.StoreFileTests.test_text_that_could_end_the_script_is_escaped
- label: one invalid row no longer stops the whole batch
  find: |-
    if errors:
            for error in errors:
                print(f"ERROR {error}")
            print(f"add: {len(errors)} problem(s)
  replace: |-
    if False:
            for error in errors:
                print(f"ERROR {error}")
            print(f"add: {len(errors)} problem(s)
  test: tests.test_vocab.AddTests.test_one_invalid_row_writes_nothing_at_all
- label: adding a stored word again is not recognised as unchanged
  find: 'elif all(old.get(name) == entry.get(name) for name in SAME_FIELDS):'
  replace: 'elif False:'
  test: tests.test_vocab.AddTests.test_adding_the_same_batch_twice_changes_nothing
- label: a stored word with other content is overwritten without --update
  find: |-
    elif update:
                report.updated.append
  replace: |-
    elif True:
                report.updated.append
  test: tests.test_vocab.AddTests.test_a_word_stored_with_other_content_is_reported_and_left_alone
- label: an update forgets when the word was first added
  find: 'report.updated.append({**entry, **({"added": old["added"]} if "added" in old else {})})'
  replace: 'report.updated.append({**entry})'
  test: tests.test_vocab.AddTests.test_update_replaces_the_differing_word_and_keeps_when_it_was_added
- label: a second sense of a stored headword is not reported
  find: 'if near is not None:'
  replace: 'if False:'
  test: tests.test_vocab.AddTests.test_a_second_sense_of_a_stored_headword_is_added_with_a_warning
- label: check accepts a block that was edited by hand
  find: 'if not errors and not store.is_canonical():'
  replace: 'if False:'
  test: tests.test_vocab.OtherCommandTests.test_check_fails_a_block_edited_by_hand_and_fmt_repairs_it
- label: check accepts a page whose register colours drifted
  find: 'if store.page_registers() != list(REGISTERS):'
  replace: 'if False:'
  test: tests.test_vocab.OtherCommandTests.test_check_fails_a_page_whose_register_colours_drifted_from_the_five
- label: remove writes even when a word is not stored
  find: |-
    if missing:
            print("remove: nothing written")
  replace: |-
    if False:
            print("remove: nothing written")
  test: tests.test_vocab.OtherCommandTests.test_remove_deletes_by_exact_word_and_refuses_an_unknown_one_without_writing
- label: add no longer shows what is worth a second look
  find: |-
    for warning in warnings:
            print(f"WARN {warning}")
        print_report
  replace: |-
    for warning in []:
            print(f"WARN {warning}")
        print_report
  test: tests.test_vocab.AddTests.test_a_word_without_a_note_is_added_but_the_report_says_so
- label: a centred alignment row (:-:) is read as a word
  find: 'SEPARATOR_CELL = re.compile(r"^:?-+:?$")'
  replace: 'SEPARATOR_CELL = re.compile(r"^:?-{2,}:?$")'
  test: tests.test_vocab.ParseTests.test_every_markdown_alignment_row_is_a_separator_not_a_word
- label: the report says written when nothing was written
  find: 'verdict = "written" if report.added or report.updated else "nothing to write"'
  replace: 'verdict = "written"'
  test: tests.test_vocab.AddTests.test_the_report_does_not_say_written_when_nothing_was_written
