<svg xmlns="http://www.w3.org/2000/svg" width="320" height="1337" viewBox="0 0 320 1337" role="img" aria-labelledby="title desc">
<title id="title">Redis 101: chạy thử rồi mới tin</title>
<desc id="desc">Ba khung. Khung một, Redis là gì: một máy chủ giữ cấu trúc dữ liệu trong bộ nhớ, các chương trình gửi lệnh qua mạng để đọc và sửa chung một dữ liệu. Khung hai, năm kiểu dữ liệu đã thử: chuỗi dùng làm bộ đếm, hash giữ các trường của một đối tượng, list làm hàng đợi, set giữ phần tử không trùng, sorted set xếp hạng theo điểm. Khung ba, bốn điều dễ nhầm: lệnh xóa là DEL, gõ DELETE thì bị báo lệnh không tồn tại; JSON không có sẵn trong bản 7.0.15 mà cần module; mặc định Redis chỉ chụp ảnh dữ liệu theo chu kỳ nên có thể mất các lần ghi sau ảnh cuối; tin pub/sub gửi lúc không ai nghe thì mất.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs>
<rect width="320" height="1337" fill="#f8fafc"/>
<g font-family="DejaVu Sans, Arial, sans-serif" fill="#0f172a">
<text x="16" y="34" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">Redis 101: chạy thử rồi</text>
<text x="16" y="58" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">mới tin</text>
<text x="16" y="84.2" font-size="15" fill="#475569" font-weight="normal" text-anchor="start">Mỗi thẻ là một điều đã thử trên Redis</text>
<text x="16" y="103.8" font-size="15" fill="#475569" font-weight="normal" text-anchor="start">7.0.15.</text>
<rect x="8" y="123" width="304" height="422" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="151.2" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Redis là gì</text>
<rect x="20" y="168" width="280" height="87" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="50" cy="211.5" r="18" fill="#1d4ed8"/><g transform="translate(39.2 200.7) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m16 18 6-6-6-6"/><path d="m8 6-6 6 6 6"/></g>
<text x="78" y="194.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Chương trình</text>
<text x="78" y="218.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Gửi lệnh qua mạng, như</text>
<text x="78" y="237.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">đặt hay đọc một giá trị.</text>
<rect x="20" y="287" width="280" height="107" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="50" cy="340.5" r="18" fill="#1d4ed8"/><g transform="translate(39.2 329.7) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect height="8" rx="2" ry="2" width="20" x="2" y="2"/><rect height="8" rx="2" ry="2" width="20" x="2" y="14"/><line x1="6" x2="6.01" y1="6" y2="6"/><line x1="6" x2="6.01" y1="18" y2="18"/></g>
<text x="78" y="313.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Máy chủ Redis</text>
<text x="78" y="337.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Giữ cấu trúc dữ liệu trong</text>
<text x="78" y="356.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">bộ nhớ, nhiều chương trình</text>
<text x="78" y="376.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">dùng chung.</text>
<rect x="20" y="426" width="280" height="107" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="50" cy="479.5" r="18" fill="#1d4ed8"/><g transform="translate(39.2 468.7) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 16h.01"/><path d="M2.212 11.577a2 2 0 0 0-.212.896V18a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-5.527a2 2 0 0 0-.212-.896L18.55 5.11A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/><path d="M21.946 12.013H2.054"/><path d="M6 16h.01"/></g>
<text x="78" y="452.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Đĩa</text>
<text x="78" y="476.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Ảnh chụp định kỳ hoặc</text>
<text x="78" y="495.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">nhật ký ghi thêm, tùy cấu</text>
<text x="78" y="515.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">hình.</text>
<polyline points="160,257 160,285" fill="none" stroke="#334155" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="160,396 160,424" fill="none" stroke="#334155" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="8" y="557" width="304" height="387" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="585.1" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Năm kiểu dữ liệu đã thử</text>
<rect x="20" y="602" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="625" r="11" fill="#16a34a"/>
<polyline points="37.9,625.4 41.7,629.4 48.5,621" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="628.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Chuỗi: tăng một bộ đếm lượt</text>
<text x="64" y="647.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">xem.</text>
<rect x="20" y="673" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="696" r="11" fill="#16a34a"/>
<polyline points="37.9,696.4 41.7,700.4 48.5,692" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="699.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Hash: các trường của một</text>
<text x="64" y="718.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">người dùng.</text>
<rect x="20" y="744" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="767" r="11" fill="#16a34a"/>
<polyline points="37.9,767.4 41.7,771.4 48.5,763" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="770.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">List: hàng đợi, đẩy vào một</text>
<text x="64" y="789.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">đầu, lấy ra đầu kia.</text>
<rect x="20" y="815" width="280" height="46" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="838" r="11" fill="#16a34a"/>
<polyline points="37.9,838.4 41.7,842.4 48.5,834" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="841.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Set: thẻ không trùng nhau.</text>
<rect x="20" y="869" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="892" r="11" fill="#16a34a"/>
<polyline points="37.9,892.4 41.7,896.4 48.5,888" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="895.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Sorted set: bảng xếp hạng</text>
<text x="64" y="914.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">theo điểm.</text>
<rect x="8" y="956" width="304" height="373" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="984.1" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Bốn điều dễ nhầm</text>
<rect x="20" y="1001" width="280" height="83" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="1024" r="11" fill="#16a34a"/>
<polyline points="37.9,1024.4 41.7,1028.4 48.5,1020" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="1027.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Lệnh xóa là DEL; gõ DELETE</text>
<text x="64" y="1046.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">thì Redis báo không có lệnh</text>
<text x="64" y="1066.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">đó.</text>
<rect x="20" y="1092" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="1115" r="11" fill="#16a34a"/>
<polyline points="37.9,1115.4 41.7,1119.4 48.5,1111" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="1118.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">JSON không có sẵn trong</text>
<text x="64" y="1137.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">bản 7.0.15: cần cài module.</text>
<rect x="20" y="1163" width="280" height="83" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="1186" r="11" fill="#16a34a"/>
<polyline points="37.9,1186.4 41.7,1190.4 48.5,1182" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="1189.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Mặc định chỉ chụp ảnh theo</text>
<text x="64" y="1208.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">chu kỳ: sập máy có thể mất</text>
<text x="64" y="1228.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">các lần ghi sau ảnh cuối.</text>
<rect x="20" y="1254" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="1277" r="11" fill="#16a34a"/>
<polyline points="37.9,1277.4 41.7,1281.4 48.5,1273" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="1280.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Tin pub/sub gửi lúc không ai</text>
<text x="64" y="1299.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">nghe là mất.</text>
</g>
</svg>
