<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 770" width="320" height="770" role="img" aria-labelledby="title desc">
<title id="title">Số cổng mạng và điều hệ điều hành làm với nó</title>
<desc id="desc">Năm khung đo trên Linux. Một: cổng cùng giao thức vận chuyển mới tạo thành một chỗ nhận, nên TCP 53 và UDP 53 cùng tồn tại được còn hai TCP cùng số thì báo địa chỉ đang dùng. Hai: cổng dưới 1024 cần quyền, người dùng thường bind 80 bị từ chối nhưng 1024 thì được. Ba: máy khách mượn cổng tạm, Linux mặc định dùng dải 32768 đến 60999. Bốn: cổng TCP đóng từ chối ngay, còn UDP đóng thì socket chưa kết nối chỉ thấy hết giờ chờ, giống cổng UDP mở mà im lặng. Năm: một máy chủ web chạy trên cổng 3306 vẫn trả lời, vì số cổng không nói ai đang nghe. Kết quả đo một lần trên một máy.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#475569" stroke-width="1.5"/></marker></defs>
<rect width="320" height="770" fill="#f8fafc"/>
<g font-family="DejaVu Sans, Arial, sans-serif" fill="#0f172a">
<text x="16" y="30" font-size="20" font-weight="bold">CỔNG MẠNG</text>
<text x="16" y="56" font-size="20" font-weight="bold">HỆ ĐIỀU HÀNH ĐỌC SỐ</text>
<text x="16" y="86" font-size="16" font-weight="normal">Đo một lần trên một máy Linux</text>
<rect x="16" y="108" width="288" height="104" rx="12" fill="#dbeafe" stroke="#94a3b8"/>
<text x="30" y="138" font-size="16" font-weight="bold">1 · Cổng + giao thức</text>
<text x="30" y="165" font-size="16" font-weight="normal">TCP 53 và UDP 53 cùng có</text>
<text x="30" y="192" font-size="16" font-weight="normal">Hai TCP cùng số: bị từ chối</text>
<rect x="16" y="226" width="288" height="104" rx="12" fill="#fef3c7" stroke="#94a3b8"/>
<text x="30" y="256" font-size="16" font-weight="bold">2 · Dưới 1024 cần quyền</text>
<text x="30" y="283" font-size="16" font-weight="normal">Người dùng thường: 80 bị</text>
<text x="30" y="310" font-size="16" font-weight="normal">từ chối, 1024 thì được</text>
<rect x="16" y="344" width="288" height="104" rx="12" fill="#dcfce7" stroke="#94a3b8"/>
<text x="30" y="374" font-size="16" font-weight="bold">3 · Cổng tạm của máy khách</text>
<text x="30" y="401" font-size="16" font-weight="normal">Linux mặc định 32768–60999</text>
<text x="30" y="428" font-size="16" font-weight="normal">(IANA: 49152–65535)</text>
<rect x="16" y="462" width="288" height="104" rx="12" fill="#ede9fe" stroke="#94a3b8"/>
<text x="30" y="492" font-size="16" font-weight="bold">4 · Đóng khác im lặng</text>
<text x="30" y="519" font-size="16" font-weight="normal">TCP đóng: từ chối ngay</text>
<text x="30" y="546" font-size="16" font-weight="normal">UDP: có thể chỉ hết giờ chờ</text>
<rect x="16" y="580" width="288" height="104" rx="12" fill="#e2e8f0" stroke="#94a3b8"/>
<text x="30" y="610" font-size="16" font-weight="bold">5 · Số không nói ai nghe</text>
<text x="30" y="637" font-size="16" font-weight="normal">Máy chủ web trên cổng 3306</text>
<text x="30" y="664" font-size="16" font-weight="normal">vẫn trả lời bình thường</text>
<text x="16" y="724" font-size="16" font-weight="normal">Cổng là quy ước;</text>
<text x="16" y="750" font-size="16" font-weight="normal">hệ điều hành chỉ biết số.</text>
</g></svg>
