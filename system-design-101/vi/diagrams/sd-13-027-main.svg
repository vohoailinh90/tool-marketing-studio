<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 783" width="320" height="783" role="img" aria-labelledby="title desc">
<title id="title">Pipeline CI/CD: cổng nhanh trước, cổng đắt sau</title>
<desc id="desc">Bốn nhóm cổng theo thời gian phản hồi tăng dần: kiểm tra tĩnh và kiểm thử đơn vị trong vài giây đến vài phút, kiểm thử tích hợp, kiểm thử toàn diện trên môi trường thử, rồi duyệt và theo dõi trên production.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#475569" stroke-width="1.5"/></marker></defs>
<rect width="320" height="783" fill="#f8fafc"/><g font-family="DejaVu Sans, Arial, sans-serif" fill="#0f172a">
<text x="16" y="30" font-size="20" font-weight="bold">CỔNG THEO CHI PHÍ</text>
<text x="16" y="58" font-size="16" font-weight="normal">Càng xuống càng chậm và đắt</text>
<rect x="16" y="89" width="288" height="128" rx="10" fill="#dcfce7" stroke="#94a3b8"/>
<text x="30" y="117" font-size="16" font-weight="bold">Cổng nhanh</text>
<text x="30" y="144" font-size="16" font-weight="normal">Kiểm tra tĩnh, kiểm thử đơn</text>
<text x="30" y="171" font-size="16" font-weight="normal">vị</text>
<text x="30" y="198" font-size="16" font-weight="normal">Vài giây đến vài phút</text>
<line x1="160" y1="229" x2="160" y2="257" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="16" y="267" width="288" height="101" rx="10" fill="#dbeafe" stroke="#94a3b8"/>
<text x="30" y="295" font-size="16" font-weight="bold">Cổng vừa</text>
<text x="30" y="322" font-size="16" font-weight="normal">Kiểm thử tích hợp với dịch</text>
<text x="30" y="349" font-size="16" font-weight="normal">vụ phụ thuộc</text>
<line x1="160" y1="380" x2="160" y2="408" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="16" y="418" width="288" height="101" rx="10" fill="#fef3c7" stroke="#94a3b8"/>
<text x="30" y="446" font-size="16" font-weight="bold">Cổng đắt</text>
<text x="30" y="473" font-size="16" font-weight="normal">Triển khai môi trường thử</text>
<text x="30" y="500" font-size="16" font-weight="normal">Kiểm thử toàn diện</text>
<line x1="160" y1="531" x2="160" y2="559" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="16" y="569" width="288" height="128" rx="10" fill="#fee2e2" stroke="#94a3b8"/>
<text x="30" y="597" font-size="16" font-weight="bold">Cổng cuối</text>
<text x="30" y="624" font-size="16" font-weight="normal">Duyệt (người hoặc quy tắc)</text>
<text x="30" y="651" font-size="16" font-weight="normal">Theo dõi sau khi lên</text>
<text x="30" y="678" font-size="16" font-weight="normal">production</text>
<text x="16" y="729" font-size="16" font-weight="normal">Trượt cổng nào thì dừng ở đó</text>
<text x="16" y="756" font-size="16" font-weight="normal">và báo ngay cho người viết mã.</text>
</g></svg>
