<svg xmlns="http://www.w3.org/2000/svg" width="320" height="810" viewBox="0 0 320 810" role="img" aria-labelledby="title desc">
<title id="title">Tính sẵn sàng cao</title>
<desc id="desc">Ba khung. Khung một, ba kiểu hai nút: primary-backup có nút dự phòng chờ và chuyển bằng tay; primary-secondary cho nút phụ nhận thêm lượt đọc nhưng đọc có thể cũ; primary-primary cho cả hai nhận ghi nhưng có thể xung đột. Khung hai, phép tính: mục tiêu 99,99 phần trăm chỉ cho phép khoảng 52,6 phút ngừng mỗi năm; hai nút độc lập mỗi nút 90 phần trăm cho 99 phần trăm. Khung ba, mô phỏng mười năm: một nút 90,0 phần trăm; hai nút cùng chạy 99,0; có một phần năm lần hỏng chung thì 98,2; chuyển bằng tay mất 5, 30, 120 phút thì 98,4, 95,2, 90,9 phần trăm.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs>
<rect width="320" height="810" fill="#f8fafc"/>
<g font-family="DejaVu Sans, Arial, sans-serif" fill="#0f172a">
