<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 1247" width="320" height="1247" role="img" aria-labelledby="title desc">
<title id="title">Service Kubernetes không nhận traffic: năm chỗ cần kiểm tra</title>
<desc id="desc">Năm chỗ cần kiểm tra khi Service không nhận traffic: selector không khớp nhãn Pod nên EndpointSlice trống, port và targetPort lệch, với Service ở cấu hình mặc định endpoint có ready là false thì không nhận traffic, và cần xem serving và terminating để biết Pod chưa qua readiness hay đang bị xóa (Service đặt publishNotReadyAddresses: true là ngoại lệ), tên DNS (Domain Name System — hệ thống phân giải tên miền) sai namespace, và đường vào từ ngoài cụm như NodePort bị chặn hoặc LoadBalancer ở trạng thái pending.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#475569" stroke-width="1.5"/></marker></defs>
<rect width="320" height="1247" fill="#f8fafc"/><g font-family="DejaVu Sans, Arial, sans-serif" fill="#0f172a">
<text x="16" y="30" font-size="20" font-weight="bold">SERVICE KHÔNG NHẬN</text>
<text x="16" y="58" font-size="20" font-weight="bold">TRAFFIC</text>
<text x="16" y="86" font-size="16" font-weight="normal">Kiểm tra từ trong ra ngoài</text>
<rect x="16" y="117" width="288" height="128" rx="10" fill="#fee2e2" stroke="#94a3b8"/>
<text x="30" y="145" font-size="16" font-weight="bold">1 · Có endpoint không?</text>
<text x="30" y="172" font-size="16" font-weight="normal">Selector khớp nhãn Pod chưa</text>
<text x="30" y="199" font-size="16" font-weight="normal">EndpointSlice trống: nghi</text>
<text x="30" y="226" font-size="16" font-weight="normal">selector trước</text>
<line x1="160" y1="257" x2="160" y2="285" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="16" y="295" width="288" height="128" rx="10" fill="#fef3c7" stroke="#94a3b8"/>
<text x="30" y="323" font-size="16" font-weight="bold">2 · Cổng có khớp</text>
<text x="30" y="350" font-size="16" font-weight="bold">không?</text>
<text x="30" y="377" font-size="16" font-weight="normal">port của Service và</text>
<text x="30" y="404" font-size="16" font-weight="normal">targetPort của Pod</text>
<line x1="160" y1="435" x2="160" y2="463" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="16" y="473" width="288" height="398" rx="10" fill="#ede9fe" stroke="#94a3b8"/>
<text x="30" y="501" font-size="16" font-weight="bold">3 · Endpoint có ready</text>
<text x="30" y="528" font-size="16" font-weight="bold">không?</text>
<text x="30" y="555" font-size="16" font-weight="normal">ready: false thì xem</text>
<text x="30" y="582" font-size="16" font-weight="normal">serving và terminating</text>
<text x="30" y="609" font-size="16" font-weight="normal">trước</text>
<text x="30" y="636" font-size="16" font-weight="normal">serving: false là Pod chưa</text>
<text x="30" y="663" font-size="16" font-weight="normal">qua readiness; terminating:</text>
<text x="30" y="690" font-size="16" font-weight="normal">true là Pod đang bị xóa,</text>
<text x="30" y="717" font-size="16" font-weight="normal">ready vẫn false dù Pod còn</text>
<text x="30" y="744" font-size="16" font-weight="normal">Ready</text>
<text x="30" y="771" font-size="16" font-weight="normal">Ngoại lệ: Service đặt</text>
<text x="30" y="798" font-size="16" font-weight="normal">publishNotReadyAddresses:</text>
<text x="30" y="825" font-size="16" font-weight="normal">true báo mọi endpoint là</text>
<text x="30" y="852" font-size="16" font-weight="normal">ready</text>
<line x1="160" y1="883" x2="160" y2="911" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="16" y="921" width="288" height="101" rx="10" fill="#dbeafe" stroke="#94a3b8"/>
<text x="30" y="949" font-size="16" font-weight="bold">4 · Gọi đúng tên chưa?</text>
<text x="30" y="976" font-size="16" font-weight="normal">Khác namespace cần tên đầy</text>
<text x="30" y="1003" font-size="16" font-weight="normal">đủ hơn</text>
<line x1="160" y1="1034" x2="160" y2="1062" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="16" y="1072" width="288" height="155" rx="10" fill="#dcfce7" stroke="#94a3b8"/>
<text x="30" y="1100" font-size="16" font-weight="bold">5 · Từ ngoài cụm vào</text>
<text x="30" y="1127" font-size="16" font-weight="bold">được chưa?</text>
<text x="30" y="1154" font-size="16" font-weight="normal">NodePort bị tường lửa chặn</text>
<text x="30" y="1181" font-size="16" font-weight="normal">LoadBalancer pending: thiếu</text>
<text x="30" y="1208" font-size="16" font-weight="normal">bộ tạo LB (bộ cân bằng tải)</text>
</g></svg>
