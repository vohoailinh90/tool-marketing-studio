<rect x="20" y="774" width="280" height="46" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="797" r="11" fill="#16a34a"/>
<polyline points="37.9,797.4 41.7,801.4 48.5,793" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="800.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Bảo mật.</text>
<rect x="20" y="828" width="280" height="46" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="851" r="11" fill="#16a34a"/>
<polyline points="37.9,851.4 41.7,855.4 48.5,847" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="854.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Khả năng bảo trì.</text>
<rect x="20" y="882" width="280" height="46" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="905" r="11" fill="#16a34a"/>
<polyline points="37.9,905.4 41.7,909.4 48.5,901" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="908.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Kiểm thử.</text>
<rect x="8" y="952" width="304" height="211" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="980.1" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Đưa vào đời</text>
<rect x="20" y="997" width="280" height="46" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="1020" r="11" fill="#16a34a"/>
<polyline points="37.9,1020.4 41.7,1024.4 48.5,1016" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="1023.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Ước tính chi phí.</text>
<rect x="20" y="1051" width="280" height="46" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="1074" r="11" fill="#16a34a"/>
