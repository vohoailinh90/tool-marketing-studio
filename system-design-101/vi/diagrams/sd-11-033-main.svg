<text x="64" y="949.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Lambda.</text>
<rect x="20" y="975" width="280" height="46" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="998" r="11" fill="#16a34a"/>
<polyline points="37.9,998.4 41.7,1002.4 48.5,994" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="1001.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Tài khoản và quyền: IAM.</text>
<rect x="20" y="1029" width="280" height="46" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="1052" r="11" fill="#16a34a"/>
