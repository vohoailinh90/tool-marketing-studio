<svg xmlns="http://www.w3.org/2000/svg" width="320" height="850" viewBox="0 0 320 850" role="img" aria-labelledby="title desc">
<title id="title">Bốn cách chờ khi thử lại</title>
<desc id="desc">Hai khung. Khung một, bốn cách chờ giữa các lần thử lại, mỗi cách một thẻ: chờ tăng đều, tăng đều cộng ngẫu nhiên, tăng gấp đôi, tăng gấp đôi cộng ngẫu nhiên. Khung hai, mô phỏng 1000 máy khách cùng thử lại vào một máy chủ nhận 100 yêu cầu mỗi bước: hai cách không ngẫu nhiên khiến 100 máy bỏ cuộc sau 5400 yêu cầu; cách cộng ngẫu nhiên đưa tất cả vào xong chỉ sau 2560 yêu cầu.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs>
<rect width="320" height="850" fill="#f8fafc"/>
<g font-family="DejaVu Sans, Arial, sans-serif" fill="#0f172a">
<text x="16" y="34" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">Bốn cách chờ khi thử lại</text>
<text x="16" y="60.2" font-size="15" fill="#475569" font-weight="normal" text-anchor="start">Tăng đều hay gấp đôi, có ngẫu nhiên</text>
<text x="16" y="79.8" font-size="15" fill="#475569" font-weight="normal" text-anchor="start">hay không.</text>
<rect x="8" y="99" width="304" height="429" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="127.2" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Bốn cách chờ</text>
<rect x="20" y="144" width="280" height="68" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="50" cy="178" r="18" fill="#1d4ed8"/><g transform="translate(39.2 167.2) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v16a2 2 0 0 0 2 2h16"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/></g>
<text x="78" y="170.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Tăng đều</text>
<text x="78" y="194.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Chờ 2, 4, 6, 8... bước.</text>
<rect x="20" y="226" width="280" height="107" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="50" cy="279.5" r="18" fill="#1d4ed8"/><g transform="translate(39.2 268.7) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m18 14 4 4-4 4"/><path d="m18 2 4 4-4 4"/><path d="M2 18h1.973a4 4 0 0 0 3.3-1.7l5.454-8.6a4 4 0 0 1 3.3-1.7H22"/><path d="M2 6h1.972a4 4 0 0 1 3.6 2.2"/><path d="M22 18h-6.041a4 4 0 0 1-3.3-1.8l-.359-.45"/></g>
<text x="78" y="252.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Tăng đều + ngẫu</text>
<text x="78" y="272.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">nhiên</text>
<text x="78" y="296.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Như trên, cộng một đoạn</text>
<text x="78" y="315.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">ngẫu nhiên.</text>
<rect x="20" y="347" width="280" height="68" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="50" cy="381" r="18" fill="#1d4ed8"/><g transform="translate(39.2 370.2) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="10" x2="14" y1="2" y2="2"/><line x1="12" x2="15" y1="14" y2="11"/><circle cx="12" cy="14" r="8"/></g>
<text x="78" y="373.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Gấp đôi</text>
<text x="78" y="397.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Chờ 2, 4, 8, 16... có trần.</text>
<rect x="20" y="429" width="280" height="87" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="50" cy="472.5" r="18" fill="#1d4ed8"/><g transform="translate(39.2 461.7) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m18 14 4 4-4 4"/><path d="m18 2 4 4-4 4"/><path d="M2 18h1.973a4 4 0 0 0 3.3-1.7l5.454-8.6a4 4 0 0 1 3.3-1.7H22"/><path d="M2 6h1.972a4 4 0 0 1 3.6 2.2"/><path d="M22 18h-6.041a4 4 0 0 1-3.3-1.8l-.359-.45"/></g>
<text x="78" y="455.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Gấp đôi + ngẫu nhiên</text>
<text x="78" y="479.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Gấp đôi rồi trộn ngẫu</text>
<text x="78" y="498.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">nhiên.</text>
<rect x="8" y="540" width="304" height="302" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="568.1" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Mô phỏng 1000 máy khách</text>
<rect x="20" y="585" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="608" r="11" fill="#16a34a"/>
<polyline points="37.9,608.4 41.7,612.4 48.5,604" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="611.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Không ngẫu nhiên: 100 máy</text>
<text x="64" y="630.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">bỏ cuộc, 5400 yêu cầu.</text>
<rect x="20" y="656" width="280" height="83" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="679" r="11" fill="#16a34a"/>
<polyline points="37.9,679.4 41.7,683.4 48.5,675" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="682.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Cộng ngẫu nhiên: không</text>
<text x="64" y="701.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">máy nào bỏ cuộc, 2560 yêu</text>
<text x="64" y="721.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">cầu.</text>
<rect x="20" y="747" width="280" height="83" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="770" r="11" fill="#16a34a"/>
<polyline points="37.9,770.4 41.7,774.4 48.5,766" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="773.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Gấp đôi thuần tuý xong</text>
<text x="64" y="792.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">chậm nhất: bước 254 so với</text>
<text x="64" y="812.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">bước 22 đến 26.</text>
</g>
</svg>
