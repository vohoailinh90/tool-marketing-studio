<svg xmlns="http://www.w3.org/2000/svg" width="320" height="876" viewBox="0 0 320 876" role="img" aria-labelledby="title desc">
<title id="title">API của Netflix qua bốn bước</title>
<desc id="desc">Bốn bước. Khối nguyên: cả ứng dụng triển khai một khối, như một tệp Java WAR. Gọi thẳng: máy khách gọi từng microservice. Lớp cổng gộp: gom phim, sản xuất, diễn viên cho một màn hình. Cổng liên hợp: một cổng GraphQL lấy dữ liệu từ mọi API. Khung cuối nêu ba điều cần nhớ.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs>
<rect width="320" height="876" fill="#f8fafc"/>
<g font-family="DejaVu Sans, Arial, sans-serif" fill="#0f172a">
<text x="16" y="34" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">API của Netflix qua bốn</text>
<text x="16" y="58" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">bước</text>
<text x="16" y="84.2" font-size="15" fill="#475569" font-weight="normal" text-anchor="start">Máy khách vẫn gọi một chỗ; ai làm</text>
<text x="16" y="103.8" font-size="15" fill="#475569" font-weight="normal" text-anchor="start">chỗ đó thì đổi.</text>
<rect x="8" y="123" width="304" height="471" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="151.2" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Bốn giai đoạn</text>
<rect x="20" y="168" width="280" height="87" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="46" cy="194" r="14" fill="#1d4ed8"/>
<text x="46" y="199.5" font-size="16" fill="#ffffff" font-weight="bold" text-anchor="middle">1</text>
<text x="70" y="194.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Khối nguyên</text>
<text x="70" y="218.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Cả ứng dụng triển khai một</text>
<text x="70" y="237.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">khối.</text>
<rect x="20" y="277" width="280" height="87" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="46" cy="303" r="14" fill="#1d4ed8"/>
<text x="46" y="308.5" font-size="16" fill="#ffffff" font-weight="bold" text-anchor="middle">2</text>
<text x="70" y="303.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Gọi thẳng</text>
<text x="70" y="327.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Máy khách gọi từng</text>
<text x="70" y="346.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">microservice.</text>
<polyline points="46,257 46,275" fill="none" stroke="#334155" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="20" y="386" width="280" height="87" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="46" cy="412" r="14" fill="#1d4ed8"/>
<text x="46" y="417.5" font-size="16" fill="#ffffff" font-weight="bold" text-anchor="middle">3</text>
<text x="70" y="412.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Lớp cổng gộp</text>
<text x="70" y="436.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Gom nhiều dịch vụ cho một</text>
<text x="70" y="455.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">màn hình.</text>
<polyline points="46,366 46,384" fill="none" stroke="#334155" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="20" y="495" width="280" height="87" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="46" cy="521" r="14" fill="#1d4ed8"/>
<text x="46" y="526.5" font-size="16" fill="#ffffff" font-weight="bold" text-anchor="middle">4</text>
<text x="70" y="521.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Cổng liên hợp</text>
<text x="70" y="545.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Một cổng GraphQL cho mọi</text>
<text x="70" y="564.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">dịch vụ.</text>
<polyline points="46,475 46,493" fill="none" stroke="#334155" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="8" y="606" width="304" height="262" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="634.1" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Nhớ gì</text>
<rect x="20" y="651" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="674" r="11" fill="#16a34a"/>
<polyline points="37.9,674.4 41.7,678.4 48.5,670" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="677.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Hàng trăm dịch vụ thì không</text>
<text x="64" y="696.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">nên lộ hết cho máy khách.</text>
<rect x="20" y="722" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="745" r="11" fill="#16a34a"/>
<polyline points="37.9,745.4 41.7,749.4 48.5,741" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="748.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Cổng gộp giảm số lần máy</text>
<text x="64" y="767.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">khách phải gọi.</text>
<rect x="20" y="793" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="816" r="11" fill="#16a34a"/>
<polyline points="37.9,816.4 41.7,820.4 48.5,812" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="819.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Cổng liên hợp chia việc làm</text>
<text x="64" y="838.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">cổng cho nhiều đội.</text>
</g>
</svg>
