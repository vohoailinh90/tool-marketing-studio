<svg xmlns="http://www.w3.org/2000/svg" width="320" height="767" viewBox="0 0 320 767" role="img" aria-labelledby="title desc">
<title id="title">Bản đồ trực tuyến, đơn giản hóa</title>
<desc id="desc">Hai khung. Khung một, ba thành phần: dịch vụ vị trí ghi lại vị trí người dùng gửi lên, hiển thị bản đồ chia thế giới thành các ô ảnh tĩnh phát từ CDN theo mức thu phóng, dẫn đường tìm vài tuyến ngắn nhất rồi xếp theo thời gian dự đoán. Khung hai, ba điều rút ra từ thử nghiệm: số ô tăng gấp bốn mỗi mức thu phóng, tuyến ngắn nhất chưa chắc nhanh nhất khi có kẹt xe, và việc xếp hạng phải làm sau khi có dự đoán thời gian.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs>
<rect width="320" height="767" fill="#f8fafc"/>
<g font-family="DejaVu Sans, Arial, sans-serif" fill="#0f172a">
<text x="16" y="34" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">Bản đồ trực tuyến, đơn</text>
<text x="16" y="58" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">giản hóa</text>
<text x="16" y="84.2" font-size="15" fill="#475569" font-weight="normal" text-anchor="start">Ba thành phần: vị trí, hiển thị bản đồ,</text>
<text x="16" y="103.8" font-size="15" fill="#475569" font-weight="normal" text-anchor="start">dẫn đường.</text>
<rect x="8" y="123" width="304" height="362" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="151.2" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Ba thành phần</text>
<rect x="20" y="168" width="280" height="87" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="46" cy="194" r="14" fill="#1d4ed8"/>
<text x="46" y="199.5" font-size="16" fill="#ffffff" font-weight="bold" text-anchor="middle">1</text>
<text x="70" y="194.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Dịch vụ vị trí</text>
<text x="70" y="218.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Nhận vị trí người dùng gửi</text>
<text x="70" y="237.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">lên mỗi vài giây.</text>
<rect x="20" y="277" width="280" height="87" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="46" cy="303" r="14" fill="#1d4ed8"/>
<text x="46" y="308.5" font-size="16" fill="#ffffff" font-weight="bold" text-anchor="middle">2</text>
<text x="70" y="303.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Hiển thị bản đồ</text>
<text x="70" y="327.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Ô ảnh tĩnh, phát từ CDN</text>
<text x="70" y="346.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">theo mức thu phóng.</text>
<polyline points="46,257 46,275" fill="none" stroke="#334155" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="20" y="386" width="280" height="87" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="46" cy="412" r="14" fill="#1d4ed8"/>
<text x="46" y="417.5" font-size="16" fill="#ffffff" font-weight="bold" text-anchor="middle">3</text>
<text x="70" y="412.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Dẫn đường</text>
<text x="70" y="436.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Đổi địa chỉ thành tọa độ,</text>
<text x="70" y="455.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">tìm tuyến, xếp hạng.</text>
<polyline points="46,366 46,384" fill="none" stroke="#334155" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="8" y="497" width="304" height="262" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="525.1" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Điều rút ra từ thử nghiệm</text>
<rect x="20" y="542" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="565" r="11" fill="#16a34a"/>
<polyline points="37.9,565.4 41.7,569.4 48.5,561" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="568.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Mỗi mức thu phóng có số ô</text>
<text x="64" y="587.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">gấp bốn mức trước.</text>
<rect x="20" y="613" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="636" r="11" fill="#16a34a"/>
<polyline points="37.9,636.4 41.7,640.4 48.5,632" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="639.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Tuyến ngắn nhất chưa chắc</text>
<text x="64" y="658.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">nhanh nhất khi có kẹt xe.</text>
<rect x="20" y="684" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="707" r="11" fill="#16a34a"/>
<polyline points="37.9,707.4 41.7,711.4 48.5,703" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="710.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Xếp hạng tuyến phải sau</text>
<text x="64" y="729.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">bước dự đoán thời gian.</text>
</g>
</svg>
