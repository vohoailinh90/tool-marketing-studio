<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 1160" width="320" height="1160" role="img" aria-labelledby="title desc">
<title id="title">HTTP headers: văn bản đi, JSON về</title>
<desc id="desc">Client gửi POST /notes HTTP/1.1, Host example.test, Accept application/json, Content-Type text/plain, Content-Length 4 và body ping. Server trả HTTP/1.1 201 Created, Content-Type application/json, Content-Length 11 và body JSON ok true. Dòng trống ngăn headers với body.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#475569" stroke-width="1.5"/></marker></defs>
<rect width="320" height="1160" fill="#f8fafc"/><g font-family="DejaVu Sans, Arial, sans-serif" fill="#0f172a">
<text x="16" y="30" font-size="20" font-weight="bold">VĂN BẢN ĐI · JSON VỀ</text>
<text x="16" y="58" font-size="16" font-weight="normal">Ví dụ HTTP/1.1</text>
<rect x="16" y="77" width="288" height="70" rx="10" fill="#dbeafe" stroke="#94a3b8"/>
<text x="30" y="105" font-size="16" font-weight="bold">1 · Client gửi request</text>
<text x="30" y="132" font-size="16" font-weight="normal">POST /notes HTTP/1.1</text>
<rect x="16" y="159" width="288" height="265" rx="10" fill="#ede9fe" stroke="#94a3b8"/>
<text x="30" y="188" font-size="16" font-weight="bold">HEADERS</text>
<text x="30" y="219" font-size="16" font-weight="normal">Host: example.test</text>
<text x="30" y="250" font-size="16" font-weight="normal">Accept: application/json</text>
<text x="30" y="281" font-size="16" font-weight="normal">→ Muốn nhận JSON</text>
<text x="30" y="312" font-size="16" font-weight="normal">Content-Type: text/plain</text>
<text x="30" y="343" font-size="16" font-weight="normal">→ Đang gửi văn bản</text>
<text x="30" y="377" font-size="16" font-weight="normal">Content-Length: 4</text>
<text x="30" y="406" font-size="16" font-weight="normal">→ 4 byte body</text>
<line x1="30" y1="445" x2="290" y2="445" stroke="#64748b" stroke-dasharray="5 4"/>
<text x="30" y="469" font-size="16" font-weight="normal">Dòng trống kết thúc headers</text>
<rect x="16" y="481" width="288" height="74" rx="10" fill="#fef3c7" stroke="#94a3b8"/>
<text x="30" y="509" font-size="16" font-weight="bold">BODY</text>
<text x="30" y="540" font-size="16" font-weight="normal">ping</text>
<line x1="160" y1="559" x2="160" y2="587" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="16" y="597" width="288" height="70" rx="10" fill="#dcfce7" stroke="#94a3b8"/>
<text x="30" y="625" font-size="16" font-weight="bold">2 · Server xử lý</text>
<text x="30" y="652" font-size="16" font-weight="normal">Tạo ghi chú → trả kết quả</text>
<line x1="160" y1="671" x2="160" y2="699" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="16" y="708" width="288" height="70" rx="10" fill="#dbeafe" stroke="#94a3b8"/>
<text x="30" y="736" font-size="16" font-weight="bold">3 · Client nhận response</text>
<text x="30" y="763" font-size="16" font-weight="normal">HTTP/1.1 201 Created</text>
<rect x="16" y="790" width="288" height="163" rx="10" fill="#ede9fe" stroke="#94a3b8"/>
<text x="30" y="819" font-size="16" font-weight="bold">HEADERS</text>
<text x="30" y="850" font-size="16" font-weight="normal">Content-Type:</text>
<text x="30" y="880" font-size="16" font-weight="normal">application/json</text>
<text x="30" y="910" font-size="16" font-weight="normal">→ Đang trả JSON</text>
<text x="30" y="939" font-size="16" font-weight="normal">Content-Length: 11</text>
<line x1="30" y1="975" x2="290" y2="975" stroke="#64748b" stroke-dasharray="5 4"/>
<text x="30" y="1002" font-size="16" font-weight="normal">Dòng trống kết thúc headers</text>
<rect x="16" y="1017" width="288" height="78" rx="10" fill="#fef3c7" stroke="#94a3b8"/>
<text x="30" y="1046" font-size="16" font-weight="bold">BODY</text>
<text x="30" y="1078" font-size="16" font-weight="normal">{&quot;ok&quot;:true}</text>
<text x="16" y="1135" font-size="16" font-weight="normal">Hai chiều, hai kiểu body.</text>
</g></svg>
