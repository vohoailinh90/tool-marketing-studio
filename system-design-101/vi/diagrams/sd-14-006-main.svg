<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 962" width="320" height="962" role="img" aria-labelledby="title desc">
<title id="title">Passkey: khóa riêng ở lại trên thiết bị</title>
<desc id="desc">Đăng ký: trang web gửi một thử thách ngẫu nhiên; bạn xác nhận trên thiết bị bằng sinh trắc học hoặc mã PIN; thiết bị tạo cặp khóa gắn với trang đó và gửi khóa công khai; trang lưu khóa công khai cạnh tài khoản. Đăng nhập: trang gửi thử thách mới; bạn xác nhận; thiết bị ký thử thách cùng tên miền của trang bằng khóa riêng; trang kiểm tra chữ ký bằng khóa công khai đã lưu. Thẻ cuối: điểm yếu chuyển sang việc mất thiết bị và khôi phục tài khoản.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#475569" stroke-width="1.5"/></marker></defs>
<rect width="320" height="962" fill="#f8fafc"/>
<g font-family="DejaVu Sans, Arial, sans-serif" fill="#0f172a">
<text x="16" y="30" font-size="21" font-weight="bold">PASSKEY:</text>
<text x="16" y="54" font-size="21" font-weight="bold">KHÓA RIÊNG Ở LẠI</text>
<rect x="16" y="80" width="288" height="38" rx="10" fill="#1e293b"/>
<text x="29" y="103" font-size="16" font-weight="bold" fill="#ffffff">Đăng ký</text>
<rect x="16" y="128" width="288" height="76" rx="12" fill="#dbeafe" stroke="#94a3b8"/>
<text x="29" y="157" font-size="16" font-weight="bold">1 · Thử thách</text>
<text x="29" y="185" font-size="16" font-weight="normal">Trang gửi một chuỗi ngẫu nhiên</text>
<line x1="160" y1="205" x2="160" y2="220" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="16" y="222" width="288" height="100" rx="12" fill="#ede9fe" stroke="#94a3b8"/>
<text x="29" y="251" font-size="16" font-weight="bold">2 · Tạo cặp khóa</text>
<text x="29" y="279" font-size="16" font-weight="normal">Bạn xác nhận; thiết bị tạo khóa</text>
<text x="29" y="303" font-size="16" font-weight="normal">gắn với trang này</text>
<line x1="160" y1="323" x2="160" y2="338" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="16" y="340" width="288" height="100" rx="12" fill="#dcfce7" stroke="#94a3b8"/>
<text x="29" y="369" font-size="16" font-weight="bold">3 · Lưu khóa công khai</text>
<text x="29" y="397" font-size="16" font-weight="normal">Trang chỉ giữ khóa công khai</text>
<text x="29" y="421" font-size="16" font-weight="normal">cạnh tài khoản</text>
<rect x="16" y="452" width="288" height="38" rx="10" fill="#1e293b"/>
<text x="29" y="475" font-size="16" font-weight="bold" fill="#ffffff">Đăng nhập</text>
<rect x="16" y="500" width="288" height="100" rx="12" fill="#dbeafe" stroke="#94a3b8"/>
<text x="29" y="529" font-size="16" font-weight="bold">4 · Thử thách mới</text>
<text x="29" y="557" font-size="16" font-weight="normal">Mỗi lần đăng nhập một chuỗi</text>
<text x="29" y="581" font-size="16" font-weight="normal">ngẫu nhiên khác</text>
<line x1="160" y1="601" x2="160" y2="616" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="16" y="618" width="288" height="100" rx="12" fill="#ede9fe" stroke="#94a3b8"/>
<text x="29" y="647" font-size="16" font-weight="bold">5 · Ký</text>
<text x="29" y="675" font-size="16" font-weight="normal">Bạn xác nhận; khóa riêng ký thử</text>
<text x="29" y="699" font-size="16" font-weight="normal">thách cùng tên miền</text>
<line x1="160" y1="719" x2="160" y2="734" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="16" y="736" width="288" height="100" rx="12" fill="#dcfce7" stroke="#94a3b8"/>
<text x="29" y="765" font-size="16" font-weight="bold">6 · Kiểm tra</text>
<text x="29" y="793" font-size="16" font-weight="normal">Trang dùng khóa công khai để</text>
<text x="29" y="817" font-size="16" font-weight="normal">kiểm tra chữ ký</text>
<rect x="16" y="848" width="288" height="100" rx="12" fill="#fee2e2" stroke="#94a3b8"/>
<text x="29" y="877" font-size="16" font-weight="bold">Điểm yếu còn lại</text>
<text x="29" y="905" font-size="16" font-weight="normal">Mất thiết bị và khôi phục tài</text>
<text x="29" y="929" font-size="16" font-weight="normal">khoản.</text>
</g></svg>
