# Mutation manifest — see scripts/mutation_check.py
#
# Each entry removes one rail of the lesson coverage check and names the test that must fail.
# Replacements change the line's length on purpose: a same-length edit can leave a stale .pyc in use.

target: scripts/lesson_coverage.py
note: A lesson post must carry every block of its lesson, visibly, on a slide or in the caption.
mutations:
- label: a quote that is not on the slide is accepted
  find: "                    problems.append(f\"{key}: quote {quote!r} is not in one text field {dest} shows\")\n                    continue"
  replace: '                    span = range(0)  # accepted anyway'
  test: tests.test_lesson_coverage.CheckTests.test_evidence_missing_from_its_slide_fails
- label: a quote may span two fields
  find: '        fields = [tokens(text) for text in texts]'
  replace: '        fields = [tokens(" ".join(texts))]'
  test: tests.test_lesson_coverage.CheckTests.test_a_quote_cannot_span_two_fields
- label: a field the layout does not draw counts as evidence
  find: '        figure = get("before", "after") if s.get("before") and s.get("after") else get("value")'
  replace: '        figure = get("before", "after", "value")'
  test: tests.test_lesson_coverage.CheckTests.test_a_field_the_layout_does_not_draw_is_not_evidence
- label: one quote proves two blocks
  find: '            others = {owners[i] for i in span if owners.get(i, key) != key}'
  replace: '            others = set()  # words may prove several blocks'
  test: tests.test_lesson_coverage.CheckTests.test_one_quote_cannot_prove_two_blocks
- label: overlapping quotes add up their words
  find: '        shown = min(len(covered), len(mine)) if label_words is not None else len(mine)'
  replace: '        shown = min(len(covered), len(mine)) if label_words is not None else sum(len(tokens(q)) for q in quotes)'
  test: tests.test_lesson_coverage.CheckTests.test_overlapping_quotes_count_each_word_once
- label: a manifest may point at another post
  find: '    post_path = (manifest_path.parent.parent / "posts" / lang / f"{lesson_id}.yaml").resolve()'
  replace: '    post_path = (manifest_path.parent / str(manifest.get("post") or "")).resolve()'
  test: tests.test_lesson_coverage.CheckTests.test_the_manifest_cannot_point_at_another_post
- label: a manifest may point at another lesson
  find: '    if source.get("path") and source["path"] != expected_path:'
  replace: '    if False and source.get("path") and source["path"] != expected_path:'
  test: tests.test_lesson_coverage.CheckTests.test_the_manifest_cannot_point_at_another_lesson
- label: the social hook and question are not blocks
  find: '    for field in SOCIAL_FIELDS:'
  replace: '    for field in ():  # front matter ignored'
  test: tests.test_lesson_coverage.TrickyMarkdownTests.test_social_hook_and_question_are_blocks
- label: the first comment may carry knowledge
  find: DEST = re.compile(r"^(?:slide:(\d+)|caption)$")
  replace: DEST = re.compile(r"^(?:slide:(\d+)|caption|first_comment)$")
  test: tests.test_lesson_coverage.CheckTests.test_the_first_comment_cannot_carry_knowledge
- label: three words stand in for a paragraph
  find: MIN_EVIDENCE_SHARE = 0.3
  replace: 'MIN_EVIDENCE_SHARE = 0.0  # any three words will do'
  test: tests.test_lesson_coverage.CheckTests.test_three_words_cannot_stand_in_for_a_long_paragraph
- label: more than ten slides is accepted
  find: '    if len(slides) > MAX_SLIDES:'
  replace: '    if False and len(slides) > MAX_SLIDES:'
  test: tests.test_lesson_coverage.CheckTests.test_more_than_ten_slides_fails
- label: a diagram may point at any slide
  find: '                if Path(str(target.get("src", ""))).stem != block["source"]:'
  replace: '                if False:  # any picture will do'
  test: tests.test_lesson_coverage.CheckTests.test_a_diagram_must_be_the_image_on_its_slide
- label: a duplicated block is accepted
  find: '        if key in seen:'
  replace: '        if False and key in seen:'
  test: tests.test_lesson_coverage.CheckTests.test_a_block_listed_twice_fails
- label: a block dropped from the manifest is not noticed
  find: '        for key in sorted(set(truth) - seen):'
  replace: '        for key in sorted(set(truth) - seen - set(truth)):'
  test: tests.test_lesson_coverage.SourceTests.test_a_dropped_block_fails
- label: reworded source text is not noticed
  find: '            if real["kind"] != block["kind"] or real["source"] != block["source"]:'
  replace: '            if False and (real["kind"] != block["kind"] or real["source"] != block["source"]):'
  test: tests.test_lesson_coverage.SourceTests.test_reworded_source_text_fails
- label: a course post without a manifest passes --all
  find: '                missing.append(f"{post.relative_to(root)}: no coverage manifest at {manifest.relative_to(root)}")'
  replace: '                pass  # a post without a manifest is fine'
  test: tests.test_lesson_coverage.AllTests.test_a_course_post_without_a_manifest_fails
- label: nested list items merge into their parent
  find: '        if item:'
  replace: '        if item and not line.startswith((" ", "\t")):'
  test: tests.test_lesson_coverage.TrickyMarkdownTests.test_nested_list_items_are_blocks_of_their_own
- label: table rows merge into a paragraph
  find: '        if TABLE_ROW.match(line):'
  replace: '        if False and TABLE_ROW.match(line):'
  test: tests.test_lesson_coverage.TrickyMarkdownTests.test_every_table_row_is_a_block_and_the_rule_row_is_not
- label: a line that starts with a tag is dropped
  find: HTML_ONLY = re.compile(rf"^\s*(?:{TAG}\s*)+$|^\s*<summary>.*</summary>\s*$")
  replace: HTML_ONLY = re.compile(r"^\s*</?[a-zA-Z][^>]*>.*$")
  test: tests.test_lesson_coverage.TrickyMarkdownTests.test_a_line_that_starts_with_a_tag_is_text
- label: an unclosed fence swallows the rest of the lesson
  find: '                raise InputError(f"a code fence opened in section {section!r} is never closed")'
  replace: '                pass  # an unclosed fence runs to the end'
  test: tests.test_lesson_coverage.TrickyMarkdownTests.test_an_unclosed_fence_is_an_error
- label: a code block may be shown in part
  find: '            if not code or not any(code in " ".join(text.split()) for text in texts):'
  replace: '            if False and not any(code in " ".join(text.split()) for text in texts):'
  test: tests.test_lesson_coverage.CheckTests.test_a_code_block_must_be_shown_whole
- label: code is compared without its punctuation
  find: '            code = " ".join(block["source"].split())'
  replace: '            code = " ".join(tokens(block["source"]))  # words only'
  test: tests.test_lesson_coverage.CheckTests.test_code_without_its_punctuation_is_not_shown
- label: zero-padded slide numbers get their own claims
  find: '            dest = f"slide:{number}"  # slide:01 and slide:1 are one slide'
  replace: '            pass  # the raw dest string keys the claims'
  test: tests.test_lesson_coverage.CheckTests.test_zero_padded_slide_numbers_share_their_words
- label: a flow total counts without minutes
  find: '        return head + _texts(steps) + (get("total_label") if total else []) + note'
  replace: '        return head + _texts(steps) + get("total_label") + note'
  test: tests.test_lesson_coverage.CheckTests.test_a_flow_total_without_minutes_is_not_evidence
- label: a cta hint counts
  find: '        return head + get("text", "button", "keyword")'
  replace: '        return head + get("text", "button", "keyword", "hint")'
  test: tests.test_lesson_coverage.CheckTests.test_a_cta_hint_is_not_evidence
- label: a rebuilt diagram needs only one word
  find: '                need = math.ceil(block_words * MIN_DIAGRAM_SHARE)'
  replace: '                need = 1  # any one word will do'
  test: tests.test_lesson_coverage.SourceTests.test_a_rebuilt_diagram_must_show_most_of_its_words
- label: a rebuilt diagram is measured by what the post quotes, not by the SVG
  find: '                block_words = sum(len(label) for label in label_words)'
  replace: '                block_words = max(len(tokens(q)) for q in quotes)  # whatever the post quotes'
  test: tests.test_lesson_coverage.SourceTests.test_a_rebuilt_diagram_must_show_most_of_its_words
- label: a rebuilt diagram and the prose blocks share one set of claimed words
  find: '            space = "diagram"'
  replace: '            space = "block"  # one claim space'
  test: tests.test_lesson_coverage.SourceTests.test_a_rebuilt_diagram_may_reuse_words_that_prove_prose_blocks
- label: a diagram label with no letter counts as wording
  find: '        if re.search(r"[^\W\d_]", label):'
  replace: '        if label:  # badges, signs and emoji count too'
  test: tests.test_lesson_coverage.DiagramLabelTests.test_a_label_is_one_string_with_its_lines_joined_and_badges_and_signs_left_out
- label: the lines of one diagram label are glued together
  find: '        label = " ".join(" ".join(element.itertext()).split())'
  replace: '        label = "".join(element.itertext()).strip()  # lines run together'
  test: tests.test_lesson_coverage.DiagramLabelTests.test_a_label_is_one_string_with_its_lines_joined_and_badges_and_signs_left_out
- label: a diagram missing from the course is skipped silently
  find: '                    problems.append(f"{key}: {exc}")'
  replace: '                    pass  # carry on without the diagram'
  test: tests.test_lesson_coverage.SourceTests.test_a_diagram_missing_from_the_course_fails
- label: a rebuilt diagram's quote need not be wording of the diagram
  find: '                label_span = find_label_span(words_in_quote, label_words, covered)'
  replace: '                label_span = find_label_span(words_in_quote, label_words, covered) or {(-1, i) for i in range(len(words_in_quote))}  # any words'
  test: tests.test_lesson_coverage.SourceTests.test_a_rebuilt_diagram_must_quote_the_diagram_not_other_words
- label: quoting one diagram phrase again counts its words again
  find: '        shown = min(len(covered), len(mine)) if label_words is not None else len(mine)'
  replace: '        shown = sum(len(tokens(q)) for q in quotes) if label_words is not None else len(mine)'
  test: tests.test_lesson_coverage.SourceTests.test_quoting_one_diagram_phrase_again_adds_nothing
- label: a label the diagram repeats is credited for every copy, though the slide draws one
  find: '        shown = min(len(covered), len(mine)) if label_words is not None else len(mine)'
  replace: '        shown = len(covered) if label_words is not None else len(mine)'
  test: tests.test_lesson_coverage.SourceTests.test_a_label_the_diagram_repeats_is_credited_once_per_drawn_copy
- label: a block with no quotes at all raises no complaint
  find: '        if shown < need:'
  replace: '        if shown < need and quotes:  # no quotes, no complaint'
  test: tests.test_lesson_coverage.CheckTests.test_a_diagram_rebuilt_without_evidence_fails
- label: equal quotes of a repeated diagram label all match the first drawn copy
  find: '            if space == "diagram":'
  replace: '            if False and space == "diagram":  # equal quotes all take the first copy'
  test: tests.test_lesson_coverage.SourceTests.test_a_label_the_diagram_repeats_may_be_drawn_once_per_copy
- label: a two-word fragment of a longer diagram label counts as wording
  find: '        if n < min(MIN_EVIDENCE_WORDS, len(label)):'
  replace: '        if False:  # any fragment will do'
  test: tests.test_lesson_coverage.SourceTests.test_a_short_fragment_of_a_longer_label_proves_nothing
- label: a whole short diagram label is rejected as too short
  find: '            if label_words is None and len(words_in_quote) < min(MIN_EVIDENCE_WORDS, max(block_words, 1)):'
  replace: '            if len(words_in_quote) < min(MIN_EVIDENCE_WORDS, max(block_words, 1)):  # also for whole labels'
  test: tests.test_lesson_coverage.SourceTests.test_a_whole_short_label_is_evidence_for_a_rebuilt_diagram
