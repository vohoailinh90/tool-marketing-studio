<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 1100" width="320" height="1100" role="img" aria-labelledby="title desc">
<title id="title">Tắt êm một API trên Kubernetes: năm chỗ làm rớt request</title>
<desc id="desc">Năm chặng khi một Pod của API bị xóa: Pod chuyển sang Terminating và endpoint của nó được đánh dấu terminating, thường không sẵn sàng và chưa bị xóa ngay, song song với việc tắt, traffic vẫn có thể đến thêm một lúc nên cần chờ ngắn trong preStop, tiến trình chính nhận SIGTERM phải ngừng nhận kết nối mới và làm xong việc đang chạy, hết thời gian ân hạn thì bị dừng cưỡng bức, và khi dồn node thì PodDisruptionBudget giữ số Pod tối thiểu.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#475569" stroke-width="1.5"/></marker></defs>
<rect width="320" height="1100" fill="#f8fafc"/><g font-family="DejaVu Sans, Arial, sans-serif" fill="#0f172a">
<text x="16" y="30" font-size="20" font-weight="bold">TẮT ÊM MỘT POD</text>
<text x="16" y="58" font-size="16" font-weight="normal">Từ lúc bị xóa đến lúc dừng</text>
<rect x="16" y="89" width="288" height="155" rx="10" fill="#dbeafe" stroke="#94a3b8"/>
<text x="30" y="117" font-size="16" font-weight="bold">1 · Pod bị xóa</text>
<text x="30" y="144" font-size="16" font-weight="normal">Pod chuyển sang Terminating</text>
<text x="30" y="171" font-size="16" font-weight="normal">Endpoint thành terminating,</text>
<text x="30" y="198" font-size="16" font-weight="normal">thường ready=false, chưa bị</text>
<text x="30" y="225" font-size="16" font-weight="normal">xóa ngay</text>
<line x1="160" y1="256" x2="160" y2="284" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="16" y="294" width="288" height="155" rx="10" fill="#fef3c7" stroke="#94a3b8"/>
<text x="30" y="322" font-size="16" font-weight="bold">2 · Traffic còn đến</text>
<text x="30" y="349" font-size="16" font-weight="bold">một lúc</text>
<text x="30" y="376" font-size="16" font-weight="normal">Proxy, ingress, bộ cân bằng</text>
<text x="30" y="403" font-size="16" font-weight="normal">tải ngoài cập nhật chậm hơn</text>
<text x="30" y="430" font-size="16" font-weight="normal">Chờ vài giây trong preStop</text>
<line x1="160" y1="461" x2="160" y2="489" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="16" y="499" width="288" height="182" rx="10" fill="#dcfce7" stroke="#94a3b8"/>
<text x="30" y="527" font-size="16" font-weight="bold">3 · SIGTERM tới tiến</text>
<text x="30" y="554" font-size="16" font-weight="bold">trình chính</text>
<text x="30" y="581" font-size="16" font-weight="normal">Ngừng nhận kết nối mới, làm</text>
<text x="30" y="608" font-size="16" font-weight="normal">xong request đang chạy</text>
<text x="30" y="635" font-size="16" font-weight="normal">Dạng exec để tín hiệu tới</text>
<text x="30" y="662" font-size="16" font-weight="normal">đúng tiến trình</text>
<line x1="160" y1="693" x2="160" y2="721" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="16" y="731" width="288" height="155" rx="10" fill="#fee2e2" stroke="#94a3b8"/>
<text x="30" y="759" font-size="16" font-weight="bold">4 · Hết ân hạn thì bị</text>
<text x="30" y="786" font-size="16" font-weight="bold">dừng</text>
<text x="30" y="813" font-size="16" font-weight="normal">Thời gian ân hạn tính từ</text>
<text x="30" y="840" font-size="16" font-weight="normal">lúc xóa, gồm cả preStop</text>
<text x="30" y="867" font-size="16" font-weight="normal">Hết hạn: bị dừng cưỡng bức</text>
<rect x="16" y="898" width="288" height="182" rx="10" fill="#ede9fe" stroke="#94a3b8"/>
<text x="30" y="926" font-size="16" font-weight="bold">5 · Dồn node có chủ</text>
<text x="30" y="953" font-size="16" font-weight="bold">đích</text>
<text x="30" y="980" font-size="16" font-weight="normal">PodDisruptionBudget giữ số</text>
<text x="30" y="1007" font-size="16" font-weight="normal">Pod tối thiểu</text>
<text x="30" y="1034" font-size="16" font-weight="normal">Chỉ áp dụng cho eviction tự</text>
<text x="30" y="1061" font-size="16" font-weight="normal">nguyện</text>
</g></svg>
