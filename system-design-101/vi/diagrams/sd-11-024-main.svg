<desc id="desc">Provisioning: Terraform • CloudFormation: Pulumi: khai báo tài nguyên; Cấu hình và runtime: Ansible/Chef/Puppet: Docker + Kubernetes; Luồng thay đổi: Git → plan → review → apply: Kiểm drift và bảo vệ state. Các khung là ý chính để đối chiếu, không nhất thiết là các bước tuần tự.</desc>
