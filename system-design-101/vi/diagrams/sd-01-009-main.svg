<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 709" width="320" height="709" role="img" aria-labelledby="title desc">
<title id="title">HTTP/1.1 và HTTP/2 gửi nhiều tài nguyên thế nào</title>
<desc id="desc">Ba khung dọc: HTTP/1.1 mỗi kết nối chỉ xử lý một yêu cầu một lúc nên muốn song song phải mở thêm kết nối, trình duyệt thường giới hạn khoảng sáu; HTTP/2 dùng một kết nối với nhiều luồng được chia thành khung xen kẽ và nén header bằng HPACK; vẫn còn giới hạn vì cùng chạy trên một kết nối TCP, mất gói thì mọi luồng chờ, và HTTP/3 chạy trên QUIC để giảm điều đó.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#475569" stroke-width="1.5"/></marker></defs>
<rect width="320" height="709" fill="#f8fafc"/>
<g font-family="DejaVu Sans, Arial, sans-serif" fill="#0f172a">
<text x="16" y="30" font-size="20" font-weight="bold">HTTP/2 VS HTTP/1.1</text>
<text x="16" y="60" font-size="16" font-weight="normal">Cùng tải một trang,</text>
<text x="16" y="90" font-size="16" font-weight="normal">khác cách dùng kết nối</text>
<rect x="16" y="112" width="288" height="185" rx="12" fill="#fef3c7" stroke="#94a3b8"/>
<text x="30" y="142" font-size="16" font-weight="bold">HTTP/1.1</text>
<text x="30" y="169" font-size="16" font-weight="normal">Mỗi kết nối: một yêu cầu một lúc</text>
<rect x="30" y="179" width="73.25" height="34" rx="7" fill="#ffffff" stroke="#64748b"/>
<text x="66.625" y="202" text-anchor="middle" font-size="16" font-weight="normal">A</text>
<line x1="105.25" y1="196" x2="118.25" y2="196" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="123.25" y="179" width="73.2812" height="34" rx="7" fill="#ffffff" stroke="#64748b"/>
<text x="159.891" y="202" text-anchor="middle" font-size="16" font-weight="normal">B</text>
<line x1="198.531" y1="196" x2="211.531" y2="196" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="216.531" y="179" width="73.4688" height="34" rx="7" fill="#ffffff" stroke="#64748b"/>
<text x="253.266" y="202" text-anchor="middle" font-size="16" font-weight="normal">C</text>
<text x="30" y="250" font-size="16" font-weight="normal">Song song: mở thêm kết nối</text>
<text x="30" y="277" font-size="16" font-weight="normal">Trình duyệt thường giới hạn ~6</text>
<line x1="160" y1="298" x2="160" y2="318" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="16" y="321" width="288" height="185" rx="12" fill="#dcfce7" stroke="#94a3b8"/>
<text x="30" y="351" font-size="16" font-weight="bold">HTTP/2</text>
<text x="30" y="378" font-size="16" font-weight="normal">Một kết nối, nhiều luồng</text>
<rect x="30" y="388" width="37.1406" height="34" rx="4" fill="#fef3c7" stroke="#64748b"/>
<text x="48.5703" y="411" text-anchor="middle" font-size="16" font-weight="normal">A1</text>
<rect x="67.1406" y="388" width="37.1719" height="34" rx="4" fill="#dbeafe" stroke="#64748b"/>
<text x="85.7266" y="411" text-anchor="middle" font-size="16" font-weight="normal">B1</text>
<rect x="104.312" y="388" width="37.1406" height="34" rx="4" fill="#fef3c7" stroke="#64748b"/>
<text x="122.883" y="411" text-anchor="middle" font-size="16" font-weight="normal">A2</text>
<rect x="141.453" y="388" width="37.3594" height="34" rx="4" fill="#ede9fe" stroke="#64748b"/>
<text x="160.133" y="411" text-anchor="middle" font-size="16" font-weight="normal">C1</text>
<rect x="178.812" y="388" width="37.1719" height="34" rx="4" fill="#dbeafe" stroke="#64748b"/>
<text x="197.398" y="411" text-anchor="middle" font-size="16" font-weight="normal">B2</text>
<text x="30" y="459" font-size="16" font-weight="normal">Chia thành khung, xen kẽ</text>
<text x="30" y="486" font-size="16" font-weight="normal">Header nén bằng HPACK</text>
<line x1="160" y1="507" x2="160" y2="527" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="16" y="530" width="288" height="131" rx="12" fill="#fee2e2" stroke="#94a3b8"/>
<text x="30" y="560" font-size="16" font-weight="bold">Vẫn còn giới hạn</text>
<text x="30" y="587" font-size="16" font-weight="normal">Cùng chạy trên một kết nối TCP</text>
<text x="30" y="614" font-size="16" font-weight="normal">Mất gói TCP: mọi luồng cùng chờ</text>
<text x="30" y="641" font-size="16" font-weight="normal">HTTP/3 chạy trên QUIC để giảm</text>
<text x="16" y="689" font-size="16" font-weight="normal">Nhanh hơn bao nhiêu: tùy trang.</text>
</g></svg>
