<svg xmlns="http://www.w3.org/2000/svg" width="320" height="1458" viewBox="0 0 320 1458" role="img" aria-labelledby="title desc">
<title id="title">Sáu loại cơ sở dữ liệu, sáu câu tóm tắt</title>
<desc id="desc">Ba khung. Khung một, ba câu giữ được: cơ sở dữ liệu quan hệ làm được gần như mọi việc nhưng mở rộng ngang phải chia shard; kho trong bộ nhớ nhanh và có trần bộ nhớ; kho chuỗi thời gian ghi nối tiếp theo thời gian, coi chừng số series. Khung hai, ba câu cần sửa: đồ thị mạnh ở quan hệ nhiều tầng, nút và cạnh vẫn có thuộc tính; kho tài liệu chứa tài liệu JSON vẫn được sửa, dữ liệu lớn không đổi là việc của kho đối tượng; kho cột rộng mạnh ở ghi nhiều và dữ liệu thưa, phân tích lớn là loại khác. Khung ba, Redis với trần 8 MiB, 20.000 giá trị 1.000 byte: noeviction ghi được 6.732 khóa rồi báo lỗi; allkeys-lru ghi đủ nhưng xóa 13.291 khóa cũ; mặc định không đặt trần; RDB và AOF lưu xuống đĩa.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs>
<rect width="320" height="1458" fill="#f8fafc"/>
<g font-family="DejaVu Sans, Arial, sans-serif" fill="#0f172a">
<text x="16" y="34" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">Sáu loại cơ sở dữ liệu,</text>
<text x="16" y="58" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">sáu câu tóm tắt</text>
<text x="16" y="84.2" font-size="15" fill="#475569" font-weight="normal" text-anchor="start">Câu nào giữ được, câu nào cần sửa,</text>
<text x="16" y="103.8" font-size="15" fill="#475569" font-weight="normal" text-anchor="start">đối chiếu với hướng dẫn mô hình dữ</text>
<text x="16" y="123.2" font-size="15" fill="#475569" font-weight="normal" text-anchor="start">liệu của Azure.</text>
<rect x="8" y="143" width="304" height="386" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="171.2" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Ba câu giữ được</text>
<rect x="20" y="188" width="280" height="107" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="50" cy="241.5" r="18" fill="#1d4ed8"/><g transform="translate(39.2 230.7) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5V19A9 3 0 0 0 21 19V5"/><path d="M3 12A9 3 0 0 0 21 12"/></g>
<text x="78" y="214.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Quan hệ</text>
<text x="78" y="238.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Gần như việc gì cũng làm</text>
<text x="78" y="257.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">được; mở rộng ngang thì</text>
<text x="78" y="277.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">phải chia shard.</text>
<rect x="20" y="309" width="280" height="107" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="50" cy="362.5" r="18" fill="#1d4ed8"/><g transform="translate(39.2 351.7) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15.914 4a1.5 1.5 0 00-2.474-1.561l-9 9A1.5 1.5 0 005.5 14h4.002a.5.5 0 01.471.666L8.086 20a1.5 1.5 0 002.475 1.56l9-9A1.5 1.5 0 0018.5 10h-3.997a.5.5 0 01-.472-.667z"/></g>
<text x="78" y="335.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Trong bộ nhớ</text>
<text x="78" y="359.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Nhanh, và có trần: chạm</text>
<text x="78" y="378.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">trần thì báo lỗi hoặc xóa</text>
<text x="78" y="398.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">bớt.</text>
<rect x="20" y="430" width="280" height="87" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="50" cy="473.5" r="18" fill="#1d4ed8"/><g transform="translate(39.2 462.7) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></g>
<text x="78" y="456.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Chuỗi thời gian</text>
<text x="78" y="480.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Ghi nối tiếp theo thời gian;</text>
<text x="78" y="499.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">coi chừng số series.</text>
<rect x="8" y="541" width="304" height="406" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="569.1" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Ba câu cần sửa</text>
<rect x="20" y="586" width="280" height="107" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
<circle cx="50" cy="639.5" r="18" fill="#0f766e"/><g transform="translate(39.2 628.7) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" x2="15.42" y1="13.51" y2="17.49"/><line x1="15.41" x2="8.59" y1="6.51" y2="10.49"/></g>
<text x="78" y="612.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Đồ thị</text>
<text x="78" y="636.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Mạnh ở quan hệ nhiều</text>
<text x="78" y="655.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">tầng; nút và cạnh vẫn có</text>
<text x="78" y="675.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">thuộc tính.</text>
<rect x="20" y="707" width="280" height="107" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
<circle cx="50" cy="760.5" r="18" fill="#0f766e"/><g transform="translate(39.2 749.7) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 22a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.704.706l3.588 3.588A2.4 2.4 0 0 1 20 8v12a2 2 0 0 1-2 2z"/><path d="M14 2v5a1 1 0 0 0 1 1h5"/><path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/></g>
<text x="78" y="733.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Tài liệu</text>
<text x="78" y="757.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Tài liệu JSON vẫn được</text>
<text x="78" y="776.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">sửa; dữ liệu lớn, không đổi</text>
<text x="78" y="796.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">là kho đối tượng.</text>
<rect x="20" y="828" width="280" height="107" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
<circle cx="50" cy="881.5" r="18" fill="#0f766e"/><g transform="translate(39.2 870.7) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83z"/><path d="M2 12a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 12"/><path d="M2 17a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 17"/></g>
<text x="78" y="854.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Cột rộng</text>
<text x="78" y="878.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Mạnh ở ghi nhiều, dữ liệu</text>
<text x="78" y="897.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">thưa; phân tích lớn là loại</text>
<text x="78" y="917.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">khác.</text>
<rect x="8" y="959" width="304" height="491" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="987.1" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Thử: Redis chạm trần 8 MiB</text>
<rect x="20" y="1004" width="280" height="107" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
<circle cx="46" cy="1030" r="14" fill="#b45309"/>
<text x="46" y="1035.5" font-size="16" fill="#ffffff" font-weight="bold" text-anchor="middle">1</text>
<text x="70" y="1030.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">noeviction</text>
<text x="70" y="1054.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Ghi được 6.732 khóa rồi báo</text>
<text x="70" y="1073.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">lỗi hết bộ nhớ; khóa cũ còn</text>
<text x="70" y="1093.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">nguyên.</text>
<rect x="20" y="1133" width="280" height="87" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
<circle cx="46" cy="1159" r="14" fill="#b45309"/>
<text x="46" y="1164.5" font-size="16" fill="#ffffff" font-weight="bold" text-anchor="middle">2</text>
<text x="70" y="1159.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">allkeys-lru</text>
<text x="70" y="1183.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Ghi đủ 20.000 lần; 13.291</text>
<text x="70" y="1202.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">khóa cũ bị xóa, còn 6.709.</text>
<polyline points="46,1113 46,1131" fill="none" stroke="#334155" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="20" y="1242" width="280" height="87" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
<circle cx="46" cy="1268" r="14" fill="#b45309"/>
<text x="46" y="1273.5" font-size="16" fill="#ffffff" font-weight="bold" text-anchor="middle">3</text>
<text x="70" y="1268.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Mặc định</text>
<text x="70" y="1292.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Trên máy 64 bit, Redis</text>
<text x="70" y="1311.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">không đặt trần cho dữ liệu.</text>
<polyline points="46,1222 46,1240" fill="none" stroke="#334155" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="20" y="1351" width="280" height="87" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
<circle cx="46" cy="1377" r="14" fill="#b45309"/>
<text x="46" y="1382.5" font-size="16" fill="#ffffff" font-weight="bold" text-anchor="middle">4</text>
<text x="70" y="1377.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Tắt máy không mất hết</text>
<text x="70" y="1401.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">RDB chụp dữ liệu định kỳ,</text>
<text x="70" y="1420.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">AOF ghi lại từng lệnh ghi.</text>
<polyline points="46,1331 46,1349" fill="none" stroke="#334155" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
</g>
</svg>
