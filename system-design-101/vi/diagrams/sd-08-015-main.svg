<svg xmlns="http://www.w3.org/2000/svg" width="320" height="1086" viewBox="0 0 320 1086" role="img" aria-labelledby="title desc">
<title id="title">Tám khái niệm DDD, đối chiếu và một bộ kiểm tra tầng</title>
<desc id="desc">Ba khung. Khung một, tám khái niệm của nguồn: thiết kế hướng miền, thực thể nghiệp vụ, ranh giới mô hình, khối nhất quán, thực thể và đối tượng giá trị, mô hình thao tác, chia tầng và dựng mô hình miền; tài liệu Microsoft khớp với bảy khái niệm, và nhắc thêm ngôn ngữ chung riêng cho từng ngữ cảnh. Khung hai, một điểm cần phân biệt: nguồn khuyên chia tầng bên trong một khối, còn Microsoft khuyên đừng cắt dịch vụ theo tầng ngang như truy cập dữ liệu hay nhắn tin mà cắt theo năng lực nghiệp vụ. Khung ba, bộ kiểm tra tầng bằng cây cú pháp: dự án thử 12 tệp tìm ra 1 vi phạm trong 0,002 giây, dự án thử 10.000 tệp tìm ra 5 vi phạm trong 0,69 đến 0,78 giây.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs>
<rect width="320" height="1086" fill="#f8fafc"/>
<g font-family="DejaVu Sans, Arial, sans-serif" fill="#0f172a">
<text x="16" y="34" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">Tám khái niệm DDD, đối</text>
<text x="16" y="58" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">chiếu và một bộ kiểm tra</text>
<text x="16" y="82" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">tầng</text>
<text x="16" y="108.2" font-size="15" fill="#475569" font-weight="normal" text-anchor="start">Bảy khái niệm có chỗ đối chiếu; khái</text>
<text x="16" y="127.8" font-size="15" fill="#475569" font-weight="normal" text-anchor="start">niệm tầng thì kiểm bằng mã.</text>
<rect x="8" y="147" width="304" height="343" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="175.2" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Tám khái niệm, bảy chỗ đối</text>
<text x="20" y="197.2" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">chiếu</text>
<rect x="20" y="214" width="280" height="102" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="237" r="11" fill="#16a34a"/>
<polyline points="37.9,237.4 41.7,241.4 48.5,233" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="240.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Có chỗ đối chiếu: miền, ranh</text>
<text x="64" y="259.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">giới, khối nhất quán, thực</text>
<text x="64" y="279.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">thể, đối tượng giá trị, dịch</text>
<text x="64" y="298.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">vụ, dựng mô hình.</text>
<rect x="20" y="324" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="347" r="11" fill="#16a34a"/>
<polyline points="37.9,347.4 41.7,351.4 48.5,343" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="350.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Chia tầng: kiểm được bằng</text>
<text x="64" y="369.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">mã, bài này viết bộ kiểm.</text>
<rect x="20" y="395" width="280" height="83" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="418" r="11" fill="#16a34a"/>
<polyline points="37.9,418.4 41.7,422.4 48.5,414" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="421.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Thêm từ Microsoft: ngôn ngữ</text>
<text x="64" y="440.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">chung riêng cho từng ngữ</text>
<text x="64" y="460.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">cảnh.</text>
<rect x="8" y="502" width="304" height="282" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="530.1" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Hai nghĩa của chia tầng</text>
<rect x="20" y="547" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="570" r="11" fill="#16a34a"/>
<polyline points="37.9,570.4 41.7,574.4 48.5,566" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="573.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Nguồn: chia tầng để gọn mã</text>
<text x="64" y="592.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">bên trong một khối.</text>
<rect x="20" y="618" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="641" r="11" fill="#16a34a"/>
<polyline points="37.9,641.4 41.7,645.4 48.5,637" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="644.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Microsoft: đừng cắt dịch vụ</text>
<text x="64" y="663.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">theo tầng ngang.</text>
<rect x="20" y="689" width="280" height="83" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="712" r="11" fill="#16a34a"/>
<polyline points="37.9,712.4 41.7,716.4 48.5,708" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="715.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Cắt dịch vụ theo năng lực</text>
<text x="64" y="734.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">nghiệp vụ, tầng nằm bên</text>
<text x="64" y="754.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">trong.</text>
<rect x="8" y="796" width="304" height="282" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="824.1" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Bộ kiểm tầng bằng mã</text>
<rect x="20" y="841" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="864" r="11" fill="#16a34a"/>
<polyline points="37.9,864.4 41.7,868.4 48.5,860" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="867.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">12 tệp: 1 vi phạm trong</text>
<text x="64" y="886.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">0,002 giây.</text>
<rect x="20" y="912" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="935" r="11" fill="#16a34a"/>
<polyline points="37.9,935.4 41.7,939.4 48.5,931" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="938.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">10.000 tệp: 5 vi phạm trong</text>
<text x="64" y="957.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">0,69 đến 0,78 giây.</text>
<rect x="20" y="983" width="280" height="83" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="1006" r="11" fill="#16a34a"/>
<polyline points="37.9,1006.4 41.7,1010.4 48.5,1002" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="1009.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Việc đếm được thì giao cho</text>
<text x="64" y="1028.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">máy, không giao cho người</text>
<text x="64" y="1048.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">đọc.</text>
</g>
</svg>
