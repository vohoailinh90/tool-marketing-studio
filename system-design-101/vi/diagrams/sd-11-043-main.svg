<svg xmlns="http://www.w3.org/2000/svg" width="360" height="420" viewBox="0 0 360 420" role="img" aria-labelledby="title desc">
<title id="title">CAP, BASE, SOLID và KISS nói về điều gì?</title>
<desc id="desc">CAP: Partition: C/A không cùng đủ: C ở đây là linearizability; BASE: Available • soft • eventual: Điều kiện hội tụ phải rõ; SOLID + KISS: Nguyên tắc cấu trúc mã: Giữ giải pháp đơn giản. Các khung là ý chính để đối chiếu, không nhất thiết là các bước tuần tự.</desc>
<rect width="360" height="420" fill="#f8fafc"/>
<g font-family="DejaVu Sans, sans-serif" fill="#0f172a">
<text x="20" y="28" font-size="18" font-weight="bold">sd-11-043 · Nhìn hình trước</text>
<rect x="12" y="48" width="336" height="102" rx="12" fill="#e0f2fe" stroke="#64748b"/>
<text x="24" y="75" font-size="18" font-weight="bold">CAP</text>
<text x="24" y="104" font-size="18">Partition: C/A không cùng đủ</text>
<text x="24" y="130" font-size="18">C ở đây là linearizability</text>
<rect x="12" y="162" width="336" height="102" rx="12" fill="#dcfce7" stroke="#64748b"/>
<text x="24" y="189" font-size="18" font-weight="bold">BASE</text>
<text x="24" y="218" font-size="18">Available • soft • eventual</text>
<text x="24" y="244" font-size="18">Điều kiện hội tụ phải rõ</text>
<rect x="12" y="276" width="336" height="102" rx="12" fill="#fef3c7" stroke="#64748b"/>
<text x="24" y="303" font-size="18" font-weight="bold">SOLID + KISS</text>
<text x="24" y="332" font-size="18">Nguyên tắc cấu trúc mã</text>
<text x="24" y="358" font-size="18">Giữ giải pháp đơn giản</text>
</g>
</svg>
