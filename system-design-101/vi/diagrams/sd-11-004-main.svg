<svg xmlns="http://www.w3.org/2000/svg" width="360" height="420" viewBox="0 0 360 420" role="img" aria-labelledby="title desc">
<title id="title">Bốn chiến lược khôi phục sau thảm họa</title>
<desc id="desc">Mục tiêu: RTO: ngừng bao lâu?: RPO: mất dữ liệu bao lâu?; Ít năng lực chờ: Backup/restore • pilot light: Dựng thêm khi có sự cố; Nhiều năng lực chờ: Warm standby • active/active: Đo bằng diễn tập. Các khung là ý chính để đối chiếu, không nhất thiết là các bước tuần tự.</desc>
<rect width="360" height="420" fill="#f8fafc"/>
<g font-family="DejaVu Sans, sans-serif" fill="#0f172a">
<text x="20" y="28" font-size="18" font-weight="bold">sd-11-004 · Nhìn hình trước</text>
<rect x="12" y="48" width="336" height="102" rx="12" fill="#e0f2fe" stroke="#64748b"/>
<text x="24" y="75" font-size="18" font-weight="bold">Mục tiêu</text>
<text x="24" y="104" font-size="18">RTO: ngừng bao lâu?</text>
<text x="24" y="130" font-size="18">RPO: mất dữ liệu bao lâu?</text>
<rect x="12" y="162" width="336" height="102" rx="12" fill="#dcfce7" stroke="#64748b"/>
<text x="24" y="189" font-size="18" font-weight="bold">Ít năng lực chờ</text>
<text x="24" y="218" font-size="18">Backup/restore • pilot light</text>
<text x="24" y="244" font-size="18">Dựng thêm khi có sự cố</text>
<rect x="12" y="276" width="336" height="102" rx="12" fill="#fef3c7" stroke="#64748b"/>
<text x="24" y="303" font-size="18" font-weight="bold">Nhiều năng lực chờ</text>
<text x="24" y="332" font-size="18">Warm standby • active/active</text>
<text x="24" y="358" font-size="18">Đo bằng diễn tập</text>
</g>
</svg>
