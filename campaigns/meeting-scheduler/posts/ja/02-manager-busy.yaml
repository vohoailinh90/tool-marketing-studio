link: ~
slides:
  - layout: cover
    emoji: "🗓️"
    eyebrow: "部署をまたぐ会議、国をまたぐ会議"
    title: "管理職の予定が\n**埋まっている**とき、\n会議時間を決める4つの方法"
    subtitle: "メンバーが複数の国にいると、さらに難しくなります。それぞれの効果をシミュレーションで確かめました。"
    badge: "最後までご覧ください 👉"

  - layout: stat
    eyebrow: "出発点"
