<svg xmlns="http://www.w3.org/2000/svg" width="360" height="420" viewBox="0 0 360 420" role="img" aria-labelledby="title desc">
<title id="title">Hai mươi lăm bài nghiên cứu để đọc có mục tiêu</title>
<desc id="desc">Chọn câu hỏi: Thứ tự? Đồng thuận? Lưu trữ?: Quan sát? Xử lý dữ liệu?; Đọc có ghi chép: Workload → giả định → cơ chế: Ghi giới hạn và đánh đổi; Đối chiếu triển khai: Paper là một phiên bản: Kiểm tài liệu sản phẩm hiện tại. Các khung là ý chính để đối chiếu, không nhất thiết là các bước tuần tự.</desc>
<rect width="360" height="420" fill="#f8fafc"/>
<g font-family="DejaVu Sans, sans-serif" fill="#0f172a">
<text x="20" y="28" font-size="18" font-weight="bold">sd-11-015 · Nhìn hình trước</text>
<rect x="12" y="48" width="336" height="102" rx="12" fill="#e0f2fe" stroke="#64748b"/>
<text x="24" y="75" font-size="18" font-weight="bold">Chọn câu hỏi</text>
<text x="24" y="104" font-size="18">Thứ tự? Đồng thuận? Lưu trữ?</text>
<text x="24" y="130" font-size="18">Quan sát? Xử lý dữ liệu?</text>
<rect x="12" y="162" width="336" height="102" rx="12" fill="#dcfce7" stroke="#64748b"/>
<text x="24" y="189" font-size="18" font-weight="bold">Đọc có ghi chép</text>
<text x="24" y="218" font-size="18">Workload → giả định → cơ chế</text>
<text x="24" y="244" font-size="18">Ghi giới hạn và đánh đổi</text>
<rect x="12" y="276" width="336" height="102" rx="12" fill="#fef3c7" stroke="#64748b"/>
<text x="24" y="303" font-size="18" font-weight="bold">Đối chiếu triển khai</text>
<text x="24" y="332" font-size="18">Paper là một phiên bản</text>
<text x="24" y="358" font-size="18">Kiểm tài liệu sản phẩm hiện tại</text>
</g>
</svg>
