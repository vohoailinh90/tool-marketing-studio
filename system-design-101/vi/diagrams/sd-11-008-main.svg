<svg xmlns="http://www.w3.org/2000/svg" width="320" height="492" viewBox="0 0 320 492" role="img" aria-labelledby="title desc">
<title id="title">Năm cặp đánh đổi</title>
<desc id="desc">Năm ghi chú, mỗi ghi chú là một cặp đánh đổi: chi phí và hiệu năng, độ tin cậy và khả năng mở rộng, hiệu năng và tính nhất quán, bảo mật và tính linh hoạt, tốc độ phát triển và chất lượng. Mỗi ghi chú nói điều gì kéo hai phía ra xa nhau.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs>
<rect width="320" height="492" fill="#f8fafc"/>
<g font-family="DejaVu Sans, Arial, sans-serif" fill="#0f172a">
<text x="16" y="34" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">Năm cặp đánh đổi</text>
<text x="16" y="60.2" font-size="15" fill="#475569" font-weight="normal" text-anchor="start">Được cái này, trả bằng cái kia.</text>
<rect x="8" y="80" width="304" height="404" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="108.2" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Cặp nào kéo nhau</text>
<rect x="20" y="125" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="148" r="11" fill="#16a34a"/>
<polyline points="37.9,148.4 41.7,152.4 48.5,144" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="151.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Chi phí và hiệu năng: nhanh</text>
<text x="64" y="170.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">hơn thì đắt hơn.</text>
<rect x="20" y="196" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="219" r="11" fill="#16a34a"/>
<polyline points="37.9,219.4 41.7,223.4 48.5,215" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="222.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Tin cậy và mở rộng: nhiều</text>
<text x="64" y="241.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">máy, nhiều chỗ hỏng.</text>
<rect x="20" y="267" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="290" r="11" fill="#16a34a"/>
<polyline points="37.9,290.4 41.7,294.4 48.5,286" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="293.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Hiệu năng và nhất quán:</text>
<text x="64" y="312.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">khớp nhau thì chậm hơn.</text>
<rect x="20" y="338" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="361" r="11" fill="#16a34a"/>
<polyline points="37.9,361.4 41.7,365.4 48.5,357" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="364.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Bảo mật và linh hoạt: chặt</text>
<text x="64" y="383.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">hơn thì khó đổi.</text>
<rect x="20" y="409" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="432" r="11" fill="#16a34a"/>
<polyline points="37.9,432.4 41.7,436.4 48.5,428" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="435.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Tốc độ và chất lượng: ra</text>
<text x="64" y="454.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">nhanh, trả lãi sau.</text>
</g>
</svg>
