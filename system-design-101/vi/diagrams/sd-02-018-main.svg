<svg xmlns="http://www.w3.org/2000/svg" width="320" height="1296" viewBox="0 0 320 1296" role="img" aria-labelledby="title desc">
<title id="title">Netflix xếp thành tám lớp</title>
<desc id="desc">Tám lớp từ trên xuống: ứng dụng (Swift, Kotlin, React), giao tiếp (GraphQL), dịch vụ phía sau (Zuul, Eureka, Spring Boot), cơ sở dữ liệu (EVCache, Cassandra, CockroachDB), truyền tin (Kafka, Flink), lưu video (S3, Open Connect), xử lý dữ liệu (Flink, Spark, Tableau, Redshift), phát hành (Jenkins, Spinnaker, Chaos Monkey, Atlas và nhiều công cụ khác). Khung cuối nêu ba điều cần nhớ.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs>
<rect width="320" height="1296" fill="#f8fafc"/>
<g font-family="DejaVu Sans, Arial, sans-serif" fill="#0f172a">
<text x="16" y="34" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">Netflix xếp thành tám</text>
<text x="16" y="58" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">lớp</text>
<text x="16" y="84.2" font-size="15" fill="#475569" font-weight="normal" text-anchor="start">Từ ứng dụng trên máy người xem tới</text>
<text x="16" y="103.8" font-size="15" fill="#475569" font-weight="normal" text-anchor="start">công cụ phát hành.</text>
