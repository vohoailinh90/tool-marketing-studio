<svg xmlns="http://www.w3.org/2000/svg" width="320" height="833" viewBox="0 0 320 833" role="img" aria-labelledby="title desc">
<title id="title">Sáu mảng việc của cloud native</title>
<desc id="desc">Hai khung. Khung một, ba mảng nền nối nhau: cấp phát tạo hạ tầng và cấu hình, môi trường chạy giữ container, mạng và lưu trữ, điều phối xếp lịch và nối các bản chạy. Khung hai, ba mảng phía trên: định nghĩa ứng dụng dựng và đưa mã lên, quan sát cho thấy hệ thống đang làm gì, serverless bỏ việc quản máy chủ.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs>
<rect width="320" height="833" fill="#f8fafc"/>
<g font-family="DejaVu Sans, Arial, sans-serif" fill="#0f172a">
<text x="16" y="34" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">Sáu mảng việc của cloud</text>
<text x="16" y="58" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">native</text>
<text x="16" y="84.2" font-size="15" fill="#475569" font-weight="normal" text-anchor="start">Sáu câu hỏi cần có lời đáp.</text>
<rect x="8" y="104" width="304" height="363" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="132.2" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Ba mảng nền</text>
<rect x="20" y="149" width="280" height="87" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="50" cy="192.5" r="18" fill="#1d4ed8"/><g transform="translate(39.2 181.7) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915"/><circle cx="12" cy="12" r="3"/></g>
<text x="78" y="175.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Cấp phát</text>
<text x="78" y="199.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Tạo hạ tầng, cấu hình, kho</text>
<text x="78" y="218.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">ảnh.</text>
<rect x="20" y="268" width="280" height="68" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="50" cy="302" r="18" fill="#1d4ed8"/><g transform="translate(39.2 291.2) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 7.7c0-.6-.4-1.2-.8-1.5l-6.3-3.9a1.72 1.72 0 0 0-1.7 0l-10.3 6c-.5.2-.9.8-.9 1.4v6.6c0 .5.4 1.2.8 1.5l6.3 3.9a1.72 1.72 0 0 0 1.7 0l10.3-6c.5-.3.9-1 .9-1.5Z"/><path d="M10 21.9V14L2.1 9.1"/><path d="m10 14 11.9-6.9"/><path d="M14 19.8v-8.1"/><path d="M18 17.5V9.4"/></g>
<text x="78" y="294.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Môi trường chạy</text>
<text x="78" y="318.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Container, mạng, lưu trữ.</text>
<rect x="20" y="368" width="280" height="87" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="50" cy="411.5" r="18" fill="#1d4ed8"/><g transform="translate(39.2 400.7) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect height="8" rx="2" width="8" x="3" y="3"/><path d="M7 11v4a2 2 0 0 0 2 2h4"/><rect height="8" rx="2" width="8" x="13" y="13"/></g>
<text x="78" y="394.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Điều phối</text>
<text x="78" y="418.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Xếp lịch, tìm dịch vụ, lưới</text>
<text x="78" y="437.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">dịch vụ.</text>
<polyline points="160,238 160,266" fill="none" stroke="#334155" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="160,338 160,366" fill="none" stroke="#334155" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
