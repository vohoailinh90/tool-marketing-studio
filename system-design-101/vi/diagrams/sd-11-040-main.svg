<text x="64" y="507.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">mục.</text>
<rect x="20" y="533" width="280" height="46" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="556" r="11" fill="#16a34a"/>
<polyline points="37.9,556.4 41.7,560.4 48.5,552" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="559.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">2023 đến 2026: 73 thư mục.</text>
<rect x="8" y="603" width="304" height="245" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="631.1" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Ba điều cần nhớ</text>
<rect x="20" y="648" width="280" height="46" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="671" r="11" fill="#16a34a"/>
<polyline points="37.9,671.4 41.7,675.4 48.5,667" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="674.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Thư mục khác dịch vụ.</text>
<rect x="20" y="702" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="725" r="11" fill="#16a34a"/>
<polyline points="37.9,725.4 41.7,729.4 48.5,721" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="728.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Năm phiên bản API khác</text>
<text x="64" y="747.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">năm ra mắt.</text>
<rect x="20" y="773" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="796" r="11" fill="#16a34a"/>
<polyline points="37.9,796.4 41.7,800.4 48.5,792" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="799.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Thư mục ec2 chỉ còn phiên</text>
<text x="64" y="818.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">bản từ 2014.</text>
</g>
</svg>
