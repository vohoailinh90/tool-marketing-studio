<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 617" width="320" height="617" role="img" aria-labelledby="title desc">
<title id="title">Tỉ lệ lập trình viên và kiểm thử viên thay đổi thế nào</title>
<desc id="desc">Hai thẻ so sánh: khi lỗi sửa rẻ và quay lui nhanh thì kiểm thử chuyển dần sang người viết mã dựa trên công cụ tự động; khi lỗi gây hại lớn hoặc khó thu hồi thì vẫn cần kiểm thử độc lập.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#475569" stroke-width="1.5"/></marker></defs>
<rect width="320" height="617" fill="#f8fafc"/><g font-family="DejaVu Sans, Arial, sans-serif" fill="#0f172a">
<text x="16" y="30" font-size="20" font-weight="bold">KIỂM THỬ ĐỨNG Ở ĐÂU</text>
<text x="16" y="58" font-size="16" font-weight="normal">Hai đầu của cùng một câu hỏi</text>
<rect x="16" y="89" width="288" height="155" rx="10" fill="#dcfce7" stroke="#94a3b8"/>
<text x="30" y="117" font-size="16" font-weight="bold">Lỗi rẻ, sửa nhanh</text>
<text x="30" y="144" font-size="16" font-weight="normal">Phát hành và vá được trong</text>
<text x="30" y="171" font-size="16" font-weight="normal">thời gian ngắn</text>
<text x="30" y="198" font-size="16" font-weight="normal">Có giám sát và quay lui dễ</text>
<text x="30" y="225" font-size="16" font-weight="normal">Công cụ test dùng chung</text>
<text x="16" y="276" font-size="16" font-weight="normal">Người viết mã tự kiểm thử là</text>
<text x="16" y="303" font-size="16" font-weight="normal">chủ yếu, vai trò kiểm thử</text>
<text x="16" y="330" font-size="16" font-weight="normal">riêng nhỏ lại.</text>
<rect x="16" y="349" width="288" height="182" rx="10" fill="#fee2e2" stroke="#94a3b8"/>
<text x="30" y="377" font-size="16" font-weight="bold">Lỗi đắt, khó thu hồi</text>
<text x="30" y="404" font-size="16" font-weight="normal">Ảnh hưởng an toàn, tiền</text>
<text x="30" y="431" font-size="16" font-weight="normal">bạc, dữ liệu</text>
<text x="30" y="458" font-size="16" font-weight="normal">Bản phát hành không vá được</text>
<text x="30" y="485" font-size="16" font-weight="normal">ngay</text>
<text x="30" y="512" font-size="16" font-weight="normal">Có yêu cầu quy định</text>
<text x="16" y="563" font-size="16" font-weight="normal">Vẫn cần kiểm thử độc lập, có</text>
<text x="16" y="590" font-size="16" font-weight="normal">người chuyên trách.</text>
</g></svg>
