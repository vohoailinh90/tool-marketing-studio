id: 12-history-template
status: draft
format: portrait
series: "Tool văn phòng · #12"
link: survey
slides:
  - layout: cover
    emoji: "📚"
    eyebrow: "Lịch sử & mẫu"
    title: "Mỗi sự kiện **đều được lưu lại**, lần sau không làm từ đầu"
    subtitle: "Lịch sử, quỹ phòng còn lại, và dùng lại sự kiện cũ làm mẫu."

  - layout: table
    title: "Tab Lịch sử"
    columns: ["Sự kiện", "Thu", "Chi", "Dư", "Quỹ còn lại"]
    rows:
      - ["Tất niên", "15.000.000", "14.200.000", {text: "800.000", tone: ok}, "800.000"]
      - ["Sinh nhật", "1.500.000", "1.700.000", {text: "-200.000", tone: bad}, "600.000"]
      - ["Chia tay", "3.000.000", "2.500.000", {text: "500.000", tone: ok}, "1.100.000"]
    note: "Số liệu minh hoạ. Quỹ còn lại là tổng cộng dồn của cột Dư."

  - layout: features
    title: "Các cột tiền do tool tính, không gõ tay"
    items:
      - {emoji: "💵", title: "Thu / Chi / Dư", text: "Cộng mọi vòng và cả tiền quà"}
      - {emoji: "👤", title: "Tiền mỗi người", text: "Số người thực tế và tiền mỗi người của vòng 1"}
      - {emoji: "🏦", title: "Quỹ phòng còn lại", text: "Cộng dồn số dư từ sự kiện đầu tiên đến dòng đó"}
      - {emoji: "✏️", title: "Sửa trực tiếp", text: "Bấm đúp vào ô để sửa; chỉ ô bạn sửa mới được ghi lại"}

  - layout: flow
    variant: after
    title: "Dùng sự kiện cũ làm mẫu"
    steps:
      - {emoji: "🔎", text: "Tìm sự kiện cũ trong ô tìm kiếm (theo mọi cột, hoặc chọn một cột như địa điểm)"}
      - {emoji: "⬅️", text: "Bấm **Load setup from selected event**"}
      - {emoji: "🏷️", text: "Đổi **Event ID** thành mã mới"}
      - {emoji: "✉️", text: "Gửi lời mời — danh sách người nhận đi theo mã mới"}

  - layout: pains
    tone: accent
    title: "Lưu ý khi dùng lại"
    items:
      - {emoji: "ℹ️", text: "Mọi thứ của sự kiện đang mở được **thay bằng** sự kiện bạn chọn"}
      - {emoji: "ℹ️", text: "Phiếu bầu, điểm danh, tiền đã trả **ở lại** với sự kiện gốc"}
      - {emoji: "ℹ️", text: "Sắp mất bản dịch Copilot hay email bạn sửa tay thì tool hỏi trước"}
    note: "Toàn bộ dữ liệu nằm trong một file trên máy bạn — nhớ sao lưu định kỳ."

  - layout: cta
    emoji: "📂"
    title: "Sự kiện năm ngoái của bạn **còn lưu ở đâu**?"
    text: "Excel, email hay trong đầu ai đó? Comment cho mình biết nhé."

platforms:
  facebook:
    caption: |
      “Năm ngoái mình ăn tất niên ở đâu nhỉ?” “Quỹ phòng còn bao nhiêu?” — hỏi nhau mãi mới nhớ ra 😅

      Nếu mỗi lần tổ chức là một file riêng, lịch sử rất dễ thất lạc và người sau dễ phải làm lại từ đầu.

      Trong tool, mỗi sự kiện được lưu lại cùng số Yes/No/Maybe và tình trạng gửi email. Các cột tiền do tool tính — thu, chi, dư của mọi vòng và tiền quà — và quỹ phòng còn lại là tổng cộng dồn từ sự kiện đầu tiên. Muốn tổ chức lại một buổi tương tự thì nạp sự kiện cũ, đổi Event ID, danh sách người nhận đi theo mã mới. Phiếu bầu, điểm danh và tiền đã trả vẫn ở lại với sự kiện gốc.

      Tất cả nằm trong một file trên máy bạn, nên nhớ sao lưu định kỳ.

      Sự kiện năm ngoái của bạn còn lưu ở đâu? Comment cho mình biết nhé 👇
    first_comment: |
      📋 Khảo sát ngắn — chuyện lưu lịch sử sự kiện ở chỗ bạn thế nào? {link}
    hashtags: [Outlook, Excel, tudonghoa, quyphong, vanphong]
