<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 567" width="320" height="567" role="img" aria-labelledby="title desc">
<title id="title">Docker chạy thế nào: client, host và registry</title>
<desc id="desc">Docker client gửi lệnh tới daemon trên Docker host; daemon kéo image từ registry nếu chưa có và tạo container.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#475569" stroke-width="1.5"/></marker></defs>
<rect width="320" height="567" fill="#f8fafc"/><g font-family="DejaVu Sans, Arial, sans-serif" fill="#0f172a">
<text x="16" y="30" font-size="20" font-weight="bold">CLIENT · HOST ·</text>
<text x="16" y="58" font-size="20" font-weight="bold">REGISTRY</text>
<text x="16" y="86" font-size="16" font-weight="normal">Ba thành phần của Docker</text>
<rect x="16" y="117" width="288" height="101" rx="10" fill="#dbeafe" stroke="#94a3b8"/>
<text x="30" y="145" font-size="16" font-weight="bold">Docker client</text>
<text x="30" y="172" font-size="16" font-weight="normal">Lệnh bạn gõ: build, pull,</text>
<text x="30" y="199" font-size="16" font-weight="normal">run</text>
<line x1="160" y1="230" x2="160" y2="258" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="16" y="268" width="288" height="128" rx="10" fill="#ede9fe" stroke="#94a3b8"/>
<text x="30" y="296" font-size="16" font-weight="bold">Docker host (daemon)</text>
<text x="30" y="323" font-size="16" font-weight="normal">Nhận yêu cầu qua API</text>
<text x="30" y="350" font-size="16" font-weight="normal">Quản lý image, container,</text>
<text x="30" y="377" font-size="16" font-weight="normal">mạng, volume</text>
<line x1="160" y1="408" x2="160" y2="436" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="16" y="446" width="288" height="101" rx="10" fill="#fef3c7" stroke="#94a3b8"/>
<text x="30" y="474" font-size="16" font-weight="bold">Registry</text>
<text x="30" y="501" font-size="16" font-weight="normal">Kho image, ví dụ Docker Hub</text>
<text x="30" y="528" font-size="16" font-weight="normal">Daemon kéo image khi cần</text>
</g></svg>
