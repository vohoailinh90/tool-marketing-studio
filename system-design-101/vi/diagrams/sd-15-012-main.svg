<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 679" width="320" height="679" role="img" aria-labelledby="title desc">
<title id="title">Năm nhóm lệnh SQL: làm gì, hoàn tác được không</title>
<desc id="desc">Bốn khung dọc. Một: nhóm theo việc lệnh làm chứ không theo từ đầu câu; trong PostgreSQL, select into tạo ra một bảng mới và select nextval làm đổi bộ đếm. Hai: hoàn tác được không; trong PostgreSQL, thay đổi dữ liệu, tạo sửa xóa bảng, truncate và grant đều được hoàn tác bằng rollback, còn bộ đếm thì không, và SQLite cũng hoàn tác được lệnh định nghĩa bảng. Ba: một truy vấn có thể chặn người ghi; select for update làm update chờ trong khi select thường vẫn đọc được. Bốn: chỉ mục đổi cách chạy chứ không đổi đáp án; trên 200 nghìn dòng SQLite đổi từ quét toàn bảng sang tìm theo chỉ mục. Kết quả đo một lần trên một máy.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#475569" stroke-width="1.5"/></marker></defs>
<rect width="320" height="679" fill="#f8fafc"/>
<g font-family="DejaVu Sans, Arial, sans-serif" fill="#0f172a">
<text x="16" y="30" font-size="20" font-weight="bold">HỌC SQL</text>
<text x="16" y="56" font-size="20" font-weight="bold">BẰNG THỬ NGHIỆM</text>
<text x="16" y="86" font-size="16" font-weight="normal">PostgreSQL 16 và SQLite 3, một máy</text>
<rect x="16" y="108" width="288" height="104" rx="12" fill="#dbeafe" stroke="#94a3b8"/>
<text x="30" y="138" font-size="16" font-weight="bold">1 · Nhóm theo việc làm</text>
<text x="30" y="165" font-size="16" font-weight="normal">select into tạo bảng mới</text>
<text x="30" y="192" font-size="16" font-weight="normal">nextval làm đổi bộ đếm</text>
<rect x="16" y="226" width="288" height="131" rx="12" fill="#dcfce7" stroke="#94a3b8"/>
<text x="30" y="256" font-size="16" font-weight="bold">2 · Hoàn tác được không</text>
<text x="30" y="283" font-size="16" font-weight="normal">Dữ liệu, bảng, grant: có</text>
<text x="30" y="310" font-size="16" font-weight="normal">Bộ đếm: không</text>
<text x="30" y="337" font-size="16" font-weight="normal">Hệ khác: tự thử</text>
<rect x="16" y="371" width="288" height="104" rx="12" fill="#fef3c7" stroke="#94a3b8"/>
<text x="30" y="401" font-size="16" font-weight="bold">3 · Truy vấn chặn người ghi</text>
<text x="30" y="428" font-size="16" font-weight="normal">for update: update chờ</text>
<text x="30" y="455" font-size="16" font-weight="normal">select thường vẫn đọc</text>
<rect x="16" y="489" width="288" height="104" rx="12" fill="#ede9fe" stroke="#94a3b8"/>
<text x="30" y="519" font-size="16" font-weight="bold">4 · Chỉ mục đổi cách chạy</text>
<text x="30" y="546" font-size="16" font-weight="normal">Quét toàn bảng → tìm theo</text>
<text x="30" y="573" font-size="16" font-weight="normal">chỉ mục; đáp án giữ nguyên</text>
<text x="16" y="633" font-size="16" font-weight="normal">Hỏi lệnh làm gì,</text>
<text x="16" y="659" font-size="16" font-weight="normal">đừng chỉ hỏi nó thuộc nhóm nào.</text>
</g></svg>
