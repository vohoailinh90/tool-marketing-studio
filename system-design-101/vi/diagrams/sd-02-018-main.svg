<text x="20" y="714.1" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Đứng ngoài đường đi đó</text>
<rect x="20" y="731" width="280" height="88" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
<circle cx="50" cy="775" r="18" fill="#b45309"/><g transform="translate(39.2 764.2) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.536 21.686a.5.5 0 0 0 .937-.024l6.5-19a.496.496 0 0 0-.635-.635l-19 6.5a.5.5 0 0 0-.024.937l7.93 3.18a2 2 0 0 1 1.112 1.11z"/><path d="m21.854 2.147-10.94 10.939"/></g>
<text x="78" y="757.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Truyền tin, dòng dữ</text>
<text x="78" y="777.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">liệu</text>
<text x="78" y="801.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Kafka và Flink.</text>
