id: 01-process
status: draft
format: portrait
series: "AIとの開発 · #1"
link: ""
slides:
  - layout: cover
    emoji: "🧭"
    eyebrow: "AIの成果物のレビュー"
    title: "**誰が・何回**、確認する？"
    subtitle: "設計はClaude、批判はCodex。最後まで回すための取り決めです。"

  - layout: table
    title: "先に決めておくこと"
    columns: ["決めること", "私の取り決め"]
    rows:
      - ["設計する人", "Claude（実装と修正も）"]
      - ["批判する人", "Codex（設計の批判とPRレビューだけ）"]
      - ["往復の上限", "設計と批判2回・修正2回・レビュー3回"]
      - ["同じ種類の依頼", "同じコミットには原則1回（例外は2つ）"]
      - ["完了の判定", "次の画面の6つの条件をすべて満たす"]
    note: "レビューの回数は、GitHub上の投稿をスクリプトが数えます。AIの記憶には頼りません。"

  - layout: checklist
    title: "「完了」と言える条件"
    tone: ok
    items:
      - "Codexが起動した形跡があり、意図した種類の依頼を意図したコミットで実行した"
      - "Claudeが要約ではなく、差分の全体を確認した"
      - "受け入れ基準ごとに根拠がある"
      - "必須のテスト・チェック・レビューがすべて通っている"
      - "P0／P1の指摘が残っていない"
      - "範囲を広げていない"
    note: "満たせば自動でマージします。ただし、ベースブランチが最新化を必須にしている（またはマージキュー）、マージする主体がそれを迂回できない、マージ操作が検証済みのコミットに固定されている、の3つが前提です。人が判断するのは、機械では決められない判断と、元の要件が変わったときだけです。"

  - layout: timeline
    title: "一件の流れ"
    items:
      - {when: "着手前", text: "6つの観点で採点。区分と上限はスクリプトが決める"}
      - {when: "設計", text: "Claudeが設計し、受け入れ基準を書く"}
      - {when: "批判", text: "Codexが設計を、読み取りのみで批判"}
      - {when: "実装", text: "Claudeが設計を直して実装し、PRを開く"}
      - {when: "レビュー", text: "PRを開いたら、すぐCodexに依頼"}
      - {when: "確認", text: "Claudeが差分を読み直し、確認できた指摘だけ直す"}
    note: "文言修正のような小さな作業は、Claudeだけで済ませます。"

  - layout: table
    title: "区分ごとのエージェント数"
    columns: ["区分", "点数", "Claudeのみ", "Codexが批判"]
    rows:
      - ["T0", "0–2", "0", "0（Codex不使用）"]
      - ["T1", "3–5", "1", "0"]
      - ["T2", "6–8", "2", "0"]
      - ["T3", "9–12", "3", "1"]
    note: "各観点は0〜2点。決済・認可・データ移行などは、点数が低くても区分が引き上げられます。追加枠：T3で要件が曖昧なら要件分析役を+1、T2・T3でレビュー担当が「検証に専用の設計が要る」と報告すればtest-engineerを+1。"

  - layout: table
    title: "Claude側：メイン1＋8役"
    columns: ["役割", "出番", "仕事"]
    rows:
      - ["requirement-analyst", "T3・曖昧さ2", "要件の整理"]
      - ["architect", "T2・構造/契約の変更", "設計案"]
      - ["architecture-critic", "T3", "設計の批判"]
      - ["code-reviewer", "T1・T2", "差分確認と検証"]
      - ["code-reviewer-t3", "T3", "同上（余裕あり）"]
      - ["code-reviewer-verify", "選んだ時のみ", "同上（検証が重い時）"]
      - ["test-engineer", "検証設計の報告時", "専用の検証設計"]
      - ["implementer", "昇格時のみ", "計画どおり実装"]
    note: "メインのセッションが分析・設計・実装を担い、上限には数えません。implementer以外は読み取り専用です。"

  - layout: features
    title: "Codex側：批判だけ"
    items:
      - {emoji: "🆕", title: "常駐なし", text: "呼ぶたびに、独立した文脈の新しいタスク"}
      - {emoji: "🔍", title: "3種類の出番", text: "設計の批判、PRレビュー、機微な変更ではセキュリティレビュー"}
      - {emoji: "🧾", title: "設計の批判の作法", text: "critical と high のみ。根拠と壊れる場面つきで、結論は承認・条件付き承認・却下のいずれか"}
      - {emoji: "🚫", title: "やらないこと", text: "コードは書かず、修正もしない。T3ではClaude側にレビュー担当を1つ残す"}

  - layout: checklist
    title: "止まらずに回し続ける工夫"
    items:
      - "引き継ぎメモに、目的・完了分・残り・次のコマンドを残す"
      - "コンテキストの約70%でメモ更新、約85%で締めに入る"
      - "圧縮の前やレート制限の時点で自動保存し、新しいセッションが読み込む"
      - "数えられること（往復数・コミット照合・テスト）は機械に任せる"
    note: "最初からやり直すより、続きから再開するほうが安く済みます。"

  - layout: poll
    eyebrow: "みなさんは？"
    question: "AIの活用、どこまで自動にしていますか？"
    options:
      - "書かせるだけ"
      - "レビューまで自動"
      - "マージまで自動"
      - "まだ使っていない"
    hint: "A・B・C・D のどれかをコメントでどうぞ"

platforms:
  facebook:
    caption: |
      AIが書いたものを、誰が・何回・どこまで確認するのか。私の取り決めを共有します 👇

      【基本】設計と実装、修正はClaude。Codexは批判だけで、設計の批判とPRのレビューを担当します。最後まで回しますが、往復の上限と「完了の条件」を先に決めています。自作のテンプレート用リポジトリ（現在は非公開）の手順です。

      【採点】要件を6つの観点で、各0〜2点で採点し、T0〜T3の区分をスクリプトが決めます。文言修正ならClaudeだけ。決済や認可に触れる変更は、点数が低くても区分が上がります。

      【体制】Claude側はメインのセッション1つと、8つの役割（要件の整理、設計、設計の批判、3種類のレビュー担当、検証設計、実装）。エージェントの上限はT0〜T3で0、1、2、3、Codexが批判に入ると0、0、0、1です。Codexに常駐エージェントはなく、呼ぶたびに新しいタスクです。

      【上限と完了】修正は最大2回、レビューは1つのPRにつき3回まで。完了とは、Codexが意図したコミットで実行され、Claudeが差分の全体を確認し、受け入れ基準ごとに根拠があり、必須のテスト・チェック・レビューが通り、P0／P1の指摘が残らず、範囲も広がっていない状態です。マージは自動ですが、ベースブランチが最新化を必須にしている（またはマージキュー）、マージする主体がそれを迂回できない、マージ操作が検証済みのコミットに固定されている、の場合に限ります。

      【継続】引き継ぎメモを使い、コンテキストの約70%で書き出し、約85%で締めに入ります。新しいセッションはメモから再開します。

      【制約】Codex CloudをGitHubに接続し、利用枠が残っている必要があります。

      みなさんは、AIの活用をどこまで自動にしていますか？
    hashtags: [Claude, Codex, AI活用, 業務改善, 開発]
