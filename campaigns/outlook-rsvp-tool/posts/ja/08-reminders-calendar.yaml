id: 08-reminders-calendar
status: draft
format: portrait
series: "幹事の業務効率化 · #8"
link: survey
slides:
  - layout: cover
    emoji: "🔔"
    eyebrow: "リマインドと出席依頼"
    title: "リマインドは**未回答の人だけ**に。出席依頼は**参加する人だけ**に"
    subtitle: "Scan Inbox のあと、ツールは誰が未回答で、誰が参加予定かを把握しています。"

  - layout: chat
    title: "全員に送ると、回答済みの人に申し訳ない…"
    group: "総務部 歓送迎会🎉"
    messages:
      - {me: true, text: "【再送】歓送迎会の出欠、まだの方はお知らせください🙏"}
      - {from: "佐藤", text: "昨日、投票ボタンで回答しましたよ😅"}
      - {from: "田中", text: "私も回答済みです！"}
      - {from: "鈴木", text: "どのメールでしたっけ…探します"}
      - {me: true, text: "すみません、誰が回答済みか分からなくなってしまって😭"}

  - layout: compare
    title: "リマインドと出席依頼：これまでとこれから"
    before:
      label: "これまで"
      items:
        - "全員に一斉リマインド（回答済みの人にも届く）"
        - "誰が回答済みかは、頭の中で管理"
        - "参加する人だけに会議出席依頼を送り直す"
    after:
      label: "ツールなら"
      items:
        - "**未回答の人だけ**にリマインドメール"
        - "Scan Inbox の結果をもとに判断"
        - "**はい・未定**の人にだけ会議出席依頼"

  - layout: features
    title: "ツールが守ってくれること"
    items:
      - {emoji: "🔒", title: "誤送信を防ぐ", text: "リマインドと出席依頼は、開いているイベントをスキャンした後にだけ送れます。別のイベントの名簿には届きません"}
      - {emoji: "🖼️", title: "説明画像を添付", text: "案内メールにもリマインドメールにも、投票ボタンの押し方の画像を添付"}
      - {emoji: "🎁", title: "餞別のリマインドも", text: "Collect Responses タブと Gift Contribution タブから送れます"}

  - layout: pains
    tone: accent
    title: "正直にお伝えします"
    items:
      - {emoji: "⚠️", text: "リマインドはアプリから**手動で送信**。スケジュールによる自動送信はまだありません"}
      - {emoji: "⚠️", text: "Outlook デスクトップ版を起動し、サインインしている必要があります"}
      - {emoji: "⚠️", text: "同じメールアドレスを共有する2人は区別できません"}

  - layout: cta
    emoji: "🙋"
    title: "**自動リマインド**は必要ですか？"
    text: "まだ作っていない機能です。必要かどうか教えてください。皆さんの声で作る順番を決めます。"
    keyword: "自動リマインド"

platforms:
  facebook:
    caption: |
      「回答したのに…」と言われそうで、リマインドを送るのをためらったことはありませんか？😅

      全員に一斉送信すると、回答済みの人に申し訳ない。かといって送らなければ、未回答の人が残ります。しかも、誰が回答済みか分からなくなる…幹事あるあるです。

      このツールでは、Scan Inbox のあとに、未回答の人だけへリマインドメールを送れます。会議出席依頼は「はい」「未定」の人だけ。どちらも、開いているイベントをスキャンした後にしか送れないので、別のイベントの名簿に届くことはありません。

      正直にお伝えすると、リマインドはアプリから手動で送る方式で、スケジュールによる自動送信はまだありません。

      自動リマインドは必要ですか？欲しい方は「自動リマインド」とコメントください👇
    first_comment: |
      📋 3分のアンケート — 次に作る機能を一緒に選んでください：{link}
    hashtags: [幹事, Outlook, リマインド, 業務効率化, 出欠確認]
