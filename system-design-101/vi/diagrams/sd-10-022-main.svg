<text x="78" y="595.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">hoặc sai.</text>
<rect x="20" y="627" width="280" height="87" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
