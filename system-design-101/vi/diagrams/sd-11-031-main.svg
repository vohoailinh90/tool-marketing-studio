<svg xmlns="http://www.w3.org/2000/svg" width="360" height="420" viewBox="0 0 360 420" role="img" aria-labelledby="title desc">
<title id="title">Distributed lock: khóa chưa đủ nếu chủ cũ vẫn ghi</title>
<desc id="desc">Cấp lease: A giữ quyền tạm thời: Token 41; Lease hết • chủ mới: B được cấp token 42: A có thể chưa dừng; Tài nguyên đích: Đã thấy 42 → từ chối 41: Khóa + fencing khi cần. Các khung là ý chính để đối chiếu, không nhất thiết là các bước tuần tự.</desc>
<rect width="360" height="420" fill="#f8fafc"/>
<g font-family="DejaVu Sans, sans-serif" fill="#0f172a">
<text x="20" y="28" font-size="18" font-weight="bold">sd-11-031 · Nhìn hình trước</text>
<rect x="12" y="48" width="336" height="102" rx="12" fill="#e0f2fe" stroke="#64748b"/>
<text x="24" y="75" font-size="18" font-weight="bold">Cấp lease</text>
<text x="24" y="104" font-size="18">A giữ quyền tạm thời</text>
<text x="24" y="130" font-size="18">Token 41</text>
<rect x="12" y="162" width="336" height="102" rx="12" fill="#dcfce7" stroke="#64748b"/>
<text x="24" y="189" font-size="18" font-weight="bold">Lease hết • chủ mới</text>
<text x="24" y="218" font-size="18">B được cấp token 42</text>
<text x="24" y="244" font-size="18">A có thể chưa dừng</text>
<rect x="12" y="276" width="336" height="102" rx="12" fill="#fef3c7" stroke="#64748b"/>
<text x="24" y="303" font-size="18" font-weight="bold">Tài nguyên đích</text>
<text x="24" y="332" font-size="18">Đã thấy 42 → từ chối 41</text>
<text x="24" y="358" font-size="18">Khóa + fencing khi cần</text>
</g>
</svg>
