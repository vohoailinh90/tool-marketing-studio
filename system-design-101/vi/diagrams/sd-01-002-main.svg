<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 1290" width="320" height="1290" role="img" aria-labelledby="title desc">
<title id="title">Sáu cách dùng bộ cân bằng tải</title>
<desc id="desc">Các khung từ trên xuống: loại máy lỗi và chọn máy khỏe; kiểm tra sức khỏe; định tuyến theo nền tảng; kết thúc TLS; chia tải xuyên vùng sẵn sàng; giữ phiên tới cùng máy khi máy đó còn đủ điều kiện.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs>
<rect width="320" height="1290" fill="#f8fafc"/>
<g font-family="DejaVu Sans, Arial, sans-serif">
<text x="16" y="30" font-size="21" fill="#0f172a" text-anchor="start" font-weight="bold">LOAD BALANCER</text>
<text x="16" y="54" font-size="16" fill="#0f172a" text-anchor="start" font-weight="normal">Sáu tình huống, sáu khung dọc.</text>
<rect x="8" y="70" width="304" height="192" rx="12" fill="white" stroke="#cbd5e1"/>
<text x="22" y="99" font-size="18" fill="#0f172a" text-anchor="start" font-weight="bold">1 · Xử lý lỗi</text>
<rect x="24" y="150" width="72" height="34" rx="7" fill="#ede9fe" stroke="#94a3b8"/>
<text x="60.0" y="172" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="normal">LB</text>
<rect x="204" y="123" width="90" height="34" rx="7" fill="#fee2e2" stroke="#94a3b8"/>
<text x="249.0" y="145" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="normal">A lỗi</text>
<rect x="204" y="183" width="90" height="34" rx="7" fill="#dcfce7" stroke="#94a3b8"/>
<text x="249.0" y="205" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="normal">B khỏe</text>
<line x1="96" y1="164" x2="202" y2="140" stroke="#334155" stroke-width="1.8" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
<line x1="96" y1="169" x2="202" y2="200" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M143,142 l14,14 m0,-14 l-14,14" stroke="#b91c1c" stroke-width="3"/>
<text x="160" y="245" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="normal">Request mới → B</text>
<rect x="8" y="272" width="304" height="192" rx="12" fill="white" stroke="#cbd5e1"/>
<text x="22" y="301" font-size="18" fill="#0f172a" text-anchor="start" font-weight="bold">2 · Kiểm tra sức khỏe</text>
<rect x="24" y="350" width="72" height="34" rx="7" fill="#ede9fe" stroke="#94a3b8"/>
<text x="60.0" y="372" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="normal">LB</text>
<rect x="204" y="350" width="90" height="34" rx="7" fill="#dcfce7" stroke="#94a3b8"/>
<text x="249.0" y="372" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="normal">Máy A</text>
<line x1="96" y1="363" x2="202" y2="363" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="204" y1="377" x2="98" y2="377" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="150" y="342" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="normal">Kiểm tra</text>
<text x="160" y="427" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="normal">Định kỳ đánh giá sức khỏe</text>
<rect x="8" y="474" width="304" height="192" rx="12" fill="white" stroke="#cbd5e1"/>
<text x="22" y="503" font-size="18" fill="#0f172a" text-anchor="start" font-weight="bold">3 · Phân luồng nền tảng</text>
<rect x="24" y="554" width="72" height="34" rx="7" fill="#ede9fe" stroke="#94a3b8"/>
<text x="60.0" y="576" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="normal">LB</text>
<rect x="192" y="527" width="104" height="34" rx="7" fill="#dbeafe" stroke="#94a3b8"/>
<text x="244.0" y="549" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="normal">Mobile</text>
<rect x="192" y="587" width="104" height="34" rx="7" fill="#dbeafe" stroke="#94a3b8"/>
<text x="244.0" y="609" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="normal">Desktop</text>
<line x1="96" y1="568" x2="190" y2="544" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="96" y1="573" x2="190" y2="604" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="160" y="649" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="normal">Chọn nhóm theo luật header</text>
<rect x="8" y="676" width="304" height="192" rx="12" fill="white" stroke="#cbd5e1"/>
<text x="22" y="705" font-size="18" fill="#0f172a" text-anchor="start" font-weight="bold">4 · Kết thúc TLS</text>
<rect x="16" y="763" width="72" height="34" rx="7" fill="#dbeafe" stroke="#94a3b8"/>
<text x="52.0" y="785" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="normal">App</text>
<rect x="126" y="763" width="66" height="34" rx="7" fill="#ede9fe" stroke="#94a3b8"/>
<text x="159.0" y="785" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="normal">LB</text>
<rect x="230" y="763" width="74" height="34" rx="7" fill="#dcfce7" stroke="#94a3b8"/>
<text x="267.0" y="785" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="normal">Máy A</text>
<line x1="88" y1="780" x2="124" y2="780" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="192" y1="780" x2="228" y2="780" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="105" y="753" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="normal">HTTPS</text>
<text x="212" y="753" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="normal">HTTP(S)</text>
<text x="160" y="830" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="normal">TLS từ App kết thúc tại LB</text>
<text x="160" y="852" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="normal">Chặng sau cấu hình riêng</text>
<rect x="8" y="878" width="304" height="192" rx="12" fill="white" stroke="#cbd5e1"/>
<text x="22" y="907" font-size="18" fill="#0f172a" text-anchor="start" font-weight="bold">5 · Chia tải xuyên vùng</text>
<rect x="24" y="958" width="72" height="34" rx="7" fill="#ede9fe" stroke="#94a3b8"/>
<text x="60.0" y="980" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="normal">LB</text>
<rect x="192" y="931" width="104" height="34" rx="7" fill="#dcfce7" stroke="#94a3b8"/>
<text x="244.0" y="953" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="normal">Vùng A</text>
<rect x="192" y="991" width="104" height="34" rx="7" fill="#dcfce7" stroke="#94a3b8"/>
<text x="244.0" y="1013" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="normal">Vùng B</text>
<line x1="96" y1="972" x2="190" y2="948" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="96" y1="977" x2="190" y2="1008" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="160" y="1053" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="normal">Các vùng sẵn sàng đã bật</text>
<rect x="8" y="1080" width="304" height="192" rx="12" fill="white" stroke="#cbd5e1"/>
<text x="22" y="1109" font-size="18" fill="#0f172a" text-anchor="start" font-weight="bold">6 · Giữ phiên (stickiness)</text>
<rect x="16" y="1165" width="80" height="34" rx="7" fill="#dbeafe" stroke="#94a3b8"/>
<text x="56.0" y="1187" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="normal">User X</text>
<rect x="134" y="1165" width="62" height="34" rx="7" fill="#ede9fe" stroke="#94a3b8"/>
<text x="165.0" y="1187" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="normal">LB</text>
<rect x="232" y="1165" width="72" height="34" rx="7" fill="#dcfce7" stroke="#94a3b8"/>
<text x="268.0" y="1187" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="normal">Máy A</text>
<line x1="96" y1="1182" x2="132" y2="1182" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="196" y1="1182" x2="230" y2="1182" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="160" y="1234" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="normal">Lượt sau tiếp tục tới A</text>
<text x="160" y="1256" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="normal">Khi A còn đủ điều kiện</text>
</g></svg>
