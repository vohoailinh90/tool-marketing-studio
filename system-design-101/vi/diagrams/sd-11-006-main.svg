<title id="title">Chín mẫu tổ chức luồng dữ liệu và giao tiếp</title>
<desc id="desc">Giao tiếp: Request/response • gateway: Peer-to-peer • pub/sub; Dữ liệu: ETL • batch • streaming: Event sourcing: lịch sử nguồn; Workflow: Orchestrator dẫn các bước: Ghi tiến độ và lỗi. Các khung là ý chính để đối chiếu, không nhất thiết là các bước tuần tự.</desc>
