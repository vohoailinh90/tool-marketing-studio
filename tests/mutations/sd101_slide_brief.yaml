target: scripts/sd101_slide_brief.py
note: The brief is what a session builds a deck from, so a wrong grouping, a lost concept, a typed address or a missing budget flag reaches all 120 decks. Each entry switches one rule off and names the test that must notice.
mutations:
- label: concepts beyond the slide count are grouped from the end instead of the front
  find: 'base + (1 if index < extra else 0)'
  replace: 'base + (1 if index >= slots - extra else 0)'
  test: tests.test_sd101_slide_brief.StructureTests.test_more_concepts_than_slides_are_grouped_in_order_without_loss
- label: one slide is made per concept however many there are, past the 8 to 10 range
  find: 'slots = min(max(len(raw_concepts), CONCEPT_SLIDES.start), CONCEPT_SLIDES.stop - 1)'
  replace: 'slots = len(raw_concepts)'
  test: tests.test_sd101_slide_brief.StructureTests.test_more_concepts_than_slides_are_grouped_in_order_without_loss
- label: lessons that keep their concepts in the figure get none
  find: '    cards = figure_cards(svg)'
  replace: '    cards = []'
  test: tests.test_sd101_slide_brief.StructureTests.test_lessons_without_a_figure_section_fall_back_to_the_figure_cards
- label: the figure's own title and subtitle are read as a concept card
  find: 'seen_card = bold and size < title_size'
  replace: 'seen_card = True'
  test: tests.test_sd101_slide_brief.StructureTests.test_figure_cards_without_numbers_still_open_a_card_at_every_bold_heading
- label: a line over the word budget is not flagged
  find: 'return Line(text, words, budget and words > WORD_BUDGET)'
  replace: 'return Line(text, words, False)'
  test: tests.test_sd101_slide_brief.StructureTests.test_words_over_the_budget_are_flagged_but_titles_are_not
- label: the cover title is held to the bullet budget
  find: '"title": line(parsed.title, budget=False).__dict__,'
  replace: '"title": line(parsed.title).__dict__,'
  test: tests.test_sd101_slide_brief.StructureTests.test_words_over_the_budget_are_flagged_but_titles_are_not
- label: a link in the lesson keeps its address on the slide
  find: 'ADDRESS.sub(ADDRESS_TOKEN, LINK.sub(r"\1", text))'
  replace: 'ADDRESS.sub(ADDRESS_TOKEN, text)'
  test: tests.test_sd101_slide_brief.StructureTests.test_check_question_answer_deep_dive_terms_and_sources
- label: an even deck puts two dark slides side by side at the end
  find: '        result[-2] = "cream"'
  replace: '        pass'
  test: tests.test_sd101_slide_brief.StructureTests.test_backgrounds_bracket_the_deck_in_dark_and_repeat_at_most_once
- label: the cover loses the check question that can serve as its hook question
  find: '**({"question_candidate": line(question[0]).__dict__} if question else {}),'
  replace: ''
  test: tests.test_sd101_slide_brief.StructureTests.test_the_cover_offers_the_check_question_as_the_hook_question
- label: a lesson that is not valid UTF-8 ends in a traceback instead of a message
  find: '    except UnicodeDecodeError as error:'
  replace: '    except KeyboardInterrupt as error:'
  test: tests.test_sd101_slide_brief.CommandLineTests.test_a_lesson_that_is_not_utf8_exits_1_with_a_message_not_a_traceback
- label: a typed address in the lesson reaches the brief
  find: '    text = ADDRESS.sub(ADDRESS_TOKEN, LINK.sub(r"\1", text))'
  replace: '    text = LINK.sub(r"\1", text)'
  test: tests.test_sd101_slide_brief.StructureTests.test_a_typed_address_is_hidden_wherever_it_is_typed_and_the_session_is_told
- label: the prose that explains the figure's cards lands on the situation slide
  find: '([] if from_cards else figure_plain)'
  replace: 'figure_plain'
  test: tests.test_sd101_slide_brief.StructureTests.test_the_prose_of_the_figure_section_stays_off_the_situation_slide_when_the_cards_are_the_concepts
- label: a bold callout inside a numbered figure card opens a new concept
  find: '        opens = bold and (not numbered or bool(ORDINAL.match(text)))'
  replace: '        opens = bold'
  test: tests.test_sd101_slide_brief.StructureTests.test_a_bold_line_inside_a_numbered_card_is_a_line_of_that_card_not_a_new_concept
- label: only the first link of a source bullet is listed
  find: 'labels = [clean(label) for label in LINK.findall(raw)]'
  replace: 'labels = [clean(label) for label in LINK.findall(raw)[:1]]'
  test: tests.test_sd101_slide_brief.StructureTests.test_every_link_of_a_source_bullet_is_a_source_not_only_the_first
- label: any bold line right after a heading is read as its wrapped continuation
  find: '    return size == last_size and abs(x - last_x) < 1 and 0 < y - last_y <= size * 2'
  replace: '    return True'
  test: tests.test_sd101_slide_brief.StructureTests.test_a_group_heading_above_the_first_card_is_not_glued_to_the_card_heading
- label: an entry of a numbered list is not a bullet
  find: 'elif stripped.startswith("- ") or ORDERED.match(stripped):'
  replace: 'elif stripped.startswith("- "):'
  test: tests.test_sd101_slide_brief.StructureTests.test_an_ordered_list_under_the_figure_section_gives_the_concepts_before_the_figure_cards_do
- label: the deep dive is found only by the words "sâu hơn" in its summary
  find: 'if ANSWER_SUMMARY not in summary.lower()), "")'
  replace: 'if "sâu hơn" in summary.lower()), "")'
  test: tests.test_sd101_slide_brief.StructureTests.test_the_deep_dive_is_the_details_block_that_is_not_the_answer_whatever_its_summary_says
- label: the whole opening paragraph is the hook and nothing is left for the situation
  find: 'split_opening(paragraphs[0]) if paragraphs else ("", ""))'
  replace: '(clean(paragraphs[0]), "") if paragraphs else ("", ""))'
  test: tests.test_sd101_slide_brief.StructureTests.test_the_opening_paragraph_is_cut_into_the_hook_and_the_situation
- label: a lesson with nothing after its hook leaves the situation slide empty
  find: '    if not situation and parsed.alt:'
  replace: '    if False:'
  test: tests.test_sd101_slide_brief.StructureTests.test_a_lesson_that_says_nothing_after_its_hook_gets_a_situation_from_the_figure_description
- label: a lesson with no takeaway section leaves the summary slide empty
  find: '        takeaways = [("recap of the concepts", [c.label for group in concept_slides for c in group])]'
  replace: '        pass'
  test: tests.test_sd101_slide_brief.StructureTests.test_a_lesson_without_a_takeaway_section_gets_a_recap_of_its_concepts_on_the_summary_slide
- label: the figure description is copied into the situation slide as if it were slide copy
  find: '"lines": [line(text).__dict__ for text in situation]}))'
  replace: '"lines": [line(text).__dict__ for text in situation], "figure_alt": parsed.alt}))'
  test: tests.test_sd101_slide_brief.StructureTests.test_the_figure_description_is_guidance_in_the_header_not_slide_material
- label: a source bullet without a link is dropped from the sources slide
  find: '        if not labels:  # a source named in words only'
  replace: '        if False:  # a source named in words only'
  test: tests.test_sd101_slide_brief.StructureTests.test_a_source_bullet_without_a_link_is_named_by_its_text_up_to_the_first_colon
- label: every unrecognised section of the lesson body feeds the summary slide
  find: 'for name, rest in parsed.sections.items() if name.startswith(TAKEAWAY_PREFIXES)]'
  replace: 'for name, rest in parsed.sections.items() if not name.startswith(known)]'
  test: tests.test_sd101_slide_brief.StructureTests.test_only_the_limits_and_choice_sections_feed_the_summary_slide
- label: the lines of a fenced code block are read as slide text
  find: '        if in_fence or TABLE_ROW.match(stripped):'
  replace: '        if False:'
  test: tests.test_sd101_slide_brief.StructureTests.test_code_blocks_and_tables_are_left_out_of_the_slide_lines_and_the_session_is_told
