<text x="160" y="1183.9" font-size="15" fill="#0f172a" font-weight="bold" text-anchor="middle">Thanh</text>
<text x="160" y="1202.6" font-size="15" fill="#0f172a" font-weight="bold" text-anchor="middle">toán</text>
<rect x="216" y="1130" width="84" height="86" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
<circle cx="258" cy="1152" r="14" fill="#b45309"/><g transform="translate(249.6 1143.6) scale(0.7)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 21.73a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73z"/><path d="M12 22V12"/><polyline points="3.29 7 12 12 20.71 7"/><path d="m7.5 4.27 9 5.15"/></g>
<text x="258" y="1183.9" font-size="15" fill="#0f172a" font-weight="bold" text-anchor="middle">Kho</text>
<polyline points="62,1216 62,1553" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4 4"/>
<polyline points="160,1216 160,1553" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4 4"/>
<polyline points="258,1216 258,1553" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4 4"/>
<text x="111" y="1244.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="middle">Trừ 300</text>
<text x="111" y="1263.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="middle">cho đơn 1</text>
<polyline points="63,1277 157,1277" fill="none" stroke="#334155" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="111" y="1305.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="middle">Đã trừ</text>
<polyline points="159,1319 65,1319" fill="none" stroke="#334155" stroke-width="1.8" stroke-dasharray="5 4" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="160" y="1347.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="middle">Giữ 1 cuốn sách</text>
<polyline points="63,1361 255,1361" fill="none" stroke="#334155" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="160" y="1389.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="middle">Hết hàng: bị chặn</text>
