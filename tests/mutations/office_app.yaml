# Mutation manifest — see scripts/mutation_check.py
#
# The page filters answers by the feature the person picked in the pipeline view. A sample ignores that
# filter, so the filter must be dropped when the source changes; this entry removes that line and requires the test to notice.

target: office/src/App.tsx
note: One state reset is the whole fix, so the test that reads it is the only thing that can notice it going.
mutations:
- label: switching the source keeps the picked feature, so a sample is rejected and the page never leaves the loading state
  find: |-
    setFeature(null) // a sample ignores the feature filter, so a stale one would reject every answer
  replace: |-
    // the feature filter is kept across a source change
  test: tests.test_office_ui.SourceHygieneTests.test_switching_the_source_resets_the_feature_filter
- label: a hand-made cursor move no longer ends the sample's pause, so it fires later and drags the live view back to the sample
  find: |-
    cancelHold()
        setCursor(next)
  replace: |-
    setCursor(next)
  test: tests.test_office_ui.SourceHygieneTests.test_every_hand_made_cursor_move_ends_the_samples_pause
- label: going back to live leaves the cursor move to a bare setCursor, so the pause survives it
  find: |-
    onLive={() => moveCursor(null)}
  replace: |-
    onLive={() => setCursor(null)}
  test: tests.test_office_ui.SourceHygieneTests.test_every_hand_made_cursor_move_ends_the_samples_pause
- label: pausing the player leaves the sample's pause running, so it rewinds a view the person paused
  find: |-
    if (!next) cancelHold()
  replace: |-
    // pausing does not end the pause
  test: tests.test_office_ui.SourceHygieneTests.test_every_hand_made_cursor_move_ends_the_samples_pause
- label: the filter is no longer dropped when its feature is gone from the answer, so the page keeps asking for it
  find: |-
    if (kept !== feature) setFeature(kept)
  replace: |-
    // the filter is kept whatever the answer says
  test: tests.test_office_ui.SourceHygieneTests.test_the_page_draws_an_answer_whose_feature_no_longer_exists_and_drops_the_filter
