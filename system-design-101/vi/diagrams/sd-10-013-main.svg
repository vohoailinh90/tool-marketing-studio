<text x="16" y="84.2" font-size="15" fill="#475569" font-weight="normal" text-anchor="start">Danh sách gợi ý của bài nguồn, giữ</text>
<text x="16" y="103.8" font-size="15" fill="#475569" font-weight="normal" text-anchor="start">nguyên nhóm.</text>
