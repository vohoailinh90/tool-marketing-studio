<text x="64" y="1131.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Kế hoạch di chuyển.</text>
<rect x="8" y="1175" width="304" height="262" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
