<svg xmlns="http://www.w3.org/2000/svg" width="320" height="1375" viewBox="0 0 320 1375" role="img" aria-labelledby="title desc">
<title id="title">Giảm độ trễ: đo trước, chọn sau</title>
<desc id="desc">Ba khung. Khung một, bốn bước: đo xem thời gian nằm ở đâu; chọn cách đánh vào đúng khúc đó; đo lại; ghi cái giá phải trả. Khung hai, sáu cách: chỉ mục cắt thời gian tìm trong cơ sở dữ liệu, thử nghiệm thấy truy vấn từ khoảng 11 đến 13 mili giây còn 1 đến 2 mili giây; bộ nhớ đệm bỏ qua việc tính lại; cân bằng tải bớt hàng chờ ở một máy; CDN rút ngắn quãng đường; bất đồng bộ cho người dùng khỏi chờ việc chậm; nén làm gói nhỏ lại, một tệp JSON lặp nhiều còn khoảng 8 phần trăm. Khung ba, cái giá: chỉ mục làm việc ghi chậm hơn khoảng ba lần trong thử nghiệm; bộ nhớ đệm có thể trả dữ liệu cũ; nén tốn thời gian máy và không làm dữ liệu ngẫu nhiên nhỏ đi.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs>
<rect width="320" height="1375" fill="#f8fafc"/>
<g font-family="DejaVu Sans, Arial, sans-serif" fill="#0f172a">
<text x="16" y="34" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">Giảm độ trễ: đo trước,</text>
<text x="16" y="58" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">chọn sau</text>
<text x="16" y="84.2" font-size="15" fill="#475569" font-weight="normal" text-anchor="start">Mỗi cách cắt một khúc khác của thời</text>
<text x="16" y="103.8" font-size="15" fill="#475569" font-weight="normal" text-anchor="start">gian chờ.</text>
<rect x="8" y="123" width="304" height="452" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="151.2" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Cách làm</text>
<rect x="20" y="168" width="280" height="68" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="46" cy="194" r="14" fill="#1d4ed8"/>
<text x="46" y="199.5" font-size="16" fill="#ffffff" font-weight="bold" text-anchor="middle">1</text>
<text x="70" y="194.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Đo</text>
<text x="70" y="218.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Thời gian nằm ở khúc nào?</text>
<rect x="20" y="258" width="280" height="87" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="46" cy="284" r="14" fill="#1d4ed8"/>
<text x="46" y="289.5" font-size="16" fill="#ffffff" font-weight="bold" text-anchor="middle">2</text>
<text x="70" y="284.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Chọn</text>
<text x="70" y="308.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Cách đánh vào đúng khúc</text>
<text x="70" y="327.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">đó.</text>
<polyline points="46,238 46,256" fill="none" stroke="#334155" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="20" y="367" width="280" height="87" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="46" cy="393" r="14" fill="#1d4ed8"/>
<text x="46" y="398.5" font-size="16" fill="#ffffff" font-weight="bold" text-anchor="middle">3</text>
<text x="70" y="393.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Đo lại</text>
<text x="70" y="417.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Cùng phép đo, so trước và</text>
<text x="70" y="436.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">sau.</text>
<polyline points="46,347 46,365" fill="none" stroke="#334155" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="20" y="476" width="280" height="87" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="46" cy="502" r="14" fill="#1d4ed8"/>
<text x="46" y="507.5" font-size="16" fill="#ffffff" font-weight="bold" text-anchor="middle">4</text>
<text x="70" y="502.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Ghi cái giá</text>
<text x="70" y="526.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Mỗi cách đổi lấy một thứ</text>
<text x="70" y="545.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">khác.</text>
<polyline points="46,456 46,474" fill="none" stroke="#334155" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="8" y="587" width="304" height="466" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="615.1" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Sáu cách, mỗi cách một</text>
<text x="20" y="637.2" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">khúc</text>
<rect x="20" y="654" width="280" height="83" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="677" r="11" fill="#16a34a"/>
<polyline points="37.9,677.4 41.7,681.4 48.5,673" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="680.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Chỉ mục: tìm trong cơ sở dữ</text>
<text x="64" y="699.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">liệu. Thử: 11 đến 13 ms còn</text>
<text x="64" y="719.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">1 đến 2 ms.</text>
<rect x="20" y="745" width="280" height="83" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="768" r="11" fill="#16a34a"/>
<polyline points="37.9,768.4 41.7,772.4 48.5,764" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="771.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Bộ nhớ đệm: khỏi tính lại.</text>
<text x="64" y="790.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Cân bằng tải: bớt hàng chờ ở</text>
<text x="64" y="810.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">một máy.</text>
<rect x="20" y="836" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="859" r="11" fill="#16a34a"/>
<polyline points="37.9,859.4 41.7,863.4 48.5,855" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="862.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">CDN: rút ngắn quãng đường</text>
<text x="64" y="881.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">tới người dùng.</text>
<rect x="20" y="907" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="930" r="11" fill="#16a34a"/>
<polyline points="37.9,930.4 41.7,934.4 48.5,926" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="933.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Bất đồng bộ: trả lời ngay,</text>
<text x="64" y="952.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">việc chậm làm sau.</text>
<rect x="20" y="978" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="1001" r="11" fill="#16a34a"/>
<polyline points="37.9,1001.4 41.7,1005.4 48.5,997" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="1004.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Nén: gói nhỏ lại. Thử: JSON</text>
<text x="64" y="1023.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">lặp nhiều còn khoảng 8%.</text>
<rect x="8" y="1065" width="304" height="302" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="1093.1" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Cái giá</text>
<rect x="20" y="1110" width="280" height="83" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="1133" r="11" fill="#16a34a"/>
<polyline points="37.9,1133.4 41.7,1137.4 48.5,1129" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="1136.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Chỉ mục: ghi chậm hơn</text>
<text x="64" y="1155.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">khoảng ba lần trong thử</text>
<text x="64" y="1175.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">nghiệm.</text>
<rect x="20" y="1201" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="1224" r="11" fill="#16a34a"/>
<polyline points="37.9,1224.4 41.7,1228.4 48.5,1220" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="1227.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Bộ nhớ đệm: có thể trả dữ</text>
<text x="64" y="1246.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">liệu cũ.</text>
<rect x="20" y="1272" width="280" height="83" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="1295" r="11" fill="#16a34a"/>
<polyline points="37.9,1295.4 41.7,1299.4 48.5,1291" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="1298.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Nén: tốn thời gian máy; dữ</text>
<text x="64" y="1317.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">liệu ngẫu nhiên không nhỏ</text>
<text x="64" y="1337.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">đi.</text>
</g>
</svg>
