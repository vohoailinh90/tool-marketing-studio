<svg xmlns="http://www.w3.org/2000/svg" width="320" height="962" viewBox="0 0 320 962" role="img" aria-labelledby="title desc">
<title id="title">CAP, BASE, SOLID, KISS</title>
<desc id="desc">Bốn khung. Khung một, CAP: khi mạng đứt phải chọn giữa trả lời đúng hoặc từ chối, và trả lời nhanh nhưng có thể cũ. Khung hai, mô phỏng hai bản sao khi mạng đứt: hệ thống ưu tiên đúng từ chối ba lượt đọc, hệ thống ưu tiên trả lời trả giá trị cũ ba lượt rồi hội tụ. Khung ba, BASE: sẵn sàng cơ bản, trạng thái mềm, nhất quán cuối cùng. Khung bốn, SOLID là năm nguyên tắc về mã; KISS là giữ cho đơn giản.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs>
<rect width="320" height="962" fill="#f8fafc"/>
<g font-family="DejaVu Sans, Arial, sans-serif" fill="#0f172a">
<text x="16" y="34" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">CAP, BASE, SOLID, KISS</text>
<text x="16" y="60.2" font-size="15" fill="#475569" font-weight="normal" text-anchor="start">Dữ liệu và mã, hai thế giới.</text>
<rect x="8" y="80" width="304" height="191" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="108.2" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">CAP: mạng đứt thì chọn</text>
<rect x="20" y="125" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="148" r="11" fill="#16a34a"/>
<polyline points="37.9,148.4 41.7,152.4 48.5,144" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="151.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Ưu tiên đúng: từ chối khi</text>
<text x="64" y="170.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">không chắc.</text>
<rect x="20" y="196" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="219" r="11" fill="#16a34a"/>
<polyline points="37.9,219.4 41.7,223.4 48.5,215" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="222.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Ưu tiên trả lời: có thể trả giá</text>
<text x="64" y="241.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">trị cũ.</text>
<rect x="8" y="283" width="304" height="262" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="311.2" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Mô phỏng hai bản sao</text>
<rect x="20" y="328" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="351" r="11" fill="#16a34a"/>
<polyline points="37.9,351.4 41.7,355.4 48.5,347" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="354.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Ưu tiên đúng: từ chối 3 lượt</text>
<text x="64" y="373.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">đọc.</text>
<rect x="20" y="399" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="422" r="11" fill="#16a34a"/>
<polyline points="37.9,422.4 41.7,426.4 48.5,418" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="425.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Ưu tiên trả lời: 3 lượt đọc trả</text>
<text x="64" y="444.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">giá trị cũ.</text>
<rect x="20" y="470" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="493" r="11" fill="#16a34a"/>
<polyline points="37.9,493.4 41.7,497.4 48.5,489" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="496.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Nối lại: cả hai cùng trả giá trị</text>
<text x="64" y="515.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">mới.</text>
<rect x="8" y="557" width="304" height="211" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="585.1" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">BASE</text>
<rect x="20" y="602" width="280" height="46" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="625" r="11" fill="#16a34a"/>
<polyline points="37.9,625.4 41.7,629.4 48.5,621" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="628.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Sẵn sàng cơ bản.</text>
<rect x="20" y="656" width="280" height="46" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="679" r="11" fill="#16a34a"/>
<polyline points="37.9,679.4 41.7,683.4 48.5,675" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="682.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Trạng thái mềm.</text>
<rect x="20" y="710" width="280" height="46" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="733" r="11" fill="#16a34a"/>
<polyline points="37.9,733.4 41.7,737.4 48.5,729" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="736.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Nhất quán cuối cùng.</text>
<rect x="8" y="780" width="304" height="174" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="808.1" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Về mã</text>
<rect x="20" y="825" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="848" r="11" fill="#16a34a"/>
<polyline points="37.9,848.4 41.7,852.4 48.5,844" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="851.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">SOLID: năm nguyên tắc thiết</text>
<text x="64" y="870.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">kế mã.</text>
<rect x="20" y="896" width="280" height="46" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="919" r="11" fill="#16a34a"/>
<polyline points="37.9,919.4 41.7,923.4 48.5,915" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="922.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">KISS: giữ cho đơn giản.</text>
</g>
</svg>
