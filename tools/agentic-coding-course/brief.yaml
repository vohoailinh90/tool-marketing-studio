  results. This campaign covers every lesson in chapters 1, 2 and 3, in curriculum order.
requirements:
- Exercises use invented data in a practice folder.
- Use only permitted tools and accounts; observe workplace rules.
- Tool-specific setup and pricing can change; consult current provider documentation.
