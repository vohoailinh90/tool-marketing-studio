<svg xmlns="http://www.w3.org/2000/svg" width="320" height="748" viewBox="0 0 320 748" role="img" aria-labelledby="title desc">
<title id="title">Cổng API của Uber qua ba thế hệ</title>
<desc id="desc">Ba bước. Thế hệ một, năm 2014: dịch vụ điều phối và dịch vụ API. Thế hệ hai: một cổng ôm hết, hơn 2.200 microservice năm 2019. Thế hệ ba, từ đầu năm 2018: tự phục vụ, phi tập trung, chia tầng, vì có nhiều mảng kinh doanh mới. Khung cuối nêu ba điều cần nhớ.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs>
<rect width="320" height="748" fill="#f8fafc"/>
<g font-family="DejaVu Sans, Arial, sans-serif" fill="#0f172a">
<text x="16" y="34" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">Cổng API của Uber qua</text>
<text x="16" y="58" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">ba thế hệ</text>
<text x="16" y="84.2" font-size="15" fill="#475569" font-weight="normal" text-anchor="start">Từ hai dịch vụ tới một lớp tự phục vụ.</text>
<rect x="8" y="104" width="304" height="362" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="132.2" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Ba thế hệ</text>
<rect x="20" y="149" width="280" height="87" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="46" cy="175" r="14" fill="#1d4ed8"/>
<text x="46" y="180.5" font-size="16" fill="#ffffff" font-weight="bold" text-anchor="middle">1</text>
<text x="70" y="175.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Tự lớn lên, 2014</text>
<text x="70" y="199.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Dịch vụ điều phối và dịch vụ</text>
<text x="70" y="218.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">API.</text>
<rect x="20" y="258" width="280" height="87" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="46" cy="284" r="14" fill="#1d4ed8"/>
<text x="46" y="289.5" font-size="16" fill="#ffffff" font-weight="bold" text-anchor="middle">2</text>
<text x="70" y="284.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Một cổng ôm hết</text>
<text x="70" y="308.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Hơn 2.200 microservice</text>
<text x="70" y="327.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">phía sau.</text>
<polyline points="46,238 46,256" fill="none" stroke="#334155" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="20" y="367" width="280" height="87" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="46" cy="393" r="14" fill="#1d4ed8"/>
<text x="46" y="398.5" font-size="16" fill="#ffffff" font-weight="bold" text-anchor="middle">3</text>
<text x="70" y="393.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Tự phục vụ, chia tầng</text>
<text x="70" y="417.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Nhiều mảng kinh doanh</text>
<text x="70" y="436.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">mới.</text>
<polyline points="46,347 46,365" fill="none" stroke="#334155" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="8" y="478" width="304" height="262" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="506.2" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Nhớ gì</text>
<rect x="20" y="523" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="546" r="11" fill="#16a34a"/>
<polyline points="37.9,546.4 41.7,550.4 48.5,542" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="549.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Điều phối nối người đi với tài</text>
<text x="64" y="568.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">xế.</text>
<rect x="20" y="594" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="617" r="11" fill="#16a34a"/>
<polyline points="37.9,617.4 41.7,621.4 48.5,613" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="620.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Thế hệ ba sinh ra từ các</text>
<text x="64" y="639.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">mảng mới.</text>
<rect x="20" y="665" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="688" r="11" fill="#16a34a"/>
<polyline points="37.9,688.4 41.7,692.4 48.5,684" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="691.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Nguồn không tả cổng làm</text>
<text x="64" y="710.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">việc thế nào.</text>
</g>
</svg>
