<svg xmlns="http://www.w3.org/2000/svg" width="320" height="661" viewBox="0 0 320 661" role="img" aria-labelledby="title desc">
<title id="title">Hai cách cắt dữ liệu</title>
<desc id="desc">Hai khung. Khung một, hai cách cắt một bảng: chiều dọc giữ mỗi nhóm cột ở một nơi, chiều ngang giữ mỗi nhóm hàng ở một nơi. Khung hai, chọn nơi cho một hàng: theo khoảng giá trị khóa hoặc theo băm khóa, với điều mỗi cách làm tốt và làm kém.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs>
<rect width="320" height="661" fill="#f8fafc"/>
<g font-family="DejaVu Sans, Arial, sans-serif" fill="#0f172a">
<text x="16" y="34" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">Hai cách cắt dữ liệu</text>
<text x="16" y="60.2" font-size="15" fill="#475569" font-weight="normal" text-anchor="start">Theo cột hay theo hàng.</text>
<rect x="8" y="80" width="304" height="245" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="108.2" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Cắt một bảng</text>
<rect x="20" y="125" width="280" height="87" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="50" cy="168.5" r="18" fill="#1d4ed8"/><g transform="translate(39.2 157.7) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5"/><path d="M8 3H3v5"/><path d="M12 22v-8.3a4 4 0 0 0-1.172-2.872L3 3"/><path d="m15 9 6-6"/></g>
<text x="78" y="151.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Theo cột</text>
<text x="78" y="175.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Mỗi nơi giữ một nhóm cột</text>
<text x="78" y="194.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">của mọi hàng.</text>
<rect x="20" y="226" width="280" height="87" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="50" cy="269.5" r="18" fill="#1d4ed8"/><g transform="translate(39.2 258.7) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5V19A9 3 0 0 0 21 19V5"/><path d="M3 12A9 3 0 0 0 21 12"/></g>
<text x="78" y="252.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Theo hàng</text>
<text x="78" y="276.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Mỗi mảnh giữ trọn một số</text>
<text x="78" y="295.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">hàng.</text>
<rect x="8" y="337" width="304" height="316" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="365.2" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Chọn mảnh cho một hàng</text>
<rect x="20" y="382" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="405" r="11" fill="#16a34a"/>
<polyline points="37.9,405.4 41.7,409.4 48.5,401" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="408.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Theo khoảng: truy vấn dải</text>
<text x="64" y="427.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">nhanh.</text>
<rect x="20" y="453" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="476" r="11" fill="#16a34a"/>
<polyline points="37.9,476.4 41.7,480.4 48.5,472" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="479.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Theo khoảng: khóa tăng dần</text>
<text x="64" y="498.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">dồn ghi vào một mảnh.</text>
<rect x="20" y="524" width="280" height="46" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="547" r="11" fill="#16a34a"/>
<polyline points="37.9,547.4 41.7,551.4 48.5,543" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="550.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Theo băm: dữ liệu rải đều.</text>
<rect x="20" y="578" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="601" r="11" fill="#16a34a"/>
<polyline points="37.9,601.4 41.7,605.4 48.5,597" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="604.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Theo băm: đổi số mảnh làm</text>
<text x="64" y="623.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">nhiều khóa chuyển chỗ.</text>
</g>
</svg>
