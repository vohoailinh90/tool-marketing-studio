  items:
  - Cách kết nối ứng dụng với API thu thập dữ liệu web tiên tiến
  - Tận dụng định dạng Markdown tối ưu hóa cho token của LLM
  - Cách xây dựng agent tự động tương tác trực tiếp với giao diện trang web
