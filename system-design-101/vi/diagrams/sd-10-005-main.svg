<svg xmlns="http://www.w3.org/2000/svg" width="320" height="1085" viewBox="0 0 320 1085" role="img" aria-labelledby="title desc">
<title id="title">Cây Java Collection</title>
<desc id="desc">Ba nhóm thẻ. Phần gốc: Iterable cho phép duyệt từng phần tử và Collection kế thừa nó. Ba nhánh chính của Collection: List, Set, Queue, mỗi nhánh có ví dụ lớp cài đặt. Khung cuối nhắc rằng Map nằm ngoài cây Collection.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs>
<rect width="320" height="1085" fill="#f8fafc"/>
<g font-family="DejaVu Sans, Arial, sans-serif" fill="#0f172a">
<text x="16" y="34" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">Cây Java Collection</text>
<text x="16" y="60.2" font-size="15" fill="#475569" font-weight="normal" text-anchor="start">Một gốc, ba nhánh chính.</text>
<rect x="8" y="80" width="304" height="303" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="108.2" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Phần gốc</text>
<rect x="20" y="125" width="280" height="107" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="50" cy="178.5" r="18" fill="#1d4ed8"/><g transform="translate(39.2 167.7) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="m7 22-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/></g>
<text x="78" y="151.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Iterable</text>
<text x="78" y="175.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Cho phép duyệt từng phần</text>
<text x="78" y="194.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">tử, kể cả bằng vòng lặp for</text>
<text x="78" y="214.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">nâng cao.</text>
<rect x="20" y="264" width="280" height="107" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="50" cy="317.5" r="18" fill="#1d4ed8"/><g transform="translate(39.2 306.7) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.97 12.92A2 2 0 0 0 2 14.63v3.24a2 2 0 0 0 .97 1.71l3 1.8a2 2 0 0 0 2.06 0L12 19v-5.5l-5-3-4.03 2.42Z"/><path d="m7 16.5-4.74-2.85"/><path d="m7 16.5 5-3"/><path d="M7 16.5v5.17"/><path d="M12 13.5V19l3.97 2.38a2 2 0 0 0 2.06 0l3-1.8a2 2 0 0 0 .97-1.71v-3.24a2 2 0 0 0-.97-1.71L17 10.5l-5 3Z"/><path d="m17 16.5-5-3"/><path d="m17 16.5 4.74-2.85"/><path d="M17 16.5v5.17"/><path d="M7.97 4.42A2 2 0 0 0 7 6.13v4.37l5 3 5-3V6.13a2 2 0 0 0-.97-1.71l-3-1.8a2 2 0 0 0-2.06 0l-3 1.8Z"/><path d="M12 8 7.26 5.15"/><path d="m12 8 4.74-2.85"/><path d="M12 13.5V8"/></g>
<text x="78" y="290.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Collection</text>
<text x="78" y="314.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Khai báo thêm, xóa, hỏi</text>
<text x="78" y="333.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">phần tử; thêm và xóa là</text>
<text x="78" y="353.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">tùy chọn.</text>
<polyline points="160,234 160,262" fill="none" stroke="#334155" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="8" y="395" width="304" height="408" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="423.2" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Ba nhánh chính của</text>
<text x="20" y="445.3" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Collection</text>
<rect x="20" y="462" width="280" height="107" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
<circle cx="50" cy="515.5" r="18" fill="#0f766e"/><g transform="translate(39.2 504.7) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5h10"/><path d="M11 12h10"/><path d="M11 19h10"/><path d="M4 4h1v5"/><path d="M4 9h2"/><path d="M6.5 20H3.4c0-1 2.6-1.925 2.6-3.5a1.5 1.5 0 0 0-2.6-1.02"/></g>
<text x="78" y="488.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">List</text>
<text x="78" y="512.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Có thứ tự theo vị trí,</text>
<text x="78" y="531.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">thường cho phép trùng. Ví</text>
<text x="78" y="551.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">dụ: ArrayList, LinkedList.</text>
<rect x="20" y="583" width="280" height="87" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
<circle cx="50" cy="626.5" r="18" fill="#0f766e"/><g transform="translate(39.2 615.7) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m18 14 4 4-4 4"/><path d="m18 2 4 4-4 4"/><path d="M2 18h1.973a4 4 0 0 0 3.3-1.7l5.454-8.6a4 4 0 0 1 3.3-1.7H22"/><path d="M2 6h1.972a4 4 0 0 1 3.6 2.2"/><path d="M22 18h-6.041a4 4 0 0 1-3.3-1.8l-.359-.45"/></g>
<text x="78" y="609.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Set</text>
<text x="78" y="633.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Không chứa phần tử trùng.</text>
<text x="78" y="652.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Ví dụ: HashSet, TreeSet.</text>
<rect x="20" y="684" width="280" height="107" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
<circle cx="50" cy="737.5" r="18" fill="#0f766e"/><g transform="translate(39.2 726.7) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></g>
<text x="78" y="710.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Queue</text>
<text x="78" y="734.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Giữ phần tử chờ xử lý. Ví</text>
<text x="78" y="753.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">dụ: PriorityQueue,</text>
<text x="78" y="773.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">ArrayDeque.</text>
<rect x="8" y="815" width="304" height="262" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="843.1" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Nhớ gì</text>
<rect x="20" y="860" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="883" r="11" fill="#16a34a"/>
<polyline points="37.9,883.4 41.7,887.4 48.5,879" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="886.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Map nằm ngoài cây</text>
<text x="64" y="905.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Collection.</text>
<rect x="20" y="931" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="954" r="11" fill="#16a34a"/>
<polyline points="37.9,954.4 41.7,958.4 48.5,950" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="957.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Đọc tài liệu của lớp cụ thể,</text>
<text x="64" y="976.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">không chỉ tên interface.</text>
<rect x="20" y="1002" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="1025" r="11" fill="#16a34a"/>
<polyline points="37.9,1025.4 41.7,1029.4 48.5,1021" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="1028.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Hình là bản rút gọn của cây</text>
<text x="64" y="1047.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">thật.</text>
</g>
</svg>
