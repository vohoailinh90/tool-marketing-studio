<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 1210" width="320" height="1210" role="img" aria-labelledby="title desc">
<title id="title">Luồng unary gRPC: đơn hàng tới thanh toán</title>
<desc id="desc">Chuẩn bị định nghĩa proto và sinh mã. Khách gửi JSON tới đơn hàng; đơn hàng gọi stub, mã hóa request message và gửi HTTP/2. Server giải mã, gọi hàm thanh toán, tạo response và gửi về; client giải mã và trả kết quả. Message được gửi qua mạng, không phải stub.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#475569" stroke-width="1.5"/></marker></defs>
<rect width="320" height="1210" fill="#f8fafc"/>
<g font-family="DejaVu Sans, Arial, sans-serif" fill="#0f172a">
<text x="16" y="30" font-size="21" font-weight="bold">gRPC: ĐƠN HÀNG</text>
<text x="16" y="54" font-size="21" font-weight="bold">→ THANH TOÁN</text>
<rect x="16" y="70" width="288" height="78" rx="10" fill="#fef3c7"/>
<text x="30" y="98" font-size="16" font-weight="bold">Chuẩn bị: .proto → sinh mã</text>
<text x="30" y="123" font-size="16" font-weight="normal">Stub client + mã phía server</text>
<rect x="16" y="153" width="288" height="96" rx="12" fill="#dbeafe" stroke="#94a3b8"/>
<text x="29" y="186" font-size="16" font-weight="bold">1 · Khách → đơn hàng</text>
<text x="29" y="219" font-size="16" font-weight="normal">REST / JSON (ví dụ)</text>
<line x1="160" y1="250" x2="160" y2="280" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="16" y="283" width="288" height="96" rx="12" fill="#ede9fe" stroke="#94a3b8"/>
<text x="29" y="316" font-size="16" font-weight="bold">2 · Đơn hàng gọi stub</text>
<text x="29" y="349" font-size="16" font-weight="normal">Pay(request)</text>
<line x1="160" y1="380" x2="160" y2="410" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="16" y="413" width="288" height="96" rx="12" fill="#ede9fe" stroke="#94a3b8"/>
<text x="29" y="446" font-size="16" font-weight="bold">3 · Mã hóa request message</text>
<text x="29" y="479" font-size="16" font-weight="normal">Protocol Buffers → bytes</text>
<line x1="160" y1="510" x2="160" y2="540" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="16" y="543" width="288" height="96" rx="12" fill="#e2e8f0" stroke="#94a3b8"/>
<text x="29" y="576" font-size="16" font-weight="bold">4 · Request qua mạng</text>
<text x="29" y="609" font-size="16" font-weight="normal">HTTP/2</text>
<line x1="160" y1="640" x2="160" y2="670" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="16" y="673" width="288" height="96" rx="12" fill="#dcfce7" stroke="#94a3b8"/>
<text x="29" y="706" font-size="16" font-weight="bold">5 · gRPC server giải mã</text>
<text x="29" y="739" font-size="16" font-weight="normal">Gọi hàm thanh toán</text>
<line x1="160" y1="770" x2="160" y2="800" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="16" y="803" width="288" height="96" rx="12" fill="#dcfce7" stroke="#94a3b8"/>
<text x="29" y="836" font-size="16" font-weight="bold">6 · Thanh toán xử lý</text>
<text x="29" y="869" font-size="16" font-weight="normal">Tạo response</text>
<line x1="160" y1="900" x2="160" y2="930" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="16" y="933" width="288" height="96" rx="12" fill="#e2e8f0" stroke="#94a3b8"/>
<text x="29" y="966" font-size="16" font-weight="bold">7 · Trả response qua mạng</text>
<text x="29" y="999" font-size="16" font-weight="normal">HTTP/2 → client giải mã</text>
<line x1="160" y1="1030" x2="160" y2="1060" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="16" y="1063" width="288" height="96" rx="12" fill="#dbeafe" stroke="#94a3b8"/>
<text x="29" y="1096" font-size="16" font-weight="bold">8 · Đơn hàng trả kết quả</text>
<text x="29" y="1129" font-size="16" font-weight="normal">JSON → khách (ví dụ)</text>
<text x="16" y="1200" font-size="16" font-weight="normal">Unary: một request, một response.</text>
</g></svg>
