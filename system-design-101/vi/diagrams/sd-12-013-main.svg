<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 864" width="320" height="864" role="img" aria-labelledby="title desc">
<title id="title">Gửi tin nhắn 1–1</title>
<desc id="desc">Alice nối WebSocket. Tin tới chat service A, được cấp ID duy nhất, lưu bền, vào hàng đợi đồng bộ. Hệ thống hỏi hiện diện của Bob: nếu trực tuyến thì qua chat service B và WebSocket, nếu không thì qua máy chủ thông báo đẩy.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#475569" stroke-width="1.5"/></marker></defs>
<rect width="320" height="864" fill="#f8fafc"/>
<g font-family="DejaVu Sans, Arial, sans-serif" fill="#0f172a">
<text x="16" y="30" font-size="21" font-weight="bold">GỬI TIN 1–1</text>
<rect x="16" y="46" width="288" height="92" rx="12" fill="#dbeafe" stroke="#94a3b8"/>
<text x="29" y="75" font-size="16" font-weight="bold">0 · Alice đăng nhập</text>
<text x="29" y="99" font-size="16" font-weight="normal">WebSocket; báo hiện diện cho</text>
<text x="29" y="123" font-size="16" font-weight="normal">bạn bè</text>
<line x1="160" y1="139" x2="160" y2="165" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="16" y="168" width="288" height="68" rx="12" fill="#dbeafe" stroke="#94a3b8"/>
<text x="29" y="197" font-size="16" font-weight="bold">1 · Alice gửi tin cho Bob</text>
<text x="29" y="221" font-size="16" font-weight="normal">Tới chat service A</text>
<line x1="160" y1="237" x2="160" y2="263" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="16" y="266" width="288" height="68" rx="12" fill="#ede9fe" stroke="#94a3b8"/>
<text x="29" y="295" font-size="16" font-weight="bold">2 · Cấp ID duy nhất</text>
<text x="29" y="319" font-size="16" font-weight="normal">Để sắp thứ tự</text>
<line x1="160" y1="335" x2="160" y2="361" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="16" y="364" width="288" height="68" rx="12" fill="#dcfce7" stroke="#94a3b8"/>
<text x="29" y="393" font-size="16" font-weight="bold">3 · Lưu bền</text>
<text x="29" y="417" font-size="16" font-weight="normal">Kho tin nhắn</text>
<line x1="160" y1="433" x2="160" y2="459" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="16" y="462" width="288" height="68" rx="12" fill="#e2e8f0" stroke="#94a3b8"/>
<text x="29" y="491" font-size="16" font-weight="bold">4 · Hàng đợi đồng bộ</text>
<text x="29" y="515" font-size="16" font-weight="normal">Chuyển tin tới phía Bob</text>
<line x1="160" y1="531" x2="160" y2="557" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="16" y="560" width="288" height="68" rx="12" fill="#fef3c7" stroke="#94a3b8"/>
<text x="29" y="589" font-size="16" font-weight="bold">5 · Bob có trực tuyến không?</text>
<text x="29" y="613" font-size="16" font-weight="normal">Hỏi dịch vụ hiện diện</text>
<line x1="160" y1="629" x2="160" y2="655" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="16" y="658" width="288" height="68" rx="12" fill="#dcfce7" stroke="#94a3b8"/>
<text x="29" y="687" font-size="16" font-weight="bold">6a · Có: chat service B</text>
<text x="29" y="711" font-size="16" font-weight="normal">Đẩy qua WebSocket tới Bob</text>
<line x1="160" y1="727" x2="160" y2="753" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="16" y="756" width="288" height="68" rx="12" fill="#ffe4e6" stroke="#94a3b8"/>
<text x="29" y="785" font-size="16" font-weight="bold">6b · Không: thông báo đẩy</text>
<text x="29" y="809" font-size="16" font-weight="normal">Máy chủ push báo tới thiết bị</text>
<text x="16" y="852" font-size="16" font-weight="normal">Lưu trước, rồi mới phân phối.</text>
</g></svg>
