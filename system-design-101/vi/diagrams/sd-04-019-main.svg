<text x="70" y="653.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Ghi 200 lần</text>
<text x="70" y="677.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Sửa 20 đơn hàng 200 lần</text>
<text x="70" y="696.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">trên PostgreSQL 16.</text>
<rect x="20" y="736" width="280" height="107" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
