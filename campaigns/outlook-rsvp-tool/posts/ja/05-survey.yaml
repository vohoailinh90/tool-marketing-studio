id: 05-survey
status: draft
format: portrait
series: "幹事の業務効率化 · #5"
link: survey
slides:
  - layout: cover
    emoji: "📋"
    eyebrow: "3分だけ、お願いします"
    title: "幹事の**やり方を教えてください**"
    subtitle: "ログイン不要の短いアンケートです。"

  - layout: pains
    tone: accent
    title: "知りたいこと"
    items:
      - {emoji: "❓", text: "幹事を**どれくらいの頻度で**していますか？"}
      - {emoji: "❓", text: "いちばん**時間がかかる作業**は？"}
      - {emoji: "❓", text: "今は**どんな道具**を使っていますか？"}
      - {emoji: "❓", text: "こうしたツールに、あなたや会社は**いくらなら払えますか**？"}

  - layout: checklist
    title: "回答いただいた方へ"
    items:
      - "**試用版を優先的に**ご案内します"
      - "**アンケート結果のまとめ**（匿名）をお送りします"
      - "次に作る機能に直接ご意見をいただけます"

  - layout: cta
    emoji: "👇"
    title: "アンケートに答える"
    text: "所要時間は約3分です。ご協力ありがとうございます🙏"
    button: "アンケートを開く"

platforms:
  facebook:
    caption: |
      3分だけ、お時間をいただけませんか🙏

      Outlook RSVP Tool にさらに時間をかける前に、幹事のみなさんが実際どうやっているのか、どこが一番大変なのか、そしてこうしたツールにお金を払う価値があるのか（個人として、または会社として）を知りたいと思っています。

      ログイン不要の短いアンケートです。回答いただいた方には、試用版を優先的にご案内し、結果のまとめ（匿名）をお送りします。

      リンクは最初のコメントにあります👇 よろしくお願いします！
    first_comment: |
      📋 3分のアンケート：{link}
    hashtags: [アンケート, 幹事, Outlook, 業務効率化]
