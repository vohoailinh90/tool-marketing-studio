id: 01-pain
status: draft
format: portrait
series: "海外会議の日程調整 · #1"
link: ~
slides:
  - layout: cover
    emoji: "🌏"
    eyebrow: "海外拠点との定例会議"
    title: "3か国・10人の\n**会議時間**、\nなかなか決まらない\nことはありませんか？"
    subtitle: "予定が埋まっているからではなく、\n**勤務時間がほとんど重ならない**からです。"
    badge: "最後までご覧ください 👉"

  - layout: chat
    title: "こんなやり取り、心当たりはありませんか？"
    group: "海外プロジェクト定例"
    messages:
      - {from: "田中", text: "日本時間で18時までなら大丈夫です"}
      - {from: "Petr（プラハ）", text: "こちらは朝9時から始業です"}
      - {from: "Mai（ホーチミン）", text: "火曜と木曜は予定が埋まっています"}
      - {me: true, text: "お待ちください、各国の時間に直してみます…"}
      - {from: "田中", text: "では16時で…と言いたいのですが、どこの16時でしょう？"}
    note: "イメージ用のやり取りで、実在の会話ではありません。"

  - layout: table
    title: "各地の勤務時間 09:00–18:00 を日本時間に直すと（冬）"
    columns: ["拠点", "勤務時間（日本時間）"]
    rows:
      - ["東京", "09:00 – 18:00"]
      - ["ホーチミン", "11:00 – 20:00"]
      - ["プラハ", "17:00 – 02:00（翌日）"]
      - [{text: "3拠点が同時に勤務", tone: ok}, {text: "17:00 – 18:00", tone: ok}]
    style: app
    note: "通常の勤務時間から計算した例です。予定は何も入っていない前提です。"

  - layout: stat
    eyebrow: "共通の時間は？"
    value: "1時間"
    label: "東京・ホーチミン・プラハが同時に勤務しているのは、1日にこれだけです"
    caption: "90分の会議は組めません。さらにアメリカのメンバーが加わると、共通の時間はなくなります。"

  - layout: pains
    title: "実はここからが大変です"
    items:
      - {emoji: "🌙", text: "全員が収まらない時、**誰が不便な時間を担う**？"}
      - {emoji: "🔢", text: "時差の換算ミスで、**全員の予定がずれる**"}
      - {emoji: "👀", text: "社外のメンバーは**予定が見えず**、推測になる"}
      - {emoji: "🎌", text: "**祝日**は国ごとに違う"}

  - layout: poll
    eyebrow: "ちょっとだけ教えてください"
    question: "海外メンバーとの会議時間は、\nどう決めていますか？"
    options:
      - "いちばん動ける人が合わせる"
      - "拠点で持ち回りにする"
      - "日程調整ツールを使う"
      - "時間をずらし、録画で共有する"

  - layout: cta
    emoji: "💬"
    title: "この課題のために、\n小さなツールを試作中です"
    text: "公開はまだ先で、まずは皆さんの工夫を伺いたいと思っています。コメントで教えていただけませんか？"
    show_link: false

platforms:
  facebook:
    caption: |
      海外拠点との会議、いちばん大変なのは「予定が合わないこと」ではなく、勤務時間が重ならないことかもしれません 🌏

      例えば東京・ホーチミン・プラハが、それぞれ09:00–18:00で働いているとします。冬の間、3拠点が同時に勤務しているのは1日に1時間だけです（日本時間17:00＝プラハ09:00）。90分の会議は組めません。アメリカのメンバーが加わると、共通の時間はなくなります。

      （勤務時間から計算した例で、予定は空という前提です。実際にはそこに予定や祝日が加わります。）

      この課題のために小さなツールを試作していますが、公開はまだ先の話です。まずは皆さんの工夫を伺えればと思います。海外メンバーとの会議時間は、どう決めていますか？ A / B / C / D でコメントいただけるとうれしいです 👇
    first_comment: |
      A. いちばん動ける人が合わせる ・ B. 拠点で持ち回り ・ C. 日程調整ツールを使う ・ D. ずらして録画で共有
    hashtags: [海外会議, 日程調整, 時差, 業務効率化, 働き方]
