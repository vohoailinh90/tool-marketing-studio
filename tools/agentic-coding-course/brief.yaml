claims:
- id: chatbot-to-agent
  text: 'Agentic coding: agent làm các bước, bạn quyết định làm gì và thế nào là đạt.'
  key_points:
  - icon: 💬
    name: Chatbot trả lời
    caption: AI nghĩ, còn bạn tự làm từng bước
  - icon: 🤖
    name: AI agent hành động
    caption: Nhận một mục tiêu rồi tự làm các bước
  - icon: ❓
    name: 'Hỏi: ai làm các bước?'
    caption: Một câu hỏi phân biệt mọi loại AI
  - icon: ✅
    name: Bạn chỉ đạo và nghiệm thu
    caption: Giao việc rõ ràng, kiểm tra kết quả
  lesson_notes_vi: '- Chatbot **trả lời**; AI agent **hành động** để đạt mục tiêu.

    - Câu hỏi phân biệt: **ai thực hiện các bước?**

    - Agentic coding = làm phần mềm cùng AI agent: agent làm các bước, **bạn giao việc và kiểm
    tra kết quả**.


    <!-- section: quiz -->'
  evidence:
  - course/vi/lessons/chatbot-to-agent.md
  - course/data/diagrams/chatbot-to-agent-recap.yaml
  - course/data/curriculum.yaml
  verified: true
- id: agent-parts-and-loop
  text: Agent tự sửa lỗi được đến đâu tùy vào công cụ, quyền hạn và phản hồi mà nó nhận được.
  key_points:
  - icon: 🧠
    name: 'Bộ não: LLM'
    caption: Hiểu yêu cầu, chọn bước tiếp theo
  - icon: 🔧
    name: 'Đôi tay: công cụ'
    caption: Đọc, ghi file, chạy lệnh — trong phạm vi được phép
  - icon: 🔁
    name: Vòng lặp
    caption: Suy nghĩ → hành động → quan sát, rồi lặp lại
  - icon: 🛑
    name: Biết lúc dừng
    caption: Khi xong việc, hoặc cần bạn quyết định
  lesson_notes_vi: '- Agent = **LLM** (bộ não) + **công cụ** (đôi tay) + **vòng lặp** suy nghĩ
    → hành động → quan sát.

    - Vòng lặp dừng khi xong việc, hoặc khi cần bạn quyết định.

    - Agent tự sửa lỗi được đến đâu tùy vào công cụ, quyền hạn và phản hồi — bước kiểm tra cuối
    cùng vẫn là của bạn.


    <!-- section: quiz -->'
  evidence:
  - course/vi/lessons/agent-parts-and-loop.md
  - course/data/diagrams/agent-parts-and-loop-recap.yaml
  - course/data/curriculum.yaml
  verified: true
- id: watch-an-agent-build
  text: Quan sát agent làm việc giúp bạn học cách giám sát bằng tình huống cụ thể.
  key_points:
  - icon: 🔮
    name: Đoán trước từng bước
    caption: Đoán sai là dấu hiệu cần hỏi lại
  - icon: 🔁
    name: Làm – chạy – xem – sửa
    caption: Vòng lặp agent trong thực tế
  - icon: 📋
    name: Tiêu chí rõ ràng
    caption: Agent kiểm tra được vì bạn đã nói "thế nào là xong"
  - icon: ✅
    name: Bạn nghiệm thu
    caption: Tự mở, tự bấm, tự so với tiêu chí
  lesson_notes_vi: '- Một phiên làm việc của agent: đọc mục tiêu → xem thư mục → tạo file →
    chạy và kiểm tra → sửa → báo cáo.

    - Xem có chủ đích: đoán trước từng bước; đoán sai là dấu hiệu nên hỏi lại.

    - Agent kiểm tra được vì bạn đã nói *thế nào là xong*; tiêu chí càng rõ, nó kiểm tra càng
    kỹ.

    - Agent báo "xong" chưa phải là xong: bạn tự mở, tự bấm, tự so với tiêu chí.


    <!-- section: quiz -->'
  evidence:
  - course/vi/lessons/watch-an-agent-build.md
  - course/data/diagrams/watch-an-agent-build-recap.yaml
  - course/data/curriculum.yaml
  verified: true
- id: choose-your-learning-setup
  text: Chọn đường hợp với máy và quy định của bạn — rồi bắt đầu.
  key_points:
  - icon: 💻
    name: Máy cá nhân là đường chính
    caption: Ứng dụng agent + thư mục ai-practice
  - icon: ☁️
    name: 'Trình duyệt: không cần cài'
    caption: File nằm trong kho code trên mạng
  - icon: 🏢
    name: 'Máy công ty: hỏi trước'
    caption: Không cài lén, không lách quy định
  - icon: 📁
    name: Một thư mục ai-practice
    caption: Cho mọi bài tập, chỉ dữ liệu giả
  - icon: 👀
    name: Chưa sẵn sàng? Xem trước
    caption: Đọc nhật ký phiên làm việc và đoán
  lesson_notes_vi: '- Ba đường thực hành: **máy cá nhân** (đường chính), **trình duyệt** (không
    cần cài, file nằm trên mạng), **máy công ty** (chỉ khi được phép).

    - Máy công ty: chỉ công cụ được duyệt; không cài lén, không lách quy định, không đưa dữ
    liệu công ty vào tài khoản cá nhân.

    - Mọi bài tập diễn ra trong thư mục `ai-practice`, chỉ với dữ liệu giả.

    - Chưa sẵn sàng cài đặt? Học theo đường chỉ xem trước.


    <!-- section: quiz -->'
  evidence:
  - course/vi/lessons/choose-your-learning-setup.md
  - course/data/diagrams/choose-your-learning-setup-recap.yaml
  - course/data/curriculum.yaml
  verified: true
- id: data-safety-and-permissions
  text: Thư mục là ranh giới bạn vẽ; quyền hạn và sự chú ý của bạn mới giữ được nó.
  key_points:
  - icon: ✅
    name: Việc an toàn
    caption: Trong ai-practice, với dữ liệu giả
  - icon: ✋
    name: Việc phải hỏi
    caption: Cài, xóa, gửi, ra ngoài thư mục
  - icon: ⛔
    name: Không bao giờ
    caption: Dữ liệu thật, mật khẩu, lách quy định
  - icon: 🔐
    name: Đọc rồi mới cho phép
    caption: Bắt đầu ở chế độ agent hỏi trước
  lesson_notes_vi: '- ✅ An toàn: trong `ai-practice`, với dữ liệu giả — agent cứ làm, rồi báo
    cáo.

    - ✋ Hỏi trước: cài, xóa, gửi, ra ngoài thư mục, lệnh bạn không hiểu. Chưa chắc thì xếp vào
    đây.

    - ⛔ Không bao giờ: dữ liệu thật của công ty và khách hàng, mật khẩu và API key, lách quy
    định.

    - Thư mục là ranh giới; quyền hạn và việc bạn đọc kỹ trước khi cho phép mới giữ được nó.


    <!-- section: quiz -->'
  evidence:
  - course/vi/lessons/data-safety-and-permissions.md
  - course/data/diagrams/data-safety-and-permissions-recap.yaml
  - course/data/curriculum.yaml
  verified: true
- id: first-agent-session
  text: Thẻ "Việc của tôi trong tuần" sẽ còn đi cùng bạn ở các bài sau.
  key_points:
  - icon: 📋
    name: Yêu cầu có tiêu chí
    caption: Việc cần làm và thế nào là xong
  - icon: 🔐
    name: Chế độ hỏi trước
    caption: Đọc từng thay đổi rồi mới chấp nhận
  - icon: 🗣️
    name: Nói rõ chỗ sai
    caption: Mình làm gì, thấy gì, mong đợi gì
  - icon: ✅
    name: Tự nghiệm thu, ghi bằng chứng
    caption: Ba dòng cho sản phẩm đầu tiên
  lesson_notes_vi: '- Một buổi làm việc: mở đúng chỗ → dán yêu cầu có tiêu chí → theo dõi và
    duyệt → tự nghiệm thu → ghi bằng chứng.

    - Khi mới học, chọn chế độ agent hỏi trước và đọc từng thay đổi rồi mới chấp nhận.

    - Chưa đạt? Nói rõ mình đã làm gì, thấy gì, mong đợi gì.

    - Buổi đầu thành công khi **bạn** kiểm tra được kết quả, không phải khi agent báo xong.


    <!-- section: quiz -->'
  evidence:
  - course/vi/lessons/first-agent-session.md
  - course/data/diagrams/first-agent-session-recap.yaml
  - course/data/curriculum.yaml
  verified: true
- id: how-to-learn-this-course
  text: Nhật ký học là bằng chứng rằng bạn đang tiến bộ.
  key_points:
  - icon: ⭐
    name: Bắt đầu từ lộ trình tối thiểu
    caption: Các bài có dấu ⭐ trên trang chính
  - icon: 📓
    name: Ghi nhật ký mỗi buổi
    caption: Sản phẩm, bằng chứng, một câu hỏi
  - icon: ❓
    name: Giữ một câu hỏi còn mở
    caption: Mang theo sang buổi sau
  - icon: 🌱
    name: Lỡ một tuần không sao
    caption: Mở nhật ký, học tiếp từ đó
  lesson_notes_vi: '- Không chắc nên học gì? Bắt đầu từ lộ trình tối thiểu — các bài có dấu
    ⭐.

    - Sau mỗi buổi: sản phẩm, ba dòng bằng chứng, một câu hỏi còn mở.

    - Câu hỏi còn mở là điểm bắt đầu của buổi sau.

    - Lỡ một tuần không sao: mở nhật ký và học tiếp.


    <!-- section: quiz -->'
  evidence:
  - course/vi/lessons/how-to-learn-this-course.md
  - course/data/diagrams/how-to-learn-this-course-recap.yaml
  - course/data/curriculum.yaml
  verified: true
- id: lead-not-typist
  text: Càng ít gõ, bạn càng cần nghĩ rõ và kiểm tra kỹ.
  key_points:
  - icon: 🎯
    name: Mục tiêu và lý do
    caption: Làm gì, cho ai, để làm gì
  - icon: ✅
    name: Thế nào là xong
    caption: Tiêu chí kiểm tra được
  - icon: 🚧
    name: Ranh giới
    caption: An toàn, hỏi trước, không bao giờ
  - icon: 🔍
    name: Kiểm tra ở điểm then chốt
    caption: Mục tiêu, thay đổi, kết quả
  - icon: 🙋
    name: Chịu trách nhiệm kết quả
    caption: Agent làm, bạn ký tên
  lesson_notes_vi: '- Khi làm cùng agent, bạn chuyển từ người gõ code sang trưởng nhóm.

    - Năm việc: mục tiêu và lý do, thế nào là xong, ranh giới, kiểm tra ở điểm then chốt, chịu
    trách nhiệm kết quả.

    - Yêu cầu tốt nói về kết quả và cách kiểm tra, không chỉ về đoạn code.

    - Càng ít gõ, càng cần nghĩ rõ và kiểm tra kỹ.


    <!-- section: quiz -->'
  evidence:
  - course/vi/lessons/lead-not-typist.md
  - course/data/diagrams/lead-not-typist-recap.yaml
  - course/data/curriculum.yaml
  verified: true
- id: writing-good-specs
  text: Yêu cầu càng rõ, bạn càng ít phải sửa.
  key_points:
  - icon: 🎯
    name: Mục tiêu và lý do
    caption: Làm gì, cho ai, để làm gì
  - icon: 🗂️
    name: Chỉ đúng chỗ
    caption: Tên file, dữ liệu, ví dụ mẫu
  - icon: 🚧
    name: Nói điều không được làm
    caption: Không sửa file gốc, không cài thêm
  - icon: ✅
    name: Tiêu chí đo được
    caption: Con số, hành vi — không "đẹp" chung chung
  - icon: 🔁
    name: Nhờ agent nhắc lại
    caption: Và hỏi trước nếu chưa rõ
  lesson_notes_vi: '- Spec = **mục tiêu** + **bối cảnh** + **ràng buộc** + **tiêu chí nghiệm
    thu**.

    - Tiêu chí tốt là tiêu chí người khác tự kiểm tra được: con số, hành vi, không phải "đẹp"
    hay "nhanh" chung chung.

    - Kết thúc spec bằng: nhắc lại mục tiêu và tiêu chí, hỏi trước nếu chưa rõ.

    - Học được điều mới khi nghiệm thu? Thêm nó vào tiêu chí.


    <!-- section: quiz -->'
  evidence:
  - course/vi/lessons/writing-good-specs.md
  - course/data/diagrams/writing-good-specs-recap.yaml
  - course/data/curriculum.yaml
  verified: true
- id: explore-plan-build-verify
  text: Vài phút tìm hiểu và lên kế hoạch tránh được cả buổi làm sai hướng.
  key_points:
  - icon: 🔍
    name: Tìm hiểu trước
    caption: Agent đọc và giải thích, chưa sửa gì
  - icon: 🗺️
    name: Đọc kỹ kế hoạch
    caption: File nào đổi, quyết định nào là của bạn
  - icon: 🛠️
    name: Làm theo kế hoạch
    caption: Lệch kế hoạch thì dừng lại hỏi
  - icon: ✅
    name: Kiểm chứng rồi mới nhận
    caption: So với tiêu chí, từng điều một
  - icon: ✂️
    name: Việc nhỏ thì bỏ qua kế hoạch
    caption: Tả được thay đổi trong một câu
  lesson_notes_vi: '- Bốn bước: tìm hiểu (chỉ đọc) → lập kế hoạch (bạn duyệt) → thực hiện →
    kiểm chứng.

    - Đọc kế hoạch với ba câu hỏi: file nào đổi, có gì mới thêm vào, quyết định nào là của bạn.

    - Tả được thay đổi trong một câu? Bỏ qua kế hoạch, giao thẳng.

    - Có điều mới khi kiểm chứng? Quay lại tìm hiểu.


    <!-- section: quiz -->'
  evidence:
  - course/vi/lessons/explore-plan-build-verify.md
  - course/data/diagrams/explore-plan-build-verify-recap.yaml
  - course/data/curriculum.yaml
  verified: true
- id: files-folders-paths
  text: Agent nói chuyện bằng đường dẫn — giờ bạn đọc được chúng.
  key_points:
  - icon: 📄
    name: File có tên và đuôi
    caption: .html, .csv, .txt cho biết mở bằng gì
  - icon: 📁
    name: Thư mục lồng nhau
    caption: Như một cái cây
  - icon: 🧭
    name: Đường dẫn là địa chỉ
    caption: Từ gốc đến file
  - icon: 🔗
    name: Đường dẫn tương đối
    caption: Tính từ nơi đang đứng; .. là lên một cấp
  - icon: 🚧
    name: Nhìn đường dẫn trước khi cho phép
    caption: Ra ngoài ai-practice thì hỏi lại
  lesson_notes_vi: '- File có tên và đuôi; thư mục chứa file và thư mục khác, như một cái cây.

    - Đường dẫn là địa chỉ từ gốc đến file: `\` trên Windows, `/` trên Mac.

    - Đường dẫn tương đối tính từ nơi đang đứng; `..` là lên một cấp.

    - Trước khi cho phép, nhìn đường dẫn: ra ngoài `ai-practice` thì hỏi lại vì sao.


    <!-- section: quiz -->'
  evidence:
  - course/vi/lessons/files-folders-paths.md
  - course/data/diagrams/files-folders-paths-recap.yaml
  - course/data/curriculum.yaml
  verified: true
- id: reviewing-agent-changes
  text: Không cần hiểu từng dòng code mới review được — cần biết nhìn vào đâu.
  key_points:
  - icon: 📂
    name: File nào đổi?
    caption: Có đúng file bạn nghĩ không
  - icon: 📏
    name: To hay nhỏ?
    caption: Việc nhỏ mà diff to là lạ
  - icon: 🔎
    name: Đọc phần bạn hiểu
    caption: Chữ, số, tên hiển thị
  - icon: 🚩
    name: Tìm dấu hiệu lạ
