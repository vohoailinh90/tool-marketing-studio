<svg xmlns="http://www.w3.org/2000/svg" width="320" height="1690" viewBox="0 0 320 1690" role="img" aria-labelledby="title desc">
<title id="title">SapFix: máy đề xuất bản sửa, người quyết định</title>
<desc id="desc">Ba khung. Khung một: bốn bước từ lúc lập trình viên gửi thay đổi, SapFix chạy ca kiểm thử, phát hiện crash và sinh bản sửa. Khung hai: bốn loại bản sửa là theo mẫu, đột biến, hoàn tác toàn bộ và hoàn tác một phần. Khung ba: kiểm thử bản vá, gửi người duyệt, người duyệt chấp nhận hoặc bỏ. Khung cuối nêu các con số của đợt thử.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs>
<rect width="320" height="1690" fill="#f8fafc"/>
<g font-family="DejaVu Sans, Arial, sans-serif" fill="#0f172a">
<text x="16" y="34" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">SapFix: máy đề xuất bản</text>
<text x="16" y="58" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">sửa, người quyết định</text>
<text x="16" y="84.2" font-size="15" fill="#475569" font-weight="normal" text-anchor="start">Từ một thay đổi gây lỗi tới bản vá</text>
<text x="16" y="103.8" font-size="15" fill="#475569" font-weight="normal" text-anchor="start">chờ duyệt.</text>
<rect x="8" y="123" width="304" height="452" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="151.2" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Phát hiện lỗi</text>
<rect x="20" y="168" width="280" height="87" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="46" cy="194" r="14" fill="#1d4ed8"/>
<text x="46" y="199.5" font-size="16" fill="#ffffff" font-weight="bold" text-anchor="middle">1</text>
<text x="70" y="194.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Gửi thay đổi</text>
<text x="70" y="218.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Lập trình viên gửi Diff để</text>
<text x="70" y="237.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">review.</text>
<rect x="20" y="277" width="280" height="87" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="46" cy="303" r="14" fill="#1d4ed8"/>
<text x="46" y="308.5" font-size="16" fill="#ffffff" font-weight="bold" text-anchor="middle">2</text>
<text x="70" y="303.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Chạy kiểm thử</text>
<text x="70" y="327.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">SapFix chọn ca kiểm thử từ</text>
<text x="70" y="346.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Sapienz và chạy trên Diff.</text>
<polyline points="46,257 46,275" fill="none" stroke="#334155" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="20" y="386" width="280" height="87" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="46" cy="412" r="14" fill="#1d4ed8"/>
<text x="46" y="417.5" font-size="16" fill="#ffffff" font-weight="bold" text-anchor="middle">3</text>
<text x="70" y="412.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Thấy crash</text>
<text x="70" y="436.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Crash do chính Diff này gây</text>
<text x="70" y="455.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">ra.</text>
<polyline points="46,366 46,384" fill="none" stroke="#334155" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="20" y="495" width="280" height="68" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="46" cy="521" r="14" fill="#1d4ed8"/>
<text x="46" y="526.5" font-size="16" fill="#ffffff" font-weight="bold" text-anchor="middle">4</text>
<text x="70" y="521.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Sinh bản sửa</text>
<text x="70" y="545.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Tạo vài bản vá ứng viên.</text>
<polyline points="46,475 46,493" fill="none" stroke="#334155" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="8" y="587" width="304" height="333" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="615.1" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Bốn loại bản sửa</text>
<rect x="20" y="632" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="655" r="11" fill="#16a34a"/>
<polyline points="37.9,655.4 41.7,659.4 48.5,651" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="658.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Theo mẫu: áp một kiểu sửa</text>
<text x="64" y="677.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">đã biết.</text>
<rect x="20" y="703" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="726" r="11" fill="#16a34a"/>
<polyline points="37.9,726.4 41.7,730.4 48.5,722" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="729.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Đột biến: thử thay đổi nhỏ</text>
<text x="64" y="748.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">trên mã.</text>
<rect x="20" y="774" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="797" r="11" fill="#16a34a"/>
<polyline points="37.9,797.4 41.7,801.4 48.5,793" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="800.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Hoàn tác toàn bộ thay đổi</text>
<text x="64" y="819.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">gây lỗi.</text>
<rect x="20" y="845" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="868" r="11" fill="#16a34a"/>
<polyline points="37.9,868.4 41.7,872.4 48.5,864" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="871.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Hoàn tác một phần thay đổi</text>
<text x="64" y="890.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">đó.</text>
<rect x="8" y="932" width="304" height="471" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="960.1" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Người quyết định</text>
<rect x="20" y="977" width="280" height="87" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
<circle cx="46" cy="1003" r="14" fill="#b45309"/>
<text x="46" y="1008.5" font-size="16" fill="#ffffff" font-weight="bold" text-anchor="middle">1</text>
<text x="70" y="1003.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Thử bản vá</text>
<text x="70" y="1027.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Chạy kiểm thử trên từng</text>
<text x="70" y="1046.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">bản build đã vá.</text>
<rect x="20" y="1086" width="280" height="87" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
<circle cx="46" cy="1112" r="14" fill="#b45309"/>
<text x="46" y="1117.5" font-size="16" fill="#ffffff" font-weight="bold" text-anchor="middle">2</text>
<text x="70" y="1112.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Chọn một bản</text>
<text x="70" y="1136.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Gửi một bản ứng viên đi</text>
<text x="70" y="1155.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">review.</text>
<polyline points="46,1066 46,1084" fill="none" stroke="#334155" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="20" y="1195" width="280" height="87" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
<circle cx="46" cy="1221" r="14" fill="#b45309"/>
<text x="46" y="1226.5" font-size="16" fill="#ffffff" font-weight="bold" text-anchor="middle">3</text>
<text x="70" y="1221.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Người viết duyệt</text>
<text x="70" y="1245.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Người gây ra crash hiểu ngữ</text>
<text x="70" y="1264.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">cảnh nhất.</text>
<polyline points="46,1175 46,1193" fill="none" stroke="#334155" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="20" y="1304" width="280" height="87" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
<circle cx="46" cy="1330" r="14" fill="#b45309"/>
<text x="46" y="1335.5" font-size="16" fill="#ffffff" font-weight="bold" text-anchor="middle">4</text>
<text x="70" y="1330.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Nhận hoặc bỏ</text>
<text x="70" y="1354.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Người viết thay đổi quyết</text>
<text x="70" y="1373.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">định.</text>
<polyline points="46,1284 46,1302" fill="none" stroke="#334155" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="8" y="1415" width="304" height="267" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="1443.1" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Đợt thử 90 ngày, theo</text>
<text x="20" y="1465.2" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">nguồn</text>
<rect x="20" y="1482" width="280" height="46" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="1505" r="11" fill="#16a34a"/>
<polyline points="37.9,1505.4 41.7,1509.4 48.5,1501" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="1508.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">165 bản vá cho 57 crash.</text>
<rect x="20" y="1536" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="1559" r="11" fill="#16a34a"/>
<polyline points="37.9,1559.4 41.7,1563.4 48.5,1555" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="1562.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Trung vị 69 phút từ lúc phát</text>
<text x="64" y="1581.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">hiện tới lúc gửi duyệt.</text>
<rect x="20" y="1607" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="1630" r="11" fill="#16a34a"/>
<polyline points="37.9,1630.4 41.7,1634.4 48.5,1626" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="1633.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Chạy trên sáu ứng dụng lớn</text>
<text x="64" y="1652.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">của Facebook.</text>
</g>
</svg>
