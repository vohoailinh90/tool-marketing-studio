# Mutation manifest — see scripts/mutation_check.py
#
# The page draws an answer only when it belongs to the feature the person picked. A feature removed while it was picked
# is no longer listed by the answer, so `keepFeature` must drop the pick: with it kept, `answersFeature` refuses every
# answer and the page sits on the loading state (tests/web/office_feature_check.mts pins the helper, run under Node).

target: office/src/lib/feature.ts
note: Pure function, run under Node type stripping by tests/web/office_feature_check.mts (skipped where Node is older than 22.6).
mutations:
- label: the pick of a removed feature is never dropped, so every answer is refused and the page sits on the loading state
  find: |-
    wanted !== null && answer !== null && !answer.features.includes(wanted) ? null : wanted
  replace: |-
    wanted
  test: tests.test_office_ui.EdgeGeometryTests.test_a_feature_that_vanished_from_the_answer_is_dropped_instead_of_waited_for
