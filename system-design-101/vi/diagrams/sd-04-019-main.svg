<text x="70" y="786.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Trigger gửi thông báo: trễ</text>
<text x="70" y="805.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">trung vị 2,3 ms, lâu nhất</text>
<text x="70" y="825.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">23,8 ms.</text>
<polyline points="46,716 46,734" fill="none" stroke="#334155" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
