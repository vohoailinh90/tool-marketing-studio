<svg xmlns="http://www.w3.org/2000/svg" width="320" height="1364" viewBox="0 0 320 1364" role="img" aria-labelledby="title desc">
<title id="title">Sáu cách dùng Elasticsearch, và cái mỗi cách dựa vào</title>
<desc id="desc">Ba phần. Tìm và phân tích: tìm toàn văn dựa vào bộ phân tích và chỉ mục ngược; phân tích gần thời gian thực dựa vào gộp nhóm trên trường keyword, số, ngày, dữ liệu mới hiện sau lần làm mới; dữ liệu vị trí dựa vào trường geo_point. Nhật ký và an ninh: nhật ký dựa vào data stream chỉ ghi thêm, chia theo thời gian; học máy phát hiện bất thường cần gói trả phí hoặc bản dùng thử; SIEM là Elastic Security dựng trên Elasticsearch và Kibana. Thử trên Elasticsearch 9.5.5: gõ không dấu ra 0 kết quả; vừa ghi xong tìm ngay ra 0, sau lần làm mới ra 5; gộp nhóm trên trường văn bản bị từ chối; giấy phép basic không tạo được job phát hiện bất thường.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs>
<rect width="320" height="1364" fill="#f8fafc"/>
<g font-family="DejaVu Sans, Arial, sans-serif" fill="#0f172a">
<text x="16" y="34" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">Sáu cách dùng</text>
<text x="16" y="58" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">Elasticsearch, và cái mỗi</text>
<text x="16" y="82" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">cách dựa vào</text>
<text x="16" y="108.2" font-size="15" fill="#475569" font-weight="normal" text-anchor="start">Mỗi thẻ: việc cần làm, rồi tính năng</text>
<text x="16" y="127.8" font-size="15" fill="#475569" font-weight="normal" text-anchor="start">gánh việc đó.</text>
<rect x="8" y="147" width="304" height="426" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="175.2" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Tìm và phân tích</text>
<rect x="20" y="192" width="280" height="107" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="50" cy="245.5" r="18" fill="#1d4ed8"/><g transform="translate(39.2 234.7) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21 21-4.34-4.34"/><circle cx="11" cy="11" r="8"/></g>
<text x="78" y="218.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Tìm kiếm toàn văn</text>
<text x="78" y="242.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Bộ phân tích tách chữ</text>
<text x="78" y="261.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">thành từ; chỉ mục ngược</text>
<text x="78" y="281.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">chỉ ra tài liệu chứa từ.</text>
<rect x="20" y="313" width="280" height="127" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="50" cy="376.5" r="18" fill="#1d4ed8"/><g transform="translate(39.2 365.7) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v16a2 2 0 0 0 2 2h16"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/></g>
<text x="78" y="339.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Phân tích gần thời</text>
<text x="78" y="359.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">gian thực</text>
<text x="78" y="383.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Gộp nhóm trên trường</text>
<text x="78" y="402.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">keyword, số, ngày; dữ liệu</text>
<text x="78" y="422.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">mới hiện sau lần làm mới.</text>
<rect x="20" y="454" width="280" height="107" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="50" cy="507.5" r="18" fill="#1d4ed8"/><g transform="translate(39.2 496.7) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></g>
<text x="78" y="480.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Dữ liệu vị trí</text>
<text x="78" y="504.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Trường geo_point; tìm</text>
<text x="78" y="523.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">trong bán kính, kết hợp với</text>
<text x="78" y="543.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">tìm chữ.</text>
<rect x="8" y="585" width="304" height="406" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="613.1" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Nhật ký và an ninh</text>
<rect x="20" y="630" width="280" height="107" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
<circle cx="50" cy="683.5" r="18" fill="#0f766e"/><g transform="translate(39.2 672.7) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/></g>
<text x="78" y="656.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Nhật ký, sự kiện</text>
<text x="78" y="680.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Data stream: chỉ ghi thêm,</text>
<text x="78" y="699.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">chia chỉ mục theo thời</text>
<text x="78" y="719.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">gian, hỏi chung một tên.</text>
<rect x="20" y="751" width="280" height="107" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
<circle cx="50" cy="804.5" r="18" fill="#0f766e"/><g transform="translate(39.2 793.7) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 18V5"/><path d="M15 13a4.17 4.17 0 0 1-3-4 4.17 4.17 0 0 1-3 4"/><path d="M17.598 6.5A3 3 0 1 0 12 5a3 3 0 1 0-5.598 1.5"/><path d="M17.997 5.125a4 4 0 0 1 2.526 5.77"/><path d="M18 18a4 4 0 0 0 2-7.464"/><path d="M19.967 17.483A4 4 0 1 1 12 18a4 4 0 1 1-7.967-.517"/><path d="M6 18a4 4 0 0 1-2-7.464"/><path d="M6.003 5.125a4 4 0 0 0-2.526 5.77"/></g>
<text x="78" y="777.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Học máy</text>
<text x="78" y="801.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Phát hiện bất thường trên</text>
<text x="78" y="820.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">chuỗi thời gian; cần gói trả</text>
<text x="78" y="840.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">phí hoặc bản dùng thử.</text>
<rect x="20" y="872" width="280" height="107" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
<circle cx="50" cy="925.5" r="18" fill="#0f766e"/><g transform="translate(39.2 914.7) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/></g>
<text x="78" y="898.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">SIEM</text>
<text x="78" y="922.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Elastic Security dựng trên</text>
<text x="78" y="941.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Elasticsearch và Kibana để</text>
<text x="78" y="961.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">dò sự cố an ninh.</text>
<rect x="8" y="1003" width="304" height="353" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="1031.1" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Thử trên Elasticsearch 9.5.5</text>
<rect x="20" y="1048" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="1071" r="11" fill="#16a34a"/>
<polyline points="37.9,1071.4 41.7,1075.4 48.5,1067" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="1074.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Gõ không dấu ao khoac: 0</text>
<text x="64" y="1093.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">kết quả, cần bộ lọc bỏ dấu.</text>
<rect x="20" y="1119" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="1142" r="11" fill="#16a34a"/>
<polyline points="37.9,1142.4 41.7,1146.4 48.5,1138" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="1145.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Vừa ghi xong tìm ngay: 0 kết</text>
<text x="64" y="1164.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">quả. Sau lần làm mới: 5.</text>
<rect x="20" y="1190" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="1213" r="11" fill="#16a34a"/>
<polyline points="37.9,1213.4 41.7,1217.4 48.5,1209" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="1216.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Gộp nhóm trên trường văn</text>
<text x="64" y="1235.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">bản: bị từ chối.</text>
<rect x="20" y="1261" width="280" height="83" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="1284" r="11" fill="#16a34a"/>
<polyline points="37.9,1284.4 41.7,1288.4 48.5,1280" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="1287.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Giấy phép basic: không tạo</text>
<text x="64" y="1306.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">được job phát hiện bất</text>
<text x="64" y="1326.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">thường.</text>
</g>
</svg>
