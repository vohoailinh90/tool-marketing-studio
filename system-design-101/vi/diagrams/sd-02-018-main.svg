<text x="78" y="902.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Redshift.</text>
<rect x="20" y="934" width="280" height="68" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
<circle cx="50" cy="968" r="18" fill="#b45309"/><g transform="translate(39.2 957.2) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5"/><path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09"/><path d="M9 12a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.4 22.4 0 0 1-4 2z"/><path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 .05 5 .05"/></g>
<text x="78" y="960.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Phát hành</text>
<text x="78" y="984.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Jenkins, Spinnaker, Atlas...</text>
<rect x="8" y="1026" width="304" height="262" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
