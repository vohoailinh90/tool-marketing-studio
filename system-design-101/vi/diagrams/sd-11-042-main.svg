<circle cx="43" cy="689" r="11" fill="#16a34a"/>
<polyline points="37.9,689.4 41.7,693.4 48.5,685" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="692.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Độ tin cậy.</text>
<rect x="20" y="720" width="280" height="46" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
