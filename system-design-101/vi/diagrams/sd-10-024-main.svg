<svg xmlns="http://www.w3.org/2000/svg" width="320" height="1469" viewBox="0 0 320 1469" role="img" aria-labelledby="title desc">
<title id="title">Chín thuật toán dùng hằng ngày</title>
<desc id="desc">Ba nhóm thẻ và một khung ghi nhớ. Xếp, tìm đường và xếp hạng: sắp xếp giữ nguyên thứ tự các bản ghi cùng khóa; thuật toán Dijkstra tìm đường A tới D dài 4 thay vì 5; phân tích liên kết cho nút c điểm cao nhất, nút không ai trỏ tới điểm thấp nhất. Mật mã, số và nén: RSA mã hóa 65 thành 2790 rồi giải lại ra 65; phân tích thừa số nguyên tách 3233 thành 53 và 61; mã Huffman nén abracadabra từ 88 bit xuống 23 bit; SHA-256 của abc luôn cho một chuỗi 64 ký tự thập lục phân. Học máy: Transformer và mạng nơ-ron tích chập có lớp tương ứng trong PyTorch. Khung cuối nêu ba điều cần nhớ.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs>
<rect width="320" height="1469" fill="#f8fafc"/>
<g font-family="DejaVu Sans, Arial, sans-serif" fill="#0f172a">
<text x="16" y="34" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">Chín thuật toán dùng</text>
<text x="16" y="58" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">hằng ngày</text>
<text x="16" y="84.2" font-size="15" fill="#475569" font-weight="normal" text-anchor="start">Chín tên: bảy phép thử nhỏ, hai ví dụ</text>
<text x="16" y="103.8" font-size="15" fill="#475569" font-weight="normal" text-anchor="start">chỉ đọc tài liệu.</text>
<rect x="8" y="123" width="304" height="346" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="151.2" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Xếp, tìm đường và xếp hạng</text>
<rect x="20" y="168" width="280" height="87" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="50" cy="211.5" r="18" fill="#1d4ed8"/><g transform="translate(39.2 200.7) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5h10"/><path d="M11 12h10"/><path d="M11 19h10"/><path d="M4 4h1v5"/><path d="M4 9h2"/><path d="M6.5 20H3.4c0-1 2.6-1.925 2.6-3.5a1.5 1.5 0 0 0-2.6-1.02"/></g>
<text x="78" y="194.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Sắp xếp</text>
<text x="78" y="218.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Bản ghi cùng khóa giữ thứ</text>
<text x="78" y="237.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">tự cũ.</text>
<rect x="20" y="269" width="280" height="87" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="50" cy="312.5" r="18" fill="#1d4ed8"/><g transform="translate(39.2 301.7) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="19" r="3"/><path d="M9 19h8.5a3.5 3.5 0 0 0 0-7h-11a3.5 3.5 0 0 1 0-7H15"/><circle cx="18" cy="5" r="3"/></g>
<text x="78" y="295.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Thuật toán Dijkstra</text>
<text x="78" y="319.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">A tới D dài 4 qua C và B,</text>
<text x="78" y="338.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">không phải 5.</text>
<rect x="20" y="370" width="280" height="87" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="50" cy="413.5" r="18" fill="#1d4ed8"/><g transform="translate(39.2 402.7) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" x2="15.42" y1="13.51" y2="17.49"/><line x1="15.41" x2="8.59" y1="6.51" y2="10.49"/></g>
<text x="78" y="396.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Phân tích liên kết</text>
<text x="78" y="420.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Nút c điểm cao nhất; nút</text>
<text x="78" y="439.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">không ai trỏ tới thấp nhất.</text>
<rect x="8" y="481" width="304" height="429" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="509.2" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Mật mã, số và nén</text>
<rect x="20" y="526" width="280" height="87" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
<circle cx="50" cy="569.5" r="18" fill="#0f766e"/><g transform="translate(39.2 558.7) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.586 17.414A2 2 0 0 0 2 18.828V21a1 1 0 0 0 1 1h3a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h1a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h.172a2 2 0 0 0 1.414-.586l.814-.814a6.5 6.5 0 1 0-4-4z"/><circle cx="16.5" cy="7.5" fill="#FFFFFF" r=".5"/></g>
<text x="78" y="552.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">RSA</text>
<text x="78" y="576.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">65 thành 2790, giải lại ra</text>
<text x="78" y="595.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">65.</text>
<rect x="20" y="627" width="280" height="88" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
<circle cx="50" cy="671" r="18" fill="#0f766e"/><g transform="translate(39.2 660.2) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" x2="20" y1="9" y2="9"/><line x1="4" x2="20" y1="15" y2="15"/><line x1="10" x2="8" y1="3" y2="21"/><line x1="16" x2="14" y1="3" y2="21"/></g>
<text x="78" y="653.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Phân tích thừa số</text>
<text x="78" y="673.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">nguyên</text>
<text x="78" y="697.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">3233 tách thành 53 và 61.</text>
<rect x="20" y="729" width="280" height="87" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
<circle cx="50" cy="772.5" r="18" fill="#0f766e"/><g transform="translate(39.2 761.7) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 21.73a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73z"/><path d="M12 22V12"/><polyline points="3.29 7 12 12 20.71 7"/><path d="m7.5 4.27 9 5.15"/></g>
<text x="78" y="755.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Mã Huffman</text>
<text x="78" y="779.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">abracadabra: 23 bit thay</text>
<text x="78" y="798.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">cho 88.</text>
<rect x="20" y="830" width="280" height="68" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
<circle cx="50" cy="864" r="18" fill="#0f766e"/><g transform="translate(39.2 853.2) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 10a2 2 0 0 0-2 2c0 1.02-.1 2.51-.26 4"/><path d="M14 13.12c0 2.38 0 6.38-1 8.88"/><path d="M17.29 21.02c.12-.6.43-2.3.5-3.02"/><path d="M2 12a10 10 0 0 1 18-6"/><path d="M2 16h.01"/><path d="M21.8 16c.2-2 .131-5.354 0-6"/><path d="M5 19.5C5.5 18 6 15 6 12a6 6 0 0 1 .34-2"/><path d="M8.65 22c.21-.66.45-1.32.57-2"/><path d="M9 6.8a6 6 0 0 1 9 5.2v2"/></g>
<text x="78" y="856.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Họ băm SHA</text>
<text x="78" y="880.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">SHA-256 luôn ra 64 ký tự.</text>
<rect x="8" y="922" width="304" height="265" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="950.1" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Học máy</text>
<rect x="20" y="967" width="280" height="107" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
<circle cx="50" cy="1020.5" r="18" fill="#b45309"/><g transform="translate(39.2 1009.7) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 18V5"/><path d="M15 13a4.17 4.17 0 0 1-3-4 4.17 4.17 0 0 1-3 4"/><path d="M17.598 6.5A3 3 0 1 0 12 5a3 3 0 1 0-5.598 1.5"/><path d="M17.997 5.125a4 4 0 0 1 2.526 5.77"/><path d="M18 18a4 4 0 0 0 2-7.464"/><path d="M19.967 17.483A4 4 0 1 1 12 18a4 4 0 1 1-7.967-.517"/><path d="M6 18a4 4 0 0 1-2-7.464"/><path d="M6.003 5.125a4 4 0 0 0-2.526 5.77"/></g>
<text x="78" y="993.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Transformer</text>
<text x="78" y="1017.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">PyTorch có lớp theo bài</text>
<text x="78" y="1036.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">báo Attention Is All You</text>
<text x="78" y="1056.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Need.</text>
<rect x="20" y="1088" width="280" height="87" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
<circle cx="50" cy="1131.5" r="18" fill="#b45309"/><g transform="translate(39.2 1120.7) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83z"/><path d="M2 12a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 12"/><path d="M2 17a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 17"/></g>
<text x="78" y="1114.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Mạng nơ-ron tích chập</text>
<text x="78" y="1138.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">PyTorch có lớp Conv2d,</text>
<text x="78" y="1157.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">tích chập 2D.</text>
<rect x="8" y="1199" width="304" height="262" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="1227.1" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Nhớ gì</text>
<rect x="20" y="1244" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="1267" r="11" fill="#16a34a"/>
<polyline points="37.9,1267.4 41.7,1271.4 48.5,1263" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="1270.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Mỗi thuật toán trả lời một</text>
<text x="64" y="1289.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">câu hỏi riêng.</text>
<rect x="20" y="1315" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="1338" r="11" fill="#16a34a"/>
<polyline points="37.9,1338.4 41.7,1342.4 48.5,1334" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="1341.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Bảy cái thử được bằng vài</text>
<text x="64" y="1360.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">dòng mã.</text>
<rect x="20" y="1386" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="1409" r="11" fill="#16a34a"/>
<polyline points="37.9,1409.4 41.7,1413.4 48.5,1405" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="1412.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Ví dụ nhỏ, không phải cách</text>
<text x="64" y="1431.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">dùng thật.</text>
</g>
</svg>
