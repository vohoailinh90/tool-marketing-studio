<circle cx="43" cy="520" r="11" fill="#16a34a"/>
<polyline points="37.9,520.4 41.7,524.4 48.5,516" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
