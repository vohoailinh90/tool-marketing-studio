<svg xmlns="http://www.w3.org/2000/svg" width="320" height="1822" viewBox="0 0 320 1822" role="img" aria-labelledby="title desc">
<title id="title">Mười cuốn sách, năm nhóm</title>
<desc id="desc">Năm nhóm xếp dọc, mỗi nhóm hai cuốn. Lời khuyên chung: The Pragmatic Programmer, Code Complete. Viết mã: Clean Code, Refactoring. Kiến trúc phần mềm: Designing Data-Intensive Applications, System Design Interview. Mẫu thiết kế: Design Patterns, Domain-Driven Design. Cấu trúc dữ liệu và thuật toán: Introduction to Algorithms, Cracking the Coding Interview. Khung cuối nêu ba điều cần nhớ.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs>
