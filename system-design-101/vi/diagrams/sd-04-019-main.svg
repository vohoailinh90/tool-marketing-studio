<text x="78" y="338.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">đã đổi.</text>
<rect x="20" y="370" width="280" height="87" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="50" cy="413.5" r="18" fill="#1d4ed8"/><g transform="translate(39.2 402.7) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect height="8" rx="2" width="8" x="3" y="3"/><path d="M7 11v4a2 2 0 0 0 2 2h4"/><rect height="8" rx="2" width="8" x="13" y="13"/></g>
<text x="78" y="396.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Saga</text>
<text x="78" y="420.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Giao dịch cục bộ nối nhau;</text>
<text x="78" y="439.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">hỏng thì bù.</text>
<rect x="20" y="471" width="280" height="87" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="50" cy="514.5" r="18" fill="#1d4ed8"/><g transform="translate(39.2 503.7) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5"/><path d="M8 3H3v5"/><path d="M12 22v-8.3a4 4 0 0 0-1.172-2.872L3 3"/><path d="m15 9 6-6"/></g>
<text x="78" y="497.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">CQRS</text>
<text x="78" y="521.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Ghi một kho, đọc kho khác</text>
<text x="78" y="540.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">đi sau.</text>
<rect x="8" y="582" width="304" height="491" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="610.1" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Thử: bản đọc đi sau bao lâu</text>
<rect x="20" y="627" width="280" height="87" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
<circle cx="46" cy="653" r="14" fill="#0f766e"/>
