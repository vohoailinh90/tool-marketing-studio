<svg xmlns="http://www.w3.org/2000/svg" width="320" height="1349" viewBox="0 0 320 1349" role="img" aria-labelledby="title desc">
<title id="title">Ai được bao nhiêu trong một lần quẹt thẻ</title>
<desc id="desc">Ba khung. Khung một, ba loại phí: phí chiết khấu người bán do ngân hàng thu đặt với người bán; phí liên ngân hàng do mạng thẻ đặt, trả cho ngân hàng phát hành; phí và đánh giá của mạng thẻ, mỗi ngân hàng trả hằng tháng. Khung hai, năm bước với ví dụ 100 đô la: chủ thẻ trả người bán 100 đô la; ngân hàng thu đặt phí chiết khấu; ngân hàng thu giữ 0,25 đô la và trả 1,75 đô la cho ngân hàng phát hành; mạng thẻ thu phí, ví dụ Visa thu 0,11 phần trăm cộng 0,0195 đô la mỗi lần quẹt; chủ thẻ trả ngân hàng phát hành. Khung ba, vì sao ngân hàng phát hành được trả: trả người bán dù chủ thẻ không trả, trả trước khi chủ thẻ trả, và có chi phí vận hành.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs>
<rect width="320" height="1349" fill="#f8fafc"/>
<g font-family="DejaVu Sans, Arial, sans-serif" fill="#0f172a">
<text x="16" y="34" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">Ai được bao nhiêu trong</text>
<text x="16" y="58" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">một lần quẹt thẻ</text>
<text x="16" y="84.2" font-size="15" fill="#475569" font-weight="normal" text-anchor="start">Ba loại phí, năm bước, ví dụ 100 đô</text>
<text x="16" y="103.8" font-size="15" fill="#475569" font-weight="normal" text-anchor="start">la.</text>
<rect x="8" y="123" width="304" height="386" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="151.2" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Ba loại phí</text>
<rect x="20" y="168" width="280" height="107" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="50" cy="221.5" r="18" fill="#1d4ed8"/><g transform="translate(39.2 210.7) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 21v-5a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v5"/><path d="M17.774 10.31a1.12 1.12 0 0 0-1.549 0 2.5 2.5 0 0 1-3.451 0 1.12 1.12 0 0 0-1.548 0 2.5 2.5 0 0 1-3.452 0 1.12 1.12 0 0 0-1.549 0 2.5 2.5 0 0 1-3.77-3.248l2.889-4.184A2 2 0 0 1 7 2h10a2 2 0 0 1 1.653.873l2.895 4.192a2.5 2.5 0 0 1-3.774 3.244"/><path d="M4 10.95V19a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8.05"/></g>
<text x="78" y="194.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Phí chiết khấu người</text>
<text x="78" y="214.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">bán</text>
<text x="78" y="238.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Ngân hàng thu đặt với</text>
<text x="78" y="257.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">người bán.</text>
<rect x="20" y="289" width="280" height="87" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="50" cy="332.5" r="18" fill="#1d4ed8"/><g transform="translate(39.2 321.7) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18"/><path d="m19 8 3 8a5 5 0 0 1-6 0zV7"/><path d="M3 7h1a17 17 0 0 0 8-2 17 17 0 0 0 8 2h1"/><path d="m5 8 3 8a5 5 0 0 1-6 0zV7"/><path d="M7 21h10"/></g>
<text x="78" y="315.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Phí liên ngân hàng</text>
<text x="78" y="339.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Mạng thẻ đặt, trả cho ngân</text>
<text x="78" y="358.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">hàng phát hành.</text>
<rect x="20" y="390" width="280" height="107" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="50" cy="443.5" r="18" fill="#1d4ed8"/><g transform="translate(39.2 432.7) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect height="6" rx="1" width="6" x="16" y="16"/><rect height="6" rx="1" width="6" x="2" y="16"/><rect height="6" rx="1" width="6" x="9" y="2"/><path d="M5 16v-3a1 1 0 0 1 1-1h12a1 1 0 0 1 1 1v3"/><path d="M12 12V8"/></g>
<text x="78" y="416.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Phí và đánh giá của</text>
<text x="78" y="436.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">mạng thẻ</text>
<text x="78" y="460.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Mỗi ngân hàng trả hằng</text>
<text x="78" y="479.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">tháng.</text>
<rect x="8" y="521" width="304" height="504" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="549.1" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Năm bước, ví dụ 100 đô la</text>
<rect x="20" y="566" width="280" height="68" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
<circle cx="46" cy="592" r="14" fill="#0f766e"/>
<text x="46" y="597.5" font-size="16" fill="#ffffff" font-weight="bold" text-anchor="middle">1</text>
<text x="70" y="592.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Chủ thẻ trả 100 đô la</text>
<text x="70" y="616.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Mua hàng.</text>
<rect x="20" y="656" width="280" height="68" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
<circle cx="46" cy="682" r="14" fill="#0f766e"/>
<text x="46" y="687.5" font-size="16" fill="#ffffff" font-weight="bold" text-anchor="middle">2</text>
<text x="70" y="682.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Người bán trả phí</text>
<text x="70" y="706.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Phí chiết khấu.</text>
<polyline points="46,636 46,654" fill="none" stroke="#334155" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="20" y="746" width="280" height="68" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
<circle cx="46" cy="772" r="14" fill="#0f766e"/>
<text x="46" y="777.5" font-size="16" fill="#ffffff" font-weight="bold" text-anchor="middle">3</text>
<text x="70" y="772.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Chia phí</text>
<text x="70" y="796.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Giữ 0,25; trả 1,75 đô la.</text>
<polyline points="46,726 46,744" fill="none" stroke="#334155" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="20" y="836" width="280" height="87" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
<circle cx="46" cy="862" r="14" fill="#0f766e"/>
<text x="46" y="867.5" font-size="16" fill="#ffffff" font-weight="bold" text-anchor="middle">4</text>
<text x="70" y="862.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Mạng thẻ thu phí</text>
<text x="70" y="886.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Visa: 0,11% và 0,0195 đô</text>
<text x="70" y="905.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">la.</text>
<polyline points="46,816 46,834" fill="none" stroke="#334155" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="20" y="945" width="280" height="68" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
<circle cx="46" cy="971" r="14" fill="#0f766e"/>
<text x="46" y="976.5" font-size="16" fill="#ffffff" font-weight="bold" text-anchor="middle">5</text>
<text x="70" y="971.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Chủ thẻ trả tiền dịch vụ</text>
<text x="70" y="995.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Cho ngân hàng phát hành.</text>
<polyline points="46,925 46,943" fill="none" stroke="#334155" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="8" y="1037" width="304" height="304" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="1065.1" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Vì sao ngân hàng phát hành</text>
<text x="20" y="1087.2" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">được trả</text>
<rect x="20" y="1104" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="1127" r="11" fill="#16a34a"/>
<polyline points="37.9,1127.4 41.7,1131.4 48.5,1123" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="1130.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Chuyển tiền (qua ngân hàng</text>
<text x="64" y="1149.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">thu) dù chủ thẻ không trả.</text>
<rect x="20" y="1175" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="1198" r="11" fill="#16a34a"/>
<polyline points="37.9,1198.4 41.7,1202.4 48.5,1194" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="1201.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Chuyển tiền trước khi chủ</text>
<text x="64" y="1220.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">thẻ trả.</text>
<rect x="20" y="1246" width="280" height="83" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="1269" r="11" fill="#16a34a"/>
<polyline points="37.9,1269.4 41.7,1273.4 48.5,1265" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="1272.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Có chi phí vận hành: tài</text>
<text x="64" y="1291.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">khoản, sao kê, chống gian</text>
<text x="64" y="1311.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">lận.</text>
</g>
</svg>
