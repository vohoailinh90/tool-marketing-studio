<svg xmlns="http://www.w3.org/2000/svg" width="320" height="1309" viewBox="0 0 320 1309" role="img" aria-labelledby="title desc">
<title id="title">Sáu mẫu quản lý dữ liệu, một câu hỏi chung</title>
<desc id="desc">Ba khung. Khung một, ba mẫu giúp đọc nhanh nhờ một bản dữ liệu thứ hai: cache-aside đọc cache trước, trượt thì đọc kho rồi nạp vào cache, cũ tới khi hết hạn hoặc bị xóa; materialized view lưu sẵn kết quả một truy vấn nặng và cũ tới lần làm mới, thử nghiệm thấy 70 khi bảng gốc đã là 100; index table là bảng phụ sắp theo khóa khác, phải cập nhật cùng bảng gốc. Khung hai, ba mẫu đổi cách lưu: CQRS tách mô hình ghi và mô hình đọc, mô hình đọc theo sau; event sourcing lưu chuỗi sự kiện và tính lại trạng thái; sharding chia dữ liệu ra nhiều máy theo khóa shard, khóa tốt giữ truy vấn chính trong một shard. Khung ba hỏi: làm mới khi nào, cũ được bao lâu, ai sửa khi lệch.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs>
<rect width="320" height="1309" fill="#f8fafc"/>
<g font-family="DejaVu Sans, Arial, sans-serif" fill="#0f172a">
<text x="16" y="34" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">Sáu mẫu quản lý dữ liệu,</text>
<text x="16" y="58" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">một câu hỏi chung</text>
<text x="16" y="84.2" font-size="15" fill="#475569" font-weight="normal" text-anchor="start">Mẫu nào cũng tạo thêm một bản dữ</text>
<text x="16" y="103.8" font-size="15" fill="#475569" font-weight="normal" text-anchor="start">liệu hoặc chia dữ liệu ra: bản đó cũ</text>
<text x="16" y="123.2" font-size="15" fill="#475569" font-weight="normal" text-anchor="start">được bao lâu?</text>
<rect x="8" y="143" width="304" height="447" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="171.2" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Đọc nhanh nhờ một bản dữ</text>
<text x="20" y="193.2" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">liệu thứ hai</text>
<rect x="20" y="210" width="280" height="126" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="50" cy="273" r="18" fill="#1d4ed8"/><g transform="translate(39.2 262.2) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15.914 4a1.5 1.5 0 00-2.474-1.561l-9 9A1.5 1.5 0 005.5 14h4.002a.5.5 0 01.471.666L8.086 20a1.5 1.5 0 002.475 1.56l9-9A1.5 1.5 0 0018.5 10h-3.997a.5.5 0 01-.472-.667z"/></g>
<text x="78" y="236.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Cache-aside</text>
<text x="78" y="260.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Đọc cache trước; trượt thì</text>
<text x="78" y="279.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">đọc kho rồi nạp vào cache.</text>
<text x="78" y="299.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Cũ tới khi hết hạn hoặc bị</text>
<text x="78" y="318.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">xóa.</text>
<rect x="20" y="350" width="280" height="107" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="50" cy="403.5" r="18" fill="#1d4ed8"/><g transform="translate(39.2 392.7) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83z"/><path d="M2 12a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 12"/><path d="M2 17a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 17"/></g>
<text x="78" y="376.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Materialized view</text>
<text x="78" y="400.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Lưu sẵn kết quả truy vấn</text>
<text x="78" y="419.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">nặng. Cũ tới lần làm mới:</text>
<text x="78" y="439.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">thấy 70, bảng gốc đã 100.</text>
<rect x="20" y="471" width="280" height="107" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="50" cy="524.5" r="18" fill="#1d4ed8"/><g transform="translate(39.2 513.7) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21 21-4.34-4.34"/><circle cx="11" cy="11" r="8"/></g>
<text x="78" y="497.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Index table</text>
<text x="78" y="521.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Bảng phụ sắp theo khóa</text>
<text x="78" y="540.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">khác để tra nhanh; phải</text>
<text x="78" y="560.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">cập nhật cùng bảng gốc.</text>
<rect x="8" y="602" width="304" height="425" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="630.1" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Đổi cách lưu dữ liệu</text>
<rect x="20" y="647" width="280" height="107" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
<circle cx="50" cy="700.5" r="18" fill="#0f766e"/><g transform="translate(39.2 689.7) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5"/><path d="M8 3H3v5"/><path d="M12 22v-8.3a4 4 0 0 0-1.172-2.872L3 3"/><path d="m15 9 6-6"/></g>
<text x="78" y="673.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">CQRS</text>
<text x="78" y="697.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Tách mô hình ghi và mô</text>
<text x="78" y="716.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">hình đọc; mô hình đọc theo</text>
<text x="78" y="736.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">sau mô hình ghi.</text>
<rect x="20" y="768" width="280" height="107" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
<circle cx="50" cy="821.5" r="18" fill="#0f766e"/><g transform="translate(39.2 810.7) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/></g>
<text x="78" y="794.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Event sourcing</text>
<text x="78" y="818.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Lưu chuỗi sự kiện thay cho</text>
<text x="78" y="837.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">trạng thái; trạng thái tính</text>
<text x="78" y="857.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">lại từ sự kiện.</text>
<rect x="20" y="889" width="280" height="126" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
<circle cx="50" cy="952" r="18" fill="#0f766e"/><g transform="translate(39.2 941.2) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.97 12.92A2 2 0 0 0 2 14.63v3.24a2 2 0 0 0 .97 1.71l3 1.8a2 2 0 0 0 2.06 0L12 19v-5.5l-5-3-4.03 2.42Z"/><path d="m7 16.5-4.74-2.85"/><path d="m7 16.5 5-3"/><path d="M7 16.5v5.17"/><path d="M12 13.5V19l3.97 2.38a2 2 0 0 0 2.06 0l3-1.8a2 2 0 0 0 .97-1.71v-3.24a2 2 0 0 0-.97-1.71L17 10.5l-5 3Z"/><path d="m17 16.5-5-3"/><path d="m17 16.5 4.74-2.85"/><path d="M17 16.5v5.17"/><path d="M7.97 4.42A2 2 0 0 0 7 6.13v4.37l5 3 5-3V6.13a2 2 0 0 0-.97-1.71l-3-1.8a2 2 0 0 0-2.06 0l-3 1.8Z"/><path d="M12 8 7.26 5.15"/><path d="m12 8 4.74-2.85"/><path d="M12 13.5V8"/></g>
<text x="78" y="915.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Sharding</text>
<text x="78" y="939.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Chia dữ liệu ra nhiều máy</text>
<text x="78" y="958.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">theo khóa shard; khóa tốt</text>
<text x="78" y="978.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">giữ truy vấn chính trong</text>
<text x="78" y="997.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">một shard.</text>
<rect x="8" y="1039" width="304" height="262" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="1067.1" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Hỏi trước khi dùng</text>
<rect x="20" y="1084" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="1107" r="11" fill="#16a34a"/>
<polyline points="37.9,1107.4 41.7,1111.4 48.5,1103" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="1110.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Bản dữ liệu thứ hai được làm</text>
<text x="64" y="1129.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">mới khi nào?</text>
<rect x="20" y="1155" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="1178" r="11" fill="#16a34a"/>
<polyline points="37.9,1178.4 41.7,1182.4 48.5,1174" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="1181.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Người dùng chịu được dữ liệu</text>
<text x="64" y="1200.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">cũ bao lâu?</text>
<rect x="20" y="1226" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="1249" r="11" fill="#16a34a"/>
<polyline points="37.9,1249.4 41.7,1253.4 48.5,1245" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="1252.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Bản sao lệch với bản gốc thì</text>
<text x="64" y="1271.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">ai phát hiện, ai sửa?</text>
</g>
</svg>
