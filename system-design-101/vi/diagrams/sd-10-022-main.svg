<text x="64" y="1611.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Ba mô hình khác nhau ở chỗ</text>
<text x="64" y="1630.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">nhìn chương trình là gì.</text>
