<svg xmlns="http://www.w3.org/2000/svg" width="320" height="1919" viewBox="0 0 320 1919" role="img" aria-labelledby="title desc">
<title id="title">Mười cuốn sách, năm nhóm</title>
<desc id="desc">Năm nhóm xếp dọc, mỗi nhóm hai cuốn. Lời khuyên chung: The Pragmatic Programmer của Hunt và Thomas, Code Complete của McConnell. Viết mã: Clean Code của Martin, Refactoring của Fowler. Kiến trúc phần mềm: Designing Data-Intensive Applications của Kleppmann, System Design Interview của Alex Xu. Mẫu thiết kế: Design Patterns của Gamma cùng ba đồng tác giả, Domain-Driven Design của Evans. Cấu trúc dữ liệu và thuật toán: Introduction to Algorithms của Cormen, Leiserson, Rivest và Stein, Cracking the Coding Interview của McDowell. Khung cuối nêu ba điều cần nhớ.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs>
<rect width="320" height="1919" fill="#f8fafc"/>
<g font-family="DejaVu Sans, Arial, sans-serif" fill="#0f172a">
