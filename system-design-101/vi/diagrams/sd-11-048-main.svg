<text x="64" y="780.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Lake Store.</text>
<rect x="20" y="806" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="829" r="11" fill="#16a34a"/>
<polyline points="37.9,829.4 41.7,833.4 48.5,825" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="832.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Lệch: kho dữ liệu với Cosmos</text>
<text x="64" y="851.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">DB, cả hai bên.</text>
