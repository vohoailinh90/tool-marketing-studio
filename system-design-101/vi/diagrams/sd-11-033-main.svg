<svg xmlns="http://www.w3.org/2000/svg" width="320" height="1166" viewBox="0 0 320 1166" role="img" aria-labelledby="title desc">
<title id="title">Học AWS từ đâu</title>
<desc id="desc">Hai khung dịch vụ AWS và một khung bài tập. Khung một, nền tảng: máy chủ ảo cho thuê, S3 lưu đối tượng, VPC là mạng riêng, IAM quản lý ai được làm gì. Khung hai, dữ liệu và nhắn tin: RDS cho cơ sở dữ liệu quan hệ, DynamoDB cho khóa và giá trị, SQS và SNS cho hàng đợi và thông báo. Khung ba, bài tập ứng dụng chia sẻ ảnh: mỗi nhu cầu gắn với một dịch vụ.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs>
<rect width="320" height="1166" fill="#f8fafc"/>
<g font-family="DejaVu Sans, Arial, sans-serif" fill="#0f172a">
<text x="16" y="34" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">Học AWS từ đâu</text>
<text x="16" y="60.2" font-size="15" fill="#475569" font-weight="normal" text-anchor="start">Bản đồ nhóm dịch vụ cho người mới.</text>
<rect x="8" y="80" width="304" height="371" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="108.2" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Nền tảng</text>
