<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 726" width="320" height="726" role="img" aria-labelledby="title desc">
<title id="title">Sáu mảng ôn phỏng vấn kỹ thuật</title>
<desc id="desc">Sáu mảng và cách luyện: coding, luyện giải bài và nói to cách nghĩ; thiết kế hệ thống, luyện khung bảy bước và đọc các ví dụ thiết kế; phỏng vấn hành vi, chuẩn bị câu chuyện theo STAR; thiết kế hướng đối tượng, luyện thiết kế lớp và mẫu thiết kế; phỏng vấn thử với người thật; tìm việc, nộp hồ sơ và theo dõi. Ghi chú: danh sách tài nguyên là của bài nguồn, chưa kiểm còn hoạt động; kiểm tra giá và chất lượng trước khi dùng.</desc>
<rect width="320" height="726" fill="#f8fafc"/>
<g font-family="DejaVu Sans, Arial, sans-serif" fill="#0f172a">
<text x="16" y="30" font-size="21" font-weight="bold">SÁU MẢNG ÔN</text>
<text x="16" y="54" font-size="21" font-weight="bold">PHỎNG VẤN</text>
<rect x="16" y="80" width="288" height="76" rx="12" fill="#dbeafe" stroke="#94a3b8"/>
<text x="29" y="109" font-size="16" font-weight="bold">Coding</text>
<text x="29" y="137" font-size="16" font-weight="normal">Giải bài, nói to cách nghĩ</text>
<rect x="16" y="164" width="288" height="76" rx="12" fill="#ede9fe" stroke="#94a3b8"/>
<text x="29" y="193" font-size="16" font-weight="bold">Thiết kế hệ thống</text>
<text x="29" y="221" font-size="16" font-weight="normal">Luyện khung bảy bước</text>
<rect x="16" y="248" width="288" height="76" rx="12" fill="#dcfce7" stroke="#94a3b8"/>
<text x="29" y="277" font-size="16" font-weight="bold">Hành vi</text>
<text x="29" y="305" font-size="16" font-weight="normal">Chuẩn bị câu chuyện theo STAR</text>
<rect x="16" y="332" width="288" height="76" rx="12" fill="#fef3c7" stroke="#94a3b8"/>
<text x="29" y="361" font-size="16" font-weight="bold">Thiết kế hướng đối tượng</text>
<text x="29" y="389" font-size="16" font-weight="normal">Luyện thiết kế lớp</text>
<rect x="16" y="416" width="288" height="76" rx="12" fill="#e2e8f0" stroke="#94a3b8"/>
<text x="29" y="445" font-size="16" font-weight="bold">Phỏng vấn thử</text>
<text x="29" y="473" font-size="16" font-weight="normal">Luyện với người thật</text>
<rect x="16" y="500" width="288" height="76" rx="12" fill="#e2e8f0" stroke="#94a3b8"/>
<text x="29" y="529" font-size="16" font-weight="bold">Tìm việc</text>
<text x="29" y="557" font-size="16" font-weight="normal">Nộp hồ sơ, theo dõi kết quả</text>
<rect x="16" y="588" width="288" height="124" rx="12" fill="#fee2e2" stroke="#94a3b8"/>
<text x="29" y="617" font-size="16" font-weight="bold">Danh sách tài nguyên</text>
<text x="29" y="645" font-size="16" font-weight="normal">Lấy từ bài nguồn, chưa kiểm còn</text>
<text x="29" y="669" font-size="16" font-weight="normal">hoạt động. Kiểm tra giá và chất</text>
<text x="29" y="693" font-size="16" font-weight="normal">lượng trước khi dùng.</text>
</g></svg>
