<text x="16" y="60.2" font-size="15" fill="#475569" font-weight="normal" text-anchor="start">Hai nút chưa đủ: còn tốc độ chuyển.</text>
<rect x="8" y="80" width="304" height="262" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="108.2" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Ba kiểu hai nút</text>
<rect x="20" y="125" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="148" r="11" fill="#16a34a"/>
<polyline points="37.9,148.4 41.7,152.4 48.5,144" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="151.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Primary-Backup: nút dự</text>
<text x="64" y="170.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">phòng chờ.</text>
<rect x="20" y="196" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="219" r="11" fill="#16a34a"/>
<polyline points="37.9,219.4 41.7,223.4 48.5,215" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="222.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Primary-Secondary: nút phụ</text>
<text x="64" y="241.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">nhận thêm lượt đọc.</text>
<rect x="20" y="267" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="290" r="11" fill="#16a34a"/>
<polyline points="37.9,290.4 41.7,294.4 48.5,286" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="293.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Primary-Primary: cả hai nhận</text>
<text x="64" y="312.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">ghi, dễ xung đột.</text>
<rect x="8" y="354" width="304" height="191" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="382.2" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Phép tính</text>
<rect x="20" y="399" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="422" r="11" fill="#16a34a"/>
<polyline points="37.9,422.4 41.7,426.4 48.5,418" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="425.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">99,99%: ngừng tối đa 52,6</text>
<text x="64" y="444.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">phút mỗi năm.</text>
<rect x="20" y="470" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="493" r="11" fill="#16a34a"/>
<polyline points="37.9,493.4 41.7,497.4 48.5,489" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="496.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Hai nút độc lập, mỗi nút</text>
<text x="64" y="515.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">90%: được 99%.</text>
<rect x="8" y="557" width="304" height="245" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="585.1" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Mô phỏng mười năm</text>
<rect x="20" y="602" width="280" height="46" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="625" r="11" fill="#16a34a"/>
<polyline points="37.9,625.4 41.7,629.4 48.5,621" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="628.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Một nút: 90,0%.</text>
<rect x="20" y="656" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="679" r="11" fill="#16a34a"/>
<polyline points="37.9,679.4 41.7,683.4 48.5,675" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="682.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Hai nút cùng chạy: 99,0%;</text>
<text x="64" y="701.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">có hỏng chung: 98,2%.</text>
<rect x="20" y="727" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="750" r="11" fill="#16a34a"/>
<polyline points="37.9,750.4 41.7,754.4 48.5,746" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="753.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Chuyển bằng tay 5, 30, 120</text>
<text x="64" y="772.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">phút: 98,4, 95,2, 90,9%.</text>
</g>
</svg>
