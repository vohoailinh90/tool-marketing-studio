<svg xmlns="http://www.w3.org/2000/svg" width="320" height="1310" viewBox="0 0 320 1310" role="img" aria-labelledby="title desc">
<title id="title">Bản sao chỉ đọc: vừa đặt đơn mà không thấy đơn</title>
<desc id="desc">Khung một, bốn mảnh: ứng dụng gửi mọi câu lệnh tới một địa chỉ và không biết có mấy máy; lớp trung gian đưa câu ghi tới bản chính, câu đọc tới bản sao; bản chính nhận mọi lượt ghi và gửi nhật ký sang bản sao; bản sao chỉ đọc và áp dụng nhật ký chậm hơn một chút. Khung hai, trình tự: Alice đặt đơn, bản chính trả lời đã lưu; Alice xem đơn của mình, câu đọc đi tới bản sao, bản sao trả 0 đơn vì chưa nhận kịp. Khung ba, đo trên một máy: bản sao chậm trung vị dưới nửa mili giây, nhưng đọc ngay sau khi ghi thì 45 đến 48 trên 50 lần không thấy; cho người vừa ghi đọc ở bản chính trong 5 giây thì Alice thấy đơn; bật remote_apply thì thấy ngay 50 trên 50, đổi lại mỗi lần ghi phải chờ bản sao.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs>
<rect width="320" height="1310" fill="#f8fafc"/>
<g font-family="DejaVu Sans, Arial, sans-serif" fill="#0f172a">
<text x="16" y="34" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">Bản sao chỉ đọc: vừa đặt</text>
<text x="16" y="58" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">đơn mà không thấy đơn</text>
<rect x="8" y="78" width="304" height="521" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="106.2" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Bốn mảnh</text>
<rect x="20" y="123" width="266" height="107" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="50" cy="176.5" r="18" fill="#1d4ed8"/><g transform="translate(39.2 165.7) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect height="14" rx="2" width="20" x="2" y="3"/><line x1="8" x2="16" y1="21" y2="21"/><line x1="12" x2="12" y1="17" y2="21"/></g>
<text x="78" y="149.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Ứng dụng</text>
<text x="78" y="173.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Gửi mọi câu lệnh tới một</text>
<text x="78" y="192.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">địa chỉ; không biết có</text>
<text x="78" y="212.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">mấy máy.</text>
<rect x="20" y="262" width="266" height="87" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="50" cy="305.5" r="18" fill="#1d4ed8"/><g transform="translate(39.2 294.7) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="19" r="3"/><path d="M9 19h8.5a3.5 3.5 0 0 0 0-7h-11a3.5 3.5 0 0 1 0-7H15"/><circle cx="18" cy="5" r="3"/></g>
<text x="78" y="288.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Lớp trung gian</text>
<text x="78" y="312.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Câu ghi tới bản chính,</text>
<text x="78" y="331.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">câu đọc tới bản sao.</text>
<rect x="20" y="381" width="266" height="87" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="50" cy="424.5" r="18" fill="#1d4ed8"/><g transform="translate(39.2 413.7) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5V19A9 3 0 0 0 21 19V5"/><path d="M3 12A9 3 0 0 0 21 12"/></g>
<text x="78" y="407.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Bản chính</text>
<text x="78" y="431.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Nhận mọi lượt ghi, gửi</text>
<text x="78" y="450.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">nhật ký sang bản sao.</text>
<rect x="20" y="500" width="266" height="87" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="50" cy="543.5" r="18" fill="#1d4ed8"/><g transform="translate(39.2 532.7) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" x2="15.42" y1="13.51" y2="17.49"/><line x1="15.41" x2="8.59" y1="6.51" y2="10.49"/></g>
<text x="78" y="526.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Bản sao</text>
<text x="78" y="550.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Chỉ đọc; áp dụng nhật ký</text>
<text x="78" y="569.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">chậm hơn một chút.</text>
<polyline points="153,232 153,260" fill="none" stroke="#334155" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="153,351 153,379" fill="none" stroke="#334155" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="153,470 153,498" fill="none" stroke="#334155" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="286,305.5 296,305.5 296,543.5 288,543.5" fill="none" stroke="#334155" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="8" y="611" width="304" height="338" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="639.1" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Alice đặt đơn rồi xem ngay</text>
<rect x="20" y="656" width="84" height="86" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
<circle cx="62" cy="678" r="14" fill="#0f766e"/><g transform="translate(53.6 669.6) scale(0.7)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></g>
<text x="62" y="709.9" font-size="15" fill="#0f172a" font-weight="bold" text-anchor="middle">Alice</text>
<rect x="118" y="656" width="84" height="86" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
<circle cx="160" cy="678" r="14" fill="#0f766e"/><g transform="translate(151.6 669.6) scale(0.7)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5V19A9 3 0 0 0 21 19V5"/><path d="M3 12A9 3 0 0 0 21 12"/></g>
<text x="160" y="709.9" font-size="15" fill="#0f172a" font-weight="bold" text-anchor="middle">Bản</text>
<text x="160" y="728.6" font-size="15" fill="#0f172a" font-weight="bold" text-anchor="middle">chính</text>
<rect x="216" y="656" width="84" height="86" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
<circle cx="258" cy="678" r="14" fill="#0f766e"/><g transform="translate(249.6 669.6) scale(0.7)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" x2="15.42" y1="13.51" y2="17.49"/><line x1="15.41" x2="8.59" y1="6.51" y2="10.49"/></g>
<text x="258" y="709.9" font-size="15" fill="#0f172a" font-weight="bold" text-anchor="middle">Bản sao</text>
<polyline points="62,742 62,937" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4 4"/>
<polyline points="160,742 160,937" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4 4"/>
<polyline points="258,742 258,937" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4 4"/>
<text x="111" y="770.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="middle">Đặt đơn</text>
<text x="111" y="789.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="middle">(ghi)</text>
<polyline points="63,803 157,803" fill="none" stroke="#334155" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="111" y="831.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="middle">Đã lưu</text>
<polyline points="159,845 65,845" fill="none" stroke="#334155" stroke-width="1.8" stroke-dasharray="5 4" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="160" y="873.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="middle">Xem đơn của tôi (đọc)</text>
<polyline points="63,887 255,887" fill="none" stroke="#334155" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="160" y="915.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="middle">0 đơn: chưa nhận kịp</text>
<polyline points="257,929 65,929" fill="none" stroke="#334155" stroke-width="1.8" stroke-dasharray="5 4" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="8" y="961" width="304" height="341" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="989.1" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Đo trên một máy</text>
<rect x="20" y="1006" width="280" height="102" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="1029" r="11" fill="#16a34a"/>
<polyline points="37.9,1029.4 41.7,1033.4 48.5,1025" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="1032.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Bản sao chậm dưới 0,5 ms,</text>
<text x="64" y="1051.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">nhưng đọc ngay sau khi ghi:</text>
<text x="64" y="1071.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">45 đến 48 trên 50 lần không</text>
<text x="64" y="1090.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">thấy.</text>
<rect x="20" y="1116" width="280" height="83" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="1139" r="11" fill="#16a34a"/>
<polyline points="37.9,1139.4 41.7,1143.4 48.5,1135" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="1142.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Người vừa ghi đọc ở bản</text>
<text x="64" y="1161.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">chính trong 5 giây: Alice</text>
<text x="64" y="1181.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">thấy đơn.</text>
<rect x="20" y="1207" width="280" height="83" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="1230" r="11" fill="#16a34a"/>
<polyline points="37.9,1230.4 41.7,1234.4 48.5,1226" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="1233.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Bật remote_apply: thấy ngay</text>
<text x="64" y="1252.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">50/50, đổi lại mỗi lần ghi chờ</text>
<text x="64" y="1272.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">bản sao.</text>
</g>
</svg>
