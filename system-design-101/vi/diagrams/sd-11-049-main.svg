<text x="64" y="260.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">bài này.</text>
<rect x="8" y="302" width="304" height="245" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="330.2" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Chín trang của Microsoft</text>
