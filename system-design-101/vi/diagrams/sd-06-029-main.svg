<svg xmlns="http://www.w3.org/2000/svg" width="320" height="1442" viewBox="0 0 320 1442" role="img" aria-labelledby="title desc">
<title id="title">Học bộ đệm qua tám câu hỏi</title>
<desc id="desc">Ba phần. Hiểu bộ đệm: là gì, bản sao tạm của dữ liệu hay đọc, đặt gần hơn nơi gốc; vì sao cần, vì nơi gốc chậm, xa hoặc bị nhiều yêu cầu tranh nhau; đặt ở đâu, ở trình duyệt, CDN, ứng dụng, Redis và trong cơ sở dữ liệu; riêng hay chung, bộ đệm trong tiến trình nhanh nhưng mỗi máy một bản, bộ đệm dùng chung khớp hơn nhưng chậm hơn. Giữ bộ đệm đúng: đầy thì bỏ gì; gốc đổi thì hết hạn hoặc xóa khi ghi; đọc ghi theo chiến lược nào; hỏng ra sao. Thử Redis giới hạn 4 MB: không loại bỏ thì từ chối ghi sau 2908 khóa; bỏ khóa lâu chưa dùng thì giữ đủ 500 khóa nóng; bỏ ngẫu nhiên thì còn 2 trên 500.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs>
<rect width="320" height="1442" fill="#f8fafc"/>
<g font-family="DejaVu Sans, Arial, sans-serif" fill="#0f172a">
<text x="16" y="34" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">Học bộ đệm qua tám câu</text>
<text x="16" y="58" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">hỏi</text>
<text x="16" y="84.2" font-size="15" fill="#475569" font-weight="normal" text-anchor="start">Bản sao có thể cũ, có thể đầy, có thể</text>
<text x="16" y="103.8" font-size="15" fill="#475569" font-weight="normal" text-anchor="start">mất.</text>
<rect x="8" y="123" width="304" height="487" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="151.2" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Hiểu bộ đệm</text>
<rect x="20" y="168" width="280" height="107" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="50" cy="221.5" r="18" fill="#1d4ed8"/><g transform="translate(39.2 210.7) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83z"/><path d="M2 12a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 12"/><path d="M2 17a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 17"/></g>
<text x="78" y="194.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Là gì</text>
<text x="78" y="218.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Bản sao tạm của dữ liệu</text>
<text x="78" y="237.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">hay đọc, đặt gần hơn nơi</text>
<text x="78" y="257.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">gốc.</text>
<rect x="20" y="289" width="280" height="87" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="50" cy="332.5" r="18" fill="#1d4ed8"/><g transform="translate(39.2 321.7) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 14 4-4"/><path d="M3.34 19a10 10 0 1 1 17.32 0"/></g>
<text x="78" y="315.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Vì sao cần</text>
<text x="78" y="339.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Nơi gốc chậm, xa, hoặc bị</text>
<text x="78" y="358.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">nhiều yêu cầu tranh nhau.</text>
<rect x="20" y="390" width="280" height="87" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="50" cy="433.5" r="18" fill="#1d4ed8"/><g transform="translate(39.2 422.7) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></g>
<text x="78" y="416.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Đặt ở đâu</text>
<text x="78" y="440.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Trình duyệt, CDN, ứng</text>
<text x="78" y="459.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">dụng, Redis, cơ sở dữ liệu.</text>
<rect x="20" y="491" width="280" height="107" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="50" cy="544.5" r="18" fill="#1d4ed8"/><g transform="translate(39.2 533.7) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" x2="15.42" y1="13.51" y2="17.49"/><line x1="15.41" x2="8.59" y1="6.51" y2="10.49"/></g>
<text x="78" y="517.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Riêng hay chung</text>
<text x="78" y="541.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Trong tiến trình thì nhanh;</text>
<text x="78" y="560.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">dùng chung thì các máy</text>
<text x="78" y="580.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">thấy một bản.</text>
<rect x="8" y="622" width="304" height="447" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="650.1" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Giữ bộ đệm đúng</text>
<rect x="20" y="667" width="280" height="87" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
<circle cx="50" cy="710.5" r="18" fill="#0f766e"/><g transform="translate(39.2 699.7) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m15 9-6 6"/><path d="m9 9 6 6"/></g>
<text x="78" y="693.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Đầy thì bỏ gì</text>
<text x="78" y="717.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Chính sách loại bỏ quyết</text>
<text x="78" y="736.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">định khóa nào đi.</text>
<rect x="20" y="768" width="280" height="87" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
<circle cx="50" cy="811.5" r="18" fill="#0f766e"/><g transform="translate(39.2 800.7) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="10" x2="14" y1="2" y2="2"/><line x1="12" x2="15" y1="14" y2="11"/><circle cx="12" cy="14" r="8"/></g>
<text x="78" y="794.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Gốc đổi thì sao</text>
<text x="78" y="818.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Hết hạn sau một thời gian,</text>
<text x="78" y="837.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">hoặc xóa khi ghi.</text>
<rect x="20" y="869" width="280" height="87" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
<circle cx="50" cy="912.5" r="18" fill="#0f766e"/><g transform="translate(39.2 901.7) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect height="8" rx="2" width="8" x="3" y="3"/><path d="M7 11v4a2 2 0 0 0 2 2h4"/><rect height="8" rx="2" width="8" x="13" y="13"/></g>
<text x="78" y="895.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Đọc ghi thế nào</text>
<text x="78" y="919.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Chiến lược đọc ghi: ai nạp,</text>
<text x="78" y="938.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">ai ghi xuống gốc.</text>
<rect x="20" y="970" width="280" height="87" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
<circle cx="50" cy="1013.5" r="18" fill="#0f766e"/><g transform="translate(39.2 1002.7) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/></g>
<text x="78" y="996.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Hỏng ra sao</text>
<text x="78" y="1020.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Bản cũ, mất dữ liệu, dồn</text>
<text x="78" y="1039.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">tải về nơi gốc.</text>
<rect x="8" y="1081" width="304" height="353" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="1109.1" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Thử Redis giới hạn 4 MB</text>
<rect x="20" y="1126" width="280" height="83" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="1149" r="11" fill="#16a34a"/>
<polyline points="37.9,1149.4 41.7,1153.4 48.5,1145" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="1152.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">500 khóa nóng được đọc lại</text>
<text x="64" y="1171.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">liên tục, rồi ghi thêm 20 000</text>
<text x="64" y="1191.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">khóa.</text>
<rect x="20" y="1217" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="1240" r="11" fill="#16a34a"/>
<polyline points="37.9,1240.4 41.7,1244.4 48.5,1236" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="1243.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Không loại bỏ: từ chối ghi</text>
<text x="64" y="1262.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">thêm sau 2908 khóa.</text>
<rect x="20" y="1288" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="1311" r="11" fill="#16a34a"/>
<polyline points="37.9,1311.4 41.7,1315.4 48.5,1307" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="1314.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Bỏ khóa lâu chưa dùng: giữ</text>
<text x="64" y="1333.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">đủ 500/500 khóa nóng.</text>
<rect x="20" y="1359" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="1382" r="11" fill="#16a34a"/>
<polyline points="37.9,1382.4 41.7,1386.4 48.5,1378" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="1385.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Bỏ ngẫu nhiên: còn 2/500</text>
<text x="64" y="1404.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">khóa nóng, đọc trúng 28,3%.</text>
</g>
</svg>
