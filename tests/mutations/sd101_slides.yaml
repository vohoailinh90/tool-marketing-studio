# Mutation manifest — see scripts/mutation_check.py
#
# A passing test proves nothing on its own. These break each rule of the slide-deck claims in turn and require the
# named test to fail. A mutation that SURVIVES means the test guards nothing.

target: scripts/sd101_slides.py
note: The deck record is what stops two sessions building one lesson's slides. Each entry switches one rule off and names the test that must notice.
mutations:
- label: the other sessions' claims are never read from the remote
  find: "        names = remote_branches(context)\n        for (name, lesson_id), text in read_remote"
  replace: "        names = []\n        for (name, lesson_id), text in read_remote"
  test: tests.test_sd101_slides.ClaimTests.test_a_published_claim_keeps_every_other_session_off_the_lesson
- label: a record copied into another branch is counted as that branch's claim
  find: "elif name == base or holding.owner == name:"
  replace: "else:"
  test: tests.test_sd101_slides.ClaimTests.test_a_copy_of_a_claim_inherited_by_another_branch_is_not_a_claim
- label: the later of two claims wins instead of the earlier
  find: '    return (-first.generation, first.claimed_at or "", first.owner) < (-second.generation, second.claimed_at or "", second.owner)'
  replace: '    return (-first.generation, first.claimed_at or "", first.owner) > (-second.generation, second.claimed_at or "", second.owner)'
  test: tests.test_sd101_slides.ClaimTests.test_the_earlier_claim_wins_even_when_it_is_pushed_second
- label: a takeover does not beat the claim it took over
  find: "    if second.owner in first.taken_from:\n        return True\n    if first.owner in second.taken_from:\n        return False\n    return (-first.generation,"
  replace: "    return (first.generation,"
  test: tests.test_sd101_slides.LeaseTests.test_a_takeover_beats_the_claim_it_took_over_even_if_the_old_owner_wakes_up
- label: a claim never goes stale
  find: "    return moment - beat > datetime.timedelta(hours=LEASE_HOURS)"
  replace: "    return moment - beat < datetime.timedelta(hours=LEASE_HOURS)"
  test: tests.test_sd101_slides.LeaseTests.test_touching_keeps_a_claim_alive
- label: a stale claim is taken over without asking
  find: "    if state == \"stale\" and holding.owner != context.me and not take_stale:"
  replace: "    if False:"
  test: tests.test_sd101_slides.LeaseTests.test_a_stale_claim_blocks_nobody_until_it_is_taken_on_purpose
- label: a finished deck can be claimed again
  find: "    if state == \"done\":\n        return f\"{lesson_id}: already built by {holding.owner}\""
  replace: "    if False:\n        return f\"{lesson_id}: already built by {holding.owner}\""
  test: tests.test_sd101_slides.FinishTests.test_a_finished_deck_cannot_be_claimed_again
- label: a claim that was never pushed counts as published
  find: "    if not published:\n        return f\"{lesson_id}: your claim is not on"
  replace: "    if False:\n        return f\"{lesson_id}: your claim is not on"
  test: tests.test_sd101_slides.ClaimTests.test_a_claim_that_was_never_pushed_does_not_verify
- label: the default branch can be pushed
  find: "        if context.me == base:"
  replace: "        if False:"
  test: tests.test_sd101_slides.ClaimTests.test_the_default_branch_is_never_pushed
- label: a record may name another lesson
  find: "    if record.get(\"id\") != lesson_id:"
  replace: "    if False:"
  test: tests.test_sd101_slides.FolderTests.test_a_record_for_another_lesson_or_with_a_stray_key_is_reported
- label: the size of an exported PNG is not checked
  find: "            if name.endswith(\".png\") and png_size(path) != (width, height):"
  replace: "            if False:"
  test: tests.test_sd101_slides.FolderTests.test_a_missing_slide_or_a_wrong_size_is_reported
- label: exports not recorded as done may sit in the folder
  find: "            problems.append(f\"{name} is not expected here\" + (\"\" if exported else \" (exports are not recorded as done)\"))"
  replace: "            pass"
  test: tests.test_sd101_slides.FolderTests.test_pending_exports_leave_only_the_record
- label: a timestamp YAML turned into a datetime is not read back as text
  find: "        if isinstance(data.get(key), datetime.datetime):  # YAML reads"
  replace: "        if False:  # YAML reads"
  test: tests.test_sd101_slides.FolderTests.test_a_hand_written_timestamp_without_quotes_is_still_a_timestamp
- label: a claim its owner released is kept alive by the copy merged into the default branch
  find: "                if holding.status == \"doing\" and holding.owner in names and holding.owner != base:"
  replace: "                if False:"
  test: tests.test_sd101_slides.ClaimTests.test_a_claim_released_on_its_own_branch_is_not_kept_alive_by_the_copy_merged_into_main
- label: a record that fails validation is ignored instead of holding its lesson
  find: "                warnings.append(f\"{where}: {lesson_id}/{SLIDES_DIR}/{RECORD} {'; '.join(holding.problems)}\")"
  replace: "                warnings.append(f\"{where}: {lesson_id}/{SLIDES_DIR}/{RECORD} {'; '.join(holding.problems)}\")\n                continue"
  test: tests.test_sd101_slides.ClaimTests.test_a_done_record_edited_into_an_invalid_one_still_holds_its_lesson
- label: a record that cannot be read does not block its lesson
  find: "    invalid = [holding for holding in holdings if holding.status == \"invalid\"]\n    if invalid:\n        return \"invalid\", invalid[0]\n"
  replace: ""
  test: tests.test_sd101_slides.ClaimTests.test_a_record_that_cannot_be_read_blocks_its_lesson_until_it_is_fixed
- label: a generation without taken_from is accepted
  find: "    elif (\"taken_from\" in record) != (\"generation\" in record):"
  replace: "    elif False:"
  test: tests.test_sd101_slides.FolderTests.test_generation_and_taken_from_come_together_and_never_name_the_owner
- label: release leaves other files behind in slides/
  find: "        if stray:"
  replace: "        if False:"
  test: tests.test_sd101_slides.FinishTests.test_release_refuses_to_leave_other_files_behind_in_slides
- label: my own stale claim needs a takeover when an older stale claim exists
  find: "    if state == \"stale\" and not any(other.owner == context.me for other in found) and not take_stale:"
  replace: "    if state == \"stale\" and holding.owner != context.me and not take_stale:"
  test: tests.test_sd101_slides.LeaseTests.test_my_own_stale_claim_can_be_claimed_again_when_an_older_stale_claim_exists
