status: draft
format: portrait
series: "Office tools · #2"
link: survey
slides:
  - layout: cover
    emoji: "🛠️"
    eyebrow: "The story behind it"
    title: "Why I built my own tool for **organising team events**"
    subtitle: "Not because I love coding. Because I was tired of one spreadsheet."

  - layout: timeline
    title: "From a spreadsheet to an app"
    items:
      - {when: "At first", text: "One spreadsheet: names, emails, a yes/no column — and lots of hand-coloured cells."}
      - {when: "Then", text: "Columns for money, for round 2, for the farewell gift. Harder to read every time."}
      - {when: "The problem", text: "Replies scattered across the inbox. Every update meant **reading it all again**."}
      - {when: "The decision", text: "Let **Outlook** — already approved at work — do the repetitive part."}

  - layout: quote
    text: "The best tool is the one you **don't need IT approval** for."
    author: "Design rule #1"
    role: "set on day one"

  - layout: checklist
    title: "4 rules I kept while building it"
    items:
      - "Runs on the **Outlook Desktop** you have — no API key, no app registration"
      - "Data stays **on your PC** (one SQLite file), never sent anywhere"
      - "Recipients just **click one button**: Yes / No / Maybe"
      - "Emails in **English, Japanese, Vietnamese**, or bilingual Japanese + English"

  - layout: cta
    emoji: "👀"
    title: "Next: how it works in **7 steps**"
    text: "Which part do you most want to see? Tell me in the comments."

platforms:
  facebook:
    caption: |
      "Why not just use Google Forms?" — fair question 🤔

      At work, everyone lives in Outlook. Invites arrive in Outlook, replies go back to Outlook, the calendar is in Outlook. Every extra tool you ask people to open is one more reason to forget to answer.

      So when my event spreadsheet grew past the point of readable, I went the other way: let Outlook itself do the repetitive part — invites with vote buttons, reading the replies, reminding the people who haven't answered, tracking the money.

      The 4 rules I've kept from day one are in the pictures. Which one matters most to you?
    first_comment: |
      📋 If you organise team events, a 3-minute survey would help me a lot: {link}
    hashtags: [buildinpublic, Outlook, automation, productivity, officelife]
