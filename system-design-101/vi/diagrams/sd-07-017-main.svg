<text x="16" y="60.2" font-size="15" fill="#475569" font-weight="normal" text-anchor="start">Cùng an toàn, nhưng thông tin thẻ</text>
<text x="16" y="79.8" font-size="15" fill="#475569" font-weight="normal" text-anchor="start">nằm ở nơi khác nhau.</text>
<rect x="8" y="99" width="304" height="273" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
