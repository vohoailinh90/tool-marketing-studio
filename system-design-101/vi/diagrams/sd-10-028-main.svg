<svg xmlns="http://www.w3.org/2000/svg" width="320" height="1574" viewBox="0 0 320 1574" role="img" aria-labelledby="title desc">
<title id="title">Mười nguyên tắc viết mã tốt</title>
<desc id="desc">Ba nhóm thẻ và một khung ghi nhớ, theo mười nguyên tắc đánh số. Đọc được và bền: một theo quy ước, tên gọi rõ và hằng số viết hoa; hai chú thích nói vì sao; ba báo lỗi thay vì nuốt lỗi; bốn mỗi hàm một việc, thêm loại thành viên bằng cách thêm dữ liệu. Dễ kiểm thử và dễ đổi: năm hàm thuần với ba ca kiểm thử; sáu một hàm che giấu bảng giảm giá; bảy hai loại thành viên chỉ cần một bảng, không cần lớp; tám bỏ biến toàn cục. Giữ lâu dài: chín viết kiểm thử rồi đổi từng bước nhỏ; mười kiểm đầu vào ở biên. Khung cuối nêu ba điều cần nhớ.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs>
<rect width="320" height="1574" fill="#f8fafc"/>
<g font-family="DejaVu Sans, Arial, sans-serif" fill="#0f172a">
<text x="16" y="34" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">Mười nguyên tắc viết mã</text>
<text x="16" y="58" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">tốt</text>
<text x="16" y="84.2" font-size="15" fill="#475569" font-weight="normal" text-anchor="start">Mười nguyên tắc, một hàm tính phí</text>
<text x="16" y="103.8" font-size="15" fill="#475569" font-weight="normal" text-anchor="start">viết lại.</text>
<rect x="8" y="123" width="304" height="430" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="151.2" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Đọc được và bền</text>
<rect x="20" y="168" width="280" height="88" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="50" cy="212" r="18" fill="#1d4ed8"/><g transform="translate(39.2 201.2) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v16"/><path d="M20.001 19A2 2 0 0022 17V5a2 2 0 00-1.999-2L16 3.002A5 5 0 0012 5a5 5 0 00-4-2H4a2 2 0 00-2 2v12a2 2 0 001.999 2H8a5 5 0 014 2 5 5 0 014-2z"/></g>
<text x="78" y="194.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">1 · Theo quy ước viết</text>
<text x="78" y="214.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">mã</text>
<text x="78" y="238.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Tên rõ, hằng số viết hoa.</text>
<rect x="20" y="270" width="280" height="88" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="50" cy="314" r="18" fill="#1d4ed8"/><g transform="translate(39.2 303.2) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 22a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.704.706l3.588 3.588A2.4 2.4 0 0 1 20 8v12a2 2 0 0 1-2 2z"/><path d="M14 2v5a1 1 0 0 0 1 1h5"/><path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/></g>
<text x="78" y="296.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">2 · Tài liệu và chú</text>
<text x="78" y="316.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">thích</text>
<text x="78" y="340.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Chú thích nói vì sao.</text>
<rect x="20" y="372" width="280" height="68" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="50" cy="406" r="18" fill="#1d4ed8"/><g transform="translate(39.2 395.2) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/></g>
<text x="78" y="398.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">3 · Vững vàng</text>
<text x="78" y="422.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Báo lỗi, không nuốt lỗi.</text>
<rect x="20" y="454" width="280" height="87" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="50" cy="497.5" r="18" fill="#1d4ed8"/><g transform="translate(39.2 486.7) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15.39 4.39a1 1 0 0 0 1.68-.474 2.5 2.5 0 1 1 3.014 3.015 1 1 0 0 0-.474 1.68l1.683 1.682a2.414 2.414 0 0 1 0 3.414L19.61 15.39a1 1 0 0 1-1.68-.474 2.5 2.5 0 1 0-3.014 3.015 1 1 0 0 1 .474 1.68l-1.683 1.682a2.414 2.414 0 0 1-3.414 0L8.61 19.61a1 1 0 0 0-1.68.474 2.5 2.5 0 1 1-3.014-3.015 1 1 0 0 0 .474-1.68l-1.683-1.682a2.414 2.414 0 0 1 0-3.414L4.39 8.61a1 1 0 0 1 1.68.474 2.5 2.5 0 1 0 3.014-3.015 1 1 0 0 1-.474-1.68l1.683-1.682a2.414 2.414 0 0 1 3.414 0z"/></g>
<text x="78" y="480.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">4 · Nguyên tắc SOLID</text>
<text x="78" y="504.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Một việc; thêm loại bằng</text>
<text x="78" y="523.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">dữ liệu.</text>
<rect x="8" y="565" width="304" height="449" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="593.1" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Dễ kiểm thử và dễ đổi</text>
<rect x="20" y="610" width="280" height="87" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
<circle cx="50" cy="653.5" r="18" fill="#0f766e"/><g transform="translate(39.2 642.7) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20v-9"/><path d="M14 7a4 4 0 0 1 4 4v3a6 6 0 0 1-12 0v-3a4 4 0 0 1 4-4z"/><path d="M14.12 3.88 16 2"/><path d="M21 21a4 4 0 0 0-3.81-4"/><path d="M21 5a4 4 0 0 1-3.55 3.97"/><path d="M22 13h-4"/><path d="M3 21a4 4 0 0 1 3.81-4"/><path d="M3 5a4 4 0 0 0 3.55 3.97"/><path d="M6 13H2"/><path d="m8 2 1.88 1.88"/><path d="M9 7.13V6a3 3 0 1 1 6 0v1.13"/></g>
<text x="78" y="636.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">5 · Dễ kiểm thử</text>
<text x="78" y="660.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Hàm thuần, ba ca kiểm</text>
<text x="78" y="679.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">thử.</text>
<rect x="20" y="711" width="280" height="87" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
<circle cx="50" cy="754.5" r="18" fill="#0f766e"/><g transform="translate(39.2 743.7) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83z"/><path d="M2 12a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 12"/><path d="M2 17a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 17"/></g>
<text x="78" y="737.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">6 · Trừu tượng</text>
<text x="78" y="761.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Một hàm che giấu bảng</text>
<text x="78" y="780.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">giảm giá.</text>
<rect x="20" y="812" width="280" height="88" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
<circle cx="50" cy="856" r="18" fill="#0f766e"/><g transform="translate(39.2 845.2) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.97 12.92A2 2 0 0 0 2 14.63v3.24a2 2 0 0 0 .97 1.71l3 1.8a2 2 0 0 0 2.06 0L12 19v-5.5l-5-3-4.03 2.42Z"/><path d="m7 16.5-4.74-2.85"/><path d="m7 16.5 5-3"/><path d="M7 16.5v5.17"/><path d="M12 13.5V19l3.97 2.38a2 2 0 0 0 2.06 0l3-1.8a2 2 0 0 0 .97-1.71v-3.24a2 2 0 0 0-.97-1.71L17 10.5l-5 3Z"/><path d="m17 16.5-5-3"/><path d="m17 16.5 4.74-2.85"/><path d="M17 16.5v5.17"/><path d="M7.97 4.42A2 2 0 0 0 7 6.13v4.37l5 3 5-3V6.13a2 2 0 0 0-.97-1.71l-3-1.8a2 2 0 0 0-2.06 0l-3 1.8Z"/><path d="M12 8 7.26 5.15"/><path d="m12 8 4.74-2.85"/><path d="M12 13.5V8"/></g>
<text x="78" y="838.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">7 · Mẫu thiết kế, đừng</text>
<text x="78" y="858.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">quá tay</text>
<text x="78" y="882.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Hai loại chỉ cần một bảng.</text>
<rect x="20" y="914" width="280" height="88" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
<circle cx="50" cy="958" r="18" fill="#0f766e"/><g transform="translate(39.2 947.2) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="16" r="1"/><rect height="12" rx="2" width="18" x="3" y="10"/><path d="M7 10V7a5 5 0 0 1 10 0v3"/></g>
<text x="78" y="940.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">8 · Bớt phụ thuộc toàn</text>
<text x="78" y="960.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">cục</text>
<text x="78" y="984.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Bỏ biến toàn cục fee.</text>
<rect x="8" y="1026" width="304" height="246" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="1054.1" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Giữ lâu dài</text>
<rect x="20" y="1071" width="280" height="107" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
<circle cx="50" cy="1124.5" r="18" fill="#b45309"/><g transform="translate(39.2 1113.7) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></g>
<text x="78" y="1097.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">9 · Tái cấu trúc liên</text>
<text x="78" y="1117.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">tục</text>
<text x="78" y="1141.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Kiểm thử trước, đổi từng</text>
<text x="78" y="1160.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">bước nhỏ.</text>
<rect x="20" y="1192" width="280" height="68" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
<circle cx="50" cy="1226" r="18" fill="#b45309"/><g transform="translate(39.2 1215.2) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect height="11" rx="2" ry="2" width="18" x="3" y="11"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></g>
<text x="78" y="1218.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">10 · Bảo mật là ưu tiên</text>
<text x="78" y="1242.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Kiểm đầu vào ở biên.</text>
<rect x="8" y="1284" width="304" height="282" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="1312.1" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Nhớ gì</text>
<rect x="20" y="1329" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="1352" r="11" fill="#16a34a"/>
<polyline points="37.9,1352.4 41.7,1356.4 48.5,1348" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="1355.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Mỗi nguyên tắc hiện ra ở</text>
<text x="64" y="1374.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">một chỗ sửa cụ thể.</text>
<rect x="20" y="1400" width="280" height="83" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="1423" r="11" fill="#16a34a"/>
<polyline points="37.9,1423.4 41.7,1427.4 48.5,1419" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="1426.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Ví dụ nhỏ: nhận định về</text>
<text x="64" y="1445.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">SOLID và mẫu thiết kế là của</text>
<text x="64" y="1465.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">bài.</text>
<rect x="20" y="1491" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="1514" r="11" fill="#16a34a"/>
<polyline points="37.9,1514.4 41.7,1518.4 48.5,1510" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="1517.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Các nguyên tắc nâng đỡ</text>
<text x="64" y="1536.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">nhau.</text>
</g>
</svg>
