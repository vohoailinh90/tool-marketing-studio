<svg xmlns="http://www.w3.org/2000/svg" width="320" height="554" viewBox="0 0 320 554" role="img" aria-labelledby="title desc"><title id="title">Từ hợp đồng đến kết quả từng phần</title><desc id="desc">Ví dụ summary cho phép null và resolver gặp lỗi; title vẫn lấy được. Không phải mô hình triển khai ba dịch vụ.</desc><rect width="320" height="554" rx="16" fill="#f8fafc"/><g font-family="Arial,sans-serif" fill="#0f172a"><rect x="12" y="12" width="296" height="158" rx="12" fill="#dbeafe"/><text x="24" y="42" font-size="19">Schema cho phép</text><text x="24" y="75" font-size="16">title: String!</text><text x="24" y="108" font-size="16">summary: String</text><text x="24" y="141" font-size="16">summary có thể null</text><rect x="12" y="188" width="296" height="158" rx="12" fill="#dcfce7"/><text x="24" y="218" font-size="19">Thực thi truy vấn</text><text x="24" y="251" font-size="16">book(id: 7) {</text><text x="24" y="284" font-size="16">  title summary</text><text x="24" y="317" font-size="16">}  → resolver lấy giá trị</text><rect x="12" y="364" width="296" height="158" rx="12" fill="#fef3c7"/><text x="24" y="394" font-size="19">Kết quả khi summary lỗi</text><text x="24" y="427" font-size="16">data: giữ title</text><text x="24" y="460" font-size="16">summary: null</text><text x="24" y="493" font-size="16">errors: lỗi đọc tóm tắt</text></g></svg>
