<svg xmlns="http://www.w3.org/2000/svg" width="320" height="1360" viewBox="0 0 320 1360" role="img" aria-labelledby="title desc">
<title id="title">Bộ nhớ đệm ở khắp nơi</title>
<desc id="desc">Ba khung. Phía người dùng: trình duyệt giữ câu trả lời riêng cho một người; CDN giữ bản sao dùng chung ở gần người dùng; proxy ngược có thể trả lời thay máy chủ. Phía máy chủ: dịch vụ giữ dữ liệu trong bộ nhớ của chính nó; Redis là bộ đệm dùng chung giữa nhiều dịch vụ; Kafka giữ nhật ký theo thời hạn để người đọc chậm đuổi kịp; chỉ mục tìm kiếm là bản sao sắp xếp lại để tìm theo chữ. Bên trong cơ sở dữ liệu: vùng đệm giữ các trang vừa đọc, lần đầu đọc ngoài, lần sau trúng vùng đệm, và vì mọi lần ghi sửa thẳng vào đó nên nó không cũ; materialized view lưu sẵn kết quả và chỉ đúng tới lần làm mới gần nhất. Câu hỏi cho mọi bản sao giữ riêng: được phép cũ bao lâu?</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs>
<rect width="320" height="1360" fill="#f8fafc"/>
<g font-family="DejaVu Sans, Arial, sans-serif" fill="#0f172a">
<text x="16" y="34" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">Bộ nhớ đệm ở khắp nơi</text>
<text x="16" y="60.2" font-size="15" fill="#475569" font-weight="normal" text-anchor="start">Mỗi tầng trả lời từ một bản sao; bản</text>
<text x="16" y="79.8" font-size="15" fill="#475569" font-weight="normal" text-anchor="start">sao giữ riêng thì có thể đã cũ.</text>
<rect x="8" y="99" width="304" height="402" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="127.2" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Phía người dùng</text>
<rect x="20" y="144" width="280" height="107" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="50" cy="197.5" r="18" fill="#1d4ed8"/><g transform="translate(39.2 186.7) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></g>
<text x="78" y="170.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Trình duyệt</text>
<text x="78" y="194.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Bộ đệm riêng của một</text>
<text x="78" y="213.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">người, theo lời dặn trong</text>
<text x="78" y="233.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">header.</text>
<rect x="20" y="283" width="280" height="87" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="50" cy="326.5" r="18" fill="#1d4ed8"/><g transform="translate(39.2 315.7) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect height="6" rx="1" width="6" x="16" y="16"/><rect height="6" rx="1" width="6" x="2" y="16"/><rect height="6" rx="1" width="6" x="9" y="2"/><path d="M5 16v-3a1 1 0 0 1 1-1h12a1 1 0 0 1 1 1v3"/><path d="M12 12V8"/></g>
<text x="78" y="309.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">CDN</text>
<text x="78" y="333.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Bản sao dùng chung, đặt</text>
<text x="78" y="352.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">gần người dùng.</text>
<rect x="20" y="402" width="280" height="87" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="50" cy="445.5" r="18" fill="#1d4ed8"/><g transform="translate(39.2 434.7) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18"/><path d="m19 8 3 8a5 5 0 0 1-6 0zV7"/><path d="M3 7h1a17 17 0 0 0 8-2 17 17 0 0 0 8 2h1"/><path d="m5 8 3 8a5 5 0 0 1-6 0zV7"/><path d="M7 21h10"/></g>
<text x="78" y="428.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Proxy ngược</text>
<text x="78" y="452.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Có thể trả lời thay máy chủ</text>
<text x="78" y="471.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">phía sau.</text>
<polyline points="160,253 160,281" fill="none" stroke="#334155" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="160,372 160,400" fill="none" stroke="#334155" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="8" y="513" width="304" height="506" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="541.1" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Phía máy chủ</text>
<rect x="20" y="558" width="280" height="126" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
<circle cx="50" cy="621" r="18" fill="#0f766e"/><g transform="translate(39.2 610.2) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect height="8" rx="2" ry="2" width="20" x="2" y="2"/><rect height="8" rx="2" ry="2" width="20" x="2" y="14"/><line x1="6" x2="6.01" y1="6" y2="6"/><line x1="6" x2="6.01" y1="18" y2="18"/></g>
<text x="78" y="584.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Dịch vụ</text>
<text x="78" y="608.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Bộ nhớ của chính tiến</text>
<text x="78" y="627.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">trình: nhanh nhất, nhưng</text>
<text x="78" y="647.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">mỗi máy giữ một bản</text>
<text x="78" y="666.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">riêng.</text>
<rect x="20" y="698" width="280" height="87" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
<circle cx="50" cy="741.5" r="18" fill="#0f766e"/><g transform="translate(39.2 730.7) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15.914 4a1.5 1.5 0 00-2.474-1.561l-9 9A1.5 1.5 0 005.5 14h4.002a.5.5 0 01.471.666L8.086 20a1.5 1.5 0 002.475 1.56l9-9A1.5 1.5 0 0018.5 10h-3.997a.5.5 0 01-.472-.667z"/></g>
<text x="78" y="724.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Redis</text>
<text x="78" y="748.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Bộ đệm dùng chung giữa</text>
<text x="78" y="767.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">nhiều dịch vụ.</text>
<rect x="20" y="799" width="280" height="107" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
<circle cx="50" cy="852.5" r="18" fill="#0f766e"/><g transform="translate(39.2 841.7) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></g>
<text x="78" y="825.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Kafka</text>
<text x="78" y="849.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Giữ nhật ký theo thời hạn;</text>
<text x="78" y="868.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">người đọc chậm vẫn đuổi</text>
<text x="78" y="888.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">kịp.</text>
<rect x="20" y="920" width="280" height="87" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
<circle cx="50" cy="963.5" r="18" fill="#0f766e"/><g transform="translate(39.2 952.7) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21 21-4.34-4.34"/><circle cx="11" cy="11" r="8"/></g>
<text x="78" y="946.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Chỉ mục tìm kiếm</text>
<text x="78" y="970.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Bản sao sắp xếp lại để tìm</text>
<text x="78" y="989.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">theo chữ.</text>
<rect x="8" y="1031" width="304" height="321" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="1059.1" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Bên trong cơ sở dữ liệu</text>
<rect x="20" y="1076" width="280" height="102" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="1099" r="11" fill="#16a34a"/>
<polyline points="37.9,1099.4 41.7,1103.4 48.5,1095" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="1102.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Vùng đệm giữ các trang vừa</text>
<text x="64" y="1121.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">đọc: lần đầu đọc ngoài, lần</text>
<text x="64" y="1141.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">sau trúng. Ghi sửa thẳng vào</text>
<text x="64" y="1160.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">đó nên không cũ.</text>
<rect x="20" y="1186" width="280" height="83" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="1209" r="11" fill="#16a34a"/>
<polyline points="37.9,1209.4 41.7,1213.4 48.5,1205" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="1212.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Materialized view lưu sẵn kết</text>
<text x="64" y="1231.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">quả, chỉ đúng tới lần làm</text>
<text x="64" y="1251.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">mới gần nhất.</text>
<rect x="20" y="1277" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="1300" r="11" fill="#16a34a"/>
<polyline points="37.9,1300.4 41.7,1304.4 48.5,1296" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="1303.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Hỏi mọi bản sao giữ riêng:</text>
<text x="64" y="1322.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">được phép cũ bao lâu?</text>
</g>
</svg>
