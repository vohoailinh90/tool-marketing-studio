# Language-neutral FACTS about the tool. Every post, in every language, may only claim
# what is written here. Per-language positioning lives in positioning/<lang>.yaml.
# Source: vohoailinh90/Email_Bridge (folder meeting_scheduler_standalone/, docs/MEETING_SCHEDULER_DESIGN.md,
# docs/agents/pipeline/2026-09-graph-getschedule.md, src/meetingscheduler.py), read 2026-10-11.
slug: meeting-scheduler
name: Meeting Scheduler
repo: vohoailinh90/Email_Bridge
status: beta          # works for its author on real calendars; not packaged for other companies
brand:
  emoji: "🗓️"
  accent: "#0f6cbd"

what_it_is: >-
  A local app (Python backend on 127.0.0.1 + web page) that reads the free/busy of every invitee through
  Microsoft Graph, finds the earliest slot where everyone is free inside their own working hours and time
  zone, then opens a pre-filled meeting window in Outlook for the user to review and send by hand.

requirements:
  - Windows with Outlook desktop (classic) for the "open draft" button
  - A Microsoft 365 / Exchange Online account; an Entra ID app registration with Delegated Calendars.Read approved by the organisation's IT, plus its tenant id, client id and client secret
  - Python 3.11+ with httpx and pywin32, or the packaged MeetingScheduler.exe (PyInstaller, built on Windows)

features:            # each is in the repo docs/README
  - id: multi-invitee
    fact: Invitees are added as rows; one row accepts several addresses separated by comma, semicolon or space; duplicates are removed
  - id: per-member-tz
    fact: Each row has its own time zone (Asia/Tokyo, Europe/Prague, UTC or a custom UTC offset) and its own working hours (default 09:00-18:00, Monday-Friday)
  - id: graph-freebusy
    fact: Free/busy comes from Microsoft Graph getSchedule; requests are split into batches of at most 20 schedules
  - id: best-slot
    fact: Finds the earliest slot where every resolved invitee is free inside their own working hours
  - id: fallback
    fact: If no slot fits everyone, shows up to 5 alternatives ranked by how many people are free, with a free / busy / unknown badge per person
  - id: unresolved
    fact: People whose calendar cannot be read are listed as unknown and are not counted as free
  - id: draft-only
    fact: Opens an Outlook meeting draft with time and invitees filled in; the app never sends or saves it
  - id: ui-languages
    fact: UI in Vietnamese, English and Japanese
  - id: standalone
    fact: Can be shared as a single folder; each colleague signs in with their own account

claims:              # anything a post states as a benefit must be one of these
  - id: never-sends
    text: The app never sends the invitation; the user reviews the Outlook draft and clicks Send
    evidence: meeting_scheduler_standalone/README.md; MEETING_SCHEDULER_DESIGN.md section 4.5
    verified: true
  - id: local-only
    text: The server binds to 127.0.0.1 and the token is kept in memory only
    evidence: README (architecture); 2026-09-graph-getschedule.md section 4.1
    verified: true
  - id: matches-outlook
    text: On the author's real tenant, results matched Outlook's Scheduling Assistant for two real colleagues over 7 days
    evidence: 2026-09-graph-getschedule.md section 11 (author's own check, small sample)
    verified: true
  - id: com-rejected
    text: An earlier Outlook COM FreeBusy approach reported "free" over a real recurring meeting and was dropped
    evidence: 2026-08-meeting-freebusy-com-boundary.md
    verified: true
  - id: speed
    text: "Slot search is fast: 30 invitees over 60 days took about 0.3 s (12 invitees: 0.12 s) on synthetic calendars"
    evidence: measured 2026-10-11 by calling find_best_slot() from src/meetingscheduler.py; excludes the Graph network call
    verified: true
  - id: overlap-arithmetic
    text: "With everyone at 09:00-18:00 Mon-Fri and empty calendars, Tokyo + Prague share only one 60-minute start per day in winter (17:00 JST = 09:00 CET), none for 90 minutes; in summer (CEST) three 60-minute starts per day. Adding Los Angeles or New York leaves no common slot"
    evidence: measured 2026-10-11 with the repo's find_best_slot / _member_available on synthetic calendars
    verified: true
  - id: team-size
    text: Works for 10+ invitees
    evidence: batching code and tests exist, but not tested by the author on a real 10+ person multi-country meeting
    verified: false

limitations:         # say these openly: they decide who should NOT try it
  - Needs IT approval of a Graph app registration; it will not work on a personal account or a company that blocks it
  - Invitees outside your organisation usually cannot be read and show as unknown; the best slot then ignores them
  - Working hours are a hard yes/no; no lunch break, no public holidays, no per-country weekend, no "required vs optional" invitee
  - Results are shown in JST only, not in each invitee's local time
  - With people on three continents the strict window usually leaves no slot for everyone; the alternatives are ranked by headcount, not by who gets a night-time meeting
  - Windows + Outlook desktop only for the draft button; searching is limited to 60 days and 30-minute steps

story_to_confirm:    # posts 02-story use these; the author must confirm or rewrite them
  - The author has to invite colleagues in Japan and the Czech Republic, sometimes customers (design doc, section 1)
  - Opening each person's calendar and converting time zones by hand was slow and error-prone with a 7-8 hour offset (design doc)
  - The first two ways of reading calendars were tried and rejected on real data before Graph worked

commercial_readiness: # what must exist before charging money
  - No app-registration step for the customer (or a hosted sign-in) - today every company's IT must approve the app
  - Signed installer instead of a PyInstaller exe that needs Python/pywin32 knowledge
  - Support for non-Outlook calendars (Google) if the market is not Microsoft-only
  - Confirmation that the author may market a tool built at their employer (not a technical item)

pricing_hypotheses:  # to test in the survey, not to announce
  - Free for individuals, paid team licence for departments that coordinate across countries
