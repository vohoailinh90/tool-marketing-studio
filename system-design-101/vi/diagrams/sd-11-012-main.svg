<text x="24" y="75" font-size="18" font-weight="bold">Latency đầu cuối</text>
<text x="24" y="104" font-size="18">Định tuyến + init + handler</text>
<text x="24" y="130" font-size="18">Cộng thời gian gọi phụ thuộc</text>
<rect x="12" y="162" width="336" height="102" rx="12" fill="#dcfce7" stroke="#64748b"/>
