    label: "必須は一般メンバー8人だけにして、管理職は来られれば歓迎にする"
    caption: "管理職2人のうち少なくとも1人にも出てほしい場合は約20%。同じ国なら61%と35%です。"

  - layout: stat
    eyebrow: "方法2：短くする"
    before: "3%"
    after: "36%"
    label: "60分の会議を30分にする"
    caption: "同じ条件で、10人全員が空いている枠が見つかる確率です。同じ国なら65%です。"

  - layout: stat
    eyebrow: "方法3：探す期間を延ばす"
    before: "3%"
