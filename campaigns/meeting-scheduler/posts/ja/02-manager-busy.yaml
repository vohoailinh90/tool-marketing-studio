    value: "約32%"
    label: "空いていない人が多くても1人だけ、という枠がある週の割合"
    caption: "そのような枠の約55%では、その1人が管理職です。誰にお願いすればよいかが分かります。同じ国なら57%と48%です。"

  - layout: poll
    eyebrow: "ちょっとだけ教えてください"
    question: "管理職の予定が\n埋まっているとき、\nどうしていますか？"
