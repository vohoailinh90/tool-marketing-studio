    text: Công cụ dòng lệnh quản lý cài đặt, quét rủi ro và điều phối đội ngũ tmux
  - emoji: 🔌
    title: Jev Engine
    text: Hệ thống phán đoán hỗ trợ định tuyến mô hình, kích hoạt kỹ năng và điều kiện lặp
- layout: checklist
