<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 790" width="320" height="790" role="img" aria-labelledby="title desc">
<title id="title">Làm mờ ảnh đường phố</title>
<desc id="desc">Ảnh gắn khung được tiền xử lý để huấn luyện bộ phát hiện. Ảnh đường phố mới được phát hiện vùng mặt và biển số, làm mờ các vùng đó, lưu vào kho ảnh và chỉ ảnh đã làm mờ được phục vụ cho người dùng.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#475569" stroke-width="1.5"/></marker></defs>
<rect width="320" height="790" fill="#f8fafc"/>
<g font-family="DejaVu Sans, Arial, sans-serif" fill="#0f172a">
<text x="16" y="30" font-size="21" font-weight="bold">LÀM MỜ ẢNH</text>
<text x="16" y="54" font-size="21" font-weight="bold">ĐƯỜNG PHỐ</text>
<rect x="16" y="70" width="288" height="68" rx="12" fill="#dbeafe" stroke="#94a3b8"/>
<text x="29" y="99" font-size="16" font-weight="bold">1 · Ảnh có gắn khung</text>
<text x="29" y="123" font-size="16" font-weight="normal">Mặt và biển số được đánh dấu</text>
<line x1="160" y1="139" x2="160" y2="165" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="16" y="168" width="288" height="68" rx="12" fill="#ede9fe" stroke="#94a3b8"/>
<text x="29" y="197" font-size="16" font-weight="bold">2 · Tiền xử lý, tăng cường</text>
<text x="29" y="221" font-size="16" font-weight="normal">Chuẩn hóa, tạo thêm biến thể</text>
<line x1="160" y1="237" x2="160" y2="263" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="16" y="266" width="288" height="68" rx="12" fill="#ede9fe" stroke="#94a3b8"/>
<text x="29" y="295" font-size="16" font-weight="bold">3 · Huấn luyện bộ phát hiện</text>
<text x="29" y="319" font-size="16" font-weight="normal">Học tìm các khung</text>
<line x1="160" y1="335" x2="160" y2="361" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="16" y="364" width="288" height="68" rx="12" fill="#fef3c7" stroke="#94a3b8"/>
<text x="29" y="393" font-size="16" font-weight="bold">4 · Ảnh đường phố mới vào</text>
<text x="29" y="417" font-size="16" font-weight="normal">Tiền xử lý rồi phát hiện vùng</text>
<line x1="160" y1="433" x2="160" y2="459" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="16" y="462" width="288" height="68" rx="12" fill="#ffe4e6" stroke="#94a3b8"/>
<text x="29" y="491" font-size="16" font-weight="bold">5 · Làm mờ vùng nhạy cảm</text>
<text x="29" y="515" font-size="16" font-weight="normal">Chỉ vùng trong khung bị mờ</text>
<line x1="160" y1="531" x2="160" y2="557" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="16" y="560" width="288" height="68" rx="12" fill="#dcfce7" stroke="#94a3b8"/>
<text x="29" y="589" font-size="16" font-weight="bold">6 · Lưu vào kho ảnh</text>
<text x="29" y="613" font-size="16" font-weight="normal">Kho đối tượng</text>
<line x1="160" y1="629" x2="160" y2="655" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="16" y="658" width="288" height="68" rx="12" fill="#dbeafe" stroke="#94a3b8"/>
<text x="29" y="687" font-size="16" font-weight="bold">7 · Phục vụ người dùng</text>
<text x="29" y="711" font-size="16" font-weight="normal">Chỉ ảnh đã làm mờ</text>
<text x="16" y="754" font-size="16" font-weight="normal">Bước 1–3 chuẩn bị mô hình; bước</text>
<text x="16" y="778" font-size="16" font-weight="normal">4–6 chạy cho từng ảnh mới.</text>
</g></svg>
