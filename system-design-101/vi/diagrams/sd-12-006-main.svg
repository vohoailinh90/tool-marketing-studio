<svg xmlns="http://www.w3.org/2000/svg" width="320" height="729" viewBox="0 0 320 729" role="img" aria-labelledby="title desc">
<title id="title">Chat bằng Redis</title>
<desc id="desc">Hai khung. Khung một, đường đi của một tin nhắn: Bob gửi tin tới máy chủ chat qua WebSocket; máy chủ lưu tin vào Redis bằng zadd; máy chủ phát tin lên kênh bằng publish; Redis chuyển tin cho các kết nối đang lắng nghe kênh. Khung hai, hai việc khác nhau: zadd giữ tin để đọc sau, publish chỉ giao cho người đang nghe tại lúc phát.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs>
<rect width="320" height="729" fill="#f8fafc"/>
<g font-family="DejaVu Sans, Arial, sans-serif" fill="#0f172a">
<text x="16" y="34" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">Chat bằng Redis</text>
<text x="16" y="60.2" font-size="15" fill="#475569" font-weight="normal" text-anchor="start">Một kênh phát tin, một tập có thứ tự.</text>
<rect x="8" y="80" width="304" height="455" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="108.2" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Một tin nhắn</text>
<rect x="20" y="125" width="84" height="86" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="62" cy="147" r="14" fill="#1d4ed8"/><g transform="translate(53.6 138.6) scale(0.7)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect height="20" rx="2" ry="2" width="14" x="5" y="2"/><path d="M12 18h.01"/></g>
<text x="62" y="178.9" font-size="15" fill="#0f172a" font-weight="bold" text-anchor="middle">Bob</text>
<rect x="118" y="125" width="84" height="86" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="160" cy="147" r="14" fill="#1d4ed8"/><g transform="translate(151.6 138.6) scale(0.7)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect height="8" rx="2" ry="2" width="20" x="2" y="2"/><rect height="8" rx="2" ry="2" width="20" x="2" y="14"/><line x1="6" x2="6.01" y1="6" y2="6"/><line x1="6" x2="6.01" y1="18" y2="18"/></g>
<text x="160" y="178.9" font-size="15" fill="#0f172a" font-weight="bold" text-anchor="middle">Máy chủ</text>
<text x="160" y="197.6" font-size="15" fill="#0f172a" font-weight="bold" text-anchor="middle">chat</text>
<rect x="216" y="125" width="84" height="86" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="258" cy="147" r="14" fill="#1d4ed8"/><g transform="translate(249.6 138.6) scale(0.7)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5V19A9 3 0 0 0 21 19V5"/><path d="M3 12A9 3 0 0 0 21 12"/></g>
<text x="258" y="178.9" font-size="15" fill="#0f172a" font-weight="bold" text-anchor="middle">Redis</text>
<polyline points="62,211 62,523" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4 4"/>
<polyline points="160,211 160,523" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4 4"/>
<polyline points="258,211 258,523" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4 4"/>
<text x="111" y="239.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="middle">Gửi tin</text>
<text x="111" y="258.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="middle">(WebSocke</text>
<text x="111" y="278.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="middle">t)</text>
<polyline points="63,292 157,292" fill="none" stroke="#334155" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="209" y="320.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="middle">zadd: lưu</text>
<text x="209" y="339.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="middle">lịch sử</text>
<polyline points="161,353 255,353" fill="none" stroke="#334155" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="209" y="381.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="middle">publish:</text>
<text x="209" y="400.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="middle">phát lên</text>
<text x="209" y="420.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="middle">kênh</text>
<polyline points="161,434 255,434" fill="none" stroke="#334155" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="209" y="462.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="middle">Giao cho</text>
<text x="209" y="481.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="middle">người</text>
<text x="209" y="501.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="middle">đang nghe</text>
<polyline points="257,515 163,515" fill="none" stroke="#334155" stroke-width="1.8" stroke-dasharray="5 4" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="8" y="547" width="304" height="174" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="575.1" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Hai việc khác nhau</text>
<rect x="20" y="592" width="280" height="46" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="615" r="11" fill="#16a34a"/>
<polyline points="37.9,615.4 41.7,619.4 48.5,611" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="618.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">zadd giữ tin để đọc sau.</text>
<rect x="20" y="646" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="669" r="11" fill="#16a34a"/>
<polyline points="37.9,669.4 41.7,673.4 48.5,665" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="672.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">publish chỉ giao cho người</text>
<text x="64" y="691.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">đang nghe lúc đó.</text>
</g>
</svg>
