<circle cx="43" cy="1645" r="11" fill="#16a34a"/>
<polyline points="37.9,1645.4 41.7,1649.4 48.5,1641" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="1648.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Người dùng phải thấy ngay</text>
<text x="64" y="1667.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">điều vừa ghi? Đọc từ nơi ghi,</text>
<text x="64" y="1687.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">không từ bản đọc.</text>
<rect x="20" y="1713" width="280" height="83" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="1736" r="11" fill="#16a34a"/>
<polyline points="37.9,1736.4 41.7,1740.4 48.5,1732" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="1739.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Bên nghe tắt thì sao? Thông</text>
<text x="64" y="1758.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">báo chỉ tới phiên đang nghe;</text>
<text x="64" y="1778.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">cần hàng đợi bền.</text>
<rect x="20" y="1804" width="280" height="83" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="1827" r="11" fill="#16a34a"/>
<polyline points="37.9,1827.4 41.7,1831.4 48.5,1823" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="1830.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Giữa saga, người khác thấy</text>
<text x="64" y="1849.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">tiền đã trừ mà đơn chưa</text>
<text x="64" y="1869.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">xong.</text>
<rect x="20" y="1895" width="280" height="83" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="1918" r="11" fill="#16a34a"/>
<polyline points="37.9,1918.4 41.7,1922.4 48.5,1914" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="1921.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Bước bù cũng có thể hỏng:</text>
<text x="64" y="1940.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">phải thử lại được mà không</text>
<text x="64" y="1960.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">làm hai lần.</text>
</g>
