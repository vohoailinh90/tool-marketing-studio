<circle cx="43" cy="1750" r="11" fill="#16a34a"/>
<polyline points="37.9,1750.4 41.7,1754.4 48.5,1746" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
