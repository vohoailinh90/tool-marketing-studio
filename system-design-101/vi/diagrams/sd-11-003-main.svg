<svg xmlns="http://www.w3.org/2000/svg" width="320" height="924" viewBox="0 0 320 924" role="img" aria-labelledby="title desc">
<title id="title">Ba mục tiêu của thiết kế hệ thống</title>
<desc id="desc">Hai khung. Khung một, bốn kiểu để sẵn sàng cao: hot-hot, hot-warm, cụm một leader, cụm không leader; mỗi thẻ nói điều gì xảy ra khi một nút hỏng. Khung hai, thông lượng cao và mở rộng cao: mỗi mục ghi các kỹ thuật chính.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs>
<rect width="320" height="924" fill="#f8fafc"/>
<g font-family="DejaVu Sans, Arial, sans-serif" fill="#0f172a">
<text x="16" y="34" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">Ba mục tiêu của thiết kế</text>
<text x="16" y="58" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">hệ thống</text>
<text x="16" y="84.2" font-size="15" fill="#475569" font-weight="normal" text-anchor="start">Sẵn sàng, thông lượng, mở rộng.</text>
<rect x="8" y="104" width="304" height="467" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="132.2" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Sẵn sàng cao</text>
<rect x="20" y="149" width="280" height="107" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="50" cy="202.5" r="18" fill="#1d4ed8"/><g transform="translate(39.2 191.7) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.97 12.92A2 2 0 0 0 2 14.63v3.24a2 2 0 0 0 .97 1.71l3 1.8a2 2 0 0 0 2.06 0L12 19v-5.5l-5-3-4.03 2.42Z"/><path d="m7 16.5-4.74-2.85"/><path d="m7 16.5 5-3"/><path d="M7 16.5v5.17"/><path d="M12 13.5V19l3.97 2.38a2 2 0 0 0 2.06 0l3-1.8a2 2 0 0 0 .97-1.71v-3.24a2 2 0 0 0-.97-1.71L17 10.5l-5 3Z"/><path d="m17 16.5-5-3"/><path d="m17 16.5 4.74-2.85"/><path d="M17 16.5v5.17"/><path d="M7.97 4.42A2 2 0 0 0 7 6.13v4.37l5 3 5-3V6.13a2 2 0 0 0-.97-1.71l-3-1.8a2 2 0 0 0-2.06 0l-3 1.8Z"/><path d="M12 8 7.26 5.15"/><path d="m12 8 4.74-2.85"/><path d="M12 13.5V8"/></g>
<text x="78" y="175.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Hot-hot</text>
<text x="78" y="199.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Các bản cùng nhận yêu</text>
<text x="78" y="218.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">cầu; một bản hỏng thì bản</text>
<text x="78" y="238.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">kia gánh.</text>
<rect x="20" y="270" width="280" height="87" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="50" cy="313.5" r="18" fill="#1d4ed8"/><g transform="translate(39.2 302.7) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect height="8" rx="2" ry="2" width="20" x="2" y="2"/><rect height="8" rx="2" ry="2" width="20" x="2" y="14"/><line x1="6" x2="6.01" y1="6" y2="6"/><line x1="6" x2="6.01" y1="18" y2="18"/></g>
<text x="78" y="296.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Hot-warm</text>
<text x="78" y="320.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Bản chờ lên thay, có</text>
<text x="78" y="339.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">khoảng chuyển.</text>
<rect x="20" y="371" width="280" height="87" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="50" cy="414.5" r="18" fill="#1d4ed8"/><g transform="translate(39.2 403.7) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6a9 9 0 0 0-9 9V3"/><circle cx="18" cy="6" r="3"/><circle cx="6" cy="18" r="3"/></g>
<text x="78" y="397.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Một leader</text>
<text x="78" y="421.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Leader hỏng thì bầu mới;</text>
<text x="78" y="440.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">ghi dừng lúc bầu.</text>
<rect x="20" y="472" width="280" height="87" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="50" cy="515.5" r="18" fill="#1d4ed8"/><g transform="translate(39.2 504.7) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect height="6" rx="1" width="6" x="16" y="16"/><rect height="6" rx="1" width="6" x="2" y="16"/><rect height="6" rx="1" width="6" x="9" y="2"/><path d="M5 16v-3a1 1 0 0 1 1-1h12a1 1 0 0 1 1 1v3"/><path d="M12 12V8"/></g>
<text x="78" y="498.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Không leader</text>
<text x="78" y="522.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Nút nào cũng nhận ghi;</text>
<text x="78" y="541.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">cần hòa giải.</text>
<rect x="8" y="583" width="304" height="333" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="611.1" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Thông lượng và mở rộng</text>
<rect x="20" y="628" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="651" r="11" fill="#16a34a"/>
<polyline points="37.9,651.4 41.7,655.4 48.5,647" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="654.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Thông lượng: gom lô, song</text>
<text x="64" y="673.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">song, hàng đợi.</text>
<rect x="20" y="699" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="722" r="11" fill="#16a34a"/>
<polyline points="37.9,722.4 41.7,726.4 48.5,718" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="725.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Thông lượng đo việc xong</text>
<text x="64" y="744.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">mỗi giây, không phải độ trễ.</text>
<rect x="20" y="770" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="793" r="11" fill="#16a34a"/>
<polyline points="37.9,793.4 41.7,797.4 48.5,789" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="796.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Mở rộng: dịch vụ không giữ</text>
<text x="64" y="815.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">trạng thái.</text>
<rect x="20" y="841" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="864" r="11" fill="#16a34a"/>
<polyline points="37.9,864.4 41.7,868.4 48.5,860" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="867.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Mở rộng: chia dữ liệu, thêm</text>
<text x="64" y="886.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">máy.</text>
</g>
</svg>
