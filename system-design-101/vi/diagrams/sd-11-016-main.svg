<svg xmlns="http://www.w3.org/2000/svg" width="360" height="420" viewBox="0 0 360 420" role="img" aria-labelledby="title desc">
<title id="title">Nhập môn khả năng mở rộng kiến trúc</title>
<desc id="desc">Ba điểm nghẽn: Tập trung • thao tác chậm: Coupling buộc cùng co giãn; Cơ chế cải thiện: Stateless • cache • queue: Chia workload khi phù hợp; Chứng minh bằng đo: Throughput + p99: Chi phí cho mỗi thao tác. Các khung là ý chính để đối chiếu, không nhất thiết là các bước tuần tự.</desc>
<rect width="360" height="420" fill="#f8fafc"/>
<g font-family="DejaVu Sans, sans-serif" fill="#0f172a">
<text x="20" y="28" font-size="18" font-weight="bold">sd-11-016 · Nhìn hình trước</text>
<rect x="12" y="48" width="336" height="102" rx="12" fill="#e0f2fe" stroke="#64748b"/>
<text x="24" y="75" font-size="18" font-weight="bold">Ba điểm nghẽn</text>
<text x="24" y="104" font-size="18">Tập trung • thao tác chậm</text>
<text x="24" y="130" font-size="18">Coupling buộc cùng co giãn</text>
<rect x="12" y="162" width="336" height="102" rx="12" fill="#dcfce7" stroke="#64748b"/>
<text x="24" y="189" font-size="18" font-weight="bold">Cơ chế cải thiện</text>
<text x="24" y="218" font-size="18">Stateless • cache • queue</text>
<text x="24" y="244" font-size="18">Chia workload khi phù hợp</text>
<rect x="12" y="276" width="336" height="102" rx="12" fill="#fef3c7" stroke="#64748b"/>
<text x="24" y="303" font-size="18" font-weight="bold">Chứng minh bằng đo</text>
<text x="24" y="332" font-size="18">Throughput + p99</text>
<text x="24" y="358" font-size="18">Chi phí cho mỗi thao tác</text>
</g>
</svg>
