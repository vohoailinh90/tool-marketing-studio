<polyline points="160,352 160,380" fill="none" stroke="#334155" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="8" y="493" width="304" height="382" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="521.1" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Phản ứng khi có thứ hỏng</text>
<rect x="20" y="538" width="280" height="87" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
<circle cx="50" cy="581.5" r="18" fill="#0f766e"/><g transform="translate(39.2 570.7) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></g>
<text x="78" y="564.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Chuyển dự phòng</text>
<text x="78" y="588.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Tự chuyển sang bản dự</text>
<text x="78" y="607.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">phòng khi bản chính hỏng.</text>
<rect x="20" y="657" width="280" height="87" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
<circle cx="50" cy="700.5" r="18" fill="#0f766e"/><g transform="translate(39.2 689.7) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/></g>
<text x="78" y="683.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Giảm chức năng</text>
<text x="78" y="707.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Chạy với ít tính năng hơn,</text>
<text x="78" y="726.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">không sập hẳn.</text>
<rect x="20" y="776" width="280" height="87" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
<circle cx="50" cy="819.5" r="18" fill="#0f766e"/><g transform="translate(39.2 808.7) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-2.48a2 2 0 0 0-1.93 1.46l-2.35 8.36a.25.25 0 0 1-.48 0L9.24 2.18a.25.25 0 0 0-.48 0l-2.35 8.36A2 2 0 0 1 4.49 12H2"/></g>
<text x="78" y="802.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Giám sát, cảnh báo</text>
<text x="78" y="826.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Thấy sớm và báo cho</text>
<text x="78" y="845.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">người xử lý.</text>
<polyline points="160,627 160,655" fill="none" stroke="#334155" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="160,746 160,774" fill="none" stroke="#334155" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="8" y="887" width="304" height="262" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="915.1" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Phép tính độ sẵn sàng</text>
<rect x="20" y="932" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="955" r="11" fill="#16a34a"/>
<polyline points="37.9,955.4 41.7,959.4 48.5,951" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="958.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Hai bản 99% chạy song</text>
<text x="64" y="977.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">song: 99,99%.</text>
<rect x="20" y="1003" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="1026" r="11" fill="#16a34a"/>
<polyline points="37.9,1026.4 41.7,1030.4 48.5,1022" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="1029.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Ba phần 99,9% nối tiếp:</text>
<text x="64" y="1048.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">khoảng 99,7%.</text>
<rect x="20" y="1074" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="1097" r="11" fill="#16a34a"/>
<polyline points="37.9,1097.4 41.7,1101.4 48.5,1093" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="1100.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Chỉ đúng khi các bản hỏng</text>
<text x="64" y="1119.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">độc lập nhau.</text>
</g>
</svg>
