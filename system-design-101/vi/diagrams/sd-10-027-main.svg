<rect x="8" y="478" width="304" height="402" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="506.2" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Vận hành và dữ liệu</text>
