# Language-neutral FACTS about the tool. Every post, in every language, may only claim
# what is written here. Per-language positioning lives in positioning/<lang>.yaml.
# Source: vohoailinh90/Email_Bridge (folder meeting_scheduler_standalone/, docs/MEETING_SCHEDULER_DESIGN.md,
# docs/agents/pipeline/2026-09-graph-getschedule.md, src/meetingscheduler.py), read 2026-10-11.
slug: meeting-scheduler
name: Meeting Scheduler
repo: vohoailinh90/Email_Bridge
status: prototype     # works for its author on real calendars; personal-time project, can be shared later, no release planned yet
brand:
  emoji: "🗓️"
  accent: "#0f6cbd"

what_it_is: >-
  A local app (Python backend on 127.0.0.1 + web page) that reads the free/busy of every invitee through
  Microsoft Graph, finds the earliest slot where everyone is free inside their own working hours and time
  zone, then opens a pre-filled meeting window in Outlook for the user to review and send by hand.

requirements:
  - Windows with Outlook desktop (classic) for the "open draft" button
  - Everyone whose calendar is read must be in the same Microsoft 365 organisation as the signed-in user (see limitations)
  - A Microsoft 365 / Exchange Online account; an Entra ID app registration with Delegated Calendars.Read approved by the organisation's IT, plus its tenant id, client id and client secret
  - Python 3.11+ with httpx and pywin32, or the packaged MeetingScheduler.exe (PyInstaller, built on Windows)

features:            # each is in the repo docs/README
  - id: multi-invitee
    fact: Invitees are added as rows; one row accepts several addresses separated by comma, semicolon or space; duplicates are removed
  - id: per-member-tz
    fact: Each row has its own time zone (a short preset list or a custom UTC offset) and its own working hours (default 09:00-18:00, Monday-Friday)
  - id: graph-freebusy
    fact: Free/busy comes from Microsoft Graph getSchedule; requests are split into batches of at most 20 schedules
  - id: best-slot
    fact: Finds the earliest slot where every resolved invitee is free inside their own working hours
  - id: fallback
    fact: If no slot fits everyone, shows up to 5 alternatives ranked by how many people are free, with a free / busy / unknown badge per person
  - id: unresolved
    fact: People whose calendar cannot be read are listed as unknown and are not counted as free
  - id: draft-only
    fact: Opens an Outlook meeting draft with time and invitees filled in; the app never sends or saves it
  - id: ui-languages
    fact: UI in Vietnamese, English and Japanese
  - id: standalone
    fact: Can be shared as a single folder; each colleague signs in with their own account

claims:              # anything a post states as a benefit must be one of these
  - id: never-sends
    text: The app never sends the invitation; the user reviews the Outlook draft and clicks Send
    evidence: meeting_scheduler_standalone/README.md; MEETING_SCHEDULER_DESIGN.md section 4.5
    verified: true
  - id: local-only
    text: The server binds to 127.0.0.1 and the token is kept in memory only
    evidence: README (architecture); 2026-09-graph-getschedule.md section 4.1
    verified: true
  - id: matches-outlook
    text: On the author's real tenant, results matched Outlook's Scheduling Assistant for two real colleagues over 7 days
    evidence: 2026-09-graph-getschedule.md section 11 (author's own check, small sample)
    verified: true
  - id: com-rejected
    text: An earlier Outlook COM FreeBusy approach reported "free" over a real recurring meeting and was dropped
    evidence: 2026-08-meeting-freebusy-com-boundary.md
    verified: true
  - id: speed
    text: "Slot search is fast: 30 invitees over 60 days took about 0.3 s (12 invitees: 0.12 s) on synthetic calendars"
    evidence: measured 2026-10-11 by calling find_best_slot() from src/meetingscheduler.py; excludes the Graph network call
    verified: true
  - id: vn-in-kr-overlap
    text: "Vietnam (UTC+7), India (UTC+5:30) and South Korea (UTC+9), everyone working 09:00-18:00 Mon-Fri, share 5.5 hours a day: 10:30-16:00 in Vietnam, 09:00-14:30 in India, 12:30-18:00 in South Korea (that is 07:00-16:00 Korea and 10:30-19:30 India when read as Vietnam time). That gives 50 sixty-minute start times a week and 45 ninety-minute ones, and it does not change by season because none of the three observes daylight saving"
    evidence: measured 2026-10-11 with find_best_slot / _member_available on empty synthetic calendars, plus plain UTC-offset arithmetic
    verified: true
  - id: vn-in-kr-plus-region
    text: "Adding one colleague in Berlin to Vietnam + India + South Korea leaves 5 sixty-minute starts a week in winter and none for 90 minutes (15 and 10 in summer); adding one in New York or Los Angeles leaves none"
    evidence: measured 2026-10-11 with the repo's find_best_slot on empty synthetic calendars
    verified: true
  - id: headcount-simulation
    text: "Simple simulation (one week; random 30-90 minute meetings; staff busy 30% of working time, 'managers' ASSUMED busy 60%; 2000 runs each): chance that at least one 60-minute slot exists where EVERYONE is free. 10 people across Vietnam, India and South Korea: 14% with no managers, 3% with 2 managers. 10 people all in one country and department (same hours): 28% with no managers, 15% with 1 manager, 7% with 2 managers. A 5-person department in one country: 100% with no managers, 89% with 1 manager. Earlier coarser run (300 runs per cell, people split across the 3 countries) at 20% / 30% / 40% busy: 3 people 100% / 100% / 98%, 10 people 73% / 12% / 2%, 15 people 23% / 1% / 0%"
    evidence: simulations run 2026-10-11 on the repo's find_best_slot; assume independent random meetings, no lunch breaks, no holidays; 'managers busier' is an assumption from the page owner's experience, not measured; real calendars are clumpier, so treat as an illustration, not a forecast
    verified: true
  - id: manager-tips-simulation
    text: "Same simulation setup as headcount-simulation (10 people in ONE country and department, same hours; 8 staff busy 30% and 2 'managers' ASSUMED busy 60%; random 30-90 minute meetings; 1000-2000 runs per case). Chance that a slot exists where all 10 are free: 60-minute slot, 1 week 7% (7.2-7.5% in two runs); 30-minute slot, 1 week 65%; 60-minute slot searched over 2 weeks 14%, over 4 weeks 30%. Requiring only the 8 staff to be free: 61%; the 8 staff plus at least one of the 2 managers: 35%. Chance that some 60-minute slot has at most one busy person: 57% of weeks; in slots with exactly one busy person, that person is one of the 2 managers 48% of the time (managers are 20% of the group)"
    evidence: simulation run 2026-10-11 reproducing the repo's availability rule (work window, 30-minute slices); assumptions as in headcount-simulation; the managers-busier assumption comes from the page owner's experience and was not measured; illustration, not a forecast
    verified: true
  - id: manager-tips-three-countries
    text: "Same setup as manager-tips-simulation but the 10 people (8 staff busy 30%, 2 'managers' ASSUMED busy 60%) are spread over Vietnam, India and South Korea, each inside their own 09:00-18:00 Mon-Fri; 700-1500 runs per case. Chance that a slot exists where all 10 are free: 60 minutes, 1 week 3% (same department and country: 7%); only the 8 staff must be free 39% (61%); the 8 staff plus at least one manager 20% (35%); 30-minute slot 36% (65%); 60-minute slot searched over 2 weeks 7% (14%), over 4 weeks 10% (30%). Some slot has at most one person not free: 32% of weeks (57%); in slots with exactly one person not free, that person is a manager 55% of the time (48%)"
    evidence: simulation run 2026-10-12 reproducing the repo's availability rule; the same-country figures were re-run in the same script as a sanity check (7.2%, 61%, 35.5%, 56%, 48%); managers-busier is the page owner's assumption, not measured; illustration, not a forecast
    verified: true
  - id: scheduling-habit-tip
    text: "Offering 2-3 candidate times to pick from, instead of asking each person in turn, is quicker"
    evidence: general scheduling practice, not measured and not part of the tool
    verified: false
  - id: same-org-only
    text: The tool can only show free/busy for people whose calendar Microsoft Graph exposes to the signed-in user, i.e. colleagues in the same Microsoft 365 organisation; anyone else appears as unknown and is ignored by the best slot
    evidence: docs/MEETING_SCHEDULER_DESIGN.md decision 6 and risk R1; real check covered only two colleagues of the same organisation (2026-09-graph-getschedule.md section 11). Whether another organisation can be read when it shares free/busy was NOT verified
    verified: true
  - id: team-size
    text: Works for 10+ invitees
    evidence: batching code and tests exist, but not tested by the author on a real 10+ person multi-country meeting
    verified: false

limitations:         # say these openly: they decide who should NOT try it
  - Needs IT approval of a Graph app registration; it will not work on a personal account or a company that blocks it
  - Reads only colleagues in the same Microsoft 365 organisation as the signed-in user. Customers, partners and, in a group with several Microsoft 365 tenants, colleagues of another tenant show as unknown and are ignored by the best slot; sharing free/busy between organisations is not verified
  - Counting who blocks the most slots (to know whom to ask to move a meeting) is only a proposal, not built; today it shows, for each near-miss slot, who is free, busy or unknown
  - Working hours are a hard yes/no; no lunch break, no public holidays, no per-country weekend, no "required vs optional" invitee
  - Results are shown in JST only, not in each invitee's local time
  - With people on three continents the strict window usually leaves no slot for everyone; the alternatives are ranked by headcount, not by who gets a night-time meeting
  - Windows + Outlook desktop only for the draft button; searching is limited to 60 days and 30-minute steps

story_to_confirm:    # posts 02-story use these; the author must confirm or rewrite them
  - The author wanted one place to see who is free across countries instead of opening each calendar and converting time zones by hand (owner to confirm the wording and any numbers)
  - The first two ways of reading calendars were tried and rejected on real data before Graph worked

commercial_readiness: # what must exist before charging money
  - No app-registration step for the customer (or a hosted sign-in) - today every company's IT must approve the app
  - Signed installer instead of a PyInstaller exe that needs Python/pywin32 knowledge
  - Support for non-Outlook calendars (Google) if the market is not Microsoft-only

sharing_status: >-
  Written in the author's personal time for personal use, so it may be shared. For now the page only shares the IDEA and the
  problem; no download, trial or waitlist is offered and no release date exists. Posts must not promise availability.

pricing_hypotheses:  # to test in the survey, not to announce
  - Free for individuals, paid team licence for departments that coordinate across countries
