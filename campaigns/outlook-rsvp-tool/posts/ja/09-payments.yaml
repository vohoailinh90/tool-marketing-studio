id: 09-payments
status: draft
format: portrait
series: "幹事の業務効率化 · #9"
link: survey
slides:
  - layout: cover
    emoji: "💰"
    eyebrow: "出席確認と集金"
    title: "2次会の集金は**回ごとに専用の列**で管理"
    subtitle: "会のあとに出席を確認し、回ごとに金額を記録。免除の人がいても混乱しません。"

  - layout: table
    title: "回ごとに出席と金額の列があります"
    columns: ["名前", "1次会", "2次会", "免除"]
    rows:
      - ["佐藤", "✓ 5,000", "✓ 3,000", ""]
      - ["田中", "✓ 5,000", {text: "—", tone: muted}, ""]
      - ["山本（来賓）", {text: "免除", tone: ok}, {text: "免除", tone: ok}, "✓"]
      - ["合計", "10,000", "3,000", ""]
    total_row: true
    note: "数字はイメージです。免除はすべての回に適用されます。"

  - layout: features
    title: "各回、ツールが計算します"
    items:
      - {emoji: "👥", title: "参加人数", text: "その回に参加した人数"}
      - {emoji: "💵", title: "集金額", text: "その回に集まった合計"}
      - {emoji: "🧾", title: "支払額", text: "実際に支払った金額（手入力）"}
      - {emoji: "🧮", title: "残り", text: "その回の残額。画面上部には全回の合計も表示"}
    note: "出席にチェックを入れると、イベント予算をもとに金額が自動入力されます。ダブルクリックで実額に修正できます。"

  - layout: flow
    variant: after
    title: "会のあとにやること"
    steps:
      - {emoji: "☑️", text: "来た人に**チェック**（列見出しをクリックで全員）"}
      - {emoji: "✏️", text: "金額セルをダブルクリックして実額に修正"}
      - {emoji: "➕", text: "2次会があれば**回を追加**（名前も変更できます）"}
      - {emoji: "🙏", text: "回ごとの金額表つきのお礼メールを送信"}

  - layout: email
    title: "お礼メールに、回ごとの金額表"
    subject: "【EVT-12】忘年会へのご参加ありがとうございました"
    from: "幹事（あなた）"
    infobar: "添付：出席・集金のExcelファイル、会議出席依頼"
    body: "ご参加ありがとうございました！\n回ごとの金額は下記のとおりです。Excelも添付しますので、ご確認ください。\n\n**1次会**：集金 10,000\n**2次会**：集金 3,000\n**合計**：13,000"
    note: "金額表はHTMLで送るため、Outlook上でも列が揃います。会議出席依頼は件名で検索します。Outlook上の件名をイベント名と同じにしてください（検索はベストエフォートのため、見つからない場合もあります）。"

  - layout: cta
    emoji: "💬"
    title: "皆さんの飲み会は、**何次会**までありますか？"
    text: "1次会だけ？2次会、さらにその先まで？集金の記録のしかたをコメントで教えてください。"

platforms:
  facebook:
    caption: |
      2次会に来た人、免除の人、先に帰った人…集金表が色だらけのExcelになっていませんか？😅

      回が増えるほど、集金は確認事項だらけになります。「1次会は払った？」「2次会は参加？」「誰が免除？」

      このツールのやり方です。
      ・回ごとに「出席」と「金額」の列を持つ
      ・会のあとに来た人へチェック。金額はイベント予算をもとに自動入力され、違えばダブルクリックで修正
      ・免除の人は Free を選ぶと、すべての回が対象外に
      ・回ごとに参加人数・集金額・支払額・残りを表示。画面上部には全回の合計

      最後は、回ごとの金額表とExcelを添えたお礼メールを送れます。

      皆さんの飲み会は、何次会までありますか？コメントで教えてください👇
    first_comment: |
      📋 短いアンケート — 集金のしかたを教えてください：{link}
    hashtags: [幹事, Outlook, 集金, 二次会, 業務効率化]
