<svg xmlns="http://www.w3.org/2000/svg" width="320" height="1071" viewBox="0 0 320 1071" role="img" aria-labelledby="title desc">
<title id="title">Dựng cây chọn cơ sở dữ liệu: ràng buộc cứng trước</title>
<desc id="desc">Ba khung dọc. Khung một, ba câu hỏi về ràng buộc, theo thứ tự: dữ liệu mất được không, mất được như bộ đệm hay phiên thì Redis trong bộ nhớ, không thì hỏi tiếp; có cần giao dịch nhiều dòng không, có thì cơ sở dữ liệu quan hệ, không thì chọn theo kiểu câu hỏi; dữ liệu có vừa một máy không, vừa thì MySQL, không thì SQL phân tán như TiDB chạy trên TiKV. Khung hai, không cần giao dịch thì theo kiểu câu hỏi: tổng hợp trên kho rất lớn dùng Hive hoặc Impala; bản ghi dạng tài liệu dùng Couchbase hoặc MongoDB; quan hệ giữa các đối tượng dùng cơ sở dữ liệu đồ thị. Khung ba, thử câu một với Redis 7.0: cấu hình mặc định, ghi 50 khóa rồi tắt đột ngột thì còn 0 khóa; bật nhật ký ghi thì còn đủ 50.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs>
<rect width="320" height="1071" fill="#f8fafc"/>
<g font-family="DejaVu Sans, Arial, sans-serif" fill="#0f172a">
<text x="16" y="34" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">Dựng cây chọn cơ sở dữ</text>
<text x="16" y="58" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">liệu: ràng buộc cứng</text>
<text x="16" y="82" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">trước</text>
<rect x="8" y="102" width="304" height="442" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="130.2" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Ba câu hỏi về ràng buộc</text>
<rect x="20" y="147" width="280" height="107" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="46" cy="173" r="14" fill="#1d4ed8"/>
<text x="46" y="178.5" font-size="16" fill="#ffffff" font-weight="bold" text-anchor="middle">1</text>
<text x="70" y="173.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Mất được không?</text>
<text x="70" y="197.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Mất được (bộ đệm, phiên):</text>
<text x="70" y="216.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Redis trong bộ nhớ. Không:</text>
<text x="70" y="236.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">hỏi tiếp.</text>
<rect x="20" y="276" width="280" height="127" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="46" cy="302" r="14" fill="#1d4ed8"/>
<text x="46" y="307.5" font-size="16" fill="#ffffff" font-weight="bold" text-anchor="middle">2</text>
<text x="70" y="302.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Cần giao dịch nhiều</text>
<text x="70" y="322.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">dòng?</text>
<text x="70" y="346.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Có: cơ sở dữ liệu quan hệ.</text>
<text x="70" y="365.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Không: chọn theo kiểu câu</text>
<text x="70" y="385.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">hỏi.</text>
<polyline points="46,256 46,274" fill="none" stroke="#334155" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="20" y="425" width="280" height="107" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="46" cy="451" r="14" fill="#1d4ed8"/>
<text x="46" y="456.5" font-size="16" fill="#ffffff" font-weight="bold" text-anchor="middle">3</text>
<text x="70" y="451.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Vừa một máy không?</text>
<text x="70" y="475.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Vừa: MySQL. Không vừa:</text>
<text x="70" y="494.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">SQL phân tán như TiDB,</text>
<text x="70" y="514.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">chạy trên TiKV.</text>
<polyline points="46,405 46,423" fill="none" stroke="#334155" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="8" y="556" width="304" height="284" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="584.1" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Không cần giao dịch: theo</text>
<text x="20" y="606.2" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">kiểu câu hỏi</text>
<rect x="20" y="623" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="646" r="11" fill="#16a34a"/>
<polyline points="37.9,646.4 41.7,650.4 48.5,642" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="649.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Tổng hợp trên kho dữ liệu</text>
<text x="64" y="668.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">rất lớn: Hive, Impala.</text>
<rect x="20" y="694" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="717" r="11" fill="#16a34a"/>
<polyline points="37.9,717.4 41.7,721.4 48.5,713" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="720.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Bản ghi linh hoạt dạng tài</text>
<text x="64" y="739.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">liệu: Couchbase, MongoDB.</text>
<rect x="20" y="765" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="788" r="11" fill="#16a34a"/>
<polyline points="37.9,788.4 41.7,792.4 48.5,784" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="791.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Quan hệ giữa các đối tượng:</text>
<text x="64" y="810.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">cơ sở dữ liệu đồ thị.</text>
<rect x="8" y="852" width="304" height="211" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="880.1" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Thử câu 1 với Redis 7.0</text>
<rect x="20" y="897" width="280" height="83" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="920" r="11" fill="#16a34a"/>
<polyline points="37.9,920.4 41.7,924.4 48.5,916" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="923.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Cấu hình mặc định: ghi 50</text>
<text x="64" y="942.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">khóa, tắt đột ngột, còn 0</text>
<text x="64" y="962.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">khóa.</text>
<rect x="20" y="988" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="1011" r="11" fill="#16a34a"/>
<polyline points="37.9,1011.4 41.7,1015.4 48.5,1007" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="1014.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Bật nhật ký ghi: còn đủ 50</text>
<text x="64" y="1033.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">khóa.</text>
</g>
</svg>
