id: 04-before-after
status: draft
format: portrait
series: "Tool văn phòng · #4"
link: survey
slides:
  - layout: cover
    emoji: "⏱️"
    eyebrow: "Trước & sau"
    title: "Cùng một buổi tiệc, **hai cách tổ chức**"
    subtitle: "Bên trái là cách mình từng làm. Bên phải là bây giờ."

  - layout: compare
    title: "Khác nhau ở đâu?"
    before:
      items:
        - "Đếm Yes/No bằng tay trong hộp thư"
        - "Nhắc cả nhóm, kể cả người đã trả lời"
        - "Ghi tiền vào Excel, dễ sót"
        - "Lần sau lại làm từ đầu"
    after:
      items:
        - "Bấm Scan Inbox là có số liệu"
        - "Chỉ nhắc người chưa trả lời"
        - "Tiền từng vòng tự cộng, có số dư"
        - "Dùng lại sự kiện cũ làm mẫu"

  - layout: table
    style: sheet
    title: "File Excel của bạn có giống thế này?"
    columns: ["Tên", "Đi?", "Tiền", "Ghi chú"]
    rows:
      - ["Hà", "ok", "500k", "đã ck"]
      - ["Minh", {text: "yes?", tone: warn}, "", {text: "hỏi lại", tone: warn}]
      - ["Lan", "", "500k", {text: "?? tăng 2", tone: bad}]
      - ["Tuấn", "ko", "", ""]
      - ["Hà (2)", {text: "trùng?", tone: bad}, "", ""]
    note: "Một ô sai = một buổi tối ngồi đối chiếu."

  - layout: stat
    eyebrow: "Ước tính cho buổi tiệc ~30 người"
    before: "~3 giờ 20 phút"
    after: "~30 phút"
    label: "cho phần việc lặp lại"
    caption: "Đây là ước tính của mình, chưa đo. Mình sẽ đo lại cùng những người dùng thử."

  - layout: checklist
    title: "Tool này dành cho bạn nếu…"
    items:
      - "Bạn hay được giao tổ chức tiệc, sự kiện nội bộ"
      - "Công ty bạn dùng **Outlook trên Windows**"
      - "Bạn phải thu tiền nhiều vòng hoặc góp quà"
      - "Team có người Nhật hoặc người nước ngoài"
    note: "Chưa hỗ trợ Mac và Outlook bản web."

  - layout: cta
    emoji: "💬"
    title: "Bạn muốn tool có thêm **tính năng gì**?"
    text: "Mình đang chọn việc làm tiếp theo. Ý kiến của bạn sẽ quyết định thứ tự."

platforms:
  facebook:
    caption: |
      Trước & sau khi mình ngừng tổ chức tiệc bằng Excel 📊

      Trước đây: đếm Yes/No trong hộp thư, nhắc cả nhóm (kể cả người đã trả lời), ghi tiền vào một file càng ngày càng nhiều màu. Bây giờ: bấm Scan Inbox là có bảng, chỉ nhắc đúng người chưa trả lời, tiền từng vòng tự cộng.

      Con số ~3 giờ 20 phút → ~30 phút là mình ước tính cho một buổi ~30 người, chưa phải số đo. Mình sẽ đo lại cùng những người dùng thử đầu tiên — và nói thật kết quả.

      Tool chưa chạy trên Mac hay Outlook bản web. Nếu bạn dùng Outlook trên Windows: bạn muốn nó làm thêm gì?
    first_comment: |
      📋 Góp ý cho tính năng tiếp theo qua khảo sát 3 phút: {link}
    hashtags: [Outlook, Excel, tudonghoa, nangsuat, vanphong]
