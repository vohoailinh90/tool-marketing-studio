<svg xmlns="http://www.w3.org/2000/svg" width="320" height="1074" viewBox="0 0 320 1074" role="img" aria-labelledby="title desc">
<title id="title">Sáu thuật toán cân bằng tải</title>
<desc id="desc">Ba khối: hai nhóm thẻ và một khung ghi nhớ. Theo lượt và trọng số: round robin dùng từng máy lần lượt, sticky round-robin giữ một khách ở cùng một máy, weighted round-robin cho máy trọng số cao nhiều lượt hơn. Theo khóa băm hoặc theo tải: hash băm địa chỉ IP của khách hoặc URL để chọn máy, least connections chọn máy ít kết nối nhất, least response time chọn máy phản hồi nhanh. Khung cuối nêu ba điều cần nhớ.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs>
<rect width="320" height="1074" fill="#f8fafc"/>
<g font-family="DejaVu Sans, Arial, sans-serif" fill="#0f172a">
<text x="16" y="34" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">Sáu thuật toán cân bằng</text>
<text x="16" y="58" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">tải</text>
<text x="16" y="84.2" font-size="15" fill="#475569" font-weight="normal" text-anchor="start">Sáu cách chia yêu cầu, nhóm theo</text>
<text x="16" y="103.8" font-size="15" fill="#475569" font-weight="normal" text-anchor="start">cái chúng dựa vào.</text>
<rect x="8" y="123" width="304" height="327" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="151.2" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Theo lượt và trọng số</text>
<rect x="20" y="168" width="280" height="68" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="50" cy="202" r="18" fill="#1d4ed8"/><g transform="translate(39.2 191.2) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="m7 22-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/></g>
<text x="78" y="194.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Round robin</text>
<text x="78" y="218.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Dùng từng máy lần lượt.</text>
<rect x="20" y="250" width="280" height="87" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="50" cy="293.5" r="18" fill="#1d4ed8"/><g transform="translate(39.2 282.7) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m11 17 2 2a1 1 0 1 0 3-3"/><path d="m14 14 2.5 2.5a1 1 0 1 0 3-3l-3.88-3.88a3 3 0 0 0-4.24 0l-.88.88a1 1 0 1 1-3-3l2.81-2.81a5.79 5.79 0 0 1 7.06-.87l.47.28a2 2 0 0 0 1.42.25L21 4"/><path d="m21 3 1 11h-2"/><path d="M3 3 2 14l6.5 6.5a1 1 0 1 0 3-3"/><path d="M3 4h8"/></g>
<text x="78" y="276.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Sticky round-robin</text>
<text x="78" y="300.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Giữ một khách ở cùng một</text>
<text x="78" y="319.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">máy.</text>
<rect x="20" y="351" width="280" height="87" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="50" cy="394.5" r="18" fill="#1d4ed8"/><g transform="translate(39.2 383.7) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18"/><path d="m19 8 3 8a5 5 0 0 1-6 0zV7"/><path d="M3 7h1a17 17 0 0 0 8-2 17 17 0 0 0 8 2h1"/><path d="m5 8 3 8a5 5 0 0 1-6 0zV7"/><path d="M7 21h10"/></g>
<text x="78" y="377.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Weighted round-robin</text>
<text x="78" y="401.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Trọng số cao, nhiều lượt</text>
<text x="78" y="420.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">hơn.</text>
<rect x="8" y="462" width="304" height="330" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="490.2" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Theo khóa băm hoặc theo</text>
<text x="20" y="512.2" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">tải</text>
<rect x="20" y="529" width="280" height="87" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
<circle cx="50" cy="572.5" r="18" fill="#0f766e"/><g transform="translate(39.2 561.7) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" x2="20" y1="9" y2="9"/><line x1="4" x2="20" y1="15" y2="15"/><line x1="10" x2="8" y1="3" y2="21"/><line x1="16" x2="14" y1="3" y2="21"/></g>
<text x="78" y="555.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Hash</text>
<text x="78" y="579.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Băm IP của khách hoặc</text>
<text x="78" y="598.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">URL để chọn máy.</text>
<rect x="20" y="630" width="280" height="68" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
<circle cx="50" cy="664" r="18" fill="#0f766e"/><g transform="translate(39.2 653.2) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect height="6" rx="1" width="6" x="16" y="16"/><rect height="6" rx="1" width="6" x="2" y="16"/><rect height="6" rx="1" width="6" x="9" y="2"/><path d="M5 16v-3a1 1 0 0 1 1-1h12a1 1 0 0 1 1 1v3"/><path d="M12 12V8"/></g>
<text x="78" y="656.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Least connections</text>
<text x="78" y="680.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Chọn máy ít kết nối nhất.</text>
<rect x="20" y="712" width="280" height="68" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
<circle cx="50" cy="746" r="18" fill="#0f766e"/><g transform="translate(39.2 735.2) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="10" x2="14" y1="2" y2="2"/><line x1="12" x2="15" y1="14" y2="11"/><circle cx="12" cy="14" r="8"/></g>
<text x="78" y="738.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Least response time</text>
<text x="78" y="762.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Chọn máy phản hồi nhanh.</text>
<rect x="8" y="804" width="304" height="262" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="832.1" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Nhớ gì</text>
<rect x="20" y="849" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="872" r="11" fill="#16a34a"/>
<polyline points="37.9,872.4 41.7,876.4 48.5,868" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="875.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Bài nguồn gọi bốn cách đầu</text>
<text x="64" y="894.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">là tĩnh, hai cách sau là động.</text>
<rect x="20" y="920" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="943" r="11" fill="#16a34a"/>
<polyline points="37.9,943.4 41.7,947.4 48.5,939" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="946.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">HAProxy dùng hai từ đó theo</text>
<text x="64" y="965.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">nghĩa khác.</text>
<rect x="20" y="991" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="1014" r="11" fill="#16a34a"/>
<polyline points="37.9,1014.4 41.7,1018.4 48.5,1010" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="1017.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Đổi số máy có thể làm hash</text>
<text x="64" y="1036.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">chuyển nhiều khóa.</text>
</g>
</svg>
