<text x="78" y="408.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Cân bằng tải</text>
<text x="78" y="432.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Chia việc, không máy nào</text>
<text x="78" y="451.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">gánh một mình.</text>
