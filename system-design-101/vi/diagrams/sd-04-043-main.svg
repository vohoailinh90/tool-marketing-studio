<svg xmlns="http://www.w3.org/2000/svg" width="320" height="1144" viewBox="0 0 320 1144" role="img" aria-labelledby="title desc">
<title id="title">Hiệu năng cơ sở dữ liệu: đo ba mục</title>
<desc id="desc">Bốn khung dọc. Khung một, mười mục của nguồn nhóm theo chỗ tác động: câu hỏi gồm chỉ mục, tối ưu truy vấn, chuẩn hóa hay phi chuẩn hóa; kết nối và bộ đệm gồm dùng lại kết nối và đệm kết quả; chia dữ liệu gồm phân vùng, shard và bản sao; máy và theo dõi gồm bộ nhớ, đĩa, CPU và đo thời gian trả lời. Khung hai, đo kết nối: mở kết nối mới cho mỗi câu mất 3,3 đến 4,1 mili giây, dùng lại một kết nối dưới 0,09 mili giây. Khung ba, chỉ mục làm chậm ghi, chèn 200.000 dòng: chỉ khóa chính 0,7 đến 0,9 giây, thêm 3 chỉ mục 1,3 đến 1,7 giây, thêm 6 chỉ mục 2,9 đến 4,2 giây. Khung bốn, chỉ lấy cột cần: select sao đọc 202 trang, chỉ hai cột có trong chỉ mục thì đọc 5 trang và không chạm bảng.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs>
<rect width="320" height="1144" fill="#f8fafc"/>
<g font-family="DejaVu Sans, Arial, sans-serif" fill="#0f172a">
<text x="16" y="34" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">Hiệu năng cơ sở dữ liệu:</text>
<text x="16" y="58" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">đo ba mục</text>
<rect x="8" y="78" width="304" height="375" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="106.2" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Mười mục, nhóm theo chỗ</text>
<text x="20" y="128.2" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">tác động</text>
<rect x="20" y="145" width="280" height="83" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="168" r="11" fill="#16a34a"/>
<polyline points="37.9,168.4 41.7,172.4 48.5,164" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="171.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Câu hỏi: chỉ mục, tối ưu truy</text>
<text x="64" y="190.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">vấn, chuẩn hóa hay phi</text>
<text x="64" y="210.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">chuẩn hóa.</text>
<rect x="20" y="236" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="259" r="11" fill="#16a34a"/>
<polyline points="37.9,259.4 41.7,263.4 48.5,255" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="262.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Kết nối và bộ đệm: dùng lại</text>
<text x="64" y="281.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">kết nối, đệm kết quả.</text>
<rect x="20" y="307" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="330" r="11" fill="#16a34a"/>
<polyline points="37.9,330.4 41.7,334.4 48.5,326" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="333.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Chia dữ liệu: phân vùng,</text>
<text x="64" y="352.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">shard, bản sao.</text>
<rect x="20" y="378" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="401" r="11" fill="#16a34a"/>
<polyline points="37.9,401.4 41.7,405.4 48.5,397" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="404.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Máy và theo dõi: bộ nhớ, đĩa,</text>
<text x="64" y="423.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">CPU; đo thời gian trả lời.</text>
<rect x="8" y="465" width="304" height="191" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="493.2" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Đo 1: mở kết nối</text>
<rect x="20" y="510" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="533" r="11" fill="#16a34a"/>
<polyline points="37.9,533.4 41.7,537.4 48.5,529" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="536.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Kết nối mới cho mỗi câu: 3,3</text>
<text x="64" y="555.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">đến 4,1 ms.</text>
<rect x="20" y="581" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="604" r="11" fill="#16a34a"/>
<polyline points="37.9,604.4 41.7,608.4 48.5,600" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="607.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Dùng lại một kết nối: dưới</text>
<text x="64" y="626.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">0,09 ms.</text>
<rect x="8" y="668" width="304" height="262" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="696.1" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Đo 2: chèn 200.000 dòng</text>
<rect x="20" y="713" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="736" r="11" fill="#16a34a"/>
<polyline points="37.9,736.4 41.7,740.4 48.5,732" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="739.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Chỉ khóa chính: 0,7 đến 0,9</text>
<text x="64" y="758.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">s.</text>
<rect x="20" y="784" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="807" r="11" fill="#16a34a"/>
<polyline points="37.9,807.4 41.7,811.4 48.5,803" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="810.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Thêm 3 chỉ mục: 1,3 đến 1,7</text>
<text x="64" y="829.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">s.</text>
<rect x="20" y="855" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="878" r="11" fill="#16a34a"/>
<polyline points="37.9,878.4 41.7,882.4 48.5,874" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="881.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Thêm 6 chỉ mục: 2,9 đến 4,2</text>
<text x="64" y="900.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">s.</text>
<rect x="8" y="942" width="304" height="194" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="970.1" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Đo 3: chỉ lấy cột cần</text>
<rect x="20" y="987" width="280" height="46" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="1010" r="11" fill="#16a34a"/>
<polyline points="37.9,1010.4 41.7,1014.4 48.5,1006" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="1013.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">select *: đọc 202 trang.</text>
<rect x="20" y="1041" width="280" height="83" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="1064" r="11" fill="#16a34a"/>
<polyline points="37.9,1064.4 41.7,1068.4 48.5,1060" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="1067.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Hai cột có sẵn trong chỉ</text>
<text x="64" y="1086.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">mục: đọc 5 trang, không</text>
<text x="64" y="1106.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">chạm bảng.</text>
</g>
</svg>
