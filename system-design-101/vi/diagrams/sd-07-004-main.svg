<svg xmlns="http://www.w3.org/2000/svg" width="320" height="882" viewBox="0 0 320 882" role="img" aria-labelledby="title desc">
<title id="title">Web 1.0, 2.0 và 3.0</title>
<desc id="desc">Ba chặng nối nhau. Web 1.0, từ 1991 đến 2004, chỉ đọc: một danh mục trang tĩnh, nhảy từ liên kết này sang liên kết khác. Web 2.0, từ 2004 đến nay, đọc và viết: công cụ tìm kiếm, mạng xã hội, ứng dụng đề xuất; dữ liệu người dùng được các công ty lớn dùng cho quảng cáo. Web 3.0, đọc, viết và sở hữu: nội dung lưu ở IPFS và thuộc về người dùng; ứng dụng muốn dùng dữ liệu phải được cho phép và trả tiền.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs>
<rect width="320" height="882" fill="#f8fafc"/>
<g font-family="DejaVu Sans, Arial, sans-serif" fill="#0f172a">
<text x="16" y="34" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">Web 1.0, 2.0 và 3.0</text>
<text x="16" y="60.2" font-size="15" fill="#475569" font-weight="normal" text-anchor="start">Chỉ đọc, đọc và viết, đọc, viết và sở</text>
<text x="16" y="79.8" font-size="15" fill="#475569" font-weight="normal" text-anchor="start">hữu.</text>
<rect x="8" y="99" width="304" height="441" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="127.2" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Ba chặng</text>
<rect x="20" y="144" width="280" height="107" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="46" cy="170" r="14" fill="#1d4ed8"/>
<text x="46" y="175.5" font-size="16" fill="#ffffff" font-weight="bold" text-anchor="middle">1</text>
<text x="70" y="170.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Web 1.0: đọc</text>
<text x="70" y="194.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">1991 tới 2004. Trang tĩnh,</text>
<text x="70" y="213.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">nhảy giữa các liên kết,</text>
<text x="70" y="233.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">không tương tác.</text>
<rect x="20" y="273" width="280" height="126" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="46" cy="299" r="14" fill="#1d4ed8"/>
<text x="46" y="304.5" font-size="16" fill="#ffffff" font-weight="bold" text-anchor="middle">2</text>
<text x="70" y="299.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Web 2.0: đọc và viết</text>
<text x="70" y="323.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">2004 tới nay. Tìm kiếm,</text>
<text x="70" y="342.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">mạng xã hội, ứng dụng đề</text>
<text x="70" y="362.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">xuất. Dữ liệu người dùng</text>
<text x="70" y="381.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">nuôi quảng cáo.</text>
<polyline points="46,253 46,271" fill="none" stroke="#334155" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="20" y="421" width="280" height="107" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="46" cy="447" r="14" fill="#1d4ed8"/>
<text x="46" y="452.5" font-size="16" fill="#ffffff" font-weight="bold" text-anchor="middle">3</text>
<text x="70" y="447.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Web 3.0: sở hữu</text>
<text x="70" y="471.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Nội dung ở IPFS thuộc người</text>
<text x="70" y="490.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">dùng. Ứng dụng phải xin</text>
<text x="70" y="510.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">phép và trả tiền.</text>
<polyline points="46,401 46,419" fill="none" stroke="#334155" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="8" y="552" width="304" height="322" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="580.1" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Vì sao ít quảng cáo?</text>
<rect x="20" y="597" width="280" height="83" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="620" r="11" fill="#16a34a"/>
<polyline points="37.9,620.4 41.7,624.4 48.5,616" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="623.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Quảng cáo của Web 2.0</text>
<text x="64" y="642.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">sống nhờ dữ liệu người dùng</text>
<text x="64" y="662.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">mà ứng dụng giữ.</text>
<rect x="20" y="688" width="280" height="83" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="711" r="11" fill="#16a34a"/>
<polyline points="37.9,711.4 41.7,715.4 48.5,707" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="714.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Nếu dữ liệu thuộc người</text>
<text x="64" y="733.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">dùng, ứng dụng phải trả để</text>
<text x="64" y="753.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">dùng nó.</text>
<rect x="20" y="779" width="280" height="83" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="802" r="11" fill="#16a34a"/>
<polyline points="37.9,802.4 41.7,806.4 48.5,798" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="805.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Đây là ý tưởng đang được</text>
<text x="64" y="824.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">bàn, chưa phải kết quả đã</text>
<text x="64" y="844.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">có.</text>
</g>
</svg>
