<text x="46" y="896.5" font-size="16" fill="#ffffff" font-weight="bold" text-anchor="middle">3</text>
<text x="70" y="891.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Đồng bộ mỗi 2 giây</text>
<text x="70" y="915.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Trễ trung vị 640 ms;</text>
<text x="70" y="934.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">117/200 phiên bản tới nơi.</text>
