<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 420" role="img" aria-labelledby="title desc"><title id="title">Ba năng lực học qua ứng dụng đặt sân</title><desc id="desc">Ba thẻ độc lập, không phải pipeline: đọc hợp đồng, kiểm tra quyền đối tượng, xử lý mất phản hồi.</desc><rect width="320" height="420" rx="16" fill="#f8fafc"/><g font-family="Arial,sans-serif" fill="#0f172a"><rect x="12" y="14" width="296" height="118" rx="12" fill="#dbeafe"/><text x="24" y="44" font-size="19">Đọc hợp đồng</text><text x="24" y="77" font-size="16">Gửi gì? Nhận gì?</text><text x="24" y="110" font-size="16">Tham số và phản hồi</text><rect x="12" y="144" width="296" height="118" rx="12" fill="#fce7f3"/><text x="24" y="174" font-size="19">Kiểm tra quyền</text><text x="24" y="207" font-size="16">Ai được hủy lượt đặt?</text><text x="24" y="240" font-size="16">Thử cả ca bị từ chối</text><rect x="12" y="274" width="296" height="118" rx="12" fill="#dcfce7"/><text x="24" y="304" font-size="19">Xử lý lỗi</text><text x="24" y="337" font-size="16">Mất phản hồi khi tạo</text><text x="24" y="370" font-size="16">Có nên gửi lại không?</text></g></svg>
