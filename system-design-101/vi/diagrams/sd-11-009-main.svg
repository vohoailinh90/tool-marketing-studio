<svg xmlns="http://www.w3.org/2000/svg" width="360" height="420" viewBox="0 0 360 420" role="img" aria-labelledby="title desc">
<title id="title">Phát hiện node có thể đã hỏng bằng heartbeat</title>
<desc id="desc">Quan sát: Push hoặc pull heartbeat: Health check + acknowledgement; Không có tín hiệu: Chết? Mạng chậm? Tạm dừng?: Chuyển sang nghi ngờ; Ra quyết định: Timeout + quorum khi cần: Fencing trước quyền ghi mới. Các khung là ý chính để đối chiếu, không nhất thiết là các bước tuần tự.</desc>
<rect width="360" height="420" fill="#f8fafc"/>
<g font-family="DejaVu Sans, sans-serif" fill="#0f172a">
<text x="20" y="28" font-size="18" font-weight="bold">sd-11-009 · Nhìn hình trước</text>
<rect x="12" y="48" width="336" height="102" rx="12" fill="#e0f2fe" stroke="#64748b"/>
<text x="24" y="75" font-size="18" font-weight="bold">Quan sát</text>
<text x="24" y="104" font-size="18">Push hoặc pull heartbeat</text>
<text x="24" y="130" font-size="18">Health check + acknowledgement</text>
<rect x="12" y="162" width="336" height="102" rx="12" fill="#dcfce7" stroke="#64748b"/>
<text x="24" y="189" font-size="18" font-weight="bold">Không có tín hiệu</text>
<text x="24" y="218" font-size="18">Chết? Mạng chậm? Tạm dừng?</text>
<text x="24" y="244" font-size="18">Chuyển sang nghi ngờ</text>
<rect x="12" y="276" width="336" height="102" rx="12" fill="#fef3c7" stroke="#64748b"/>
<text x="24" y="303" font-size="18" font-weight="bold">Ra quyết định</text>
<text x="24" y="332" font-size="18">Timeout + quorum khi cần</text>
<text x="24" y="358" font-size="18">Fencing trước quyền ghi mới</text>
</g>
</svg>
