<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 824" width="320" height="824" role="img" aria-labelledby="title desc">
<title id="title">Chín thực hành tốt khi viết Dockerfile</title>
<desc id="desc">Năm vấn đề và cách xử lý: build chậm thì sắp lớp và dùng dockerignore, image to thì build nhiều giai đoạn, không tái lập thì ghim phiên bản, rủi ro bảo mật thì chạy không phải root và quét image, khó truy nguồn thì gắn nhãn.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#475569" stroke-width="1.5"/></marker></defs>
<rect width="320" height="824" fill="#f8fafc"/><g font-family="DejaVu Sans, Arial, sans-serif" fill="#0f172a">
<text x="16" y="30" font-size="20" font-weight="bold">VẤN ĐỀ → CÁCH XỬ LÝ</text>
<text x="16" y="58" font-size="16" font-weight="normal">Dockerfile theo nhu cầu</text>
<rect x="16" y="89" width="288" height="128" rx="10" fill="#fef3c7" stroke="#94a3b8"/>
<text x="30" y="117" font-size="16" font-weight="bold">Build chậm</text>
<text x="30" y="144" font-size="16" font-weight="normal">Tệp ít đổi lên trước để</text>
<text x="30" y="171" font-size="16" font-weight="normal">dùng cache</text>
<text x="30" y="198" font-size="16" font-weight="normal">.dockerignore bớt ngữ cảnh</text>
<rect x="16" y="229" width="288" height="101" rx="10" fill="#dbeafe" stroke="#94a3b8"/>
<text x="30" y="257" font-size="16" font-weight="bold">Image quá to</text>
<text x="30" y="284" font-size="16" font-weight="normal">Build nhiều giai đoạn</text>
<text x="30" y="311" font-size="16" font-weight="normal">Chỉ giữ thứ cần để chạy</text>
<rect x="16" y="342" width="288" height="155" rx="10" fill="#ede9fe" stroke="#94a3b8"/>
<text x="30" y="370" font-size="16" font-weight="bold">Không tái lập được</text>
<text x="30" y="397" font-size="16" font-weight="normal">Ghi rõ phiên bản, không</text>
<text x="30" y="424" font-size="16" font-weight="normal">dùng latest</text>
<text x="30" y="451" font-size="16" font-weight="normal">Cần chắc chắn thì ghim</text>
<text x="30" y="478" font-size="16" font-weight="normal">digest</text>
<rect x="16" y="509" width="288" height="155" rx="10" fill="#fee2e2" stroke="#94a3b8"/>
<text x="30" y="537" font-size="16" font-weight="bold">Rủi ro bảo mật</text>
<text x="30" y="564" font-size="16" font-weight="normal">Image chính thức, chạy</text>
<text x="30" y="591" font-size="16" font-weight="normal">không phải root</text>
<text x="30" y="618" font-size="16" font-weight="normal">Quét lỗ hổng, không để bí</text>
<text x="30" y="645" font-size="16" font-weight="normal">mật trong ENV</text>
<rect x="16" y="676" width="288" height="128" rx="10" fill="#dcfce7" stroke="#94a3b8"/>
<text x="30" y="704" font-size="16" font-weight="bold">Không biết image từ</text>
<text x="30" y="731" font-size="16" font-weight="bold">đâu</text>
<text x="30" y="758" font-size="16" font-weight="normal">Gắn nhãn chuẩn (nguồn,</text>
<text x="30" y="785" font-size="16" font-weight="normal">phiên bản)</text>
</g></svg>
