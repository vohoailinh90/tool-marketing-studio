<svg xmlns="http://www.w3.org/2000/svg" width="320" height="837" viewBox="0 0 320 837" role="img" aria-labelledby="title desc">
<title id="title">Chín mẫu kiến trúc</title>
<desc id="desc">Hai khung. Khung một, năm mẫu về cách các thành phần giao tiếp và phối hợp: Peer-to-Peer, API Gateway, Request-Response, Pub-Sub, Orchestration; mỗi ghi chú nói mẫu đó giải quyết gì. Khung hai, bốn mẫu về dữ liệu: Event Sourcing, ETL, Batching, Streaming Processing.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs>
<rect width="320" height="837" fill="#f8fafc"/>
<g font-family="DejaVu Sans, Arial, sans-serif" fill="#0f172a">
<text x="16" y="34" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">Chín mẫu kiến trúc</text>
<text x="16" y="60.2" font-size="15" fill="#475569" font-weight="normal" text-anchor="start">Giao tiếp, và dòng dữ liệu.</text>
<rect x="8" y="80" width="304" height="404" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="108.2" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Giao tiếp và phối hợp</text>
<rect x="20" y="125" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="148" r="11" fill="#16a34a"/>
<polyline points="37.9,148.4 41.7,152.4 48.5,144" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="151.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Peer-to-Peer: không cần máy</text>
<text x="64" y="170.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">chủ trung tâm.</text>
<rect x="20" y="196" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="219" r="11" fill="#16a34a"/>
<polyline points="37.9,219.4 41.7,223.4 48.5,215" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="222.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">API Gateway: một cửa vào</text>
<text x="64" y="241.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">cho nhiều dịch vụ.</text>
<rect x="20" y="267" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="290" r="11" fill="#16a34a"/>
<polyline points="37.9,290.4 41.7,294.4 48.5,286" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="293.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Request-Response: hỏi rồi</text>
<text x="64" y="312.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">chờ đáp.</text>
<rect x="20" y="338" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="361" r="11" fill="#16a34a"/>
<polyline points="37.9,361.4 41.7,365.4 48.5,357" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="364.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Pub-Sub: tách bên gửi khỏi</text>
<text x="64" y="383.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">bên nhận.</text>
<rect x="20" y="409" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="432" r="11" fill="#16a34a"/>
<polyline points="37.9,432.4 41.7,436.4 48.5,428" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="435.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Orchestration: một bộ điều</text>
<text x="64" y="454.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">phối chỉ huy.</text>
<rect x="8" y="496" width="304" height="333" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="524.1" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Dữ liệu</text>
<rect x="20" y="541" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="564" r="11" fill="#16a34a"/>
<polyline points="37.9,564.4 41.7,568.4 48.5,560" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="567.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Event Sourcing: lưu chuỗi sự</text>
<text x="64" y="586.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">kiện.</text>
<rect x="20" y="612" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="635" r="11" fill="#16a34a"/>
<polyline points="37.9,635.4 41.7,639.4 48.5,631" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="638.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">ETL: gom dữ liệu từ nguồn</text>
<text x="64" y="657.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">về kho.</text>
<rect x="20" y="683" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="706" r="11" fill="#16a34a"/>
<polyline points="37.9,706.4 41.7,710.4 48.5,702" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="709.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Batching: gom lô rồi xử lý</text>
<text x="64" y="728.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">một lần.</text>
<rect x="20" y="754" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="777" r="11" fill="#16a34a"/>
<polyline points="37.9,777.4 41.7,781.4 48.5,773" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="780.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Streaming: xử lý từng bản</text>
<text x="64" y="799.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">ghi ngay.</text>
</g>
</svg>
