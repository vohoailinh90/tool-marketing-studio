<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 420" role="img" aria-labelledby="title desc"><title id="title">Ba câu hỏi rà soát giao tiếp</title><desc id="desc">Danh mục hạt giống: tài nguyên, yêu cầu và chính sách dùng lại. Không phải bằng chứng tuân thủ mọi ràng buộc REST.</desc><rect width="320" height="420" rx="16" fill="#f8fafc"/><g font-family="Arial,sans-serif" fill="#0f172a"><rect x="12" y="14" width="296" height="118" rx="12" fill="#dbeafe"/><text x="24" y="44" font-size="19">Đang hỏi gì?</text><text x="24" y="77" font-size="16">GET /seeds/7</text><text x="24" y="110" font-size="16">Biểu diễn hạt giống số7</text><rect x="12" y="144" width="296" height="118" rx="12" fill="#dcfce7"/><text x="24" y="174" font-size="19">Đủ thông tin để hiểu?</text><text x="24" y="207" font-size="16">Yêu cầu hiện tại tự đủ</text><text x="24" y="240" font-size="16">Không cần nhớ bước trước</text><rect x="12" y="274" width="296" height="118" rx="12" fill="#fef3c7"/><text x="24" y="304" font-size="19">Được dùng lại không?</text><text x="24" y="337" font-size="16">Cache-Control: no-store</text><text x="24" y="370" font-size="16">Ví dụ: không lưu phản hồi</text></g></svg>
