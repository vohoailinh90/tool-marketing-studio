<svg xmlns="http://www.w3.org/2000/svg" width="320" height="1240" viewBox="0 0 320 1240" role="img" aria-labelledby="title desc">
<title id="title">Một câu SQL đi qua những chặng nào?</title>
<desc id="desc">Khung một, bốn chặng trước khi đụng dữ liệu: kết nối, câu lệnh đến qua TCP hoặc qua socket Unix trên cùng máy; phân tích cú pháp, gõ sai từ khóa thì báo lỗi cú pháp; phân tích ngữ nghĩa, tra danh mục, mở và khóa bảng, báo lỗi nếu bảng hay cột không có; viết lại, truy vấn vào một view được thay bằng bảng gốc. Khung hai, hai chặng còn lại: lập kế hoạch, chọn quét cả bảng hay dùng chỉ mục theo ước tính chi phí; thực thi, đọc các trang dữ liệu qua bộ đệm chung. Khung ba, điều thấy được: lọc một khách dùng chỉ mục còn lọc 93 phần trăm số dòng thì quét cả bảng; lần đọc đầu phải nạp 1.082 trang, lần hai cả 1.082 trang đã có sẵn; câu select cũng khóa bảng ngay từ lúc phân tích ngữ nghĩa.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs>
<rect width="320" height="1240" fill="#f8fafc"/>
<g font-family="DejaVu Sans, Arial, sans-serif" fill="#0f172a">
<text x="16" y="34" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">Một câu SQL đi qua</text>
<text x="16" y="58" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">những chặng nào?</text>
<rect x="8" y="78" width="304" height="533" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="106.2" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Bốn chặng trước khi đụng</text>
<text x="20" y="128.2" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">dữ liệu</text>
<rect x="20" y="145" width="280" height="107" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="46" cy="171" r="14" fill="#1d4ed8"/>
<text x="46" y="176.5" font-size="16" fill="#ffffff" font-weight="bold" text-anchor="middle">1</text>
<text x="70" y="171.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Kết nối</text>
<text x="70" y="195.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Câu lệnh đến qua TCP, hoặc</text>
<text x="70" y="214.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">qua socket Unix trên cùng</text>
<text x="70" y="234.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">máy.</text>
<rect x="20" y="274" width="280" height="87" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="46" cy="300" r="14" fill="#1d4ed8"/>
<text x="46" y="305.5" font-size="16" fill="#ffffff" font-weight="bold" text-anchor="middle">2</text>
<text x="70" y="300.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Phân tích cú pháp</text>
<text x="70" y="324.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Gõ sai từ khóa bị chặn ở</text>
<text x="70" y="343.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">đây: lỗi cú pháp.</text>
<polyline points="46,254 46,272" fill="none" stroke="#334155" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="20" y="383" width="280" height="107" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="46" cy="409" r="14" fill="#1d4ed8"/>
<text x="46" y="414.5" font-size="16" fill="#ffffff" font-weight="bold" text-anchor="middle">3</text>
<text x="70" y="409.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Phân tích ngữ nghĩa</text>
<text x="70" y="433.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Tra danh mục, mở và khóa</text>
<text x="70" y="452.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">bảng; không có bảng hay</text>
<text x="70" y="472.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">cột thì báo lỗi.</text>
<polyline points="46,363 46,381" fill="none" stroke="#334155" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="20" y="512" width="280" height="87" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="46" cy="538" r="14" fill="#1d4ed8"/>
<text x="46" y="543.5" font-size="16" fill="#ffffff" font-weight="bold" text-anchor="middle">4</text>
<text x="70" y="538.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Viết lại</text>
<text x="70" y="562.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Truy vấn vào view được</text>
<text x="70" y="581.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">thay bằng bảng gốc.</text>
<polyline points="46,492 46,510" fill="none" stroke="#334155" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="8" y="623" width="304" height="253" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="651.1" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Hai chặng còn lại</text>
<rect x="20" y="668" width="280" height="87" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
<circle cx="46" cy="694" r="14" fill="#0f766e"/>
<text x="46" y="699.5" font-size="16" fill="#ffffff" font-weight="bold" text-anchor="middle">1</text>
<text x="70" y="694.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Lập kế hoạch</text>
<text x="70" y="718.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Ước tính chi phí, chọn quét</text>
<text x="70" y="737.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">cả bảng hay dùng chỉ mục.</text>
<rect x="20" y="777" width="280" height="87" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
<circle cx="46" cy="803" r="14" fill="#0f766e"/>
<text x="46" y="808.5" font-size="16" fill="#ffffff" font-weight="bold" text-anchor="middle">2</text>
<text x="70" y="803.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Thực thi</text>
<text x="70" y="827.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Đọc trang dữ liệu qua bộ</text>
<text x="70" y="846.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">đệm chung, trả từng dòng.</text>
<polyline points="46,757 46,775" fill="none" stroke="#334155" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="8" y="888" width="304" height="344" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="916.1" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Thấy được trên PostgreSQL</text>
<text x="20" y="938.2" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">16</text>
<rect x="20" y="955" width="280" height="83" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="978" r="11" fill="#16a34a"/>
<polyline points="37.9,978.4 41.7,982.4 48.5,974" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="981.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Lọc 1 khách: dùng chỉ mục.</text>
<text x="64" y="1000.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Lọc 93% số dòng: quét cả</text>
<text x="64" y="1020.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">bảng.</text>
<rect x="20" y="1046" width="280" height="83" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="1069" r="11" fill="#16a34a"/>
<polyline points="37.9,1069.4 41.7,1073.4 48.5,1065" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="1072.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Lần đọc đầu nạp 1.082</text>
<text x="64" y="1091.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">trang; lần hai cả 1.082 trang</text>
<text x="64" y="1111.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">có sẵn.</text>
<rect x="20" y="1137" width="280" height="83" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="1160" r="11" fill="#16a34a"/>
<polyline points="37.9,1160.4 41.7,1164.4 48.5,1156" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="1163.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Câu select cũng khóa bảng,</text>
<text x="64" y="1182.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">ngay từ lúc phân tích ngữ</text>
<text x="64" y="1202.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">nghĩa.</text>
</g>
</svg>
