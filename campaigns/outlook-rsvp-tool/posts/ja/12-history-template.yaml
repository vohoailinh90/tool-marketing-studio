id: 12-history-template
status: draft
format: portrait
series: "幹事の業務効率化 · #12"
link: survey
slides:
  - layout: cover
    emoji: "📚"
    eyebrow: "履歴とテンプレート"
    title: "イベントは**すべて履歴に残る**。次は、ゼロからやり直さない"
    subtitle: "履歴、部費の残高、そして過去のイベントをひな形として再利用。"

  - layout: table
    title: "履歴タブ"
    columns: ["イベント", "収入", "支出", "収支", "部費残高"]
    rows:
      - ["忘年会", "150,000", "142,000", {text: "8,000", tone: ok}, "8,000"]
      - ["誕生日会", "15,000", "17,000", {text: "-2,000", tone: bad}, "6,000"]
      - ["送別会", "30,000", "25,000", {text: "5,000", tone: ok}, "11,000"]
    note: "数字はイメージです。部費残高は収支の累計です。"

  - layout: features
    title: "金額の列は手入力ではなく、ツールが計算"
    items:
      - {emoji: "💵", title: "収入・支出・収支", text: "すべての回と、プレゼント代も合算"}
      - {emoji: "👤", title: "一人あたりの金額", text: "実際の参加人数と、1次会の一人あたりの金額"}
      - {emoji: "🏦", title: "部費残高", text: "最初のイベントから、その行までの収支の累計"}
      - {emoji: "✏️", title: "セルをダブルクリックで編集", text: "編集したセルだけが保存されます"}

  - layout: flow
    variant: after
    title: "過去のイベントをひな形にする"
    steps:
      - {emoji: "🔎", text: "検索ボックスで過去のイベントを探す（全項目、または場所などの項目を指定）"}
      - {emoji: "⬅️", text: "**Load setup from selected event** を押す"}
      - {emoji: "🏷️", text: "**イベントID**を新しいものに変更"}
      - {emoji: "✉️", text: "案内メールを送信。参加者リストは新しいIDについてきます"}

  - layout: pains
    tone: accent
    title: "使い回すときの注意"
    items:
      - {emoji: "ℹ️", text: "開いているイベントの内容は、選んだイベントの内容に**置き換わります**"}
      - {emoji: "ℹ️", text: "投票・出席・支払い済み金額は、元のイベントに**残ります**"}
      - {emoji: "ℹ️", text: "Copilot の翻訳や手で直したメールが消える場合は、先に確認が出ます"}
    note: "すべてのデータはPC内の一つのファイルに保存されます。定期的なバックアップをおすすめします。"

  - layout: cta
    emoji: "📂"
    title: "去年のイベントの記録、**どこに**残っていますか？"
    text: "Excel、メール、誰かの頭の中…？コメントで教えてください。"

platforms:
  facebook:
    caption: |
      「去年の忘年会、どのお店だっけ？」「部費はいくら残ってる？」…幹事の引き継ぎあるあるです😅

      イベントごとにファイルが別々だと、履歴が散らばりやすく、次の幹事がゼロからやり直しになりがちです。

      このツールでは
      ・イベントごとに、Yes・No・Maybeの人数とメールの送信状況を履歴に保存
      ・収入・支出・収支はツールが計算（すべての回とプレゼント代を合算）
      ・部費残高は、最初のイベントからの収支の累計
      ・似た会は、過去のイベントを読み込み、イベントIDを変えて使います。参加者リストは新しいIDについてきます（投票・出席・支払い済み金額は元のイベントに残ります）

      データはPC内の一つのファイルなので、定期的なバックアップをおすすめします。

      去年のイベントの記録、どこに残っていますか？コメントで教えてください👇
    first_comment: |
      📋 短いアンケート — 履歴の管理方法を教えてください：{link}
    hashtags: [幹事, Outlook, 部費, 業務効率化, 履歴管理]
