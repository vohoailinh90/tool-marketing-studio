<svg xmlns="http://www.w3.org/2000/svg" width="320" height="420" viewBox="0 0 320 420" role="img" aria-labelledby="title desc"><title id="title">Kiểm thử API: chọn câu hỏi trước tên gọi</title><desc id="desc">Ba góc nhìn kiểm tra độc lập, không phải quy trình bắt buộc.</desc><rect width="320" height="420" rx="16" fill="#f8fafc"/><g font-family="Arial,sans-serif" fill="#0f172a"><rect x="12" y="14" width="296" height="118" rx="12" fill="#dbeafe"/><text x="26" y="42" font-size="19">Đúng quy tắc?</text><text x="26" y="71" font-size="17">Chức năng</text><text x="26" y="102" font-size="16">Hạn trả đúng quy định</text><rect x="12" y="144" width="296" height="118" rx="12" fill="#dcfce7"/><text x="26" y="172" font-size="19">Nối đúng thành phần?</text><text x="26" y="201" font-size="17">Tích hợp</text><text x="26" y="232" font-size="16">Tạo phiếu → đọc lại</text><rect x="12" y="274" width="296" height="118" rx="12" fill="#fef3c7"/><text x="26" y="302" font-size="19">Đáp ứng dưới tải?</text><text x="26" y="331" font-size="17">Tải</text><text x="26" y="362" font-size="16">Đo độ trễ và tỷ lệ lỗi</text></g></svg>
