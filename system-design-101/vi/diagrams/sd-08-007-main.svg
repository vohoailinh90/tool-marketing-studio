<svg xmlns="http://www.w3.org/2000/svg" width="320" height="1311" viewBox="0 0 320 1311" role="img" aria-labelledby="title desc">
<title id="title">Chín việc làm khi phát triển dịch vụ nhỏ</title>
<desc id="desc">Bốn khung. Khung một, cách chia việc: dữ liệu riêng cho mỗi dịch vụ, mỗi dịch vụ một trách nhiệm, thiết kế theo miền nghiệp vụ. Khung hai, cách xây và chạy: bản xây riêng, đóng gói container, dịch vụ không giữ trạng thái. Khung ba, cách ghép: giao diện người dùng chia nhỏ, điều phối các dịch vụ, giữ mã ở cùng mức trưởng thành. Khung bốn, thử với ba bản chạy và phân phát lượt vòng tròn: giữ phiên trong bộ nhớ thì chỉ 20 phần trăm lượt có phiên hợp lệ, còn giữ ở kho chung thì 100 phần trăm, đổi lại mỗi lượt chậm thêm khoảng 65 đến 150 micro giây.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs>
<rect width="320" height="1311" fill="#f8fafc"/>
<g font-family="DejaVu Sans, Arial, sans-serif" fill="#0f172a">
<text x="16" y="34" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">Chín việc làm khi phát</text>
<text x="16" y="58" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">triển dịch vụ nhỏ</text>
<text x="16" y="84.2" font-size="15" fill="#475569" font-weight="normal" text-anchor="start">Việc nào có chỗ đối chiếu, và giữ</text>
<text x="16" y="103.8" font-size="15" fill="#475569" font-weight="normal" text-anchor="start">trạng thái ngoài tiến trình giá bao</text>
<text x="16" y="123.2" font-size="15" fill="#475569" font-weight="normal" text-anchor="start">nhiêu.</text>
<rect x="8" y="143" width="304" height="262" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="171.2" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Cách chia việc</text>
<rect x="20" y="188" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="211" r="11" fill="#16a34a"/>
<polyline points="37.9,211.4 41.7,215.4 48.5,207" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="214.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Dữ liệu riêng cho mỗi dịch</text>
<text x="64" y="233.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">vụ.</text>
<rect x="20" y="259" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="282" r="11" fill="#16a34a"/>
<polyline points="37.9,282.4 41.7,286.4 48.5,278" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="285.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Mỗi dịch vụ một trách</text>
<text x="64" y="304.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">nhiệm.</text>
<rect x="20" y="330" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="353" r="11" fill="#16a34a"/>
<polyline points="37.9,353.4 41.7,357.4 48.5,349" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="356.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Thiết kế theo miền nghiệp</text>
<text x="64" y="375.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">vụ.</text>
<rect x="8" y="417" width="304" height="245" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="445.2" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Cách xây và chạy</text>
<rect x="20" y="462" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="485" r="11" fill="#16a34a"/>
<polyline points="37.9,485.4 41.7,489.4 48.5,481" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="488.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Mỗi dịch vụ một bản xây</text>
<text x="64" y="507.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">riêng.</text>
<rect x="20" y="533" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="556" r="11" fill="#16a34a"/>
<polyline points="37.9,556.4 41.7,560.4 48.5,552" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="559.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Đóng gói và chạy trong</text>
<text x="64" y="578.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">container.</text>
<rect x="20" y="604" width="280" height="46" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="627" r="11" fill="#16a34a"/>
<polyline points="37.9,627.4 41.7,631.4 48.5,623" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="630.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Dịch vụ không giữ trạng thái.</text>
<rect x="8" y="674" width="304" height="245" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="702.1" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Cách ghép và phối hợp</text>
<rect x="20" y="719" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="742" r="11" fill="#16a34a"/>
<polyline points="37.9,742.4 41.7,746.4 48.5,738" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="745.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Chia nhỏ cả giao diện người</text>
<text x="64" y="764.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">dùng.</text>
<rect x="20" y="790" width="280" height="46" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="813" r="11" fill="#16a34a"/>
<polyline points="37.9,813.4 41.7,817.4 48.5,809" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="816.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Điều phối các dịch vụ.</text>
<rect x="20" y="844" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="867" r="11" fill="#16a34a"/>
<polyline points="37.9,867.4 41.7,871.4 48.5,863" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="870.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Giữ mã ở cùng mức trưởng</text>
<text x="64" y="889.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">thành.</text>
<rect x="8" y="931" width="304" height="372" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="959.1" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Thử: phiên đặt ở đâu</text>
<rect x="20" y="976" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="999" r="11" fill="#16a34a"/>
<polyline points="37.9,999.4 41.7,1003.4 48.5,995" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="1002.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Phiên trong bộ nhớ từng</text>
<text x="64" y="1021.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">bản: 20% lượt hợp lệ.</text>
<rect x="20" y="1047" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="1070" r="11" fill="#16a34a"/>
<polyline points="37.9,1070.4 41.7,1074.4 48.5,1066" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="1073.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Phiên ở kho chung: 100%</text>
<text x="64" y="1092.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">lượt hợp lệ.</text>
<rect x="20" y="1118" width="280" height="102" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="1141" r="11" fill="#16a34a"/>
<polyline points="37.9,1141.4 41.7,1145.4 48.5,1137" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="1144.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Một bản biến mất: 100 phiên</text>
<text x="64" y="1163.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">mất thật, 200 trên 301 yêu</text>
<text x="64" y="1183.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">cầu đầu bị từ chối; kho</text>
<text x="64" y="1202.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">chung 0.</text>
<rect x="20" y="1228" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="1251" r="11" fill="#16a34a"/>
<polyline points="37.9,1251.4 41.7,1255.4 48.5,1247" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="1254.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Giá: chậm thêm khoảng 65</text>
<text x="64" y="1273.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">đến 150 µs mỗi lượt.</text>
</g>
</svg>
