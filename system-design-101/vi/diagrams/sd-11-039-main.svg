<svg xmlns="http://www.w3.org/2000/svg" width="360" height="420" viewBox="0 0 360 420" role="img" aria-labelledby="title desc">
<title id="title">Chọn load balancer cloud theo đường request</title>
<desc id="desc">L4: TCP/UDP theo sản phẩm: Đặc tính kết nối và IP; L7: HTTP host/path/header: TLS termination khi cấu hình; So sản phẩm: Protocol • scope • health: Timeout • draining • giá. Các khung là ý chính để đối chiếu, không nhất thiết là các bước tuần tự.</desc>
