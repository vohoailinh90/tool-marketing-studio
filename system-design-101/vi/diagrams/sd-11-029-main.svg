<svg xmlns="http://www.w3.org/2000/svg" width="360" height="420" viewBox="0 0 360 420" role="img" aria-labelledby="title desc">
<title id="title">Retry: chọn khoảng chờ và ngân sách</title>
<desc id="desc">Linear: 1 → 2 → 3 giây: Có hoặc không jitter; Exponential: 1 → 2 → 4 → 8 giây: Có trần • thêm jitter; Điều kiện thử lại: Lỗi tạm + lặp an toàn: Deadline + retry budget. Các khung là ý chính để đối chiếu, không nhất thiết là các bước tuần tự.</desc>
<rect width="360" height="420" fill="#f8fafc"/>
<g font-family="DejaVu Sans, sans-serif" fill="#0f172a">
<text x="20" y="28" font-size="18" font-weight="bold">sd-11-029 · Nhìn hình trước</text>
<rect x="12" y="48" width="336" height="102" rx="12" fill="#e0f2fe" stroke="#64748b"/>
<text x="24" y="75" font-size="18" font-weight="bold">Linear</text>
<text x="24" y="104" font-size="18">1 → 2 → 3 giây</text>
<text x="24" y="130" font-size="18">Có hoặc không jitter</text>
<rect x="12" y="162" width="336" height="102" rx="12" fill="#dcfce7" stroke="#64748b"/>
<text x="24" y="189" font-size="18" font-weight="bold">Exponential</text>
<text x="24" y="218" font-size="18">1 → 2 → 4 → 8 giây</text>
<text x="24" y="244" font-size="18">Có trần • thêm jitter</text>
<rect x="12" y="276" width="336" height="102" rx="12" fill="#fef3c7" stroke="#64748b"/>
<text x="24" y="303" font-size="18" font-weight="bold">Điều kiện thử lại</text>
<text x="24" y="332" font-size="18">Lỗi tạm + lặp an toàn</text>
<text x="24" y="358" font-size="18">Deadline + retry budget</text>
</g>
</svg>
