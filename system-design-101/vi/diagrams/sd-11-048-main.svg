<text x="16" y="60.2" font-size="15" fill="#475569" font-weight="normal" text-anchor="start">Năm chặng, và bảng nguồn thử với</text>
<text x="16" y="79.8" font-size="15" fill="#475569" font-weight="normal" text-anchor="start">bảng Microsoft.</text>
<rect x="8" y="99" width="304" height="211" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="127.2" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Năm chặng</text>
