<svg xmlns="http://www.w3.org/2000/svg" width="320" height="869" viewBox="0 0 320 869" role="img" aria-labelledby="title desc">
<title id="title">Hai thập kỷ đám mây</title>
<desc id="desc">Hai khung. Khung một, bốn cột mốc đầu nối nhau: năm 2001 VMware đưa ảo hóa bằng hypervisor; năm 2006 AWS cho thuê hạ tầng như một dịch vụ; năm 2009 Heroku đưa nền tảng như một dịch vụ; năm 2010 OpenStack là hạ tầng mã nguồn mở. Khung hai, ba cột mốc sau: năm 2011 Cloud Foundry là nền tảng mã nguồn mở; năm 2013 Docker đưa container; năm 2015 CNCF lập ra để giữ cloud native.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs>
<rect width="320" height="869" fill="#f8fafc"/>
