<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 792" width="320" height="792" role="img" aria-labelledby="title desc">
<title id="title">Vì sao Nginx nhanh và phổ biến</title>
<desc id="desc">Bốn tình huống và lý do thiết kế: nhiều kết nối chờ chậm nhờ vòng lặp sự kiện, đổi cấu hình không rớt kết nối nhờ master và worker, máy chủ phía sau quá tải nhờ reverse proxy chia tải và cache, HTTPS nhờ kết thúc TLS ở rìa.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#475569" stroke-width="1.5"/></marker></defs>
<rect width="320" height="792" fill="#f8fafc"/><g font-family="DejaVu Sans, Arial, sans-serif" fill="#0f172a">
<text x="16" y="30" font-size="20" font-weight="bold">NGINX QUA TÌNH HUỐNG</text>
<text x="16" y="58" font-size="16" font-weight="normal">Mỗi tình huống một lựa chọn</text>
<text x="16" y="85" font-size="16" font-weight="normal">thiết kế</text>
<rect x="16" y="116" width="288" height="182" rx="10" fill="#dbeafe" stroke="#94a3b8"/>
<text x="30" y="144" font-size="16" font-weight="bold">Hàng nghìn kết nối chờ</text>
<text x="30" y="171" font-size="16" font-weight="bold">chậm</text>
<text x="30" y="198" font-size="16" font-weight="normal">Worker dùng vòng lặp sự</text>
<text x="30" y="225" font-size="16" font-weight="normal">kiện</text>
<text x="30" y="252" font-size="16" font-weight="normal">Không giữ một luồng cho mỗi</text>
<text x="30" y="279" font-size="16" font-weight="normal">kết nối</text>
<rect x="16" y="310" width="288" height="155" rx="10" fill="#ede9fe" stroke="#94a3b8"/>
<text x="30" y="338" font-size="16" font-weight="bold">Đổi cấu hình lúc đang</text>
<text x="30" y="365" font-size="16" font-weight="bold">chạy</text>
<text x="30" y="392" font-size="16" font-weight="normal">Master mở worker mới</text>
<text x="30" y="419" font-size="16" font-weight="normal">Worker cũ xong việc mới</text>
<text x="30" y="446" font-size="16" font-weight="normal">thoát</text>
<rect x="16" y="477" width="288" height="155" rx="10" fill="#fef3c7" stroke="#94a3b8"/>
<text x="30" y="505" font-size="16" font-weight="bold">Máy chủ phía sau quá</text>
<text x="30" y="532" font-size="16" font-weight="bold">tải</text>
<text x="30" y="559" font-size="16" font-weight="normal">Reverse proxy chia tải</text>
<text x="30" y="586" font-size="16" font-weight="normal">Cache giảm số request tới</text>
<text x="30" y="613" font-size="16" font-weight="normal">máy chủ</text>
<rect x="16" y="644" width="288" height="128" rx="10" fill="#dcfce7" stroke="#94a3b8"/>
<text x="30" y="672" font-size="16" font-weight="bold">Phải phục vụ HTTPS</text>
<text x="30" y="699" font-size="16" font-weight="normal">Giải mã TLS tại Nginx</text>
<text x="30" y="726" font-size="16" font-weight="normal">Chuyển tiếp nội bộ cho ứng</text>
<text x="30" y="753" font-size="16" font-weight="normal">dụng</text>
</g></svg>
