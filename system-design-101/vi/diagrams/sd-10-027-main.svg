<text x="70" y="1401.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Truyền bảng giảm giá vào</text>
<text x="70" y="1420.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">hàm.</text>
<polyline points="46,1331 46,1349" fill="none" stroke="#334155" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="20" y="1460" width="280" height="87" rx="10" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/>
