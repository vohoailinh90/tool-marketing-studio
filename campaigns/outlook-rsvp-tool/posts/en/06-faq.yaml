platforms:
  facebook:
    caption: |
      The questions I get most about Outlook RSVP Tool, in one place 👇

      In short: your data never leaves your PC, there's no API key and no app registration to request from IT, and recipients install nothing — they just click a button in the email.

      And honestly, what it does NOT do yet: no Mac, no scheduled automatic reminders, and it still needs Python installed (no one-click installer yet). If one of these is your reason not to use it, please tell me — it helps me decide what comes first.

      Any other questions? Ask away in the comments.
    first_comment: |
      📋 Help me prioritise with a 3-minute survey: {link}
