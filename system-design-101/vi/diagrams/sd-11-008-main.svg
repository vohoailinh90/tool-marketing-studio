<svg xmlns="http://www.w3.org/2000/svg" width="360" height="420" viewBox="0 0 360 420" role="img" aria-labelledby="title desc">
<title id="title">Năm đánh đổi thường gặp trong thiết kế</title>
<desc id="desc">Tài nguyên: Chi phí ↔ hiệu năng: Tin cậy ↔ mở rộng; Dữ liệu và quyền: Hiệu năng ↔ nhất quán: Bảo mật ↔ linh hoạt; Cách làm: Tốc độ phát triển ↔ chất lượng: Chốt yêu cầu trước khi chọn. Các khung là ý chính để đối chiếu, không nhất thiết là các bước tuần tự.</desc>
<rect width="360" height="420" fill="#f8fafc"/>
<g font-family="DejaVu Sans, sans-serif" fill="#0f172a">
<text x="20" y="28" font-size="18" font-weight="bold">sd-11-008 · Nhìn hình trước</text>
<rect x="12" y="48" width="336" height="102" rx="12" fill="#e0f2fe" stroke="#64748b"/>
<text x="24" y="75" font-size="18" font-weight="bold">Tài nguyên</text>
<text x="24" y="104" font-size="18">Chi phí ↔ hiệu năng</text>
<text x="24" y="130" font-size="18">Tin cậy ↔ mở rộng</text>
<rect x="12" y="162" width="336" height="102" rx="12" fill="#dcfce7" stroke="#64748b"/>
<text x="24" y="189" font-size="18" font-weight="bold">Dữ liệu và quyền</text>
<text x="24" y="218" font-size="18">Hiệu năng ↔ nhất quán</text>
<text x="24" y="244" font-size="18">Bảo mật ↔ linh hoạt</text>
<rect x="12" y="276" width="336" height="102" rx="12" fill="#fef3c7" stroke="#64748b"/>
<text x="24" y="303" font-size="18" font-weight="bold">Cách làm</text>
<text x="24" y="332" font-size="18">Tốc độ phát triển ↔ chất lượng</text>
<text x="24" y="358" font-size="18">Chốt yêu cầu trước khi chọn</text>
</g>
</svg>
