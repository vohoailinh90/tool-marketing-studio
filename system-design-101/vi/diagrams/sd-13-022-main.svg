<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 554" width="320" height="554" role="img" aria-labelledby="title desc">
<title id="title">Phân tích nhật ký trên dòng lệnh theo từng việc</title>
<desc id="desc">Năm việc và lệnh tương ứng: giữ dòng lỗi bằng grep, lấy tên dịch vụ bằng awk, đếm mỗi dịch vụ bằng sort và uniq -c, xếp hạng bằng sort -rn, che dữ liệu nhạy cảm bằng sed.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#475569" stroke-width="1.5"/></marker></defs>
<rect width="320" height="554" fill="#f8fafc"/><g font-family="DejaVu Sans, Arial, sans-serif" fill="#0f172a">
<text x="16" y="30" font-size="20" font-weight="bold">VIỆC → LỆNH</text>
<text x="16" y="58" font-size="16" font-weight="normal">Giả sử mỗi dòng: ngày giờ</text>
<text x="16" y="85" font-size="16" font-weight="normal">MỨC dịch_vụ nội_dung</text>
<rect x="16" y="116" width="288" height="74" rx="10" fill="#dbeafe" stroke="#94a3b8"/>
<text x="30" y="144" font-size="16" font-weight="bold">Chỉ giữ dòng lỗi</text>
<text x="30" y="171" font-size="16" font-weight="normal">grep ERROR app.log</text>
<rect x="16" y="202" width="288" height="74" rx="10" fill="#ede9fe" stroke="#94a3b8"/>
<text x="30" y="230" font-size="16" font-weight="bold">Lấy tên dịch vụ</text>
<text x="30" y="257" font-size="16" font-weight="normal">awk '{print $4}'</text>
<rect x="16" y="288" width="288" height="74" rx="10" fill="#fef3c7" stroke="#94a3b8"/>
<text x="30" y="316" font-size="16" font-weight="bold">Đếm mỗi dịch vụ</text>
<text x="30" y="343" font-size="16" font-weight="normal">sort | uniq -c</text>
<rect x="16" y="374" width="288" height="74" rx="10" fill="#dcfce7" stroke="#94a3b8"/>
<text x="30" y="402" font-size="16" font-weight="bold">Xếp hạng nhiều nhất</text>
<text x="30" y="429" font-size="16" font-weight="normal">sort -rn</text>
<rect x="16" y="460" width="288" height="74" rx="10" fill="#fee2e2" stroke="#94a3b8"/>
<text x="30" y="488" font-size="16" font-weight="bold">Che dữ liệu nhạy cảm</text>
<text x="30" y="515" font-size="16" font-weight="normal">sed 's/[0-9]\{16\}/****/g'</text>
</g></svg>
