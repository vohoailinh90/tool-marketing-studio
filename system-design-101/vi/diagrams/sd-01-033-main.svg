<svg xmlns="http://www.w3.org/2000/svg" width="320" height="785" viewBox="0 0 320 785" role="img" aria-labelledby="title desc"><title id="title">So sánh sáu cách giao tiếp: bắt đầu từ nhu cầu</title><desc id="desc">Sáu điểm đối chiếu khác cấp khái niệm, có thể phối hợp; không xếp hạng hiệu năng.</desc><rect width="320" height="785" fill="#f8fafc"/><g font-family="Arial, sans-serif" font-size="16" fill="#0f172a"><text x="16" y="32" font-size="20" font-weight="bold">CẦN TRAO ĐỔI KIỂU GÌ?</text>
<rect x="12" y="55" width="296" height="98" rx="12" fill="#dbeafe"/><text x="22" y="84" font-weight="bold">SOAP</text><text x="22" y="125">Khung thông điệp</text>
<rect x="12" y="167" width="296" height="98" rx="12" fill="#dcfce7"/><text x="22" y="196" font-weight="bold">REST</text><text x="22" y="237">Tài nguyên / giao diện thống nhất</text>
<rect x="12" y="279" width="296" height="98" rx="12" fill="#fef3c7"/><text x="22" y="308" font-weight="bold">GraphQL</text><text x="22" y="349">Chọn trường theo schema</text>
<rect x="12" y="391" width="296" height="98" rx="12" fill="#fce7f3"/><text x="22" y="420" font-weight="bold">gRPC</text><text x="22" y="461">Phương thức · gọi đơn / luồng</text>
<rect x="12" y="503" width="296" height="98" rx="12" fill="#ede9fe"/><text x="22" y="532" font-weight="bold">WebSocket</text><text x="22" y="573">Kênh hai chiều sau bắt tay</text>
<rect x="12" y="615" width="296" height="98" rx="12" fill="#cffafe"/><text x="22" y="644" font-weight="bold">Webhook</text><text x="22" y="685">Gửi sự kiện tới nơi đăng ký</text>
<text x="16" y="760">Một hệ thống có thể phối hợp nhiều cách.</text></g></svg>
