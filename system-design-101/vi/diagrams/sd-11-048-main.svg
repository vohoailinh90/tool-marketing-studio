<polyline points="37.9,221.4 41.7,225.4 48.5,217" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="224.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Tính toán, rồi kho dữ liệu.</text>
<rect x="20" y="252" width="280" height="46" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="275" r="11" fill="#16a34a"/>
<polyline points="37.9,275.4 41.7,279.4 48.5,271" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="278.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Cuối cùng là trình bày.</text>
<rect x="8" y="322" width="304" height="302" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="350.2" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Nguồn nêu</text>
<rect x="20" y="367" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="390" r="11" fill="#16a34a"/>
<polyline points="37.9,390.4 41.7,394.4 48.5,386" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="393.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">AWS: Kinesis, S3, EMR,</text>
<text x="64" y="412.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Redshift, QuickSight.</text>
