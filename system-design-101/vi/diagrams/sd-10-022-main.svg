<text x="78" y="319.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Đi qua từng số trong danh</text>
<text x="78" y="338.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">sách.</text>
