id: 01-pain
status: draft
format: portrait
series: "Cross-border meetings · #1"
link: ~
slides:
  - layout: cover
    emoji: "🌏"
    eyebrow: "Meetings across Asia"
    title: "Finding **one time** for 10 people in Vietnam, India and South Korea"
    subtitle: "Only a few hours apart, so it should be easy. But the bigger the group, the harder it is to find a slot **everyone** can make."
    badge: "Swipe through 👉"

  - layout: chat
    title: "Sound familiar?"
    group: "Regional sync 🌏"
    messages:
      - {from: "Linh (Vietnam)", text: "Shall we do 15:00?"}
      - {from: "Min-jun (South Korea)", text: "15:00 in Vietnam is 17:00 for us"}
      - {from: "Arjun (India)", text: "That's 13:30 here. India has a 30-minute offset, let me recalculate"}
      - {from: "Ha (manager)", text: "I'm in meetings all Tuesday and Thursday morning"}
      - {me: true, text: "Hold on, there are more people to fit in…"}
    note: "Illustrative chat, not a real conversation."

  - layout: table
    title: "A 09:00–18:00 day in each country, in Vietnam time"
    columns: ["Country", "Working hours (Vietnam time)"]
    rows:
      - ["Vietnam", "09:00 – 18:00"]
      - ["India", "10:30 – 19:30"]
      - ["South Korea", "07:00 – 16:00"]
      - [{text: "All three working", tone: ok}, {text: "10:30 – 16:00", tone: ok}]
    style: app
    note: "All three overlap 5.5 hours a day (12:30–18:00 South Korea, 09:00–14:30 India), calendars assumed empty."

  - layout: stat
    eyebrow: "Then the group grows"
    value: "~14%"
    label: "chance that a week holds a 60-minute slot where all 10 people are free"
    caption: "A simple simulation, with everyone busy about 30% of their working time. With 3 people the same busyness almost always leaves a slot."

  - layout: stat
    eyebrow: "Even inside one department"
    value: "~7%"
    label: "chance of a 60-minute slot where all 10 are free, even in the same department and time zone"
    caption: "Simulation: 2 managers are twice as busy (about 60% of working time), the other 8 about 30%. With no one busier it is about 28%; spread over 3 countries, about 3%."

  - layout: pains
    title: "And then there is…"
    items:
      - {emoji: "🗓️", text: "**Managers** are booked in different slots, each on their own pattern"}
      - {emoji: "🎌", text: "**Public holidays** differ: Tet, Seollal, Diwali"}
      - {emoji: "🔢", text: "India's **30-minute offset** makes hand conversion error-prone"}
      - {emoji: "👀", text: "Calendars **outside your organisation** are usually not visible"}
      - {emoji: "🌙", text: "No perfect slot: **who takes the bad hour?**"}

  - layout: poll
    eyebrow: "Quick question"
    question: "How does your team pick a time across time zones?"
    options:
      - "Whoever is most flexible adapts"
      - "We rotate the inconvenient hour"
      - "A scheduling tool"
      - "Async: record it and share"

  - layout: cta
    emoji: "💬"
    title: "I am prototyping a small tool for this"
    text: "For now it only reads calendars of people in the same organisation, and it is not released. I would like to hear how you handle it first."
    show_link: false

platforms:
  facebook:
    caption: |
      Vietnam, India and South Korea are only a few hours apart, yet finding a time that suits everyone is still hard 🌏

      Working 09:00–18:00, the three countries overlap for 5.5 hours a day. Roomy, right? But with 10 people, each busy about 30% of their working time, my simple simulation found a 60-minute slot where everyone is free in only about 14% of weeks (with 3 people, almost always).

      Add a few managers, booked in different slots, and even 10 people in the same department and time zone have a 60-minute slot where all are free in only about 7% of weeks (about 28% if no one is busier), and about 3% if those 10 are spread over 3 countries as above.

      Then add public holidays that differ by country, India's 30-minute offset that makes hand conversion error-prone, and calendars outside your organisation that are usually not visible.

      (That is a simulation with random calendars, not a real team.)

      I am prototyping a small tool for this, but for now it only reads calendars of people in the same organisation and it is not released. I would rather hear how you handle it first. How does your team pick a time across time zones? Answer A / B / C / D in the comments 👇
    first_comment: |
      A. Whoever is most flexible adapts · B. We rotate the inconvenient hour · C. A scheduling tool · D. Async: record it and share
    hashtags: [remotework, timezones, teamwork, productivity, scheduling]
