# Mutation manifest — see scripts/mutation_check.py
#
# A passing test proves nothing on its own. These break each rule of the figure toolkit in turn
# and require the named test to fail. A mutation that SURVIVES means the test guards nothing.

target: scripts/figures/cli.py
note: 'The build and the check are the only things between a spec and a stored figure: a stale figure, a figure for a lesson that does not exist, or one a phone cannot read must not get through.'
mutations:
- label: a stored figure that is not what the spec draws passes the check
  find: 'elif stored.read_bytes() != markup.encode("utf-8"):'
  replace: 'elif False:'
  test: tests.test_figures.CliTests.test_a_figure_that_is_not_what_the_spec_draws_fails_the_check
- label: a stale editor file beside the spec passes the check
  find: 'if beside.is_file() and beside.read_bytes() != make(spec).encode("utf-8"):'
  replace: 'if False:'
  test: tests.test_figures.CliTests.test_an_editor_file_beside_the_spec_must_not_go_stale
- label: a figure is built for a lesson that does not exist
  find: ' or not (LESSONS / spec["id"]).is_dir():'
  replace: ':'
  test: tests.test_figures.CliTests.test_build_refuses_a_spec_without_a_lesson_and_an_invalid_spec
- label: a figure that fails its rules is written anyway
  find: "        if not problems:\n            changed"
  replace: "        if True:\n            changed"
  test: tests.test_figures.CliTests.test_a_figure_with_text_too_small_for_a_phone_is_never_written
- label: a missing stored figure is not reported
  find: 'if not stored.is_file():'
  replace: 'if False:'
  test: tests.test_figures.CliTests.test_build_writes_the_figure_and_check_then_passes
- label: the file is rewritten even when nothing changed
  find: 'if path.is_file() and path.read_bytes() == content.encode("utf-8"):'
  replace: 'if False:'
  test: tests.test_figures.CliTests.test_build_writes_the_figure_and_check_then_passes
- label: a scale of nan, 0.1 or 1e9 is accepted
  find: '    if not math.isfinite(value) or not MIN_SCALE <= value <= MAX_SCALE:'
  replace: '    if False:'
  test: tests.test_figures.RobustnessTests.test_a_scale_that_would_draw_garbage_is_refused
- label: an unwritable output path raises a traceback
  find: '    except OSError as exc:                                     # an unwritable'
  replace: '    except ZeroDivisionError as exc:                           # an unwritable'
  test: tests.test_figures.RobustnessTests.test_a_file_that_cannot_be_written_is_a_sentence_not_a_traceback
- label: a bug while drawing the preview is reported as a missing browser
  find: "    except browser.Unavailable as exc:                         # Playwright or Chromium missing: say how to get it\n        print(f\"cannot draw the preview"
  replace: "    except Exception as exc:                                   # Playwright or Chromium missing: say how to get it\n        print(f\"cannot draw the preview"
  test: tests.test_figures.RobustnessTests.test_only_a_missing_browser_gets_the_install_hint_and_a_real_bug_surfaces
- label: a missing browser while exporting slides is not reported
  find: "    except browser.Unavailable as exc:                         # Playwright or Chromium missing: say how to get it\n        print(f\"cannot draw the slides"
  replace: "    except ZeroDivisionError as exc:                           # Playwright or Chromium missing: say how to get it\n        print(f\"cannot draw the slides"
  test: tests.test_figures.RobustnessTests.test_only_a_missing_browser_gets_the_install_hint_and_a_real_bug_surfaces
- label: a missing browser in the text check is not reported
  find: "            except browser.Unavailable as exc:\n                print(f\"cannot measure the text"
  replace: "            except ZeroDivisionError as exc:\n                print(f\"cannot measure the text"
  test: tests.test_figures.RobustnessTests.test_the_text_check_without_a_browser_says_so
- label: a tampered icon set does not stop a build
  find: "    if broken:                                               # a tampered icon file is never drawn into a stored figure\n        print("
  replace: "    if False:                                                # a tampered icon file is never drawn into a stored figure\n        print("
  test: tests.test_figures.RobustnessTests.test_a_tampered_icon_set_never_overwrites_a_stored_figure
- label: a tampered icon set does not stop a Facebook export
  find: "    if icon_problems:\n        print("
  replace: "    if False:\n        print("
  test: tests.test_figures.RobustnessTests.test_a_tampered_icon_set_stops_a_build_and_an_export_before_anything_is_written
- label: the check goes on to draw from a broken icon set
  find: '    if found:                                                # a figure cannot be drawn from a broken icon set: say so, do not try'
  replace: '    if False:                                                # a figure cannot be drawn from a broken icon set: say so, do not try'
  test: tests.test_figures.RobustnessTests.test_check_with_a_structurally_broken_icon_file_reports_it_instead_of_raising
- label: editor files are looked for in the store folder instead of beside the given spec
  find: beside = path.parent / f"{spec['id']}{suffix}"
  replace: beside = SPEC_DIR / f"{spec['id']}{suffix}"
  test: tests.test_figures.RobustnessTests.test_editor_files_are_looked_for_beside_the_spec_that_was_given
- label: a build goes on although two specs claim one id
  find: '    if clashes:                                               # two specs for one figure'
  replace: '    if False:                                                 # two specs for one figure'
  test: tests.test_figures.RobustnessTests.test_two_specs_for_one_figure_are_refused_before_anything_is_written
- label: the check does not look for two specs with one id
  find: '    found.extend(duplicate_ids(loaded))'
  replace: '    found.extend([])'
  test: tests.test_figures.RobustnessTests.test_two_specs_for_one_figure_are_refused_before_anything_is_written
