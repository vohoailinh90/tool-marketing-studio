<svg xmlns="http://www.w3.org/2000/svg" width="320" height="1795" viewBox="0 0 320 1795" role="img" aria-labelledby="title desc">
<title id="title">Bảng tra cơ sở dữ liệu trên đám mây</title>
<desc id="desc">Bốn khung, theo bảng so sánh của Azure Architecture Center. Khung một, cơ sở dữ liệu quan hệ: có quản lý là Amazon RDS, Azure SQL Database và Azure Database for MySQL, PostgreSQL, Google Cloud SQL; serverless là Aurora Serverless và Azure SQL Database serverless; mở rộng ngang là Cloud Spanner. Khung hai: khóa–giá trị và tài liệu là DynamoDB và Cosmos DB for NoSQL; tài liệu kiểu MongoDB là Amazon DocumentDB và Azure DocumentDB; cột rộng kiểu Cassandra là Amazon Keyspaces và Cosmos DB for Apache Cassandra. Khung ba: đồ thị là Neptune và Cosmos DB for Apache Gremlin; bộ nhớ đệm là ElastiCache, Memorystore và Azure Managed Redis. Khung bốn, bốn điều bảng tra không nói.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs>
