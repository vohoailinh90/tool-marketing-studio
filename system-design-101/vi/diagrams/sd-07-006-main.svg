<svg xmlns="http://www.w3.org/2000/svg" width="320" height="981" viewBox="0 0 320 981" role="img" aria-labelledby="title desc">
<title id="title">Bốn cách quét mã QR để trả tiền</title>
<desc id="desc">Ba khung. Khung một, ai trình mã QR: người mua trình mã thì người bán quét và ghi nợ trực tiếp tài khoản người mua; người bán trình mã thì người mua quét và cho phép ghi có trực tiếp từ tài khoản của mình. Khung hai, mã động hay tĩnh: mã động được tạo lúc trình hoặc tự đổi sau vài giây nên chứa được số tiền, loại giao dịch; mã tĩnh tạo một lần dùng mọi nơi, thường chỉ chứa thông tin tài khoản. Khung ba, hai nhân hai ra bốn cách: người mua trình mã tĩnh, người mua trình mã động, người bán trình mã tĩnh, người bán trình mã động.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs>
<rect width="320" height="981" fill="#f8fafc"/>
<g font-family="DejaVu Sans, Arial, sans-serif" fill="#0f172a">
<text x="16" y="34" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">Bốn cách quét mã QR để</text>
<text x="16" y="58" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">trả tiền</text>
<text x="16" y="84.2" font-size="15" fill="#475569" font-weight="normal" text-anchor="start">Hai câu hỏi, mỗi câu hai đáp án,</text>
<text x="16" y="103.8" font-size="15" fill="#475569" font-weight="normal" text-anchor="start">nhân lại thành bốn.</text>
<rect x="8" y="123" width="304" height="245" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="151.2" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Ai trình mã?</text>
<rect x="20" y="168" width="280" height="87" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="50" cy="211.5" r="18" fill="#1d4ed8"/><g transform="translate(39.2 200.7) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></g>
<text x="78" y="194.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Người mua trình mã</text>
<text x="78" y="218.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Người bán quét và ghi nợ</text>
<text x="78" y="237.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">trực tiếp tài khoản bạn.</text>
<rect x="20" y="269" width="280" height="87" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="50" cy="312.5" r="18" fill="#1d4ed8"/><g transform="translate(39.2 301.7) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 21v-5a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v5"/><path d="M17.774 10.31a1.12 1.12 0 0 0-1.549 0 2.5 2.5 0 0 1-3.451 0 1.12 1.12 0 0 0-1.548 0 2.5 2.5 0 0 1-3.452 0 1.12 1.12 0 0 0-1.549 0 2.5 2.5 0 0 1-3.77-3.248l2.889-4.184A2 2 0 0 1 7 2h10a2 2 0 0 1 1.653.873l2.895 4.192a2.5 2.5 0 0 1-3.774 3.244"/><path d="M4 10.95V19a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8.05"/></g>
<text x="78" y="295.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Người bán trình mã</text>
<text x="78" y="319.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Bạn quét và cho phép ghi</text>
<text x="78" y="338.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">có từ tài khoản.</text>
<rect x="8" y="380" width="304" height="265" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="408.2" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Mã động hay tĩnh?</text>
<rect x="20" y="425" width="280" height="107" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
<circle cx="50" cy="478.5" r="18" fill="#0f766e"/><g transform="translate(39.2 467.7) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></g>
<text x="78" y="451.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Mã động</text>
<text x="78" y="475.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Tạo lúc trình, hoặc tự đổi</text>
<text x="78" y="494.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">sau vài giây. Chứa được số</text>
<text x="78" y="514.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">tiền.</text>
<rect x="20" y="546" width="280" height="87" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
<circle cx="50" cy="589.5" r="18" fill="#0f766e"/><g transform="translate(39.2 578.7) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect height="11" rx="2" ry="2" width="18" x="3" y="11"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></g>
<text x="78" y="572.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Mã tĩnh</text>
<text x="78" y="596.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Tạo một lần, dùng mọi nơi.</text>
<text x="78" y="615.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Thường chỉ có tài khoản.</text>
<rect x="8" y="657" width="304" height="316" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="685.1" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">2 × 2 = 4 cách</text>
<rect x="20" y="702" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="725" r="11" fill="#16a34a"/>
<polyline points="37.9,725.4 41.7,729.4 48.5,721" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="728.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Người mua trình mã, mã</text>
<text x="64" y="747.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">tĩnh.</text>
<rect x="20" y="773" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="796" r="11" fill="#16a34a"/>
<polyline points="37.9,796.4 41.7,800.4 48.5,792" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="799.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Người mua trình mã, mã</text>
<text x="64" y="818.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">động.</text>
<rect x="20" y="844" width="280" height="46" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="867" r="11" fill="#16a34a"/>
<polyline points="37.9,867.4 41.7,871.4 48.5,863" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="870.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Người bán trình mã, mã tĩnh.</text>
<rect x="20" y="898" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="921" r="11" fill="#16a34a"/>
<polyline points="37.9,921.4 41.7,925.4 48.5,917" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="924.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Người bán trình mã, mã</text>
<text x="64" y="943.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">động.</text>
</g>
</svg>
