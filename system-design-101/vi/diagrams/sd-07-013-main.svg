<circle cx="43" cy="427" r="11" fill="#16a34a"/>
<polyline points="37.9,427.4 41.7,431.4 48.5,423" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="430.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Các hệ thống thanh toán.</text>
