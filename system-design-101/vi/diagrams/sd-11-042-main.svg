<rect x="20" y="1220" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="1243" r="11" fill="#16a34a"/>
<polyline points="37.9,1243.4 41.7,1247.4 48.5,1239" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="1246.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Mở rộng: 104 lần. Kiến trúc:</text>
<text x="64" y="1265.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">70.</text>
<rect x="20" y="1291" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="1314" r="11" fill="#16a34a"/>
<polyline points="37.9,1314.4 41.7,1318.4 48.5,1310" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="1317.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Bảo trì, tài liệu, di chuyển: 0</text>
<text x="64" y="1336.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">lần.</text>
<rect x="20" y="1362" width="280" height="63" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="43" cy="1385" r="11" fill="#16a34a"/>
<polyline points="37.9,1385.4 41.7,1389.4 48.5,1381" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="1388.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Yêu cầu, kiểm thử, trải</text>
<text x="64" y="1407.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">nghiệm: 1 lần.</text>
</g>
</svg>
