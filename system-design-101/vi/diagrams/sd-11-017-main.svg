<svg xmlns="http://www.w3.org/2000/svg" width="360" height="420" viewBox="0 0 360 420" role="img" aria-labelledby="title desc">
<title id="title">Các khối xây dựng của hệ thống</title>
<desc id="desc">Đường vào: DNS → load balancer / gateway: Ứng dụng xử lý nghiệp vụ; Dữ liệu và công việc: DB • object storage • cache: Queue • worker • scheduler; Vận hành: Discovery • replication/sharding: Metrics • log • trace. Các khung là ý chính để đối chiếu, không nhất thiết là các bước tuần tự.</desc>
<rect width="360" height="420" fill="#f8fafc"/>
<g font-family="DejaVu Sans, sans-serif" fill="#0f172a">
<text x="20" y="28" font-size="18" font-weight="bold">sd-11-017 · Nhìn hình trước</text>
<rect x="12" y="48" width="336" height="102" rx="12" fill="#e0f2fe" stroke="#64748b"/>
<text x="24" y="75" font-size="18" font-weight="bold">Đường vào</text>
<text x="24" y="104" font-size="18">DNS → load balancer / gateway</text>
<text x="24" y="130" font-size="18">Ứng dụng xử lý nghiệp vụ</text>
<rect x="12" y="162" width="336" height="102" rx="12" fill="#dcfce7" stroke="#64748b"/>
<text x="24" y="189" font-size="18" font-weight="bold">Dữ liệu và công việc</text>
<text x="24" y="218" font-size="18">DB • object storage • cache</text>
<text x="24" y="244" font-size="18">Queue • worker • scheduler</text>
<rect x="12" y="276" width="336" height="102" rx="12" fill="#fef3c7" stroke="#64748b"/>
<text x="24" y="303" font-size="18" font-weight="bold">Vận hành</text>
<text x="24" y="332" font-size="18">Discovery • replication/sharding</text>
<text x="24" y="358" font-size="18">Metrics • log • trace</text>
</g>
</svg>
