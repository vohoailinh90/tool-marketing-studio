<text x="46" y="683.5" font-size="16" fill="#ffffff" font-weight="bold" text-anchor="middle">2</text>
<text x="70" y="678.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">5 · Xác thực và kiểm</text>
<text x="70" y="698.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">thử</text>
<text x="70" y="722.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Đăng nhập an toàn; ba ca</text>
<text x="70" y="741.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">kiểm thử.</text>
