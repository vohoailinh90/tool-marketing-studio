<svg xmlns="http://www.w3.org/2000/svg" width="320" height="1323" viewBox="0 0 320 1323" role="img" aria-labelledby="title desc">
<title id="title">Đổi 100 đô la thành 88 euro</title>
<desc id="desc">Ba khung. Khung một và hai, sáu bước: Bob gửi 100 đô la qua PayPal từ ngân hàng B; PayPal gửi 100 đô la tới tài khoản đô la của nó ở ngân hàng E, nơi đổi tiền; 100 đô la được bán vào quỹ tiền của ngân hàng E; quỹ trả 88 euro vào tài khoản euro của PayPal ở ngân hàng E; 88 euro về tài khoản euro của PayPal ở ngân hàng P2; PayPal trả 88 euro vào tài khoản euro của Alice ở ngân hàng A. Khung ba, thị trường ngoại hối có ba tầng: tầng bán lẻ, tầng bán buôn và các bên ở tầng trên cùng; khi quỹ cần thêm euro thì đi lên tầng trên.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs>
<rect width="320" height="1323" fill="#f8fafc"/>
<g font-family="DejaVu Sans, Arial, sans-serif" fill="#0f172a">
<text x="16" y="34" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">Đổi 100 đô la thành 88</text>
<text x="16" y="58" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">euro</text>
<text x="16" y="84.2" font-size="15" fill="#475569" font-weight="normal" text-anchor="start">PayPal đổi tiền qua ngân hàng ngoại</text>
<text x="16" y="103.8" font-size="15" fill="#475569" font-weight="normal" text-anchor="start">hối, thị trường có ba tầng.</text>
<rect x="8" y="123" width="304" height="362" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="151.2" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Bước 1 đến 3: đô la đi</text>
<rect x="20" y="168" width="280" height="87" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="46" cy="194" r="14" fill="#1d4ed8"/>
<text x="46" y="199.5" font-size="16" fill="#ffffff" font-weight="bold" text-anchor="middle">1</text>
<text x="70" y="194.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Bob gửi 100 đô la</text>
<text x="70" y="218.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Qua PayPal, vào ngân hàng</text>
<text x="70" y="237.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">P1.</text>
<rect x="20" y="277" width="280" height="87" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="46" cy="303" r="14" fill="#1d4ed8"/>
<text x="46" y="308.5" font-size="16" fill="#ffffff" font-weight="bold" text-anchor="middle">2</text>
<text x="70" y="303.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Sang ngân hàng E</text>
<text x="70" y="327.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">PayPal gửi 100 đô la tới</text>
<text x="70" y="346.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">ngân hàng E.</text>
<polyline points="46,257 46,275" fill="none" stroke="#334155" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="20" y="386" width="280" height="87" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="46" cy="412" r="14" fill="#1d4ed8"/>
<text x="46" y="417.5" font-size="16" fill="#ffffff" font-weight="bold" text-anchor="middle">3</text>
<text x="70" y="412.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Bán đô la</text>
<text x="70" y="436.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Bán vào quỹ tiền của ngân</text>
<text x="70" y="455.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">hàng E.</text>
<polyline points="46,366 46,384" fill="none" stroke="#334155" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="8" y="497" width="304" height="362" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="525.1" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Bước 4 đến 6: euro về</text>
<rect x="20" y="542" width="280" height="87" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
<circle cx="46" cy="568" r="14" fill="#0f766e"/>
<text x="46" y="573.5" font-size="16" fill="#ffffff" font-weight="bold" text-anchor="middle">1</text>
<text x="70" y="568.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Nhận euro</text>
<text x="70" y="592.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Quỹ trả 88 euro cho PayPal</text>
<text x="70" y="611.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">ở ngân hàng E.</text>
<rect x="20" y="651" width="280" height="87" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
<circle cx="46" cy="677" r="14" fill="#0f766e"/>
<text x="46" y="682.5" font-size="16" fill="#ffffff" font-weight="bold" text-anchor="middle">2</text>
<text x="70" y="677.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Về ngân hàng P2</text>
<text x="70" y="701.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">88 euro vào tài khoản euro</text>
<text x="70" y="720.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">ở P2.</text>
<polyline points="46,631 46,649" fill="none" stroke="#334155" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="20" y="760" width="280" height="87" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
<circle cx="46" cy="786" r="14" fill="#0f766e"/>
<text x="46" y="791.5" font-size="16" fill="#ffffff" font-weight="bold" text-anchor="middle">3</text>
<text x="70" y="786.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Trả Alice</text>
<text x="70" y="810.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">88 euro vào tài khoản của</text>
<text x="70" y="829.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Alice.</text>
<polyline points="46,740 46,758" fill="none" stroke="#334155" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="8" y="871" width="304" height="444" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="899.1" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Thị trường ngoại hối có ba</text>
<text x="20" y="921.2" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">tầng</text>
<rect x="20" y="938" width="280" height="87" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
<circle cx="50" cy="981.5" r="18" fill="#b45309"/><g transform="translate(39.2 970.7) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 21v-5a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v5"/><path d="M17.774 10.31a1.12 1.12 0 0 0-1.549 0 2.5 2.5 0 0 1-3.451 0 1.12 1.12 0 0 0-1.548 0 2.5 2.5 0 0 1-3.452 0 1.12 1.12 0 0 0-1.549 0 2.5 2.5 0 0 1-3.77-3.248l2.889-4.184A2 2 0 0 1 7 2h10a2 2 0 0 1 1.653.873l2.895 4.192a2.5 2.5 0 0 1-3.774 3.244"/><path d="M4 10.95V19a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8.05"/></g>
<text x="78" y="964.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Tầng bán lẻ</text>
<text x="78" y="988.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Có quỹ tiền; PayPal thường</text>
<text x="78" y="1007.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">mua trước ngoại tệ.</text>
<rect x="20" y="1057" width="280" height="107" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
<circle cx="50" cy="1110.5" r="18" fill="#b45309"/><g transform="translate(39.2 1099.7) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.97 12.92A2 2 0 0 0 2 14.63v3.24a2 2 0 0 0 .97 1.71l3 1.8a2 2 0 0 0 2.06 0L12 19v-5.5l-5-3-4.03 2.42Z"/><path d="m7 16.5-4.74-2.85"/><path d="m7 16.5 5-3"/><path d="M7 16.5v5.17"/><path d="M12 13.5V19l3.97 2.38a2 2 0 0 0 2.06 0l3-1.8a2 2 0 0 0 .97-1.71v-3.24a2 2 0 0 0-.97-1.71L17 10.5l-5 3Z"/><path d="m17 16.5-5-3"/><path d="m17 16.5 4.74-2.85"/><path d="M17 16.5v5.17"/><path d="M7.97 4.42A2 2 0 0 0 7 6.13v4.37l5 3 5-3V6.13a2 2 0 0 0-.97-1.71l-3-1.8a2 2 0 0 0-2.06 0l-3 1.8Z"/><path d="M12 8 7.26 5.15"/><path d="m12 8 4.74-2.85"/><path d="M12 13.5V8"/></g>
<text x="78" y="1083.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Tầng bán buôn</text>
<text x="78" y="1107.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Ngân hàng đầu tư, ngân</text>
<text x="78" y="1126.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">hàng thương mại, nhà</text>
<text x="78" y="1146.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">cung cấp ngoại hối.</text>
<rect x="20" y="1196" width="280" height="107" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
<circle cx="50" cy="1249.5" r="18" fill="#b45309"/><g transform="translate(39.2 1238.7) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></g>
<text x="78" y="1222.8" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">Tầng trên cùng</text>
<text x="78" y="1246.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">Ngân hàng thương mại đa</text>
<text x="78" y="1265.8" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">quốc gia giữ nhiều loại</text>
<text x="78" y="1285.2" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="start">tiền.</text>
<polyline points="160,1027 160,1055" fill="none" stroke="#334155" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="160,1166 160,1194" fill="none" stroke="#334155" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
</g>
</svg>
