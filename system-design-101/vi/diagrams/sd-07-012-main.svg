<svg xmlns="http://www.w3.org/2000/svg" width="320" height="1160" viewBox="0 0 320 1160" role="img" aria-labelledby="title desc">
<title id="title">Từ nút Mua tới sổ cái</title>
<desc id="desc">Ba khung. Khung một, từ nút Mua tới PSP: khi khách bấm Mua, dịch vụ thanh toán nhận sự kiện thanh toán, gọi bộ thực thi thanh toán cho từng lệnh, và bộ thực thi gọi PSP bên ngoài để hoàn tất thanh toán bằng thẻ. Khung hai, ghi sổ: dịch vụ thanh toán cập nhật ví để ghi số tiền của người bán, rồi gọi sổ cái ghi thêm một dòng. Khung ba, điều cần nhớ: mỗi bước đều lưu vào cơ sở dữ liệu, một lần mua nhiều người bán thành nhiều lệnh, và mỗi đêm PSP hoặc ngân hàng gửi tệp quyết toán.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs>
